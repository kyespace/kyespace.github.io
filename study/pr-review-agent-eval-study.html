203.09095 · AUGER — https://arxiv.org/pdf/2208.08014 CommentFinder — https://2022.esec-fse.org/details/fse-2022-research-papers/41/CommentFinder-A-Simpler-Faster-More-Accurate-Code-Review-Comments-Recommendation (초록 수준) Hellendoorn 2021 — https://vhellendoorn.github.io/fse2021-ivr.pdf · Zhou 2023 — https://arxiv.org/pdf/2303.07221 LLaMA-Reviewer — https://arxiv.org/pdf/2308.11148 · Guo 2024 — https://arxiv.org/pdf/2309.08221 · Pornprasit 2024 — https://export.arxiv.org/pdf/2402.00905 Tufano 2024 TSE — https://arxiv.org/pdf/2401.05136 · Liu 2025 MSR — https://arxiv.org/pdf/2502.02757 · DeepCRCEval — https://arxiv.org/pdf/2412.18291 Tufano & Bavota 2025 — https://arxiv.org/pdf/2503.09510 · Heumüller & Ortmeier 2025 — https://arxiv.org/pdf/2508.18003 · Yang 외 TOSEM — https://arxiv.org/pdf/2405.18216 (초록) Tufano 2025 ICSE — https://arxiv.org/pdf/2411.11401 D-ACT — https://github.com/awsm-research/D-ACT-Replication-Package · 인용 수: https://api.openalex.org/works (2026-11-19) "}, {"id": "05", "dir": "05-최신-벤치마크-논문", "title": "05. 최신 리뷰 에이전트 벤치마크 논문 (2025~2026)", "level": "심화", "html": "<h1>05. 최신 리뷰 에이전트 벤치마크 논문 (2025~2026)<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-19<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-20<\/li>\n<li><strong>수준<\/strong>: 심화<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A5-recent-review-benchmarks.md\">wave-1 A5<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-2-web-W2d-reviewbench-martian-provenance.md\">wave-2 W2d (ReviewBench 출처)<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-3-web-W3-crbugbench-pace-recent.md\">wave-3 W3<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-2-web-W2c-deep-reads.md\">wave-2 W2c<\/a><\/li>\n<\/ul>\n<h2>이 장에서 답하는 질문<\/h2>\n<p>지금 \"리뷰 에이전트를 어떻게 채점하나\"에 대해 나온 벤치마크들은 각각 무엇을 정답으로 삼고, 어떻게 맞췄는지 판정하고, 무엇을 재나? 각 방식의 약점은 무엇인가?<\/p>\n<blockquote>\n<p><strong>\"높이 평가되는\"의 기준<\/strong>: 2025~2026 논문은 인용이 쌓이기 전이다. 그래서 (1) 동료 심사 학회 게재, (2) 큰 회사·연구소가 공개하고 다른 연구가 비교 대상으로 쓰는지, (3) 데이터·코드 공개 여부를 함께 봤다. 등급 A는 게재 확인, D는 프리프린트·벤더다.<\/p>\n<p><strong>기존 가이드 정정<\/strong>: <a href=\"PR-리뷰-에이전트-채점-가이드.md\">채점 가이드<\/a> 10장은 ReviewBench 발표를 \"2026-01\"로 적었는데, 실제 게시일은 <strong>2026-10-05<\/strong>다(저장소 생성 2026-09-04). 날짜가 들어간 블로그 URL은 아무 날짜를 넣어도 같은 글로 리다이렉트된다. 또 \"리더보드 1위는 Copilot\"은 <strong>출시 당일 기준<\/strong>이고, 2026-11-19 현재는 아니다(아래).<\/p>\n<\/blockquote>\n<hr />\n<h2>1. 정답을 만드는 네 가지 방식<\/h2>\n<p>벤치마크를 가르는 가장 큰 기준은 <strong>정답이 어디서 왔나<\/strong>다.<\/p>\n<table>\n<thead>\n<tr>\n<th>방식<\/th>\n<th>쉬운 설명<\/th>\n<th>장점<\/th>\n<th>약점<\/th>\n<th>대표<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 사람 리뷰 코멘트<\/td>\n<td>실제 PR에 달린 사람 코멘트를 정답으로<\/td>\n<td>현실적이다<\/td>\n<td>사람이 놓친 것은 빠진다. 스타일 지적이 다수다(01장). 노이즈가 많다(04장)<\/td>\n<td>SWE-PRBench, ContextCRBench, CodeFuse-CR-Bench<\/td>\n<\/tr>\n<tr>\n<td>② LLM이 찾고 사람이 검증<\/td>\n<td>여러 LLM·도구가 후보를 내고 사람이 참/거짓 판정<\/td>\n<td>정답 범위가 넓다<\/td>\n<td><strong>정답을 만든 모델이 평가받으면 유리하다<\/strong>(생산자 편향)<\/td>\n<td>ReviewBench, AACR-Bench, MCR-Bench<\/td>\n<\/tr>\n<tr>\n<td>③ 실제 버그를 거슬러 찾기<\/td>\n<td>나중에 고쳐진 버그 → 그 버그를 만든 PR을 찾아(SZZ) 정답으로<\/td>\n<td>\"진짜 버그\"라는 근거가 있다<\/td>\n<td>버그만 다룬다. 설계·가독성은 빠진다. SZZ에 오차가 있다<\/td>\n<td>CRBugBench, CR-Bench, SWR-Bench, Greptile<\/td>\n<\/tr>\n<tr>\n<td>④ 실행 가능한 테스트<\/td>\n<td>사람 코멘트를 숨겨진 테스트로 바꾸고, 리뷰대로 고친 코드가 통과하나 본다<\/td>\n<td>LLM 판정에 기대지 않는다<\/td>\n<td>고치는 에이전트의 실력이 섞인다. 문서·설계 지적은 테스트로 못 만든다<\/td>\n<td>c-CRAB<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:700px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 780 372\" role=\"img\" aria-label=\"정답지를 만드는 네 가지 방식\" data-minw=\"700\"><title>정답지를 만드는 네 가지 방식<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"780\" height=\"372\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">정답지를 만드는 네 가지 방식 — 정답이 어디서 왔나가 승자를 정한다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">05장 1절<\/text><rect x=\"20\" y=\"62\" width=\"176\" height=\"292\" rx=\"12\" class=\"f-s2\"/><text x=\"32.0\" y=\"86.0\" class=\"t-b\" font-size=\"12.5\">① 사람 리뷰 코멘트<\/text><rect x=\"32\" y=\"102\" width=\"152\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"108.0\" y=\"125.0\" class=\"t-sm\" text-anchor=\"middle\">실제 PR<\/text><line class=\"arrow\" x1=\"108.0\" y1=\"140.0\" x2=\"108.0\" y2=\"151.0\"/><path class=\"ahead\" d=\"M108.0,158.0L111.5,151.0L104.5,151.0z\"/><rect x=\"32\" y=\"160\" width=\"152\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"108.0\" y=\"183.0\" class=\"t-sm\" text-anchor=\"middle\">사람 코멘트<\/text><line class=\"arrow\" x1=\"108.0\" y1=\"198.0\" x2=\"108.0\" y2=\"209.0\"/><path class=\"ahead\" d=\"M108.0,216.0L111.5,209.0L104.5,209.0z\"/><rect x=\"32\" y=\"218\" width=\"152\" height=\"36\" rx=\"8\" class=\"node-acc\"/><text x=\"108.0\" y=\"241.0\" class=\"t-sm\" text-anchor=\"middle\">정답<\/text><rect x=\"32\" y=\"272\" width=\"152\" height=\"44\" rx=\"8\" class=\"f-warn\"/><text x=\"108.0\" y=\"290.0\" class=\"t-mut\" text-anchor=\"middle\">약점<\/text><text x=\"108.0\" y=\"307.0\" class=\"t-sm\" text-anchor=\"middle\" font-size=\"11.5\">사람이 놓친 것은 빠진다<\/text><text x=\"108.0\" y=\"338.0\" class=\"t-mut\" text-anchor=\"middle\">SWE-PRBench · ContextCRBench<\/text><rect x=\"208\" y=\"62\" width=\"176\" height=\"292\" rx=\"12\" class=\"f-s2\"/><text x=\"220.0\" y=\"86.0\" class=\"t-b\" font-size=\"12.5\">② LLM 후보 + 사람 검증<\/text><rect x=\"220\" y=\"102\" width=\"152\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"296.0\" y=\"125.0\" class=\"t-sm\" text-anchor=\"middle\">여러 LLM·도구 후보<\/text><line class=\"arrow\" x1=\"296.0\" y1=\"140.0\" x2=\"296.0\" y2=\"151.0\"/><path class=\"ahead\" d=\"M296.0,158.0L299.5,151.0L292.5,151.0z\"/><rect x=\"220\" y=\"160\" width=\"152\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"296.0\" y=\"183.0\" class=\"t-sm\" text-anchor=\"middle\">사람이 참/거짓<\/text><line class=\"arrow\" x1=\"296.0\" y1=\"198.0\" x2=\"296.0\" y2=\"209.0\"/><path class=\"ahead\" d=\"M296.0,216.0L299.5,209.0L292.5,209.0z\"/><rect x=\"220\" y=\"218\" width=\"152\" height=\"36\" rx=\"8\" class=\"node-acc\"/><text x=\"296.0\" y=\"241.0\" class=\"t-sm\" text-anchor=\"middle\">정답 (+함정)<\/text><rect x=\"220\" y=\"272\" width=\"152\" height=\"44\" rx=\"8\" class=\"f-warn\"/><text x=\"296.0\" y=\"290.0\" class=\"t-mut\" text-anchor=\"middle\">약점<\/text><text x=\"296.0\" y=\"307.0\" class=\"t-sm\" text-anchor=\"middle\" font-size=\"11.5\">만든 모델이 평가받으면 유리<\/text><text x=\"296.0\" y=\"338.0\" class=\"t-mut\" text-anchor=\"middle\">ReviewBench · AACR · MCR<\/text><rect x=\"396\" y=\"62\" width=\"176\" height=\"292\" rx=\"12\" class=\"f-s2\"/><text x=\"408.0\" y=\"86.0\" class=\"t-b\" font-size=\"12.5\">③ 실제 버그 역추적<\/text><rect x=\"408\" y=\"102\" width=\"152\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"484.0\" y=\"125.0\" class=\"t-sm\" text-anchor=\"middle\">나중에 고친 버그<\/text><line class=\"arrow\" x1=\"484.0\" y1=\"140.0\" x2=\"484.0\" y2=\"151.0\"/><path class=\"ahead\" d=\"M484.0,158.0L487.5,151.0L480.5,151.0z\"/><rect x=\"408\" y=\"160\" width=\"152\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"484.0\" y=\"183.0\" class=\"t-sm\" text-anchor=\"middle\">SZZ로 원인 PR<\/text><line class=\"arrow\" x1=\"484.0\" y1=\"198.0\" x2=\"484.0\" y2=\"209.0\"/><path class=\"ahead\" d=\"M484.0,216.0L487.5,209.0L480.5,209.0z\"/><rect x=\"408\" y=\"218\" width=\"152\" height=\"36\" rx=\"8\" class=\"node-acc\"/><text x=\"484.0\" y=\"241.0\" class=\"t-sm\" text-anchor=\"middle\">정답<\/text><rect x=\"408\" y=\"272\" width=\"152\" height=\"44\" rx=\"8\" class=\"f-warn\"/><text x=\"484.0\" y=\"290.0\" class=\"t-mut\" text-anchor=\"middle\">약점<\/text><text x=\"484.0\" y=\"307.0\" class=\"t-sm\" text-anchor=\"middle\" font-size=\"11.5\">버그만 다룬다<\/text><text x=\"484.0\" y=\"338.0\" class=\"t-mut\" text-anchor=\"middle\">CRBugBench · CR-Bench · SWR<\/text><rect x=\"584\" y=\"62\" width=\"176\" height=\"292\" rx=\"12\" class=\"f-s2\"/><text x=\"596.0\" y=\"86.0\" class=\"t-b\" font-size=\"12.5\">④ 실행 테스트<\/text><rect x=\"596\" y=\"102\" width=\"152\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"672.0\" y=\"125.0\" class=\"t-sm\" text-anchor=\"middle\">사람 코멘트<\/text><line class=\"arrow\" x1=\"672.0\" y1=\"140.0\" x2=\"672.0\" y2=\"151.0\"/><path class=\"ahead\" d=\"M672.0,158.0L675.5,151.0L668.5,151.0z\"/><rect x=\"596\" y=\"160\" width=\"152\" height=\"36\" rx=\"8\" class=\"node\"/><text x=\"672.0\" y=\"183.0\" class=\"t-sm\" text-anchor=\"middle\">숨긴 테스트로 변환<\/text><line class=\"arrow\" x1=\"672.0\" y1=\"198.0\" x2=\"672.0\" y2=\"209.0\"/><path class=\"ahead\" d=\"M672.0,216.0L675.5,209.0L668.5,209.0z\"/><rect x=\"596\" y=\"218\" width=\"152\" height=\"36\" rx=\"8\" class=\"node-acc\"/><text x=\"672.0\" y=\"241.0\" class=\"t-sm\" text-anchor=\"middle\">고친 코드가 통과?<\/text><rect x=\"596\" y=\"272\" width=\"152\" height=\"44\" rx=\"8\" class=\"f-warn\"/><text x=\"672.0\" y=\"290.0\" class=\"t-mut\" text-anchor=\"middle\">약점<\/text><text x=\"672.0\" y=\"307.0\" class=\"t-sm\" text-anchor=\"middle\" font-size=\"11.5\">고치는 에이전트 실력이 섞임<\/text><text x=\"672.0\" y=\"338.0\" class=\"t-mut\" text-anchor=\"middle\">c-CRAB<\/text><\/svg><\/div><figcaption>그림 5-1. 정답지를 만드는 네 가지 방식과 각각의 약점<\/figcaption><\/figure>\n<p><strong>맞췄는지 판정하는 방식(매칭)<\/strong>은 거의 모두 <strong>LLM이 의미가 같은지 판정<\/strong>하는 쪽으로 모였다. BLEU 같은 문자열 유사도는 신뢰를 잃었다(02장). 예외는 c-CRAB(실행), CodeReviewQA(객관식), ContextCRBench(아직 ROUGE)다.<\/p>\n<hr />\n<h2>2. 벤치마크 비교표<\/h2>\n<table>\n<thead>\n<tr>\n<th>벤치마크<\/th>\n<th>만든 곳<\/th>\n<th>게재<\/th>\n<th>데이터<\/th>\n<th>정답 방식<\/th>\n<th>매칭<\/th>\n<th>주요 지표<\/th>\n<th>공개<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ReviewBench<\/strong><\/td>\n<td>GitHub<\/td>\n<td>회사 문서 (2026-10)<\/td>\n<td>PR 219개 (저장소 187, 19개 언어), 정답 4,549개<\/td>\n<td>②<\/td>\n<td>LLM, 같은 파일 안에서<\/td>\n<td>grounded / augmented P·R·F1, Fβ<\/td>\n<td>예 (MIT)<\/td>\n<\/tr>\n<tr>\n<td><strong>SWR-Bench<\/strong><\/td>\n<td>북경대<\/td>\n<td>PACMSE (FSE 2026)<\/td>\n<td>PR 1,000개 (변경 500 + 문제없음 500), Python 12개 저장소<\/td>\n<td>③ + LLM 추출, 사람 검증<\/td>\n<td>LLM 적중 판정<\/td>\n<td>P·R·F1<\/td>\n<td>불명확(논문 URL 오류)<\/td>\n<\/tr>\n<tr>\n<td><strong>CRBugBench<\/strong><\/td>\n<td>CMU·Microsoft<\/td>\n<td>프리프린트 (2026-10)<\/td>\n<td>공개 1,000 + 사내 800<\/td>\n<td>③ + 리뷰 스레드<\/td>\n<td>LLM 3개 다수결<\/td>\n<td><strong>recall@k<\/strong>만<\/td>\n<td>일부(재구성본 995개)<\/td>\n<\/tr>\n<tr>\n<td><strong>AACR-Bench<\/strong><\/td>\n<td>남경대·Alibaba<\/td>\n<td>프리프린트<\/td>\n<td>PR 200개, 10개 언어, 코멘트 1,505개<\/td>\n<td>② (+사람 코멘트)<\/td>\n<td>줄 겹침 + LLM<\/td>\n<td>P·R·F1<\/td>\n<td>예 (Apache-2.0)<\/td>\n<\/tr>\n<tr>\n<td><strong>c-CRAB<\/strong><\/td>\n<td>NUS<\/td>\n<td>프리프린트 (2026-03)<\/td>\n<td>PR 184개, 테스트 234개<\/td>\n<td>④<\/td>\n<td>실행<\/td>\n<td>통과율<\/td>\n<td>예<\/td>\n<\/tr>\n<tr>\n<td><strong>CR-Bench<\/strong> v1/v2<\/td>\n<td>Nutanix<\/td>\n<td>프리프린트 (v1은 ICLR 2026 관련 표기)<\/td>\n<td>584개 / 검증 174개<\/td>\n<td>③ (SWE-bench 기반)<\/td>\n<td>LLM 3분류<\/td>\n<td>recall, precision, 유용률, SNR<\/td>\n<td>미확인<\/td>\n<\/tr>\n<tr>\n<td><strong>MCR-Bench<\/strong><\/td>\n<td>중산대·Huawei<\/td>\n<td><strong>ISSTA 2026<\/strong><\/td>\n<td>다회차 리뷰 2,269건, 5개 언어<\/td>\n<td>② (+사람, κ 0.87)<\/td>\n<td>LLM 적중<\/td>\n<td>P·R·F1<\/td>\n<td>예<\/td>\n<\/tr>\n<tr>\n<td><strong>ContextCRBench<\/strong><\/td>\n<td>HIT·ByteDance<\/td>\n<td>FSE 2026 (OpenAlex)<\/td>\n<td>67,910건 (실험 1,080)<\/td>\n<td>①<\/td>\n<td>F1 / pass@k / ROUGE<\/td>\n<td>과제별<\/td>\n<td>예<\/td>\n<\/tr>\n<tr>\n<td><strong>CodeFuse-CR-Bench<\/strong><\/td>\n<td>Ant Group 외<\/td>\n<td>프리프린트<\/td>\n<td>601건, Python 70개 프로젝트<\/td>\n<td>①<\/td>\n<td>규칙 + 보상모델 + LLM<\/td>\n<td>종합 점수<\/td>\n<td>예 (Apache-2.0)<\/td>\n<\/tr>\n<tr>\n<td><strong>SWE-PRBench<\/strong><\/td>\n<td>개인 연구자<\/td>\n<td>프리프린트<\/td>\n<td>PR 350개<\/td>\n<td>①<\/td>\n<td>임베딩 + LLM<\/td>\n<td>복합 점수<\/td>\n<td>예 (MIT)<\/td>\n<\/tr>\n<tr>\n<td><strong>CodeReviewQA<\/strong><\/td>\n<td>멜버른대·SMU<\/td>\n<td><strong>Findings of ACL 2025<\/strong><\/td>\n<td>900건, 9개 언어<\/td>\n<td>사람 선별<\/td>\n<td>객관식<\/td>\n<td>정확도<\/td>\n<td>예<\/td>\n<\/tr>\n<tr>\n<td><strong>Martian CRB<\/strong><\/td>\n<td>Martian (벤더)<\/td>\n<td>—<\/td>\n<td>offline PR 50개/정답 173 + online<\/td>\n<td>① / 실제 수정<\/td>\n<td>LLM 3개<\/td>\n<td>P·R·Fβ<\/td>\n<td>예 (MIT)<\/td>\n<\/tr>\n<tr>\n<td><strong>Qodo PR-Review-Bench<\/strong><\/td>\n<td>Qodo (벤더)<\/td>\n<td>—<\/td>\n<td>PR 100개, 주입 결함 580개<\/td>\n<td>결함 주입<\/td>\n<td>미공개<\/td>\n<td>P·R·F1<\/td>\n<td>데이터만<\/td>\n<\/tr>\n<tr>\n<td><strong>Greptile<\/strong><\/td>\n<td>Greptile (벤더)<\/td>\n<td>—<\/td>\n<td>버그 50개<\/td>\n<td>③<\/td>\n<td>사람 판정<\/td>\n<td>탐지율<\/td>\n<td>일부<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>평가 지표 연구<\/strong>(정답 없이 코멘트 품질을 재는 쪽): CRScore(NAACL 2025), DeepCRCEval(FASE 2025), CRJudgeBench(심사 중) → <a href=\"#03\">03장<\/a><\/p>\n<hr />\n<h2>3. 주요 벤치마크 자세히<\/h2>\n<h3>ReviewBench (GitHub) — 가장 널리 보도된 벤치마크<\/h3>\n<ul>\n<li><strong>정답 만들기<\/strong>: 후보 출처는 사람 리뷰 코멘트, 작성자의 후속 수정에서 거꾸로 추론한 문제, 정적분석 도구, LLM 리뷰 에이전트다. 같은 의미의 후보를 합친 뒤, Claude Sonnet 5 분류기가 \"사실이고, 관련 있고, 사소하지 않은가\"로 참/거짓을 붙이고 사람이 감사한다. <strong>거짓 후보도 남겨서<\/strong>, 에이전트가 같은 헛소리를 하면 감점한다.<\/li>\n<li><strong>분류기와 사람의 일치<\/strong> (데이터셋을 만들지 않은 시니어 엔지니어와 비교): 참/거짓 96.6%, 심각도 정확 일치 62.9%, 분류 79.7%. 사람이 분류기보다 심각도를 높게 매긴 경우가 반대의 약 9배였다.<\/li>\n<li><strong>매칭<\/strong>: 같은 파일 안에서만, 의미가 같으면 일치. 원래는 다대다 매칭이고, precision 계산 때는 지적 하나가 정답 하나만 차지한다. → 계산 방식은 <a href=\"PR-리뷰-에이전트-채점-가이드.md\">채점 가이드 4~5장<\/a><\/li>\n<li><strong>지표<\/strong>: grounded(정답지 라벨만) vs augmented(정답지 밖 지적을 채점관이 보강). 비교는 grounded, 진단은 augmented.<\/li>\n<li>\n<p><strong>정답의 실제 출처 구성<\/strong> (저장소 데이터를 직접 재집계, 2026-11-19):<\/p>\n<table>\n<thead>\n<tr>\n<th>생산자<\/th>\n<th>참 정답 수<\/th>\n<th>비율<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>llm_review<\/code> (여러 LLM 리뷰 에이전트)<\/td>\n<td>약 1,390<\/td>\n<td>약 54%<\/td>\n<\/tr>\n<tr>\n<td><strong><code>ccr<\/code><\/strong> (GPT-5.5·Opus-4.7로 돌린 시스템)<\/td>\n<td><strong>1,130<\/strong><\/td>\n<td><strong>44.1%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>사람 코멘트<\/td>\n<td>—<\/td>\n<td>약 1.5%<\/td>\n<\/tr>\n<tr>\n<td>합계<\/td>\n<td>2,565 (전체 후보 4,549)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><code>ccr<\/code>이 무엇인지 방법론 문서는 \"아직 이름을 밝히지 않았다\". 블로그가 \"Copilot code review (CCR)\"라고 부르고, Copilot 에이전트 컨테이너 이름이 <code>rb-agent-ccr-review<\/code>인 점으로 보아 <strong>Copilot 코드 리뷰일 가능성이 높다.<\/strong> 문서 스스로 \"생산자 편향\": 리뷰어가 \"자기의 이전 출력과 겹쳐서 이득을 볼 수 있다\"고 경고한다.<\/li>\n<li>2026-10-13 공개 당시에는 1,185/2,623(45.2%)이었다. 2026-11-16 중복 제거 후 위 값이 되었다.<\/li>\n<li>2026-10-20부터 특정 생산자를 정답지에서 빼고 채점하는 옵션(<code>--exclude-producer<\/code>)이 생겼다. 이 옵션으로 낸 Copilot 점수가 공개되었는지는 확인하지 못했다.<\/li>\n<li><strong>held-out 없음<\/strong>: 25개 PR 시험 세트는 \"별도의 공개/비공개 분할이 아니다\". 219개 PR과 정답지가 모두 공개되어 있다. 블로그는 이 공개 세트에서 \"hill-climb(점수를 올려 가며 튜닝)\"하라고 권한다. 리더보드에는 기존 점수보다 좋을 때만 새 점수가 올라간다.<\/li>\n<li><strong>리더보드의 변화<\/strong>:<\/li>\n<li>출시 직후(2026-10-06 보관본): 1위 Copilot Balanced grounded F1 <strong>40.1%<\/strong>(P 87.8 / R 26.0, 2026-10-01 실행). Greptile(06-16), Cubic(06-29), Codex(06~07월)는 <strong>3개월 넘게 전에<\/strong> 실행된 결과였다. 사이트는 \"벤더가 실행하거나 검증하지 않았다\"고 적었다.<\/li>\n<li>2026-11-19 현재(전체 심각도): 1위 OhMyBug 69.3, Copilot Max 10위(42.4), Copilot Balanced 17위(34.9). 기본 화면(고심각도)에서는 OhMyBug 83.0%, Copilot Max 4위(75.7%).<\/li>\n<li><strong>오프라인 ↔ 온라인 대조<\/strong>(GitHub 자기 보고): 06장 참고.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:600px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 210\" role=\"img\" aria-label=\"ReviewBench 정답 출처 구성\" data-minw=\"600\"><title>ReviewBench 정답 출처 구성<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"720\" height=\"210\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">ReviewBench의 참 정답 2,565개는 어디서 왔나<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">저장소 golden/ 219개 파일을 직접 다시 셈 (2026-11-19, 중복 제거 후)<\/text><rect x=\"20\" y=\"67\" width=\"12\" height=\"10\" rx=\"2\" class=\"f-d1\"/><text x=\"40.0\" y=\"76.0\" class=\"t-sm\">llm_review — 여러 LLM 리뷰 에이전트<\/text><rect x=\"266.47999999999996\" y=\"67\" width=\"12\" height=\"10\" rx=\"2\" class=\"f-d2\"/><text x=\"286.5\" y=\"76.0\" class=\"t-sm\">ccr — Copilot 코드 리뷰로 추정<\/text><rect x=\"481.03999999999996\" y=\"67\" width=\"12\" height=\"10\" rx=\"2\" class=\"f-d3\"/><text x=\"501.0\" y=\"76.0\" class=\"t-sm\">사람 — 사람 리뷰 코멘트<\/text><g class=\"tip\"><title>llm_review: 54.2% (여러 LLM 리뷰 에이전트)<\/title><rect x=\"20.0\" y=\"100\" width=\"366.6\" height=\"34\" rx=\"4\" class=\"f-d1 hl\"/><\/g><text x=\"30.0\" y=\"122.0\" class=\"t-val\" style=\"fill:var(--surface)\">54.2%<\/text><g class=\"tip\"><title>ccr: 44.1% (Copilot 코드 리뷰로 추정)<\/title><rect x=\"388.6\" y=\"100\" width=\"297.9\" height=\"34\" rx=\"4\" class=\"f-d2 hl\"/><\/g><text x=\"398.6\" y=\"122.0\" class=\"t-val\" style=\"fill:var(--surface)\">44.1%<\/text><g class=\"tip\"><title>사람: 1.5% (사람 리뷰 코멘트)<\/title><rect x=\"688.4\" y=\"100\" width=\"8.2\" height=\"34\" rx=\"4\" class=\"f-d3 hl\"/><\/g><text x=\"693.5\" y=\"154.0\" class=\"t-val\" text-anchor=\"middle\">1.5%<\/text><text x=\"20.0\" y=\"168.0\" class=\"t-mut\">ccr 1,130개 = 44.1% (공개 당시 1,185/2,623 = 45.2%). 방법론 문서 스스로 &#x27;생산자 편향&#x27;을 경고한다<\/text><text x=\"20.0\" y=\"188.0\" class=\"t-mut\">→ 정답을 만든 시스템과 같은 계열이 평가받으면 겹치는 만큼 유리할 수 있다<\/text><\/svg><\/div><figcaption>그림 5-2. ReviewBench 참 정답 2,565개의 출처 — 저장소 golden/ 파일을 직접 다시 셈(2026-11-19)<\/figcaption><\/figure>\n<h3>SWR-Bench (PACMSE / FSE 2026)<\/h3>\n<ul>\n<li>PR 1,000개 중 절반은 <strong>문제없는 PR<\/strong>이다. 문제없는 PR에서 \"LGTM\"이라고 하거나 지적이 0개면 맞힌 것으로 친다. 이 설계로 \"조용히 있기\"(TN)를 잴 수 있다.<\/li>\n<li>적중 판정 규칙과 사람-LLM 일치도는 03장에 있다.<\/li>\n<li>결과: 최고 F1 약 19~21%(본문과 표 값이 다르다). 에이전트형 도구가 단일 프롬프트를 이기지 못했다. 여러 번 실행한 결과를 합치면 F1 +43.67%.<\/li>\n<li>한계: Python만 다룬다. 정답 추출과 판정이 모두 Gemini 계열이다. 오염 논의가 없다.<\/li>\n<\/ul>\n<h3>CRBugBench (CMU·Microsoft Research, 프리프린트)<\/h3>\n<ul>\n<li>버그 두 갈래: ① 머지 <strong>전<\/strong> 리뷰 스레드에서 잡힌 버그 ② 머지 <strong>후<\/strong> 고쳐진 버그(SZZ로 원인 PR을 추적). 수작업 검증 40건 중 37건(92.5%) 유효.<\/li>\n<li><strong>사내 비공개 800개<\/strong>: 따로 떼어 둔 시험지가 아니라 <strong>한 대기업의 사내 모노레포 2개<\/strong>에서 같은 방법으로 만든 과제다. \"학습 데이터에 확실히 없다\"는 점을 장점으로 든다. 공개 저장소보다 성능이 최대 25.5% 떨어졌다(단위 불명확).<\/li>\n<li><strong>지표는 recall@k만<\/strong>: 정답 버그가 에이전트 상위 k개 지적 안에 들었나. 본문에 \"precision\"이라는 단어가 한 번도 나오지 않는다. 위협 요인에 \"전반적 리뷰 유용성이 아니라 알려진 버그의 회수\"를 잰다고 적었다.<\/li>\n<li><strong>결과<\/strong>: claude-opus-5 + copilot-cli recall@5 <strong>71.9%<\/strong>(머지 전 79.6, 머지 후 64.2). 과제당 $2.97, 9.8분.<\/li>\n<li><strong>\"사람 약 50%\"의 정체<\/strong>: 사람 실력을 잰 값이 아니다. 데이터의 49.7%가 \"사람이 리뷰에서 잡은 버그\"라서 <strong>구성상<\/strong> 그렇게 나온다. 사람과 에이전트의 합집합은 82.1%.<\/li>\n<li>공개 저장소는 저자들이 \"논문 설명을 보고 다시 만든\" 995개 과제이고, 판정 모델 하나가 논문과 다르며 라이선스가 없다.<\/li>\n<\/ul>\n<h3>c-CRAB (NUS, 프리프린트)<\/h3>\n<ul>\n<li>아이디어: 좋은 리뷰란 \"그대로 고치면 문제가 사라지는 리뷰\"다.<\/li>\n<li>사람 코멘트 → 숨겨진 테스트(원래 패치에서 실패, 고치면 통과) → 리뷰 도구 코멘트를 코딩 에이전트에 주고 고치게 한다 → 테스트 통과율.<\/li>\n<li>결과: Claude Code 32.1%, Devin 24.8%, PR-Agent 23.1%, Codex 20.1%. 네 도구 <strong>합집합 41.5%<\/strong> → 도구마다 잡는 문제가 다르다.<\/li>\n<li>도구 코멘트 92개를 사람이 확인하니 84%가 유용했다. → <strong>통과율이 낮다고 리뷰가 나쁜 것은 아니다<\/strong>(사람이 짚은 바로 그 문제를 안 짚었을 뿐일 수 있다).<\/li>\n<\/ul>\n<h3>CR-Bench (Nutanix, 프리프린트)<\/h3>\n<ul>\n<li>코멘트를 BUG_HIT / VALID_SUGGESTION / NOISE로 분류해 <strong>소음<\/strong>을 정면으로 잰다.<\/li>\n<li><strong>SNR<\/strong> = (버그 적중 + 타당한 제안) / 소음. SNR 5면 소음 1개당 쓸모 있는 것 5개.<\/li>\n<li>precision을 \"버그 적중 / 전체 코멘트\"로 정의해서 3~5%로 매우 낮게 나온다. 다른 벤치마크의 precision과 <strong>비교 불가<\/strong>다.<\/li>\n<li>Reflexion이 재현율 27.01 → 32.76, SNR 5.11 → 1.95. 작은 모델(GPT-5-mini) Reflexion은 SNR 0.91(소음 &gt; 신호).<\/li>\n<li>메모리 버그는 모든 에이전트가 재현율 0이었다.<\/li>\n<\/ul>\n<h3>AACR-Bench (남경대·Alibaba, 프리프린트)<\/h3>\n<ul>\n<li>사람 리뷰 기반 코멘트 391개 + LLM 6개가 생성하고 엔지니어 80명 이상이 검증한 코멘트 1,114개. \"결함 범위 285% 증가\"는 1,114/391에서 나온 값이다.<\/li>\n<li>최종 코멘트 중 1,027개는 <strong>한 모델만<\/strong> 찾았다 → 모델마다 찾는 것이 다르다.<\/li>\n<li>약점: 정답을 만든 모델(과 Claude Code)이 평가 대상이기도 하다(순환). 논문은 이 문제를 다루지 않는다.<\/li>\n<\/ul>\n<h3>Martian Code Review Bench (벤더, MIT)<\/h3>\n<ul>\n<li><strong>online<\/strong>: 실제 오픈소스 PR에서 리뷰 봇의 제안이 실제 코드 변경으로 이어졌는지 LLM이 판정한다. 정적 데이터의 학습 유출을 피하려는 설계다.<\/li>\n<li><strong>offline<\/strong>: 기존 Greptile·Augment 데이터 기반 PR 50개, 정답 173개. 판정 모델 3개. \"사람 주석과 공식 보정하지 않았다.\"<\/li>\n<li>순위(직접 질의, 2026-10-19~11-18): online 1위 cubic 0.651 … Copilot 6위 0.607. offline(기본 설정 재계산) 1위 Qodo Extended 0.651 … Copilot 5위 0.580. 사이트 기본 필터와 다를 수 있다.<\/li>\n<\/ul>\n<h3>벤더 벤치마크 — 실행 주체에 따라 크게 달라진다<\/h3>\n<ul>\n<li>Greptile 자체 벤치마크: Greptile <strong>82%<\/strong>. Augment가 같은 데이터로 다시 돌리자 Greptile <strong>45%<\/strong>(정답 코멘트를 추가해 정의가 달라졌다).<\/li>\n<li>Cursor 자체 비교: Bugbot 78.13%, Copilot 46.69% 등(공개 저장소만, 판정 프롬프트 비공개).<\/li>\n<li>Qodo 1.0: 주입한 결함 580개, Qodo F1 60.1%.<\/li>\n<\/ul>\n<h3>결이 다른 두 벤치마크 — 기획 충족과 공격 내성<\/h3>\n<ul>\n<li><strong>PACE-Bench (저장대·Alibaba, 프리프린트)<\/strong>: 리뷰 에이전트가 아니라 <strong>코딩 에이전트의 패치가 PRD(제품 요구사항)를 충족하는지<\/strong> 채점한다. 과제 43개, 원자 단위 인수 기준(Code Point) 750개. 요구사항 쪽과 diff 쪽을 따로 뽑아 대조하고, 가중치는 \"코드 양이 아니라 검증 가능성과 업무 중요도\"로 정해 평가 전에 고정한다. \"전문가 합의와 95.2% 일치\"는 전문가들이 <strong>파이프라인 판정과 근거를 본 뒤<\/strong> 재평가한 합의라 블라인드가 아니다. 최고 모델의 완전 납품률 14.0%.<\/li>\n<li><strong>공격 내성<\/strong>:<ul>\n<li>SEVRA-BENCH(프리프린트): 실제 취약점을 다시 넣은 PR을 설득 문구 15종으로 포장했을 때 리뷰 에이전트가 승인하는 비율. PR 약 1,000개, 에이전트 8개.<\/li>\n<li>arXiv 2603.18740(ICSE 2027 예정 표기): 다듬은 PR 문구로 CVE 33개 중 <strong>32개(97%)<\/strong>를 Claude Code·CodeRabbit의 보안 판정에서 숨겼다.<\/li>\n<li>CSA \"Comment and Control\"(2026-04): PR·이슈 필드의 프롬프트 인젝션으로 CI 리뷰 에이전트가 시크릿을 유출했다(벤치마크가 아닌 공개 노트).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h2>4. 벤치마크들을 비교할 때 볼 것 (체크리스트, 판단 아님)<\/h2>\n<table>\n<thead>\n<tr>\n<th>질문<\/th>\n<th>왜<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>정답은 어디서 왔나? (①~④)<\/td>\n<td>정답 출처가 곧 \"무엇을 잘하는 에이전트가 유리한가\"를 정한다<\/td>\n<\/tr>\n<tr>\n<td>정답을 만든 모델과 평가 대상이 겹치나?<\/td>\n<td>ReviewBench <code>ccr<\/code> 44%, AACR-Bench, SWR-Bench(Gemini)<\/td>\n<\/tr>\n<tr>\n<td>precision을 재나? 잰다면 분모는?<\/td>\n<td>CRBugBench는 재지 않는다. CR-Bench와 ReviewBench는 정의가 다르다<\/td>\n<\/tr>\n<tr>\n<td>\"문제없는 PR\"이 있나?<\/td>\n<td>있어야 조용히 있기(TN)를 잰다(SWR-Bench)<\/td>\n<\/tr>\n<tr>\n<td>held-out·비공개 세트가 있나?<\/td>\n<td>ReviewBench 없음, CRBugBench 사내 800<\/td>\n<\/tr>\n<tr>\n<td>채점관을 사람과 대조했나? 몇 건으로?<\/td>\n<td>CRBugBench 40건, SWE-PRBench 30건, Martian \"미보정\"<\/td>\n<\/tr>\n<tr>\n<td>누가 돌렸나?<\/td>\n<td>벤더 자체 실행과 제3자 재실행 결과가 크게 다르다<\/td>\n<\/tr>\n<tr>\n<td>언어·저장소 범위는?<\/td>\n<td>Python만인 것이 많다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>스스로 판단할 질문<\/h2>\n<ol>\n<li>우리 정답지는 ①~④ 중 어떤 방식(들)으로 만들 것인가? 각 방식이 빠뜨리는 것은 무엇인가?<\/li>\n<li>공개 벤치마크 점수를 볼 것인가, 사내 PR로 만든 세트만 볼 것인가, 둘 다 볼 것인가? 공개 → 사내로 갈 때의 하락(CRBugBench)을 어떻게 볼 것인가?<\/li>\n<li>우리 에이전트의 모델이 정답지 생산에도 쓰였다면 그 편향을 어떻게 확인할 것인가?<\/li>\n<li>공격 내성(PR 본문·주석의 인젝션)을 평가 범위에 넣을 것인가?<\/li>\n<li>\"기획 충족\"처럼 버그가 아닌 관점은 어떤 정답 방식으로 잴 수 있는가?(PACE-Bench의 Code Point 방식이 하나의 예)<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<ul>\n<li>ReviewBench 블로그 — <a href=\"https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/\">https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/<\/a> (B, ok, 게시 2026-10-05)<\/li>\n<li>ReviewBench 저장소·방법론 — <a href=\"https://github.com/review-bench/ReviewBench\">https://github.com/review-bench/ReviewBench<\/a> · <a href=\"https://github.com/review-bench/ReviewBench/blob/main/docs/METHODOLOGY.md\">https://github.com/review-bench/ReviewBench/blob/main/docs/METHODOLOGY.md<\/a> · PR #57 <a href=\"https://github.com/review-bench/ReviewBench/pull/57\">https://github.com/review-bench/ReviewBench/pull/57<\/a> · PR #107 <a href=\"https://github.com/review-bench/ReviewBench/pull/107\">https://github.com/review-bench/ReviewBench/pull/107<\/a> · issue #9 <a href=\"https://github.com/review-bench/ReviewBench/issues/9\">https://github.com/review-bench/ReviewBench/issues/9<\/a> (B, ok)<\/li>\n<li>ReviewBench 리더보드 — <a href=\"https://review-bench.ai/api/leaderboard\">https://review-bench.ai/api/leaderboard<\/a> · 보관본 <a href=\"https://web.archive.org/web/20261006075931id_/https://review-bench.ai/api/leaderboard\">https://web.archive.org/web/20261006075931id_/https://review-bench.ai/api/leaderboard<\/a> (B, ok)<\/li>\n<li>SWR-Bench — <a href=\"https://arxiv.org/html/2509.01494\">https://arxiv.org/html/2509.01494<\/a> · CRBugBench — <a href=\"https://export.arxiv.org/pdf/2610.13668\">https://export.arxiv.org/pdf/2610.13668<\/a> · <a href=\"https://github.com/malusamayo/CRBugBench\">https://github.com/malusamayo/CRBugBench<\/a><\/li>\n<li>AACR-Bench — <a href=\"https://export.arxiv.org/pdf/2601.19494\">https://export.arxiv.org/pdf/2601.19494<\/a> · c-CRAB — <a href=\"https://arxiv.org/html/2603.23448\">https://arxiv.org/html/2603.23448<\/a> · CR-Bench — <a href=\"https://arxiv.org/abs/2603.11078\">https://arxiv.org/abs/2603.11078<\/a> · <a href=\"https://arxiv.org/html/2611.02566\">https://arxiv.org/html/2611.02566<\/a><\/li>\n<li>MCR-Bench — <a href=\"https://arxiv.org/html/2608.27442\">https://arxiv.org/html/2608.27442<\/a> · ContextCRBench — <a href=\"https://arxiv.org/html/2511.07017\">https://arxiv.org/html/2511.07017<\/a> · CodeFuse-CR-Bench — <a href=\"https://arxiv.org/html/2509.14856\">https://arxiv.org/html/2509.14856<\/a> · SWE-PRBench — <a href=\"https://arxiv.org/html/2603.26130\">https://arxiv.org/html/2603.26130<\/a> · CodeReviewQA — <a href=\"https://arxiv.org/html/2503.16167\">https://arxiv.org/html/2503.16167<\/a><\/li>\n<li>Martian — <a href=\"https://github.com/withmartian/code-review-benchmark\">https://github.com/withmartian/code-review-benchmark<\/a> · <a href=\"https://app.codereviewbenchmark.com/api/leaderboard\">https://app.codereviewbenchmark.com/api/leaderboard<\/a><\/li>\n<li>Qodo — <a href=\"https://huggingface.co/datasets/Qodo/PR-Review-Bench\">https://huggingface.co/datasets/Qodo/PR-Review-Bench<\/a> · Greptile — <a href=\"https://www.greptile.com/benchmarks\">https://www.greptile.com/benchmarks<\/a> · Augment 재실행 — <a href=\"https://www.augmentcode.com/blog/we-benchmarked-7-ai-code-review-tools-on-real-world-prs-here-are-the-results\">https://www.augmentcode.com/blog/we-benchmarked-7-ai-code-review-tools-on-real-world-prs-here-are-the-results<\/a> (partial) · Cursor — <a href=\"https://cursor.com/blog/bugbot-learning\">https://cursor.com/blog/bugbot-learning<\/a><\/li>\n<li>PACE-Bench — <a href=\"https://export.arxiv.org/pdf/2610.26394\">https://export.arxiv.org/pdf/2610.26394<\/a> · <a href=\"https://github.com/TianqiLiu1/PACE-Bench\">https://github.com/TianqiLiu1/PACE-Bench<\/a><\/li>\n<li>SEVRA-BENCH — <a href=\"https://arxiv.org/abs/2606.13757\">https://arxiv.org/abs/2606.13757<\/a> · 편향 주입 — <a href=\"https://arxiv.org/abs/2603.18740\">https://arxiv.org/abs/2603.18740<\/a> · CSA — <a href=\"https://labs.cloudsecurityalliance.org/research/csa-research-note-comment-control-github-prompt-injection-20/\">https://labs.cloudsecurityalliance.org/research/csa-research-note-comment-control-github-prompt-injection-20/<\/a><\/li>\n<li>서베이 — <a href=\"https://export.arxiv.org/pdf/2602.13377\">https://export.arxiv.org/pdf/2602.13377<\/a> (99편, 세부 과제 18개 분류)<\/li>\n<\/ul>", "text": " 05. 최신 리뷰 에이전트 벤치마크 논문 (2025~2026) 생성일 : 2026-11-19 최종 수정일 : 2026-11-20 수준 : 심화 근거 원장 : wave-1 A5 · wave-2 W2d (ReviewBench 출처) · wave-3 W3 · wave-2 W2c 이 장에서 답하는 질문 지금 \"리뷰 에이전트를 어떻게 채점하나\"에 대해 나온 벤치마크들은 각각 무엇을 정답으로 삼고, 어떻게 맞췄는지 판정하고, 무엇을 재나? 각 방식의 약점은 무엇인가? \"높이 평가되는\"의 기준 : 2025~2026 논문은 인용이 쌓이기 전이다. 그래서 (1) 동료 심사 학회 게재, (2) 큰 회사·연구소가 공개하고 다른 연구가 비교 대상으로 쓰는지, (3) 데이터·코드 공개 여부를 함께 봤다. 등급 A는 게재 확인, D는 프리프린트·벤더다. 기존 가이드 정정 : 채점 가이드 10장은 ReviewBench 발표를 \"2026-01\"로 적었는데, 실제 게시일은 2026-10-05 다(저장소 생성 2026-09-04). 날짜가 들어간 블로그 URL은 아무 날짜를 넣어도 같은 글로 리다이렉트된다. 또 \"리더보드 1위는 Copilot\"은 출시 당일 기준 이고, 2026-11-19 현재는 아니다(아래). 1. 정답을 만드는 네 가지 방식 벤치마크를 가르는 가장 큰 기준은 정답이 어디서 왔나 다. 방식 쉬운 설명 장점 약점 대표 ① 사람 리뷰 코멘트 실제 PR에 달린 사람 코멘트를 정답으로 현실적이다 사람이 놓친 것은 빠진다. 스타일 지적이 다수다(01장). 노이즈가 많다(04장) SWE-PRBench, ContextCRBench, CodeFuse-CR-Bench ② LLM이 찾고 사람이 검증 여러 LLM·도구가 후보를 내고 사람이 참/거짓 판정 정답 범위가 넓다 정답을 만든 모델이 평가받으면 유리하다 (생산자 편향) ReviewBench, AACR-Bench, MCR-Bench ③ 실제 버그를 거슬러 찾기 나중에 고쳐진 버그 → 그 버그를 만든 PR을 찾아(SZZ) 정답으로 \"진짜 버그\"라는 근거가 있다 버그만 다룬다. 설계·가독성은 빠진다. SZZ에 오차가 있다 CRBugBench, CR-Bench, SWR-Bench, Greptile ④ 실행 가능한 테스트 사람 코멘트를 숨겨진 테스트로 바꾸고, 리뷰대로 고친 코드가 통과하나 본다 LLM 판정에 기대지 않는다 고치는 에이전트의 실력이 섞인다. 문서·설계 지적은 테스트로 못 만든다 c-CRAB 그림 5-1. 정답지를 만드는 네 가지 방식과 각각의 약점 맞췄는지 판정하는 방식(매칭) 은 거의 모두 LLM이 의미가 같은지 판정 하는 쪽으로 모였다. BLEU 같은 문자열 유사도는 신뢰를 잃었다(02장). 예외는 c-CRAB(실행), CodeReviewQA(객관식), ContextCRBench(아직 ROUGE)다. 2. 벤치마크 비교표 벤치마크 만든 곳 게재 데이터 정답 방식 매칭 주요 지표 공개 ReviewBench GitHub 회사 문서 (2026-10) PR 219개 (저장소 187, 19개 언어), 정답 4,549개 ② LLM, 같은 파일 안에서 grounded / augmented P·R·F1, Fβ 예 (MIT) SWR-Bench 북경대 PACMSE (FSE 2026) PR 1,000개 (변경 500 + 문제없음 500), Python 12개 저장소 ③ + LLM 추출, 사람 검증 LLM 적중 판정 P·R·F1 불명확(논문 URL 오류) CRBugBench CMU·Microsoft 프리프린트 (2026-10) 공개 1,000 + 사내 800 ③ + 리뷰 스레드 LLM 3개 다수결 recall@k 만 일부(재구성본 995개) AACR-Bench 남경대·Alibaba 프리프린트 PR 200개, 10개 언어, 코멘트 1,505개 ② (+사람 코멘트) 줄 겹침 + LLM P·R·F1 예 (Apache-2.0) c-CRAB NUS 프리프린트 (2026-03) PR 184개, 테스트 234개 ④ 실행 통과율 예 CR-Bench v1/v2 Nutanix 프리프린트 (v1은 ICLR 2026 관련 표기) 584개 / 검증 174개 ③ (SWE-bench 기반) LLM 3분류 recall, precision, 유용률, SNR 미확인 MCR-Bench 중산대·Huawei ISSTA 2026 다회차 리뷰 2,269건, 5개 언어 ② (+사람, κ 0.87) LLM 적중 P·R·F1 예 ContextCRBench HIT·ByteDance FSE 2026 (OpenAlex) 67,910건 (실험 1,080) ① F1 / pass@k / ROUGE 과제별 예 CodeFuse-CR-Bench Ant Group 외 프리프린트 601건, Python 70개 프로젝트 ① 규칙 + 보상모델 + LLM 종합 점수 예 (Apache-2.0) SWE-PRBench 개인 연구자 프리프린트 PR 350개 ① 임베딩 + LLM 복합 점수 예 (MIT) CodeReviewQA 멜버른대·SMU Findings of ACL 2025 900건, 9개 언어 사람 선별 객관식 정확도 예 Martian CRB Martian (벤더) — offline PR 50개/정답 173 + online ① / 실제 수정 LLM 3개 P·R·Fβ 예 (MIT) Qodo PR-Review-Bench Qodo (벤더) — PR 100개, 주입 결함 580개 결함 주입 미공개 P·R·F1 데이터만 Greptile Greptile (벤더) — 버그 50개 ③ 사람 판정 탐지율 일부 평가 지표 연구 (정답 없이 코멘트 품질을 재는 쪽): CRScore(NAACL 2025), DeepCRCEval(FASE 2025), CRJudgeBench(심사 중) → 03장 3. 주요 벤치마크 자세히 ReviewBench (GitHub) — 가장 널리 보도된 벤치마크 정답 만들기 : 후보 출처는 사람 리뷰 코멘트, 작성자의 후속 수정에서 거꾸로 추론한 문제, 정적분석 도구, LLM 리뷰 에이전트다. 같은 의미의 후보를 합친 뒤, Claude Sonnet 5 분류기가 \"사실이고, 관련 있고, 사소하지 않은가\"로 참/거짓을 붙이고 사람이 감사한다. 거짓 후보도 남겨서 , 에이전트가 같은 헛소리를 하면 감점한다. 분류기와 사람의 일치 (데이터셋을 만들지 않은 시니어 엔지니어와 비교): 참/거짓 96.6%, 심각도 정확 일치 62.9%, 분류 79.7%. 사람이 분류기보다 심각도를 높게 매긴 경우가 반대의 약 9배였다. 매칭 : 같은 파일 안에서만, 의미가 같으면 일치. 원래는 다대다 매칭이고, precision 계산 때는 지적 하나가 정답 하나만 차지한다. → 계산 방식은 채점 가이드 4~5장 지표 : grounded(정답지 라벨만) vs augmented(정답지 밖 지적을 채점관이 보강). 비교는 grounded, 진단은 augmented. 정답의 실제 출처 구성 (저장소 데이터를 직접 재집계, 2026-11-19): 생산자 참 정답 수 비율 llm_review (여러 LLM 리뷰 에이전트) 약 1,390 약 54% ccr (GPT-5.5·Opus-4.7로 돌린 시스템) 1,130 44.1% 사람 코멘트 — 약 1.5% 합계 2,565 (전체 후보 4,549) ccr 이 무엇인지 방법론 문서는 \"아직 이름을 밝히지 않았다\". 블로그가 \"Copilot code review (CCR)\"라고 부르고, Copilot 에이전트 컨테이너 이름이 rb-agent-ccr-review 인 점으로 보아 Copilot 코드 리뷰일 가능성이 높다. 문서 스스로 \"생산자 편향\": 리뷰어가 \"자기의 이전 출력과 겹쳐서 이득을 볼 수 있다\"고 경고한다. 2026-10-13 공개 당시에는 1,185/2,623(45.2%)이었다. 2026-11-16 중복 제거 후 위 값이 되었다. 2026-10-20부터 특정 생산자를 정답지에서 빼고 채점하는 옵션( --exclude-producer )이 생겼다. 이 옵션으로 낸 Copilot 점수가 공개되었는지는 확인하지 못했다. held-out 없음 : 25개 PR 시험 세트는 \"별도의 공개/비공개 분할이 아니다\". 219개 PR과 정답지가 모두 공개되어 있다. 블로그는 이 공개 세트에서 \"hill-climb(점수를 올려 가며 튜닝)\"하라고 권한다. 리더보드에는 기존 점수보다 좋을 때만 새 점수가 올라간다. 리더보드의 변화 : 출시 직후(2026-10-06 보관본): 1위 Copilot Balanced grounded F1 40.1% (P 87.8 / R 26.0, 2026-10-01 실행). Greptile(06-16), Cubic(06-29), Codex(06~07월)는 3개월 넘게 전에 실행된 결과였다. 사이트는 \"벤더가 실행하거나 검증하지 않았다\"고 적었다. 2026-11-19 현재(전체 심각도): 1위 OhMyBug 69.3, Copilot Max 10위(42.4), Copilot Balanced 17위(34.9). 기본 화면(고심각도)에서는 OhMyBug 83.0%, Copilot Max 4위(75.7%). 오프라인 ↔ 온라인 대조 (GitHub 자기 보고): 06장 참고. 그림 5-2. ReviewBench 참 정답 2,565개의 출처 — 저장소 golden/ 파일을 직접 다시 셈(2026-11-19) SWR-Bench (PACMSE / FSE 2026) PR 1,000개 중 절반은 문제없는 PR 이다. 문제없는 PR에서 \"LGTM\"이라고 하거나 지적이 0개면 맞힌 것으로 친다. 이 설계로 \"조용히 있기\"(TN)를 잴 수 있다. 적중 판정 규칙과 사람-LLM 일치도는 03장에 있다. 결과: 최고 F1 약 19~21%(본문과 표 값이 다르다). 에이전트형 도구가 단일 프롬프트를 이기지 못했다. 여러 번 실행한 결과를 합치면 F1 +43.67%. 한계: Python만 다룬다. 정답 추출과 판정이 모두 Gemini 계열이다. 오염 논의가 없다. CRBugBench (CMU·Microsoft Research, 프리프린트) 버그 두 갈래: ① 머지 전 리뷰 스레드에서 잡힌 버그 ② 머지 후 고쳐진 버그(SZZ로 원인 PR을 추적). 수작업 검증 40건 중 37건(92.5%) 유효. 사내 비공개 800개 : 따로 떼어 둔 시험지가 아니라 한 대기업의 사내 모노레포 2개 에서 같은 방법으로 만든 과제다. \"학습 데이터에 확실히 없다\"는 점을 장점으로 든다. 공개 저장소보다 성능이 최대 25.5% 떨어졌다(단위 불명확). 지표는 recall@k만 : 정답 버그가 에이전트 상위 k개 지적 안에 들었나. 본문에 \"precision\"이라는 단어가 한 번도 나오지 않는다. 위협 요인에 \"전반적 리뷰 유용성이 아니라 알려진 버그의 회수\"를 잰다고 적었다. 결과 : claude-opus-5 + copilot-cli recall@5 71.9% (머지 전 79.6, 머지 후 64.2). 과제당 $2.97, 9.8분. \"사람 약 50%\"의 정체 : 사람 실력을 잰 값이 아니다. 데이터의 49.7%가 \"사람이 리뷰에서 잡은 버그\"라서 구성상 그렇게 나온다. 사람과 에이전트의 합집합은 82.1%. 공개 저장소는 저자들이 \"논문 설명을 보고 다시 만든\" 995개 과제이고, 판정 모델 하나가 논문과 다르며 라이선스가 없다. c-CRAB (NUS, 프리프린트) 아이디어: 좋은 리뷰란 \"그대로 고치면 문제가 사라지는 리뷰\"다. 사람 코멘트 → 숨겨진 테스트(원래 패치에서 실패, 고치면 통과) → 리뷰 도구 코멘트를 코딩 에이전트에 주고 고치게 한다 → 테스트 통과율. 결과: Claude Code 32.1%, Devin 24.8%, PR-Agent 23.1%, Codex 20.1%. 네 도구 합집합 41.5% → 도구마다 잡는 문제가 다르다. 도구 코멘트 92개를 사람이 확인하니 84%가 유용했다. → 통과율이 낮다고 리뷰가 나쁜 것은 아니다 (사람이 짚은 바로 그 문제를 안 짚었을 뿐일 수 있다). CR-Bench (Nutanix, 프리프린트) 코멘트를 BUG_HIT / VALID_SUGGESTION / NOISE로 분류해 소음 을 정면으로 잰다. SNR = (버그 적중 + 타당한 제안) / 소음. SNR 5면 소음 1개당 쓸모 있는 것 5개. precision을 \"버그 적중 / 전체 코멘트\"로 정의해서 3~5%로 매우 낮게 나온다. 다른 벤치마크의 precision과 비교 불가 다. Reflexion이 재현율 27.01 → 32.76, SNR 5.11 → 1.95. 작은 모델(GPT-5-mini) Reflexion은 SNR 0.91(소음 > 신호). 메모리 버그는 모든 에이전트가 재현율 0이었다. AACR-Bench (남경대·Alibaba, 프리프린트) 사람 리뷰 기반 코멘트 391개 + LLM 6개가 생성하고 엔지니어 80명 이상이 검증한 코멘트 1,114개. \"결함 범위 285% 증가\"는 1,114/391에서 나온 값이다. 최종 코멘트 중 1,027개는 한 모델만 찾았다 → 모델마다 찾는 것이 다르다. 약점: 정답을 만든 모델(과 Claude Code)이 평가 대상이기도 하다(순환). 논문은 이 문제를 다루지 않는다. Martian Code Review Bench (벤더, MIT) online : 실제 오픈소스 PR에서 리뷰 봇의 제안이 실제 코드 변경으로 이어졌는지 LLM이 판정한다. 정적 데이터의 학습 유출을 피하려는 설계다. offline : 기존 Greptile·Augment 데이터 기반 PR 50개, 정답 173개. 판정 모델 3개. \"사람 주석과 공식 보정하지 않았다.\" 순위(직접 질의, 2026-10-19~11-18): online 1위 cubic 0.651 … Copilot 6위 0.607. offline(기본 설정 재계산) 1위 Qodo Extended 0.651 … Copilot 5위 0.580. 사이트 기본 필터와 다를 수 있다. 벤더 벤치마크 — 실행 주체에 따라 크게 달라진다 Greptile 자체 벤치마크: Greptile 82% . Augment가 같은 데이터로 다시 돌리자 Greptile 45% (정답 코멘트를 추가해 정의가 달라졌다). Cursor 자체 비교: Bugbot 78.13%, Copilot 46.69% 등(공개 저장소만, 판정 프롬프트 비공개). Qodo 1.0: 주입한 결함 580개, Qodo F1 60.1%. 결이 다른 두 벤치마크 — 기획 충족과 공격 내성 PACE-Bench (저장대·Alibaba, 프리프린트) : 리뷰 에이전트가 아니라 코딩 에이전트의 패치가 PRD(제품 요구사항)를 충족하는지 채점한다. 과제 43개, 원자 단위 인수 기준(Code Point) 750개. 요구사항 쪽과 diff 쪽을 따로 뽑아 대조하고, 가중치는 \"코드 양이 아니라 검증 가능성과 업무 중요도\"로 정해 평가 전에 고정한다. \"전문가 합의와 95.2% 일치\"는 전문가들이 파이프라인 판정과 근거를 본 뒤 재평가한 합의라 블라인드가 아니다. 최고 모델의 완전 납품률 14.0%. 공격 내성 : SEVRA-BENCH(프리프린트): 실제 취약점을 다시 넣은 PR을 설득 문구 15종으로 포장했을 때 리뷰 에이전트가 승인하는 비율. PR 약 1,000개, 에이전트 8개. arXiv 2603.18740(ICSE 2027 예정 표기): 다듬은 PR 문구로 CVE 33개 중 32개(97%) 를 Claude Code·CodeRabbit의 보안 판정에서 숨겼다. CSA \"Comment and Control\"(2026-04): PR·이슈 필드의 프롬프트 인젝션으로 CI 리뷰 에이전트가 시크릿을 유출했다(벤치마크가 아닌 공개 노트). 4. 벤치마크들을 비교할 때 볼 것 (체크리스트, 판단 아님) 질문 왜 정답은 어디서 왔나? (①~④) 정답 출처가 곧 \"무엇을 잘하는 에이전트가 유리한가\"를 정한다 정답을 만든 모델과 평가 대상이 겹치나? ReviewBench ccr 44%, AACR-Bench, SWR-Bench(Gemini) precision을 재나? 잰다면 분모는? CRBugBench는 재지 않는다. CR-Bench와 ReviewBench는 정의가 다르다 \"문제없는 PR\"이 있나? 있어야 조용히 있기(TN)를 잰다(SWR-Bench) held-out·비공개 세트가 있나? ReviewBench 없음, CRBugBench 사내 800 채점관을 사람과 대조했나? 몇 건으로? CRBugBench 40건, SWE-PRBench 30건, Martian \"미보정\" 누가 돌렸나? 벤더 자체 실행과 제3자 재실행 결과가 크게 다르다 언어·저장소 범위는? Python만인 것이 많다 스스로 판단할 질문 우리 정답지는 ①~④ 중 어떤 방식(들)으로 만들 것인가? 각 방식이 빠뜨리는 것은 무엇인가? 공개 벤치마크 점수를 볼 것인가, 사내 PR로 만든 세트만 볼 것인가, 둘 다 볼 것인가? 공개 → 사내로 갈 때의 하락(CRBugBench)을 어떻게 볼 것인가? 우리 에이전트의 모델이 정답지 생산에도 쓰였다면 그 편향을 어떻게 확인할 것인가? 공격 내성(PR 본문·주석의 인젝션)을 평가 범위에 넣을 것인가? \"기획 충족\"처럼 버그가 아닌 관점은 어떤 정답 방식으로 잴 수 있는가?(PACE-Bench의 Code Point 방식이 하나의 예) 출처 ReviewBench 블로그 — https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/ (B, ok, 게시 2026-10-05) ReviewBench 저장소·방법론 — https://github.com/review-bench/ReviewBench · https://github.com/review-bench/ReviewBench/blob/main/docs/METHODOLOGY.md · PR #57 https://github.com/review-bench/ReviewBench/pull/57 · PR #107 https://github.com/review-bench/ReviewBench/pull/107 · issue #9 https://github.com/review-bench/ReviewBench/issues/9 (B, ok) ReviewBench 리더보드 — https://review-bench.ai/api/leaderboard · 보관본 https://web.archive.org/web/20261006075931id_/https://review-bench.ai/api/leaderboard (B, ok) SWR-Bench — https://arxiv.org/html/2509.01494 · CRBugBench — https://export.arxiv.org/pdf/2610.13668 · https://github.com/malusamayo/CRBugBench AACR-Bench — https://export.arxiv.org/pdf/2601.19494 · c-CRAB — https://arxiv.org/html/2603.23448 · CR-Bench — https://arxiv.org/abs/2603.11078 · https://arxiv.org/html/2611.02566 MCR-Bench — https://arxiv.org/html/2608.27442 · ContextCRBench — https://arxiv.org/html/2511.07017 · CodeFuse-CR-Bench — https://arxiv.org/html/2509.14856 · SWE-PRBench — https://arxiv.org/html/2603.26130 · CodeReviewQA — https://arxiv.org/html/2503.16167 Martian — https://github.com/withmartian/code-review-benchmark · https://app.codereviewbenchmark.com/api/leaderboard Qodo — https://huggingface.co/datasets/Qodo/PR-Review-Bench · Greptile — https://www.greptile.com/benchmarks · Augment 재실행 — https://www.augmentcode.com/blog/we-benchmarked-7-ai-code-review-tools-on-real-world-prs-here-are-the-results (partial) · Cursor — https://cursor.com/blog/bugbot-learning PACE-Bench — https://export.arxiv.org/pdf/2610.26394 · https://github.com/TianqiLiu1/PACE-Bench SEVRA-BENCH — https://arxiv.org/abs/2606.13757 · 편향 주입 — https://arxiv.org/abs/2603.18740 · CSA — https://labs.cloudsecurityalliance.org/research/csa-research-note-comment-control-github-prompt-injection-20/ 서베이 — https://export.arxiv.org/pdf/2602.13377 (99편, 세부 과제 18개 분류) "}, {"id": "06", "dir": "06-빅테크-실제-방식", "title": "06. 빅테크·대기업은 어떻게 만들고 평가하나", "level": "사례", "html": "<h1>06. 빅테크·대기업은 어떻게 만들고 평가하나<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-19<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-25<\/li>\n<li><strong>수준<\/strong>: 사례<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A6a-bigtech-google-meta-microsoft.md\">wave-1 A6a (Google·Meta·Microsoft)<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A6b-industry-github-atlassian-uber.md\">wave-1 A6b (GitHub·Atlassian·Uber 등)<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-2-web-W2c-deep-reads.md\">wave-2 W2c (Google 원문)<\/a><\/li>\n<\/ul>\n<h2>먼저 읽을 것 — 이 장의 숫자를 읽는 법<\/h2>\n<ul>\n<li>이 장의 숫자는 거의 모두 <strong>회사가 자기 시스템에 대해 낸 값(자기 보고)<\/strong>이다. 대조군 없이 전후만 비교한 경우가 많다.<\/li>\n<li>같은 이름의 지표(\"해결률\", \"addressed\", \"useful\")라도 <strong>회사마다 정의가 다르다.<\/strong> 숫자끼리 비교하지 말고, 각 회사가 <strong>무엇을 재기로 했는지<\/strong>를 보는 것이 이 장의 목적이다. 정의 비교는 <a href=\"#08\">08장<\/a>에 있다.<\/li>\n<li>동료 심사 논문(A)과 회사 블로그(B), 벤더 마케팅(D)을 구분해 표시했다.<\/li>\n<\/ul>\n<h2>한눈에 — 누가 무엇을 쟀나<\/h2>\n<table>\n<thead>\n<tr>\n<th>회사<\/th>\n<th>시스템<\/th>\n<th>무엇을 하나<\/th>\n<th>대표 온라인 지표(정의)<\/th>\n<th>출처 등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google<\/td>\n<td>ML 코멘트 해결<\/td>\n<td>리뷰어 코멘트 → 수정 코드 제안<\/td>\n<td>전체 리뷰어 코멘트 중 ML 수정으로 해결된 비율<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Google<\/td>\n<td>AutoCommenter<\/td>\n<td>모범 사례 위반 코멘트<\/td>\n<td>유용 비율 = 👍/(👍+👎)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Google<\/td>\n<td>Tricorder<\/td>\n<td>정적분석 결과를 리뷰에 표시<\/td>\n<td>\"Not useful\" 클릭 비율<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Meta<\/td>\n<td>MetaMateCR<\/td>\n<td>리뷰어 코멘트 → 수정 패치<\/td>\n<td>실행 가능한 코멘트 중 AI 패치로 고쳐진 비율<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Meta<\/td>\n<td>RADAR<\/td>\n<td>저위험 diff 자동 승인<\/td>\n<td>되돌림(revert) 비율, 장애 비율<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>Meta<\/td>\n<td>NudgeBot<\/td>\n<td>오래된 리뷰 독촉<\/td>\n<td>P75 리뷰 소요 시간 + 실제로 diff를 본 시간<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Microsoft<\/td>\n<td>사내 AI 리뷰어<\/td>\n<td>PR 코멘트<\/td>\n<td>PR 완료 시간<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>GitHub<\/td>\n<td>Copilot code review<\/td>\n<td>PR 코멘트<\/td>\n<td>👍/👎, 머지 전 해결 여부, addressed rate<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>Atlassian<\/td>\n<td>RovoDev<\/td>\n<td>PR 코멘트<\/td>\n<td>다음 커밋에서 그 줄이 바뀌었나<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Uber<\/td>\n<td>uReview<\/td>\n<td>PR 코멘트<\/td>\n<td>유용 평가, 같은 변경 안에서 반영<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>ByteDance<\/td>\n<td>BitsAI-CR<\/td>\n<td>규칙 기반 리뷰 코멘트<\/td>\n<td>정밀도, outdated rate(코멘트 단 줄이 이후 바뀐 비율)<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>Amazon<\/td>\n<td>CodeGuru Reviewer<\/td>\n<td>변경 이력에서 캐낸 정적 규칙<\/td>\n<td>개발자 수용률<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Anthropic<\/td>\n<td>Claude Code Review<\/td>\n<td>PR 코멘트<\/td>\n<td>실질 코멘트를 받은 PR 비율, \"틀림\" 표시 비율<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>OpenAI<\/td>\n<td>Codex 리뷰<\/td>\n<td>PR 코멘트<\/td>\n<td>코멘트 후 코드 변경 비율<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>Cursor<\/td>\n<td>Bugbot<\/td>\n<td>PR 버그 탐지<\/td>\n<td>머지 시점에 지적된 버그가 고쳐졌나(LLM 판정)<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>xAI(SpaceX)<\/td>\n<td>Grok Bot 팀<\/td>\n<td>에이전트가 만든 PR을 AI가 리뷰, 조건부 자동 머지<\/td>\n<td>되돌림(revert) 비율 약 0.5%<\/td>\n<td>C<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:700px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 780 380\" role=\"img\" aria-label=\"회사들의 공통 흐름\" data-minw=\"700\"><title>회사들의 공통 흐름<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"780\" height=\"380\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">회사들이 공통으로 쓰는 흐름 — 만들고, 거르고, 보여 주고, 듣고, 끈다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">관찰한 공통점일 뿐 권고가 아니다 (06장)<\/text><rect x=\"20\" y=\"66\" width=\"136\" height=\"44\" rx=\"10\" class=\"node-acc\"/><text x=\"88.0\" y=\"93.0\" class=\"t-b\" text-anchor=\"middle\">생성<\/text><line class=\"arrow\" x1=\"158.0\" y1=\"88.0\" x2=\"159.0\" y2=\"88.0\"/><path class=\"ahead\" d=\"M166.0,88.0L159.0,84.5L159.0,91.5z\"/><rect x=\"20\" y=\"124\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"88.0\" y=\"144.0\" class=\"t-mut\" text-anchor=\"middle\">Uber 생성기 3개<\/text><rect x=\"20\" y=\"160\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"88.0\" y=\"180.0\" class=\"t-mut\" text-anchor=\"middle\">Anthropic 병렬 4개<\/text><rect x=\"20\" y=\"196\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"88.0\" y=\"216.0\" class=\"t-mut\" text-anchor=\"middle\">ByteDance 규칙 219개<\/text><rect x=\"168\" y=\"66\" width=\"136\" height=\"44\" rx=\"10\" class=\"node-acc\"/><text x=\"236.0\" y=\"93.0\" class=\"t-b\" text-anchor=\"middle\">거르기<\/text><line class=\"arrow\" x1=\"306.0\" y1=\"88.0\" x2=\"307.0\" y2=\"88.0\"/><path class=\"ahead\" d=\"M314.0,88.0L307.0,84.5L307.0,91.5z\"/><rect x=\"168\" y=\"124\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"236.0\" y=\"144.0\" class=\"t-mut\" text-anchor=\"middle\">Uber 확신도·병합<\/text><rect x=\"168\" y=\"160\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"236.0\" y=\"180.0\" class=\"t-mut\" text-anchor=\"middle\">Atlassian 실행가능성<\/text><rect x=\"168\" y=\"196\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"236.0\" y=\"216.0\" class=\"t-mut\" text-anchor=\"middle\">Anthropic 이슈별 검증<\/text><rect x=\"168\" y=\"232\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"236.0\" y=\"252.0\" class=\"t-mut\" text-anchor=\"middle\">Meta 빌드·테스트 통과<\/text><rect x=\"316\" y=\"66\" width=\"136\" height=\"44\" rx=\"10\" class=\"node-acc\"/><text x=\"384.0\" y=\"93.0\" class=\"t-b\" text-anchor=\"middle\">보여 주기<\/text><line class=\"arrow\" x1=\"454.0\" y1=\"88.0\" x2=\"455.0\" y2=\"88.0\"/><path class=\"ahead\" d=\"M462.0,88.0L455.0,84.5L455.0,91.5z\"/><rect x=\"316\" y=\"124\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"384.0\" y=\"144.0\" class=\"t-mut\" text-anchor=\"middle\">Meta 작성자에게만<\/text><rect x=\"316\" y=\"160\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"384.0\" y=\"180.0\" class=\"t-mut\" text-anchor=\"middle\">Google 리뷰어 사전검토<\/text><rect x=\"316\" y=\"196\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"384.0\" y=\"216.0\" class=\"t-mut\" text-anchor=\"middle\">Infer 리뷰 시점에<\/text><rect x=\"464\" y=\"66\" width=\"136\" height=\"44\" rx=\"10\" class=\"node-acc\"/><text x=\"532.0\" y=\"93.0\" class=\"t-b\" text-anchor=\"middle\">반응 듣기<\/text><line class=\"arrow\" x1=\"602.0\" y1=\"88.0\" x2=\"603.0\" y2=\"88.0\"/><path class=\"ahead\" d=\"M610.0,88.0L603.0,84.5L603.0,91.5z\"/><rect x=\"464\" y=\"124\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"532.0\" y=\"144.0\" class=\"t-mut\" text-anchor=\"middle\">Google 좋아요/싫어요<\/text><rect x=\"464\" y=\"160\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"532.0\" y=\"180.0\" class=\"t-mut\" text-anchor=\"middle\">GitHub 머지 전 해결<\/text><rect x=\"464\" y=\"196\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"532.0\" y=\"216.0\" class=\"t-mut\" text-anchor=\"middle\">Atlassian 줄 변경<\/text><rect x=\"612\" y=\"66\" width=\"136\" height=\"44\" rx=\"10\" class=\"node-acc\"/><text x=\"680.0\" y=\"93.0\" class=\"t-b\" text-anchor=\"middle\">끄고 고치기<\/text><rect x=\"612\" y=\"124\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"680.0\" y=\"144.0\" class=\"t-mut\" text-anchor=\"middle\">Google 규칙 22개 억제<\/text><rect x=\"612\" y=\"160\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"680.0\" y=\"180.0\" class=\"t-mut\" text-anchor=\"middle\">Tricorder 불만 10%↑<\/text><rect x=\"612\" y=\"196\" width=\"136\" height=\"30\" rx=\"8\" class=\"node\"/><text x=\"680.0\" y=\"216.0\" class=\"t-mut\" text-anchor=\"middle\">ByteDance 규칙 퇴출<\/text><path class=\"arrow\" d=\"M680.0,290 V318 H88.0 V266\"/><path class=\"ahead\" d=\"M88.0,276 l-4,8 h8 z\"/><text x=\"350.0\" y=\"336.0\" class=\"t-mut\" text-anchor=\"middle\">다음 버전 생성기에 반영 (데이터 플라이휠)<\/text><text x=\"20.0\" y=\"366.0\" class=\"t-mut\">Infer: 같은 분석을 야간 보고서 대신 리뷰 시점 코멘트로 바꾸자 수정률 ~0% → 70%+<\/text><\/svg><\/div><figcaption>그림 6-1. 회사들이 공통으로 쓰는 흐름 — 만들고, 거르고, 보여 주고, 듣고, 끈다(관찰이지 권고가 아니다)<\/figcaption><\/figure>\n<hr />\n<h2>Google<\/h2>\n<h3>① ML로 리뷰 코멘트 해결하기 (Frömmgen 외, ICSE-SEIP 2024 · Google Research 블로그 2023)<\/h3>\n<ul>\n<li><strong>무엇<\/strong>: 리뷰어가 \"여기 null 체크 필요\"라고 쓰면, 모델이 수정 코드를 제안한다. 작성자는 미리 보고(preview) 적용한다.<\/li>\n<li><strong>오프라인 평가<\/strong>: 사람이 쓴 줄 코멘트의 보류된 시험 분할. 지표는 <strong>recall@X<\/strong>: 정밀도 X를 달성하는 확신도 기준에서 맞힌 비율이다. 기준값은 몇 달 치 보류 리뷰로 정한다. 손으로 고른 약 100개 예시를 회귀 시험용으로 둔다.<\/li>\n<li><strong>목표 정밀도를 어떻게 정했나<\/strong> — 곡선 분석이 아니라 <strong>사용자 반응<\/strong>으로 정했다.<ul>\n<li>처음 70% → 베타 사용자들이 \"너무 보수적\"이라고 해서 <strong>50%<\/strong>로 낮췄다. 그래도 만족도가 떨어지지 않았다<\/li>\n<li>V2에서는 리뷰어가 작성자보다 먼저 제안을 볼 수 있게 되자 <strong>40%<\/strong>로 낮췄다<\/li>\n<li>언어별로 기준값을 따로 두자 recall@50이 올랐다(전체 66% 이상)<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>온라인 결과<\/strong> (논문 Table 1):<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>V1 (엔지니어 50%, 3개월)<\/th>\n<th>V2 (전체 배포)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>확신 있는 예측<\/td>\n<td>34.3%<\/td>\n<td>49.0%<\/td>\n<\/tr>\n<tr>\n<td>작성자가 미리 봄<\/td>\n<td>10.7%<\/td>\n<td>10.7%<\/td>\n<\/tr>\n<tr>\n<td><strong>적용됨<\/strong>(전체 리뷰어 코멘트 대비)<\/td>\n<td><strong>4.9%<\/strong><\/td>\n<td><strong>7.5%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>자주 보이는 \"약 5%\"와 \"7.5%\"는 서로 모순이 아니라 <strong>V1과 V2<\/strong>의 차이다.\n- <strong>다른 발견<\/strong>: 모델 크기 2배 → recall +25%. \"Done.\"으로 답한 코멘트만으로 학습 → recall 20% 이상 상승. 코멘트에서 5줄 넘게 떨어진 수정 제외 → 👎 비율 8.5% → 6.7%. 👍/👎 데이터는 \"비교적 정보가 적다\"고 했다.\n- <strong>A/B 시험<\/strong>: V1을 50%에 배포하며 A/B를 했다고 적었지만, 처치군/대조군 수치는 공개하지 않았다.<\/p>\n<\/li>\n<\/ul>\n<h3>② AutoCommenter (Vijayvergiya 외, AIware 2024)<\/h3>\n<ul>\n<li><strong>무엇<\/strong>: 모범 사례(스타일 가이드) 위반을 찾아 해당 가이드 URL과 함께 코멘트한다. T5 다중 과제 모델이다.<\/li>\n<li><strong>배포 단계<\/strong>: 개발자 본인 사용 → 자원자 약 3,000명 → 개발자 절반 A/B → 2023-10 전면 배포.<\/li>\n<li><strong>유용 비율<\/strong>(👍 / 전체 피드백)의 변화:<ul>\n<li>초기 약 <strong>54%<\/strong>에서 정체(목표 80%)<\/li>\n<li>유용하지 않은 가이드 URL 17개를 끄자 66%(평가자 74%)<\/li>\n<li>5개 더 끄고 요약을 다시 쓰자 <strong>80% 이상<\/strong><\/li>\n<\/ul>\n<\/li>\n<li><strong>피드백을 받은 비율<\/strong>: 리뷰 코멘트의 약 10%, IDE 진단의 약 2%. 유용 비율은 이 10%만으로 계산한 값이다.<\/li>\n<li><strong>해결 추정<\/strong>: 코멘트가 다음 스냅샷에서 사라진 비율 약 50% × 수작업 40건 확인 시 진짜 수정 80% → 약 <strong>40%<\/strong>.<\/li>\n<li><strong>A/B 결과<\/strong>: 리뷰 소요 시간·반복 횟수에 <strong>유의한 변화 없음<\/strong>.<\/li>\n<li><strong>저자들의 경고<\/strong>: \"내재적(오프라인) 평가는 실제 성능을 잘 예측하지 못했다.\"<\/li>\n<li><strong>실패 사례<\/strong>: 여러 가이드를 담은 긴 페이지는 실행하기 어려웠다. push_back vs emplace_back을 체계적으로 과다 지적했다. 사소한 것을 지적했다. 확신도 기준 0.98은 너무 보수적이었다.<\/li>\n<\/ul>\n<h3>③ Tricorder와 Critique — 정적분석을 리뷰에 붙인 경험 (Sadowski 외 ICSE 2015 · CACM 2018 · <em>Software Engineering at Google<\/em> 20장)<\/h3>\n<ul>\n<li>새 검사기는 \"적어도 <strong>90%<\/strong> 경우에 진짜 문제를 가리켜야\" 한다. 전체 유효 오탐률은 \"5% 바로 아래\"다.<\/li>\n<li>리뷰어 화면에 \"Not useful\"과 \"Please fix\" 버튼이 있다. Not useful 비율이 계속 높은 검사기는 끈다.<\/li>\n<li><a href=\"#08\">08장<\/a>에서 자세히 다룬다.<\/li>\n<\/ul>\n<h3>④ Google 전체 전략 블로그 (2024-06)<\/h3>\n<ul>\n<li>오프라인 지표는 대략적인 대리 지표로 보고, <strong>온라인 실험으로 결정<\/strong>한다.<\/li>\n<li>\"코드 작성자가 점점 AI 제안의 <strong>리뷰어<\/strong>가 된다.\"<\/li>\n<li>사용자가 직접 기억해서 켜야 하는 기능은 \"규모가 커지지 않았다.\"<\/li>\n<\/ul>\n<blockquote>\n<p>2025~2026년에 Google이 LLM으로 리뷰 코멘트를 생성하는 논문은 찾지 못했다.<\/p>\n<\/blockquote>\n<hr />\n<h2>Meta<\/h2>\n<h3>① MetaMateCR (arXiv 2507.13499, FSE 2026 산업 트랙)<\/h3>\n<ul>\n<li><strong>무엇<\/strong>: 리뷰어 코멘트를 받아 <strong>수정 패치<\/strong>를 만든다. 코멘트를 쓰는 도구가 아니다.<\/li>\n<li><strong>설계<\/strong>: Llama 3.1 70B를 코멘트-패치 6.4만 쌍으로 미세조정했다. GPT-4o 필터가 \"실행 가능한 코멘트인가\"를 판단한다(F1 0.85). 린트·테스트·빌드를 통과한 패치만 보여 준다.<\/li>\n<li><strong>오프라인<\/strong>: 정확 일치(206건) GPT-4o 59.22% / 작은 미세조정 모델 63.11% / 큰 모델 67.96%.<\/li>\n<li><strong>온라인에서 배운 것<\/strong>:<ul>\n<li>첫 실험에서 GPT-4o 패치를 <strong>리뷰어에게도<\/strong> 보여 줬더니 리뷰 시간이 <strong>5.5% 늘었다<\/strong>(p=.029). 그래서 철회했다<\/li>\n<li>작성자에게만 보여 주자 시간 증가가 없었다<\/li>\n<li>실행 가능한 코멘트 중 AI 패치로 고쳐진 비율: GPT-4o 10.7% → 큰 미세조정 모델 <strong>19.75%<\/strong><\/li>\n<\/ul>\n<\/li>\n<li>논문의 표와 본문 수치가 일부 맞지 않는다.<\/li>\n<\/ul>\n<h3>② RADAR (arXiv 2605.30208, 2026, 프리프린트)<\/h3>\n<ul>\n<li>위험도 점수로 거른 <strong>저위험 diff를 LLM이 자동 승인<\/strong>한다. 확신도 8/10 이상이고 모든 변경이 \"안전\" 범주일 때만이다.<\/li>\n<li>리뷰 53.5만 건, 머지 33.2만 건. 되돌림 비율은 비대상 diff의 약 1/3, 장애 비율은 약 1/50, 리뷰 시간 중앙값 −35%.<\/li>\n<li><strong>주의<\/strong>: 무작위 배정이 없다. 애초에 저위험 diff만 골랐다. LLM 단계 자체의 오프라인·사람 평가가 없다.<\/li>\n<\/ul>\n<h3>③ ARCTIC (arXiv 2607.29516, 2026, 프리프린트)<\/h3>\n<p>Meta의 기존 제로샷 AI 리뷰어와 사람 리뷰의 <strong>주제 분포<\/strong>를 비교했다.<\/p>\n<table>\n<thead>\n<tr>\n<th>주제<\/th>\n<th>사람<\/th>\n<th>AI<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>모범 사례<\/td>\n<td>7.2%<\/td>\n<td><strong>30.8%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>보안<\/td>\n<td>19.1%<\/td>\n<td><strong>2.0%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>정확성<\/td>\n<td>44.4%<\/td>\n<td>25.5%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>AI는 모범 사례 지적이 지나치게 많고 보안·정확성 지적은 적었다. 단, 주제 분류를 LLM이 했고 그 정확도는 보고하지 않았다.<\/p>\n<h3>④ NudgeBot (Shan 외, FSE 2022) · 리뷰어 추천 (arXiv 2312.17169)<\/h3>\n<ul>\n<li>NudgeBot: 엔지니어 3만 명 이상을 대상으로 한 군집 무작위 A/B. 리뷰 소요 시간 −6.8%(<a href=\"https://engineering.fb.com/2022/11/16/culture/meta-code-review-time-improving/\">Meta 엔지니어링 블로그 2022-11<\/a>). 대표 지표는 <strong>P75 리뷰 소요 시간<\/strong>이고, 대충 승인하는 것을 막으려고 <strong>\"실제로 diff를 본 시간(Eyeball Time)\"<\/strong>을 보조 지표로 함께 봤다.<\/li>\n<li>리뷰어 추천 A/B 3회: \"백테스트(과거 데이터 재현) 결과가 통제된 실서비스 실험과 <strong>너무 달라서 놀랐다<\/strong>.\"<\/li>\n<\/ul>\n<h3>⑤ TestGen-LLM (FSE 2024) — 리뷰는 아니지만 \"필터 뒤에 LLM 출력\"의 선례<\/h3>\n<p>생성한 테스트를 단계별로 걸렀다: 빌드 75% → 안정 통과 57% → 커버리지 증가 25%. 추천의 73%가 수용되었다.<\/p>\n<hr />\n<h2>Microsoft<\/h2>\n<ul>\n<li><strong>사내 AI 리뷰어 (Engineering@Microsoft 블로그 2025-07, B)<\/strong>: PR의 90% 이상(월 60만 건 이상)에 적용했고, 저장소 5,000개에서 PR 완료 시간 중앙값이 10~20% 개선되었다고 했다. <strong>평가 방법·정확도·한계는 공개하지 않았다.<\/strong> 동료 심사 논문은 찾지 못했다.<\/li>\n<li><strong>CodeReviewer (FSE 2022)<\/strong>: <a href=\"#04\">04장<\/a> 참고. 자세한 내용은 <a href=\"#p-codereviewer2022\">논문 자세히 보기<\/a>. 오픈소스 데이터만 썼다.<\/li>\n<li><strong>Bosu 외 2015<\/strong>: \"유용한 코멘트\"를 정의한 사내 연구. <a href=\"#01\">01장<\/a> 참고.<\/li>\n<li><strong>Nudge (TOSEM 2022)<\/strong>: 147개 저장소 무작위 시험. PR 해결 시간 −60%(PR 8,500개), 알림의 73%가 긍정 평가.<\/li>\n<\/ul>\n<hr />\n<h2>GitHub (Copilot code review)<\/h2>\n<ul>\n<li><strong>운영 수치 (<a href=\"https://github.blog/ai-and-ml/github-copilot/60-million-copilot-code-reviews-and-counting/\">GitHub 블로그 2026-03<\/a>, 자기 보고)<\/strong>: 리뷰의 71%가 실행 가능한 피드백을 냈다. 29%는 코멘트를 남기지 않았다(정의 미공개). 리뷰당 코멘트 약 5.1개. 1.2만 개 이상 조직이 모든 PR에 사용한다.<\/li>\n<li><strong>쓰는 신호<\/strong>: 👍/👎, 설문, 머지 전 해결 여부.<\/li>\n<li><strong>도구 교체의 교훈 (2026-07, 자기 보고)<\/strong>: 공용 CLI 도구(glob, grep, view)로 바꾸자 오히려 비용이 늘고 유용한 코멘트가 줄었다. 도구 설명을 <strong>리뷰어의 작업 흐름<\/strong>에 맞게 다시 쓰자 비용이 약 20% 줄었다.<\/li>\n<li><strong>ReviewBench 오프라인 ↔ 온라인 대조 (자기 보고)<\/strong>: Lite 등급 앙상블 변경에서 온라인 addressed rate +8.0%, recall +13.6%, 코멘트 수 +61%, 비용 −8.0%. 심각 코멘트 증가는 오프라인 예측 +227%, 온라인 +262%로 방향이 일치했다.<\/li>\n<li><strong>비용<\/strong>: 리뷰 1회 약 $0.25(Lite) / $1.50(Balanced) / $10(Max). 기본 설정에서 Copilot 리뷰는 필수 승인으로 세지 않는다(<a href=\"https://docs.github.com/en/copilot/concepts/agents/code-review\">GitHub 문서<\/a>).<\/li>\n<li>ReviewBench 자체는 <a href=\"#05\">05장<\/a>에서 다룬다.<\/li>\n<\/ul>\n<h2>Atlassian (RovoDev Code Reviewer, ICSE-SEIP 2026, A)<\/h2>\n<ul>\n<li><strong>설계<\/strong>: Claude 3.5 Sonnet(미세조정 없음) + <strong>사실성 판정기<\/strong>(gpt-4o-mini) + <strong>실행 가능성 필터<\/strong>(ModernBERT, 라벨 5만 개 이상으로 학습).<\/li>\n<li><strong>오프라인<\/strong>: 사람 코멘트와 일치하는 코멘트가 있는 PR은 약 <strong>7%<\/strong>뿐이었다. 실행 가능성 필터는 15~20점을 올렸고, 사실성 판정기는 효과가 거의 없었다. 판정기 검증은 47개 코멘트로만 했다(Spearman 0.69).<\/li>\n<li><strong>온라인<\/strong>:<ul>\n<li><strong>코드 해결률<\/strong>(코멘트 단 줄이 다음 커밋에서 바뀐 비율): RovoDev <strong>38.70%<\/strong>, 사람 <strong>44.45%<\/strong>(측정 기간 2025-07-10~15)<\/li>\n<li>PR 사이클 시간 중앙값 20.73h → 14.35h(약 −31%). 사람 코멘트 수 4.45 → 2.87개/PR(−35.6%)<\/li>\n<li>규모: 코멘트 5.4만 개 이상, 저장소 약 2,000개<\/li>\n<\/ul>\n<\/li>\n<li><strong>유형별 해결률 (후속 ASE 2025 산업 발표)<\/strong>: 가독성 43.3%, 버그 41.9%, 유지보수성 36.2%, 설계 28.6%. 쉬운 요약은 <a href=\"https://www.atlassian.com/blog/atlassian-engineering/atlassian-rovo-dev-research-what-types-of-code-review-comments-do-developers-most-frequently-resolve\">Atlassian 엔지니어링 블로그<\/a>에 있다.<\/li>\n<li><strong>주의<\/strong>: 코멘트가 있는 PR과 없는 PR의 비교라 관찰 연구다. 사람 코멘트 감소는 \"대체\"일 수도 있다.<\/li>\n<\/ul>\n<h2>Uber (uReview, 엔지니어링 블로그 2025-08, B)<\/h2>\n<ul>\n<li><strong>설계<\/strong>: 생성기 3개(일반, 모범 사례, 보안) → 확신도 점수 → 의미 중복 병합 → 범주 억제기. 기준값은 생성기·언어·범주별로 다르게 두었지만 값은 공개하지 않았다.<\/li>\n<li><strong>결과<\/strong>: 코멘트의 75%가 유용 평가, 65%가 반영. 반영의 정의: 같은 변경을 5번 다시 돌렸을 때 비슷한 코멘트가 다시 나오지 않으면 반영된 것으로 본다. 주간 diff 약 6.5만 개의 90% 이상을 처리한다(블로그 안에 \"월 6.5만\"이라는 다른 표현도 있다). 지연 중앙값 4분.<\/li>\n<li>생성기 Claude-4-Sonnet + 채점 o4-mini-high 조합의 F1이 가장 좋았다. 리뷰어는 \"코드에만 접근\"한다.<\/li>\n<\/ul>\n<h2>ByteDance (BitsAI-CR, arXiv 2501.15134)<\/h2>\n<ul>\n<li><strong>설계<\/strong>: 규칙 219개 기반. 생성 → <strong>필터<\/strong> 2단계 구조. 규칙은 14일 outdated rate 약 25%, 정밀도 약 65%를 기준으로 퇴출한다(데이터 플라이휠).<\/li>\n<li><strong>결과<\/strong>: 온라인 정밀도 75.0%. Go 언어 outdated rate 26.7%(사람 기준 35~46%). 주간 활성 사용자 1.2만 명 이상. 설문 74.5%(102/137)가 가치를 인정했다.<\/li>\n<li><strong>필터 효과(오프라인)<\/strong>: 정밀도 57.03% → 65.59%, 재현율 45.50% → 39.77%. 필터가 <strong>결론을 먼저 내고 이유를 나중에<\/strong> 쓰게 하자 정밀도 77.09%(1.7초). 추론을 먼저 쓰게 하면 65.80%(31초).<\/li>\n<li>논문 안에서 정밀도 수치가 일부 맞지 않는다. 게재처는 확인하지 못했다.<\/li>\n<\/ul>\n<h2>Amazon<\/h2>\n<ul>\n<li><strong>CodeGuru Reviewer<\/strong> (ICSE 2023, A): 코드 변경 이력에서 정적 규칙 62개를 캐냈고, 그 추천의 <strong>73%<\/strong>가 개발자에게 수용되었다. 2025-11-07부터 신규 저장소 연결이 막혔다.<\/li>\n<li><strong>Amazon Q Developer<\/strong> GitHub 리뷰(<a href=\"https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/github-code-reviews.html\">AWS 문서<\/a>): 동작 설명만 있고 정확도 데이터는 공개되지 않았다.<\/li>\n<\/ul>\n<h2>AI 연구소·도구 회사 (자기 보고, 정의 주의)<\/h2>\n<table>\n<thead>\n<tr>\n<th>회사<\/th>\n<th>공개 내용<\/th>\n<th>수치<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Anthropic<\/strong> Claude Code Review (블로그 2026-03)<\/td>\n<td>실질 코멘트를 받은 PR 16% → 54%. 1,000줄 넘는 PR의 84%에서 평균 7.5개 발견. \"틀림\" 표시 1% 미만. 리뷰당 약 20분, $15~25<\/td>\n<td>자기 보고, \"틀림\" 표시 방법 미정의<\/td>\n<\/tr>\n<tr>\n<td>Anthropic 공개 <code>/code-review<\/code> 플러그인 (저장소)<\/td>\n<td>병렬 에이전트 4개(CLAUDE.md 준수 2, 버그 2) → <strong>이슈마다 검증 서브에이전트<\/strong>가 확인되지 않은 것을 버린다. 기존 문제·사소한 지적·린터가 잡을 것은 명시적으로 제외<\/td>\n<td>설계 공개, 수치 없음. 관리형 제품의 파이프라인과 같은지는 알 수 없다<\/td>\n<\/tr>\n<tr>\n<td><strong>OpenAI<\/strong> Codex 리뷰 (alignment 블로그 2025-12)<\/td>\n<td>리뷰어를 별도 과제로 훈련. <strong>recall 일부를 내주고 precision을 택했다<\/strong>. 코멘트의 52.7%가 코드 변경으로 이어짐(Codex PR 46%, 사람 PR 53%). 하루 외부 PR 10만 개 이상<\/td>\n<td>정밀도·재현율은 그림으로만 공개<\/td>\n<\/tr>\n<tr>\n<td><strong>Cursor Bugbot<\/strong> (블로그 <a href=\"https://cursor.com/blog/building-bugbot\">2026-01<\/a> · <a href=\"https://cursor.com/blog/bugbot-learning\">2026-04<\/a>)<\/td>\n<td>실험 40회로 해결률 52% → 70% 이상. 실행당 버그 0.4 → 0.7. 초기에는 8회 투표 방식, 이후 완전 에이전트형으로 바꾼 것이 가장 큰 개선<\/td>\n<td>해결률 = 머지 시점에 LLM이 \"고쳐졌다\"고 판정. 판정 프롬프트 비공개<\/td>\n<\/tr>\n<tr>\n<td><strong>Graphite Diamond<\/strong> (발표 2025)<\/td>\n<td>코멘트의 52%가 같은 PR 안에서 반영(사람 약 50%), 👎 4% 미만<\/td>\n<td>분모 미공개, 다른 사례 연구에서는 67%<\/td>\n<\/tr>\n<tr>\n<td><strong>CodeRabbit (2026-01)<\/strong><\/td>\n<td>수용률을 정밀도 대리 지표로 쓰는 평가 틀을 제시<\/td>\n<td>내부 수치 없음<\/td>\n<\/tr>\n<tr>\n<td><strong>xAI Grok Bot 팀<\/strong> (Lauren Tan 발표, AI Engineer CODE 2026-11 · x.ai 가이드 2026-09-10)<\/td>\n<td>에이전트가 PR을 만들고 AI 리뷰까지 돌린다. <strong>\"리뷰 확신이 높고 영향 범위(blast radius)가 작으면 자동 머지, 아니면 사람이 코드와 증거(proof)를 본다\"<\/strong>. 사람은 코드를 한 줄씩 읽는 대신 동작 영상·스크린샷·형식 검증 결과 같은 <strong>검증 산출물<\/strong>을 본다. 출시 후 퍼징(무작위 입력 시험)이 찾은 버그의 수정 PR은 자동 머지. 한 달(10월) 팀 전체 <strong>약 11,000 PR<\/strong>(기여자 약 227명), 발표자 개인 약 3,000 PR, 되돌림 비율 약 0.5%<\/td>\n<td>자기 보고. 흔히 \"한 명이 월 1만 건 자동 머지\"로 퍼졌지만 <strong>1.1만은 팀 전체<\/strong>이고, 자동 머지는 <strong>조건부<\/strong>다. 확신도 기준·blast radius 정의·제외 대상은 공개되지 않았다. 되돌림 비율은 나중 PR로 고친 버그를 세지 않는다(발표자 본인 언급). AI 리뷰의 정밀도·반영률 같은 수치는 없다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>대기업이 아닌 회사들의 산업 논문 (A등급 포함)<\/h2>\n<table>\n<thead>\n<tr>\n<th>회사<\/th>\n<th>연구<\/th>\n<th>결과<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Beko<\/strong> (ICSE-SEIP 2025)<\/td>\n<td>Qodo PR-Agent + GPT-4<\/td>\n<td>코멘트 73.8% \"해결\"(개발자가 직접 붙이는 필수 라벨). PR 종료 시간 평균 5h52m → <strong>8h20m로 증가<\/strong>. 3개 프로젝트 중 1개만 빨라짐<\/td>\n<\/tr>\n<tr>\n<td><strong>Mozilla·Ubisoft<\/strong> (RevMate, 2024 프리프린트)<\/td>\n<td>리뷰어가 LLM 제안 코멘트를 골라 게시<\/td>\n<td>수용률 8.1% / 7.2%. 리팩터링 제안 약 18% vs 기능 제안 약 5%<\/td>\n<\/tr>\n<tr>\n<td><strong>Ericsson<\/strong> (ICSME 2025 산업)<\/td>\n<td>GPT-4 리뷰<\/td>\n<td>전문가 평가 긍정 6, 중립 8, 부정 10<\/td>\n<\/tr>\n<tr>\n<td><strong>Kuaishou<\/strong> (ICML 2025 Spotlight)<\/td>\n<td>코드 슬라이싱 + 검증기<\/td>\n<td>C++ 장애 45건 오프라인. 핵심 버그 포함률 최고 20~39%, 오경보율 75% 이상. 사용자 연구 없음<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>회사들의 방식에서 반복해서 보이는 패턴 (관찰, 권고 아님)<\/h2>\n<ul>\n<li><strong>생성 뒤에 거르는 단계<\/strong>: Uber(확신도·병합·억제), ByteDance(필터), Atlassian(실행 가능성·사실성), Anthropic 플러그인(이슈별 검증), Meta MetaMateCR(빌드·테스트 통과만 노출).<\/li>\n<li><strong>잡음 많은 규칙·범주를 끄는 운영<\/strong>: Google AutoCommenter(URL 22개 억제), Google Tricorder(Not useful 높은 검사기 끔), ByteDance(정밀도·outdated 기준으로 규칙 퇴출).<\/li>\n<li><strong>온라인 실험을 최종 판단으로<\/strong>: Google(\"오프라인은 대리 지표\"), Meta(\"백테스트와 실서비스가 너무 달랐다\"), GitHub(오프라인 예측을 온라인으로 대조).<\/li>\n<li><strong>누구에게 보여 주나가 결과를 바꾼다<\/strong>: Meta(리뷰어에게 보이면 리뷰 시간 +5.5%), Google(V2에서 리뷰어 사전 검토로 목표 정밀도를 40%로 낮춤).<\/li>\n<li><strong>자동 승인·자동 머지의 안전 지표로 되돌림 비율을 쓴다<\/strong> (회사별 단계는 <a href=\"#07\">07장<\/a>): Meta RADAR(저위험 diff 자동 승인), xAI Grok Bot(조건부 자동 머지, 약 0.5%). 둘 다 \"위험이 낮은 변경만\"이라는 조건을 붙인다. 되돌림 없이 뒤따른 PR로 고친 버그는 이 지표에 잡히지 않는다.<\/li>\n<li><strong>같은 결과를 두고 방향이 엇갈린다<\/strong>: PR 시간이 Atlassian은 −31%, Microsoft는 −10~20%, Beko는 <strong>+42%<\/strong>(5h52m → 8h20m). 어느 쪽도 무작위 대조 실험이 아니다.<\/li>\n<\/ul>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:620px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\" role=\"img\" aria-label=\"AI 리뷰 도입 후 PR 시간 변화\" data-minw=\"620\"><title>AI 리뷰 도입 후 PR 시간 변화<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"720\" height=\"330\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">AI 리뷰 도입 후 PR 시간 — 줄었다는 곳도, 늘었다는 곳도 있다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">왼쪽 = 빨라짐 · 오른쪽 = 느려짐. 무작위 실험(A/B)은 두 곳뿐<\/text><rect x=\"20\" y=\"61\" width=\"12\" height=\"10\" rx=\"2\" class=\"f-d1\"/><text x=\"40.0\" y=\"70.0\" class=\"t-sm\">줄었거나 변화 없음<\/text><rect x=\"163.76\" y=\"61\" width=\"12\" height=\"10\" rx=\"2\" class=\"f-d2\"/><text x=\"183.8\" y=\"70.0\" class=\"t-sm\">늘었음<\/text><line class=\"grid\" x1=\"300.0\" y1=\"84\" x2=\"300.0\" y2=\"288\"/><text x=\"300.0\" y=\"304.0\" class=\"t-mut\" text-anchor=\"middle\">-50%<\/text><line class=\"grid\" x1=\"397.5\" y1=\"84\" x2=\"397.5\" y2=\"288\"/><text x=\"397.5\" y=\"304.0\" class=\"t-mut\" text-anchor=\"middle\">-25%<\/text><line class=\"axis\" x1=\"495.0\" y1=\"84\" x2=\"495.0\" y2=\"288\"/><text x=\"495.0\" y=\"304.0\" class=\"t-mut\" text-anchor=\"middle\">0<\/text><line class=\"grid\" x1=\"592.5\" y1=\"84\" x2=\"592.5\" y2=\"288\"/><text x=\"592.5\" y=\"304.0\" class=\"t-mut\" text-anchor=\"middle\">+25%<\/text><line class=\"grid\" x1=\"690.0\" y1=\"84\" x2=\"690.0\" y2=\"288\"/><text x=\"690.0\" y=\"304.0\" class=\"t-mut\" text-anchor=\"middle\">+50%<\/text><text x=\"20.0\" y=\"103.0\" class=\"t-b\">Atlassian RovoDev<\/text><text x=\"20.0\" y=\"118.0\" class=\"t-mut\">PR 사이클 시간 중앙값 · 관찰<\/text><g class=\"tip\"><title>Atlassian RovoDev: −31% (PR 사이클 시간 중앙값 · 관찰)<\/title><rect class=\"hit\" x=\"300\" y=\"88\" width=\"390\" height=\"34\"/><rect x=\"374.1\" y=\"94\" width=\"120.9\" height=\"16\" rx=\"4\" class=\"f-d1 hl\"/><text x=\"366.1\" y=\"107.0\" class=\"t-val\" text-anchor=\"end\">−31%<\/text><\/g><text x=\"20.0\" y=\"143.0\" class=\"t-b\">Microsoft 사내 리뷰어<\/text><text x=\"20.0\" y=\"158.0\" class=\"t-mut\">PR 완료 시간 중앙값 · 관찰(방법 미공개)<\/text><g class=\"tip\"><title>Microsoft 사내 리뷰어: −10~−20% (PR 완료 시간 중앙값 · 관찰(방법 미공개))<\/title><rect class=\"hit\" x=\"300\" y=\"128\" width=\"390\" height=\"34\"/><rect x=\"417.0\" y=\"134\" width=\"39.0\" height=\"16\" rx=\"4\" class=\"f-d1 hl\" fill-opacity=\".55\"/><text x=\"409.0\" y=\"147.0\" class=\"t-val\" text-anchor=\"end\">−10~−20%<\/text><\/g><text x=\"20.0\" y=\"183.0\" class=\"t-b\">Google AutoCommenter<\/text><text x=\"20.0\" y=\"198.0\" class=\"t-mut\">리뷰 시간 · A/B<\/text><g class=\"tip\"><title>Google AutoCommenter: 유의한 변화 없음 (리뷰 시간 · A/B)<\/title><rect class=\"hit\" x=\"300\" y=\"168\" width=\"390\" height=\"34\"/><circle cx=\"495.0\" cy=\"182\" r=\"6\" class=\"f-d1 ring hl\"/><text x=\"507.0\" y=\"187.0\" class=\"t-val\">유의한 변화 없음<\/text><\/g><text x=\"20.0\" y=\"223.0\" class=\"t-b\">Meta MetaMateCR<\/text><text x=\"20.0\" y=\"238.0\" class=\"t-mut\">리뷰어에게도 패치 노출 · A/B<\/text><g class=\"tip\"><title>Meta MetaMateCR: +5.5% → 철회 (리뷰어에게도 패치 노출 · A/B)<\/title><rect class=\"hit\" x=\"300\" y=\"208\" width=\"390\" height=\"34\"/><rect x=\"495.0\" y=\"214\" width=\"21.5\" height=\"16\" rx=\"4\" class=\"f-d2 hl\"/><text x=\"524.5\" y=\"227.0\" class=\"t-val\">+5.5% → 철회<\/text><\/g><text x=\"20.0\" y=\"263.0\" class=\"t-b\">Beko (Qodo PR-Agent)<\/text><text x=\"20.0\" y=\"278.0\" class=\"t-mut\">PR 종료 시간 평균 · 전후 비교<\/text><g class=\"tip\"><title>Beko (Qodo PR-Agent): +42% (PR 종료 시간 평균 · 전후 비교)<\/title><rect class=\"hit\" x=\"300\" y=\"248\" width=\"390\" height=\"34\"/><rect x=\"495.0\" y=\"254\" width=\"163.8\" height=\"16\" rx=\"4\" class=\"f-d2 hl\"/><text x=\"666.8\" y=\"267.0\" class=\"t-val\">+42%<\/text><\/g><text x=\"20.0\" y=\"318.0\" class=\"t-mut\">Microsoft는 범위(옅은 막대)로 보고. 조건이 서로 달라 숫자끼리 비교하지 않는다<\/text><\/svg><\/div><figcaption>그림 6-2. AI 리뷰 도입 후 PR 시간 변화 — 줄었다는 곳과 늘었다는 곳이 공존한다. 무작위 실험은 Google·Meta 두 곳뿐<\/figcaption><\/figure>\n<h2>스스로 판단할 질문<\/h2>\n<ol>\n<li>우리가 볼 온라인 지표는 무엇인가? \"해결\"의 정의는 줄 변경, 작성자 라벨, LLM 판정, 재실행 비교 중 무엇인가?<\/li>\n<li>피드백 버튼을 둔다면, 피드백을 남기는 비율(Google은 약 10%)이 낮을 때 그 값을 어떻게 해석할 것인가?<\/li>\n<li>에이전트 코멘트를 리뷰어에게도 보여 줄 것인가, 작성자에게만 보여 줄 것인가?<\/li>\n<li>잡음 많은 관점·규칙을 끄는 운영 기준(예: 일정 기간 유용 비율)을 둘 것인가?<\/li>\n<li>오프라인 점수 개선이 온라인 개선으로 이어지는지 대조할 방법이 있는가?<\/li>\n<li>회사 블로그 수치를 우리 목표치로 삼아도 되는가? 정의·대조군·자기 보고 여부를 확인했는가?<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<p><strong>Google<\/strong><\/p>\n<ul>\n<li>Frömmgen 외 2024 원문 — <a href=\"https://storage.googleapis.com/gweb-research2023-media/pubtools/7525.pdf\">https://storage.googleapis.com/gweb-research2023-media/pubtools/7525.pdf<\/a> (A, ok)<\/li>\n<li>Google Research 블로그 2023 — <a href=\"https://research.google/blog/resolving-code-review-comments-with-ml/\">https://research.google/blog/resolving-code-review-comments-with-ml/<\/a> (B, ok)<\/li>\n<li>AutoCommenter — <a href=\"https://arxiv.org/html/2405.13565v1\">https://arxiv.org/html/2405.13565v1<\/a> (A, ok)<\/li>\n<li>전략 블로그 2024 — <a href=\"https://research.google/blog/ai-in-software-engineering-at-google-progress-and-the-path-ahead/\">https://research.google/blog/ai-in-software-engineering-at-google-progress-and-the-path-ahead/<\/a> (B, ok)<\/li>\n<li>SWE at Google 20장 — <a href=\"https://abseil.io/resources/swe-book/html/ch20.html\">https://abseil.io/resources/swe-book/html/ch20.html<\/a> (B, ok) · CACM 2018 — <a href=\"https://6826.csail.mit.edu/2020/papers/google-analysis-cacm.pdf\">https://6826.csail.mit.edu/2020/papers/google-analysis-cacm.pdf<\/a> (A, ok)<\/li>\n<\/ul>\n<p><strong>Meta<\/strong><\/p>\n<ul>\n<li>MetaMateCR — <a href=\"https://arxiv.org/html/2507.13499v1\">https://arxiv.org/html/2507.13499v1<\/a> · RADAR — <a href=\"https://arxiv.org/html/2605.30208\">https://arxiv.org/html/2605.30208<\/a> · ARCTIC — <a href=\"https://arxiv.org/html/2607.29516\">https://arxiv.org/html/2607.29516<\/a><\/li>\n<li>NudgeBot — <a href=\"https://2022.esec-fse.org/details/fse-2022-research-papers/26/Using-Nudges-to-Accelerate-Code-Reviews-at-Scale\">https://2022.esec-fse.org/details/fse-2022-research-papers/26/Using-Nudges-to-Accelerate-Code-Reviews-at-Scale<\/a> · <a href=\"https://engineering.fb.com/2022/11/16/culture/meta-code-review-time-improving/\">https://engineering.fb.com/2022/11/16/culture/meta-code-review-time-improving/<\/a><\/li>\n<li>리뷰어 추천 — <a href=\"https://arxiv.org/html/2312.17169v2\">https://arxiv.org/html/2312.17169v2<\/a> · TestGen-LLM — <a href=\"https://arxiv.org/abs/2402.09171\">https://arxiv.org/abs/2402.09171<\/a><\/li>\n<\/ul>\n<p><strong>Microsoft<\/strong><\/p>\n<ul>\n<li><a href=\"https://devblogs.microsoft.com/engineering-at-microsoft/enhancing-code-quality-at-scale-with-ai-powered-code-reviews/\">https://devblogs.microsoft.com/engineering-at-microsoft/enhancing-code-quality-at-scale-with-ai-powered-code-reviews/<\/a> (B) · Nudge TOSEM — <a href=\"https://arxiv.org/abs/2011.12468\">https://arxiv.org/abs/2011.12468<\/a><\/li>\n<\/ul>\n<p><strong>GitHub<\/strong><\/p>\n<ul>\n<li><a href=\"https://github.blog/ai-and-ml/github-copilot/60-million-copilot-code-reviews-and-counting/\">https://github.blog/ai-and-ml/github-copilot/60-million-copilot-code-reviews-and-counting/<\/a> · <a href=\"https://github.blog/ai-and-ml/github-copilot/better-tools-made-copilot-code-review-worse-heres-how-we-actually-improved-it/\">https://github.blog/ai-and-ml/github-copilot/better-tools-made-copilot-code-review-worse-heres-how-we-actually-improved-it/<\/a> · <a href=\"https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/\">https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/<\/a> · <a href=\"https://docs.github.com/en/copilot/concepts/agents/code-review\">https://docs.github.com/en/copilot/concepts/agents/code-review<\/a> (B)<\/li>\n<\/ul>\n<p><strong>Atlassian · Uber · ByteDance · Amazon<\/strong><\/p>\n<ul>\n<li>RovoDev — <a href=\"https://arxiv.org/pdf/2601.01129\">https://arxiv.org/pdf/2601.01129<\/a> (A) · 유형별 해결률 — <a href=\"https://arxiv.org/pdf/2510.05450\">https://arxiv.org/pdf/2510.05450<\/a> · <a href=\"https://www.atlassian.com/blog/atlassian-engineering/atlassian-rovo-dev-research-what-types-of-code-review-comments-do-developers-most-frequently-resolve\">https://www.atlassian.com/blog/atlassian-engineering/atlassian-rovo-dev-research-what-types-of-code-review-comments-do-developers-most-frequently-resolve<\/a><\/li>\n<li>uReview — <a href=\"https://www.uber.com/blog/ureview/\">https://www.uber.com/blog/ureview/<\/a> (B)<\/li>\n<li>BitsAI-CR — <a href=\"https://arxiv.org/html/2501.15134\">https://arxiv.org/html/2501.15134<\/a> (D)<\/li>\n<li>CodeGuru 규칙 채굴 — <a href=\"https://amazon.science/publications/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes\">https://amazon.science/publications/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes<\/a> (A)<\/li>\n<li>Amazon Q Developer GitHub 리뷰 문서 — <a href=\"https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/github-code-reviews.html\">https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/github-code-reviews.html<\/a> (B, 2026-11-25 추가)<\/li>\n<\/ul>\n<p><strong>AI 연구소·도구 회사<\/strong><\/p>\n<ul>\n<li>Anthropic — <a href=\"https://claude.com/blog/code-review\">https://claude.com/blog/code-review<\/a> · <a href=\"https://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-review/commands/code-review.md\">https://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-review/commands/code-review.md<\/a><\/li>\n<li>OpenAI — <a href=\"https://alignment.openai.com/scaling-code-verification/\">https://alignment.openai.com/scaling-code-verification/<\/a><\/li>\n<li>Cursor — <a href=\"https://cursor.com/blog/building-bugbot\">https://cursor.com/blog/building-bugbot<\/a> · <a href=\"https://cursor.com/blog/bugbot-learning\">https://cursor.com/blog/bugbot-learning<\/a> (D)<\/li>\n<li>Graphite 발표 — <a href=\"https://www.ai.engineer/talks/TswQeKftnaw-ai-powered-entomology-lessons-from-millions-ai\">https://www.ai.engineer/talks/TswQeKftnaw-ai-powered-entomology-lessons-from-millions-ai<\/a> (C, partial) · CodeRabbit — <a href=\"https://coderabbit.ai/blog/framework-for-evaluating-ai-code-review-tools\">https://coderabbit.ai/blog/framework-for-evaluating-ai-code-review-tools<\/a> (D)<\/li>\n<li>xAI Grok Bot — Lauren Tan 발표 「All Code Is Slop (Except Mine)」 <a href=\"https://ai.engineer/talks/O_zcc6Xl12g-all-code-is-slop-except-mine\">https://ai.engineer/talks/O_zcc6Xl12g-all-code-is-slop-except-mine<\/a> (C, 발표 정리문) · x.ai 가이드 <a href=\"https://x.ai/bot/guides/grok-bot-for-engineering\">https://x.ai/bot/guides/grok-bot-for-engineering<\/a> (D, 제품 안내) · 슬라이드 수치 정리 <a href=\"https://xiaohu.ai/en/article/lauren-tan-agent-code-quality/\">https://xiaohu.ai/en/article/lauren-tan-agent-code-quality/<\/a> (C, 2차 요약) — 2026-11-25 추가<\/li>\n<\/ul>\n<p><strong>기타 산업 논문<\/strong><\/p>\n<ul>\n<li>Beko — <a href=\"https://arxiv.org/html/2412.18531v2\">https://arxiv.org/html/2412.18531v2<\/a> (A) · Mozilla·Ubisoft — <a href=\"https://arxiv.org/html/2411.07091v1\">https://arxiv.org/html/2411.07091v1<\/a> (D) · Ericsson — <a href=\"https://arxiv.org/html/2507.19115v2\">https://arxiv.org/html/2507.19115v2<\/a> · Kuaishou — <a href=\"https://arxiv.org/abs/2505.17928\">https://arxiv.org/abs/2505.17928<\/a> (A)<\/li>\n<\/ul>", "text": " 06. 빅테크·대기업은 어떻게 만들고 평가하나 생성일 : 2026-11-19 최종 수정일 : 2026-11-25 수준 : 사례 근거 원장 : wave-1 A6a (Google·Meta·Microsoft) · wave-1 A6b (GitHub·Atlassian·Uber 등) · wave-2 W2c (Google 원문) 먼저 읽을 것 — 이 장의 숫자를 읽는 법 이 장의 숫자는 거의 모두 회사가 자기 시스템에 대해 낸 값(자기 보고) 이다. 대조군 없이 전후만 비교한 경우가 많다. 같은 이름의 지표(\"해결률\", \"addressed\", \"useful\")라도 회사마다 정의가 다르다. 숫자끼리 비교하지 말고, 각 회사가 무엇을 재기로 했는지 를 보는 것이 이 장의 목적이다. 정의 비교는 08장 에 있다. 동료 심사 논문(A)과 회사 블로그(B), 벤더 마케팅(D)을 구분해 표시했다. 한눈에 — 누가 무엇을 쟀나 회사 시스템 무엇을 하나 대표 온라인 지표(정의) 출처 등급 Google ML 코멘트 해결 리뷰어 코멘트 → 수정 코드 제안 전체 리뷰어 코멘트 중 ML 수정으로 해결된 비율 A Google AutoCommenter 모범 사례 위반 코멘트 유용 비율 = 👍/(👍+👎) A Google Tricorder 정적분석 결과를 리뷰에 표시 \"Not useful\" 클릭 비율 A Meta MetaMateCR 리뷰어 코멘트 → 수정 패치 실행 가능한 코멘트 중 AI 패치로 고쳐진 비율 A Meta RADAR 저위험 diff 자동 승인 되돌림(revert) 비율, 장애 비율 D Meta NudgeBot 오래된 리뷰 독촉 P75 리뷰 소요 시간 + 실제로 diff를 본 시간 A Microsoft 사내 AI 리뷰어 PR 코멘트 PR 완료 시간 B GitHub Copilot code review PR 코멘트 👍/👎, 머지 전 해결 여부, addressed rate B Atlassian RovoDev PR 코멘트 다음 커밋에서 그 줄이 바뀌었나 A Uber uReview PR 코멘트 유용 평가, 같은 변경 안에서 반영 B ByteDance BitsAI-CR 규칙 기반 리뷰 코멘트 정밀도, outdated rate(코멘트 단 줄이 이후 바뀐 비율) D Amazon CodeGuru Reviewer 변경 이력에서 캐낸 정적 규칙 개발자 수용률 A Anthropic Claude Code Review PR 코멘트 실질 코멘트를 받은 PR 비율, \"틀림\" 표시 비율 B OpenAI Codex 리뷰 PR 코멘트 코멘트 후 코드 변경 비율 B Cursor Bugbot PR 버그 탐지 머지 시점에 지적된 버그가 고쳐졌나(LLM 판정) D xAI(SpaceX) Grok Bot 팀 에이전트가 만든 PR을 AI가 리뷰, 조건부 자동 머지 되돌림(revert) 비율 약 0.5% C 그림 6-1. 회사들이 공통으로 쓰는 흐름 — 만들고, 거르고, 보여 주고, 듣고, 끈다(관찰이지 권고가 아니다) Google ① ML로 리뷰 코멘트 해결하기 (Frömmgen 외, ICSE-SEIP 2024 · Google Research 블로그 2023) 무엇 : 리뷰어가 \"여기 null 체크 필요\"라고 쓰면, 모델이 수정 코드를 제안한다. 작성자는 미리 보고(preview) 적용한다. 오프라인 평가 : 사람이 쓴 줄 코멘트의 보류된 시험 분할. 지표는 recall@X : 정밀도 X를 달성하는 확신도 기준에서 맞힌 비율이다. 기준값은 몇 달 치 보류 리뷰로 정한다. 손으로 고른 약 100개 예시를 회귀 시험용으로 둔다. 목표 정밀도를 어떻게 정했나 — 곡선 분석이 아니라 사용자 반응 으로 정했다. 처음 70% → 베타 사용자들이 \"너무 보수적\"이라고 해서 50% 로 낮췄다. 그래도 만족도가 떨어지지 않았다 V2에서는 리뷰어가 작성자보다 먼저 제안을 볼 수 있게 되자 40% 로 낮췄다 언어별로 기준값을 따로 두자 recall@50이 올랐다(전체 66% 이상) 온라인 결과 (논문 Table 1): V1 (엔지니어 50%, 3개월) V2 (전체 배포) 확신 있는 예측 34.3% 49.0% 작성자가 미리 봄 10.7% 10.7% 적용됨 (전체 리뷰어 코멘트 대비) 4.9% 7.5% 자주 보이는 \"약 5%\"와 \"7.5%\"는 서로 모순이 아니라 V1과 V2 의 차이다. - 다른 발견 : 모델 크기 2배 → recall +25%. \"Done.\"으로 답한 코멘트만으로 학습 → recall 20% 이상 상승. 코멘트에서 5줄 넘게 떨어진 수정 제외 → 👎 비율 8.5% → 6.7%. 👍/👎 데이터는 \"비교적 정보가 적다\"고 했다. - A/B 시험 : V1을 50%에 배포하며 A/B를 했다고 적었지만, 처치군/대조군 수치는 공개하지 않았다. ② AutoCommenter (Vijayvergiya 외, AIware 2024) 무엇 : 모범 사례(스타일 가이드) 위반을 찾아 해당 가이드 URL과 함께 코멘트한다. T5 다중 과제 모델이다. 배포 단계 : 개발자 본인 사용 → 자원자 약 3,000명 → 개발자 절반 A/B → 2023-10 전면 배포. 유용 비율 (👍 / 전체 피드백)의 변화: 초기 약 54% 에서 정체(목표 80%) 유용하지 않은 가이드 URL 17개를 끄자 66%(평가자 74%) 5개 더 끄고 요약을 다시 쓰자 80% 이상 피드백을 받은 비율 : 리뷰 코멘트의 약 10%, IDE 진단의 약 2%. 유용 비율은 이 10%만으로 계산한 값이다. 해결 추정 : 코멘트가 다음 스냅샷에서 사라진 비율 약 50% × 수작업 40건 확인 시 진짜 수정 80% → 약 40% . A/B 결과 : 리뷰 소요 시간·반복 횟수에 유의한 변화 없음 . 저자들의 경고 : \"내재적(오프라인) 평가는 실제 성능을 잘 예측하지 못했다.\" 실패 사례 : 여러 가이드를 담은 긴 페이지는 실행하기 어려웠다. push_back vs emplace_back을 체계적으로 과다 지적했다. 사소한 것을 지적했다. 확신도 기준 0.98은 너무 보수적이었다. ③ Tricorder와 Critique — 정적분석을 리뷰에 붙인 경험 (Sadowski 외 ICSE 2015 · CACM 2018 · Software Engineering at Google 20장) 새 검사기는 \"적어도 90% 경우에 진짜 문제를 가리켜야\" 한다. 전체 유효 오탐률은 \"5% 바로 아래\"다. 리뷰어 화면에 \"Not useful\"과 \"Please fix\" 버튼이 있다. Not useful 비율이 계속 높은 검사기는 끈다. 08장 에서 자세히 다룬다. ④ Google 전체 전략 블로그 (2024-06) 오프라인 지표는 대략적인 대리 지표로 보고, 온라인 실험으로 결정 한다. \"코드 작성자가 점점 AI 제안의 리뷰어 가 된다.\" 사용자가 직접 기억해서 켜야 하는 기능은 \"규모가 커지지 않았다.\" 2025~2026년에 Google이 LLM으로 리뷰 코멘트를 생성하는 논문은 찾지 못했다. Meta ① MetaMateCR (arXiv 2507.13499, FSE 2026 산업 트랙) 무엇 : 리뷰어 코멘트를 받아 수정 패치 를 만든다. 코멘트를 쓰는 도구가 아니다. 설계 : Llama 3.1 70B를 코멘트-패치 6.4만 쌍으로 미세조정했다. GPT-4o 필터가 \"실행 가능한 코멘트인가\"를 판단한다(F1 0.85). 린트·테스트·빌드를 통과한 패치만 보여 준다. 오프라인 : 정확 일치(206건) GPT-4o 59.22% / 작은 미세조정 모델 63.11% / 큰 모델 67.96%. 온라인에서 배운 것 : 첫 실험에서 GPT-4o 패치를 리뷰어에게도 보여 줬더니 리뷰 시간이 5.5% 늘었다 (p=.029). 그래서 철회했다 작성자에게만 보여 주자 시간 증가가 없었다 실행 가능한 코멘트 중 AI 패치로 고쳐진 비율: GPT-4o 10.7% → 큰 미세조정 모델 19.75% 논문의 표와 본문 수치가 일부 맞지 않는다. ② RADAR (arXiv 2605.30208, 2026, 프리프린트) 위험도 점수로 거른 저위험 diff를 LLM이 자동 승인 한다. 확신도 8/10 이상이고 모든 변경이 \"안전\" 범주일 때만이다. 리뷰 53.5만 건, 머지 33.2만 건. 되돌림 비율은 비대상 diff의 약 1/3, 장애 비율은 약 1/50, 리뷰 시간 중앙값 −35%. 주의 : 무작위 배정이 없다. 애초에 저위험 diff만 골랐다. LLM 단계 자체의 오프라인·사람 평가가 없다. ③ ARCTIC (arXiv 2607.29516, 2026, 프리프린트) Meta의 기존 제로샷 AI 리뷰어와 사람 리뷰의 주제 분포 를 비교했다. 주제 사람 AI 모범 사례 7.2% 30.8% 보안 19.1% 2.0% 정확성 44.4% 25.5% AI는 모범 사례 지적이 지나치게 많고 보안·정확성 지적은 적었다. 단, 주제 분류를 LLM이 했고 그 정확도는 보고하지 않았다. ④ NudgeBot (Shan 외, FSE 2022) · 리뷰어 추천 (arXiv 2312.17169) NudgeBot: 엔지니어 3만 명 이상을 대상으로 한 군집 무작위 A/B. 리뷰 소요 시간 −6.8%( Meta 엔지니어링 블로그 2022-11 ). 대표 지표는 P75 리뷰 소요 시간 이고, 대충 승인하는 것을 막으려고 \"실제로 diff를 본 시간(Eyeball Time)\" 을 보조 지표로 함께 봤다. 리뷰어 추천 A/B 3회: \"백테스트(과거 데이터 재현) 결과가 통제된 실서비스 실험과 너무 달라서 놀랐다 .\" ⑤ TestGen-LLM (FSE 2024) — 리뷰는 아니지만 \"필터 뒤에 LLM 출력\"의 선례 생성한 테스트를 단계별로 걸렀다: 빌드 75% → 안정 통과 57% → 커버리지 증가 25%. 추천의 73%가 수용되었다. Microsoft 사내 AI 리뷰어 (Engineering@Microsoft 블로그 2025-07, B) : PR의 90% 이상(월 60만 건 이상)에 적용했고, 저장소 5,000개에서 PR 완료 시간 중앙값이 10~20% 개선되었다고 했다. 평가 방법·정확도·한계는 공개하지 않았다. 동료 심사 논문은 찾지 못했다. CodeReviewer (FSE 2022) : 04장 참고. 자세한 내용은 논문 자세히 보기 . 오픈소스 데이터만 썼다. Bosu 외 2015 : \"유용한 코멘트\"를 정의한 사내 연구. 01장 참고. Nudge (TOSEM 2022) : 147개 저장소 무작위 시험. PR 해결 시간 −60%(PR 8,500개), 알림의 73%가 긍정 평가. GitHub (Copilot code review) 운영 수치 ( GitHub 블로그 2026-03 , 자기 보고) : 리뷰의 71%가 실행 가능한 피드백을 냈다. 29%는 코멘트를 남기지 않았다(정의 미공개). 리뷰당 코멘트 약 5.1개. 1.2만 개 이상 조직이 모든 PR에 사용한다. 쓰는 신호 : 👍/👎, 설문, 머지 전 해결 여부. 도구 교체의 교훈 (2026-07, 자기 보고) : 공용 CLI 도구(glob, grep, view)로 바꾸자 오히려 비용이 늘고 유용한 코멘트가 줄었다. 도구 설명을 리뷰어의 작업 흐름 에 맞게 다시 쓰자 비용이 약 20% 줄었다. ReviewBench 오프라인 ↔ 온라인 대조 (자기 보고) : Lite 등급 앙상블 변경에서 온라인 addressed rate +8.0%, recall +13.6%, 코멘트 수 +61%, 비용 −8.0%. 심각 코멘트 증가는 오프라인 예측 +227%, 온라인 +262%로 방향이 일치했다. 비용 : 리뷰 1회 약 $0.25(Lite) / $1.50(Balanced) / $10(Max). 기본 설정에서 Copilot 리뷰는 필수 승인으로 세지 않는다( GitHub 문서 ). ReviewBench 자체는 05장 에서 다룬다. Atlassian (RovoDev Code Reviewer, ICSE-SEIP 2026, A) 설계 : Claude 3.5 Sonnet(미세조정 없음) + 사실성 판정기 (gpt-4o-mini) + 실행 가능성 필터 (ModernBERT, 라벨 5만 개 이상으로 학습). 오프라인 : 사람 코멘트와 일치하는 코멘트가 있는 PR은 약 7% 뿐이었다. 실행 가능성 필터는 15~20점을 올렸고, 사실성 판정기는 효과가 거의 없었다. 판정기 검증은 47개 코멘트로만 했다(Spearman 0.69). 온라인 : 코드 해결률 (코멘트 단 줄이 다음 커밋에서 바뀐 비율): RovoDev 38.70% , 사람 44.45% (측정 기간 2025-07-10~15) PR 사이클 시간 중앙값 20.73h → 14.35h(약 −31%). 사람 코멘트 수 4.45 → 2.87개/PR(−35.6%) 규모: 코멘트 5.4만 개 이상, 저장소 약 2,000개 유형별 해결률 (후속 ASE 2025 산업 발표) : 가독성 43.3%, 버그 41.9%, 유지보수성 36.2%, 설계 28.6%. 쉬운 요약은 Atlassian 엔지니어링 블로그 에 있다. 주의 : 코멘트가 있는 PR과 없는 PR의 비교라 관찰 연구다. 사람 코멘트 감소는 \"대체\"일 수도 있다. Uber (uReview, 엔지니어링 블로그 2025-08, B) 설계 : 생성기 3개(일반, 모범 사례, 보안) → 확신도 점수 → 의미 중복 병합 → 범주 억제기. 기준값은 생성기·언어·범주별로 다르게 두었지만 값은 공개하지 않았다. 결과 : 코멘트의 75%가 유용 평가, 65%가 반영. 반영의 정의: 같은 변경을 5번 다시 돌렸을 때 비슷한 코멘트가 다시 나오지 않으면 반영된 것으로 본다. 주간 diff 약 6.5만 개의 90% 이상을 처리한다(블로그 안에 \"월 6.5만\"이라는 다른 표현도 있다). 지연 중앙값 4분. 생성기 Claude-4-Sonnet + 채점 o4-mini-high 조합의 F1이 가장 좋았다. 리뷰어는 \"코드에만 접근\"한다. ByteDance (BitsAI-CR, arXiv 2501.15134) 설계 : 규칙 219개 기반. 생성 → 필터 2단계 구조. 규칙은 14일 outdated rate 약 25%, 정밀도 약 65%를 기준으로 퇴출한다(데이터 플라이휠). 결과 : 온라인 정밀도 75.0%. Go 언어 outdated rate 26.7%(사람 기준 35~46%). 주간 활성 사용자 1.2만 명 이상. 설문 74.5%(102/137)가 가치를 인정했다. 필터 효과(오프라인) : 정밀도 57.03% → 65.59%, 재현율 45.50% → 39.77%. 필터가 결론을 먼저 내고 이유를 나중에 쓰게 하자 정밀도 77.09%(1.7초). 추론을 먼저 쓰게 하면 65.80%(31초). 논문 안에서 정밀도 수치가 일부 맞지 않는다. 게재처는 확인하지 못했다. Amazon CodeGuru Reviewer (ICSE 2023, A): 코드 변경 이력에서 정적 규칙 62개를 캐냈고, 그 추천의 73% 가 개발자에게 수용되었다. 2025-11-07부터 신규 저장소 연결이 막혔다. Amazon Q Developer GitHub 리뷰( AWS 문서 ): 동작 설명만 있고 정확도 데이터는 공개되지 않았다. AI 연구소·도구 회사 (자기 보고, 정의 주의) 회사 공개 내용 수치 Anthropic Claude Code Review (블로그 2026-03) 실질 코멘트를 받은 PR 16% → 54%. 1,000줄 넘는 PR의 84%에서 평균 7.5개 발견. \"틀림\" 표시 1% 미만. 리뷰당 약 20분, $15~25 자기 보고, \"틀림\" 표시 방법 미정의 Anthropic 공개 /code-review 플러그인 (저장소) 병렬 에이전트 4개(CLAUDE.md 준수 2, 버그 2) → 이슈마다 검증 서브에이전트 가 확인되지 않은 것을 버린다. 기존 문제·사소한 지적·린터가 잡을 것은 명시적으로 제외 설계 공개, 수치 없음. 관리형 제품의 파이프라인과 같은지는 알 수 없다 OpenAI Codex 리뷰 (alignment 블로그 2025-12) 리뷰어를 별도 과제로 훈련. recall 일부를 내주고 precision을 택했다 . 코멘트의 52.7%가 코드 변경으로 이어짐(Codex PR 46%, 사람 PR 53%). 하루 외부 PR 10만 개 이상 정밀도·재현율은 그림으로만 공개 Cursor Bugbot (블로그 2026-01 · 2026-04 ) 실험 40회로 해결률 52% → 70% 이상. 실행당 버그 0.4 → 0.7. 초기에는 8회 투표 방식, 이후 완전 에이전트형으로 바꾼 것이 가장 큰 개선 해결률 = 머지 시점에 LLM이 \"고쳐졌다\"고 판정. 판정 프롬프트 비공개 Graphite Diamond (발표 2025) 코멘트의 52%가 같은 PR 안에서 반영(사람 약 50%), 👎 4% 미만 분모 미공개, 다른 사례 연구에서는 67% CodeRabbit (2026-01) 수용률을 정밀도 대리 지표로 쓰는 평가 틀을 제시 내부 수치 없음 xAI Grok Bot 팀 (Lauren Tan 발표, AI Engineer CODE 2026-11 · x.ai 가이드 2026-09-10) 에이전트가 PR을 만들고 AI 리뷰까지 돌린다. \"리뷰 확신이 높고 영향 범위(blast radius)가 작으면 자동 머지, 아니면 사람이 코드와 증거(proof)를 본다\" . 사람은 코드를 한 줄씩 읽는 대신 동작 영상·스크린샷·형식 검증 결과 같은 검증 산출물 을 본다. 출시 후 퍼징(무작위 입력 시험)이 찾은 버그의 수정 PR은 자동 머지. 한 달(10월) 팀 전체 약 11,000 PR (기여자 약 227명), 발표자 개인 약 3,000 PR, 되돌림 비율 약 0.5% 자기 보고. 흔히 \"한 명이 월 1만 건 자동 머지\"로 퍼졌지만 1.1만은 팀 전체 이고, 자동 머지는 조건부 다. 확신도 기준·blast radius 정의·
