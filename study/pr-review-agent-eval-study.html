d>κ 해석 비판에서 가장 많이 인용되는 해설<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Feinstein &amp; Cicchetti 1990<\/td>\n<td>κ 역설의 <strong>원조<\/strong>. 원문 미확인, 수치는 직접 재계산<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Papineni 2002 (BLEU)<\/td>\n<td><strong>원조<\/strong>(S2 36,174)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Jiang 외 2025 · CRScore 2025<\/td>\n<td>리뷰 코멘트에서 BLEU와 사람 평가의 상관을 직접 잰 연구<\/td>\n<td>D·A<\/td>\n<\/tr>\n<tr>\n<td>OWASP Benchmark · NIST Juliet<\/td>\n<td>함정 케이스로 FP를 세는 평가의 <strong>선례<\/strong><\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>Sainz 2023 · LiveCodeBench · SWE-bench Verified/+ · OpenAI 2026<\/td>\n<td>오염과 벤치마크 재검증의 대표 사례<\/td>\n<td>A·B·D<\/td>\n<\/tr>\n<tr>\n<td>D-ACT 2023 · Heumüller &amp; Ortmeier 2025<\/td>\n<td>리뷰 자동화에서 시간순 분할 문제를 다룬 연구<\/td>\n<td>A·D<\/td>\n<\/tr>\n<tr>\n<td>Miller 2024 · Koehn 2004 · Dror 2018<\/td>\n<td>LLM 평가·NLP에서 통계적 비교의 표준 참고문헌<\/td>\n<td>D·A<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>스스로 판단할 질문<\/h2>\n<ol>\n<li>우리 에이전트의 대표 지표는 F 하나인가, P와 R을 따로 보는가? F를 쓴다면 β는 몇이고, 그 근거는 무엇인가?<\/li>\n<li>\"문제없는 PR에서 조용히 있었나\"(TN)를 잴 것인가? 잰다면 함정 케이스를 어떻게 만들 것인가?<\/li>\n<li>사람 라벨 일치도는 어떤 지표로 볼 것인가? 라벨 분포가 쏠려 있을 때 κ가 낮게 나오면 어떻게 해석할 것인가?<\/li>\n<li>정답지는 시간순으로 나눌 것인가, 무작위로 나눌 것인가? 사내 PR은 공개 모델의 학습 데이터에 없다고 볼 수 있는가?<\/li>\n<li>프롬프트 변경 전후 비교에서 \"개선\"이라고 말하려면 몇 개 PR, 몇 번 반복이 필요한가?<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<ul>\n<li>van Rijsbergen 1979 ch.7 — <a href=\"https://www.dcs.gla.ac.uk/Keith/Chapter.7/Ch.7.html\">https://www.dcs.gla.ac.uk/Keith/Chapter.7/Ch.7.html<\/a> (A, ok)<\/li>\n<li>Powers — <a href=\"https://arxiv.org/pdf/1503.06410\">https://arxiv.org/pdf/1503.06410<\/a> (\"What the F-measure doesn't measure\", D, ok) · <a href=\"https://arxiv.org/pdf/2010.16061\">https://arxiv.org/pdf/2010.16061<\/a> (2011 원 논문, A, ok) · Hand, Christen, Kirielle — <a href=\"https://arxiv.org/pdf/2008.00103\">https://arxiv.org/pdf/2008.00103<\/a> (ok) · Christen 외 2023 CSUR — <a href=\"https://spiral.imperial.ac.uk/bitstreams/d313745d-dfc3-4af9-a191-6bbb08db5e32/download\">https://spiral.imperial.ac.uk/bitstreams/d313745d-dfc3-4af9-a191-6bbb08db5e32/download<\/a> (A, ok)<\/li>\n<li>McHugh 2012 — <a href=\"https://biochemia-medica.com/en/journal/22/3/10.11613/BM.2012.031/fullArticle\">https://biochemia-medica.com/en/journal/22/3/10.11613/BM.2012.031/fullArticle<\/a> (A, ok)<\/li>\n<li>Krippendorff 2004 — <a href=\"https://repository.upenn.edu/bitstreams/b6ea3a5b-3dee-4f27-a159-e44393eda7d4/download\">https://repository.upenn.edu/bitstreams/b6ea3a5b-3dee-4f27-a159-e44393eda7d4/download<\/a> (A, ok)<\/li>\n<li>κ 역설 예시 표 — <a href=\"https://bmcmedresmethodol.biomedcentral.com/articles/10.1186/1471-2288-14-100\">https://bmcmedresmethodol.biomedcentral.com/articles/10.1186/1471-2288-14-100<\/a> (A, partial) + 직접 재계산<\/li>\n<li>Gwet AC1 2차 — <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC5712640/\">https://pmc.ncbi.nlm.nih.gov/articles/PMC5712640/<\/a> (A, ok)<\/li>\n<li>Papineni 2002 — <a href=\"https://aclanthology.org/P02-1040.pdf\">https://aclanthology.org/P02-1040.pdf<\/a> (A, ok)<\/li>\n<li>CodeReviewer — <a href=\"https://arxiv.org/pdf/2203.09095\">https://arxiv.org/pdf/2203.09095<\/a> (A, ok) · Jiang 외 2025 — <a href=\"https://arxiv.org/pdf/2501.05176\">https://arxiv.org/pdf/2501.05176<\/a> (D, ok) · CRScore — <a href=\"https://arxiv.org/html/2409.19801v2\">https://arxiv.org/html/2409.19801v2<\/a> (A)<\/li>\n<li>OWASP Benchmark scoring — <a href=\"https://raw.githubusercontent.com/OWASP/www-project-benchmark/master/tab_scoring.md\">https://raw.githubusercontent.com/OWASP/www-project-benchmark/master/tab_scoring.md<\/a> (B, ok) · NIST Juliet — <a href=\"https://samate.nist.gov/SARD/downloads/documents/Juliet_Test_Suite_v1.1_for_C_Cpp_-_User_Guide.pdf\">https://samate.nist.gov/SARD/downloads/documents/Juliet_Test_Suite_v1.1_for_C_Cpp_-_User_Guide.pdf<\/a> (B, ok)<\/li>\n<li>Sainz 2023 — <a href=\"https://arxiv.org/pdf/2310.18018\">https://arxiv.org/pdf/2310.18018<\/a> · LiveCodeBench — <a href=\"https://arxiv.org/pdf/2403.07974\">https://arxiv.org/pdf/2403.07974<\/a> · SWE-bench Verified — <a href=\"https://openai.com/index/introducing-swe-bench-verified/\">https://openai.com/index/introducing-swe-bench-verified/<\/a> · SWE-bench+ — <a href=\"https://arxiv.org/pdf/2410.06992\">https://arxiv.org/pdf/2410.06992<\/a> · OpenAI 2026 — <a href=\"https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/\">https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/<\/a> (프록시로 확보)<\/li>\n<li>D-ACT 재현 자료 — <a href=\"https://github.com/awsm-research/D-ACT-Replication-Package\">https://github.com/awsm-research/D-ACT-Replication-Package<\/a> (B, ok) · Heumüller &amp; Ortmeier — <a href=\"https://arxiv.org/pdf/2508.18003\">https://arxiv.org/pdf/2508.18003<\/a> (D, ok)<\/li>\n<li>Miller 2024 — <a href=\"https://arxiv.org/pdf/2411.00640\">https://arxiv.org/pdf/2411.00640<\/a> · Koehn 2004 — <a href=\"https://aclanthology.org/W04-3250.pdf\">https://aclanthology.org/W04-3250.pdf<\/a> · Dror 2018 — <a href=\"https://aclanthology.org/P18-1128.pdf\">https://aclanthology.org/P18-1128.pdf<\/a> · Mustahsan 2025 — <a href=\"https://arxiv.org/pdf/2512.06710\">https://arxiv.org/pdf/2512.06710<\/a> · Chen 2021 — <a href=\"https://arxiv.org/pdf/2107.03374\">https://arxiv.org/pdf/2107.03374<\/a><\/li>\n<\/ul>", "text": " 02. 평가 지표와 통계 기초 생성일 : 2026-11-19 최종 수정일 : 2026-11-25 수준 : 기초 근거 원장 : wave-1 A2 · wave-2 W2b · 계산 검증 kappa · Fβ 이 장에서 답하는 질문 리뷰 에이전트 점수를 숫자 하나로 낼 때 무엇을 알아야 하나? 그 숫자는 어디서 왔고, 어떻게 틀릴 수 있나? 1. Precision · Recall · F-measure 쉬운 설명 에이전트가 남긴 지적 하나하나를 세 칸으로 나눈다. TP(맞은 지적) : 실제 문제를 짚었다 FP(틀린 지적) : 문제가 아닌데 짚었다 → 소음 FN(놓친 문제) : 실제 문제인데 말하지 않았다 Precision(정밀도) = TP / (TP + FP) \"떠든 말 중 맞은 비율\" Recall(재현율) = TP / (TP + FN) \"실제 문제 중 찾은 비율\" Fβ = (1+β²)·P·R / (β²·P + R) \"둘을 하나로 합친 값\" β의 원래 뜻 — 원전에서 F 척도는 van Rijsbergen의 1979년 책 Information Retrieval 7장에서 나왔다. 원래 이름은 E(효과성) 척도 이고, F = 1 − E다. 원문은 β를 이렇게 정의한다. \"a user who attaches β times as much importance to recall as precision\" 즉 β는 \"recall을 precision보다 몇 배 중요하게 보는 사용자인가\" 다. β=1이면 같게, β=2면 recall을 2배, β=0.5면 precision을 2배 중요하게 본다. 예시 — β에 따라 순위가 뒤집힌다 (코드로 재계산함) 에이전트 P R F0.5 F1 F2 A(과묵형) 0.90 0.30 0.643 0.450 0.346 B(수다형) 0.50 0.70 0.530 0.583 0.648 β가 약 0.68 보다 작으면 A가, 크면 B가 이긴다. 그래서 β를 고르는 순간 \"어떤 리뷰어를 원하는가\"를 정한 셈 이 된다. 그림 2-1. β에 따른 F 점수 — 과묵형 A와 수다형 B의 순위가 β≈0.68에서 뒤집힌다 (verify-fbeta로 재계산) F 척도에 대한 비판 (알고 쓰기) 비판 출처 내용 참음성(TN)을 무시한다 Powers 2011 \"문제가 없는 곳에서 조용히 있었다\"는 F에 반영되지 않는다. 리뷰에서는 \"문제없는 PR에 코멘트를 안 단 것\"이 이에 해당한다 가중치가 측정 대상에 따라 달라진다 Hand & Christen 2018 · Christen, Hand, Kirielle 2023 (ACM Computing Surveys) F는 P와 R의 가중 평균처럼 보이지만, 그 가중치가 평가받는 시스템에 따라 바뀐다. 저자들의 권고: (1) 한쪽 오류가 정말 무관할 때만 F를 쓴다 (2) P와 R을 반드시 함께 보고 한다 (3) 해석이 필요하면 F* = TP/(TP+FP+FN)(자카드 계수와 같다)을 쓴다 반론 같은 논문 리뷰 지적 매칭처럼 TN을 정의하기 어려운 과제에서는 F가 여전히 실용적이다 precision 정의가 연구마다 다르다 같은 \"precision\"이라도 분자·분모가 다르면 수십 배 차이가 난다. CR-Bench: precision = 버그 적중 / 전체 코멘트. \"버그는 아니지만 타당한 제안\"은 분모에만 들어가서 3~5%로 나온다. ReviewBench grounded precision: 정답지와 짝지어진 지적만 분모에 넣어서 80%대가 나올 수 있다. 숫자를 비교하기 전에 정의부터 확인해야 한다. → 자세한 비교는 05장 2. 정적분석 도구 평가의 선례 — 가짜 문제를 심어 FP를 센다 리뷰 지적 평가와 구조가 비슷한 분야가 있다. 보안 정적분석 도구 평가다. OWASP Benchmark : 테스트 케이스마다 진짜 취약점이 있거나, 일부러 넣은 가짜(취약해 보이지만 안전한 코드) 가 있다. 점수는 Youden 지수 = TPR − FPR 을 0~100으로 바꾼 값이다. 예: TPR 0.98, FPR 0.05 → 93점. 무작위로 찍으면 약 0점이고, 음수도 나온다. 한계: \"실제 애플리케이션보다 상당히 단순하다\"고 스스로 적었다. NIST Juliet : \"bad\" 함수에서 보고하면 TP, \"good\" 함수에서 보고하면 FP. 시사점(중립): 실제 PR만으로는 \"문제없는 곳에서 조용히 있었나\"를 세기 어렵다. 일부러 만든 함정 케이스가 있으면 FP를 셀 수 있다. 대신 합성 코드는 실제 코드보다 단순하다. 3. 사람끼리(또는 사람과 LLM이) 얼마나 일치하나 — 일치도 지표 정답지 라벨을 사람이 붙이거나 LLM 채점관을 검증할 때 필요하다. 일치율만 보면 안 되는 이유 참이 90%인 데이터에서 \"전부 참\"이라고만 답해도 일치율은 90%다. 그래서 우연히 맞을 확률을 뺀 지표를 쓴다. 지표 원전 특징 Cohen's κ Cohen 1960 (S2 인용 45,981) 평가자 2명. κ = (관찰 일치 − 우연 일치)/(1 − 우연 일치) Fleiss' κ Fleiss 1971 평가자 여러 명 Krippendorff's α Krippendorff 2004 HCR (OA 3,863) 평가자 수 제한 없음, 결측 허용, 척도 종류 무관 Gwet AC1 Gwet 2008 κ 역설(아래)에 강하다는 대안. 원문은 확보하지 못해 2차 문헌(PMC 리뷰 2017)으로만 확인했고, 반론이 있다 해석 기준표는 \"관례\"다 Landis & Koch 1977 (S2 84,366): 0.61~0.80 \"상당한\", 0.81~1.00 \"거의 완벽\". 가장 널리 쓰이지만 원전을 직접 읽지는 못했다. 저자들도 구간이 주관적이라고 했다고 한다(2차 출처). McHugh 2012 : 이 기준이 의료 분야에는 \"너무 관대하다\"고 비판했다. 권고는 일치율과 κ를 둘 다 보고 하라는 것이다. 예: 관찰 일치 0.94, κ 0.85 (95% 신뢰구간 0.78~0.92, N=222) Krippendorff 2004 원문 : \"α ≥ .800을 요구하고, 잠정적 결론이 허용되는 경우 α ≥ .667\"이라고 제안했다. 바로 이어서 \"there are no magical numbers\" 라고 했고, 이 기준은 α에만 해당한다고 각주에 썼다. 그는 신뢰도 평가에 Cohen's κ와 일치율을 쓰지 말라고도 주장한다. κ 역설 — 한쪽 라벨이 압도적이면 κ가 낮게 나온다 (코드로 재계산함) 관찰 일치가 둘 다 0.85인데 κ는 크게 다르다. 2×2 표 (예/예, 예/아니오, 아니오/예, 아니오/아니오) 관찰 일치 우연 일치 κ 균형 잡힌 경우 (40, 9, 6, 45) 0.85 0.50 0.70 한쪽으로 쏠린 경우 (80, 10, 5, 5) 0.85 0.78 0.32 리뷰와의 관계 : PR의 대부분 줄은 \"문제없음\"이다. 리뷰 라벨링에서는 쏠린 경우가 보통이다. κ가 낮게 나왔을 때, 평가자들이 실제로 어긋난 것인지 분포가 쏠려서인지 구분해야 한다. 그림 2-2. 관찰 일치 0.85가 같아도 κ는 0.70과 0.32 — 한쪽 라벨이 압도적이면 우연 일치가 커진다 (verify-kappa) 4. 텍스트 유사도 지표(BLEU 등)가 리뷰 코멘트에 맞지 않는 이유 초기 리뷰 자동화 연구는 생성한 코멘트가 사람 코멘트와 단어가 얼마나 겹치는지(BLEU)로 채점했다. BLEU를 쉽게 — 무엇을 세고, 왜 리뷰에서 무너지나 BLEU(블루, 2002) 는 원래 기계 번역 채점용 이다. 번역기가 낸 문장을 사람 번역(참조)과 비교해, 겹치는 단어 조각이 얼마나 많은지 를 0~1(논문에서는 보통 ×100 해서 0~100)로 낸다. 계산은 대략 이렇다. 기계 문장을 1단어, 2단어, 3단어, 4단어 묶음으로 자른다 각 묶음이 참조 문장에도 있는지 세서, 크기별 \"겹친 비율\"을 낸다 네 비율의 평균(기하평균)을 낸다. 하나라도 0에 가까우면 전체가 확 낮아진다 기계 문장이 너무 짧으면 벌점을 준다(짧게 써서 겹친 비율만 높이는 꼼수 방지) 논문에서 보는 BLEU-4 는 4단어 묶음까지 본다는 뜻이다. 네 단어가 순서까지 똑같이 이어져야 점수가 붙으니, 표현이 조금만 달라도 점수가 낮다. 리뷰 코멘트에 대 보면 (설명용, 1단어 단위만 센 단순화) 코멘트 정답과 겹친 단어 1단어 겹침 비율 실제로는 정답 user가 null이면 getName()에서 예외가 난다 — — — A 조회 실패 시 예외가 발생할 수 있습니다 예외가 1/7 ≈ 0.14 같은 문제 를 짚었다 B user가 null이면 getName()에서 로그를 남긴다 user가 · null이면 · getName()에서 3/5 = 0.60 엉뚱한 소리다 맞는 A가 낮고 틀린 B가 높다. BLEU는 뜻 이 아니라 글자 모양 을 보기 때문이다. 리뷰 코멘트에서 이 약점이 특히 커지는 이유는 셋이다. 같은 문제를 말하는 방법이 너무 많다 : 번역은 원문이 있어서 답의 폭이 좁지만, 리뷰는 \"null 체크 빠짐\", \"NPE 가능\", \"조회 실패 처리 없음\"이 다 같은 지적이다 참조가 보통 하나뿐이다 : 아래 원전의 경고처럼 참조가 적을수록 점수가 낮고 불안정하다 한국어는 더 불리하다 : 띄어쓰기 단위로 자르면 \"예외가\"와 \"예외는\"이 서로 다른 단어로 세어진다 그런데 왜 아직도 논문에 나오나 : 공짜이고, 자동이고, 예전 논문과 숫자를 나란히 비교할 수 있어서다. 그래서 최근 논문은 BLEU를 \"참고용\"으로 함께 적고, 실제 판단은 사람 평가나 임베딩 유사도(문장 뜻을 숫자 벡터로 바꿔 비교), LLM 채점관 으로 하는 경우가 많다. 코드 수정 과제에서 입력을 그대로 베껴도 BLEU 58.75가 나온 함정 사례는 04장 에 있다. 연구들이 보고한 것 BLEU 원전(Papineni 2002)의 경고 : 같은 번역가의 번역이 참조 번역 4개와 비교하면 0.3468, 2개와 비교하면 0.2571이었다. 참조가 몇 개냐에 따라 점수가 달라진다. 리뷰 코멘트는 참조가 보통 1개다. CodeReviewer(Microsoft, FSE 2022) 저자들 스스로: \"BLEU score … is not suitable for the review generation task\". 그래서 사람 평가(정보성 3.60, 관련성 3.20 / 5점)를 따로 했다. Jiang 외 2025 : BLEU와 사람 점수의 Spearman 상관 0.22 . 임베딩 유사도 0.38, GPT-4o 채점 0.47. CRScore(NAACL 2025) : BLEU ≈ 0, CRScore 0.54, GPT 채점 0.605. 왜 안 맞나 : 같은 문제를 다른 말로 쓰면 점수가 낮다. 사람이 놓친 진짜 문제를 지적하면 오히려 감점된다(Tufano & Bavota 2025 SLR). 5. 데이터 분할과 오염 — 시험 문제를 미리 본 셈이 되는 경우 held-out(손대지 않은 시험지) 프롬프트를 고칠 때 본 데이터와 최종 점수를 낼 데이터를 나눈다. 머신러닝의 train/dev/test 분리와 같다. 시간 순서 분할 D-ACT(SANER 2023) : 과거 변경으로 학습하고 미래 변경으로 시험하는 시간순 분할 을 쓰자고 주장했다. 저자 공개 자료로 재확인해 보니, 시간을 무시하고 무작위로 나누면 점수가 크게 부풀려졌다 (AutoTransform·Android에서 정답 350/1,835 vs 0/1,835). 논문의 \"57~94%\" 수치의 정확한 크기와 지표는 원문이 비공개라 확인하지 못했다. Heumüller & Ortmeier 2025 SLR : 리뷰 자동화 연구 24편 중 시간 편향을 다룬 것은 1편 뿐이었다. 오염(contamination) 평가 데이터가 모델 학습 데이터에 들어가 점수가 부풀려지는 것. Sainz 외 2023 (S2 537): 가장 나쁜 오염은 테스트 분할로 학습하는 것이고, 오염은 과대평가를 낳는다. LiveCodeBench (S2 2,691): 문제마다 공개 날짜를 붙이고, 모델의 학습 마감일 이후 문제로만 평가한다. SWE-bench 사례 (코드 수정 벤치마크지만 교훈이 같다): SWE-bench Verified(OpenAI 2024) : 개발자 93명이 1,699개를 검토해 68.3%를 걸러 내고 500개를 남겼다. SWE-bench+(2024) : 성공 패치의 32.67%는 이슈 본문에 정답이 이미 있었다. 31.08%는 테스트가 약해서 통과했다. OpenAI 2026-02 : Verified 평가 자체를 중단 했다. 미해결 138문항을 감사해 59.4%가 결함 있는 테스트였다. 테스트한 모든 최신 모델이 일부 문항의 정답 패치를 재현했다(오염). 벤치마크 제작사의 자체 감사이고, 대안으로 자사가 관여한 다른 벤치마크를 권했다는 점은 감안한다. 6. 두 시스템을 비교할 때 — 오차 막대와 유의성 에이전트 A가 B보다 F1이 2점 높다. 정말 나은가, 우연인가? Miller 2024 (Anthropic, \"Adding error bars to evals\") 권고 5가지: 중심극한정리 기반 표준오차를 보고한다 문항이 묶음으로 있으면(같은 PR의 여러 지적처럼) 군집 표준오차 를 쓴다. 순진한 값보다 3배 넘게 클 수 있다 같은 문항을 여러 번 돌려 분산을 줄인다 두 모델을 비교할 때는 문항별 차이(짝지은 비교) 를 쓴다 검정력 분석으로, 그 평가가 질문에 답할 만큼 큰지 미리 본다 Koehn 2004 짝지은 부트스트랩 (OA 2,166): 테스트셋을 복원추출로 1,000번 다시 만들어, 95% 이상에서 이기면 유의하다고 본다. 다중 비교 보정은 없다. Dror 외 2018 (OA 841): ACL 2017 실험 논문 180편 중 유의성 검정을 한 논문은 63편이었다. Mustahsan 외 2025 : 에이전트 벤치마크 다수가 단일 실행 으로 결과를 내고 신뢰구간이 없다. 반복 실행 일치도(ICC)는 구조화된 과제에서 8~16회, 복잡한 추론에서 32회 이상에서 안정된다(프리프린트). pass@k(Chen 외 2021) : k번 시도 중 한 번이라도 맞을 확률. 편향 없는 추정식은 1 − C(n−c,k)/C(n,k)이고, 단순한 1 − (1−p̂)ᵏ은 편향된다. 문헌 카드 문헌 선정 근거 등급 van Rijsbergen 1979 Information Retrieval 7장 원조 . F(E) 척도와 β의 정의 A Powers 2011 · Hand & Christen 2018 · Christen, Hand, Kirielle 2023 CSUR F 척도 비판의 대표 문헌. CSUR 리뷰 OA 382 A·D Cohen 1960 · Fleiss 1971 · Landis & Koch 1977 원조 . 일치도 지표와 해석 기준 A Krippendorff 2004 HCR 원조 저자가 직접 쓴 임계값과 단서 A McHugh 2012 Biochemia Medica κ 해석 비판에서 가장 많이 인용되는 해설 A Feinstein & Cicchetti 1990 κ 역설의 원조 . 원문 미확인, 수치는 직접 재계산 A Papineni 2002 (BLEU) 원조 (S2 36,174) A Jiang 외 2025 · CRScore 2025 리뷰 코멘트에서 BLEU와 사람 평가의 상관을 직접 잰 연구 D·A OWASP Benchmark · NIST Juliet 함정 케이스로 FP를 세는 평가의 선례 B Sainz 2023 · LiveCodeBench · SWE-bench Verified/+ · OpenAI 2026 오염과 벤치마크 재검증의 대표 사례 A·B·D D-ACT 2023 · Heumüller & Ortmeier 2025 리뷰 자동화에서 시간순 분할 문제를 다룬 연구 A·D Miller 2024 · Koehn 2004 · Dror 2018 LLM 평가·NLP에서 통계적 비교의 표준 참고문헌 D·A 스스로 판단할 질문 우리 에이전트의 대표 지표는 F 하나인가, P와 R을 따로 보는가? F를 쓴다면 β는 몇이고, 그 근거는 무엇인가? \"문제없는 PR에서 조용히 있었나\"(TN)를 잴 것인가? 잰다면 함정 케이스를 어떻게 만들 것인가? 사람 라벨 일치도는 어떤 지표로 볼 것인가? 라벨 분포가 쏠려 있을 때 κ가 낮게 나오면 어떻게 해석할 것인가? 정답지는 시간순으로 나눌 것인가, 무작위로 나눌 것인가? 사내 PR은 공개 모델의 학습 데이터에 없다고 볼 수 있는가? 프롬프트 변경 전후 비교에서 \"개선\"이라고 말하려면 몇 개 PR, 몇 번 반복이 필요한가? 출처 van Rijsbergen 1979 ch.7 — https://www.dcs.gla.ac.uk/Keith/Chapter.7/Ch.7.html (A, ok) Powers — https://arxiv.org/pdf/1503.06410 (\"What the F-measure doesn't measure\", D, ok) · https://arxiv.org/pdf/2010.16061 (2011 원 논문, A, ok) · Hand, Christen, Kirielle — https://arxiv.org/pdf/2008.00103 (ok) · Christen 외 2023 CSUR — https://spiral.imperial.ac.uk/bitstreams/d313745d-dfc3-4af9-a191-6bbb08db5e32/download (A, ok) McHugh 2012 — https://biochemia-medica.com/en/journal/22/3/10.11613/BM.2012.031/fullArticle (A, ok) Krippendorff 2004 — https://repository.upenn.edu/bitstreams/b6ea3a5b-3dee-4f27-a159-e44393eda7d4/download (A, ok) κ 역설 예시 표 — https://bmcmedresmethodol.biomedcentral.com/articles/10.1186/1471-2288-14-100 (A, partial) + 직접 재계산 Gwet AC1 2차 — https://pmc.ncbi.nlm.nih.gov/articles/PMC5712640/ (A, ok) Papineni 2002 — https://aclanthology.org/P02-1040.pdf (A, ok) CodeReviewer — https://arxiv.org/pdf/2203.09095 (A, ok) · Jiang 외 2025 — https://arxiv.org/pdf/2501.05176 (D, ok) · CRScore — https://arxiv.org/html/2409.19801v2 (A) OWASP Benchmark scoring — https://raw.githubusercontent.com/OWASP/www-project-benchmark/master/tab_scoring.md (B, ok) · NIST Juliet — https://samate.nist.gov/SARD/downloads/documents/Juliet_Test_Suite_v1.1_for_C_Cpp_-_User_Guide.pdf (B, ok) Sainz 2023 — https://arxiv.org/pdf/2310.18018 · LiveCodeBench — https://arxiv.org/pdf/2403.07974 · SWE-bench Verified — https://openai.com/index/introducing-swe-bench-verified/ · SWE-bench+ — https://arxiv.org/pdf/2410.06992 · OpenAI 2026 — https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/ (프록시로 확보) D-ACT 재현 자료 — https://github.com/awsm-research/D-ACT-Replication-Package (B, ok) · Heumüller & Ortmeier — https://arxiv.org/pdf/2508.18003 (D, ok) Miller 2024 — https://arxiv.org/pdf/2411.00640 · Koehn 2004 — https://aclanthology.org/W04-3250.pdf · Dror 2018 — https://aclanthology.org/P18-1128.pdf · Mustahsan 2025 — https://arxiv.org/pdf/2512.06710 · Chen 2021 — https://arxiv.org/pdf/2107.03374 "}, {"id": "03", "dir": "03-LLM-채점관", "title": "03. LLM 채점관(LLM-as-a-judge) — 믿을 수 있나, 어떻게 검증하나", "level": "기초→심화", "html": "<h1>03. LLM 채점관(LLM-as-a-judge) — 믿을 수 있나, 어떻게 검증하나<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-19<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-25<\/li>\n<li><strong>수준<\/strong>: 기초 → 심화<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A3-llm-as-judge.md\">wave-1 A3<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-2-web-W2b-judge-metaeval-stats.md\">wave-2 W2b<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A9-counter-brief.md\">wave-1 A9 반론<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-4-web-agentic-rubrics.md\">wave-4 Agentic Rubrics<\/a><\/li>\n<\/ul>\n<h2>이 장에서 답하는 질문<\/h2>\n<p>리뷰 평가에서 LLM은 두 가지 일을 맡는다.<\/p>\n<ol>\n<li><strong>매칭<\/strong>: 에이전트 지적과 정답 지적이 같은 문제를 말하는가<\/li>\n<li><strong>판정<\/strong>: 정답지에 없는 지적이 맞는가, 쓸모 있는가<\/li>\n<\/ol>\n<p>LLM이 사람 대신 채점할 때 어떤 편향이 있고, 사람과 얼마나 일치하며, 그것을 어떻게 확인하고 보정하나?<\/p>\n<h2>0. 먼저 그림으로 이해하기<\/h2>\n<h3>비유 — 시험 채점을 조교에게 맡긴다<\/h3>\n<p>교수 혼자 답안지 1,000장을 채점할 수 없어서 <strong>조교(LLM)<\/strong> 에게 맡긴다고 해 보자.<\/p>\n<ul>\n<li>조교는 <strong>빠르고 싸다.<\/strong> 1,000장을 몇 분 만에 끝낸다.<\/li>\n<li>대신 조교에게는 <strong>버릇<\/strong>이 있을 수 있다. 첫 번째 답안을 더 좋게 본다든지, 길게 쓴 답안에 점수를 후하게 준다든지, 자기가 쓴 모범답안과 비슷하면 가산점을 준다든지.<\/li>\n<li>그래서 교수는 <strong>답안 몇십 장을 직접 다시 채점<\/strong>해서 조교와 비교한다. 많이 일치하면 조교를 믿고, 조교가 일관되게 후하다면 그만큼 <strong>점수를 깎아서 보정<\/strong>한다.<\/li>\n<\/ul>\n<p>이 장 전체가 이 이야기다. 1~4절은 \"조교에게 어떤 버릇이 있고, 얼마나 사람과 맞는가\"를 다룬 연구들이고, 5절은 \"교수가 조교를 어떻게 검사하고 보정하나\"다.<\/p>\n<h3>장 구성 — 어느 절이 PR 리뷰 얘기인가<\/h3>\n<p><strong>PR 리뷰 채점만 따로 연구한 논문은 아직 적다.<\/strong> 그래서 이 장은 일반 과제에서 시작해 리뷰로 좁혀 간다.<\/p>\n<table>\n<thead>\n<tr>\n<th>절<\/th>\n<th>채점 대상<\/th>\n<th>PR 리뷰와의 관계<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1~3절<\/td>\n<td>챗봇 답변, 요약, 퀴즈 답, 수학·코딩 문제 풀이 등 <strong>리뷰가 아닌 일반 과제<\/strong><\/td>\n<td>채점관의 일반적인 버릇과 실력을 보여 준다. 리뷰에서도 같은 버릇이 나올지는 따로 확인해야 한다<\/td>\n<\/tr>\n<tr>\n<td>4절<\/td>\n<td><strong>리뷰 코멘트<\/strong>와 코드 정답 여부<\/td>\n<td>PR 리뷰 채점을 직접 다룬 연구는 여기 모여 있다<\/td>\n<\/tr>\n<tr>\n<td>5절<\/td>\n<td>과제를 가리지 않는 검증·보정 방법<\/td>\n<td>리뷰 채점에도 그대로 쓸 수 있다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>1~3절에 나오는 PR 리뷰 예시는 \"리뷰에 대입하면 이런 모습일 것\"이라는 설명용이고, 연구 결과가 아니다.<\/p>\n<h3>PR 리뷰에 대입하면<\/h3>\n<p>정답지(사람이 단 리뷰)에 이런 지적이 있다고 하자.<\/p>\n<blockquote>\n<p>정답: \"<code>user<\/code>가 null일 때 <code>user.getName()<\/code>에서 NullPointerException이 난다\"<\/p>\n<\/blockquote>\n<p>리뷰 에이전트는 이렇게 썼다.<\/p>\n<blockquote>\n<p>에이전트 A: \"<code>findUser()<\/code> 결과를 바로 쓰고 있어 조회 실패 시 예외가 날 수 있습니다. null 체크를 추가하세요.\"<\/p>\n<p>에이전트 B: \"<code>getName()<\/code>의 반환 타입을 Optional로 바꾸면 더 좋겠습니다.\"<\/p>\n<\/blockquote>\n<ul>\n<li><strong>매칭<\/strong>: A는 표현은 다르지만 같은 문제를 말한다 → \"적중\". B는 <code>getName<\/code>이라는 단어는 겹치지만 다른 얘기다 → \"적중 아님\". 단어가 겹치는지로는 가를 수 없어서 LLM에게 묻는다.<\/li>\n<li><strong>판정<\/strong>: B가 정답지에 없는 지적이라면, 그것이 맞는 말인지·쓸모 있는지 LLM에게 묻는다.<\/li>\n<\/ul>\n<p>어느 쪽이든 LLM의 답이 틀리면 <strong>에이전트 점수 자체가 틀린다.<\/strong> 그래서 채점관을 먼저 검사해야 한다.<\/p>\n<h3>이 장에 나오는 용어<\/h3>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>쉬운 뜻<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>일치율<\/td>\n<td>두 채점자가 같은 판정을 낸 비율. 우연히 맞은 것도 섞여 있다<\/td>\n<\/tr>\n<tr>\n<td>κ(카파)<\/td>\n<td>우연히 맞을 몫을 빼고 본 일치도. 0이면 \"찍은 수준\", 1이면 완전 일치. 보통 0.6 넘으면 꽤 맞는다고 본다(관례). 자세한 건 <a href=\"#02\">02장<\/a><\/td>\n<\/tr>\n<tr>\n<td>상관(피어슨·스피어먼)<\/td>\n<td>한쪽 점수가 오를 때 다른 쪽도 같이 오르는 정도. <strong>경향이 같다는 뜻이지 점수가 같다는 뜻은 아니다<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ICC<\/td>\n<td>여러 채점자가 매긴 점수가 얼마나 비슷한지(0~1). 점수형 채점의 일치도<\/td>\n<\/tr>\n<tr>\n<td>CoT(Chain-of-Thought)<\/td>\n<td>바로 답하지 말고 \"단계별로 생각한 뒤\" 판정하게 하는 프롬프트 방식<\/td>\n<\/tr>\n<tr>\n<td>민감도 · 특이도<\/td>\n<td>진짜 맞는 걸 \"맞다\"고 잡는 비율 · 진짜 틀린 걸 \"틀리다\"고 잡는 비율. 5절 보정에 쓴다<\/td>\n<\/tr>\n<tr>\n<td>BLEU(블루)<\/td>\n<td>기계 번역용으로 만든 옛 자동 채점 지표. 정답 문장과 <strong>단어가 얼마나 겹치는지<\/strong>만 센다. 뜻이 같아도 표현이 다르면 낮게 나온다. 맞는 코멘트가 낮고 틀린 코멘트가 높게 나오는 예시와 계산 방식은 <a href=\"#02\">02장 4절<\/a><\/td>\n<\/tr>\n<tr>\n<td>프리프린트<\/td>\n<td>학회·저널 심사를 아직 통과하지 않은 논문. 등급 D로 표시<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>이 장 요약 (세 줄)<\/h3>\n<ol>\n<li>LLM 채점관은 평균적으로 <strong>사람끼리 일치하는 만큼<\/strong> 사람과 일치한다. 하지만 과제에 따라 동전 던지기 수준으로 떨어지기도 한다.<\/li>\n<li>순서·길이·자기 글·주석 문구 같은 <strong>겉모습에 흔들리는 버릇<\/strong>이 여러 연구에서 확인됐다.<\/li>\n<li>그래서 <strong>사람 라벨 소량으로 채점관을 검사<\/strong>하고, 필요하면 <strong>통계식으로 점수를 보정<\/strong>한다.<\/li>\n<\/ol>\n<hr />\n<h2>1. 출발점 — \"사람끼리만큼은 일치한다\"는 결과와 그 단서<\/h2>\n<blockquote>\n<p><strong>한 줄로<\/strong>: \"LLM 채점이 사람만큼 맞는다\"는 유명한 결과는 사실이지만, 조건을 알고 읽어야 한다.<\/p>\n<\/blockquote>\n<p><strong>Zheng 외 2023 (MT-Bench / Chatbot Arena, NeurIPS 2023, S2 13,411)<\/strong> — LLM 채점관 연구의 원점이다.<\/p>\n<ul>\n<li><strong>채점 대상<\/strong>: 챗봇 답변(글쓰기·역할극·추론·수학·코딩·인문 등 8개 분야의 질문). PR 리뷰가 아니다.<\/li>\n<\/ul>\n<p>두 챗봇 답을 나란히 보여 주고 \"어느 쪽이 나은가\"를 GPT-4와 사람에게 각각 물었다. 표는 그 판정이 얼마나 같았는지다.<\/p>\n<table>\n<thead>\n<tr>\n<th>조건<\/th>\n<th>GPT-4 vs 사람<\/th>\n<th>사람 vs 사람<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>무승부 제외<\/td>\n<td><strong>85%<\/strong><\/td>\n<td>81%<\/td>\n<\/tr>\n<tr>\n<td>무승부 포함<\/td>\n<td><strong>66%<\/strong><\/td>\n<td>63%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>읽는 법: 사람끼리도 81%밖에 안 맞는다. GPT-4와 사람은 85% 맞았다. 즉 \"GPT-4는 사람 한 명을 더 데려온 것과 비슷하다\"는 뜻이지, \"항상 옳다\"는 뜻이 아니다.<\/li>\n<li>흔히 인용되는 \"약 80% 일치\"는 <strong>무승부를 뺀 수치<\/strong>다. 무승부를 넣으면 60%대로 떨어진다. 다만 어느 조건에서나 사람끼리의 일치와 비슷하다.<\/li>\n<li>같은 논문이 찾은 편향:<ul>\n<li><strong>위치 편향<\/strong>(앞뒤 순서에 끌림): 두 답의 순서를 바꿔도 판정이 같은 비율이 GPT-4 65.0%, GPT-3.5 46.2%, Claude-v1 23.8%였다. 뒤집어 말하면 GPT-4도 셋 중 하나는 순서만 바꿔도 판정이 달라졌다<\/li>\n<li><strong>길이(장황함) 편향<\/strong>: 같은 내용을 목록으로 반복해 늘린 답에 속은 비율이 Claude-v1·GPT-3.5 91.3%, GPT-4 8.7%였다(답 23개)<\/li>\n<li><strong>자기 선호<\/strong>: GPT-4는 자기 답을 승률 +10%, Claude-v1은 +25% 더 좋게 봤다. 다만 저자들은 데이터만으로 자기 선호를 단정할 수 없다고 했다<\/li>\n<li><strong>수학 채점<\/strong>: 20문제 중 기본 14개 틀림 → CoT 6개 → 참조 답 제공 시 3개. <strong>정답(참조 답)을 쥐여 주면 훨씬 덜 틀린다<\/strong> — 리뷰 채점에서 정답지를 같이 주는 이유와 같다<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<blockquote>\n<p>2023년 모델 기준이다. 최신 모델에서는 수치가 다를 수 있다.<\/p>\n<\/blockquote>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:480px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 330\" role=\"img\" aria-label=\"MT-Bench 일치율\" data-minw=\"480\"><title>MT-Bench 일치율<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"560\" height=\"330\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">&#x27;LLM 채점관이 사람만큼 일치한다&#x27;의 단서<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">MT-Bench (Zheng 외, NeurIPS 2023) · 일치율 %<\/text><rect x=\"20\" y=\"61\" width=\"12\" height=\"10\" rx=\"2\" class=\"f-d1\"/><text x=\"40.0\" y=\"70.0\" class=\"t-sm\">GPT-4 ↔ 사람<\/text><rect x=\"137.84000000000003\" y=\"61\" width=\"12\" height=\"10\" rx=\"2\" class=\"f-d3\"/><text x=\"157.8\" y=\"70.0\" class=\"t-sm\">사람 ↔ 사람<\/text><line class=\"grid\" x1=\"70\" y1=\"270.0\" x2=\"530\" y2=\"270.0\"/><text x=\"62.0\" y=\"274.0\" class=\"t-mut\" text-anchor=\"end\">0<\/text><line class=\"grid\" x1=\"70\" y1=\"222.5\" x2=\"530\" y2=\"222.5\"/><text x=\"62.0\" y=\"226.5\" class=\"t-mut\" text-anchor=\"end\">25<\/text><line class=\"grid\" x1=\"70\" y1=\"175.0\" x2=\"530\" y2=\"175.0\"/><text x=\"62.0\" y=\"179.0\" class=\"t-mut\" text-anchor=\"end\">50<\/text><line class=\"grid\" x1=\"70\" y1=\"127.5\" x2=\"530\" y2=\"127.5\"/><text x=\"62.0\" y=\"131.5\" class=\"t-mut\" text-anchor=\"end\">75<\/text><line class=\"grid\" x1=\"70\" y1=\"80.0\" x2=\"530\" y2=\"80.0\"/><text x=\"62.0\" y=\"84.0\" class=\"t-mut\" text-anchor=\"end\">100<\/text><g class=\"tip\"><title>무승부 빼고 계산: GPT-4↔사람 85%<\/title><path class=\"f-d1 hl\" d=\"M120.0,270.0v-157.5a4,4 0 0 1 4,-4h48.0a4,4 0 0 1 4,4v157.5z\"/><text x=\"148.0\" y=\"100.5\" class=\"t-val\" text-anchor=\"middle\">85%<\/text><\/g><g class=\"tip\"><title>무승부 빼고 계산: 사람↔사람 81%<\/title><path class=\"f-d3 hl\" d=\"M178.0,270.0v-149.9a4,4 0 0 1 4,-4h48.0a4,4 0 0 1 4,4v149.9z\"/><text x=\"206.0\" y=\"108.1\" class=\"t-val\" text-anchor=\"middle\">81%<\/text><\/g><text x=\"177.0\" y=\"290.0\" class=\"t-sm\" text-anchor=\"middle\">무승부 빼고 계산<\/text><g class=\"tip\"><title>무승부 넣고 계산: GPT-4↔사람 66%<\/title><path class=\"f-d1 hl\" d=\"M330.0,270.0v-121.4a4,4 0 0 1 4,-4h48.0a4,4 0 0 1 4,4v121.4z\"/><text x=\"358.0\" y=\"136.6\" class=\"t-val\" text-anchor=\"middle\">66%<\/text><\/g><g class=\"tip\"><title>무승부 넣고 계산: 사람↔사람 63%<\/title><path class=\"f-d3 hl\" d=\"M388.0,270.0v-115.7a4,4 0 0 1 4,-4h48.0a4,4 0 0 1 4,4v115.7z\"/><text x=\"416.0\" y=\"142.3\" class=\"t-val\" text-anchor=\"middle\">63%<\/text><\/g><text x=\"387.0\" y=\"290.0\" class=\"t-sm\" text-anchor=\"middle\">무승부 넣고 계산<\/text><line class=\"axis\" x1=\"70\" y1=\"270\" x2=\"530\" y2=\"270\"/><text x=\"20.0\" y=\"318.0\" class=\"t-mut\">흔히 인용되는 &#x27;약 80%&#x27;는 무승부를 뺀 값. 어느 쪽이든 사람끼리와 비슷하다<\/text><\/svg><\/div><figcaption>그림 3-1. MT-Bench 일치율 — '약 80%'는 무승부를 뺀 값이다 (Zheng 외 NeurIPS 2023)<\/figcaption><\/figure>\n<h2>2. 알려진 편향 — 각각을 확인한 연구<\/h2>\n<blockquote>\n<p><strong>한 줄로<\/strong>: 채점관은 내용이 아니라 <strong>겉모습<\/strong>(순서, 길이, 누가 썼나, 주석 문구)에 끌리는 버릇이 있다.<\/p>\n<\/blockquote>\n<p>먼저 PR 리뷰 채점이라면 각 버릇이 어떻게 나타날지 예를 들면 이렇다.<\/p>\n<ul>\n<li><strong>위치<\/strong>: 에이전트 지적 두 개를 나란히 보여 주고 고르게 하면, 내용과 상관없이 먼저 나온 쪽을 고른다<\/li>\n<li><strong>길이<\/strong>: 같은 말을 길게 풀어 쓴 코멘트를 \"더 꼼꼼하다\"고 본다<\/li>\n<li><strong>자기 선호<\/strong>: 리뷰 에이전트와 채점관이 같은 모델이면, 자기 말투로 쓴 코멘트를 후하게 본다<\/li>\n<li><strong>표면 단서<\/strong>: 코드에 <code>// 이미 검증된 로직<\/code> 같은 주석이 있으면 버그가 있어도 \"문제 없음\"에 동의한다<\/li>\n<li><strong>무작위성<\/strong>: 같은 지적을 두 번 물으면 한 번은 적중, 한 번은 아님이라고 한다<\/li>\n<li><strong>관대함<\/strong>: 애매한 지적을 대체로 \"적중\"으로 쳐 줘서 에이전트 점수가 부풀려진다<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>편향<\/th>\n<th>쉬운 설명<\/th>\n<th>대표 연구<\/th>\n<th>핵심 수치<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>위치<\/td>\n<td>먼저(또는 나중에) 나온 답을 선호<\/td>\n<td>Wang 외 2023 (ACL 2024, S2 1,557)<\/td>\n<td>순서만 바꿨더니 판정이 뒤집힌 비율 GPT-4 46.3%<\/td>\n<\/tr>\n<tr>\n<td>자기 선호<\/td>\n<td>자기가 쓴 글을 더 좋게 봄<\/td>\n<td>Panickssery 외 2024 (NeurIPS 2024, S2 1,089)<\/td>\n<td>자기 글을 알아보는 능력과 자기 선호의 강도가 <strong>비례<\/strong>. 요약 과제에서만 실험<\/td>\n<\/tr>\n<tr>\n<td>자기 생성 문제<\/td>\n<td>자기가 만든 문제를 채점할 때 정확도 하락<\/td>\n<td>JudgeBench (ICLR 2025)<\/td>\n<td>Claude가 직접 만든 쌍을 판정하면 64.3% → 44.8%<\/td>\n<\/tr>\n<tr>\n<td>표면 단서<\/td>\n<td>\"이 코드는 맞다\"는 주석·변수명에 흔들림<\/td>\n<td>Moon 외 (EACL Findings 2026)<\/td>\n<td>코드에 \"정답임\"이라고 써 두자 LLaMA-70B가 맞다고 본 비율이 49.0 → 83.3%. 오해를 부르는 주석 하나로 GPT-4o C++ 정확도 89.5 → 67.1%. \"<strong>테스트한 모델 중 강건한 것이 없다<\/strong>\"<\/td>\n<\/tr>\n<tr>\n<td>무작위성<\/td>\n<td>같은 입력에 판정이 흔들림<\/td>\n<td>CodeJudgeBench (ACL 2026, 판정 모델 26개)<\/td>\n<td>모든 모델에 \"유의한 무작위성\"이 있고, 답 순서만 바꿔도 정확도가 크게 변한다<\/td>\n<\/tr>\n<tr>\n<td>관대함<\/td>\n<td>실제보다 후하게 채점<\/td>\n<td>Thakur 외 2024 \"Judging the Judges\"<\/td>\n<td>일치율이 높아도 사람이 준 점수와 10~20점 차이가 날 수 있다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>각 연구의 채점 대상<\/strong> — 리뷰 코멘트를 채점한 연구는 이 표에 없다.<\/p>\n<ul>\n<li>Wang 외 2023: 챗봇 답변 두 개 비교<\/li>\n<li>Panickssery 외 2024: 뉴스 요약문<\/li>\n<li>JudgeBench: 지식·추론·수학·코딩 문제의 맞는 답과 틀린 답<\/li>\n<li>Moon 외: 코드가 맞는지 판정(코드 정답 여부)<\/li>\n<li>CodeJudgeBench: 코드 생성·코드 수정·테스트 작성 결과 비교<\/li>\n<li>Thakur 외 2024: 퀴즈(TriviaQA) 답이 맞는지 판정<\/li>\n<\/ul>\n<h2>3. 판정 능력 자체를 시험하는 벤치마크<\/h2>\n<blockquote>\n<p><strong>한 줄로<\/strong>: \"LLM 채점관은 믿을 만하다/아니다\"로 한 번에 말할 수 없다. <strong>과제마다 따로 재 봐야<\/strong> 한다.<\/p>\n<\/blockquote>\n<p>이번에는 채점관 자체를 시험대에 올린 연구들이다. 정답이 확실한 문제를 내고 채점관이 얼마나 맞히는지 본다.\n<strong>판정 정확도는 과제에 따라 크게 다르다.<\/strong><\/p>\n<ul>\n<li><strong>JUDGE-BENCH (Bavaresco 외, ACL 2025)<\/strong> — 채점 대상: 번역·요약·대화 등 사람이 이미 라벨을 붙여 둔 언어 과제 데이터셋. LLM 11개, 데이터셋 20개. 사람과의 일치가 데이터셋마다 0.84부터 0.05까지 벌어졌다. CoT(단계별 추론)가 일관되게 도움이 되지도 않았다. 권고: \"배포 전에 <strong>그 과제의 사람 라벨로<\/strong> 검증하라.\"<\/li>\n<li><strong>JudgeBench (Tan 외, ICLR 2025)<\/strong> — 채점 대상: 지식·추론·수학·코딩 문제의 풀이. 객관적으로 맞는 답과 틀린 답의 쌍 350개. 둘 중 맞는 걸 고르는 문제라 아무렇게나 찍어도 50%다. GPT-4o 기본 프롬프트 <strong>50.86%<\/strong>(동전 던지기 수준), o3-mini(high) 80.86%. 판정 정확도는 그 모델이 문제를 직접 푸는 실력과 비슷하게 움직였다. 쉽게 말해 <strong>자기가 못 푸는 문제는 채점도 못 한다<\/strong> — 어려운 버그를 못 찾는 모델은 그 버그를 지적한 코멘트가 맞는지도 잘 못 가린다.<\/li>\n<li><strong>LLMBar (Zeng 외, ICLR 2024)<\/strong> — 채점 대상: 챗봇이 지시를 제대로 따랐는지(\"세 줄로 요약해\" 같은 지시). 쌍 419개. 전문가끼리 94% 일치했다. 최고 GPT-4 판정기도 적대적 세트에서 82.8%였다. CoT가 오히려 겉보기 품질 쪽으로 편향을 키운 경우가 있었다.<\/li>\n<\/ul>\n<h2>4. 코드·리뷰에서의 LLM 채점관<\/h2>\n<blockquote>\n<p><strong>한 줄로<\/strong>: 리뷰 채점에서는 <strong>\"맞혔나/아니냐\"(예·아니오)를 물을 때가 \"몇 점이냐\"를 물을 때보다<\/strong> 사람과 잘 맞았다.<\/p>\n<\/blockquote>\n<p>표를 읽는 요령:<\/p>\n<ul>\n<li>κ는 0.6~0.8이면 \"상당히 일치\", 사람끼리 κ와 비슷하면 \"사람 한 명 몫은 한다\"로 읽으면 된다. 표에는 κ에 100을 곱한 값(70.6 = 0.706)으로 적혀 있다<\/li>\n<li>BLEU는 단어가 얼마나 겹치는지만 보는 옛 지표다. 정답이 \"null 체크가 빠졌다\"인데 코멘트가 \"조회 실패 시 예외가 난다\"면, 같은 문제를 짚었어도 겹치는 단어가 없어 점수가 낮다. <strong>음수<\/strong>라는 건 사람 판단과 오히려 거꾸로 갔다는 뜻이다<\/li>\n<li>ICC·상관은 1에 가까울수록 사람과 비슷하다<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>연구<\/th>\n<th>무엇을 쟀나<\/th>\n<th>결과<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>SWR-Bench<\/strong> (PACMSE/FSE 2026)<\/td>\n<td>리뷰 보고서가 정답 이슈를 \"적중(hit)\"했는지 LLM이 판정<\/td>\n<td>적중 판정 사람-LLM κ <strong>70.6~86.7<\/strong>. 두 리뷰 중 어느 쪽이 나은지 고르는 판정에서 적중 기반은 κ 52.8~62.0(사람끼리 56.3~62.6), 1~10점 점수형은 31.0~44.9, BLEU는 <strong>음수<\/strong>(−35~−41)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>DeepCRCEval<\/strong> (FASE 2025)<\/td>\n<td>리뷰 코멘트 9개 기준 점수<\/td>\n<td>사람 평균과의 ICC: 사람 0.89~0.95, GPT-4 <strong>0.62~0.83<\/strong>. 가독성·간결성이 가장 낮다. 시간 −88.78%, 비용 −90.32%<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>CRScore<\/strong> (NAACL 2025)<\/td>\n<td>정답 없이 코멘트 품질 채점<\/td>\n<td>사람과 Spearman 0.54, GPT 채점 0.605, BLEU ≈ 0<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>CodeJudge<\/strong> (EMNLP 2024)<\/td>\n<td>코드 정답 여부<\/td>\n<td>평균 정확도 80.56%. 실패 600건 중 52.83%가 \"코드 로직 분석 오류\"<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>Wang 외 2025<\/strong> (PACM SE)<\/td>\n<td>SE 과제별 LLM 채점<\/td>\n<td>사람 점수와 피어슨 상관: 코드 번역 81.32, 코드 생성 68.51. 요약은 더 낮다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>Ahmed 외 2024<\/strong> (MSR 2025)<\/td>\n<td>SE 산출물 주석을 LLM이 대체 가능한가<\/td>\n<td><strong>모델끼리 일치하면 사람과도 일치하는 경향<\/strong> → 모델 간 불일치를 위험 신호로 쓸 수 있다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>CRJudgeBench<\/strong> (프리프린트, 심사 중)<\/td>\n<td>그럴듯하지만 틀린 리뷰 코멘트를 골라내나<\/td>\n<td>범용 최신 LLM도 \"신뢰할 수 없는 코멘트를 식별하는 데 어려움\". 특화 판정기 최고 76.6%<\/td>\n<td>D<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>정리하면:<\/p>\n<ul>\n<li><strong>SWR-Bench<\/strong>처럼 \"이 리뷰가 정답 이슈를 짚었나\"만 물으면 사람끼리 수준으로 맞았다<\/li>\n<li><strong>DeepCRCEval<\/strong>처럼 \"가독성 몇 점, 간결성 몇 점\"을 물으면 사람보다 확연히 덜 맞았다<\/li>\n<li><strong>Ahmed 외<\/strong>의 관찰은 실무 요령으로 쓸 만하다: 채점관 모델 두 개가 서로 다른 판정을 내면, 그 건은 사람이 볼 후보다<\/li>\n<\/ul>\n<h3>SWR-Bench의 실제 판정 규칙 (공개 코드 원문)<\/h3>\n<p>리뷰 채점 설계를 공부할 때 구체적인 예시로 볼 만하다. 채점관에게 실제로 어떤 기준을 줬는지 코드에서 확인한 내용이다.<\/p>\n<ul>\n<li>적중 기준: \"A hit occurs if a predicted point <strong>substantially and correctly identifies the core essence<\/strong> of the ground truth change\" — 풀면 \"정답 지적의 <strong>핵심<\/strong>을 실질적으로, 올바르게 짚었으면 적중\". 앞의 예시에서 에이전트 A는 적중, B는 아니다<\/li>\n<li>일대일 제약: 정답 하나는 예측 지적 <strong>최대 하나<\/strong>에만 적중으로 매칭한다. 같은 말을 세 번 쓴 에이전트가 적중 세 개를 받지 못하게 막는 장치다. 논문 본문은 \"one or more\"라고 써서 코드와 다르다.<\/li>\n<li>판정 온도 0.0. 문제 없는 PR에서는 \"LGTM\"이라고 하거나 지적이 0개면 정답으로 친다.<\/li>\n<li>단서: 정답을 Gemini-2.5-Pro로 추출했고 판정도 Gemini 계열이다(자기 선호 위험). Python 저장소 12개만 다룬다. 초록의 \"~90% agreement\"는 κ가 아니다.<\/li>\n<\/ul>\n<h3>채점 기준을 과제마다 새로 만드는 채점관 — Agentic Rubrics (Raghavendra 외 2026)<\/h3>\n<p>위 연구들은 채점 기준을 사람이 미리 정해 두었다. 이 연구는 <strong>기준표(루브릭)를 과제마다 에이전트가 새로 만든다.<\/strong> 단, 채점 대상이 리뷰 코멘트가 아니라 <strong>코드 패치<\/strong>다. \"AI가 만든 PR을 테스트를 돌리지 않고 채점할 수 있나\"를 묻는 연구여서, 07장의 머지 판정과 이어진다.<\/p>\n<ul>\n<li><strong>방법<\/strong>: ① 전문가 역할 에이전트(Claude Sonnet-4.5)가 이슈를 읽고 저장소를 직접 돌아본 뒤 체크리스트 <code>rubrics.yaml<\/code>을 쓴다. 항목마다 가중치 1~3, 축은 넷 — 파일 변경 · 명세 일치 · 무결성 · 실행 시 동작. ② 다른 모델(GPT-5, 낮은 추론)이 후보 패치마다 이 체크리스트로 채점한다. ③ 가중 점수로 후보를 다시 줄 세운다.<\/li>\n<li><strong>실험<\/strong>: SWE-bench Verified 500문제. 작은 모델(Qwen3 계열)이 문제마다 패치 16개를 내면, 그중 하나를 고르는 실력(Best@16)을 잰다.<\/li>\n<li><strong>결과<\/strong>: 40.6%·54.2%로, 가장 좋은 비교 방법보다 <strong>+3.5%p·+4.0%p<\/strong>. 루브릭 점수가 실제 테스트 통과를 얼마나 잘 가르는지는 ROC-AUC 0.886.<\/li>\n<li><strong>읽을 때 주의<\/strong>: 생성 모델과 채점 모델을 일부러 다른 회사 것으로 나눴다(아래 5절의 \"다른 모델로 채점하라\"와 같은 방향). 정답은 여전히 원래 PR의 테스트다 — 채점관이 테스트를 <strong>대신할 수 있는지<\/strong>를 테스트로 확인한 셈이다. 프롬프트는 부록 A.10~A.12에 실려 있다. 프리프린트이고(D), 리뷰 코멘트 채점에는 적용해 보지 않았다.<\/li>\n<li>흔히 \"좋은 코드를 두 배 더 골라낸다\"고 소개되지만, 논문의 \"두 배\"는 <strong>루브릭 항목 수<\/strong>(Sonnet-4.5가 문제당 평균 20개 넘게, Qwen3-32B의 두 배)를 말한 것이다. 성능 개선은 위의 %p 값이다.<\/li>\n<\/ul>\n<h2>5. 검증 — 채점관을 어떻게 믿을 만하게 만드나<\/h2>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:640px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 330\" role=\"img\" aria-label=\"채점관 검증 흐름\" data-minw=\"640\"><title>채점관 검증 흐름<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"760\" height=\"330\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">채점관을 믿으려면 — 소량의 사람 라벨로 재고 고친다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">위 줄: 자동 채점 흐름 · 아래 줄: 채점관 검증·보정 흐름<\/text><rect x=\"20\" y=\"72\" width=\"150\" height=\"56\" rx=\"10\" class=\"node\"/><text x=\"95.0\" y=\"96.0\" class=\"t-b\" text-anchor=\"middle\">에이전트 지적<\/text><text x=\"95.0\" y=\"114.0\" class=\"t-mut\" text-anchor=\"middle\">PR당 여러 개<\/text><rect x=\"200\" y=\"72\" width=\"150\" height=\"56\" rx=\"10\" class=\"node-acc\"/><text x=\"275.0\" y=\"96.0\" class=\"t-b\" text-anchor=\"middle\">Matcher<\/text><text x=\"275.0\" y=\"114.0\" class=\"t-mut\" text-anchor=\"middle\">정답과 같은 문제?<\/text><rect x=\"380\" y=\"72\" width=\"150\" height=\"56\" rx=\"10\" class=\"node-acc\"/><text x=\"455.0\" y=\"96.0\" class=\"t-b\" text-anchor=\"middle\">Judge<\/text><text x=\"455.0\" y=\"114.0\" class=\"t-mut\" text-anchor=\"middle\">정답지 밖 지적이 맞나?<\/text><rect x=\"580\" y=\"72\" width=\"160\" height=\"56\" rx=\"10\" class=\"node\"/><text x=\"660.0\" y=\"96.0\" class=\"t-b\" text-anchor=\"middle\">점수<\/text><text x=\"660.0\" y=\"114.0\" class=\"t-mut\" text-anchor=\"middle\">P · R · Fβ<\/text><line class=\"arrow\" x1=\"172.0\" y1=\"100.0\" x2=\"191.0\" y2=\"100.0\"/><path class=\"ahead\" d=\"M198.0,100.0L191.0,96.5L191.0,103.5z\"/><line class=\"arrow\" x1=\"352.0\" y1=\"100.0\" x2=\"371.0\" y2=\"100.0\"/><path class=\"ahead\" d=\"M378.0,100.0L371.0,96.5L371.0,103.5z\"/><line class=\"arrow\" x1=\"532.0\" y1=\"100.0\" x2=\"571.0\" y2=\"100.0\"/><path class=\"ahead\" d=\"M578.0,100.0L571.0,96.5L571.0,103.5z\"/><rect x=\"440\" y=\"138\" width=\"65\" height=\"22\" rx=\"11\" class=\"f-warn\"/><text x=\"472.4\" y=\"153.0\" class=\"t-mut\" text-anchor=\"middle\">위치 편향<\/text><rect x=\"510.76\" y=\"138\" width=\"65\" height=\"22\" rx=\"11\" class=\"f-warn\"/><text x=\"543.1\" y=\"153.0\" class=\"t-mut\" text-anchor=\"middle\">길이 편향<\/text><rect x=\"581.52\" y=\"138\" width=\"65\" height=\"22\" rx=\"11\" class=\"f-warn\"/><text x=\"613.9\" y=\"153.0\" class=\"t-mut\" text-anchor=\"middle\">자기 선호<\/text><rect x=\"652.28\" y=\"138\" width=\"65\" height=\"22\" rx=\"11\" class=\"f-warn\"/><text x=\"684.7\" y=\"153.0\" class=\"t-mut\" text-anchor=\"middle\">표면 단서<\/text><rect x=\"20\" y=\"220\" width=\"160\" height=\"56\" rx=\"10\" class=\"node\"/><text x=\"100.0\" y=\"244.0\" class=\"t-b\" text-anchor=\"middle\">사람 라벨 소량<\/text><text x=\"100.0\" y=\"262.0\" class=\"t-mut\" text-anchor=\"middle\">30~100개 (실패 유형별)<\/text><rect x=\"220\" y=\"220\" width=\"160\" height=\"56\" rx=\"10\" class=\"node\"/><text x=\"300.0\" y=\"244.0\" class=\"t-b\" text-anchor=\"middle\">채점관과 비교<\/text><text x=\"300.0\" y=\"262.0\" class=\"t-mut\" text-anchor=\"middle\">민감도 q₁ · 특이도 q₀<\/text><rect x=\"420\" y=\"220\" width=\"160\" height=\"56\" rx=\"10\" class=\"node\"/><text x=\"500.0\" y=\"244.0\" class=\"t-b\" text-anchor=\"middle\">보정<\/text><text x=\"500.0\" y=\"262.0\" class=\"t-mut\" text-anchor=\"middle\">PPI · Rogan–Gladen<\/text><rect x=\"600\" y=\"220\" width=\"140\" height=\"56\" rx=\"10\" class=\"node-acc\"/><text x=\"670.0\" y=\"244.0\" class=\"t-b\" text-anchor=\"middle\">믿을 만한 점수<\/text><text x=\"670.0\" y=\"262.0\" class=\"t-mut\" text-anchor=\"middle\">신뢰구간 포함<\/text><line class=\"arrow\" x1=\"182.0\" y1=\"248.0\" x2=\"211.0\" y2=\"248.0\"/><path class=\"ahead\" d=\"M218.0,248.0L211.0,244.5L211.0,251.5z\"/><line class=\"arrow\" x1=\"382.0\" y1=\"248.0\" x2=\"411.0\" y2=\"248.0\"/><path class=\"ahead\" d=\"M418.0,248.0L411.0,244.5L411.0,251.5z\"/><line class=\"arrow\" x1=\"582.0\" y1=\"248.0\" x2=\"591.0\" y2=\"248.0\"/><path class=\"ahead\" d=\"M598.0,248.0L591.0,244.5L591.0,251.5z\"/><line class=\"arrow\" x1=\"400.0\" y1=\"130.0\" x2=\"305.3\" y2=\"213.4\"/><path class=\"ahead\" d=\"M300.0,218.0L307.6,216.0L302.9,210.7z\"/><text x=\"338.0\" y=\"172.0\" class=\"t-mut\" text-anchor=\"end\">같은 판정을 사람에게도<\/text><text x=\"20.0\" y=\"316.0\" class=\"t-mut\">카파·일치율 하나로 끝내지 말고 &#x27;맞음을 맞음으로&#x27;와 &#x27;틀림을 틀림으로&#x27; 비율을 따로 본다 (Hamel Husain, Eugene Yan)<\/text><\/svg><\/div><figcaption>그림 3-2. 자동 채점 흐름과 채점관 검증·보정 흐름 — 위는 점수를 내는 길, 아래는 그 점수를 믿을 수 있게 만드는 길<\/figcaption><\/figure>\n<blockquote>\n<p><strong>한 줄로<\/strong>: 사람이 일부만 다시 채점해서 채점관과 비교하고(검증), 채점관이 치우친 만큼 결과를 되돌린다(보정).<\/p>\n<\/blockquote>\n<p>비유로 돌아가면 순서는 이렇다.<\/p>\n<ol>\n<li><strong>표본 뽑기<\/strong>: 채점관이 판정한 건 중 몇십~백 건을 무작위로 뽑는다<\/li>\n<li><strong>사람이 다시 채점<\/strong>: 같은 건을 사람이 채점관 판정을 보지 않고 채점한다<\/li>\n<li><strong>비교<\/strong>: 채점관이 \"맞음\"을 얼마나 잘 잡는지, \"틀림\"을 얼마나 잘 잡는지 <strong>따로<\/strong> 잰다<\/li>\n<li><strong>고치거나 보정<\/strong>: 많이 어긋나면 채점 프롬프트(기준)를 고치고 1로 돌아간다. 쓸 만한데 한쪽으로 치우쳤으면 아래 보정식으로 점수를 바로잡는다<\/li>\n<\/ol>\n<h3>실무 절차 (1차 문서·전문가 글)<\/h3>\n<table>\n<thead>\n<tr>\n<th>출처<\/th>\n<th>핵심<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Anthropic 문서 · Anthropic 엔지니어링 블로그 2026-01<\/td>\n<td>생성한 모델과 <strong>다른 모델<\/strong>로 채점하라. LLM 채점관은 사람 전문가와 긴밀히 보정하라<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>Shankar 외 2024 \"Who Validates the Validators?\" (UIST 2024)<\/td>\n<td><strong>기준 표류(criteria drift)<\/strong>: 사람은 출력물을 채점해 보기 전에는 평가 기준을 다 정할 수 없다. 채점하면서 기준이 바뀐다(9명 질적 연구)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Hamel Husain 2024 (C)<\/td>\n<td>1~5점 척도 대신 합격/불합격으로. 참양성률과 참음성률을 <strong>따로<\/strong> 보고. 약 30개로 시작하고 실패 유형마다 약 100개. 프롬프트 3번 고쳐 전문가와 90% 이상 일치(실패 약 50%인 데이터)<\/td>\n<td>C<\/td>\n<\/tr>\n<tr>\n<td>Eugene Yan 2024 (C)<\/td>\n<td>상관계수를 경계하라. 상관이 0.8~0.9인데 κ는 0.3~0.5인 사례가 있었다. 채점관이 맞는 요약은 95% 이상 잡았지만 틀린 요약은 30~60%만 잡았다<\/td>\n<td>C<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>표의 Hamel Husain·Eugene Yan이 \"참양성률과 참음성률을 따로 보라\"고 하는 이유를 예로 보면: 에이전트 지적 100개 중 90개가 진짜 맞는 지적이라면, 채점관이 생각 없이 전부 \"맞음\"이라고 해도 일치율은 90%다. 그런데 틀린 지적 10개는 하나도 못 잡았다. <strong>일치율 하나로는 이 구멍이 안 보인다.<\/strong><\/p>\n<h3>통계적 보정 — 적은 사람 라벨로 채점관 편향을 고친다<\/h3>\n<p>사람 라벨을 소량 붙이고, LLM 라벨을 대량으로 쓰는 방법이다.<\/p>\n<blockquote>\n<p><strong>직관<\/strong>: 조교가 1,000장을 채점했고 교수가 그중 100장을 다시 채점했다. 100장에서 \"조교가 평균 5점 후하다\"가 나왔다면, 1,000장 평균에서도 5점을 빼면 된다. 아래 방법들은 이 생각을 통계적으로 엄밀하게 만든 것이다. 덤으로 \"그 보정값이 얼마나 확실한지\"(신뢰구간)도 같이 나온다.<\/p>\n<\/blockquote>\n<ul>\n<li><strong>PPI (Angelopoulos 외 2023, Science)<\/strong> · <strong>AutoEval Done Right (Boyeau 외, ICML 2025)<\/strong>: LLM 예측을 쓰되, 사람 라벨이 있는 소량 표본으로 그 오차를 재서 보정한다. 결과는 편향 없는 추정치와 유효한 신뢰구간이다. 효과는 채점관이 사람과 얼마나 상관있는지에 달렸다.<\/li>\n<li><strong>Prediction-Powered Ranking (Chatzi 외, NeurIPS 2024)<\/strong>: 여러 모델의 <strong>순위<\/strong>에 같은 방법을 적용한다. 순위를 점 하나가 아니라 \"가능한 순위 범위\"로 낸다. LLM 판정만으로 만든 순위는 사람 선호와 자주 어긋났다.<\/li>\n<li><strong>Lee 외 2025 (프리프린트, 심사 미확인)<\/strong>: 고전적인 Rogan–Gladen 보정식을 쓴다. 원래 의학에서 \"검사 키트가 완벽하지 않을 때 실제 유병률을 추정\"하던 식이다. 채점관을 \"완벽하지 않은 검사 키트\"로 보는 셈이다.\n    <code>보정된 정답률 = (p̂ + q̂₀ − 1) / (q̂₀ + q̂₁ − 1)\n    p̂: LLM이 본 원시 정답률 · q̂₁: 민감도(진짜 정답을 정답이라 함) · q̂₀: 특이도(진짜 오답을 오답이라 함)<\/code>\n    민감도·특이도는 사람 라벨로 잰다. 채점관이 무작위 수준(q≈0.5)에 가까우면 분모가 0에 가까워져 불안정해진다.<\/li>\n<\/ul>\n<p><strong>예시(수치는 설명용)<\/strong> — 에이전트 지적 1,000개를 채점관이 판정했고, 그중 100개를 사람이 다시 봤다고 하자: 채점관이 \"맞음\"이라고 한 비율이 70%인데, 사람 라벨 100개로 재 보니 민감도 0.9, 특이도 0.8이었다면 → (0.70 + 0.8 − 1)/(0.8 + 0.9 − 1) = 0.50/0.70 ≈ <strong>0.71<\/strong>. 이 경우 원시값 70%와 거의 같다. 특이도가 0.6이면 (0.70+0.6−1)/(0.6+0.9−1) = 0.30/0.50 = <strong>0.60<\/strong>. 원시값이 10%p 부풀려져 있었던 셈이다. 특이도가 낮다는 건 \"틀린 지적도 맞다고 해 주는\" 관대한 채점관이라는 뜻이고, 그만큼 \"맞음\" 비율이 부풀려진다.<\/p>\n<p>아래 계산기에서 특이도를 낮춰 보면 보정값이 어떻게 내려가는지 바로 볼 수 있다.<\/p>\n<div class=\"widget\" data-widget=\"judge\"><\/div>\n\n<h2>문헌 카드<\/h2>\n<table>\n<thead>\n<tr>\n<th>문헌<\/th>\n<th>선정 근거<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Zheng 외 2023 MT-Bench<\/td>\n<td><strong>원조<\/strong>이자 최다 인용(S2 13,411)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Liu 외 2023 G-Eval (EMNLP)<\/td>\n<td>확률 가중 채점의 대표(S2 3,711)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Wang 외 2023 · Panickssery 외 2024<\/td>\n<td>위치 편향·자기 선호를 처음 체계적으로 측정<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Shankar 외 2024 (UIST)<\/td>\n<td>채점 기준 설계 과정 자체를 연구<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Thakur 외 2024 · Bavaresco 외 2025 (ACL) · JudgeBench · LLMBar (ICLR)<\/td>\n<td>채점관 자체를 시험한 메타 평가<\/td>\n<td>A·D<\/td>\n<\/tr>\n<tr>\n<td>Gu 외 2024 · Li 외 2024 서베이<\/td>\n<td>분야 전체 지도(S2 2,073 / 790)<\/td>\n<td>D·A<\/td>\n<\/tr>\n<tr>\n<td>CodeJudge · CodeJudgeBench · Wang 2025 · Ahmed 2024 · Moon 2026<\/td>\n<td>코드 도메인 채점관 연구<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>SWR-Bench · DeepCRCEval · CRScore · CRJudgeBench<\/td>\n<td><strong>리뷰 코멘트<\/strong> 채점을 직접 검증한 연구<\/td>\n<td>A·D<\/td>\n<\/tr>\n<tr>\n<td>Raghavendra 외 2026 Agentic Rubrics (Scale AI)<\/td>\n<td><strong>최신성<\/strong>. 과제마다 루브릭을 생성하는 채점관. 패치 채점이라 리뷰와는 대상이 다르다<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>PPI · AutoEval · PP-Ranking · Lee 2025<\/td>\n<td>소량 사람 라벨로 채점관 편향을 보정하는 통계<\/td>\n<td>A·D<\/td>\n<\/tr>\n<tr>\n<td>Anthropic 문서 · Hamel Husain · Eugene Yan<\/td>\n<td>실무 1차 지침과 경험 기반 해설<\/td>\n<td>B·C<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>연구들이 엇갈리는 지점<\/h2>\n<blockquote>\n<p>아래는 연구끼리 결론이 다른 곳이다. \"어느 쪽이 맞다\"가 아니라 <strong>우리 환경에서 직접 확인해야 할 것<\/strong>의 목록으로 읽으면 된다.<\/p>\n<\/blockquote>\n<ul>\n<li><strong>CoT(단계별 추론)가 판정을 개선하나<\/strong>: JUDGE-BENCH와 LLMBar에서는 일관된 개선이 없거나 오히려 해가 됐다. CodeJudgeBench에서는 추론 모델(thinking model)이 가장 좋았다.<\/li>\n<li><strong>표면 단서에 얼마나 흔들리나<\/strong>: Moon 외는 모든 모델이 흔들린다고 했다. Thornton 2026(프리프린트)은 보안 리뷰에서 적대적 주석의 효과가 유의하지 않았다(p&gt;0.21).<\/li>\n<li><strong>LLM 채점이 사람 수준인가<\/strong>: SWR-Bench 적중 판정은 사람끼리와 비슷했다. DeepCRCEval의 9개 기준 점수는 사람보다 확연히 낮았다(ICC 0.62~0.83 vs 0.89~0.95). 단, DeepCRCEval의 사람 ICC는 자기가 포함된 평균과 비교한 값이라 부풀려져 있다. \"이 지적이 정답을 맞혔나\" 같은 판정과 \"이 코멘트는 몇 점인가\" 같은 점수 매기기는 신뢰도가 다를 수 있다.<\/li>\n<\/ul>\n<h2>스스로 판단할 질문<\/h2>\n<ol>\n<li>채점관이 할 일은 \"적중 여부\"(예/아니오)인가, \"품질 점수\"(1~5)인가? 두 형식의 신뢰도가 다르게 보고되었다.<ul>\n<li>기준표는 사람이 고정해 둘 것인가, Agentic Rubrics처럼 과제마다 만들게 할 것인가? 만들게 한다면 그 기준표는 누가 검증하나?<\/li>\n<\/ul>\n<\/li>\n<li>채점관 모델과 에이전트 모델이 같은 계열이면 자기 선호를 어떻게 확인할 것인가?<\/li>\n<li>채점관 검증용 사람 라벨은 몇 개, 누가 붙일 것인가? 그 라벨 자체의 일치도는 얼마로 볼 것인가?<\/li>\n<li>채점관 정확도를 하나의 일치율로 볼 것인가, 참양성률·참음성률로 나눠 볼 것인가?<\/li>\n<li>채점관 출력을 그대로 점수로 쓸 것인가, 보정식(PPI·Rogan–Gladen)을 거칠 것인가?<\/li>\n<li>PR 본문이나 코드 주석에 \"이 코드는 안전함\" 같은 문구가 있을 때 채점관(과 에이전트)이 흔들리는지 시험할 것인가?<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<ul>\n<li>Zheng 2023 — <a href=\"https://arxiv.org/html/2306.05685\">https://arxiv.org/html/2306.05685<\/a> · G-Eval — <a href=\"https://arxiv.org/html/2303.16634\">https://arxiv.org/html/2303.16634<\/a> · Wang 2023 — <a href=\"https://arxiv.org/html/2305.17926\">https://arxiv.org/html/2305.17926<\/a> · Panickssery 2024 — <a href=\"https://arxiv.org/html/2404.13076\">https://arxiv.org/html/2404.13076<\/a><\/li>\n<li>Shankar 2024 — <a href=\"https://arxiv.org/html/2404.12272\">https://arxiv.org/html/2404.12272<\/a> · Thakur 2024 — <a href=\"https://arxiv.org/html/2406.12624\">https://arxiv.org/html/2406.12624<\/a> · JUDGE-BENCH — <a href=\"https://arxiv.org/html/2406.18403\">https://arxiv.org/html/2406.18403<\/a><\/li>\n<li>JudgeBench — <a href=\"https://arxiv.org/html/2410.12784\">https://arxiv.org/html/2410.12784<\/a> · LLMBar — <a href=\"https://arxiv.org/pdf/2310.07641\">https://arxiv.org/pdf/2310.07641<\/a><\/li>\n<li>Gu 2024 — <a href=\"https://arxiv.org/html/2411.15594\">https://arxiv.org/html/2411.15594<\/a> · Li 2024 — <a href=\"https://arxiv.org/html/2411.16594\">https://arxiv.org/html/2411.16594<\/a><\/li>\n<li>CodeJudge — <a href=\"https://arxiv.org/html/2410.02184\">https://arxiv.org/html/2410.02184<\/a> · Ahmed 2024 — <a href=\"https://arxiv.org/html/2408.05534\">https://arxiv.org/html/2408.05534<\/a> · Wang 2025 — <a href=\"https://arxiv.org/html/2502.06193\">https://arxiv.org/html/2502.06193<\/a> · CodeJudgeBench — <a href=\"https://arxiv.org/html/2507.10535\">https://arxiv.org/html/2507.10535<\/a> · Moon 외 — <a href=\"https://arxiv.org/html/2505.16222v1\">https://arxiv.org/html/2505.16222v1<\/a><\/li>\n<li>SWR-Bench — <a href=\"https://arxiv.org/html/2509.01494\">https://arxiv.org/html/2509.01494<\/a> · 판정 코드 — <a href=\"https://raw.githubusercontent.com/ZZR0/SWRench/main/swrbench/evaluation_struct.py\">https://raw.githubusercontent.com/ZZR0/SWRench/main/swrbench/evaluation_struct.py<\/a> (B, ok)<\/li>\n<li>DeepCRCEval — <a href=\"https://arxiv.org/html/2412.18291\">https://arxiv.org/html/2412.18291<\/a> · CRScore — <a href=\"https://arxiv.org/html/2409.19801\">https://arxiv.org/html/2409.19801<\/a> · CRJudgeBench — <a href=\"https://arxiv.org/abs/2609.37216\">https://arxiv.org/abs/2609.37216<\/a><\/li>\n<li>Agentic Rubrics (Raghavendra · Gunjal · Liu · He, Scale AI, 2026-01-07) — <a href=\"https://arxiv.org/abs/2601.04171\">https://arxiv.org/abs/2601.04171<\/a> · <a href=\"https://arxiv.org/html/2601.04171v1\">https://arxiv.org/html/2601.04171v1<\/a> (D, 초록·본문 확인, 부록 미확인)<\/li>\n<li>PPI — <a href=\"https://arxiv.org/html/2301.09633\">https://arxiv.org/html/2301.09633<\/a> · AutoEval — <a href=\"https://arxiv.org/html/2403.07008\">https://arxiv.org/html/2403.07008<\/a> · PP-Ranking — <a href=\"https://arxiv.org/html/2402.17826\">https://arxiv.org/html/2402.17826<\/a> · Lee 2025 — <a href=\"https://arxiv.org/html/2511.21140v3\">https://arxiv.org/html/2511.21140v3<\/a><\/li>\n<li>Anthropic — <a href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">https://platform.claude.com/docs/en/test-and-evaluate/develop-tests<\/a> · <a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\">https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents<\/a><\/li>\n<li>Hamel Husain — <a href=\"https://hamel.dev/blog/posts/llm-judge/\">https://hamel.dev/blog/posts/llm-judge/<\/a> · Eugene Yan — <a href=\"https://eugeneyan.com/writing/llm-evaluators/\">https://eugeneyan.com/writing/llm-evaluators/<\/a><\/li>\n<li>Thornton 2026 — <a href=\"https://arxiv.org/abs/2602.16741\">https://arxiv.org/abs/2602.16741<\/a><\/li>\n<\/ul>", "text": " 03. LLM 채점관(LLM-as-a-judge) — 믿을 수 있나, 어떻게 검증하나 생성일 : 2026-11-19 최종 수정일 : 2026-11-25 수준 : 기초 → 심화 근거 원장 : wave-1 A3 · wave-2 W2b · wave-1 A9 반론 · wave-4 Agentic Rubrics 이 장에서 답하는 질문 리뷰 평가에서 LLM은 두 가지 일을 맡는다. 매칭 : 에이전트 지적과 정답 지적이 같은 문제를 말하는가 판정 : 정답지에 없는 지적이 맞는가, 쓸모 있는가 LLM이 사람 대신 채점할 때 어떤 편향이 있고, 사람과 얼마나 일치하며, 그것을 어떻게 확인하고 보정하나? 0. 먼저 그림으로 이해하기 비유 — 시험 채점을 조교에게 맡긴다 교수 혼자 답안지 1,000장을 채점할 수 없어서 조교(LLM) 에게 맡긴다고 해 보자. 조교는 빠르고 싸다. 1,000장을 몇 분 만에 끝낸다. 대신 조교에게는 버릇 이 있을 수 있다. 첫 번째 답안을 더 좋게 본다든지, 길게 쓴 답안에 점수를 후하게 준다든지, 자기가 쓴 모범답안과 비슷하면 가산점을 준다든지. 그래서 교수는 답안 몇십 장을 직접 다시 채점 해서 조교와 비교한다. 많이 일치하면 조교를 믿고, 조교가 일관되게 후하다면 그만큼 점수를 깎아서 보정 한다. 이 장 전체가 이 이야기다. 1~4절은 \"조교에게 어떤 버릇이 있고, 얼마나 사람과 맞는가\"를 다룬 연구들이고, 5절은 \"교수가 조교를 어떻게 검사하고 보정하나\"다. 장 구성 — 어느 절이 PR 리뷰 얘기인가 PR 리뷰 채점만 따로 연구한 논문은 아직 적다. 그래서 이 장은 일반 과제에서 시작해 리뷰로 좁혀 간다. 절 채점 대상 PR 리뷰와의 관계 1~3절 챗봇 답변, 요약, 퀴즈 답, 수학·코딩 문제 풀이 등 리뷰가 아닌 일반 과제 채점관의 일반적인 버릇과 실력을 보여 준다. 리뷰에서도 같은 버릇이 나올지는 따로 확인해야 한다 4절 리뷰 코멘트 와 코드 정답 여부 PR 리뷰 채점을 직접 다룬 연구는 여기 모여 있다 5절 과제를 가리지 않는 검증·보정 방법 리뷰 채점에도 그대로 쓸 수 있다 1~3절에 나오는 PR 리뷰 예시는 \"리뷰에 대입하면 이런 모습일 것\"이라는 설명용이고, 연구 결과가 아니다. PR 리뷰에 대입하면 정답지(사람이 단 리뷰)에 이런 지적이 있다고 하자. 정답: \" user 가 null일 때 user.getName() 에서 NullPointerException이 난다\" 리뷰 에이전트는 이렇게 썼다. 에이전트 A: \" findUser() 결과를 바로 쓰고 있어 조회 실패 시 예외가 날 수 있습니다. null 체크를 추가하세요.\" 에이전트 B: \" getName() 의 반환 타입을 Optional로 바꾸면 더 좋겠습니다.\" 매칭 : A는 표현은 다르지만 같은 문제를 말한다 → \"적중\". B는 getName 이라는 단어는 겹치지만 다른 얘기다 → \"적중 아님\". 단어가 겹치는지로는 가를 수 없어서 LLM에게 묻는다. 판정 : B가 정답지에 없는 지적이라면, 그것이 맞는 말인지·쓸모 있는지 LLM에게 묻는다. 어느 쪽이든 LLM의 답이 틀리면 에이전트 점수 자체가 틀린다. 그래서 채점관을 먼저 검사해야 한다. 이 장에 나오는 용어 용어 쉬운 뜻 일치율 두 채점자가 같은 판정을 낸 비율. 우연히 맞은 것도 섞여 있다 κ(카파) 우연히 맞을 몫을 빼고 본 일치도. 0이면 \"찍은 수준\", 1이면 완전 일치. 보통 0.6 넘으면 꽤 맞는다고 본다(관례). 자세한 건 02장 상관(피어슨·스피어먼) 한쪽 점수가 오를 때 다른 쪽도 같이 오르는 정도. 경향이 같다는 뜻이지 점수가 같다는 뜻은 아니다 ICC 여러 채점자가 매긴 점수가 얼마나 비슷한지(0~1). 점수형 채점의 일치도 CoT(Chain-of-Thought) 바로 답하지 말고 \"단계별로 생각한 뒤\" 판정하게 하는 프롬프트 방식 민감도 · 특이도 진짜 맞는 걸 \"맞다\"고 잡는 비율 · 진짜 틀린 걸 \"틀리다\"고 잡는 비율. 5절 보정에 쓴다 BLEU(블루) 기계 번역용으로 만든 옛 자동 채점 지표. 정답 문장과 단어가 얼마나 겹치는지 만 센다. 뜻이 같아도 표현이 다르면 낮게 나온다. 맞는 코멘트가 낮고 틀린 코멘트가 높게 나오는 예시와 계산 방식은 02장 4절 프리프린트 학회·저널 심사를 아직 통과하지 않은 논문. 등급 D로 표시 이 장 요약 (세 줄) LLM 채점관은 평균적으로 사람끼리 일치하는 만큼 사람과 일치한다. 하지만 과제에 따라 동전 던지기 수준으로 떨어지기도 한다. 순서·길이·자기 글·주석 문구 같은 겉모습에 흔들리는 버릇 이 여러 연구에서 확인됐다. 그래서 사람 라벨 소량으로 채점관을 검사 하고, 필요하면 통계식으로 점수를 보정 한다. 1. 출발점 — \"사람끼리만큼은 일치한다\"는 결과와 그 단서 한 줄로 : \"LLM 채점이 사람만큼 맞는다\"는 유명한 결과는 사실이지만, 조건을 알고 읽어야 한다. Zheng 외 2023 (MT-Bench / Chatbot Arena, NeurIPS 2023, S2 13,411) — LLM 채점관 연구의 원점이다. 채점 대상 : 챗봇 답변(글쓰기·역할극·추론·수학·코딩·인문 등 8개 분야의 질문). PR 리뷰가 아니다. 두 챗봇 답을 나란히 보여 주고 \"어느 쪽이 나은가\"를 GPT-4와 사람에게 각각 물었다. 표는 그 판정이 얼마나 같았는지다. 조건 GPT-4 vs 사람 사람 vs 사람 무승부 제외 85% 81% 무승부 포함 66% 63% 읽는 법: 사람끼리도 81%밖에 안 맞는다. GPT-4와 사람은 85% 맞았다. 즉 \"GPT-4는 사람 한 명을 더 데려온 것과 비슷하다\"는 뜻이지, \"항상 옳다\"는 뜻이 아니다. 흔히 인용되는 \"약 80% 일치\"는 무승부를 뺀 수치 다. 무승부를 넣으면 60%대로 떨어진다. 다만 어느 조건에서나 사람끼리의 일치와 비슷하다. 같은 논문이 찾은 편향: 위치 편향 (앞뒤 순서에 끌림): 두 답의 순서를 바꿔도 판정이 같은 비율이 GPT-4 65.0%, GPT-3.5 46.2%, Claude-v1 23.8%였다. 뒤집어 말하면 GPT-4도 셋 중 하나는 순서만 바꿔도 판정이 달라졌다 길이(장황함) 편향 : 같은 내용을 목록으로 반복해 늘린 답에 속은 비율이 Claude-v1·GPT-3.5 91.3%, GPT-4 8.7%였다(답 23개) 자기 선호 : GPT-4는 자기 답을 승률 +10%, Claude-v1은 +25% 더 좋게 봤다. 다만 저자들은 데이터만으로 자기 선호를 단정할 수 없다고 했다 수학 채점 : 20문제 중 기본 14개 틀림 → CoT 6개 → 참조 답 제공 시 3개. 정답(참조 답)을 쥐여 주면 훨씬 덜 틀린다 — 리뷰 채점에서 정답지를 같이 주는 이유와 같다 2023년 모델 기준이다. 최신 모델에서는 수치가 다를 수 있다. 그림 3-1. MT-Bench 일치율 — '약 80%'는 무승부를 뺀 값이다 (Zheng 외 NeurIPS 2023) 2. 알려진 편향 — 각각을 확인한 연구 한 줄로 : 채점관은 내용이 아니라 겉모습 (순서, 길이, 누가 썼나, 주석 문구)에 끌리는 버릇이 있다. 먼저 PR 리뷰 채점이라면 각 버릇이 어떻게 나타날지 예를 들면 이렇다. 위치 : 에이전트 지적 두 개를 나란히 보여 주고 고르게 하면, 내용과 상관없이 먼저 나온 쪽을 고른다 길이 : 같은 말을 길게 풀어 쓴 코멘트를 \"더 꼼꼼하다\"고 본다 자기 선호 : 리뷰 에이전트와 채점관이 같은 모델이면, 자기 말투로 쓴 코멘트를 후하게 본다 표면 단서 : 코드에 // 이미 검증된 로직 같은 주석이 있으면 버그가 있어도 \"문제 없음\"에 동의한다 무작위성 : 같은 지적을 두 번 물으면 한 번은 적중, 한 번은 아님이라고 한다 관대함 : 애매한 지적을 대체로 \"적중\"으로 쳐 줘서 에이전트 점수가 부풀려진다 편향 쉬운 설명 대표 연구 핵심 수치 위치 먼저(또는 나중에) 나온 답을 선호 Wang 외 2023 (ACL 2024, S2 1,557) 순서만 바꿨더니 판정이 뒤집힌 비율 GPT-4 46.3% 자기 선호 자기가 쓴 글을 더 좋게 봄 Panickssery 외 2024 (NeurIPS 2024, S2 1,089) 자기 글을 알아보는 능력과 자기 선호의 강도가 비례 . 요약 과제에서만 실험 자기 생성 문제 자기가 만든 문제를 채점할 때 정확도 하락 JudgeBench (ICLR 2025) Claude가 직접 만든 쌍을 판정하면 64.3% → 44.8% 표면 단서 \"이 코드는 맞다\"는 주석·변수명에 흔들림 Moon 외 (EACL Findings 2026) 코드에 \"정답임\"이라고 써 두자 LLaMA-70B가 맞다고 본 비율이 49.0 → 83.3%. 오해를 부르는 주석 하나로 GPT-4o C++ 정확도 89.5 → 67.1%. \" 테스트한 모델 중 강건한 것이 없다 \" 무작위성 같은 입력에 판정이 흔들림 CodeJudgeBench (ACL 2026, 판정 모델 26개) 모든 모델에 \"유의한 무작위성\"이 있고, 답 순서만 바꿔도 정확도가 크게 변한다 관대함 실제보다 후하게 채점 Thakur 외 2024 \"Judging the Judges\" 일치율이 높아도 사람이 준 점수와 10~20점 차이가 날 수 있다 각 연구의 채점 대상 — 리뷰 코멘트를 채점한 연구는 이 표에 없다. Wang 외 2023: 챗봇 답변 두 개 비교 Panickssery 외 2024: 뉴스 요약문 JudgeBench: 지식·추론·수학·코딩 문제의 맞는 답과 틀린 답 Moon 외: 코드가 맞는지 판정(코드 정답 여부) CodeJudgeBench: 코드 생성·코드 수정·테스트 작성 결과 비교 Thakur 외 2024: 퀴즈(TriviaQA) 답이 맞는지 판정 3. 판정 능력 자체를 시험하는 벤치마크 한 줄로 : \"LLM 채점관은 믿을 만하다/아니다\"로 한 번에 말할 수 없다. 과제마다 따로 재 봐야 한다. 이번에는 채점관 자체를 시험대에 올린 연구들이다. 정답이 확실한 문제를 내고 채점관이 얼마나 맞히는지 본다. 판정 정확도는 과제에 따라 크게 다르다. JUDGE-BENCH (Bavaresco 외, ACL 2025) — 채점 대상: 번역·요약·대화 등 사람이 이미 라벨을 붙여 둔 언어 과제 데이터셋. LLM 11개, 데이터셋 20개. 사람과의 일치가 데이터셋마다 0.84부터 0.05까지 벌어졌다. CoT(단계별 추론)가 일관되게 도움이 되지도 않았다. 권고: \"배포 전에 그 과제의 사람 라벨로 검증하라.\" JudgeBench (Tan 외, ICLR 2025) — 채점 대상: 지식·추론·수학·코딩 문제의 풀이. 객관적으로 맞는 답과 틀린 답의 쌍 350개. 둘 중 맞는 걸 고르는 문제라 아무렇게나 찍어도 50%다. GPT-4o 기본 프롬프트 50.86% (동전 던지기 수준), o3-mini(high) 80.86%. 판정 정확도는 그 모델이 문제를 직접 푸는 실력과 비슷하게 움직였다. 쉽게 말해 자기가 못 푸는 문제는 채점도 못 한다 — 어려운 버그를 못 찾는 모델은 그 버그를 지적한 코멘트가 맞는지도 잘 못 가린다. LLMBar (Zeng 외, ICLR 2024) — 채점 대상: 챗봇이 지시를 제대로 따랐는지(\"세 줄로 요약해\" 같은 지시). 쌍 419개. 전문가끼리 94% 일치했다. 최고 GPT-4 판정기도 적대적 세트에서 82.8%였다. CoT가 오히려 겉보기 품질 쪽으로 편향을 키운 경우가 있었다. 4. 코드·리뷰에서의 LLM 채점관 한 줄로 : 리뷰 채점에서는 \"맞혔나/아니냐\"(예·아니오)를 물을 때가 \"몇 점이냐\"를 물을 때보다 사람과 잘 맞았다. 표를 읽는 요령: κ는 0.6~0.8이면 \"상당히 일치\", 사람끼리 κ와 비슷하면 \"사람 한 명 몫은 한다\"로 읽으면 된다. 표에는 κ에 100을 곱한 값(70.6 = 0.706)으로 적혀 있다 BLEU는 단어가 얼마나 겹치는지만 보는 옛 지표다. 정답이 \"null 체크가 빠졌다\"인데 코멘트가 \"조회 실패 시 예외가 난다\"면, 같은 문제를 짚었어도 겹치는 단어가 없어 점수가 낮다. 음수 라는 건 사람 판단과 오히려 거꾸로 갔다는 뜻이다 ICC·상관은 1에 가까울수록 사람과 비슷하다 연구 무엇을 쟀나 결과 등급 SWR-Bench (PACMSE/FSE 2026) 리뷰 보고서가 정답 이슈를 \"적중(hit)\"했는지 LLM이 판정 적중 판정 사람-LLM κ 70.6~86.7 . 두 리뷰 중 어느 쪽이 나은지 고르는 판정에서 적중 기반은 κ 52.8~62.0(사람끼리 56.3~62.6), 1~10점 점수형은 31.0~44.9, BLEU는 음수 (−35~−41) A DeepCRCEval (FASE 2025) 리뷰 코멘트 9개 기준 점수 사람 평균과의 ICC: 사람 0.89~0.95, GPT-4 0.62~0.83 . 가독성·간결성이 가장 낮다. 시간 −88.78%, 비용 −90.32% A CRScore (NAACL 2025) 정답 없이 코멘트 품질 채점 사람과 Spearman 0.54, GPT 채점 0.605, BLEU ≈ 0 A CodeJudge (EMNLP 2024) 코드 정답 여부 평균 정확도 80.56%. 실패 600건 중 52.83%가 \"코드 로직 분석 오류\" A Wang 외 2025 (PACM SE) SE 과제별 LLM 채점 사람 점수와 피어슨 상관: 코드 번역 81.32, 코드 생성 68.51. 요약은 더 낮다 A Ahmed 외 2024 (MSR 2025) SE 산출물 주석을 LLM이 대체 가능한가 모델끼리 일치하면 사람과도 일치하는 경향 → 모델 간 불일치를 위험 신호로 쓸 수 있다 A CRJudgeBench (프리프린트, 심사 중) 그럴듯하지만 틀린 리뷰 코멘트를 골라내나 범용 최신 LLM도 \"신뢰할 수 없는 코멘트를 식별하는 데 어려움\". 특화 판정기 최고 76.6% D 정리하면: SWR-Bench 처럼 \"이 리뷰가 정답 이슈를 짚었나\"만 물으면 사람끼리 수준으로 맞았다 DeepCRCEval 처럼 \"가독성 몇 점, 간결성 몇 점\"을 물으면 사람보다 확연히 덜 맞았다 Ahmed 외 의 관찰은 실무 요령으로 쓸 만하다: 채점관 모델 두 개가 서로 다른 판정을 내면, 그 건은 사람이 볼 후보다 SWR-Bench의 실제 판정 규칙 (공개 코드 원문) 리뷰 채점 설계를 공부할 때 구체적인 예시로 볼 만하다. 채점관에게 실제로 어떤 기준을 줬는지 코드에서 확인한 내용이다. 적중 기준: \"A hit occurs if a predicted point substantially and correctly identifies the core essence of the ground truth change\" — 풀면 \"정답 지적의 핵심 을 실질적으로, 올바르게 짚었으면 적중\". 앞의 예시에서 에이전트 A는 적중, B는 아니다 일대일 제약: 정답 하나는 예측 지적 최대 하나 에만 적중으로 매칭한다. 같은 말을 세 번 쓴 에이전트가 적중 세 개를 받지 못하게 막는 장치다. 논문 본문은 \"one or more\"라고 써서 코드와 다르다. 판정 온도 0.0. 문제 없는 PR에서는 \"LGTM\"이라고 하거나 지적이 0개면 정답으로 친다. 단서: 정답을 Gemini-2.5-Pro로 추출했고 판정도 Gemini 계열이다(자기 선호 위험). Python 저장소 12개만 다룬다. 초록의 \"~90% agreement\"는 κ가 아니다. 채점 기준을 과제마다 새로 만드는 채점관 — Agentic Rubrics (Raghavendra 외 2026) 위 연구들은 채점 기준을 사람이 미리 정해 두었다. 이 연구는 기준표(루브릭)를 과제마다 에이전트가 새로 만든다. 단, 채점 대상이 리뷰 코멘트가 아니라 코드 패치 다. \"AI가 만든 PR을 테스트를 돌리지 않고 채점할 수 있나\"를 묻는 연구여서, 07장의 머지 판정과 이어진다. 방법 : ① 전문가 역할 에이전트(Claude Sonnet-4.5)가 이슈를 읽고 저장소를 직접 돌아본 뒤 체크리스트 rubrics.yaml 을 쓴다. 항목마다 가중치 1~3, 축은 넷 — 파일 변경 · 명세 일치 · 무결성 · 실행 시 동작. ② 다른 모델(GPT-5, 낮은 추론)이 후보 패치마다 이 체크리스트로 채점한다. ③ 가중 점수로 후보를 다시 줄 세운다. 실험 : SWE-bench Verified 500문제. 작은 모델(Qwen3 계열)이 문제마다 패치 16개를 내면, 그중 하나를 고르는 실력(Best@16)을 잰다. 결과 : 40.6%·54.2%로, 가장 좋은 비교 방법보다 +3.5%p·+4.0%p . 루브릭 점수가 실제 테스트 통과를 얼마나 잘 가르는지는 ROC-AUC 0.886. 읽을 때 주의 : 생성 모델과 채점 모델을 일부러 다른 회사 것으로 나눴다(아래 5절의 \"다른 모델로 채점하라\"와 같은 방향). 정답은 여전히 원래 PR의 테스트다 — 채점관이 테스트를 대신할 수 있는지 를 테스트로 확인한 셈이다. 프롬프트는 부록 A.10~A.12에 실려 있다. 프리프린트이고(D), 리뷰 코멘트 채점에는 적용해 보지 않았다. 흔히 \"좋은 코드를 두 배 더 골라낸다\"고 소개되지만, 논문의 \"두 배\"는 루브릭 항목 수 (Sonnet-4.5가 문제당 평균 20개 넘게, Qwen3-32B의 두 배)를 말한 것이다. 성능 개선은 위의 %p 값이다. 5. 검증 — 채점관을 어떻게 믿을 만하게 만드나 그림 3-2. 자동 채점 흐름과 채점관 검증·보정 흐름 — 위는 점수를 내는 길, 아래는 그 점수를 믿을 수 있게 만드는 길 한 줄로 : 사람이 일부만 다시 채점해서 채점관과 비교하고(검증), 채점관이 치우친 만큼 결과를 되돌린다(보정). 비유로 돌아가면 순서는 이렇다. 표본 뽑기 : 채점관이 판정한 건 중 몇십~백 건을 무작위로 뽑는다 사람이 다시 채점 : 같은 건을 사람이 채점관 판정을 보지 않고 채점한다 비교 : 채점관이 \"맞음\"을 얼마나 잘 잡는지, \"틀림\"을 얼마나 잘 잡는지 따로 잰다 고치거나 보정 : 많이 어긋나면 채점 프롬프트(기준)를 고치고 1로 돌아간다. 쓸 만한데 한쪽으로 치우쳤으면 아래 보정식으로 점수를 바로잡는다 실무 절차 (1차 문서·전문가 글) 출처 핵심 등급 Anthropic 문서 · Anthropic 엔지니어링 블로그 2026-01 생성한 모델과 다른 모델 로 채점하라. LLM 채점관은 사람 전문가와 긴밀히 보정하라 B Shankar 외 2024 \"Who Validates the Validators?\" (UIST 2024) 기준 표류(criteria drift) : 사람은 출력물을 채점해 보기 전에는 평가 기준을 다 정할 수 없다. 채점하면서 기준이 바뀐다(9명 질적 연구) A Hamel Husain 2024 (C) 1~5점 척도 대신 합격/불합격으로. 참양성률과 참음성률을 따로 보고. 약 30개로 시작하고 실패 유형마다 약 100개. 프롬프트 3번 고쳐 전문가와 90% 이상 일치(실패 약 50%인 데이터) C Eugene Yan 2024 (C) 상관계수를 경계하라. 상관이 0.8~0.9인데 κ는 0.3~0.5인 사례가 있었다. 채점관이 맞는 요약은 95% 이상 잡았지만 틀린 요약은 30~60%만 잡았다 C 표의 Hamel Husain·Eugene Yan이 \"참양성률과 참음성률을 따로 보라\"고 하는 이유를 예로 보면: 에이전트 지적 100개 중 90개가 진짜 맞는 지적이라면, 채점관이 생각 없이 전부 \"맞음\"이라고 해도 일치율은 90%다. 그런데 틀린 지적 10개는 하나도 못 잡았다. 일치율 하나로는 이 구멍이 안 보인다. 통계적 보정 — 적은 사람 라벨로 채점관 편향을 고친다 사람 라벨을 소량 붙이고, LLM 라벨을 대량으로 쓰는 방법이다. 직관 : 조교가 1,000장을 채점했고 교수가 그중 100장을 다시 채점했다. 100장에서 \"조교가 평균 5점 후하다\"가 나왔다면, 1,000장 평균에서도 5점을 빼면 된다. 아래 방법들은 이 생각을 통계적으로 엄밀하게 만든 것이다. 덤으로 \"그 보정값이 얼마나 확실한지\"(신뢰구간)도 같이 나온다. PPI (Angelopoulos 외 2023, Science) · AutoEval Done Right (Boyeau 외, ICML 2025) : LLM 예측을 쓰되, 사람 라벨이 있는 소량 표본으로 그 오차를 재서 보정한다. 결과는 편향 없는 추정치와 유효한 신뢰구간이다. 효과는 채점관이 사람과 얼마나 상관있는지에 달렸다. Prediction-Powered Ranking (Chatzi 외, NeurIPS 2024) : 여러 모델의 순위 에 같은 방법을 적용한다. 순위를 점 하나가 아니라 \"가능한 순위 범위\"로 낸다. LLM 판정만으로 만든 순위는 사람 선호와 자주 어긋났다. Lee 외 2025 (프리프린트, 심사 미확인) : 고전적인 Rogan–Gladen 보정식을 쓴다. 원래 의학에서 \"검사 키트가 완벽하지 않을 때 실제 유병률을 추정\"하던 식이다. 채점관을 \"완벽하지 않은 검사 키트\"로 보는 셈이다. 보정된 정답률 = (p̂ + q̂₀ − 1) / (q̂₀ + q̂₁ − 1) p̂: LLM이 본 원시 정답률 · q̂₁: 민감도(진짜 정답을 정답이라 함) · q̂₀: 특이도(진짜 오답을 오답이라 함) 민감도·특이도는 사람 라벨로 잰다. 채점관이 무작위 수준(q≈0.5)에 가까우면 분모가 0에 가까워져 불안정해진다. 예시(수치는 설명용) — 에이전트 지적 1,000개를 채점관이 판정했고, 그중 100개를 사람이 다시 봤다고 하자: 채점관이 \"맞음\"이라고 한 비율이 70%인데, 사람 라벨 100개로 재 보니 민감도 0.9, 특이도 0.8이었다면 → (0.70 + 0.8 − 1)/(0.8 + 0.9 − 1) = 0.50/0.70 ≈ 0.71 . 이 경우 원시값 70%와 거의 같다. 특이도가 0.6이면 (0.70+0.6−1)/(0.6+0.9−1) = 0.30/0.50 = 0.60 . 원시값이 10%p 부풀려져 있었던 셈이다. 특이도가 낮다는 건 \"틀린 지적도 맞다고 해 주는\" 관대한 채점관이라는 뜻이고, 그만큼 \"맞음\" 비율이 부풀려진다. 아래 계산기에서 특이도를 낮춰 보면 보정값이 어떻게 내려가는지 바로 볼 수 있다. 문헌 카드 문헌 선정 근거 등급 Zheng 외 2023 MT-Bench 원조 이자 최다 인용(S2 13,411) A Liu 외 2023 G-Eval (EMNLP) 확률 가중 채점의 대표(S2 3,711) A Wang 외 2023 · Panickssery 외 2024 위치 편향·자기 선호를 처음 체계적으로 측정 A Shankar 외 2024 (UIST) 채점 기준 설계 과정 자체를 연구 A Thakur 외 2024 · Bavaresco 외 2025 (ACL) · JudgeBench · LLMBar (ICLR) 채점관 자체를 시험한 메타 평가 A·D Gu 외 2024 · Li 외 2024 서베이 분야 전체 지도(S2 2,073 / 790) D·A CodeJudge · CodeJudgeBench · Wang 2025 · Ahmed 2024 · Moon 2026 코드 도메인 채점관 연구 A SWR-Bench · DeepCRCEval · CRScore · CRJudgeBench 리뷰 코멘트 채점을 직접 검증한 연구 A·D Raghavendra 외 2026 Agentic Rubrics (Scale AI) 최신성 . 과제마다 루브릭을 생성하는 채점관. 패치 채점이라 리뷰와는 대상이 다르다 D PPI · AutoEval · PP-Ranking · Lee 2025 소량 사람 라벨로 채점관 편향을 보정하는 통계 A·D Anthropic 문서 · Hamel Husain · Eugene Yan 실무 1차 지침과 경험 기반 해설 B·C 연구들이 엇갈리는 지점 아래는 연구끼리 결론이 다른 곳이다. \"어느 쪽이 맞다\"가 아니라 우리 환경에서 직접 확인해야 할 것 의 목록으로 읽으면 된다. CoT(단계별 추론)가 판정을 개선하나 : JUDGE-BENCH와 LLMBar에서는 일관된 개선이 없거나 오히려 해가 됐다. CodeJudgeBench에서는 추론 모델(thinking model)이 가장 좋았다. 표면 단서에 얼마나 흔들리나 : Moon 외는 모든 모델이 흔들린다고 했다. Thornton 2026(프리프린트)은 보안 리뷰에서 적대적 주석의 효과가 유의하지 않았다(p>0.21). LLM 채점이 사람 수준인가 : SWR-Bench 적중 판정은 사람끼리와 비슷했다. DeepCRCEval의 9개 기준 점수는 사람보다 확연히 낮았다(ICC 0.62~0.83 vs 0.89~0.95). 단, DeepCRCEval의 사람 ICC는 자기가 포함된 평균과 비교한 값이라 부풀려져 있다. \"이 지적이 정답을 맞혔나\" 같은 판정과 \"이 코멘트는 몇 점인가\" 같은 점수 매기기는 신뢰도가 다를 수 있다. 스스로 판단할 질문 채점관이 할 일은 \"적중 여부\"(예/아니오)인가, \"품질 점수\"(1~5)인가? 두 형식의 신뢰도가 다르게 보고되었다. 기준표는 사람이 고정해 둘 것인가, Agentic Rubrics처럼 과제마다 만들게 할 것인가? 만들게 한다면 그 기준표는 누가 검증하나? 채점관 모델과 에이전트 모델이 같은 계열이면 자기 선호를 어떻게 확인할 것인가? 채점관 검증용 사람 라벨은 몇 개, 누가 붙일 것인가? 그 라벨 자체의 일치도는 얼마로 볼 것인가? 채점관 정확도를 하나의 일치율로 볼 것인가, 참양성률·참음성률로 나눠 볼 것인가? 채점관 출력을 그대로 점수로 쓸 것인가, 보정식(PPI·Rogan–Gladen)을 거칠 것인가? PR 본문이나 코드 주석에 \"이 코드는 안전함\" 같은 문구가 있을 때 채점관(과 에이전트)이 흔들리는지 시험할 것인가? 출처 Zheng 2023 — https://arxiv.org/html/2306.05685 · G-Eval — https://arxiv.org/html/2303.16634 · Wang 2023 — https://arxiv.org/html/2305.17926 · Panickssery 2024 — https://arxiv.org/html/2404.13076 Shankar 2024 — https://arxiv.org/html/2404.12272 · Thakur 2024 — https://arxiv.org/html/2406.12624 · JUDGE-BENCH — https://arxiv.org/html/2406.18403 JudgeBench — https://arxiv.org/html/2410.12784 · LLMBar — https://arxiv.org/pdf/2310.07641 Gu 2024 — https://arxiv.org/html/2411.15594 · Li 2024 — https://arxiv.org/html/2411.16594 CodeJudge — https://arxiv.org/html/2410.02184 · Ahmed 2024 — https://arxiv.org/html/2408.05534 · Wang 2025 — https://arxiv.org/html/2502.06193 · CodeJudgeBench — https://arxiv.org/html/2507.10535 · Moon 외 — https://arxiv.org/html/2505.16222v1 SWR-Bench — https://arxiv.org/html/2509.01494 · 판정 코드 — https://raw.githubusercontent.com/ZZR0/SWRench/main/swrbench/evaluation_struct.py (B, ok) DeepCRCEval — https://arxiv.org/html/2412.18291 · CRScore — https://arxiv.org/html/2409.19801 · CRJudgeBench — https://arxiv.org/abs/2609.37216 Agentic Rubrics (Raghavendra · Gunjal · Liu · He, Scale AI, 2026-01-07) — https://arxiv.org/abs/2601.04171 · https://arxiv.org/html/2601.04171v1 (D, 초록·본문 확인, 부록 미확인) PPI — https://arxiv.org/html/2301.09633 · AutoEval — https://arxiv.org/html/2403.07008 · PP-Ranking — https://arxiv.org/html/2402.17826 · Lee 2025 — https://arxiv.org/html/2511.21140v3 Anthropic — https://platform.claude.com/docs/en/test-and-evaluate/develop-tests · https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents Hamel Husain — https://hamel.dev/blog/posts/llm-judge/ · Eugene Yan — https://eugeneyan.com/writing/llm-evaluators/ Thornton 2026 — https://arxiv.org/abs/2602.16741 "}, {"id": "04", "dir": "04-자동-코드리뷰-연구사", "title": "04. 자동 코드 리뷰 연구사 (2018~2024)", "level": "중급", "html": "<h1>04. 자동 코드 리뷰 연구사 (2018~2024)<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-19<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-25<\/li>\n<li><strong>수준<\/strong>: 중급<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A4-automated-review-history.md\">wave-1 A4<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-2-web-W2c-deep-reads.md\">wave-2 W2c<\/a><\/li>\n<\/ul>\n<h2>이 장에서 답하는 질문<\/h2>\n<p>LLM 리뷰 에이전트 이전에 \"리뷰 자동화\"는 어떤 문제로 정의되었고, 어떻게 평가되었나? 그 평가 방식은 왜 한계를 드러냈나?<\/p>\n<h2>큰 흐름 한눈에<\/h2>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:600px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 474\" role=\"img\" aria-label=\"자동 코드 리뷰 연구 연표\" data-minw=\"600\"><title>자동 코드 리뷰 연구 연표<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"760\" height=\"474\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">자동 코드 리뷰 연구 — 무엇으로 채점했나도 함께 바뀌었다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">왼쪽 띠 = 시대 · 점 = 대표 연구 (04·05장)<\/text><line class=\"grid\" x1=\"210\" y1=\"70\" x2=\"210\" y2=\"454\" stroke-width=\"2\"/><rect x=\"20\" y=\"74\" width=\"120\" height=\"40\" rx=\"8\" class=\"f-s2\"/><text x=\"80.0\" y=\"98.0\" class=\"t-sm\" text-anchor=\"middle\">검색·순위<\/text><rect x=\"20\" y=\"122\" width=\"120\" height=\"88\" rx=\"8\" class=\"f-acc\"/><text x=\"80.0\" y=\"162.0\" class=\"t-sm\" text-anchor=\"middle\">생성 모델<\/text><text x=\"80.0\" y=\"178.0\" class=\"t-sm\" text-anchor=\"middle\">· BLEU 채점<\/text><rect x=\"20\" y=\"218\" width=\"120\" height=\"88\" rx=\"8\" class=\"f-s2\"/><text x=\"80.0\" y=\"258.0\" class=\"t-sm\" text-anchor=\"middle\">초기 LLM<\/text><text x=\"80.0\" y=\"274.0\" class=\"t-sm\" text-anchor=\"middle\">· 데이터 품질 문제<\/text><rect x=\"20\" y=\"314\" width=\"120\" height=\"136\" rx=\"8\" class=\"f-acc\"/><text x=\"80.0\" y=\"378.0\" class=\"t-sm\" text-anchor=\"middle\">평가 재검토<\/text><text x=\"80.0\" y=\"394.0\" class=\"t-sm\" text-anchor=\"middle\">· 에이전트 벤치마크<\/text><text x=\"194.0\" y=\"98.0\" class=\"t-val\" text-anchor=\"end\">2018<\/text><circle cx=\"210\" cy=\"94.0\" r=\"5.5\" class=\"f-d1 ring\"/><text x=\"228.0\" y=\"91.0\" class=\"t-b\">DeepCodeReviewer (Microsoft, KDD)<\/text><text x=\"228.0\" y=\"108.0\" class=\"t-mut\">과거 리뷰 코멘트를 검색해 추천<\/text><text x=\"194.0\" y=\"146.0\" class=\"t-val\" text-anchor=\"end\">2021<\/text><circle cx=\"210\" cy=\"142.0\" r=\"5.5\" class=\"f-d1 ring\"/><text x=\"228.0\" y=\"139.0\" class=\"t-b\">Tufano 외 (ICSE)<\/text><text x=\"228.0\" y=\"156.0\" class=\"t-mut\">리뷰를 &#x27;생성&#x27; 과제로 정식화 · 정확 일치로 채점<\/text><text x=\"194.0\" y=\"194.0\" class=\"t-val\" text-anchor=\"end\">2022<\/text><circle cx=\"210\" cy=\"190.0\" r=\"5.5\" class=\"f-d1 ring\"/><text x=\"228.0\" y=\"187.0\" class=\"t-b\">CodeReviewer (Microsoft, FSE)<\/text><text x=\"228.0\" y=\"204.0\" class=\"t-mut\">세 과제 틀 · 코멘트 BLEU 5.32, 저자도 &#x27;BLEU 부적합&#x27;<\/text><text x=\"194.0\" y=\"242.0\" class=\"t-val\" text-anchor=\"end\">2023<\/text><circle cx=\"210\" cy=\"238.0\" r=\"5.5\" class=\"f-d1 ring\"/><text x=\"228.0\" y=\"235.0\" class=\"t-b\">LLaMA-Reviewer (ISSRE)<\/text><text x=\"228.0\" y=\"252.0\" class=\"t-mut\">LoRA 미세조정 · 여전히 BLEU<\/text><text x=\"194.0\" y=\"290.0\" class=\"t-val\" text-anchor=\"end\">2024<\/text><circle cx=\"210\" cy=\"286.0\" r=\"5.5\" class=\"f-d1 ring\"/><text x=\"228.0\" y=\"283.0\" class=\"t-b\">Tufano 외 (TSE)<\/text><text x=\"228.0\" y=\"300.0\" class=\"t-mut\">벤치마크 데이터 약 25%가 추출 오류<\/text><text x=\"194.0\" y=\"338.0\" class=\"t-val\" text-anchor=\"end\">2025<\/text><circle cx=\"210\" cy=\"334.0\" r=\"5.5\" class=\"f-d1 ring\"/><text x=\"228.0\" y=\"331.0\" class=\"t-b\">DeepCRCEval · CRScore<\/text><text x=\"228.0\" y=\"348.0\" class=\"t-mut\">BLEU 대신 기준별 채점·LLM 채점관<\/text><text x=\"194.0\" y=\"386.0\" class=\"t-val\" text-anchor=\"end\">2025<\/text><circle cx=\"210\" cy=\"382.0\" r=\"5.5\" class=\"f-d1 ring\"/><text x=\"228.0\" y=\"379.0\" class=\"t-b\">Tufano 외 (ICSE)<\/text><text x=\"228.0\" y=\"396.0\" class=\"t-mut\">개발자 29명 실험: LLM 지적 89% 그대로 유지<\/text><text x=\"194.0\" y=\"434.0\" class=\"t-val\" text-anchor=\"end\">2026<\/text><circle cx=\"210\" cy=\"430.0\" r=\"5.5\" class=\"f-d1 ring\"/><text x=\"228.0\" y=\"427.0\" class=\"t-b\">SWR-Bench · ReviewBench · CRBugBench<\/text><text x=\"228.0\" y=\"444.0\" class=\"t-mut\">PR 단위 에이전트 벤치마크 · LLM 매칭<\/text><\/svg><\/div><figcaption>그림 4-1. 자동 코드 리뷰 연구 연표 — 무엇으로 채점했나(정확 일치 → BLEU → 기준별·LLM 채점 → PR 단위 벤치마크)도 함께 바뀌었다<\/figcaption><\/figure>\n<h2>과제가 어떻게 정의되었나 — 세 가지 과제<\/h2>\n<p><strong>CodeReviewer(Microsoft, FSE 2022)<\/strong>가 정리한 틀이 이후 연구의 표준이 되었다.<\/p>\n<table>\n<thead>\n<tr>\n<th>과제<\/th>\n<th>입력 → 출력<\/th>\n<th>대표 지표<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>품질 판단<\/strong> (quality estimation)<\/td>\n<td>변경 → \"코멘트가 필요한가?\" (예/아니오)<\/td>\n<td>P / R / F1<\/td>\n<\/tr>\n<tr>\n<td><strong>코멘트 생성<\/strong> (comment generation)<\/td>\n<td>변경 → 리뷰 코멘트 문장<\/td>\n<td>BLEU<\/td>\n<\/tr>\n<tr>\n<td><strong>코드 수정<\/strong> (code refinement)<\/td>\n<td>변경 + 코멘트 → 수정된 코드<\/td>\n<td>정확 일치(EM), BLEU<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>지금의 PR 리뷰 에이전트는 이 셋 중 <strong>품질 판단 + 코멘트 생성<\/strong>을 합친 것에 가깝다. 과거 연구 상당수는 <strong>코드 수정<\/strong>(리뷰 코멘트를 받아 코드를 고치기)에 집중했다.<\/p>\n<h2>주요 연구<\/h2>\n<h3>검색·순위 시대<\/h3>\n<ul>\n<li><strong>Gupta &amp; Sundaresan 2018 (KDD, Microsoft DeepCodeReviewer)<\/strong>: 저장된 리뷰 코멘트를 코드에 맞춰 순위 매김. 후속 정리(Heumüller 2025)에 따르면 \"recall 10%를 얻으려면 오탐 60% 이상을 감수해야 했다\". 원문은 확인하지 못했다.<\/li>\n<li><strong>CommentFinder (Hong 외, FSE 2022)<\/strong>: 단어 가방(bag-of-words) + 코사인 유사도의 단순한 검색 방식. 기존 딥러닝 방식보다 top-1 정확 일치가 32% 좋고 49배 빨랐다. <strong>단순한 방법이 복잡한 모델을 이긴 사례<\/strong>다. 초록 수준으로만 확인했다.<\/li>\n<\/ul>\n<h3>생성 모델 시대<\/h3>\n<ul>\n<li><strong>Tufano 외 2021 (ICSE)<\/strong>: 리뷰를 생성 과제로 처음 정식화했다. 지표는 \"완벽 예측(정확 일치)\". 리뷰어 쪽 과제(코멘트 → 코드) 최대 31%.<\/li>\n<li><strong>Tufano 외 2022 (ICSE, OA 299)<\/strong>: 사전학습 T5. 코드→코멘트 정확 일치 <strong>2.12%<\/strong>. 저자 스스로 CodeBLEU(구조까지 보는 BLEU 변형)가 \"예측 품질에 대해 말해 주는 것이 적다\"고 했다. 입력을 그대로 복사하기만 해도 점수가 높게 나온다.<\/li>\n<li><strong>CodeReviewer (Li 외, FSE 2022, OA 422, 이 분야 최다 인용)<\/strong>:<ul>\n<li>사전학습 데이터: 1,161개 프로젝트, PR 793만 개, 9개 언어<\/li>\n<li>결과: 품질 판단 F1 71.53 / 코멘트 생성 <strong>BLEU-4 5.32<\/strong> / 코드 수정 EM 30.32<\/li>\n<li><strong>함정<\/strong>: 코드 수정에서 입력을 바꾸지 않고 그대로 내놓아도 BLEU 58.75(EM 0)가 나온다<\/li>\n<li>저자들의 한계 인정: BLEU는 리뷰 생성에 부적합하다. 변경당 코멘트를 하나만 남겨 데이터가 편향되었다. 오픈소스만 다뤘다<\/li>\n<li>사람 평가: 100개 표본, 6명, 정보성 3.60 / 관련성 3.20 (5점)<\/li>\n<\/ul>\n<\/li>\n<li><strong>AUGER (Li 외, FSE 2022)<\/strong>: 리뷰 79,344개 중 약 85%를 노이즈로 걸러 냈다. \"생성 코멘트의 29%가 유용\"하다고 했지만, 사람이 아니라 휴리스틱으로 판정한 값이다.<\/li>\n<li><strong>Hellendoorn 외 2021 (FSE 비전 논문)<\/strong>: 실제 PR에서 <strong>어디에 코멘트가 달릴지<\/strong> 예측했다. diff 덩어리의 약 10%에만 코멘트가 달리고, \"모든 모델이 정밀도 50%를 넘지 못했다\". 리뷰어는 \"엄청난 변동성과 (겉보기의) 무작위성\"으로 코멘트를 단다.<\/li>\n<li><strong>Zhou 외 2023 (ICPC, \"How far are we?\")<\/strong>: 범용 사전학습 모델(CodeT5)이 리뷰 전용 도구보다 13.4~38.9% 나았다. 정확 일치는 \"부분적 진척을 무시한다\"며 부분 점수 지표(Edit Progress)를 제안했다. <strong>지표를 바꾸면 모델 순위가 바뀌었다.<\/strong><\/li>\n<\/ul>\n<h3>초기 LLM 시대<\/h3>\n<ul>\n<li><strong>LLaMA-Reviewer (Lu 외, ISSRE 2023, OA 253)<\/strong>: LLaMA 6.7B를 LoRA(전체의 1% 미만만 학습하는 경량 미세조정)로 조정. 코멘트 BLEU-4 5.70(CodeReviewer 5.32). 저자도 BLEU가 \"결정적 지표로 널리 인정되지 않는다\"고 썼다.<\/li>\n<li><strong>Guo 외 2024 (ICSE, ChatGPT 코드 수정)<\/strong>: CodeReviewer 데이터의 저품질 문제 때문에 새 데이터셋(CodeReview-New)을 만들었다. ChatGPT EM 22.78 vs CodeReviewer 15.50. 실패의 주된 원인은 <strong>리뷰 코멘트 자체가 불명확한 것<\/strong>이었다.<\/li>\n<li><strong>Pornprasit &amp; Tantithamthavorn 2024 (IST)<\/strong>: GPT-3.5로 제로샷, 퓨샷(예시 3개), 미세조정(학습 데이터 6%)을 비교했다. 대부분 미세조정이 가장 좋았지만 예외가 있었다. 초록의 향상 범위(%)는 선택적으로 인용된 값이었다.<\/li>\n<\/ul>\n<h2>데이터 품질 — 이 시대 평가의 가장 큰 문제<\/h2>\n<table>\n<thead>\n<tr>\n<th>연구<\/th>\n<th>발견<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Tufano 외 2024 (TSE, OA 110)<\/strong><\/td>\n<td>예측 2,291건을 105인시 동안 수작업 검토. <strong>약 25%(574건)가 데이터 추출 오류<\/strong>. CodeReviewer 코멘트 생성 재실행 시 정확 일치 0/1,611. ChatGPT는 리뷰 코멘트 반영(수정)은 55% 성공했지만, 사람처럼 코멘트 쓰기는 13%만 성공<\/td>\n<\/tr>\n<tr>\n<td><strong>Liu, Lin, Thongtanunam 2025 (MSR, \"Too Noisy To Learn\")<\/strong><\/td>\n<td>CodeReviewer 학습 코멘트 표본 중 <strong>64%만 유효<\/strong>. LLM으로 정제하자 데이터는 25~66% 줄고 BLEU-4는 7.5~13% 올랐다<\/td>\n<\/tr>\n<tr>\n<td><strong>DeepCRCEval (FASE 2025)<\/strong><\/td>\n<td>벤치마크 코멘트 중 고품질은 <strong>10% 미만<\/strong>(Tufano 데이터 약 3%, CodeReviewer 데이터 약 8%)<\/td>\n<\/tr>\n<tr>\n<td><strong>Heumüller &amp; Ortmeier 2025 SLR<\/strong><\/td>\n<td>24편에서 과제-지표 조합 48개, 그중 22개는 논문 한 편에서만 쓰였다. 시간 편향을 다룬 연구는 1편. <strong>단순하고 사람이 이해할 수 있는 기준선이 복잡한 모델과 비슷하거나 나았다<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Tufano &amp; Bavota 2025 SLR<\/strong><\/td>\n<td>119편. 코멘트 생성 지표는 BLEU &gt; 정확 일치 &gt; ROUGE-L 순으로 많이 쓰였다. 41%는 재현 패키지가 없고, 산업에 배포된 기법은 15%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>\"정확 일치 0/1,611\"은 0%라는 뜻이다.<\/strong> 정확 일치는 모델 코멘트가 사람 코멘트와 <strong>글자 하나까지 같아야<\/strong> 맞은 것으로 친다. 다시 돌려 얻은 코멘트 1,611개 중 그런 것이 하나도 없었다.<\/p>\n<p>이 숫자는 \"모델이 형편없다\"보다 <strong>\"정확 일치로는 리뷰 코멘트를 채점할 수 없다\"<\/strong> 는 쪽을 보여 준다. \"null 체크 빠짐\"과 \"NPE 가능\"은 같은 지적인데도 서로 틀린 답이 된다. 그래서 코멘트 생성의 정확 일치는 어느 모델이든 0 근처다(Tufano 외 2022도 2.12%). 그렇다고 실제로는 잘했다는 뜻도 아니다. 같은 연구팀이 사람 눈으로 봐도 ChatGPT가 사람처럼 쓸 만한 코멘트를 낸 비율은 13%였다. 이렇게 글자 비교가 무너지는 문제는 BLEU에서도 똑같이 나타난다(<a href=\"#02\">02장 4절<\/a>).<\/p>\n<\/blockquote>\n<h2>사람과 함께 쓸 때 — 통제 실험<\/h2>\n<p><strong>Tufano 외 2025 (ICSE, \"Paradigm Shift or Double-Edged Sword?\")<\/strong>: 현업 개발자 29명, 녹화된 리뷰 50시간 이상. 자동 리뷰는 ChatGPT Plus(GPT-4)로 생성했다.<\/p>\n<ul>\n<li>리뷰어는 LLM이 찾은 이슈의 <strong>89%를 그대로 유지<\/strong>했다. LLM이 가리킨 위치에 주의가 쏠렸다(앵커링)<\/li>\n<li>심각도 낮은 이슈는 더 찾았지만 <strong>심각도 높은 이슈는 더 찾지 못했다<\/strong><\/li>\n<li>시간 절약 없음, 자신감 향상 없음<\/li>\n<li>한계: 실험실 환경이고, 이슈를 일부러 심은 프로그램이다<\/li>\n<\/ul>\n<h2>문헌 카드<\/h2>\n<table>\n<thead>\n<tr>\n<th>문헌<\/th>\n<th>선정 근거<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CodeReviewer (Li 외, FSE 2022)<\/td>\n<td>이 분야 <strong>최다 인용<\/strong>(OA 422). 세 과제 틀의 표준<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Tufano 외 2021 · 2022 (ICSE)<\/td>\n<td>리뷰 자동화의 생성 과제 <strong>원조<\/strong> 계열(OA 260/299)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>CommentFinder · AUGER · AutoTransform (FSE/ICSE 2022)<\/td>\n<td>같은 시기 대표 접근들<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Hellendoorn 외 2021<\/td>\n<td>\"어디에 코멘트할지\" 문제를 처음 현실적으로 제기<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Zhou 외 2023 (ICPC)<\/td>\n<td>지표에 따라 순위가 바뀐다는 증거<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>LLaMA-Reviewer · Guo 외 2024<\/td>\n<td>초기 LLM 적용의 대표(OA 253/235)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Tufano 외 2024 TSE · Liu 외 2025 MSR · DeepCRCEval<\/td>\n<td><strong>데이터 품질 문제<\/strong>를 수치로 보인 연구<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Tufano &amp; Bavota 2025 · Heumüller &amp; Ortmeier 2025 · Yang 외 TOSEM<\/td>\n<td>체계적 문헌 리뷰<\/td>\n<td>D·A<\/td>\n<\/tr>\n<tr>\n<td>Tufano 외 2025 ICSE<\/td>\n<td>LLM 리뷰가 사람 리뷰어에 미치는 영향을 통제 실험으로 잰 드문 연구<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>D-ACT (SANER 2023) · Pornprasit 2024 IST<\/td>\n<td>시간순 분할, 프롬프트 vs 미세조정<\/td>\n<td>A<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>연구들이 엇갈리는 지점<\/h2>\n<ul>\n<li><strong>노이즈 비율<\/strong>: Tufano 2024 약 25%(추출 오류), Liu 2025 36%가 무효(학습 표본), DeepCRCEval 90% 이상이 고품질 아님. 숫자가 다른 이유는 <strong>\"나쁨\"의 정의가 다르기<\/strong> 때문이다.<\/li>\n<li><strong>정제의 효과<\/strong>: 정제하면 BLEU가 오른다(Liu). 그런데 BLEU 자체가 품질과 상관이 낮다(02장).<\/li>\n<li><strong>단순 vs 복잡<\/strong>: CommentFinder와 Heumüller SLR은 단순한 방법이 경쟁력 있다고 했다. CodeReviewer 계열은 대규모 사전학습의 이득을 보고했다.<\/li>\n<\/ul>\n<h2>스스로 판단할 질문<\/h2>\n<ol>\n<li>우리 에이전트가 할 일은 세 과제(품질 판단, 코멘트 생성, 코드 수정) 중 무엇인가? 과제마다 맞는 평가 방식이 다르다.<\/li>\n<li>과거 PR 코멘트로 정답지를 만든다면, 그중 몇 %가 노이즈일 것으로 보는가? 확인 절차를 둘 것인가?<\/li>\n<li>복잡한 에이전트와 비교할 <strong>단순 기준선<\/strong>(예: 린터만, 과거 코멘트 검색만)을 둘 것인가?<\/li>\n<li>에이전트 지적이 사람 리뷰어의 주의를 붙잡는(앵커링) 효과를 측정 대상에 넣을 것인가?<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<ul>\n<li>Tufano 2021 — <a href=\"https://arxiv.org/pdf/2101.02518\">https://arxiv.org/pdf/2101.02518<\/a> · Tufano 2022 — <a href=\"https://arxiv.org/pdf/2201.06850\">https://arxiv.org/pdf/2201.06850<\/a><\/li>\n<li>CodeReviewer — <a href=\"https://arxiv.org/pdf/2203.09095\">https://arxiv.org/pdf/2203.09095<\/a> · AUGER — <a href=\"https://arxiv.org/pdf/2208.08014\">https://arxiv.org/pdf/2208.08014<\/a><\/li>\n<li>CommentFinder — <a href=\"https://2022.esec-fse.org/details/fse-2022-research-papers/41/CommentFinder-A-Simpler-Faster-More-Accurate-Code-Review-Comments-Recommendation\">https://2022.esec-fse.org/details/fse-2022-research-papers/41/CommentFinder-A-Simpler-Faster-More-Accurate-Code-Review-Comments-Recommendation<\/a> (초록 수준)<\/li>\n<li>Hellendoorn 2021 — <a href=\"https://vhellendoorn.github.io/fse2021-ivr.pdf\">https://vhellendoorn.github.io/fse2021-ivr.pdf<\/a> · Zhou 2023 — <a href=\"https://arxiv.org/pdf/2303.07221\">https://arxiv.org/pdf/2303.07221<\/a><\/li>\n<li>LLaMA-Reviewer — <a href=\"https://arxiv.org/pdf/2308.11148\">https://arxiv.org/pdf/2308.11148<\/a> · Guo 2024 — <a href=\"https://arxiv.org/pdf/2309.08221\">https://arxiv.org/pdf/2309.08221<\/a> · Pornprasit 2024 — <a href=\"https://export.arxiv.org/pdf/2402.00905\">https://export.arxiv.org/pdf/2402.00905<\/a><\/li>\n<li>Tufano 2024 TSE — <a href=\"https://arxiv.org/pdf/2401.05136\">https://arxiv.org/pdf/2401.05136<\/a> · Liu 2025 MSR — <a href=\"https://arxiv.org/pdf/2502.02757\">https://arxiv.org/pdf/2502.02757<\/a> · DeepCRCEval — <a href=\"https://arxiv.org/pdf/2412.18291\">https://arxiv.org/pdf/2412.18291<\/a><\/li>\n<li>Tufano &amp; Bavota 2025 — <a href=\"https://arxiv.org/pdf/2503.09510\">https://arxiv.org/pdf/2503.09510<\/a> · Heumüller &amp; Ortmeier 2025 — <a href=\"https://arxiv.org/pdf/2508.18003\">https://arxiv.org/pdf/2508.18003<\/a> · Yang 외 TOSEM — <a href=\"https://arxiv.org/pdf/2405.18216\">https://arxiv.org/pdf/2405.18216<\/a> (초록)<\/li>\n<li>Tufano 2025 ICSE — <a href=\"https://arxiv.org/pdf/2411.11401\">https://arxiv.org/pdf/2411.11401<\/a><\/li>\n<li>D-ACT — <a href=\"https://github.com/awsm-research/D-ACT-Replication-Package\">https://github.com/awsm-research/D-ACT-Replication-Package<\/a> · 인용 수: <a href=\"https://api.openalex.org/works\">https://api.openalex.org/works<\/a> (2026-11-19)<\/li>\n<\/ul>", "text": " 04. 자동 코드 리뷰 연구사 (2018~2024) 생성일 : 2026-11-19 최종 수정일 : 2026-11-25 수준 : 중급 근거 원장 : wave-1 A4 · wave-2 W2c 이 장에서 답하는 질문 LLM 리뷰 에이전트 이전에 \"리뷰 자동화\"는 어떤 문제로 정의되었고, 어떻게 평가되었나? 그 평가 방식은 왜 한계를 드러냈나? 큰 흐름 한눈에 그림 4-1. 자동 코드 리뷰 연구 연표 — 무엇으로 채점했나(정확 일치 → BLEU → 기준별·LLM 채점 → PR 단위 벤치마크)도 함께 바뀌었다 과제가 어떻게 정의되었나 — 세 가지 과제 CodeReviewer(Microsoft, FSE 2022) 가 정리한 틀이 이후 연구의 표준이 되었다. 과제 입력 → 출력 대표 지표 품질 판단 (quality estimation) 변경 → \"코멘트가 필요한가?\" (예/아니오) P / R / F1 코멘트 생성 (comment generation) 변경 → 리뷰 코멘트 문장 BLEU 코드 수정 (code refinement) 변경 + 코멘트 → 수정된 코드 정확 일치(EM), BLEU 지금의 PR 리뷰 에이전트는 이 셋 중 품질 판단 + 코멘트 생성 을 합친 것에 가깝다. 과거 연구 상당수는 코드 수정 (리뷰 코멘트를 받아 코드를 고치기)에 집중했다. 주요 연구 검색·순위 시대 Gupta & Sundaresan 2018 (KDD, Microsoft DeepCodeReviewer) : 저장된 리뷰 코멘트를 코드에 맞춰 순위 매김. 후속 정리(Heumüller 2025)에 따르면 \"recall 10%를 얻으려면 오탐 60% 이상을 감수해야 했다\". 원문은 확인하지 못했다. CommentFinder (Hong 외, FSE 2022) : 단어 가방(bag-of-words) + 코사인 유사도의 단순한 검색 방식. 기존 딥러닝 방식보다 top-1 정확 일치가 32% 좋고 49배 빨랐다. 단순한 방법이 복잡한 모델을 이긴 사례 다. 초록 수준으로만 확인했다. 생성 모델 시대 Tufano 외 2021 (ICSE) : 리뷰를 생성 과제로 처음 정식화했다. 지표는 \"완벽 예측(정확 일치)\". 리뷰어 쪽 과제(코멘트 → 코드) 최대 31%. Tufano 외 2022 (ICSE, OA 299) : 사전학습 T5. 코드→코멘트 정확 일치 2.12% . 저자 스스로 CodeBLEU(구조까지 보는 BLEU 변형)가 \"예측 품질에 대해 말해 주는 것이 적다\"고 했다. 입력을 그대로 복사하기만 해도 점수가 높게 나온다. CodeReviewer (Li 외, FSE 2022, OA 422, 이 분야 최다 인용) : 사전학습 데이터: 1,161개 프로젝트, PR 793만 개, 9개 언어 결과: 품질 판단 F1 71.53 / 코멘트 생성 BLEU-4 5.32 / 코드 수정 EM 30.32 함정 : 코드 수정에서 입력을 바꾸지 않고 그대로 내놓아도 BLEU 58.75(EM 0)가 나온다 저자들의 한계 인정: BLEU는 리뷰 생성에 부적합하다. 변경당 코멘트를 하나만 남겨 데이터가 편향되었다. 오픈소스만 다뤘다 사람 평가: 100개 표본, 6명, 정보성 3.60 / 관련성 3.20 (5점) AUGER (Li 외, FSE 2022) : 리뷰 79,344개 중 약 85%를 노이즈로 걸러 냈다. \"생성 코멘트의 29%가 유용\"하다고 했지만, 사람이 아니라 휴리스틱으로 판정한 값이다. Hellendoorn 외 2021 (FSE 비전 논문) : 실제 PR에서 어디에 코멘트가 달릴지 예측했다. diff 덩어리의 약 10%에만 코멘트가 달리고, \"모든 모델이 정밀도 50%를 넘지 못했다\". 리뷰어는 \"엄청난 변동성과 (겉보기의) 무작위성\"으로 코멘트를 단다. Zhou 외 2023 (ICPC, \"How far are we?\") : 범용 사전학습 모델(CodeT5)이 리뷰 전용 도구보다 13.4~38.9% 나았다. 정확 일치는 \"부분적 진척을 무시한다\"며 부분 점수 지표(Edit Progress)를 제안했다. 지표를 바꾸면 모델 순위가 바뀌었다. 초기 LLM 시대 LLaMA-Reviewer (Lu 외, ISSRE 2023, OA 253) : LLaMA 6.7B를 LoRA(전체의 1% 미만만 학습하는 경량 미세조정)로 조정. 코멘트 BLEU-4 5.70(CodeReviewer 5.32). 저자도 BLEU가 \"결정적 지표로 널리 인정되지 않는다\"고 썼다. Guo 외 2024 (ICSE, ChatGPT 코드 수정) : CodeReviewer 데이터의 저품질 문제 때문에 새 데이터셋(CodeReview-New)을 만들었다. ChatGPT EM 22.78 vs CodeReviewer 15.50. 실패의 주된 원인은 리뷰 코멘트 자체가 불명확한 것 이었다. Pornprasit & Tantithamthavorn 2024 (IST) : GPT-3.5로 제로샷, 퓨샷(예시 3개), 미세조정(학습 데이터 6%)을 비교했다. 대부분 미세조정이 가장 좋았지만 예외가 있었다. 초록의 향상 범위(%)는 선택적으로 인용된 값이었다. 데이터 품질 — 이 시대 평가의 가장 큰 문제 연구 발견 Tufano 외 2024 (TSE, OA 110) 예측 2,291건을 105인시 동안 수작업 검토. 약 25%(574건)가 데이터 추출 오류 . CodeReviewer 코멘트 생성 재실행 시 정확 일치 0/1,611. ChatGPT는 리뷰 코멘트 반영(수정)은 55% 성공했지만, 사람처럼 코멘트 쓰기는 13%만 성공 Liu, Lin, Thongtanunam 2025 (MSR, \"Too Noisy To Learn\") CodeReviewer 학습 코멘트 표본 중 64%만 유효 . LLM으로 정제하자 데이터는 25~66% 줄고 BLEU-4는 7.5~13% 올랐다 DeepCRCEval (FASE 2025) 벤치마크 코멘트 중 고품질은 10% 미만 (Tufano 데이터 약 3%, CodeReviewer 데이터 약 8%) Heumüller & Ortmeier 2025 SLR 24편에서 과제-지표 조합 48개, 그중 22개는 논문 한 편에서만 쓰였다. 시간 편향을 다룬 연구는 1편. 단순하고 사람이 이해할 수 있는 기준선이 복잡한 모델과 비슷하거나 나았다 Tufano & Bavota 2025 SLR 119편. 코멘트 생성 지표는 BLEU > 정확 일치 > ROUGE-L 순으로 많이 쓰였다. 41%는 재현 패키지가 없고, 산업에 배포된 기법은 15% \"정확 일치 0/1,611\"은 0%라는 뜻이다. 정확 일치는 모델 코멘트가 사람 코멘트와 글자 하나까지 같아야 맞은 것으로 친다. 다시 돌려 얻은 코멘트 1,611개 중 그런 것이 하나도 없었다. 이 숫자는 \"모델이 형편없다\"보다 \"정확 일치로는 리뷰 코멘트를 채점할 수 없다\" 는 쪽을 보여 준다. \"null 체크 빠짐\"과 \"NPE 가능\"은 같은 지적인데도 서로 틀린 답이 된다. 그래서 코멘트 생성의 정확 일치는 어느 모델이든 0 근처다(Tufano 외 2022도 2.12%). 그렇다고 실제로는 잘했다는 뜻도 아니다. 같은 연구팀이 사람 눈으로 봐도 ChatGPT가 사람처럼 쓸 만한 코멘트를 낸 비율은 13%였다. 이렇게 글자 비교가 무너지는 문제는 BLEU에서도 똑같이 나타난다( 02장 4절 ). 사람과 함께 쓸 때 — 통제 실험 Tufano 외 2025 (ICSE, \"Paradigm Shift or Double-Edged Sword?\") : 현업 개발자 29명, 녹화된 리뷰 50시간 이상. 자동 리뷰는 ChatGPT Plus(GPT-4)로 생성했다. 리뷰어는 LLM이 찾은 이슈의 89%를 그대로 유지 했다. LLM이 가리킨 위치에 주의가 쏠렸다(앵커링) 심각도 낮은 이슈는 더 찾았지만 심각도 높은 이슈는 더 찾지 못했다 시간 절약 없음, 자신감 향상 없음 한계: 실험실 환경이고, 이슈를 일부러 심은 프로그램이다 문헌 카드 문헌 선정 근거 등급 CodeReviewer (Li 외, FSE 2022) 이 분야 최다 인용 (OA 422). 세 과제 틀의 표준 A Tufano 외 2021 · 2022 (ICSE) 리뷰 자동화의 생성 과제 원조 계열(OA 260/299) A CommentFinder · AUGER · AutoTransform (FSE/ICSE 2022) 같은 시기 대표 접근들 A Hellendoorn 외 2021 \"어디에 코멘트할지\" 문제를 처음 현실적으로 제기 A Zhou 외 2023 (ICPC) 지표에 따라 순위가 바뀐다는 증거 A LLaMA-Reviewer · Guo 외 2024 초기 LLM 적용의 대표(OA 253/235) A Tufano 외 2024 TSE · Liu 외 2025 MSR · DeepCRCEval 데이터 품질 문제 를 수치로 보인 연구 A Tufano & Bavota 2025 · Heumüller & Ortmeier 2025 · Yang 외 TOSEM 체계적 문헌 리뷰 D·A Tufano 외 2025 ICSE LLM 리뷰가 사람 리뷰어에 미치는 영향을 통제 실험으로 잰 드문 연구 A D-ACT (SANER 2023) · Pornprasit 2024 IST 시간순 분할, 프롬프트 vs 미세조정 A 연구들이 엇갈리는 지점 노이즈 비율 : Tufano 2024 약 25%(추출 오류), Liu 2025 36%가 무효(학습 표본), DeepCRCEval 90% 이상이 고품질 아님. 숫자가 다른 이유는 \"나쁨\"의 정의가 다르기 때문이다. 정제의 효과 : 정제하면 BLEU가 오른다(Liu). 그런데 BLEU 자체가 품질과 상관이 낮다(02장). 단순 vs 복잡 : CommentFinder와 Heumüller SLR은 단순한 방법이 경쟁력 있다고 했다. CodeReviewer 계열은 대규모 사전학습의 이득을 보고했다. 스스로 판단할 질문 우리 에이전트가 할 일은 세 과제(품질 판단, 코멘트 생성, 코드 수정) 중 무엇인가? 과제마다 맞는 평가 방식이 다르다. 과거 PR 코멘트로 정답지를 만든다면, 그중 몇 %가 노이즈일 것으로 보는가? 확인 절차를 둘 것인가? 복잡한 에이전트와 비교할 단순 기준선 (예: 린터만, 과거 코멘트 검색만)을 둘 것인가? 에이전트 지적이 사람 리뷰어의 주의를 붙잡는(앵커링) 효과를 측정 대상에 넣을 것인가? 출처 Tufano 2021 — https://arxiv.org/pdf/2101.02518 · Tufano 2022 — https://arxiv.org/pdf/2201.06850 CodeReviewer — https://arxiv.org/pdf/2
