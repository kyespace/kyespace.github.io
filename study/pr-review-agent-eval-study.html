dBugs 실패 사례 (2009 Fixit)<\/strong>: 경고 3,954개를 검토해 44%가 버그로 등록되었지만 실제로 고쳐진 것은 16%(640개)였다. 유효 오탐이 신뢰를 깎아 리뷰 통합을 중단했다.<\/li>\n<li>Google 개발자에게는 \"정적분석을 무시하려는 <strong>강한 편향<\/strong>\"이 있다고 했다.<\/li>\n<\/ul>\n<h3>Coverity (Bessey 외, CACM 2010, \"A Few Billion Lines of Code Later\")<\/h3>\n<ul>\n<li>오탐 <strong>30% 이상이면 \"쉽게 문제가 생긴다. 사람들이 도구를 무시한다\"<\/strong>. 안정된 검사기 목표는 20% 미만.<\/li>\n<li><strong>처음 약 3개 보고<\/strong>가 지나치게 중요하다. 그게 틀리면 사용자는 \"이 도구 별로\"라고 결론 내린다.<\/li>\n<li>릴리스마다 결과 변동(churn)을 5% 미만으로 묶었다.<\/li>\n<\/ul>\n<h3>Facebook Infer (Distefano 외, CACM 2019)<\/h3>\n<ul>\n<li>같은 분석을 <strong>야간 일괄 보고<\/strong>로 내보내자 수정률이 거의 0%였다. <strong>코드 리뷰 시점(diff time)<\/strong>에 코멘트로 달자 <strong>70% 이상<\/strong>으로 뛰었다. 오탐률은 둘 다 20% 미만으로 같았다.<\/li>\n<li>단서: 일괄 보고 쪽은 \"20~30개 이슈\" 규모의 일화다.<\/li>\n<li>→ <strong>정밀도만큼 \"언제, 어디에 보여 주나\"가 결과를 바꾼다<\/strong>는 근거로 자주 인용된다.<\/li>\n<\/ul>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:560px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 640 194\" role=\"img\" aria-label=\"같은 분석, 보여 주는 시점만 바꿨을 때 수정률\" data-minw=\"560\"><title>같은 분석, 보여 주는 시점만 바꿨을 때 수정률<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"640\" height=\"194\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">같은 분석, 보여 주는 시점만 바꿨을 때 수정률<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">Facebook Infer (Distefano 외, CACM 2019)<\/text><line class=\"grid\" x1=\"191.0\" y1=\"66\" x2=\"191.0\" y2=\"138\"/><text x=\"191.0\" y=\"154.0\" class=\"t-mut\" text-anchor=\"middle\">0%<\/text><line class=\"grid\" x1=\"285.7\" y1=\"66\" x2=\"285.7\" y2=\"138\"/><text x=\"285.7\" y=\"154.0\" class=\"t-mut\" text-anchor=\"middle\">25%<\/text><line class=\"grid\" x1=\"380.5\" y1=\"66\" x2=\"380.5\" y2=\"138\"/><text x=\"380.5\" y=\"154.0\" class=\"t-mut\" text-anchor=\"middle\">50%<\/text><line class=\"grid\" x1=\"475.2\" y1=\"66\" x2=\"475.2\" y2=\"138\"/><text x=\"475.2\" y=\"154.0\" class=\"t-mut\" text-anchor=\"middle\">75%<\/text><line class=\"grid\" x1=\"570.0\" y1=\"66\" x2=\"570.0\" y2=\"138\"/><text x=\"570.0\" y=\"154.0\" class=\"t-mut\" text-anchor=\"middle\">100%<\/text><text x=\"20.0\" y=\"84.0\">야간 일괄 보고<\/text><text x=\"20.0\" y=\"98.0\" class=\"t-mut\">같은 분석 · 오탐률 20% 미만<\/text><g class=\"tip\"><title>일괄 보고 쪽은 이슈 20~30건 일화 (Distefano 외, CACM 2019)<\/title><rect class=\"hit\" x=\"190.97\" y=\"70\" width=\"439.03\" height=\"30\"/><path class=\"f-d1 hl\" d=\"M191.0,74.0h0.0a1.895150000000001,1.895150000000001 0 0 1 1.895150000000001,1.895150000000001v10.2a1.895150000000001,1.895150000000001 0 0 1 -1.895150000000001,1.895150000000001h-0.0z\"/><text x=\"200.9\" y=\"85.5\" class=\"t-val\">거의 0%<\/text><\/g><text x=\"20.0\" y=\"118.0\">코드 리뷰 시점 코멘트<\/text><text x=\"20.0\" y=\"132.0\" class=\"t-mut\">diff에 바로 코멘트<\/text><g class=\"tip\"><title>diff-time 배포 수정률 &gt;70% (Distefano 외, CACM 2019)<\/title><rect class=\"hit\" x=\"190.97\" y=\"104\" width=\"439.03\" height=\"30\"/><path class=\"f-d1 hl\" d=\"M191.0,108.0h261.3a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-261.3z\"/><text x=\"464.3\" y=\"119.5\" class=\"t-val\">70% 이상<\/text><\/g><line class=\"axis\" x1=\"190.97\" y1=\"66\" x2=\"190.97\" y2=\"138\"/><text x=\"20.0\" y=\"180.0\" class=\"t-mut\">정밀도만큼 &#x27;언제, 어디에 보여 주나&#x27;가 결과를 바꾼다는 근거로 자주 인용된다<\/text><\/svg><\/div><figcaption>그림 8-1. 같은 분석을 보여 주는 시점만 바꿨을 때 수정률 — Distefano 외 CACM 2019<\/figcaption><\/figure>\n<h3>그 밖의 연구<\/h3>\n<ul>\n<li><strong>Johnson 외 2013 (ICSE, S2 838)<\/strong>: 개발자 20명 인터뷰. 오탐과 경고 표시 방식이 정적분석 도구를 쓰지 않는 주된 이유였다. 초록만 확인했다.<\/li>\n<li><strong>Imtiaz 외 2019<\/strong>: 오픈소스 5개 프로젝트에서 Coverity 경고의 27.4~49.5%(중앙값 36.7%)가 조치되었다. 수정은 중앙값 4줄, 걸린 시간 중앙값 96일.<\/li>\n<\/ul>\n<hr />\n<h2>2. \"해결률\"은 정의에 따라 0.9%에서 73.8%까지 간다<\/h2>\n<p>이 장의 핵심이다. 같은 이름의 지표가 연구·회사마다 <strong>다른 것을 잰다.<\/strong><\/p>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:680px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 560\" role=\"img\" aria-label=\"해결률 정의 스펙트럼\" data-minw=\"680\"><title>해결률 정의 스펙트럼<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"760\" height=\"560\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">같은 &#x27;해결률&#x27;이 정의에 따라 0.9%에서 73.8%까지<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">AI 리뷰 코멘트가 &#x27;해결됐다&#x27;고 센 비율 · 정의 순으로 정렬하지 않고 값 순으로 정렬<\/text><circle cx=\"26\" cy=\"72\" r=\"5\" class=\"f-d1\"/><text x=\"40.0\" y=\"76.0\" class=\"t-sm\">AI 코멘트 (막대 = 범위)<\/text><path d=\"M196.40000000000003,66l6,6l-6,6l-6,-6z\" class=\"f-d3\"/><text x=\"210.4\" y=\"76.0\" class=\"t-sm\">같은 연구의 사람 코멘트 기준<\/text><line class=\"grid\" x1=\"330.0\" y1=\"90\" x2=\"330.0\" y2=\"476\"/><text x=\"330.0\" y=\"492.0\" class=\"t-mut\" text-anchor=\"middle\">0%<\/text><line class=\"grid\" x1=\"422.5\" y1=\"90\" x2=\"422.5\" y2=\"476\"/><text x=\"422.5\" y=\"492.0\" class=\"t-mut\" text-anchor=\"middle\">25%<\/text><line class=\"grid\" x1=\"515.0\" y1=\"90\" x2=\"515.0\" y2=\"476\"/><text x=\"515.0\" y=\"492.0\" class=\"t-mut\" text-anchor=\"middle\">50%<\/text><line class=\"grid\" x1=\"607.5\" y1=\"90\" x2=\"607.5\" y2=\"476\"/><text x=\"607.5\" y=\"492.0\" class=\"t-mut\" text-anchor=\"middle\">75%<\/text><line class=\"grid\" x1=\"700.0\" y1=\"90\" x2=\"700.0\" y2=\"476\"/><text x=\"700.0\" y=\"492.0\" class=\"t-mut\" text-anchor=\"middle\">100%<\/text><text x=\"20.0\" y=\"109.0\" class=\"t-b\">Mozilla·Ubisoft<\/text><text x=\"20.0\" y=\"124.0\" class=\"t-mut\">리뷰어가 LLM 제안을 골라 게시<\/text><g class=\"tip\"><title>Mozilla·Ubisoft: AI 7.2–8.1% (리뷰어가 LLM 제안을 골라 게시)<\/title><rect class=\"hit\" x=\"320\" y=\"92\" width=\"430\" height=\"34\"/><line x1=\"356.6\" y1=\"109\" x2=\"360.0\" y2=\"109\" class=\"s-d1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-opacity=\".55\"/><circle cx=\"356.6\" cy=\"109\" r=\"5\" class=\"f-d1 ring\"/><circle cx=\"360.0\" cy=\"109\" r=\"5\" class=\"f-d1 ring\"/><text x=\"372.0\" y=\"113.0\" class=\"t-val\">7.2–8.1%<\/text><\/g><text x=\"20.0\" y=\"147.0\" class=\"t-b\">Sun 외 (GitHub Actions 도구)<\/text><text x=\"20.0\" y=\"162.0\" class=\"t-mut\">코멘트 후 코드가 바뀜 · LLM 판정<\/text><g class=\"tip\"><title>Sun 외 (GitHub Actions 도구): AI 0.9–19.2% · 사람 60% (코멘트 후 코드가 바뀜 · LLM 판정)<\/title><rect class=\"hit\" x=\"320\" y=\"130\" width=\"430\" height=\"34\"/><line x1=\"333.3\" y1=\"147\" x2=\"401.0\" y2=\"147\" class=\"s-d1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-opacity=\".55\"/><circle cx=\"333.3\" cy=\"147\" r=\"5\" class=\"f-d1 ring\"/><circle cx=\"401.0\" cy=\"147\" r=\"5\" class=\"f-d1 ring\"/><path d=\"M552.0,140l7,7l-7,7l-7,-7z\" class=\"f-d3 ring\"/><text x=\"552.0\" y=\"169.0\" class=\"t-mut\" text-anchor=\"middle\">사람 60%<\/text><text x=\"321.3\" y=\"151.0\" class=\"t-val\" text-anchor=\"end\">0.9–19.2%<\/text><\/g><text x=\"20.0\" y=\"185.0\" class=\"t-b\">Atlassian RovoDev<\/text><text x=\"20.0\" y=\"200.0\" class=\"t-mut\">다음 커밋이 그 줄을 바꿈<\/text><g class=\"tip\"><title>Atlassian RovoDev: AI 38.7% · 사람 44.45% (다음 커밋이 그 줄을 바꿈)<\/title><rect class=\"hit\" x=\"320\" y=\"168\" width=\"430\" height=\"34\"/><circle cx=\"473.2\" cy=\"185\" r=\"6.5\" class=\"f-d1 ring hl\"/><path d=\"M494.5,178l7,7l-7,7l-7,-7z\" class=\"f-d3 ring\"/><text x=\"494.5\" y=\"207.0\" class=\"t-mut\" text-anchor=\"middle\">사람 44.45%<\/text><text x=\"461.2\" y=\"189.0\" class=\"t-val\" text-anchor=\"end\">38.7%<\/text><\/g><text x=\"20.0\" y=\"223.0\" class=\"t-b\">Google AutoCommenter<\/text><text x=\"20.0\" y=\"238.0\" class=\"t-mut\">코멘트가 사라짐 × 수작업 확인<\/text><g class=\"tip\"><title>Google AutoCommenter: AI 40% (코멘트가 사라짐 × 수작업 확인)<\/title><rect class=\"hit\" x=\"320\" y=\"206\" width=\"430\" height=\"34\"/><circle cx=\"478.0\" cy=\"223\" r=\"6.5\" class=\"f-d1 ring hl\"/><text x=\"490.0\" y=\"227.0\" class=\"t-val\">40%<\/text><\/g><text x=\"20.0\" y=\"261.0\" class=\"t-b\">Graphite<\/text><text x=\"20.0\" y=\"276.0\" class=\"t-mut\">같은 PR 안에서 반영 · 분모 미공개<\/text><g class=\"tip\"><title>Graphite: AI 52% · 사람 50% (같은 PR 안에서 반영 · 분모 미공개)<\/title><rect class=\"hit\" x=\"320\" y=\"244\" width=\"430\" height=\"34\"/><circle cx=\"522.4\" cy=\"261\" r=\"6.5\" class=\"f-d1 ring hl\"/><path d=\"M515.0,254l7,7l-7,7l-7,-7z\" class=\"f-d3 ring\"/><text x=\"515.0\" y=\"283.0\" class=\"t-mut\" text-anchor=\"middle\">사람 50%<\/text><text x=\"534.4\" y=\"265.0\" class=\"t-val\">52%<\/text><\/g><text x=\"20.0\" y=\"299.0\" class=\"t-b\">OpenAI Codex<\/text><text x=\"20.0\" y=\"314.0\" class=\"t-mut\">코멘트 후 코드 변경<\/text><g class=\"tip\"><title>OpenAI Codex: AI 52.7% (코멘트 후 코드 변경)<\/title><rect class=\"hit\" x=\"320\" y=\"282\" width=\"430\" height=\"34\"/><circle cx=\"525.0\" cy=\"299\" r=\"6.5\" class=\"f-d1 ring hl\"/><text x=\"537.0\" y=\"303.0\" class=\"t-val\">52.7%<\/text><\/g><text x=\"20.0\" y=\"337.0\" class=\"t-b\">Cursor Bugbot<\/text><text x=\"20.0\" y=\"352.0\" class=\"t-mut\">머지 때 버그 고쳐짐 · LLM 판정, 개선 전→후<\/text><g class=\"tip\"><title>Cursor Bugbot: AI 52–70% (머지 때 버그 고쳐짐 · LLM 판정, 개선 전→후)<\/title><rect class=\"hit\" x=\"320\" y=\"320\" width=\"430\" height=\"34\"/><line x1=\"522.4\" y1=\"337\" x2=\"589.0\" y2=\"337\" class=\"s-d1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-opacity=\".55\"/><circle cx=\"522.4\" cy=\"337\" r=\"5\" class=\"f-d1 ring\"/><circle cx=\"589.0\" cy=\"337\" r=\"5\" class=\"f-d1 ring\"/><text x=\"601.0\" y=\"341.0\" class=\"t-val\">52–70%<\/text><\/g><text x=\"20.0\" y=\"375.0\" class=\"t-b\">GitHub &#x27;Resolve&#x27; 버튼<\/text><text x=\"20.0\" y=\"390.0\" class=\"t-mut\">Codex 53 · Cursor 67 · Copilot 73<\/text><g class=\"tip\"><title>GitHub &#x27;Resolve&#x27; 버튼: AI 53–73% (Codex 53 · Cursor 67 · Copilot 73)<\/title><rect class=\"hit\" x=\"320\" y=\"358\" width=\"430\" height=\"34\"/><line x1=\"526.1\" y1=\"375\" x2=\"600.1\" y2=\"375\" class=\"s-d1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-opacity=\".55\"/><circle cx=\"526.1\" cy=\"375\" r=\"5\" class=\"f-d1 ring\"/><circle cx=\"600.1\" cy=\"375\" r=\"5\" class=\"f-d1 ring\"/><text x=\"612.1\" y=\"379.0\" class=\"t-val\">53–73%<\/text><\/g><text x=\"20.0\" y=\"413.0\" class=\"t-b\">Uber uReview<\/text><text x=\"20.0\" y=\"428.0\" class=\"t-mut\">5번 재실행해도 다시 안 나오면 반영<\/text><g class=\"tip\"><title>Uber uReview: AI 65% (5번 재실행해도 다시 안 나오면 반영)<\/title><rect class=\"hit\" x=\"320\" y=\"396\" width=\"430\" height=\"34\"/><circle cx=\"570.5\" cy=\"413\" r=\"6.5\" class=\"f-d1 ring hl\"/><text x=\"582.5\" y=\"417.0\" class=\"t-val\">65%<\/text><\/g><text x=\"20.0\" y=\"451.0\" class=\"t-b\">Beko<\/text><text x=\"20.0\" y=\"466.0\" class=\"t-mut\">개발자가 반드시 누르는 &#x27;Resolved&#x27;<\/text><g class=\"tip\"><title>Beko: AI 73.8% (개발자가 반드시 누르는 &#x27;Resolved&#x27;)<\/title><rect class=\"hit\" x=\"320\" y=\"434\" width=\"430\" height=\"34\"/><circle cx=\"603.1\" cy=\"451\" r=\"6.5\" class=\"f-d1 ring hl\"/><text x=\"615.1\" y=\"455.0\" class=\"t-val\">73.8%<\/text><\/g><text x=\"20.0\" y=\"530.0\" class=\"t-mut\">쉬운 코멘트(가독성·리팩터링)가 많을수록 해결률이 오른다. 해결률로는 놓친 문제(recall)를 잴 수 없다<\/text><text x=\"20.0\" y=\"548.0\" class=\"t-mut\">출처: 08장 2절 표. 회사 수치는 대부분 자기 보고<\/text><\/svg><\/div><figcaption>그림 8-2. 같은 '해결률'이 정의에 따라 0.9%~73.8% — 아래 표를 그림으로 옮긴 것. 회사 수치는 대부분 자기 보고<\/figcaption><\/figure>\n<table>\n<thead>\n<tr>\n<th>정의<\/th>\n<th>출처<\/th>\n<th>AI 코멘트 수치<\/th>\n<th>사람 기준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>리뷰어가 LLM이 <strong>제안한 코멘트를 골라 게시<\/strong><\/td>\n<td>Mozilla·Ubisoft RevMate (2024)<\/td>\n<td>8.1% / 7.2%<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>코멘트 후 코드가 실제로 바뀌었나 (<strong>LLM이 판정<\/strong>)<\/td>\n<td>Sun 외 (arXiv 2508.18771, IEEE TSE)<\/td>\n<td><strong>0.9%~19.2%<\/strong><\/td>\n<td><strong>60%<\/strong><\/td>\n<\/tr>\n<tr>\n<td>다음 커밋이 <strong>코멘트 단 바로 그 줄<\/strong>을 바꿨나<\/td>\n<td>Atlassian RovoDev (ICSE-SEIP 2026)<\/td>\n<td>38.7% (유형별 28.6~43.3%)<\/td>\n<td>44.45%<\/td>\n<\/tr>\n<tr>\n<td>같은 PR 안에서 반영(분모 미공개)<\/td>\n<td>Graphite (발표)<\/td>\n<td>약 52%<\/td>\n<td>약 50%<\/td>\n<\/tr>\n<tr>\n<td>코멘트 후 코드 변경<\/td>\n<td>OpenAI Codex (블로그)<\/td>\n<td>52.7%<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>GitHub의 <strong>\"Resolve\" 버튼<\/strong> 상태<\/td>\n<td>Go Home Copilot (arXiv 2607.21997)<\/td>\n<td>Copilot 73%, Cursor 67%, Codex 53%<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>같은 변경을 5번 다시 돌려 비슷한 코멘트가 안 나오면 반영<\/td>\n<td>Uber uReview<\/td>\n<td>65%<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>개발자가 반드시 붙이는 <strong>\"Resolved\" 라벨<\/strong><\/td>\n<td>Beko (ICSE-SEIP 2025)<\/td>\n<td><strong>73.8%<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>머지 시점에 지적된 버그가 고쳐졌나 (LLM 판정)<\/td>\n<td>Cursor Bugbot<\/td>\n<td>52% → 70%+<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>코멘트가 다음 스냅샷에서 사라졌나 × 수작업 확인<\/td>\n<td>Google AutoCommenter<\/td>\n<td>약 40%<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>대표 연구 자세히<\/h3>\n<p><strong>Sun 외 \"Does AI Code Review Lead to Code Changes?\" (arXiv 2508.18771, IEEE TSE)<\/strong><\/p>\n<ul>\n<li>GitHub Actions 기반 AI 리뷰 도구 16개, 코멘트 2.2만 개 이상. 데이터가 충분했던 도구는 16개 중 4개다.<\/li>\n<li><strong>\"유효하고 반영됨\" 비율<\/strong>: 파일 단위 도구 0.9%, diff 덩어리(hunk) 단위 도구(CodeRabbit의 ai-pr-reviewer) 19.2%, 사람 60.0%(1,166개). 부분 수정도 반영으로 쳤다.<\/li>\n<li>조건: 영어만, 스레드의 첫 인라인 코멘트만, 머지된 PR만. 유효성·반영 여부는 LLM(gpt-4.1, o3-mini)이 라벨링했다. 이후 파일 변경이 없던 코멘트 65.3%는 자동으로 \"반영 안 됨\"이 되었다.<\/li>\n<li>한 도구에서 주로 <strong>한국어<\/strong>인 코멘트 11,744개가 걸러졌다.<\/li>\n<li>상용 앱이 아니라 GitHub Actions 도구만 다뤘다.<\/li>\n<li>이 수치를 \"Watanabe 외\"로 인용하는 2차 자료가 있는데, 원저자는 Sun, Kuang, Baltes, Treude 외다.<\/li>\n<\/ul>\n<p><strong>Go Home Copilot (arXiv 2607.21997, 프리프린트)<\/strong>: 코드 제안이 들어간 코멘트의 해결률 75.5% vs 없는 코멘트 64.5%. 해결되지 않은 주된 이유는 \"제안이 틀림\"과 \"의도된 설계\". 저자도 해결 여부가 \"불완전한 대리 지표\"라고 했다(회귀 AUC 0.58, Python만).<\/p>\n<p><strong>CodeRabbit 실사용 연구 (arXiv 2607.03316)<\/strong>: 리뷰 피드백 3.1만 건. 수용 36.4%, 거절 56.3%.<\/p>\n<h3>같은 지표에 섞이는 교란 요인<\/h3>\n<ul>\n<li><strong>코멘트 유형<\/strong>: 리팩터링·가독성 코멘트가 기능·설계 코멘트보다 훨씬 잘 반영된다(Mozilla·Ubisoft 약 18% vs 약 5%, Atlassian 가독성 43.3% vs 설계 28.6%). <strong>쉬운 코멘트가 많으면 해결률이 오른다.<\/strong><\/li>\n<li><strong>줄 변경 대리 지표<\/strong>: 상관없는 수정으로 그 줄이 바뀌어도 \"해결\"로 잡힌다.<\/li>\n<li><strong>자기 보고 라벨<\/strong>: Beko 저자들은 개발자가 \"Closed\"나 \"Won't fix\" 대신 \"Resolved\"를 눌렀을 수 있다고 했다.<\/li>\n<li><strong>\"Won't fix\"가 나쁜 코멘트는 아니다<\/strong>: Bosu 2015에서 Won't fix 상태의 92%는 \"유용하지 않음\"이었다. 반대로 맞지만 범위 밖이라 미룬 지적도 있다.<\/li>\n<li><strong>recall은 못 잰다<\/strong>: 에이전트가 아예 말하지 않은 문제는 해결률에 나타나지 않는다.<\/li>\n<\/ul>\n<h3>피드백 버튼의 표본 편향<\/h3>\n<p>Google AutoCommenter에서 명시적 피드백(👍/👎)이 달린 코멘트는 약 <strong>10%<\/strong>였다. \"유용 비율 80%\"는 이 10%에서만 잰 값이다. 같은 시스템의 코드 변경 기반 추정은 약 40%였다.<\/p>\n<hr />\n<h2>3. 사람 요인 — 신뢰, 소음, 앵커링<\/h2>\n<h3>소음이 가장 큰 불만<\/h3>\n<ul>\n<li><strong>Wessel 외 2021 (CSCW, \"Don't disturb me\")<\/strong>: 오픈소스 관리자 인터뷰 21명. 봇과의 상호작용에서 <strong>소음이 반복되는 핵심 문제<\/strong>였다. 너무 긴 텍스트, 너무 잦은 코멘트, 요청하지 않은 행동이 문제로 꼽혔다.<\/li>\n<li><strong>Wessel 외 2022 (EMSE)<\/strong>: 저장소 1,194개 회귀 불연속 분석. 리뷰 봇 도입 후 머지된 PR이 늘고, 머지되지 않은 PR과 사람 간 소통은 줄었다(LLM 이전, 주로 커버리지·린트 봇).<\/li>\n<\/ul>\n<h3>앵커링<\/h3>\n<p><strong>앵커링(anchoring, 닻 내림 효과)<\/strong> 은 <strong>먼저 본 정보가 기준점(닻)이 되어, 그 뒤의 판단이 그쪽으로 끌려가는 현상<\/strong>이다. 배가 닻을 내리면 그 주변에서만 맴도는 것에 빗댄 말이다. 원래 행동경제학 용어다.<\/p>\n<p>일상 예를 들면:<\/p>\n<ul>\n<li>중고차 판매자가 처음에 \"1,500만 원\"을 부르면, 깎아도 1,200만 원 근처에서 흥정하게 된다. 처음 들은 숫자가 기준이 된다.<\/li>\n<li>시험 채점 때 앞 답안지에 후한 점수를 주면 다음 답안지도 그 점수를 기준으로 본다.<\/li>\n<\/ul>\n<p><strong>코드 리뷰에서는 이렇게 나타난다.<\/strong> AI 리뷰어가 PR에 코멘트 3개를 먼저 달아 두었다고 하자. 사람 리뷰어는 그 3곳을 먼저 확인하고, 거기에 동의하고, 나머지 코드는 덜 꼼꼼히 본다. 결과적으로:<\/p>\n<ul>\n<li>AI가 가리킨 곳은 <strong>더 많이<\/strong> 보지만, AI가 놓친 곳은 사람도 <strong>같이 놓친다<\/strong><\/li>\n<li>AI 코멘트를 \"맞다\"고 남기는 비율이 높아도, 그것이 AI가 정확해서인지 사람이 끌려가서인지 구분하기 어렵다<\/li>\n<\/ul>\n<p>이것을 실험으로 확인한 연구가 아래 두 편이다.<\/p>\n<ul>\n<li><strong>Tufano 외 2025 (ICSE, \"Double-edged sword\")<\/strong>: 현업 개발자 29명을 대상으로 한 통제 실험이다. 녹화한 리뷰 시간이 50시간이 넘고, AI 리뷰는 ChatGPT Plus(GPT-4)로 만들었다.<ul>\n<li>리뷰어들은 LLM이 찾은 이슈의 <strong>89%를 그대로 유지<\/strong>했고, LLM이 가리킨 위치에 주의가 쏠렸다<\/li>\n<li>심각도 낮은 이슈는 더 찾았지만 <strong>심각도 높은 이슈는 더 찾지 못했다<\/strong><\/li>\n<li>시간도 줄지 않았고, 리뷰 결과에 대한 확신도 높아지지 않았다<\/li>\n<li>연구사 맥락은 <a href=\"#04\">04장<\/a> 참고<\/li>\n<\/ul>\n<\/li>\n<li><strong>Cynthia 외 2026 (PACM SE, arXiv 2607.24601)<\/strong>: AI 설명의 길이를 바꿔 실험했다. \"중간 길이 설명\"에서 AI와의 일치도가 가장 높았다(89.22%). 다만 <strong>일치도가 높다는 것은 \"AI 말을 많이 따랐다\"는 뜻이지 \"판단이 정확했다\"는 뜻은 아니다.<\/strong> 앵커링 관점에서는 오히려 조심해서 읽어야 하는 숫자다.<\/li>\n<\/ul>\n<p><strong>평가 설계에서 앵커링이 끼어드는 자리<\/strong> — 에이전트를 채점할 때도 같은 일이 생긴다.<\/p>\n<table>\n<thead>\n<tr>\n<th>자리<\/th>\n<th>앵커링이 생기는 방식<\/th>\n<th>흔히 쓰는 대응<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>온라인 지표<\/td>\n<td>\"AI 코멘트 유지율·해결률\"이 높은 것이 AI가 정확해서인지, 사람이 끌려가서인지 섞인다<\/td>\n<td>AI 코멘트가 없는 PR과 비교하거나, AI가 놓친 결함(재현율)을 따로 잰다<\/td>\n<\/tr>\n<tr>\n<td>정답지·사람 라벨<\/td>\n<td>라벨 붙이는 사람이 에이전트 출력이나 채점관 판정을 <strong>먼저 보고<\/strong> 라벨을 붙이면 그 판정에 끌린다<\/td>\n<td>블라인드 라벨링 — 모델 판정을 가리고 사람이 먼저 독립적으로 판단한다(<a href=\"#03\">03장 5절<\/a>)<\/td>\n<\/tr>\n<tr>\n<td>벤치마크 논문 읽기<\/td>\n<td>사람 합의값이 모델 판정을 보고 만들어졌으면 \"사람과 95% 일치\"가 부풀려졌을 수 있다. 예: PACE-Bench는 주석자들이 파이프라인 판정을 보고 재평가해 기준값을 만들었다(<a href=\"#05\">05장<\/a>)<\/td>\n<td>논문에서 사람 라벨이 <strong>독립적으로<\/strong> 만들어졌는지 확인한다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>인식과 실제의 차이 (리뷰가 아닌 AI 코딩 일반, 관련 증거)<\/h3>\n<ul>\n<li><strong>METR 2025 무작위 대조 실험<\/strong>: 숙련 개발자가 AI를 쓰면 <strong>19% 느렸다<\/strong>. 시작 전에는 24% 빨라질 것으로 예상했고, 끝난 뒤에도 20% 빨라졌다고 믿었다.<\/li>\n<li><strong>METR 2026-02 업데이트<\/strong>: 2025년 말 재측정에서 복귀 참가자는 18% 빨라졌다는 추정이 나왔다(신뢰구간 −38%~+9%). 신규 참가자는 4%(−15%~+9%). METR은 이를 \"매우 약한 증거\"라고 했다. 개발자들이 AI 없이 일하기를 거부하고 과제를 빼는 일이 있었기 때문이다. 2025년 결과는 \"역사적\" 결과로 본다고 했다.<\/li>\n<li><strong>DORA 2024<\/strong>: AI 도입이 25% 늘 때마다 처리량 −1.5%, 안정성 −7.2%, 코드 리뷰 속도 +3.1%와 연관되었다(상관관계). <strong>DORA 2025<\/strong>: 처리량은 개선되었지만 AI는 \"여전히 배포 불안정성을 높인다\". 30%가 AI 코드를 거의 또는 전혀 신뢰하지 않는다.<\/li>\n<li><strong>Stack Overflow 2025 설문<\/strong>: AI 정확도를 불신 46%, 신뢰 33%.<\/li>\n<\/ul>\n<hr />\n<h2>문헌 카드<\/h2>\n<table>\n<thead>\n<tr>\n<th>문헌<\/th>\n<th>선정 근거<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sadowski 외 2015 Tricorder · 2018 CACM<\/td>\n<td>\"유효 오탐\" 정의의 <strong>원조<\/strong>. 리뷰에 자동 코멘트를 붙인 대규모 1차 사례(S2 279/287)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Bessey 외 2010 (Coverity)<\/td>\n<td>상용 정적분석 배포 교훈의 고전(S2 738)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Distefano 외 2019 (Facebook Infer)<\/td>\n<td>보여 주는 시점이 수정률을 바꾼다는 대표 사례(S2 235)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Johnson 외 2013<\/td>\n<td>개발자가 정적분석을 안 쓰는 이유. 이 장에서 최다 인용(S2 838)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Imtiaz 외 2019<\/td>\n<td>경고 조치율 실측<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Sun 외 (TSE)<\/td>\n<td>AI 리뷰 도구들을 독립적으로 비교 측정한 드문 연구<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Atlassian 2편 · Beko · Mozilla/Ubisoft · Go Home Copilot · CodeRabbit 연구<\/td>\n<td>서로 다른 \"해결\" 정의의 실측 사례<\/td>\n<td>A·D<\/td>\n<\/tr>\n<tr>\n<td>Wessel 외 2021/2022<\/td>\n<td>봇 소음의 사람 쪽 근거<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>METR 2025/2026 · DORA 2024/2025 · Stack Overflow 2025<\/td>\n<td>인식 vs 실측 차이에 대한 대규모 증거<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>스스로 판단할 질문<\/h2>\n<ol>\n<li>우리 에이전트의 \"유효 오탐\"은 무엇으로 정의할 것인가? 기술적 정오인가, 개발자의 행동 여부인가?<\/li>\n<li>온라인 지표의 \"해결\" 정의를 하나로 고정할 수 있는가? 그 정의는 쉬운 코멘트에 유리하지 않은가?<\/li>\n<li>코멘트 유형별로 나눠 볼 것인가, 합쳐서 볼 것인가?<\/li>\n<li>처음 몇 번의 코멘트가 신뢰를 좌우한다는 관찰(Coverity)을 배포 순서에 반영할 것인가?<\/li>\n<li>코멘트를 PR 시점에 달 것인가, 별도 리포트로 낼 것인가? (Infer의 70% vs 0%)<\/li>\n<li>개발자가 \"도움이 됐다\"고 느끼는 것과 실제 결함 감소를 따로 잴 방법이 있는가?<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<ul>\n<li>Tricorder 2015 — <a href=\"https://www.cs.umd.edu/class/spring2019/cmsc414/papers/tricorder-building-a-program-analysis-ecosystem.pdf\">https://www.cs.umd.edu/class/spring2019/cmsc414/papers/tricorder-building-a-program-analysis-ecosystem.pdf<\/a> (A, ok)<\/li>\n<li>Sadowski CACM 2018 — <a href=\"https://6826.csail.mit.edu/2020/papers/google-analysis-cacm.pdf\">https://6826.csail.mit.edu/2020/papers/google-analysis-cacm.pdf<\/a> (A, ok)<\/li>\n<li>Bessey 2010 — <a href=\"https://www.cs.columbia.edu/~junfeng/17sp-e6121/papers/coverity.pdf\">https://www.cs.columbia.edu/~junfeng/17sp-e6121/papers/coverity.pdf<\/a> (A, ok)<\/li>\n<li>Distefano 2019 — <a href=\"https://discovery.ucl.ac.uk/10084236/1/O%27Hearn%20AAM%20scaling-static-analysis-at-facebook.pdf\">https://discovery.ucl.ac.uk/10084236/1/O%27Hearn%20AAM%20scaling-static-analysis-at-facebook.pdf<\/a> (A, ok)<\/li>\n<li>Johnson 2013 — <a href=\"https://research.google/pubs/why-dont-software-developers-use-static-analysis-tools-to-find-bugs/\">https://research.google/pubs/why-dont-software-developers-use-static-analysis-tools-to-find-bugs/<\/a> (A, 초록만)<\/li>\n<li>Imtiaz 2019 — <a href=\"https://lists.ovirt.org/archives/list/devel@ovirt.org/message/EWA4T3NXV7JRXBX6SKRQNZ4WS2XZ76VU/attachment/4/issre19_cameraready.pdf\">https://lists.ovirt.org/archives/list/devel@ovirt.org/message/EWA4T3NXV7JRXBX6SKRQNZ4WS2XZ76VU/attachment/4/issre19_cameraready.pdf<\/a> (A, ok)<\/li>\n<li>Sun 외 — <a href=\"https://arxiv.org/pdf/2508.18771\">https://arxiv.org/pdf/2508.18771<\/a> (A, ok)<\/li>\n<li>RovoDev — <a href=\"https://arxiv.org/pdf/2601.01129\">https://arxiv.org/pdf/2601.01129<\/a> · Goldman 외 — <a href=\"https://arxiv.org/pdf/2510.05450\">https://arxiv.org/pdf/2510.05450<\/a> · Beko — <a href=\"https://arxiv.org/pdf/2412.18531\">https://arxiv.org/pdf/2412.18531<\/a> · RevMate — <a href=\"https://arxiv.org/pdf/2411.07091\">https://arxiv.org/pdf/2411.07091<\/a><\/li>\n<li>Go Home Copilot — <a href=\"https://arxiv.org/pdf/2607.21997\">https://arxiv.org/pdf/2607.21997<\/a> · CodeRabbit 연구 — <a href=\"https://arxiv.org/abs/2607.03316\">https://arxiv.org/abs/2607.03316<\/a> · MSR 2026 — <a href=\"https://arxiv.org/pdf/2604.03196\">https://arxiv.org/pdf/2604.03196<\/a><\/li>\n<li>AutoCommenter — <a href=\"https://arxiv.org/pdf/2405.13565\">https://arxiv.org/pdf/2405.13565<\/a> · Cursor — <a href=\"https://cursor.com/guides/ai-code-review\">https://cursor.com/guides/ai-code-review<\/a><\/li>\n<li>Wessel 2021 — <a href=\"https://arxiv.org/pdf/2103.13950\">https://arxiv.org/pdf/2103.13950<\/a> · Wessel 2022 — <a href=\"https://arxiv.org/pdf/2103.13547\">https://arxiv.org/pdf/2103.13547<\/a><\/li>\n<li>Tufano 2025 — <a href=\"https://arxiv.org/pdf/2411.11401\">https://arxiv.org/pdf/2411.11401<\/a> · Cynthia 2026 — <a href=\"https://arxiv.org/pdf/2607.24601\">https://arxiv.org/pdf/2607.24601<\/a><\/li>\n<li>METR — <a href=\"https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/\">https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/<\/a> · <a href=\"https://metr.org/blog/2026-02-24-uplift-update/\">https://metr.org/blog/2026-02-24-uplift-update/<\/a><\/li>\n<li>DORA 2024 — <a href=\"https://services.google.com/fh/files/misc/2024_final_dora_report.pdf\">https://services.google.com/fh/files/misc/2024_final_dora_report.pdf<\/a> · DORA 2025 — <a href=\"https://services.google.com/fh/files/misc/2025_state_of_ai_assisted_software_development.pdf\">https://services.google.com/fh/files/misc/2025_state_of_ai_assisted_software_development.pdf<\/a><\/li>\n<li>Stack Overflow 2025 — <a href=\"https://stackoverflow.blog/2025/07/29/developers-remain-willing-but-reluctant-to-use-ai-the-2025-developer-survey-results-are-here\">https://stackoverflow.blog/2025/07/29/developers-remain-willing-but-reluctant-to-use-ai-the-2025-developer-survey-results-are-here<\/a><\/li>\n<\/ul>", "text": " 08. 실사용(온라인) 지표와 사람 요인 생성일 : 2026-11-19 최종 수정일 : 2026-11-25 수준 : 사례 → 심화 근거 원장 : wave-1 A7 · wave-1 A9 이 장에서 답하는 질문 에이전트가 실제 팀에서 쓰일 때 \"잘하고 있다\"는 무엇으로 재나? LLM 이전에 개발자에게 자동 코멘트를 달아 온 정적분석 도구는 무엇을 배웠나? 개발자는 자동 코멘트에 어떻게 반응하나? 1. LLM 이전의 교훈 — 정적분석 도구 배포 자동 리뷰 봇은 새것이 아니다. 정적분석 도구가 10년 넘게 리뷰에 코멘트를 달아 왔다. Google Tricorder (Sadowski 외, ICSE 2015 · CACM 2018) \"유효 오탐(effective false positive)\"이라는 정의 : 도구가 기술적으로 맞았든 틀렸든, \"사용자가 아무 조치도 하지 않기로 한 보고\" 는 모두 오탐으로 센다. 개발자가 행동하지 않으면 가치가 없다는 관점이다. Not useful 비율 = NU / (NU + PF + AF), 즉 \"Not useful\" 클릭 / (\"Not useful\" + \"Please fix\" + \"Apply fix\" 클릭). 10% 이상이면 관찰 대상, 25%를 넘으면 끌 수 있다. 전체 Not useful 비율은 약 5%(관찰 대상 제외 시 4% 미만)였고, 가장 좋은 분석기는 0~3%였다. 하루 5만 건 이상 분석에 Not useful 클릭은 약 250건이었다. 10%라는 기준의 출처 : CACM 2018 논문은 이 값이 \"첫 저자가 다소 임의로 처음 정했다\"고 밝혔다. Tricorder 논문은 10%가 Coverity 기준과 \"맞는다\"고 했지만, Coverity 원문은 \"안정된 검사기는 20% 미만, 30% 이상이면 쉽게 문제가 된다\"고 했다. → 경험칙이지 측정된 상수가 아니다. 클릭의 한계 : 클릭 없이 고치는 사람, 클릭 대신 무시하는 사람, 실수 클릭이 있다. 저자들 스스로 \"불완전한 척도\"라고 했다. 매번 맞는 검사기에도 사람들이 주 1회꼴로 \"Not useful\" 버그를 올렸다 → 개발자 반응도 정답이 아니다. FindBugs 실패 사례 (2009 Fixit) : 경고 3,954개를 검토해 44%가 버그로 등록되었지만 실제로 고쳐진 것은 16%(640개)였다. 유효 오탐이 신뢰를 깎아 리뷰 통합을 중단했다. Google 개발자에게는 \"정적분석을 무시하려는 강한 편향 \"이 있다고 했다. Coverity (Bessey 외, CACM 2010, \"A Few Billion Lines of Code Later\") 오탐 30% 이상이면 \"쉽게 문제가 생긴다. 사람들이 도구를 무시한다\" . 안정된 검사기 목표는 20% 미만. 처음 약 3개 보고 가 지나치게 중요하다. 그게 틀리면 사용자는 \"이 도구 별로\"라고 결론 내린다. 릴리스마다 결과 변동(churn)을 5% 미만으로 묶었다. Facebook Infer (Distefano 외, CACM 2019) 같은 분석을 야간 일괄 보고 로 내보내자 수정률이 거의 0%였다. 코드 리뷰 시점(diff time) 에 코멘트로 달자 70% 이상 으로 뛰었다. 오탐률은 둘 다 20% 미만으로 같았다. 단서: 일괄 보고 쪽은 \"20~30개 이슈\" 규모의 일화다. → 정밀도만큼 \"언제, 어디에 보여 주나\"가 결과를 바꾼다 는 근거로 자주 인용된다. 그림 8-1. 같은 분석을 보여 주는 시점만 바꿨을 때 수정률 — Distefano 외 CACM 2019 그 밖의 연구 Johnson 외 2013 (ICSE, S2 838) : 개발자 20명 인터뷰. 오탐과 경고 표시 방식이 정적분석 도구를 쓰지 않는 주된 이유였다. 초록만 확인했다. Imtiaz 외 2019 : 오픈소스 5개 프로젝트에서 Coverity 경고의 27.4~49.5%(중앙값 36.7%)가 조치되었다. 수정은 중앙값 4줄, 걸린 시간 중앙값 96일. 2. \"해결률\"은 정의에 따라 0.9%에서 73.8%까지 간다 이 장의 핵심이다. 같은 이름의 지표가 연구·회사마다 다른 것을 잰다. 그림 8-2. 같은 '해결률'이 정의에 따라 0.9%~73.8% — 아래 표를 그림으로 옮긴 것. 회사 수치는 대부분 자기 보고 정의 출처 AI 코멘트 수치 사람 기준 리뷰어가 LLM이 제안한 코멘트를 골라 게시 Mozilla·Ubisoft RevMate (2024) 8.1% / 7.2% — 코멘트 후 코드가 실제로 바뀌었나 ( LLM이 판정 ) Sun 외 (arXiv 2508.18771, IEEE TSE) 0.9%~19.2% 60% 다음 커밋이 코멘트 단 바로 그 줄 을 바꿨나 Atlassian RovoDev (ICSE-SEIP 2026) 38.7% (유형별 28.6~43.3%) 44.45% 같은 PR 안에서 반영(분모 미공개) Graphite (발표) 약 52% 약 50% 코멘트 후 코드 변경 OpenAI Codex (블로그) 52.7% — GitHub의 \"Resolve\" 버튼 상태 Go Home Copilot (arXiv 2607.21997) Copilot 73%, Cursor 67%, Codex 53% — 같은 변경을 5번 다시 돌려 비슷한 코멘트가 안 나오면 반영 Uber uReview 65% — 개발자가 반드시 붙이는 \"Resolved\" 라벨 Beko (ICSE-SEIP 2025) 73.8% — 머지 시점에 지적된 버그가 고쳐졌나 (LLM 판정) Cursor Bugbot 52% → 70%+ — 코멘트가 다음 스냅샷에서 사라졌나 × 수작업 확인 Google AutoCommenter 약 40% — 대표 연구 자세히 Sun 외 \"Does AI Code Review Lead to Code Changes?\" (arXiv 2508.18771, IEEE TSE) GitHub Actions 기반 AI 리뷰 도구 16개, 코멘트 2.2만 개 이상. 데이터가 충분했던 도구는 16개 중 4개다. \"유효하고 반영됨\" 비율 : 파일 단위 도구 0.9%, diff 덩어리(hunk) 단위 도구(CodeRabbit의 ai-pr-reviewer) 19.2%, 사람 60.0%(1,166개). 부분 수정도 반영으로 쳤다. 조건: 영어만, 스레드의 첫 인라인 코멘트만, 머지된 PR만. 유효성·반영 여부는 LLM(gpt-4.1, o3-mini)이 라벨링했다. 이후 파일 변경이 없던 코멘트 65.3%는 자동으로 \"반영 안 됨\"이 되었다. 한 도구에서 주로 한국어 인 코멘트 11,744개가 걸러졌다. 상용 앱이 아니라 GitHub Actions 도구만 다뤘다. 이 수치를 \"Watanabe 외\"로 인용하는 2차 자료가 있는데, 원저자는 Sun, Kuang, Baltes, Treude 외다. Go Home Copilot (arXiv 2607.21997, 프리프린트) : 코드 제안이 들어간 코멘트의 해결률 75.5% vs 없는 코멘트 64.5%. 해결되지 않은 주된 이유는 \"제안이 틀림\"과 \"의도된 설계\". 저자도 해결 여부가 \"불완전한 대리 지표\"라고 했다(회귀 AUC 0.58, Python만). CodeRabbit 실사용 연구 (arXiv 2607.03316) : 리뷰 피드백 3.1만 건. 수용 36.4%, 거절 56.3%. 같은 지표에 섞이는 교란 요인 코멘트 유형 : 리팩터링·가독성 코멘트가 기능·설계 코멘트보다 훨씬 잘 반영된다(Mozilla·Ubisoft 약 18% vs 약 5%, Atlassian 가독성 43.3% vs 설계 28.6%). 쉬운 코멘트가 많으면 해결률이 오른다. 줄 변경 대리 지표 : 상관없는 수정으로 그 줄이 바뀌어도 \"해결\"로 잡힌다. 자기 보고 라벨 : Beko 저자들은 개발자가 \"Closed\"나 \"Won't fix\" 대신 \"Resolved\"를 눌렀을 수 있다고 했다. \"Won't fix\"가 나쁜 코멘트는 아니다 : Bosu 2015에서 Won't fix 상태의 92%는 \"유용하지 않음\"이었다. 반대로 맞지만 범위 밖이라 미룬 지적도 있다. recall은 못 잰다 : 에이전트가 아예 말하지 않은 문제는 해결률에 나타나지 않는다. 피드백 버튼의 표본 편향 Google AutoCommenter에서 명시적 피드백(👍/👎)이 달린 코멘트는 약 10% 였다. \"유용 비율 80%\"는 이 10%에서만 잰 값이다. 같은 시스템의 코드 변경 기반 추정은 약 40%였다. 3. 사람 요인 — 신뢰, 소음, 앵커링 소음이 가장 큰 불만 Wessel 외 2021 (CSCW, \"Don't disturb me\") : 오픈소스 관리자 인터뷰 21명. 봇과의 상호작용에서 소음이 반복되는 핵심 문제 였다. 너무 긴 텍스트, 너무 잦은 코멘트, 요청하지 않은 행동이 문제로 꼽혔다. Wessel 외 2022 (EMSE) : 저장소 1,194개 회귀 불연속 분석. 리뷰 봇 도입 후 머지된 PR이 늘고, 머지되지 않은 PR과 사람 간 소통은 줄었다(LLM 이전, 주로 커버리지·린트 봇). 앵커링 앵커링(anchoring, 닻 내림 효과) 은 먼저 본 정보가 기준점(닻)이 되어, 그 뒤의 판단이 그쪽으로 끌려가는 현상 이다. 배가 닻을 내리면 그 주변에서만 맴도는 것에 빗댄 말이다. 원래 행동경제학 용어다. 일상 예를 들면: 중고차 판매자가 처음에 \"1,500만 원\"을 부르면, 깎아도 1,200만 원 근처에서 흥정하게 된다. 처음 들은 숫자가 기준이 된다. 시험 채점 때 앞 답안지에 후한 점수를 주면 다음 답안지도 그 점수를 기준으로 본다. 코드 리뷰에서는 이렇게 나타난다. AI 리뷰어가 PR에 코멘트 3개를 먼저 달아 두었다고 하자. 사람 리뷰어는 그 3곳을 먼저 확인하고, 거기에 동의하고, 나머지 코드는 덜 꼼꼼히 본다. 결과적으로: AI가 가리킨 곳은 더 많이 보지만, AI가 놓친 곳은 사람도 같이 놓친다 AI 코멘트를 \"맞다\"고 남기는 비율이 높아도, 그것이 AI가 정확해서인지 사람이 끌려가서인지 구분하기 어렵다 이것을 실험으로 확인한 연구가 아래 두 편이다. Tufano 외 2025 (ICSE, \"Double-edged sword\") : 현업 개발자 29명을 대상으로 한 통제 실험이다. 녹화한 리뷰 시간이 50시간이 넘고, AI 리뷰는 ChatGPT Plus(GPT-4)로 만들었다. 리뷰어들은 LLM이 찾은 이슈의 89%를 그대로 유지 했고, LLM이 가리킨 위치에 주의가 쏠렸다 심각도 낮은 이슈는 더 찾았지만 심각도 높은 이슈는 더 찾지 못했다 시간도 줄지 않았고, 리뷰 결과에 대한 확신도 높아지지 않았다 연구사 맥락은 04장 참고 Cynthia 외 2026 (PACM SE, arXiv 2607.24601) : AI 설명의 길이를 바꿔 실험했다. \"중간 길이 설명\"에서 AI와의 일치도가 가장 높았다(89.22%). 다만 일치도가 높다는 것은 \"AI 말을 많이 따랐다\"는 뜻이지 \"판단이 정확했다\"는 뜻은 아니다. 앵커링 관점에서는 오히려 조심해서 읽어야 하는 숫자다. 평가 설계에서 앵커링이 끼어드는 자리 — 에이전트를 채점할 때도 같은 일이 생긴다. 자리 앵커링이 생기는 방식 흔히 쓰는 대응 온라인 지표 \"AI 코멘트 유지율·해결률\"이 높은 것이 AI가 정확해서인지, 사람이 끌려가서인지 섞인다 AI 코멘트가 없는 PR과 비교하거나, AI가 놓친 결함(재현율)을 따로 잰다 정답지·사람 라벨 라벨 붙이는 사람이 에이전트 출력이나 채점관 판정을 먼저 보고 라벨을 붙이면 그 판정에 끌린다 블라인드 라벨링 — 모델 판정을 가리고 사람이 먼저 독립적으로 판단한다( 03장 5절 ) 벤치마크 논문 읽기 사람 합의값이 모델 판정을 보고 만들어졌으면 \"사람과 95% 일치\"가 부풀려졌을 수 있다. 예: PACE-Bench는 주석자들이 파이프라인 판정을 보고 재평가해 기준값을 만들었다( 05장 ) 논문에서 사람 라벨이 독립적으로 만들어졌는지 확인한다 인식과 실제의 차이 (리뷰가 아닌 AI 코딩 일반, 관련 증거) METR 2025 무작위 대조 실험 : 숙련 개발자가 AI를 쓰면 19% 느렸다 . 시작 전에는 24% 빨라질 것으로 예상했고, 끝난 뒤에도 20% 빨라졌다고 믿었다. METR 2026-02 업데이트 : 2025년 말 재측정에서 복귀 참가자는 18% 빨라졌다는 추정이 나왔다(신뢰구간 −38%~+9%). 신규 참가자는 4%(−15%~+9%). METR은 이를 \"매우 약한 증거\"라고 했다. 개발자들이 AI 없이 일하기를 거부하고 과제를 빼는 일이 있었기 때문이다. 2025년 결과는 \"역사적\" 결과로 본다고 했다. DORA 2024 : AI 도입이 25% 늘 때마다 처리량 −1.5%, 안정성 −7.2%, 코드 리뷰 속도 +3.1%와 연관되었다(상관관계). DORA 2025 : 처리량은 개선되었지만 AI는 \"여전히 배포 불안정성을 높인다\". 30%가 AI 코드를 거의 또는 전혀 신뢰하지 않는다. Stack Overflow 2025 설문 : AI 정확도를 불신 46%, 신뢰 33%. 문헌 카드 문헌 선정 근거 등급 Sadowski 외 2015 Tricorder · 2018 CACM \"유효 오탐\" 정의의 원조 . 리뷰에 자동 코멘트를 붙인 대규모 1차 사례(S2 279/287) A Bessey 외 2010 (Coverity) 상용 정적분석 배포 교훈의 고전(S2 738) A Distefano 외 2019 (Facebook Infer) 보여 주는 시점이 수정률을 바꾼다는 대표 사례(S2 235) A Johnson 외 2013 개발자가 정적분석을 안 쓰는 이유. 이 장에서 최다 인용(S2 838) A Imtiaz 외 2019 경고 조치율 실측 A Sun 외 (TSE) AI 리뷰 도구들을 독립적으로 비교 측정한 드문 연구 A Atlassian 2편 · Beko · Mozilla/Ubisoft · Go Home Copilot · CodeRabbit 연구 서로 다른 \"해결\" 정의의 실측 사례 A·D Wessel 외 2021/2022 봇 소음의 사람 쪽 근거 A METR 2025/2026 · DORA 2024/2025 · Stack Overflow 2025 인식 vs 실측 차이에 대한 대규모 증거 B 스스로 판단할 질문 우리 에이전트의 \"유효 오탐\"은 무엇으로 정의할 것인가? 기술적 정오인가, 개발자의 행동 여부인가? 온라인 지표의 \"해결\" 정의를 하나로 고정할 수 있는가? 그 정의는 쉬운 코멘트에 유리하지 않은가? 코멘트 유형별로 나눠 볼 것인가, 합쳐서 볼 것인가? 처음 몇 번의 코멘트가 신뢰를 좌우한다는 관찰(Coverity)을 배포 순서에 반영할 것인가? 코멘트를 PR 시점에 달 것인가, 별도 리포트로 낼 것인가? (Infer의 70% vs 0%) 개발자가 \"도움이 됐다\"고 느끼는 것과 실제 결함 감소를 따로 잴 방법이 있는가? 출처 Tricorder 2015 — https://www.cs.umd.edu/class/spring2019/cmsc414/papers/tricorder-building-a-program-analysis-ecosystem.pdf (A, ok) Sadowski CACM 2018 — https://6826.csail.mit.edu/2020/papers/google-analysis-cacm.pdf (A, ok) Bessey 2010 — https://www.cs.columbia.edu/~junfeng/17sp-e6121/papers/coverity.pdf (A, ok) Distefano 2019 — https://discovery.ucl.ac.uk/10084236/1/O%27Hearn%20AAM%20scaling-static-analysis-at-facebook.pdf (A, ok) Johnson 2013 — https://research.google/pubs/why-dont-software-developers-use-static-analysis-tools-to-find-bugs/ (A, 초록만) Imtiaz 2019 — https://lists.ovirt.org/archives/list/devel@ovirt.org/message/EWA4T3NXV7JRXBX6SKRQNZ4WS2XZ76VU/attachment/4/issre19_cameraready.pdf (A, ok) Sun 외 — https://arxiv.org/pdf/2508.18771 (A, ok) RovoDev — https://arxiv.org/pdf/2601.01129 · Goldman 외 — https://arxiv.org/pdf/2510.05450 · Beko — https://arxiv.org/pdf/2412.18531 · RevMate — https://arxiv.org/pdf/2411.07091 Go Home Copilot — https://arxiv.org/pdf/2607.21997 · CodeRabbit 연구 — https://arxiv.org/abs/2607.03316 · MSR 2026 — https://arxiv.org/pdf/2604.03196 AutoCommenter — https://arxiv.org/pdf/2405.13565 · Cursor — https://cursor.com/guides/ai-code-review Wessel 2021 — https://arxiv.org/pdf/2103.13950 · Wessel 2022 — https://arxiv.org/pdf/2103.13547 Tufano 2025 — https://arxiv.org/pdf/2411.11401 · Cynthia 2026 — https://arxiv.org/pdf/2607.24601 METR — https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/ · https://metr.org/blog/2026-02-24-uplift-update/ DORA 2024 — https://services.google.com/fh/files/misc/2024_final_dora_report.pdf · DORA 2025 — https://services.google.com/fh/files/misc/2025_state_of_ai_assisted_software_development.pdf Stack Overflow 2025 — https://stackoverflow.blog/2025/07/29/developers-remain-willing-but-reluctant-to-use-ai-the-2025-developer-survey-results-are-here "}, {"id": "09", "dir": "09-에이전트-설계-선택지", "title": "09. 에이전트 설계 선택지 — 무엇이 측정되었나", "level": "심화", "html": "<h1>09. 에이전트 설계 선택지 — 무엇이 측정되었나<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-19<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-25<\/li>\n<li><strong>수준<\/strong>: 심화<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A8-agent-design-patterns.md\">wave-1 A8<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-2-web-W2c-deep-reads.md\">wave-2 W2c<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-3-web-W3-crbugbench-pace-recent.md\">wave-3 W3<\/a><\/li>\n<\/ul>\n<h2>이 장에서 답하는 질문<\/h2>\n<p>리뷰 에이전트를 만들 때 고르는 선택지(컨텍스트, 에이전트 구조, 검증 단계, 학습 방식, 코멘트 수)마다 <strong>어떤 효과가 측정되었나?<\/strong> 이 장은 선택지를 고르지 않는다. 측정 결과와 그 조건만 늘어놓는다.<\/p>\n<blockquote>\n<p><strong>이 장 전체에 걸린 주의<\/strong>: 아래 실험들은 데이터·모델·지표가 모두 다르다. \"A 연구에서 X가 좋았다\"를 \"X가 좋다\"로 일반화할 근거는 약하다. 대부분의 결과가 <strong>정밀도와 재현율을 맞바꾸는 방향<\/strong>으로 나타났다.<\/p>\n<\/blockquote>\n<hr />\n<h2>선택지 1. 컨텍스트 — diff만 줄까, 주변 코드·설명까지 줄까<\/h2>\n<table>\n<thead>\n<tr>\n<th>연구<\/th>\n<th>비교한 것<\/th>\n<th>결과<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ContextCRBench<\/strong> (FSE 2026, ByteDance)<\/td>\n<td>컨텍스트 없음 / 이슈·PR 설명(텍스트) / 주변 코드<\/td>\n<td>품질 판단 F1(폐쇄 모델 평균): 없음 36.08 → <strong>텍스트 64.37<\/strong> → 코드만 51.76. 결함 위치 찾기는 거의 그대로였고(16.41 → 18.54) 오픈 모델은 약간 나빠졌다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>Lu 외<\/strong> (Kuaishou, ICML 2025)<\/td>\n<td>diff만 / 부모 함수 / 데이터 흐름 따라 자르기(슬라이싱)<\/td>\n<td>핵심 버그 포함률: diff만 23.70 → 부모 함수 31.85 → 왼쪽 흐름 37.04 → 전체 흐름 39.26. 단 필터를 거친 뒤에는 왼쪽 흐름이 전체 흐름보다 나았다(긴 컨텍스트가 산만하게 한다고 해석)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>AACR-Bench<\/strong> (프리프린트)<\/td>\n<td>없음 / BM25(키워드) 검색 / 에이전트 탐색<\/td>\n<td>Claude-4.5 F1: 없음 14.46 → BM25 <strong>9.98<\/strong> → 에이전트 16.12. 에이전트는 PR당 코멘트 0.09~0.15개로 정밀도 쪽, 비에이전트는 재현율 쪽으로 치우쳤다<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>SWE-PRBench<\/strong> (프리프린트, 1인 저자)<\/td>\n<td>컨텍스트 층 A(2,000토큰) → B(2,200) → C(2,500)<\/td>\n<td>8개 모델 <strong>모두<\/strong> 단조 하락(예: Sonnet 4.6 0.190 → 0.135 → 0.122). 주변 코드가 필요한 이슈 유형에서 점수가 절반이 됐다. 단, 판정자 검증이 30건뿐이고 통계 표기에 불일치가 있다<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>RovoDev<\/strong> (Atlassian, ICSE-SEIP 2026)<\/td>\n<td>Jira·PR 설명 추가 / 리뷰 가이드라인 추가<\/td>\n<td>설명 +1~3점, 가이드라인 +5점<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>LAURA<\/strong> (ASE 2025)<\/td>\n<td>컨텍스트 보강 제거<\/td>\n<td>사람 평가 \"도움됨\" 20.0% → 17.7%<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>CRBugBench<\/strong> (Microsoft, 프리프린트)<\/td>\n<td>공개 저장소 vs 사내 모노레포<\/td>\n<td>사내 저장소에서 최대 25.5% 하락(단위 불명확). 차이의 일부는 \"diff만 보고 알 수 있는 버그\" 비율 차이(46.1% vs 22.8%)로 설명된다<\/td>\n<td>D<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>사람 쪽 근거와의 연결<\/strong>: 사람 리뷰어도 넓은 맥락이 필요한 결함을 놓친다(01장 Paul 외 2021).<\/p>\n<h2>선택지 2. 에이전트 구조 — 단일 프롬프트, 에이전트, 다중 에이전트<\/h2>\n<table>\n<thead>\n<tr>\n<th>연구<\/th>\n<th>결과<\/th>\n<th>단서<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>SWR-Bench<\/strong> (FSE 2026)<\/td>\n<td>에이전트형 도구가 단일 프롬프트를 이기지 못했다. 평균 F1은 SWE-agent식 12.61, 다중 에이전트 9.22, 단일 프롬프트 12.49. 같은 모델을 <strong>10번 돌려 합치면<\/strong> F1 +43.67%, 재현율 +118.83%<\/td>\n<td>Python 12개 저장소<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>\"When Single Agent Is Enough\"<\/strong> (2026 프리프린트)<\/td>\n<td>GPT-4o-mini, Java 328건. 단일 에이전트가 다중 에이전트(Hydra-Reviewer)와 같거나 나았다. 간결성·명확성·관련성 모두 유의. 토큰은 1,610 vs 47,222<\/td>\n<td>반례: \"정확\" 비율은 다중 ReAct 74.9%가 단일 ReAct 63.6%보다 높았다. 판정자-사람 상관 0.395~0.684<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>CRBugBench<\/strong> (프리프린트)<\/td>\n<td>다중 에이전트 +4.7%(비용 5.55배). 본문 다른 곳에는 +2.8%(3.68배)로 적혀 있다. \"포괄적으로 지적하라\"는 프롬프트는 +5.8%(1.10배)<\/td>\n<td>recall@5만 측정, 정밀도 미측정<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>Lu 외<\/strong> (ICML 2025) — 통제된 유일한 근거<\/td>\n<td>MR 하나당 코멘트를 심각도 점수 순으로 상위 k개만 남겼다. 핵심 버그 포함률 / 종합 점수(CPI): 전체 37.04 / 9.77 → 상위 10개 32.59 / 13.94 → 상위 5개 25.93 / 14.26 → 상위 3개 17.78 / 12.77. <strong>줄일수록 핵심 버그를 덜 잡고, 종합 점수는 상위 5개에서 가장 높았다<\/strong> (아래 풀이)<\/td>\n<td>A<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>CodeAgent<\/strong> (EMNLP 2024)<\/td>\n<td>취약점 과제에서 확인된 비율 92.96% vs GPT-4 51.42%<\/td>\n<td>정답을 CodeAgent 출력을 검증해 만들어 <strong>유리하게 편향<\/strong>. 코드 수정은 3개 중 1개 데이터셋에서만 기준선을 이김<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>Cursor Bugbot<\/strong> (벤더)<\/td>\n<td>초기에는 8회 투표가 \"가장 효과적\". 이후 완전 에이전트형 전환이 \"가장 큰 개선\"<\/td>\n<td>분리된 수치 없음<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>Agentless<\/strong> (FSE 2025) · <strong>SWE-agent<\/strong> (NeurIPS 2024)<\/td>\n<td>이슈 수정에서 고정 파이프라인 32.00%·$0.70 vs SWE-agent 23.00%·$1.62. SWE-agent는 도구 인터페이스 세부(편집 명령 제거 18.0 → 10.3)가 성능을 크게 바꿨다<\/td>\n<td><strong>리뷰가 아니라 이슈 수정<\/strong> 과제<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>GitHub Copilot<\/strong> (블로그)<\/td>\n<td>범용 CLI 도구로 바꾸자 비용↑·유용 코멘트↓. 도구 설명을 리뷰 흐름에 맞춰 다시 쓰자 비용 약 −20%<\/td>\n<td>자기 보고<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>선택지 3. 생성 뒤 검증·필터 단계<\/h2>\n<p><strong>거의 모든 연구에서 정밀도가 오르고 재현율이 내려갔다.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>연구<\/th>\n<th>정밀도 쪽<\/th>\n<th>재현율 쪽<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>BitsAI-CR<\/strong> (ByteDance)<\/td>\n<td>필터: 57.03% → <strong>65.59%<\/strong><\/td>\n<td>45.50% → <strong>39.77%<\/strong><\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>BitsAI-CR 필터의 추론 순서<\/td>\n<td>결론 먼저: <strong>77.09%<\/strong>(1.7초) vs 추론 먼저: 65.80%(31초)<\/td>\n<td>—<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>Lu 외<\/strong> (ICML 2025)<\/td>\n<td>검증기: 오경보 87.81 → 75.37<\/td>\n<td>핵심 버그 포함 31.11 → 20.00<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>CR-Bench<\/strong> (프리프린트)<\/td>\n<td>Reflexion(자기 성찰 반복): SNR(쓸모 있는 코멘트 / 소음) 5.11 → <strong>1.95<\/strong>로 악화<\/td>\n<td>재현율 27.01 → 32.76 상승<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>RovoDev<\/strong> (ICSE-SEIP 2026)<\/td>\n<td>실행 가능성 필터 +15~20점. 사실성 LLM 판정기는 \"효과 미미\"<\/td>\n<td>—<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>Huang 외<\/strong> (ICLR 2024)<\/td>\n<td>외부 피드백 없는 자기 수정은 안정적으로 돕지 않는다(리뷰 특정 수치 없음)<\/td>\n<td>—<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>CodeAgent<\/strong> (EMNLP 2024)<\/td>\n<td>QA-Checker로 확인 건수와 비율이 <strong>둘 다<\/strong> 올랐다<\/td>\n<td>취약점 과제, 자체 라벨<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>Meta TestGen-LLM<\/strong> (FSE 2024)<\/td>\n<td>빌드 → 통과 → 커버리지 단계 필터로 최종 수용 73%<\/td>\n<td>테스트 생성(리뷰 아님)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Anthropic 공개 플러그인<\/td>\n<td>이슈마다 검증 서브에이전트, 확인 안 된 것 제거<\/td>\n<td>설계만 공개, 수치 없음<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:700px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 780 392\" role=\"img\" aria-label=\"재현율과 정밀도의 맞교환\" data-minw=\"700\"><title>재현율과 정밀도의 맞교환<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"780\" height=\"392\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">&#x27;더 꼼꼼하게&#x27;와 &#x27;더 조용하게&#x27;는 맞바꿔졌다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">같은 연구 안에서 한 단계를 더했을 때 전 → 후. 지표 이름은 각 연구의 것 (09장 3절)<\/text><line x1=\"20\" y1=\"68\" x2=\"36\" y2=\"68\" class=\"s-d1\"/><text x=\"40.0\" y=\"72.0\" class=\"t-sm\">찾는 쪽(재현율 계열)<\/text><line x1=\"171.44\" y1=\"68\" x2=\"187.44\" y2=\"68\" class=\"s-d2\"/><text x=\"191.4\" y=\"72.0\" class=\"t-sm\">조용한 쪽(정밀도 계열)<\/text><rect x=\"20\" y=\"86\" width=\"236\" height=\"288\" rx=\"12\" class=\"f-s2\"/><text x=\"32.0\" y=\"108.0\" class=\"t-b\" font-size=\"12.5\">ByteDance BitsAI-CR · 필터 추가<\/text><line class=\"grid\" x1=\"50\" y1=\"330.0\" x2=\"244\" y2=\"330.0\"/><text x=\"32.0\" y=\"334.0\" class=\"t-mut\">0<\/text><line class=\"grid\" x1=\"50\" y1=\"230.0\" x2=\"244\" y2=\"230.0\"/><text x=\"32.0\" y=\"234.0\" class=\"t-mut\">50<\/text><line class=\"grid\" x1=\"50\" y1=\"130.0\" x2=\"244\" y2=\"130.0\"/><text x=\"32.0\" y=\"134.0\" class=\"t-mut\">100<\/text><text x=\"92.0\" y=\"348.0\" class=\"t-mut\" text-anchor=\"middle\">전<\/text><text x=\"184.0\" y=\"348.0\" class=\"t-mut\" text-anchor=\"middle\">후<\/text><g class=\"tip\"><title>ByteDance BitsAI-CR · 필터 추가 — 재현율: 45.5 → 39.77<\/title><line x1=\"92\" y1=\"239.0\" x2=\"184\" y2=\"250.5\" class=\"s-d1\"/><circle cx=\"92\" cy=\"239.0\" r=\"5\" class=\"f-d1 ring\"/><circle cx=\"184\" cy=\"250.5\" r=\"5\" class=\"f-d1 ring\"/><text x=\"82.0\" y=\"243.0\" class=\"t-val\" text-anchor=\"end\">45.5<\/text><text x=\"194.0\" y=\"254.5\" class=\"t-val\">39.77<\/text><\/g><g class=\"tip\"><title>ByteDance BitsAI-CR · 필터 추가 — 정밀도: 57.03 → 65.59<\/title><line x1=\"92\" y1=\"215.9\" x2=\"184\" y2=\"198.8\" class=\"s-d2\"/><circle cx=\"92\" cy=\"215.9\" r=\"5\" class=\"f-d2 ring\"/><circle cx=\"184\" cy=\"198.8\" r=\"5\" class=\"f-d2 ring\"/><text x=\"82.0\" y=\"219.9\" class=\"t-val\" text-anchor=\"end\">57.03<\/text><text x=\"194.0\" y=\"202.8\" class=\"t-val\">65.59<\/text><\/g><rect x=\"278\" y=\"86\" width=\"236\" height=\"288\" rx=\"12\" class=\"f-s2\"/><text x=\"290.0\" y=\"108.0\" class=\"t-b\" font-size=\"12.5\">Kuaishou (Lu 외) · 검증기 추가<\/text><line class=\"grid\" x1=\"308\" y1=\"330.0\" x2=\"502\" y2=\"330.0\"/><text x=\"290.0\" y=\"334.0\" class=\"t-mut\">0<\/text><line class=\"grid\" x1=\"308\" y1=\"230.0\" x2=\"502\" y2=\"230.0\"/><text x=\"290.0\" y=\"234.0\" class=\"t-mut\">50<\/text><line class=\"grid\" x1=\"308\" y1=\"130.0\" x2=\"502\" y2=\"130.0\"/><text x=\"290.0\" y=\"134.0\" class=\"t-mut\">100<\/text><text x=\"350.0\" y=\"348.0\" class=\"t-mut\" text-anchor=\"middle\">전<\/text><text x=\"442.0\" y=\"348.0\" class=\"t-mut\" text-anchor=\"middle\">후<\/text><g class=\"tip\"><title>Kuaishou (Lu 외) · 검증기 추가 — 핵심 버그 포함률: 31.11 → 20<\/title><line x1=\"350\" y1=\"267.8\" x2=\"442\" y2=\"290.0\" class=\"s-d1\"/><circle cx=\"350\" cy=\"267.8\" r=\"5\" class=\"f-d1 ring\"/><circle cx=\"442\" cy=\"290.0\" r=\"5\" class=\"f-d1 ring\"/><text x=\"340.0\" y=\"271.8\" class=\"t-val\" text-anchor=\"end\">31.11<\/text><text x=\"452.0\" y=\"299.7\" class=\"t-val\">20<\/text><\/g><g class=\"tip\"><title>Kuaishou (Lu 외) · 검증기 추가 — 오경보 아닌 비율: 12.19 → 24.63<\/title><line x1=\"350\" y1=\"305.6\" x2=\"442\" y2=\"280.7\" class=\"s-d2\"/><circle cx=\"350\" cy=\"305.6\" r=\"5\" class=\"f-d2 ring\"/><circle cx=\"442\" cy=\"280.7\" r=\"5\" class=\"f-d2 ring\"/><text x=\"340.0\" y=\"309.6\" class=\"t-val\" text-anchor=\"end\">12.19<\/text><text x=\"452.0\" y=\"284.7\" class=\"t-val\">24.63<\/text><\/g><rect x=\"536\" y=\"86\" width=\"236\" height=\"288\" rx=\"12\" class=\"f-s2\"/><text x=\"548.0\" y=\"108.0\" class=\"t-b\" font-size=\"12.5\">CR-Bench · Reflexion 반복<\/text><line class=\"grid\" x1=\"566\" y1=\"330.0\" x2=\"760\" y2=\"330.0\"/><text x=\"548.0\" y=\"334.0\" class=\"t-mut\">0<\/text><line class=\"grid\" x1=\"566\" y1=\"230.0\" x2=\"760\" y2=\"230.0\"/><text x=\"548.0\" y=\"234.0\" class=\"t-mut\">50<\/text><line class=\"grid\" x1=\"566\" y1=\"130.0\" x2=\"760\" y2=\"130.0\"/><text x=\"548.0\" y=\"134.0\" class=\"t-mut\">100<\/text><text x=\"608.0\" y=\"348.0\" class=\"t-mut\" text-anchor=\"middle\">전<\/text><text x=\"700.0\" y=\"348.0\" class=\"t-mut\" text-anchor=\"middle\">후<\/text><g class=\"tip\"><title>CR-Bench · Reflexion 반복 — 재현율: 27.01 → 32.76<\/title><line x1=\"608\" y1=\"276.0\" x2=\"700\" y2=\"264.5\" class=\"s-d1\"/><circle cx=\"608\" cy=\"276.0\" r=\"5\" class=\"f-d1 ring\"/><circle cx=\"700\" cy=\"264.5\" r=\"5\" class=\"f-d1 ring\"/><text x=\"598.0\" y=\"280.0\" class=\"t-val\" text-anchor=\"end\">27.01<\/text><text x=\"710.0\" y=\"268.5\" class=\"t-val\">32.76<\/text><\/g><g class=\"tip\"><title>CR-Bench · Reflexion 반복 — 유용 코멘트 비율: 83.63 → 66.1<\/title><line x1=\"608\" y1=\"162.7\" x2=\"700\" y2=\"197.8\" class=\"s-d2\"/><circle cx=\"608\" cy=\"162.7\" r=\"5\" class=\"f-d2 ring\"/><circle cx=\"700\" cy=\"197.8\" r=\"5\" class=\"f-d2 ring\"/><text x=\"598.0\" y=\"166.7\" class=\"t-val\" text-anchor=\"end\">83.63<\/text><text x=\"710.0\" y=\"201.8\" class=\"t-val\">66.1<\/text><\/g><text x=\"20.0\" y=\"386.0\" class=\"t-mut\">Kuaishou &#x27;오경보 아닌 비율&#x27; = 100 − 오경보율(87.81→75.37)로 바꿔 그림<\/text><\/svg><\/div><figcaption>그림 9-1. 한 단계를 더했을 때 찾는 쪽과 조용한 쪽이 맞바꿔졌다 — BitsAI-CR · Lu 외 · CR-Bench<\/figcaption><\/figure>\n<blockquote>\n<p>관찰(권고 아님): CR-Bench 저자들은 Reflexion 방식이 \"놓치는 비용 &gt; 소음 비용\"인 보안 감사 같은 곳에 맞을 수 있다고 썼다.<\/p>\n<\/blockquote>\n<h2>선택지 4. 정적분석 도구와 결합<\/h2>\n<table>\n<thead>\n<tr>\n<th>연구<\/th>\n<th>결과<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>IRIS<\/strong> (ICLR 2025)<\/td>\n<td>LLM + CodeQL로 취약점 120개 중 55개 탐지(CodeQL 단독 27개). 그러나 거짓 발견율은 90.03% → 84.82%로 여전히 높다. 작은 모델은 약 95%로 악화. 저자는 이 값을 상한으로 보고, 50개를 수작업 확인하자 약 46%였다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>Jaoua 외<\/strong> (MSR 2025)<\/td>\n<td>정적분석기가 가장 정확했다. 생성 시점에 분석 결과를 넣는 방식(검색 보강)만 미세조정 단독보다 분명히 나았다. 정확한 수치는 그림에만 있다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>CRScore++<\/strong> (프리프린트)<\/td>\n<td>생성 시 도구 출력 주입이 도메인 밖에서는 돕지 않았다(포괄성 0.43 → 0.39)<\/td>\n<td>D<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>선택지 5. 학습 방식 — 프롬프트 / 미세조정 / 강화학습 / 피드백 루프<\/h2>\n<table>\n<thead>\n<tr>\n<th>연구<\/th>\n<th>결과<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MetaMateCR<\/strong> (Meta, FSE 2026 산업)<\/td>\n<td>미세조정 Llama 70B가 실서비스 수정 적용률 19.75% vs GPT-4o 10.53~10.7%<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>Pornprasit 2024<\/strong> (IST)<\/td>\n<td>GPT-3.5 미세조정(데이터 6%)이 대부분 이겼지만 예외가 있었다(퓨샷과 동점이거나 퓨샷이 우세)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>CRScore++<\/strong> (프리프린트)<\/td>\n<td>선호 학습(DPO) 단계가 SFT보다 \"정확도 개선 없음\"<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>CoRAL<\/strong> (프리프린트)<\/td>\n<td>강화학습으로 BLEU 7.05 → 8.67(BLEU만)<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>피드백 루프<\/strong><\/td>\n<td>개발자 수용을 보상으로 쓰는 동료 심사 강화학습 연구는 찾지 못했다. 가장 가까운 것: BitsAI-CR 규칙 퇴출, Google AutoCommenter 규칙 억제(유용 54 → 66%), Cursor 학습 규칙(해결률 \"80% 근접\", 벤더)<\/td>\n<td>A·D<\/td>\n<\/tr>\n<tr>\n<td><strong>OpenAI Codex<\/strong> (블로그)<\/td>\n<td>리뷰어를 별도 과제로 훈련하고, 재현율 일부를 내주고 정밀도를 택했다<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>선택지 6. 코멘트 수 제한·순위·확신도 기준<\/h2>\n<table>\n<thead>\n<tr>\n<th>연구<\/th>\n<th>결과<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Lu 외<\/strong> (ICML 2025) — 통제된 유일한 근거<\/td>\n<td>전체: 핵심 버그 포함 37.04 / 정밀도 지표(CPI) 9.77 → 상위 10개 32.59 / 13.94 → 상위 5개 25.93 / 14.26 → 상위 3개 17.78 / 12.77. <strong>상위 5개까지는 정밀도가 오르고, 더 줄이면 둘 다 떨어진다<\/strong><\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>Google 코멘트 해결<\/strong><\/td>\n<td>확신도 기준을 목표 정밀도 50%에 맞추자 오프라인 커버리지 52%<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td><strong>Uber uReview<\/strong><\/td>\n<td>생성기·언어·범주별 기준값(값 비공개)<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td><strong>Atlassian<\/strong> 범주별 해결률<\/td>\n<td>가독성 43.3%, 버그 41.9%, 설계 28.6%<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>Anthropic<\/strong><\/td>\n<td>큰 PR(1,000줄 초과) 84%에서 평균 7.5개 발견, 작은 PR(50줄 미만) 31%에서 평균 0.5개. PR 크기에 따라 코멘트 수가 달라지는 설계<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lu 외의 \"상위 5개\"는 무엇의 5개인가<\/strong><\/p>\n<ul>\n<li><strong>단위<\/strong>: <strong>MR(머지 요청, GitLab의 PR) 하나에 대해<\/strong> 에이전트가 단 코멘트 중 5개만 남긴다는 뜻이다. 저장소 전체나 하루 단위가 아니다.<\/li>\n<li>\n<p><strong>줄 세우는 기준<\/strong>: 리뷰어 LLM이 코멘트마다 스스로 세 가지 점수(1~7)를 매긴다. 1은 \"사소하거나 가짜이거나 하찮은 문제\", 7은 \"심각하고 진짜인 문제\"다.<\/p>\n<ul>\n<li>Q1 사소한 지적(nitpick)인가<\/li>\n<li>Q2 실제로는 문제가 아닌 가짜 문제인가<\/li>\n<li>Q3 얼마나 심각한가(예: 주석 누락은 낮고, 코어 덤프·무한 루프는 높다)<\/li>\n<\/ul>\n<p>먼저 Q1·Q2 점수가 4 이하인 코멘트, 즉 사소하거나 가짜 문제로 본 코멘트를 버린다(1차 필터). 남은 코멘트를 <strong>Q3 심각도 점수가 높은 순<\/strong>으로 세워 위에서 k개만 남긴다.\n- <strong>실험 조건<\/strong>: Kuaishou C++ 코드에서 실제 장애를 일으킨 MR 45건, 리뷰어 1명, LLaMA3.1-405B, 호출 흐름을 따라 코드를 잘라 넣는 방식(Left Flow). 원문 Table 7.<\/p>\n<\/li>\n<\/ul>\n<p><strong>지표 읽는 법<\/strong> (모두 %)<\/p>\n<table>\n<thead>\n<tr>\n<th>지표<\/th>\n<th>뜻<\/th>\n<th>좋은 방향<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>핵심 버그 포함률(KBI)<\/td>\n<td>장애 원인이 된 버그를 코멘트 중에 짚은 MR의 비율. 재현율에 해당한다<\/td>\n<td>높을수록<\/td>\n<\/tr>\n<tr>\n<td>오경보율(FAR)<\/td>\n<td>MR 하나의 코멘트 중 핵심 버그와 상관없는 코멘트의 비율을 MR마다 내서 평균한 값. 핵심 버그 외의 지적은 맞는 말이어도 오경보로 센다(저자들도 엄격한 기준이라고 했다)<\/td>\n<td>낮을수록<\/td>\n<\/tr>\n<tr>\n<td>종합 점수(CPI)<\/td>\n<td>핵심 버그 포함률과 (100 − 오경보율)의 조화평균. F1처럼 두 쪽을 함께 본다<\/td>\n<td>높을수록<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>표를 다시 읽으면<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>남긴 코멘트<\/th>\n<th>핵심 버그 포함률<\/th>\n<th>오경보율<\/th>\n<th>종합 점수<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>전체<\/td>\n<td>37.04<\/td>\n<td>94.36<\/td>\n<td>9.77<\/td>\n<\/tr>\n<tr>\n<td>1차 필터 후<\/td>\n<td>33.33<\/td>\n<td>92.03<\/td>\n<td>12.80<\/td>\n<\/tr>\n<tr>\n<td>상위 10개<\/td>\n<td>32.59<\/td>\n<td>91.13<\/td>\n<td>13.94<\/td>\n<\/tr>\n<tr>\n<td>상위 5개<\/td>\n<td>25.93<\/td>\n<td>90.15<\/td>\n<td><strong>14.26<\/strong><\/td>\n<\/tr>\n<tr>\n<td>상위 3개<\/td>\n<td>17.78<\/td>\n<td>90.00<\/td>\n<td>12.77<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>코멘트를 줄일수록 <strong>핵심 버그를 덜 잡는다<\/strong>(37 → 18). 심각도 점수가 높은 코멘트가 꼭 핵심 버그를 짚은 코멘트는 아니었다는 뜻이다.<\/li>\n<li>오경보율은 조금씩만 내려간다(94 → 90). 5개 이하로 줄여도 거의 그대로다.<\/li>\n<li>그래서 둘을 합친 종합 점수는 상위 5개에서 가장 높고, 3개로 더 줄이면 핵심 버그를 놓치는 손해가 커서 떨어진다.<\/li>\n<li>이전 판에서 이 값을 \"정밀도 지표\"라고 적었는데, CPI는 정밀도가 아니라 <strong>재현율과 정밀도를 합친 종합 점수<\/strong>다(2026-11-25 정정).<\/li>\n<li>최적값 k는 코드를 잘라 넣는 방식과 리뷰어 수에 따라 달랐다. 예: 코드 변경(diff)만 넣으면 상위 10개가 가장 높았다(원문 부록 S).<\/li>\n<\/ul>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:560px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 620 340\" role=\"img\" aria-label=\"코멘트 수 제한의 효과\" data-minw=\"560\"><title>코멘트 수 제한의 효과<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"620\" height=\"340\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">MR 하나당 코멘트를 상위 k개로 줄이면 — 종합 점수는 5개에서 가장 높았다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">상위 k개 = 심각도 점수(1~7) 높은 순 · Kuaishou C++ 장애 45건 (Lu 외, ICML 2025) · 단위 %<\/text><line class=\"grid\" x1=\"70\" y1=\"270.0\" x2=\"470\" y2=\"270.0\"/><text x=\"62.0\" y=\"274.0\" class=\"t-mut\" text-anchor=\"end\">0<\/text><line class=\"grid\" x1=\"70\" y1=\"222.5\" x2=\"470\" y2=\"222.5\"/><text x=\"62.0\" y=\"226.5\" class=\"t-mut\" text-anchor=\"end\">10<\/text><line class=\"grid\" x1=\"70\" y1=\"175.0\" x2=\"470\" y2=\"175.0\"/><text x=\"62.0\" y=\"179.0\" class=\"t-mut\" text-anchor=\"end\">20<\/text><line class=\"grid\" x1=\"70\" y1=\"127.5\" x2=\"470\" y2=\"127.5\"/><text x=\"62.0\" y=\"131.5\" class=\"t-mut\" text-anchor=\"end\">30<\/text><line class=\"grid\" x1=\"70\" y1=\"80.0\" x2=\"470\" y2=\"80.0\"/><text x=\"62.0\" y=\"84.0\" class=\"t-mut\" text-anchor=\"end\">40<\/text><text x=\"70.0\" y=\"288.0\" class=\"t-mut\" text-anchor=\"middle\">전체<\/text><text x=\"203.3\" y=\"288.0\" class=\"t-mut\" text-anchor=\"middle\">상위 10개<\/text><text x=\"336.7\" y=\"288.0\" class=\"t-mut\" text-anchor=\"middle\">상위 5개<\/text><text x=\"470.0\" y=\"288.0\" class=\"t-mut\" text-anchor=\"middle\">상위 3개<\/text><path d=\"M70.0,94.1 L203.3,115.2 L336.7,146.8 L470.0,185.5\" class=\"s-d1\"/><g class=\"tip\"><title>전체: 핵심 버그 포함률 37.04<\/title><circle class=\"hit\" cx=\"70.0\" cy=\"94.1\" r=\"12\"/><circle cx=\"70.0\" cy=\"94.1\" r=\"5\" class=\"f-d1 ring hl\"/><text x=\"80.0\" y=\"84.1\" class=\"t-val\">37.04<\/text><\/g><g class=\"tip\"><title>상위 10개: 핵심 버그 포함률 32.59<\/title><circle class=\"hit\" cx=\"203.3\" cy=\"115.2\" r=\"12\"/><circle cx=\"203.3\" cy=\"115.2\" r=\"5\" class=\"f-d1 ring hl\"/><\/g><g class=\"tip\"><title>상위 5개: 핵심 버그 포함률 25.93<\/title><circle class=\"hit\" cx=\"336.7\" cy=\"146.8\" r=\"12\"/><circle cx=\"336.7\" cy=\"146.8\" r=\"5\" class=\"f-d1 ring hl\"/><text x=\"336.7\" y=\"136.8\" class=\"t-val\" text-anchor=\"middle\">25.93<\/text><\/g><g class=\"tip\"><title>상위 3개: 핵심 버그 포함률 17.78<\/title><circle class=\"hit\" cx=\"470.0\" cy=\"185.5\" r=\"12\"/><circle cx=\"470.0\" cy=\"185.5\" r=\"5\" class=\"f-d1 ring hl\"/><text x=\"470.0\" y=\"175.5\" class=\"t-val\" text-anchor=\"middle\">17.78<\/text><\/g><text x=\"482.0\" y=\"189.5\" class=\"t-b\">핵심 버그 포함률<\/text><path d=\"M70.0,223.6 L203.3,203.8 L336.7,202.3 L470.0,209.3\" class=\"s-d2\"/><g class=\"tip\"><title>전체: 종합 점수(CPI) 9.77<\/title><circle class=\"hit\" cx=\"70.0\" cy=\"223.6\" r=\"12\"/><circle cx=\"70.0\" cy=\"223.6\" r=\"5\" class=\"f-d2 ring hl\"/><text x=\"80.0\" y=\"243.6\" class=\"t-val\">9.77<\/text><\/g><g class=\"tip\"><title>상위 10개: 종합 점수(CPI) 13.94<\/title><circle class=\"hit\" cx=\"203.3\" cy=\"203.8\" r=\"12\"/><circle cx=\"203.3\" cy=\"203.8\" r=\"5\" class=\"f-d2 ring hl\"/><\/g><g class=\"tip\"><title>상위 5개: 종합 점수(CPI) 14.26<\/title><circle class=\"hit\" cx=\"336.7\" cy=\"202.3\" r=\"12\"/><circle cx=\"336.7\" cy=\"202.3\" r=\"5\" class=\"f-d2 ring hl\"/><text x=\"336.7\" y=\"222.3\" class=\"t-val\" text-anchor=\"middle\">14.26<\/text><\/g><g class=\"tip\"><title>상위 3개: 종합 점수(CPI) 12.77<\/title><circle class=\"hit\" cx=\"470.0\" cy=\"209.3\" r=\"12\"/><circle cx=\"470.0\" cy=\"209.3\" r=\"5\" class=\"f-d2 ring hl\"/><text x=\"470.0\" y=\"229.3\" class=\"t-val\" text-anchor=\"middle\">12.77<\/text><\/g><text x=\"482.0\" y=\"213.3\" class=\"t-b\">종합 점수(CPI)<\/text><text x=\"20.0\" y=\"334.0\" class=\"t-mut\">&#x27;전체&#x27;와 &#x27;상위 10개&#x27; 사이에 1차 필터(사소하거나 가짜 문제로 본 코멘트를 버림)가 있다<\/text><\/svg><\/div><figcaption>그림 9-2. MR 하나당 코멘트를 심각도 순 상위 k개로 줄일 때 — 핵심 버그 포함률은 계속 떨어지고, 종합 점수(CPI)는 상위 5개에서 가장 높았다 (Lu 외 ICML 2025)<\/figcaption><\/figure>\n<h2>선택지 7. 누구에게 언제 보여 주나<\/h2>\n<p>08장 근거와 겹친다.<\/p>\n<ul>\n<li>Facebook Infer: 같은 분석이 일괄 보고에서 수정률 ~0%, 리뷰 시점 코멘트에서 70% 이상<\/li>\n<li>Meta MetaMateCR: 리뷰어에게도 보이면 리뷰 시간 +5.5%, 작성자에게만 보이면 변화 없음<\/li>\n<li>Google: 리뷰어 사전 검토가 생기자 목표 정밀도를 50% → 40%로 낮춤<\/li>\n<\/ul>\n<hr />\n<h2>여러 출처에서 반복되는 관찰 (권고가 아니다)<\/h2>\n<ol>\n<li>컨텍스트, 에이전트 수, 필터 모두 <strong>정밀도와 재현율을 맞바꿨다.<\/strong> 둘 다 안정적으로 올린 선택지는 찾지 못했다.<\/li>\n<li>\"더 많은 컨텍스트 = 더 좋음\"은 성립하지 않는 경우가 여러 번 보고되었다. 텍스트 설명(이슈·PR)은 코드 컨텍스트보다 효과가 컸다는 결과가 있다.<\/li>\n<li>다중 에이전트의 이득은 비용 대비 작거나 없다는 결과가 여럿 있다. 반대로 같은 모델의 여러 실행을 합치면(앙상블) 재현율이 크게 올랐다.<\/li>\n<li>실서비스 숫자(해결률·유용률)는 대부분 회사가 직접 재고 각자 정의했다.<\/li>\n<li>이 선택지들을 <strong>한 실험에서 함께<\/strong> 잰 연구는 없다.<\/li>\n<\/ol>\n<h2>스스로 판단할 질문<\/h2>\n<ol>\n<li>우리 에이전트는 재현율과 정밀도 중 어느 쪽을 잃는 것이 더 비싼가? 관점(버그, 보안, 컨벤션, 기획 충족)마다 답이 다른가?<\/li>\n<li>컨텍스트를 늘릴 때 그 효과를 무엇으로 확인할 것인가? 컨텍스트 유형(PR 설명, 관련 코드, 가이드라인)을 따로 시험할 것인가?<\/li>\n<li>다중 관점 구조의 이득을 \"같은 모델 여러 번 + 병합\"과 비교해 볼 것인가?<\/li>\n<li>검증 단계를 둔다면 그 단계가 버린 것 중 진짜 문제가 몇 개인지 잴 것인가?<\/li>\n<li>PR당 코멘트 상한을 둔다면 그 값은 무엇으로 정할 것인가?<\/li>\n<li>사내 코드에서 공개 벤치마크만큼 나올 것이라고 볼 근거가 있는가?(CRBugBench의 사내 저장소 하락)<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<ul>\n<li>ContextCRBench — <a href=\"https://arxiv.org/html/2511.07017v1\">https://arxiv.org/html/2511.07017v1<\/a> · AACR-Bench — <a href=\"https://export.arxiv.org/pdf/2601.19494\">https://export.arxiv.org/pdf/2601.19494<\/a> · SWE-PRBench — <a href=\"https://export.arxiv.org/pdf/2603.26130\">https://export.arxiv.org/pdf/2603.26130<\/a><\/li>\n<li>Lu 외 (Kuaishou) — <a href=\"https://export.arxiv.org/pdf/2505.17928\">https://export.arxiv.org/pdf/2505.17928<\/a> · LAURA — <a href=\"https://arxiv.org/html/2512.01356v2\">https://arxiv.org/html/2512.01356v2<\/a> · 콜 그래프 프롬프트 — <a href=\"https://arxiv.org/html/2411.10129v1\">https://arxiv.org/html/2411.10129v1<\/a><\/li>\n<li>RovoDev — <a href=\"https://arxiv.org/pdf/2601.01129\">https://arxiv.org/pdf/2601.01129<\/a> · CRBugBench — <a href=\"https://export.arxiv.org/pdf/2610.13668\">https://export.arxiv.org/pdf/2610.13668<\/a><\/li>\n<li>SWR-Bench — <a href=\"https://arxiv.org/html/2509.01494v1\">https://arxiv.org/html/2509.01494v1<\/a> · Single Agent — <a href=\"https://export.arxiv.org/pdf/2611.23283\">https://export.arxiv.org/pdf/2611.23283<\/a> · CodeAgent — <a href=\"https://arxiv.org/html/2402.02172v5\">https://arxiv.org/html/2402.02172v5<\/a> · RevAgent — <a href=\"https://arxiv.org/html/2511.00517\">https://arxiv.org/html/2511.00517<\/a> · Hydra-Reviewer — <a href=\"https://conf.researchr.org/details/fse-2026/fse-2026-journal-first/40/Hydra-Reviewer-A-holistic-multi-agent-system-for-automatic-code-review-comment-gener\">https://conf.researchr.org/details/fse-2026/fse-2026-journal-first/40/Hydra-Reviewer-A-holistic-multi-agent-system-for-automatic-code-review-comment-gener<\/a><\/li>\n<li>BitsAI-CR — <a href=\"https://arxiv.org/html/2501.15134v1\">https://arxiv.org/html/2501.15134v1<\/a> · CR-Bench — <a href=\"https://arxiv.org/html/2603.11078v1\">https://arxiv.org/html/2603.11078v1<\/a> · Huang 외 — <a href=\"https://arxiv.org/abs/2310.01798\">https://arxiv.org/abs/2310.01798<\/a> · Reflexion — <a href=\"https://arxiv.org/abs/2303.11366\">https://arxiv.org/abs/2303.11366<\/a> · TestGen-LLM — <a href=\"https://arxiv.org/abs/2402.09171\">https://arxiv.org/abs/2402.09171<\/a><\/li>\n<li>IRIS — <a href=\"https://arxiv.org/html/2405.17238v3\">https://arxiv.org/html/2405.17238v3<\/a> · Jaoua 외 — <a href=\"https://arxiv.org/html/2502.06633\">https://arxiv.org/html/2502.06633<\/a> · CRScore++ — <a href=\"https://arxiv.org/html/2506.00296v1\">https://arxiv.org/html/2506.00296v1<\/a> · CoRAL — <a href=\"https://arxiv.org/html/2506.04464v1\">https://arxiv.org/html/2506.04464v1<\/a><\/li>\n<li>MetaMateCR — <a href=\"https://arxiv.org/html/2507.13499v1\">https://arxiv.org/html/2507.13499v1<\/a> · Pornprasit 2024 — <a href=\"https://export.arxiv.org/pdf/2402.00905\">https://export.arxiv.org/pdf/2402.00905<\/a><\/li>\n<li>Agentless — <a href=\"https://arxiv.org/html/2407.01489v2\">https://arxiv.org/html/2407.01489v2<\/a> · SWE-agent — <a href=\"https://arxiv.org/html/2405.15793v3\">https://arxiv.org/html/2405.15793v3<\/a><\/li>\n<li>Google — <a href=\"https://research.google/blog/resolving-code-review-comments-with-ml/\">https://research.google/blog/resolving-code-review-comments-with-ml/<\/a> · <a href=\"https://arxiv.org/html/2405.13565v1\">https://arxiv.org/html/2405.13565v1<\/a><\/li>\n<li>Uber — <a href=\"https://www.uber.com/blog/ureview/\">https://www.uber.com/blog/ureview/<\/a> · Cursor — <a href=\"https://cursor.com/blog/building-bugbot\">https://cursor.com/blog/building-bugbot<\/a> · GitHub — <a href=\"https://github.blog/ai-and-ml/github-copilot/better-tools-made-copilot-code-review-worse-heres-how-we-actually-improved-it/\">https://github.blog/ai-and-ml/github-copilot/better-tools-made-copilot-code-review-worse-heres-how-we-actually-improved-it/<\/a> · Anthropic — <a href=\"https://claude.com/blog/code-review\">https://claude.com/blog/code-review<\/a> · OpenAI — <a href=\"https://alignment.openai.com/scaling-code-verification/\">https://alignment.openai.com/scaling-code-verification/<\/a><\/li>\n<li>Atlassian 범주별 — <a href=\"https://arxiv.org/html/2510.05450v1\">https://arxiv.org/html/2510.05450v1<\/a><\/li>\n<\/ul>", "text": " 09. 에이전트 설계 선택지 — 무엇이 측정되었나 생성일 : 2026-11-19 최종 수정일 : 2026-11-25 수준 : 심화 근거 원장 : wave-1 A8 · wave-2 W2c · wave-3 W3 이 장에서 답하는 질문 리뷰 에이전트를 만들 때 고르는 선택지(컨텍스트, 에이전트 구조, 검증 단계, 학습 방식, 코멘트 수)마다 어떤 효과가 측정되었나? 이 장은 선택지를 고르지 않는다. 측정 결과와 그 조건만 늘어놓는다. 이 장 전체에 걸린 주의 : 아래 실험들은 데이터·모델·지표가 모두 다르다. \"A 연구에서 X가 좋았다\"를 \"X가 좋다\"로 일반화할 근거는 약하다. 대부분의 결과가 정밀도와 재현율을 맞바꾸는 방향 으로 나타났다. 선택지 1. 컨텍스트 — diff만 줄까, 주변 코드·설명까지 줄까 연구 비교한 것 결과 등급 ContextCRBench (FSE 2026, ByteDance) 컨텍스트 없음 / 이슈·PR 설명(텍스트) / 주변 코드 품질 판단 F1(폐쇄 모델 평균): 없음 36.08 → 텍스트 64.37 → 코드만 51.76. 결함 위치 찾기는 거의 그대로였고(16.41 → 18.54) 오픈 모델은 약간 나빠졌다 A Lu 외 (Kuaishou, ICML 2025) diff만 / 부모 함수 / 데이터 흐름 따라 자르기(슬라이싱) 핵심 버그 포함률: diff만 23.70 → 부모 함수 31.85 → 왼쪽 흐름 37.04 → 전체 흐름 39.26. 단 필터를 거친 뒤에는 왼쪽 흐름이 전체 흐름보다 나았다(긴 컨텍스트가 산만하게 한다고 해석) A AACR-Bench (프리프린트) 없음 / BM25(키워드) 검색 / 에이전트 탐색 Claude-4.5 F1: 없음 14.46 → BM25 9.98 → 에이전트 16.12. 에이전트는 PR당 코멘트 0.09~0.15개로 정밀도 쪽, 비에이전트는 재현율 쪽으로 치우쳤다 D SWE-PRBench (프리프린트, 1인 저자) 컨텍스트 층 A(2,000토큰) → B(2,200) → C(2,500) 8개 모델 모두 단조 하락(예: Sonnet 4.6 0.190 → 0.135 → 0.122). 주변 코드가 필요한 이슈 유형에서 점수가 절반이 됐다. 단, 판정자 검증이 30건뿐이고 통계 표기에 불일치가 있다 D RovoDev (Atlassian, ICSE-SEIP 2026) Jira·PR 설명 추가 / 리뷰 가이드라인 추가 설명 +1~3점, 가이드라인 +5점 A LAURA (ASE 2025) 컨텍스트 보강 제거 사람 평가 \"도움됨\" 20.0% → 17.7% A CRBugBench (Microsoft, 프리프린트) 공개 저장소 vs 사내 모노레포 사내 저장소에서 최대 25.5% 하락(단위 불명확). 차이의 일부는 \"diff만 보고 알 수 있는 버그\" 비율 차이(46.1% vs 22.8%)로 설명된다 D 사람 쪽 근거와의 연결 : 사람 리뷰어도 넓은 맥락이 필요한 결함을 놓친다(01장 Paul 외 2021). 선택지 2. 에이전트 구조 — 단일 프롬프트, 에이전트, 다중 에이전트 연구 결과 단서 등급 SWR-Bench (FSE 2026) 에이전트형 도구가 단일 프롬프트를 이기지 못했다. 평균 F1은 SWE-agent식 12.61, 다중 에이전트 9.22, 단일 프롬프트 12.49. 같은 모델을 10번 돌려 합치면 F1 +43.67%, 재현율 +118.83% Python 12개 저장소 A \"When Single Agent Is Enough\" (2026 프리프린트) GPT-4o-mini, Java 328건. 단일 에이전트가 다중 에이전트(Hydra-Reviewer)와 같거나 나았다. 간결성·명확성·관련성 모두 유의. 토큰은 1,610 vs 47,222 반례: \"정확\" 비율은 다중 ReAct 74.9%가 단일 ReAct 63.6%보다 높았다. 판정자-사람 상관 0.395~0.684 D CRBugBench (프리프린트) 다중 에이전트 +4.7%(비용 5.55배). 본문 다른 곳에는 +2.8%(3.68배)로 적혀 있다. \"포괄적으로 지적하라\"는 프롬프트는 +5.8%(1.10배) recall@5만 측정, 정밀도 미측정 D Lu 외 (ICML 2025) — 통제된 유일한 근거 MR 하나당 코멘트를 심각도 점수 순으로 상위 k개만 남겼다. 핵심 버그 포함률 / 종합 점수(CPI): 전체 37.04 / 9.77 → 상위 10개 32.59 / 13.94 → 상위 5개 25.93 / 14.26 → 상위 3개 17.78 / 12.77. 줄일수록 핵심 버그를 덜 잡고, 종합 점수는 상위 5개에서 가장 높았다 (아래 풀이) A CodeAgent (EMNLP 2024) 취약점 과제에서 확인된 비율 92.96% vs GPT-4 51.42% 정답을 CodeAgent 출력을 검증해 만들어 유리하게 편향 . 코드 수정은 3개 중 1개 데이터셋에서만 기준선을 이김 A Cursor Bugbot (벤더) 초기에는 8회 투표가 \"가장 효과적\". 이후 완전 에이전트형 전환이 \"가장 큰 개선\" 분리된 수치 없음 D Agentless (FSE 2025) · SWE-agent (NeurIPS 2024) 이슈 수정에서 고정 파이프라인 32.00%·$0.70 vs SWE-agent 23.00%·$1.62. SWE-agent는 도구 인터페이스 세부(편집 명령 제거 18.0 → 10.3)가 성능을 크게 바꿨다 리뷰가 아니라 이슈 수정 과제 A GitHub Copilot (블로그) 범용 CLI 도구로 바꾸자 비용↑·유용 코멘트↓. 도구 설명을 리뷰 흐름에 맞춰 다시 쓰자 비용 약 −20% 자기 보고 B 선택지 3. 생성 뒤 검증·필터 단계 거의 모든 연구에서 정밀도가 오르고 재현율이 내려갔다. 연구 정밀도 쪽 재현율 쪽 등급 BitsAI-CR (ByteDance) 필터: 57.03% → 65.59% 45.50% → 39.77% D BitsAI-CR 필터의 추론 순서 결론 먼저: 77.09% (1.7초) vs 추론 먼저: 65.80%(31초) — D Lu 외 (ICML 2025) 검증기: 오경보 87.81 → 75.37 핵심 버그 포함 31.11 → 20.00 A CR-Bench (프리프린트) Reflexion(자기 성찰 반복): SNR(쓸모 있는 코멘트 / 소음) 5.11 → 1.95 로 악화 재현율 27.01 → 32.76 상승 D RovoDev (ICSE-SEIP 2026) 실행 가능성 필터 +15~20점. 사실성 LLM 판정기는 \"효과 미미\" — A Huang 외 (ICLR 2024) 외부 피드백 없는 자기 수정은 안정적으로 돕지 않는다(리뷰 특정 수치 없음) — A CodeAgent (EMNLP 2024) QA-Checker로 확인 건수와 비율이 둘 다 올랐다 취약점 과제, 자체 라벨 A Meta TestGen-LLM (FSE 2024) 빌드 → 통과 → 커버리지 단계 필터로 최종 수용 73% 테스트 생성(리뷰 아님) A Anthropic 공개 플러그인 이슈마다 검증 서브에이전트, 확인 안 된 것 제거 설계만 공개, 수치 없음 B 그림 9-1. 한 단계를 더했을 때 찾는 쪽과 조용한 쪽이 맞바꿔졌다 — BitsAI-CR · Lu 외 · CR-Bench 관찰(권고 아님): CR-Bench 저자들은 Reflexion 방식이 \"놓치는 비용 > 소음 비용\"인 보안 감사 같은 곳에 맞을 수 있다고 썼다. 선택지 4. 정적분석 도구와 결합 연구 결과 등급 IRIS (ICLR 2025) LLM + CodeQL로 취약점 120개 중 55개 탐지(CodeQL 단독 27개). 그러나 거짓 발견율은 90.03% → 84.82%로 여전히 높다. 작은 모델은 약 95%로 악화. 저자는 이 값을 상한으로 보고, 50개를 수작업 확인하자 약 46%였다 A Jaoua 외 (MSR 2025) 정적분석기가 가장 정확했다. 생성 시점에 분석 결과를 넣는 방식(검색 보강)만 미세조정 단독보다 분명히 나았다. 정확한 수치는 그림에만 있다 A CRScore++ (프리프린트) 생성 시 도구 출력 주입이 도메인 밖에서는 돕지 않았다(포괄성 0.43 → 0.39) D 선택지 5. 학습 방식 — 프롬프트 / 미세조정 / 강화학습 / 피드백 루프 연구 결과 등급 MetaMateCR (Meta, FSE 2026 산업) 미세조정 Llama 70B가 실서비스 수정 적용률 19.75% vs GPT-4o 10.53~10.7% A Pornprasit 2024 (IST) GPT-3.5 미세조정(데이터 6%)이 대부분 이겼지만 예외가 있었다(퓨샷과 동점이거나 퓨샷이 우세) A CRScore++ (프리프린트) 선호 학습(DPO) 단계가 SFT보다 \"정확도 개선 없음\" D CoRAL (프리프린트) 강화학습으로 BLEU 7.05 → 8.67(BLEU만) D 피드백 루프 개발자 수용을 보상으로 쓰는 동료 심사 강화학습 연구는 찾지 못했다. 가장 가까운 것: BitsAI-CR 규칙 퇴출, Google AutoCommenter 규칙 억제(유용 54 → 66%), Cursor 학습 규칙(해결률 \"80% 근접\", 벤더) A·D OpenAI Codex (블로그) 리뷰어를 별도 과제로 훈련하고, 재현율 일부를 내주고 정밀도를 택했다 B 선택지 6. 코멘트 수 제한·순위·확신도 기준 연구 결과 등급 Lu 외 (ICML 2025) — 통제된 유일한 근거 전체: 핵심 버그 포함 37.04 / 정밀도 지표(CPI) 9.77 → 상위 10개 32.59 / 13.94 → 상위 5개 25.93 / 14.26 → 상위 3개 17.78 / 12.77. 상위 5개까지는 정밀도가 오르고, 더 줄이면 둘 다 떨어진다 A Google 코멘트 해결 확신도 기준을 목표 정밀도 50%에 맞추자 오프라인 커버리지 52% A Uber uReview 생성기·언어·범주별 기준값(값 비공개) B Atlassian 범주별 해결률 가독성 43.3%, 버그 41.9%, 설계 28.6% D Anthropic 큰 PR(1,000줄 초과) 84%에서 평균 7.5개 발견, 작은 PR(50줄 미만) 31%에서 평균 0.5개. PR 크기에 따라 코멘트 수가 달라지는 설계 B Lu 외의 \"상위 5개\"는 무엇의 5개인가 단위 : MR(머지 요청, GitLab의 PR) 하나에 대해 에이전트가 단 코멘트 중 5개만 남긴다는 뜻이다. 저장소 전체나 하루 단위가 아니다. 줄 세우는 기준 : 리뷰어 LLM이 코멘트마다 스스로 세 가지 점수(1~7)를 매긴다. 1은 \"사소하거나 가짜이거나 하찮은 문제\", 7은 \"심각하고 진짜인 문제\"다. Q1 사소한 지적(nitpick)인가 Q2 실제로는 문제가 아닌 가짜 문제인가 Q3 얼마나 심각한가(예: 주석 누락은 낮고, 코어 덤프·무한 루프는 높다) 먼저 Q1·Q2 점수가 4 이하인 코멘트, 즉 사소하거나 가짜 문제로 본 코멘트를 버린다(1차 필터). 남은 코멘트를 Q3 심각도 점수가 높은 순 으로 세워 위에서 k개만 남긴다. - 실험 조건 : Kuaishou C++ 코드에서 실제 장애를 일으킨 MR 45건, 리뷰어 1명, LLaMA3.1-405B, 호출 흐름을 따라 코드를 잘라 넣는 방식(Left Flow). 원문 Table 7. 지표 읽는 법 (모두 %) 지표 뜻 좋은 방향 핵심 버그 포함률(KBI) 장애 원인이 된 버그를 코멘트 중에 짚은 MR의 비율. 재현율에 해당한다 높을수록 오경보율(FAR) MR 하나의 코멘트 중 핵심 버그와 상관없는 코멘트의 비율을 MR마다 내서 평균한 값. 핵심 버그 외의 지적은 맞는 말이어도 오경보로 센다(저자들도 엄격한 기준이라고 했다) 낮을수록 종합 점수(CPI) 핵심 버그 포함률과 (100 − 오경보율)의 조화평균. F1처럼 두 쪽을 함께 본다 높을수록 표를 다시 읽으면 남긴 코멘트 핵심 버그 포함률 오경보율 종합 점수 전체 37.04 94.36 9.77 1차 필터 후 33.33 92.03 12.80 상위 10개 32.59 91.13 13.94 상위 5개 25.93 90.15 14.26 상위 3개 17.78 90.00 12.77 코멘트를 줄일수록 핵심 버그를 덜 잡는다 (37 → 18). 심각도 점수가 높은 코멘트가 꼭 핵심 버그를 짚은 코멘트는 아니었다는 뜻이다. 오경보율은 조금씩만 내려간다(94 → 90). 5개 이하로 줄여도 거의 그대로다. 그래서 둘을 합친 종합 점수는 상위 5개에서 가장 높고, 3개로 더 줄이면 핵심 버그를 놓치는 손해가 커서 떨어진다. 이전 판에서 이 값을 \"정밀도 지표\"라고 적었는데, CPI는 정밀도가 아니라 재현율과 정밀도를 합친 종합 점수 다(2026-11-25 정정). 최적값 k는 코드를 잘라 넣는 방식과 리뷰어 수에 따라 달랐다. 예: 코드 변경(diff)만 넣으면 상위 10개가 가장 높았다(원문 부록 S). 그림 9-2. MR 하나당 코멘트를 심각도 순 상위 k개로 줄일 때 — 핵심 버그 포함률은 계속 떨어지고, 종합 점수(CPI)는 상위 5개에서 가장 높았다 (Lu 외 ICML 2025) 선택지 7. 누구에게 언제 보여 주나 08장 근거와 겹친다. Facebook Infer: 같은 분석이 일괄 보고에서 수정률 ~0%, 리뷰 시점 코멘트에서 70% 이상 Meta MetaMateCR: 리뷰어에게도 보이면 리뷰 시간 +5.5%, 작성자에게만 보이면 변화 없음 Google: 리뷰어 사전 검토가 생기자 목표 정밀도를 50% → 40%로 낮춤 여러 출처에서 반복되는 관찰 (권고가 아니다) 컨텍스트, 에이전트 수, 필터 모두 정밀도와 재현율을 맞바꿨다. 둘 다 안정적으로 올린 선택지는 찾지 못했다. \"더 많은 컨텍스트 = 더 좋음\"은 성립하지 않는 경우가 여러 번 보고되었다. 텍스트 설명(이슈·PR)은 코드 컨텍스트보다 효과가 컸다는 결과가 있다. 다중 에이전트의 이득은 비용 대비 작거나 없다는 결과가 여럿 있다. 반대로 같은 모델의 여러 실행을 합치면(앙상블) 재현율이 크게 올랐다. 실서비스 숫자(해결률·유용률)는 대부분 회사가 직접 재고 각자 정의했다. 이 선택지들을 한 실험에서 함께 잰 연구는 없다. 스스로 판단할 질문 우리 에이전트는 재현율과 정밀도 중 어느 쪽을 잃는 것이 더 비싼가? 관점(버그, 보안, 컨벤션, 기획 충족)마다 답이 다른가? 컨텍스트를 늘릴 때 그 효과를 무엇으로 확인할 것인가? 컨텍스트 유형(PR 설명, 관련 코드, 가이드라인)을 따로 시험할 것인가? 다중 관점 구조의 이득을 \"같은 모델 여러 번 + 병합\"과 비교해 볼 것인가? 검증 단계를 둔다면 그 단계가 버린 것 중 진짜 문제가 몇 개인지 잴 것인가? PR당 코멘트 상한을 둔다면 그 값은 무엇으로 정할 것인가? 사내 코드에서 공개 벤치마크만큼 나올 것이라고 볼 근거가 있는가?(CRBugBench의 사내 저장소 하락) 출처 ContextCRBench — https://arxiv.org/html/2511.07017v1 · AACR-Bench — https://export.arxiv.org/pdf/2601.19494 · SWE-PRBench — https://export.arxiv.org/pdf/2603.26130 Lu 외 (Kuaishou) — https://export.arxiv.org/pdf/2505.17928 · LAURA — https://arxiv.org/html/2512.01356v2 · 콜 그래프 프롬프트 — https://arxiv.org/html/2411.10129v1 RovoDev — https://arxiv.org/pdf/2601.01129 · CRBugBench — https://export.arxiv.org/pdf/2610.13668 SWR-Bench — https://arxiv.org/html/2509.01494v1 · Single Agent — https://export.arxiv.org/pdf/2611.23283 · CodeAgent — https://arxiv.org/html/2402.02172v5 · RevAgent — https://arxiv.org/html/2511.00517 · Hydra-Reviewer — https://conf.researchr.org/details/fse-2026/fse-2026-journal-first/40/Hydra-Reviewer-A-holistic-multi-agent-system-for-automatic-code-review-comment-gener BitsAI-CR — https://arxiv.org/html/2501.15134v1 · CR-Bench — https://arxiv.org/html/2603.11078v1 · Huang 외 — https://arxiv.org/abs/2310.01798 · Reflexion — https://arxiv.org/abs/2303.11366 · TestGen-LLM — https://arxiv.org/abs/2402.09171 IRIS — https://arxiv.org/html/2405.17238v3 · Jaoua 외 — https://arxiv.org/html/2502.06633 · CRScore++ — https://arxiv.org/html/2506.00296v1 · CoRAL — https://arxiv.org/html/2506.04464v1 MetaMateCR — https://arxiv.org/html/2507.13499v1 · Pornprasit 2024 — https://export.arxiv.org/pdf/2402.00905 Agentless — https://arxiv.org/html/2407.01489v2 · SWE-agent — https://arxiv.org/html/2405.15793v3 Google — https://research.google/blog/resolving-code-review-comments-with-ml/ · https://arxiv.org/html/2405.13565v1 Uber — https://www.uber.com/blog/ureview/ · Cursor — https://cursor.com/blog/building-bugbot · GitHub — https://github.blog/ai-and-ml/github-copilot/better-tools-made-copilot-code-review-worse-heres-how-we-actually-improved-it/ · Anthropic — https://claude.com/blog/code-review · OpenAI — https://alignment.openai.com/scaling-code-verification/ Atlassian 범주별 — https://arxiv.org/html/2510.05450v1 "}, {"id": "10", "dir": "10-반론과-한계", "title": "10. 반론과 한계 — 합의에 대한 가장 강한 반대 근거", "level": "균형", "html": "<h1>10. 반론과 한계 — 합의에 대한 가장 강한 반대 근거<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-19<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-20<\/li>\n<li><strong>수준<\/strong>: 균형<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A9-counter-brief.md\">wave-1 A9 반론 레인<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-2-web-W2d-reviewbench-martian-provenance.md\">wave-2 W2d<\/a><\/li>\n<\/ul>\n<h2>이 장의 역할<\/h2>\n<p>01~09장을 읽으면 평가 방식의 \"합의\"가 보인다.<\/p>\n<blockquote>\n<p>정답지(golden set)를 만들고 → LLM matcher로 짝짓고 → precision·recall·Fβ를 계산하고 → LLM 채점관을 사람 라벨로 보정하고 → 실사용에서는 해결률을 잰다. 대기업들은 좋은 숫자를 보고한다.<\/p>\n<\/blockquote>\n<p>이 장은 이 합의의 각 고리를 <strong>반박하거나 복잡하게 만드는<\/strong> 가장 강한 근거만 모았다. 그리고 그 반론에 대한 재반론이 있으면 함께 적었다.<\/p>\n<hr />\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:700px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 780 350\" role=\"img\" aria-label=\"평가 흐름과 반론 지도\" data-minw=\"700\"><title>평가 흐름과 반론 지도<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"780\" height=\"350\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">합의된 평가 흐름의 고리마다 반론이 붙어 있다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">위: 01~09장이 그리는 평가 흐름 · 아래: 그 고리를 흔드는 반론(번호 = 10장 절)<\/text><rect x=\"20\" y=\"70\" width=\"136\" height=\"46\" rx=\"10\" class=\"node-acc\"/><text x=\"88.0\" y=\"98.0\" class=\"t-b\" text-anchor=\"middle\">정답지<\/text><line class=\"arrow\" x1=\"158.0\" y1=\"93.0\" x2=\"161.0\" y2=\"93.0\"/><path class=\"ahead\" d=\"M168.0,93.0L161.0,89.5L161.0,96.5z\"/><line class=\"ref\" x1=\"88.0\" y1=\"118\" x2=\"88.0\" y2=\"140\"/><rect x=\"20\" y=\"140\" width=\"136\" height=\"58\" rx=\"8\" class=\"node-warn\"/><text x=\"30.0\" y=\"157.0\" class=\"t-mut\">반론 1<\/text><text x=\"30.0\" y=\"174.0\" class=\"t-sm\" font-size=\"11.5\">정답지는 불완전하고<\/text><text x=\"30.0\" y=\"190.0\" class=\"t-sm\" font-size=\"11.5\">시끄럽다<\/text><line class=\"ref\" x1=\"88.0\" y1=\"198\" x2=\"88.0\" y2=\"210\"/><rect x=\"20\" y=\"210\" width=\"136\" height=\"58\" rx=\"8\" class=\"node-warn\"/><text x=\"30.0\" y=\"227.0\" class=\"t-mut\">반론 3<\/text><text x=\"30.0\" y=\"244.0\" class=\"t-sm\" font-size=\"11.5\">벤치마크는<\/text><text x=\"30.0\" y=\"260.0\" class=\"t-sm\" font-size=\"11.5\">실력을 부풀린다<\/text><rect x=\"170\" y=\"70\" width=\"136\" height=\"46\" rx=\"10\" class=\"node-acc\"/><text x=\"238.0\" y=\"98.0\" class=\"t-b\" text-anchor=\"middle\">LLM 매칭<\/text><line class=\"arrow\" x1=\"308.0\" y1=\"93.0\" x2=\"311.0\" y2=\"93.0\"/><path class=\"ahead\" d=\"M318.0,93.0L311.0,89.5L311.0,96.5z\"/><line class=\"ref\" x1=\"238.0\" y1=\"118\" x2=\"238.0\" y2=\"140\"/><rect x=\"170\" y=\"140\" width=\"136\" height=\"58\" rx=\"8\" class=\"node-warn\"/><text x=\"180.0\" y=\"157.0\" class=\"t-mut\">반론 2<\/text><text x=\"180.0\" y=\"174.0\" class=\"t-sm\" font-size=\"11.5\">채점관은 코드에서<\/text><text x=\"180.0\" y=\"190.0\" class=\"t-sm\" font-size=\"11.5\">흔들린다<\/text><rect x=\"320\" y=\"70\" width=\"136\" height=\"46\" rx=\"10\" class=\"node-acc\"/><text x=\"388.0\" y=\"98.0\" class=\"t-b\" text-anchor=\"middle\">P · R · Fβ<\/text><line class=\"arrow\" x1=\"458.0\" y1=\"93.0\" x2=\"461.0\" y2=\"93.0\"/><path class=\"ahead\" d=\"M468.0,93.0L461.0,89.5L461.0,96.5z\"/><line class=\"ref\" x1=\"388.0\" y1=\"118\" x2=\"388.0\" y2=\"140\"/><rect x=\"320\" y=\"140\" width=\"136\" height=\"58\" rx=\"8\" class=\"node-warn\"/><text x=\"330.0\" y=\"157.0\" class=\"t-mut\">반론 7<\/text><text x=\"330.0\" y=\"174.0\" class=\"t-sm\" font-size=\"11.5\">결함 말고 다른 가치는<\/text><text x=\"330.0\" y=\"190.0\" class=\"t-sm\" font-size=\"11.5\">안 보인다<\/text><rect x=\"470\" y=\"70\" width=\"136\" height=\"46\" rx=\"10\" class=\"node-acc\"/><text x=\"538.0\" y=\"98.0\" class=\"t-b\" text-anchor=\"middle\">채점관 보정<\/text><line class=\"arrow\" x1=\"608.0\" y1=\"93.0\" x2=\"611.0\" y2=\"93.0\"/><path class=\"ahead\" d=\"M618.0,93.0L611.0,89.5L611.0,96.5z\"/><line class=\"ref\" x1=\"538.0\" y1=\"118\" x2=\"538.0\" y2=\"140\"/><rect x=\"470\" y=\"140\" width=\"136\" height=\"58\" rx=\"8\" class=\"node-warn\"/><text x=\"480.0\" y=\"157.0\" class=\"t-mut\">반론 2<\/text><text x=\"480.0\" y=\"174.0\" class=\"t-sm\" font-size=\"11.5\">소량 라벨로 고쳐도<\/text><text x=\"480.0\" y=\"190.0\" class=\"t-sm\" font-size=\"11.5\">과제마다 다르다<\/text><rect x=\"620\" y=\"70\" width=\"136\" height=\"46\" rx=\"10\" class=\"node-acc\"/><text x=\"688.0\" y=\"98.0\" class=\"t-b\" text-anchor=\"middle\">실사용 해결률<\/text><line class=\"ref\" x1=\"688.0\" y1=\"118\" x2=\"688.0\" y2=\"140\"/><rect x=\"620\" y=\"140\" width=\"136\" height=\"58\" rx=\"8\" class=\"node-warn\"/><text x=\"630.0\" y=\"157.0\" class=\"t-mut\">반론 6<\/text><text x=\"630.0\" y=\"174.0\" class=\"t-sm\" font-size=\"11.5\">쉬운 코멘트가<\/text><text x=\"630.0\" y=\"190.0\" class=\"t-sm\" font-size=\"11.5\">수치를 끌어올린다<\/text><line class=\"ref\" x1=\"688.0\" y1=\"198\" x2=\"688.0\" y2=\"210\"/><rect x=\"620\" y=\"210\" width=\"136\" height=\"58\" rx=\"8\" class=\"node-warn\"/><text x=\"630.0\" y=\"227.0\" class=\"t-mut\">반론 4<\/text><text x=\"630.0\" y=\"244.0\" class=\"t-sm\" font-size=\"11.5\">현장 결과는<\/text><text x=\"630.0\" y=\"260.0\" class=\"t-sm\" font-size=\"11.5\">엇갈린다<\/text><rect x=\"20\" y=\"298\" width=\"740\" height=\"36\" rx=\"8\" class=\"node-warn\"/><text x=\"32.0\" y=\"321.0\" class=\"t-sm\">반론 5  에이전트 자체가 공격 표면 — PR 본문·코멘트의 프롬프트 인젝션이 흐름 전체에 걸린다<\/text><\/svg><\/div><figcaption>그림 10-1. 평가 흐름의 고리마다 붙은 반론 — 번호는 이 장의 절 번호<\/figcaption><\/figure>\n<h2>반론 1. 정답지는 불완전하고 시끄럽다<\/h2>\n<table>\n<thead>\n<tr>\n<th>근거<\/th>\n<th>내용<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bacchelli &amp; Bird 2013 · Czerwonka 2015 · Beller 2014<\/td>\n<td>사람 코멘트의 결함 비율은 14~25%다. 코멘트로 만든 정답지는 대부분 버그가 아니고, 아무도 코멘트하지 않은 버그는 빠진다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Liu 외 2025 \"Too Noisy To Learn\"<\/td>\n<td>CodeReviewer 학습 코멘트 표본의 64%만 유효<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>DeepCRCEval<\/td>\n<td>벤치마크 코멘트 중 고품질 10% 미만<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>AACR-Bench<\/td>\n<td>PR에서 나온 정답은 \"시끄럽고 불완전하다\". LLM 후보 + 전문가 검증으로 결함 범위가 285% 늘었다<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>ReviewBench 방법론 스스로<\/td>\n<td>\"고정된 정답지는 필연적으로 불완전해진다\"<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>Kononenko 2015 · Paul 2021 · Khoshnoud 2022<\/td>\n<td>사람 리뷰를 거친 변경의 54%가 버그를 만들었다(SZZ 기준). 맥락이 필요한 보안 결함은 대부분 리뷰를 빠져나간다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Edmundson 외 2013<\/td>\n<td>개발자 30명이 같은 웹앱을 리뷰했다. 효과가 낮았고 경험과도 상관이 없었다(초록·2차 확인)<\/td>\n<td>A<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>재반론<\/strong>: \"코멘트의 15%\"는 <strong>탐지율이 아니다<\/strong>. 리뷰당 코멘트가 약 4개면 리뷰의 절반쯤에는 결함 지적이 있다는 해석이 있다(Entropic Thoughts, C). Boehm 2003은 리뷰와 페어 프로그래밍을 합치면 결함을 약 60% 더 잡는다고 했다(같은 글이 인용, 2차).<\/p>\n<h2>반론 2. LLM 채점관은 코드에서 믿기 어렵다<\/h2>\n<table>\n<thead>\n<tr>\n<th>근거<\/th>\n<th>내용<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Moon 외 (EACL Findings 2026)<\/td>\n<td>표면 단서에 흔들린다. \"이 코드는 맞다\"는 자기 주장 하나로 정답 판정이 49 → 83%. 오해를 부르는 주석으로 최대 26.7점 하락. \"강건한 모델이 없다\"<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>CodeJudgeBench (ACL 2026)<\/td>\n<td>판정 모델 26개 모두 유의한 무작위성. 순서만 바꿔도 정확도가 크게 변한다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>JudgeBench (ICLR 2025)<\/td>\n<td>GPT-4o 기본 판정 50.86%(동전 던지기 수준)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>CRJudgeBench (프리프린트)<\/td>\n<td>최신 범용 LLM도 \"그럴듯하지만 틀린 리뷰 코멘트\"를 잘 못 가려낸다<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>Chen 외 2025 (프리프린트, 2차)<\/td>\n<td>판정 모델이 자기의 <strong>틀린<\/strong> 답을 선호하고, 강한 모델일수록 더 그렇다<\/td>\n<td>D<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>재반론<\/strong>: LLM 채점은 BLEU보다는 훨씬 낫다. SWR-Bench에서 적중 기반 LLM 판정의 일치도는 사람끼리와 비슷했고, BLEU는 음수였다. CRScore에서도 BLEU ≈ 0, LLM 0.605였다. 보안 리뷰에서 적대적 주석 효과가 유의하지 않았다는 결과도 있다(Thornton 2026, p&gt;0.21).<\/p>\n<h2>반론 3. 벤치마크는 실력을 부풀린다<\/h2>\n<table>\n<thead>\n<tr>\n<th>근거<\/th>\n<th>내용<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SWE-bench Illusion (2025)<\/td>\n<td>이슈 본문만 보고 버그 파일을 맞히는 비율이 SWE-bench Verified 76% vs 다른 저장소 53%. 함수 5-gram 그대로 재현 35% vs 18% → <strong>기억<\/strong>의 흔적<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>Wang, Pradel, Liu (ICSE 2026)<\/td>\n<td>\"해결됨\"으로 친 패치의 7.8%가 전체 테스트에서 실패했다. 그럴듯한 패치의 29.6%는 참조 수정과 다르게 동작했다. 해결률이 6.2%p 부풀려졌다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>OpenAI 2026-02<\/td>\n<td>SWE-bench Verified 평가 중단. 감사한 문항의 59.4%가 결함 있는 테스트였고 오염도 있었다<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>ReviewBench — 출제자가 1위<\/td>\n<td>GitHub이 만든 벤치마크에서 출시 당일 Copilot 1위(40.1%). 경쟁사 결과는 몇 달 전 실행분이었다. 정답의 44%가 <code>ccr<\/code>(Copilot으로 추정) 출처다. held-out이 없고, 공개 세트에서 튜닝하라고 권한다<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>같은 날 다른 보드<\/td>\n<td>Martian online에서 Copilot은 6위, offline 5위<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td>벤더 벤치마크<\/td>\n<td>Greptile 자체 82% vs Augment 재실행 45%<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>METR 2025<\/td>\n<td>벤치마크는 범위가 잘 정해지고 알고리즘으로 채점되는 과제라 능력을 \"과대평가할 수 있다\"<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>재반론<\/strong>: ReviewBench는 방법·데이터·채점관을 모두 공개했고, 생산자 편향을 스스로 경고했다. 특정 생산자를 빼고 채점하는 옵션도 추가했다. 2026-11-19 현재 리더보드 1위는 Copilot이 아니다.<\/p>\n<h2>반론 4. 실제 현장 결과는 엇갈리거나 부정적이다<\/h2>\n<table>\n<thead>\n<tr>\n<th>근거<\/th>\n<th>내용<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Beko (ICSE-SEIP 2025)<\/td>\n<td>AI 리뷰 도입 후 PR 종료 시간 평균 5h52m → <strong>8h20m<\/strong>(p&lt;0.001). 3개 중 1개 프로젝트만 빨라졌다. 보고된 문제: 잘못된 리뷰, 관련 없는 코멘트<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Sun 외 (TSE)<\/td>\n<td>유효한 사람 코멘트 60%가 코드 변경으로 이어졌다. AI 리뷰 액션은 <strong>0.9~19.2%<\/strong><\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Mozilla·Ubisoft<\/td>\n<td>LLM 코멘트 수용 8.1% / 7.2%. 패치당 중앙값 43초 추가<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>CodeRabbit 실사용<\/td>\n<td>수용 36.4%, 거절 56.3%<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>Zhong 외 2026<\/td>\n<td>AI 제안은 사람 제안보다 채택률이 유의하게 낮았다. 채택되지 않은 것의 절반 이상은 틀렸거나 다른 방식으로 고쳐졌다. 채택된 AI 제안은 코드 복잡도를 더 높였다<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>Tufano 외 2025 (ICSE)<\/td>\n<td>LLM 리뷰가 리뷰어의 주의를 붙잡았다(89% 유지). 심각한 이슈는 더 찾지 못했고 시간도 줄지 않았다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Meta MetaMateCR<\/td>\n<td>AI 패치를 리뷰어에게 보이자 리뷰 시간 +5.5%로 철회<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>METR 2025 RCT<\/td>\n<td>숙련 개발자가 AI를 쓰면 19% 느렸고, 본인은 20% 빨라졌다고 믿었다<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>재반론<\/strong>:<\/p>\n<ul>\n<li>Atlassian은 PR 사이클 시간 −31%, Microsoft는 −10~20%를 보고했다. 다만 둘 다 무작위 실험이 아니다.<\/li>\n<li>METR 2026-02 업데이트는 18% 빨라졌다는 추정을 냈다. METR은 이를 \"매우 약한 증거\"라고 하고, 2025년 결과는 역사적 결과로 본다.<\/li>\n<li>Mozilla·Ubisoft에서 수용된 코멘트는 사람 코멘트와 같은 비율로 수정을 이끌었다(74% vs 73%).<\/li>\n<li>Beko 논문 결론부에는 본문과 모순되는 시간 수치(50분 → 48분)가 있다.<\/li>\n<\/ul>\n<h2>반론 5. 리뷰 에이전트 자체가 공격 표면이다<\/h2>\n<table>\n<thead>\n<tr>\n<th>근거<\/th>\n<th>내용<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CSA \"Comment and Control\" (2026-04)<\/td>\n<td>PR 제목·코멘트로 Claude Code Security Review, Gemini CLI Action, Copilot Agent가 시크릿을 유출했다(심각도 9.4). 벤더가 수정함<\/td>\n<td>C<\/td>\n<\/tr>\n<tr>\n<td>arXiv 2603.18740<\/td>\n<td>다듬은 편향 주입으로 CVE 33개 중 32개(97%)를 자동 리뷰에서 숨겼다<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td>SEVRA-BENCH<\/td>\n<td>설득 문구 15종으로 취약 PR 승인을 유도하는 벤치마크(약 1,000 PR)<\/td>\n<td>D<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>재반론<\/strong>: Thornton 2026은 적대적 주석 공격 효과가 유의하지 않았다고 보고했다. 위험은 주로 시크릿을 가진 CI 워크플로에 몰려 있다.<\/p>\n<h2>반론 6. 온라인 지표는 교란된다<\/h2>\n<ul>\n<li><strong>코멘트 유형<\/strong>: 리팩터링·가독성 코멘트가 기능·설계 코멘트보다 3.5배쯤 잘 반영된다(Mozilla·Ubisoft). 쉬운 코멘트가 많으면 해결률이 오른다.<\/li>\n<li><strong>추정치이거나 자기 보고 라벨<\/strong>: Google AutoCommenter의 약 40%는 \"코멘트가 사라짐\" × 40건 수작업 확인으로 낸 추정이다. Beko 73.8%는 개발자가 반드시 눌러야 하는 라벨이다.<\/li>\n<li><strong>양을 같이 봐야 함<\/strong>: GitHub의 addressed rate +8.0%는 코멘트 수 <strong>+61%<\/strong>와 함께 나왔다.<\/li>\n<li><strong>인식과 실제<\/strong>:
