제외 대상은 공개되지 않았다. 되돌림 비율은 나중 PR로 고친 버그를 세지 않는다(발표자 본인 언급). AI 리뷰의 정밀도·반영률 같은 수치는 없다 대기업이 아닌 회사들의 산업 논문 (A등급 포함) 회사 연구 결과 Beko (ICSE-SEIP 2025) Qodo PR-Agent + GPT-4 코멘트 73.8% \"해결\"(개발자가 직접 붙이는 필수 라벨). PR 종료 시간 평균 5h52m → 8h20m로 증가 . 3개 프로젝트 중 1개만 빨라짐 Mozilla·Ubisoft (RevMate, 2024 프리프린트) 리뷰어가 LLM 제안 코멘트를 골라 게시 수용률 8.1% / 7.2%. 리팩터링 제안 약 18% vs 기능 제안 약 5% Ericsson (ICSME 2025 산업) GPT-4 리뷰 전문가 평가 긍정 6, 중립 8, 부정 10 Kuaishou (ICML 2025 Spotlight) 코드 슬라이싱 + 검증기 C++ 장애 45건 오프라인. 핵심 버그 포함률 최고 20~39%, 오경보율 75% 이상. 사용자 연구 없음 회사들의 방식에서 반복해서 보이는 패턴 (관찰, 권고 아님) 생성 뒤에 거르는 단계 : Uber(확신도·병합·억제), ByteDance(필터), Atlassian(실행 가능성·사실성), Anthropic 플러그인(이슈별 검증), Meta MetaMateCR(빌드·테스트 통과만 노출). 잡음 많은 규칙·범주를 끄는 운영 : Google AutoCommenter(URL 22개 억제), Google Tricorder(Not useful 높은 검사기 끔), ByteDance(정밀도·outdated 기준으로 규칙 퇴출). 온라인 실험을 최종 판단으로 : Google(\"오프라인은 대리 지표\"), Meta(\"백테스트와 실서비스가 너무 달랐다\"), GitHub(오프라인 예측을 온라인으로 대조). 누구에게 보여 주나가 결과를 바꾼다 : Meta(리뷰어에게 보이면 리뷰 시간 +5.5%), Google(V2에서 리뷰어 사전 검토로 목표 정밀도를 40%로 낮춤). 자동 승인·자동 머지의 안전 지표로 되돌림 비율을 쓴다 (회사별 단계는 07장 ): Meta RADAR(저위험 diff 자동 승인), xAI Grok Bot(조건부 자동 머지, 약 0.5%). 둘 다 \"위험이 낮은 변경만\"이라는 조건을 붙인다. 되돌림 없이 뒤따른 PR로 고친 버그는 이 지표에 잡히지 않는다. 같은 결과를 두고 방향이 엇갈린다 : PR 시간이 Atlassian은 −31%, Microsoft는 −10~20%, Beko는 +42% (5h52m → 8h20m). 어느 쪽도 무작위 대조 실험이 아니다. 그림 6-2. AI 리뷰 도입 후 PR 시간 변화 — 줄었다는 곳과 늘었다는 곳이 공존한다. 무작위 실험은 Google·Meta 두 곳뿐 스스로 판단할 질문 우리가 볼 온라인 지표는 무엇인가? \"해결\"의 정의는 줄 변경, 작성자 라벨, LLM 판정, 재실행 비교 중 무엇인가? 피드백 버튼을 둔다면, 피드백을 남기는 비율(Google은 약 10%)이 낮을 때 그 값을 어떻게 해석할 것인가? 에이전트 코멘트를 리뷰어에게도 보여 줄 것인가, 작성자에게만 보여 줄 것인가? 잡음 많은 관점·규칙을 끄는 운영 기준(예: 일정 기간 유용 비율)을 둘 것인가? 오프라인 점수 개선이 온라인 개선으로 이어지는지 대조할 방법이 있는가? 회사 블로그 수치를 우리 목표치로 삼아도 되는가? 정의·대조군·자기 보고 여부를 확인했는가? 출처 Google Frömmgen 외 2024 원문 — https://storage.googleapis.com/gweb-research2023-media/pubtools/7525.pdf (A, ok) Google Research 블로그 2023 — https://research.google/blog/resolving-code-review-comments-with-ml/ (B, ok) AutoCommenter — https://arxiv.org/html/2405.13565v1 (A, ok) 전략 블로그 2024 — https://research.google/blog/ai-in-software-engineering-at-google-progress-and-the-path-ahead/ (B, ok) SWE at Google 20장 — https://abseil.io/resources/swe-book/html/ch20.html (B, ok) · CACM 2018 — https://6826.csail.mit.edu/2020/papers/google-analysis-cacm.pdf (A, ok) Meta MetaMateCR — https://arxiv.org/html/2507.13499v1 · RADAR — https://arxiv.org/html/2605.30208 · ARCTIC — https://arxiv.org/html/2607.29516 NudgeBot — https://2022.esec-fse.org/details/fse-2022-research-papers/26/Using-Nudges-to-Accelerate-Code-Reviews-at-Scale · https://engineering.fb.com/2022/11/16/culture/meta-code-review-time-improving/ 리뷰어 추천 — https://arxiv.org/html/2312.17169v2 · TestGen-LLM — https://arxiv.org/abs/2402.09171 Microsoft https://devblogs.microsoft.com/engineering-at-microsoft/enhancing-code-quality-at-scale-with-ai-powered-code-reviews/ (B) · Nudge TOSEM — https://arxiv.org/abs/2011.12468 GitHub https://github.blog/ai-and-ml/github-copilot/60-million-copilot-code-reviews-and-counting/ · https://github.blog/ai-and-ml/github-copilot/better-tools-made-copilot-code-review-worse-heres-how-we-actually-improved-it/ · https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/ · https://docs.github.com/en/copilot/concepts/agents/code-review (B) Atlassian · Uber · ByteDance · Amazon RovoDev — https://arxiv.org/pdf/2601.01129 (A) · 유형별 해결률 — https://arxiv.org/pdf/2510.05450 · https://www.atlassian.com/blog/atlassian-engineering/atlassian-rovo-dev-research-what-types-of-code-review-comments-do-developers-most-frequently-resolve uReview — https://www.uber.com/blog/ureview/ (B) BitsAI-CR — https://arxiv.org/html/2501.15134 (D) CodeGuru 규칙 채굴 — https://amazon.science/publications/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes (A) Amazon Q Developer GitHub 리뷰 문서 — https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/github-code-reviews.html (B, 2026-11-25 추가) AI 연구소·도구 회사 Anthropic — https://claude.com/blog/code-review · https://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-review/commands/code-review.md OpenAI — https://alignment.openai.com/scaling-code-verification/ Cursor — https://cursor.com/blog/building-bugbot · https://cursor.com/blog/bugbot-learning (D) Graphite 발표 — https://www.ai.engineer/talks/TswQeKftnaw-ai-powered-entomology-lessons-from-millions-ai (C, partial) · CodeRabbit — https://coderabbit.ai/blog/framework-for-evaluating-ai-code-review-tools (D) xAI Grok Bot — Lauren Tan 발표 「All Code Is Slop (Except Mine)」 https://ai.engineer/talks/O_zcc6Xl12g-all-code-is-slop-except-mine (C, 발표 정리문) · x.ai 가이드 https://x.ai/bot/guides/grok-bot-for-engineering (D, 제품 안내) · 슬라이드 수치 정리 https://xiaohu.ai/en/article/lauren-tan-agent-code-quality/ (C, 2차 요약) — 2026-11-25 추가 기타 산업 논문 Beko — https://arxiv.org/html/2412.18531v2 (A) · Mozilla·Ubisoft — https://arxiv.org/html/2411.07091v1 (D) · Ericsson — https://arxiv.org/html/2507.19115v2 · Kuaishou — https://arxiv.org/abs/2505.17928 (A) "}, {"id": "07", "dir": "07-빅테크-자동-머지-자세히", "title": "07. 빅테크·대기업 자세히 보기 — 자동 머지는 실제로 어떻게 운영하나", "level": "사례 심화", "html": "<h1>07. 빅테크·대기업 자세히 보기 — 자동 머지는 실제로 어떻게 운영하나<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-25<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-25<\/li>\n<li><strong>수준<\/strong>: 사례 심화<\/li>\n<li><strong>앞 장<\/strong>: <a href=\"#06\">06 빅테크·대기업은 어떻게 만들고 평가하나<\/a>의 회사들 중 <strong>사람 리뷰 없이 머지하는 곳<\/strong>만 골라, 운영 단계를 원문 근거와 함께 하나씩 들여다본다<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261125-misc-auto-merge-cases/INDEX.md\">20261125-misc-auto-merge-cases<\/a> — 회사별 원문을 읽고 뽑은 보고서 7개 (Anthropic·Rewind는 2026-11-25 오후 추가)<\/li>\n<\/ul>\n<h2>먼저 읽을 것<\/h2>\n<ul>\n<li>이 장에서 <strong>자동 머지<\/strong>는 \"사람이 승인 버튼이나 머지 버튼을 누르지 않아도 코드가 메인 브랜치에 들어간다\"는 뜻이다. 사람이 나중에 볼 수 있어도(사후 리뷰) 머지 시점에 사람이 없으면 자동 머지로 본다.<\/li>\n<li>숫자는 <strong>전부 회사가 자기 시스템에 대해 낸 값<\/strong>이다. 무작위 대조 실험은 한 곳도 없다.<\/li>\n<li>회사마다 <strong>\"무엇을 자동 머지하는가\"가 다르다.<\/strong> 기계적인 대량 변경(의존성 버전 올리기 같은 것)만 하는 곳이 있고, 에이전트가 쓴 제품 코드까지 하는 곳이 있다. 숫자를 나란히 놓고 비교하지 말고, <strong>각 회사가 어떤 조건을 걸었는지<\/strong>를 보는 것이 이 장의 목적이다.<\/li>\n<li>06장은 빅테크·대기업이 \"AI 리뷰 코멘트를 어떻게 평가하나\"를 넓게 훑었다. 이 장은 그중 한 주제를 깊게 판다 — \"<strong>사람 리뷰를 빼도 되는 변경을 어떻게 고르고, 단계마다 무엇을 하나<\/strong>\".<\/li>\n<li>출처 등급: A 동료 심사 논문 · B 회사 엔지니어링 블로그·문서 · C 컨퍼런스 발표·발표 정리문 · D 프리프린트·2차 요약·제품 안내.<\/li>\n<\/ul>\n<h2>한눈에<\/h2>\n<table>\n<thead>\n<tr>\n<th>회사<\/th>\n<th>무엇을 자동 머지하나<\/th>\n<th>사람은 어디에 있나<\/th>\n<th>머지 후 안전 지표<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>xAI Grok Bot 팀<\/strong><\/td>\n<td>에이전트가 쓴 제품 코드 중 \"리뷰 확신 높고 영향 범위 작은 것\", 출시 후 퍼징이 찾은 버그 수정<\/td>\n<td>나머지 PR은 사람이 <strong>코드 대신 검증 산출물(영상·스크린샷·형식 검증 결과)<\/strong>을 본다<\/td>\n<td>되돌림(revert) 비율 약 0.5%<\/td>\n<td>C·D<\/td>\n<\/tr>\n<tr>\n<td><strong>Meta RADAR<\/strong><\/td>\n<td>위험 점수가 낮은 변경. 봇이 만든 변경(규칙 기반 코드 변환·AI 코드 변환)과 사람이 쓴 변경 일부<\/td>\n<td>거름망 중 하나라도 걸리면 사람 리뷰로 보낸다. 사람 변경은 \"먼저 배포, 리뷰는 나중\" 경로도 있다<\/td>\n<td>되돌림 비율, 장애(PI) 비율<\/td>\n<td>D<\/td>\n<\/tr>\n<tr>\n<td><strong>Spotify Fleet Management<\/strong><\/td>\n<td>전사 일괄 유지보수 PR(의존성·설정 변경 등). <strong>AI 에이전트(Honk) PR은 대부분 사람이 리뷰<\/strong><\/td>\n<td>저장소 주인 팀은 자동 머지를 끌 수 있다(opt-out). AI PR은 코드 주인이 리뷰<\/td>\n<td>자동 머지된 커밋과 배포 실패의 상관(Firewatch)<\/td>\n<td>B·C<\/td>\n<\/tr>\n<tr>\n<td><strong>Anthropic Claude Code 팀<\/strong><\/td>\n<td>분류기가 LOW로 매긴 변경(문서·문구·사내 전용 기능·플래그 뒤 추가형 변경). 에이전트가 쓴 PR 포함<\/td>\n<td>MEDIUM은 1명, HIGH는 2명 승인. 민감 경로·CI 워크플로 파일은 항상 사람. <strong>AI 승인은 사람 승인으로 치지 않는다<\/strong><\/td>\n<td>되돌림(revert) 비율, 사고 PR을 정답지로 쓴 리뷰어 매일 채점<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td><strong>Rewind<\/strong><\/td>\n<td>자동 <strong>승인<\/strong>(머지 아님). 리뷰가 위험한 것을 못 찾은 LOW 등급 PR. 약 40%<\/td>\n<td>정해진 경로·약 1만 줄 초과·사람 요청이면 사람에게. 머지는 엔지니어가 하거나 GitHub 자동 머지를 켠 경우 GitHub가 한다<\/td>\n<td>봇 승인과 연결된 되돌림·사고 0건, 사람과 일치율<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td><strong>Google 대규모 변경(LSC)<\/strong><\/td>\n<td>자동 머지는 아니다. <strong>리뷰를 한 명의 전사 승인자에게 몰고, 그 사람이 도구로 이상한 것만 골라 본다<\/strong><\/td>\n<td>전사 승인자 + (Chromium) 두 번째 사람<\/td>\n<td>공개 수치 없음<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td><em>비교:<\/em> <strong>Stripe Minions<\/strong><\/td>\n<td>없음<\/td>\n<td>에이전트가 PR까지 만들고 <strong>사람이 반드시 리뷰<\/strong><\/td>\n<td>—<\/td>\n<td>B<\/td>\n<\/tr>\n<tr>\n<td><em>비교:<\/em> <strong>Rootly<\/strong><\/td>\n<td>제안 단계(아직 켜지 않음)<\/td>\n<td>조건 3개를 다 만족할 때만 AI 승인<\/td>\n<td>—<\/td>\n<td>B<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:700px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 330\" role=\"img\" aria-label=\"자동 머지 파이프라인의 공통 골격\" data-minw=\"700\"><title>자동 머지 파이프라인의 공통 골격<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"800\" height=\"330\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">자동 머지 파이프라인의 공통 골격 — 네 회사를 단계별로<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">어느 단계든 실패하면 사람에게 간다. 칸을 얼마나 두껍게 하는지는 회사마다 다르다 (07장)<\/text><rect x=\"94\" y=\"62\" width=\"108\" height=\"38\" rx=\"10\" class=\"node-acc\"/><text x=\"148.0\" y=\"86.0\" class=\"t-b\" text-anchor=\"middle\">대상 고르기<\/text><line class=\"arrow\" x1=\"203.0\" y1=\"81.0\" x2=\"204.0\" y2=\"81.0\"/><path class=\"ahead\" d=\"M209.0,81.0L204.0,78.5L204.0,83.5z\"/><rect x=\"210\" y=\"62\" width=\"108\" height=\"38\" rx=\"10\" class=\"node-acc\"/><text x=\"264.0\" y=\"86.0\" class=\"t-b\" text-anchor=\"middle\">기계 검사<\/text><line class=\"arrow\" x1=\"319.0\" y1=\"81.0\" x2=\"320.0\" y2=\"81.0\"/><path class=\"ahead\" d=\"M325.0,81.0L320.0,78.5L320.0,83.5z\"/><rect x=\"326\" y=\"62\" width=\"108\" height=\"38\" rx=\"10\" class=\"node-acc\"/><text x=\"380.0\" y=\"86.0\" class=\"t-b\" text-anchor=\"middle\">AI 리뷰<\/text><line class=\"arrow\" x1=\"435.0\" y1=\"81.0\" x2=\"436.0\" y2=\"81.0\"/><path class=\"ahead\" d=\"M441.0,81.0L436.0,78.5L436.0,83.5z\"/><rect x=\"442\" y=\"62\" width=\"108\" height=\"38\" rx=\"10\" class=\"node-acc\"/><text x=\"496.0\" y=\"86.0\" class=\"t-b\" text-anchor=\"middle\">머지 판정<\/text><line class=\"arrow\" x1=\"551.0\" y1=\"81.0\" x2=\"552.0\" y2=\"81.0\"/><path class=\"ahead\" d=\"M557.0,81.0L552.0,78.5L552.0,83.5z\"/><rect x=\"558\" y=\"62\" width=\"108\" height=\"38\" rx=\"10\" class=\"node-acc\"/><text x=\"612.0\" y=\"86.0\" class=\"t-b\" text-anchor=\"middle\">머지 후 감시<\/text><line class=\"arrow\" x1=\"667.0\" y1=\"81.0\" x2=\"668.0\" y2=\"81.0\"/><path class=\"ahead\" d=\"M673.0,81.0L668.0,78.5L668.0,83.5z\"/><rect x=\"674\" y=\"62\" width=\"108\" height=\"38\" rx=\"10\" class=\"node-acc\"/><text x=\"728.0\" y=\"86.0\" class=\"t-b\" text-anchor=\"middle\">실수 → 규칙<\/text><text x=\"20.0\" y=\"136.0\" class=\"t-b\">xAI<\/text><rect x=\"94\" y=\"114\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"148.0\" y=\"135.0\" class=\"t-mut\" text-anchor=\"middle\">기준 비공개<\/text><rect x=\"210\" y=\"114\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"264.0\" y=\"135.0\" class=\"t-mut\" text-anchor=\"middle\">린트·앱 실행<\/text><rect x=\"326\" y=\"114\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"380.0\" y=\"135.0\" class=\"t-mut\" text-anchor=\"middle\">AI 리뷰<\/text><rect x=\"442\" y=\"114\" width=\"108\" height=\"34\" rx=\"8\" class=\"node-warn\"/><text x=\"496.0\" y=\"135.0\" class=\"t-mut\" text-anchor=\"middle\">확신·영향 범위<\/text><rect x=\"558\" y=\"114\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"612.0\" y=\"135.0\" class=\"t-mut\" text-anchor=\"middle\">되돌림·퍼징<\/text><rect x=\"674\" y=\"114\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"728.0\" y=\"135.0\" class=\"t-mut\" text-anchor=\"middle\">교정 → 린트<\/text><text x=\"20.0\" y=\"180.0\" class=\"t-b\">Meta<\/text><rect x=\"94\" y=\"158\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"148.0\" y=\"179.0\" class=\"t-mut\" text-anchor=\"middle\">출처·위험 점수<\/text><rect x=\"210\" y=\"158\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"264.0\" y=\"179.0\" class=\"t-mut\" text-anchor=\"middle\">CI·금지 패턴<\/text><rect x=\"326\" y=\"158\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"380.0\" y=\"179.0\" class=\"t-mut\" text-anchor=\"middle\">LLM 8/10 이상<\/text><rect x=\"442\" y=\"158\" width=\"108\" height=\"34\" rx=\"8\" class=\"node-warn\"/><text x=\"496.0\" y=\"179.0\" class=\"t-mut\" text-anchor=\"middle\">세 겹 모두 통과<\/text><rect x=\"558\" y=\"158\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"612.0\" y=\"179.0\" class=\"t-mut\" text-anchor=\"middle\">되돌림·장애<\/text><rect x=\"674\" y=\"158\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"728.0\" y=\"179.0\" class=\"t-mut\" text-anchor=\"middle\">런북 금지 목록<\/text><text x=\"20.0\" y=\"224.0\" class=\"t-b\">Spotify<\/text><rect x=\"94\" y=\"202\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"148.0\" y=\"223.0\" class=\"t-mut\" text-anchor=\"middle\">shift 정의 리뷰<\/text><rect x=\"210\" y=\"202\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"264.0\" y=\"223.0\" class=\"t-mut\" text-anchor=\"middle\">저장소 테스트<\/text><rect x=\"326\" y=\"202\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"380.0\" y=\"223.0\" class=\"t-mut\" text-anchor=\"middle\">AI만: 심판→제거<\/text><rect x=\"442\" y=\"202\" width=\"108\" height=\"34\" rx=\"8\" class=\"node-warn\"/><text x=\"496.0\" y=\"223.0\" class=\"t-mut\" text-anchor=\"middle\">테스트 통과<\/text><rect x=\"558\" y=\"202\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"612.0\" y=\"223.0\" class=\"t-mut\" text-anchor=\"middle\">배포 실패 상관<\/text><rect x=\"674\" y=\"202\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"728.0\" y=\"223.0\" class=\"t-mut\" text-anchor=\"middle\">근무 시간 제한<\/text><text x=\"20.0\" y=\"268.0\" class=\"t-b\">Google<\/text><rect x=\"94\" y=\"246\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"148.0\" y=\"267.0\" class=\"t-mut\" text-anchor=\"middle\">위원회 승인<\/text><rect x=\"210\" y=\"246\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"264.0\" y=\"267.0\" class=\"t-mut\" text-anchor=\"middle\">TAP 열차<\/text><rect x=\"326\" y=\"246\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"380.0\" y=\"267.0\" class=\"t-mut\" text-anchor=\"middle\">없음<\/text><rect x=\"442\" y=\"246\" width=\"108\" height=\"34\" rx=\"8\" class=\"node-warn\"/><text x=\"496.0\" y=\"267.0\" class=\"t-mut\" text-anchor=\"middle\">전사 승인자<\/text><rect x=\"558\" y=\"246\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"612.0\" y=\"267.0\" class=\"t-mut\" text-anchor=\"middle\">조각 되돌리기<\/text><rect x=\"674\" y=\"246\" width=\"108\" height=\"34\" rx=\"8\" class=\"node\"/><text x=\"728.0\" y=\"267.0\" class=\"t-mut\" text-anchor=\"middle\">옛 API 경고<\/text><text x=\"20.0\" y=\"312.0\" class=\"t-mut\">노란 칸 = 사람 없이 머지할지 정하는 지점. Google은 자동 머지가 아니라 리뷰를 한 명에게 몰아 도구로 본다<\/text><\/svg><\/div><figcaption>그림 7-1. 네 회사에서 반복해서 보이는 골격 — 대상 고르기 → 기계 검사 → (AI 리뷰) → 머지 판정 → 머지 후 감시 → 실수를 규칙으로. 어느 칸을 얼마나 두껍게 하는지는 회사마다 다르다<\/figcaption><\/figure>\n<hr />\n<h2>1. xAI Grok Bot 팀 — \"사람은 코드 대신 증거를 본다\"<\/h2>\n<p>Grok Bot 데스크톱 클라이언트(Electron 앱)를 만드는 팀이다. 10월 한 달에 팀 전체(기여자 약 227명)가 PR 약 11,000건을 배포했고, 발표자 Lauren Tan 개인은 약 3,000건이라고 했다. 안정 버전을 거의 매일 낸다.<\/p>\n<h3>단계별로<\/h3>\n<p><strong>① 에이전트가 실수하기 어려운 구조를 먼저 만든다 (Dune 프레임워크)<\/strong><\/p>\n<ul>\n<li>팀이 만든 클라이언트 프레임워크 Dune 안에서만 제품 코드를 쓰게 한다.<\/li>\n<li>잘 쓰려면 요령이 필요한 기능은 아예 막는다. 예: React의 <code>useEffect<\/code>는 제품 코드에서 금지하고, Dune 내부 API에서만 허용한다. 렌더러/메인 프로세스 디렉터리 사이의 import도 막는다.<\/li>\n<li>이유(발표): \"anything that requires nuance to use well often leads to slop\" — 요령이 필요한 것은 에이전트가 엉망으로 쓴다.<\/li>\n<li>낡은 코드도 치운다. 에이전트는 저장소에 있는 기존 코드를 보고 배우기 때문이다.<\/li>\n<\/ul>\n<p><strong>② 커밋마다 기계 검사 (린트·타입·컴파일러·테스트·CI)<\/strong><\/p>\n<ul>\n<li>금지 패턴은 린트 규칙으로 막는다. 린트 에러 메시지는 \"근본 원인을 고치라\"고 에이전트에게 말하도록 쓴다.<\/li>\n<li>코드 주석의 약 99%를 금지했다. 주석은 낡고, 강제할 방법이 없기 때문이다(슬라이드: 7월 31일 65,824개 → 1,227개, 2차 요약 기준).<\/li>\n<\/ul>\n<p><strong>③ 에이전트가 앱을 직접 실행해 확인한다 (런타임 검증)<\/strong><\/p>\n<ul>\n<li>에이전트가 Chrome DevTools Protocol로 앱을 띄우고 조작한다. \"기능 지도(feature map)\"로 어떤 화면이 어디 있는지 안다.<\/li>\n<li>예: 설정 화면 클릭 → 스냅샷 → <code>proof.png<\/code>로 스크린샷 저장.<\/li>\n<\/ul>\n<p><strong>④ 일부는 형식 검증·속성 기반 UI 테스트까지<\/strong><\/p>\n<ul>\n<li>TLA+로 기기 간 알림 흐름을 모델 검사, Lean으로 가상화 라이브러리 증명, Bombadil로 무작위 UI 탐색.<\/li>\n<li>발표자도 \"silver bullet이 아니고 실험 중\"이라고 했다.<\/li>\n<\/ul>\n<p><strong>⑤ AI 리뷰<\/strong> <em>(x.ai 가이드에만 나옴, 발표에는 없음)<\/em><\/p>\n<ul>\n<li>작업이 \"리뷰 준비\" 상태가 되면 AI 코드 리뷰를 자동으로 돌린다. 보안 지적·CI 실패·충돌을 30분마다 확인한다.<\/li>\n<\/ul>\n<p><strong>⑥ 머지 판정<\/strong><\/p>\n<ul>\n<li>가이드에 적힌 유일한 기준: <strong>\"If the review is highly confident and the blast radius is low, the PR is merged automatically. Otherwise, I'll review the code and the proof.\"<\/strong> — 리뷰 확신이 높고 영향 범위가 작으면 자동 머지, 아니면 사람이 코드와 증거를 본다.<\/li>\n<li>\"확신이 높다\", \"영향 범위가 작다\"의 기준값은 공개되지 않았다.<\/li>\n<li>발표: 제품 코드 대부분은 이제 \"deep human review\"가 필요 없다.<\/li>\n<\/ul>\n<p><strong>⑦ 사람이 보는 것 = 검증 산출물<\/strong><\/p>\n<ul>\n<li>발표: \"our code review process has now really shrunk into looking at verification artifacts instead.\" — 코드 리뷰가 검증 산출물(영상·스크린샷·다이어그램·형식 검증 결과)을 보는 일로 줄었다.<\/li>\n<li>발표자가 동료 PR을 리뷰하는 양이 2024년 3건 → 지금 약 300건(시간 단위는 말하지 않음).<\/li>\n<\/ul>\n<p><strong>⑧ 출시 후 퍼징 → 수정 PR 자동 머지 (바깥 고리)<\/strong><\/p>\n<ul>\n<li>출시 버전을 자를 때마다 에이전트가 앱을 무작위로 두드려 버그를 찾는다. 찾은 버그마다 수정 PR을 열고 <strong>자동으로 머지<\/strong>한다. 수정 PR도 ①~③의 제약과 검증을 그대로 받는다.<\/li>\n<li>슬라이드 예: 한 번 돌렸더니 서로 다른 버그 50개(새 버그 3, 기존 버그 47).<\/li>\n<\/ul>\n<p><strong>⑨ 실수를 규칙으로 바꾼다<\/strong><\/p>\n<ul>\n<li>\"every time we correct our agents, it turns into one of these deterministic checks.\" — 에이전트를 고쳐 줄 때마다 그것을 기계 검사로 만든다.<\/li>\n<li>순서: 린트 규칙으로 새로 생기는 것을 막는다 → 에이전트가 따라 할 옛 예시를 치운다 → 검증을 붙인다 → 자동화한다.<\/li>\n<li>문서(프롬프트·플레이북)로 고치는 것은 가장 약한 방법으로 본다.<\/li>\n<\/ul>\n<h3>숫자와 그 정의<\/h3>\n<table>\n<thead>\n<tr>\n<th>숫자<\/th>\n<th>정의<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>약 11,000 PR/월<\/td>\n<td>팀 전체, 10월, 프로덕션 배포 기준<\/td>\n<td>발표<\/td>\n<\/tr>\n<tr>\n<td>약 3,000 PR/월<\/td>\n<td>발표자 개인. 3월 68 → 10월 3,127로 늘어남<\/td>\n<td>발표, 슬라이드(2차 요약)<\/td>\n<\/tr>\n<tr>\n<td>약 0.5%<\/td>\n<td>되돌림 비율 = 머지했다가 통째로 되돌린 PR의 비율. <strong>나중 PR로 고친 버그는 세지 않는다<\/strong>(발표자 언급)<\/td>\n<td>발표<\/td>\n<\/tr>\n<tr>\n<td>약 70%<\/td>\n<td>토큰의 대부분을 검증에 쓴다는 예(Cindy Sridharan의 수치를 인용)<\/td>\n<td>발표<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>주의할 점<\/h3>\n<ul>\n<li>대조 실험이 아니다(발표 페이지가 직접 밝힘). PR 크기·종류별 내역이 없다.<\/li>\n<li><strong>어떤 변경이 여전히 사람을 거쳐야 하는지 목록이 없다.<\/strong> 검증 산출물을 누가 검증하는지도 열려 있다.<\/li>\n<li>흔히 \"한 명이 월 1만 건 자동 머지\"로 퍼졌지만, 1.1만은 팀 전체이고 자동 머지는 조건부다.<\/li>\n<li>x.ai 가이드는 Lingxi Li라는 다른 엔지니어의 봇 운영기다. 발표(Lauren Tan)와 같은 팀이지만 같은 파이프라인이라는 보장은 없다.<\/li>\n<\/ul>\n<h3>공부 자료<\/h3>\n<ul>\n<li>🎥 <a href=\"https://www.youtube.com/watch?v=O_zcc6Xl12g\">Lauren Tan 「All Code Is Slop (Except Mine)」 YouTube<\/a> (약 17분) — 5:00 Dune · 6:56 타이머 사례 · 9:40 앱 실행 검증 · 11:51 검증 토큰 · 13:32 11,000 PR · 15:11 출시<\/li>\n<li>📄 <a href=\"https://ai.engineer/talks/O_zcc6Xl12g-all-code-is-slop-except-mine\">발표 정리문(ai.engineer)<\/a> · <a href=\"https://ai.engineer/code/2026/talks/lauren-tan\">행사 페이지·전사<\/a><\/li>\n<li>📄 <a href=\"https://x.ai/bot/guides/grok-bot-for-engineering\">x.ai 「Grok Bot for Engineering」 가이드<\/a> — 자동 머지 기준 문장이 여기 있다<\/li>\n<li>📄 2차 요약: <a href=\"https://xiaohu.ai/en/article/lauren-tan-agent-code-quality/\">XiaoHu.AI (슬라이드 수치)<\/a> · <a href=\"https://paulkuo.tw/en/articles/agent-mistakes-into-checks/\">Paul Kuo (한계 정리)<\/a><\/li>\n<\/ul>\n<hr />\n<h2>2. Meta RADAR — \"위험 점수로 고르고, 하나라도 걸리면 사람에게\"<\/h2>\n<p>RADAR(Risk Aware Diff Auto Review)는 Meta의 저위험 변경 자동 리뷰 시스템이다. 53.5만 건 넘게 자동 리뷰했고 그중 33.1만 건 넘게 머지됐다(최대 하루 약 2.5만 건).<\/p>\n<h3>단계별로<\/h3>\n<p><strong>① 누가 만든 변경인지 나눈다<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>출처<\/th>\n<th>처리<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>규칙 기반 코드 변환(codemod) — 사람이 짠 변환 스크립트가 만든 변경<\/td>\n<td>스크립트 자체를 이미 검증했으므로 <strong>건별 AI 리뷰 없이 일괄 승인<\/strong><\/td>\n<\/tr>\n<tr>\n<td>AI 코드 변환 — LLM이 만든 codemod 변경<\/td>\n<td>건별로 ②~⑤를 모두 통과해야 승인<\/td>\n<\/tr>\n<tr>\n<td>RACER 런북 — AI 에이전트에 맡긴 정형 작업(죽은 코드 제거, 린트 수정 등)<\/td>\n<td>런북마다 자격 심사 후 ②~⑤<\/td>\n<\/tr>\n<tr>\n<td>사람이 쓴 변경<\/td>\n<td>별도 경로(⑦)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>② 출처 단위 자격 심사 (RACER 런북 예)<\/strong><\/p>\n<ul>\n<li>최근 60일 기록: 장애 0건, 되돌림·사람 거절 비율 낮음, 최소 머지 건수 충족.<\/li>\n<li>런북별 하루 상한(신뢰가 쌓이면 최대 2,000건).<\/li>\n<li>금지 목록: 장애를 낸 적 있거나 민감 영역을 건드리는 런북. 이름에 \"test\"가 들어간 런북도 제외.<\/li>\n<\/ul>\n<p><strong>③ 고정 규칙 거름망<\/strong><\/p>\n<ul>\n<li>오픈소스 코드, SOX(회계 규제) 대상 코드, 추가 리뷰가 필요한 코드는 제외.<\/li>\n<li>사람 변경은 여기에 더해: 작업 중(WIP)·RFC·이전에 거절된 변경 제외, 최신 버전만, CI 상태 정상, 금지 문구·금지 파일 패턴 없음.<\/li>\n<\/ul>\n<p><strong>④ 위험 점수 (Diff Risk Score, DRS)<\/strong><\/p>\n<ul>\n<li>머신러닝 모델이 \"이 변경이 장애를 낼 가능성\"을 점수로 낸다. \"변경의 10%만 표시해서 장애 원인 변경의 60%를 잡는\" 식으로, 재현율을 높이도록 맞췄다.<\/li>\n<li>기준은 백분위: <strong>P5<\/strong>면 가장 안전한 5%만 통과. 사람 변경 P5, 봇 변경 P20, 신뢰 런북 P50.<\/li>\n<li>모델에 어떤 특징을 넣었는지는 공개되지 않았다.<\/li>\n<\/ul>\n<p><strong>⑤ LLM 리뷰 (Automated Code Review, ACR)<\/strong><\/p>\n<ul>\n<li>변경 하나하나를 \"안전 신호\"와 \"위험 신호\"로 분류한다.<ul>\n<li>안전: 동작이 바뀌지 않는 리팩터링, 죽은 코드 제거, 방어 코드 추가, 로그, 포맷, 문서, import 정리, 테스트.<\/li>\n<li>위험: 복잡도 4 이상, 큰 구조 변경, 버그·논리 오류, 성능 위험, 보안(비밀 노출·SQL 주입·인증 우회).<\/li>\n<\/ul>\n<\/li>\n<li>통과 조건: <strong>확신도 10점 중 8점 이상 + 모든 변경이 안전 범주<\/strong>. 위험 신호가 하나라도 있으면 탈락.<\/li>\n<\/ul>\n<p><strong>⑥ 판정과 머지<\/strong><\/p>\n<ul>\n<li>봇 변경: 거름망 세 겹(③④⑤)을 모두 통과하면 <strong>사람 리뷰 없이<\/strong> 머지한다. 머지 전에 정해진 대기 시간이 있어서 그동안 사람이 거절할 수 있다.<\/li>\n<li>논문 그림 3: \"Failure at any stage routes the diff to human review.\" — 어느 단계든 실패하면 사람 리뷰로 간다.<\/li>\n<\/ul>\n<p><strong>⑦ 사람이 쓴 변경의 두 경로<\/strong><\/p>\n<ul>\n<li><strong>Verification(검증)<\/strong>: 통과하면 작성자가 <strong>먼저 배포하고 리뷰는 나중에<\/strong> 받는다.<\/li>\n<li><strong>Approval(승인)<\/strong>: 더 엄격한 기준을 통과하면 사후 리뷰도 필요 없다.<\/li>\n<\/ul>\n<h3>숫자와 그 정의<\/h3>\n<table>\n<thead>\n<tr>\n<th>숫자<\/th>\n<th>정의<\/th>\n<th>주의<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>535K+ / 331K+<\/td>\n<td>자동 리뷰한 변경 / 그중 머지된 변경<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>되돌림 약 1/3<\/td>\n<td>RADAR 변경의 되돌림 비율이 RADAR 밖 변경의 약 1/3<\/td>\n<td>HTML 표기가 깨져 있다. 해설 글의 \"1/13\"은 오독으로 보인다. PDF 확인 필요<\/td>\n<\/tr>\n<tr>\n<td>장애 약 1/50<\/td>\n<td>RADAR 변경의 장애(PI) 비율이 RADAR 밖 변경의 약 1/50<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>60.31%<\/td>\n<td>위험 점수 기준을 P25 → P50으로 넓힌 뒤 승인 비율<\/td>\n<td>전후 비교만 했다<\/td>\n<\/tr>\n<tr>\n<td>리뷰 소요 −35%<\/td>\n<td>변경 리뷰 시간 중앙값<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>주의할 점<\/h3>\n<ul>\n<li><strong>선택 편향<\/strong>: RADAR는 애초에 위험이 낮은 변경만 고른다. 그러니 되돌림·장애 비율이 낮은 것은 \"자동화가 안전해서\"인지 \"안전한 것만 골라서\"인지 가를 수 없다. 해설 글도 인과가 아니라 연관이라고 정리한다.<\/li>\n<li>무작위 배정이 없다. 기준 완화(P25 → P50)는 전후 관찰 비교뿐이다.<\/li>\n<li>비판 글 「Approval Drift」(Substack, 2026-11): 안전한 25% → 안전한 50%로 문을 넓히면서 안전성 전후 비교를 내놓지 않았다고 지적한다. 논문 초록은 \"전후 관찰 비교를 했다\"고 적어 서로 엇갈린다. 4.2절 원문을 확인해야 한다.<\/li>\n<li>이 장의 일부 세부(3~6절)는 원문이 잘려 요약으로만 확인했다. 근거 원장에 \"(summary)\"로 표시했다.<\/li>\n<\/ul>\n<h3>공부 자료<\/h3>\n<ul>\n<li>📄 <a href=\"https://arxiv.org/html/2605.30208v1\">논문 「Automating Low-Risk Code Review at Meta: RADAR, Risk Calibration, and Review Efficiency」 arXiv 2605.30208<\/a> — 2.3절(위험 점수) · 2.4절(LLM 리뷰) · 2.7~2.9절(경로별 규칙) · 그림 3(전체 흐름)<\/li>\n<li>📄 <a href=\"https://terencecho.github.io/research-explained/radar/\">초보자용 해설<\/a> — 단, \"1/13\", \"승인율 25%\"는 오독<\/li>\n<li>📄 <a href=\"https://abovethemodel.substack.com/p/approval-drift-when-ai-moves-faster\">비판: Approval Drift<\/a><\/li>\n<\/ul>\n<hr />\n<h2>3. Spotify — \"기계적 변경은 자동 머지, AI 변경은 아직 사람\"<\/h2>\n<p>Spotify는 두 가지를 구분해서 봐야 한다.<\/p>\n<ul>\n<li><strong>Fleet Management<\/strong>: 수천 개 저장소에 같은 변경을 일괄로 넣는 체계. 2023년부터 운영했고, 자동 유지보수 PR <strong>250만 건 이상<\/strong>을 머지했으며 \"대부분 사람 없이 자동 머지\"됐다.<\/li>\n<li><strong>Honk<\/strong>: 같은 체계 위에 AI 에이전트(Claude Agent SDK)를 얹은 것. 머지된 에이전트 PR은 2025년 11월 기준 1,500건 이상이다. <strong>AI PR의 자동 머지는 아직 열린 질문<\/strong>이다.<\/li>\n<\/ul>\n<h3>단계별로 — Fleet Management (규칙 기반 변경)<\/h3>\n<p><strong>① 변경을 코드로 정의한다 (Fleetshift)<\/strong><\/p>\n<ul>\n<li>변경 하나(\"shift\")는 코드를 고치는 Docker 이미지다(sed·OpenRewrite·Scalafix 등).<\/li>\n<li>shift 정의는 YAML로 GitHub에 둔다. <strong>shift를 시작하거나 바꾸는 것 자체가 PR과 리뷰를 거친다.<\/strong> 개별 PR이 아니라 \"변경 규칙\"을 사람이 리뷰하는 구조다.<\/li>\n<\/ul>\n<p><strong>② 대상을 고른다<\/strong><\/p>\n<ul>\n<li>GitHub 검색이나 BigQuery(전 소스코드를 매일 적재)로 대상 저장소를 뽑는다.<\/li>\n<\/ul>\n<p><strong>③ 실행 → PR<\/strong><\/p>\n<ul>\n<li>Kubernetes 작업이 저장소를 복제하고, 이미지를 돌리고, 커밋하고, PR을 연다.<\/li>\n<\/ul>\n<p><strong>④ 자동 머지 조건<\/strong><\/p>\n<ul>\n<li>자동 머지 여부는 <strong>변경을 만든 쪽이 정한다<\/strong>(저장소 주인이 아니라). 조건은 \"모든 테스트와 검사 통과\".<\/li>\n<li><strong>저장소 주인 팀의 근무 시간에만<\/strong> 머지한다. 주말·휴일에는 하지 않고, 머지 속도도 조절한다.<\/li>\n<li>저장소 주인은 끌 수 있다(opt-out). 끄려면 사유를 적고, 가능하면 만료일도 둔다. 2023년 기준 수천 개 중 약 50개만 껐다.<\/li>\n<li>컴포넌트마다 \"자동 머지할 만큼 테스트·헬스체크가 있는가\"를 점수(Soundcheck)로 관리한다.<\/li>\n<\/ul>\n<p><strong>⑤ 조금씩 넓힌다 (코호트)<\/strong><\/p>\n<ul>\n<li>처음에는 중요도가 낮은 저장소부터 켰다.<\/li>\n<li>저장소를 묶음(코호트)으로 나눠, 앞 묶음에서 배포 성공이 기준 이상이어야 다음 묶음에 넣는다.<\/li>\n<\/ul>\n<p><strong>⑥ 머지 후 감시 (Firewatch)<\/strong><\/p>\n<ul>\n<li>배포·파이프라인 이벤트를 모아, 자동 머지된 커밋이 배포 실패와 너무 자주 겹치면 주인 팀에 알린다. 문제가 생기면 코호트 진행을 멈춘다.<\/li>\n<\/ul>\n<h3>단계별로 — Honk (AI 에이전트 변경)<\/h3>\n<p><strong>① 사람이 쓰던 변환 스크립트 자리에 에이전트를 넣는다<\/strong><\/p>\n<ul>\n<li>대상 선정·PR 생성·머지는 Fleetshift가 그대로 맡고, 코드 수정만 에이전트가 한다.<\/li>\n<li>에이전트 도구는 일부러 적게 준다: <code>verify<\/code> 도구 하나, 제한된 Git, 허용 목록 안의 Bash만. 코드 검색·문서 도구는 주지 않는다.<\/li>\n<li>프롬프트 원칙: 끝 상태를 정의하라(가능하면 테스트로), 한 번에 하나만 바꿔라.<\/li>\n<\/ul>\n<p><strong>② 검증 세 겹<\/strong><\/p>\n<ol>\n<li><strong>결정적 검증기<\/strong>: 저장소 내용에 따라 자동으로 붙는 포맷터·린터·테스트. 에이전트는 어떤 빌드 시스템이 도는지 모르고 <code>verify<\/code>만 부른다. <strong>하나라도 실패하면 PR을 열지 않는다.<\/strong><\/li>\n<li><strong>LLM 심판<\/strong>: 변경과 원래 지시를 보고 \"시킨 것만 했나\"(멋대로 리팩터링하거나 불안정한 테스트를 꺼 버리지 않았나)를 본다. 세션의 약 1/4을 거부했고, 그중 절반은 에이전트가 스스로 고쳤다. <strong>2026년 발표에서는 결국 LLM 심판을 뺐다고<\/strong> 했다.<\/li>\n<li><strong>CI 검증 서비스(2026)<\/strong>: 브랜치를 올려 여러 CI를 돌리고, 실패를 요약해 에이전트에게 돌려준다. CI를 통과해야 PR을 만든다.<\/li>\n<\/ol>\n<p><strong>③ 머지<\/strong><\/p>\n<ul>\n<li>PR은 코드 주인에게 리뷰를 보낸다. 발표: \"In some cases... we can even auto-merge\", 그러나 \"The question is which? This is a hard question, and it's not fully answered.\"<\/li>\n<li>데이터셋 이전(Part 4)에서는 테스트가 거의 없는 저장소라 주인 팀이 직접 확인한 뒤 머지했다.<\/li>\n<\/ul>\n<h3>숫자와 그 정의<\/h3>\n<table>\n<thead>\n<tr>\n<th>숫자<\/th>\n<th>정의<\/th>\n<th>출처<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>250만+<\/td>\n<td>Fleet Management로 머지된 자동 유지보수 PR 누적. \"대부분 사람 없이 자동 머지\"<\/td>\n<td>2026 블로그<\/td>\n<\/tr>\n<tr>\n<td>27만 건 중 77% 자동 머지, 11% 사람 머지<\/td>\n<td>2022년 Fleetshift가 만든 PR<\/td>\n<td>2023 블로그<\/td>\n<\/tr>\n<tr>\n<td>Spotify 전체 PR의 약 절반<\/td>\n<td>2024년 중반 이후 Fleet Management가 만든 PR 비중(AI 한정 아님)<\/td>\n<td>Honk Part 1<\/td>\n<\/tr>\n<tr>\n<td>1,500+<\/td>\n<td>머지된 Honk(AI) PR 누적, 2025-11<\/td>\n<td>Honk Part 1<\/td>\n<\/tr>\n<tr>\n<td>약 1/4<\/td>\n<td>LLM 심판이 거부한 에이전트 세션 비율<\/td>\n<td>Honk Part 3<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>주의할 점<\/h3>\n<ul>\n<li><strong>자동 머지 250만 건은 대부분 규칙 기반 변경이다.<\/strong> AI가 만든 PR을 얼마나 자동 머지하는지는 공개되지 않았다.<\/li>\n<li>2026년에 자동 의존성 업그레이드가 \"검사를 다 통과했는데 프로덕션에서 실패\"한 사고가 있었다. 대응으로 안전장치 강화, 되돌리기 용량 확대, 주인 팀 근무 시간 안에만 자동 변경을 넣도록 했다.<\/li>\n<\/ul>\n<h3>공부 자료<\/h3>\n<ul>\n<li>📄 <a href=\"https://engineering.atspotify.com/2023/04/spotifys-shift-to-a-fleet-first-mindset-part-1\">Fleet Management Part 1: fleet-first 사고방식 (2023)<\/a> · <a href=\"https://engineering.atspotify.com/2023/05/fleet-management-at-spotify-part-3-fleet-wide-refactoring/\">Part 3: 전사 일괄 리팩터링 — 자동 머지 규칙<\/a> ← <strong>자동 머지 조건은 여기가 핵심<\/strong><\/li>\n<li>📄 Honk 연재: <a href=\"https://engineering.atspotify.com/2025/11/spotifys-background-coding-agent-part-1\">Part 1 (1,500+ PR)<\/a> · <a href=\"https://engineering.atspotify.com/2025/11/context-engineering-background-coding-agents-part-2\">Part 2 컨텍스트<\/a> · <a href=\"https://engineering.atspotify.com/2025/12/feedback-loops-background-coding-agents-part-3\">Part 3 피드백 고리 — 검증기·LLM 심판<\/a> · <a href=\"https://engineering.atspotify.com/2026/4/background-coding-agents-dataset-migrations-honk-part-4\">Part 4 데이터셋 이전<\/a><\/li>\n<li>📄 <a href=\"https://engineering.atspotify.com/2026/9/ai-changed-how-spotify-builds-what-we-learned-and-fixed-about-quality-at-higher-velocity\">속도가 빨라진 뒤 품질 문제와 대응 (2026-09)<\/a> · <a href=\"https://infoq.com/news/2026/10/spotify-ai-quality-controls\">InfoQ 기사<\/a><\/li>\n<li>🎥 <a href=\"https://www.infoq.com/presentations/spotify-ai-codebase-migration-agent/\">InfoQ 발표 「Rewriting All of Spotify's Code Base, All the Time」<\/a> (44분) — LLM 심판을 뺀 이유, 자동 머지가 열린 질문인 이유<\/li>\n<li>🎥 <a href=\"https://claude.com/code-with-claude/session/ldn-coding-is-no-longer-the-constraint-scaling-devex-to-teams-and-agents-at-spotify\">Code with Claude 세션 「Coding is no longer the constraint」<\/a> · <a href=\"https://engineering.atspotify.com/2026/6/code-with-claude-coding-is-no-longer-the-constraint\">블로그판<\/a><\/li>\n<\/ul>\n<hr />\n<h2>4. Google 대규모 변경(LSC) — \"리뷰를 없애지 않고, 한 명에게 몰아 도구로 본다\"<\/h2>\n<p>AI 이전부터 있던 체계다. 하나의 API를 바꾸느라 수천 개 파일을 고쳐야 할 때 쓴다. 엄밀히는 자동 머지가 아니지만, <strong>\"사람 리뷰 부담을 구조적으로 줄이는 방법\"의 원형<\/strong>이라 같이 본다.<\/p>\n<h3>단계별로<\/h3>\n<p><strong>① 승인 (위원회)<\/strong><\/p>\n<ul>\n<li>짧은 문서(이유, 예상 영향, FAQ)를 써서 약 12명으로 된 위원회 메일링에 올린다. 바뀌는 API 주인의 검토도 받는다.<\/li>\n<li>위원회의 흔한 결정: <strong>\"이 LSC의 리뷰는 전부 한 명의 전사 승인자(global approver)에게 보내라.\"<\/strong><\/li>\n<\/ul>\n<p><strong>② 변경 생성 (도구)<\/strong><\/p>\n<ul>\n<li>\"LSCs at Google are almost always generated using automated tooling.\" ClangMR, Refaster 같은 컴파일러 기반 도구로 만든다.<\/li>\n<li>생성기는 다시 돌릴 수 있어야 한다. 그사이 누군가 옛 방식으로 다시 쓰면 재실행으로 흡수한다.<\/li>\n<\/ul>\n<p><strong>③ 쪼개기 (Rosie)<\/strong><\/p>\n<ul>\n<li>Rosie가 큰 변경을 프로젝트 경계와 소유 규칙에 따라 따로 제출 가능한 조각(shard)으로 나눈다. 조각마다 테스트 → 리뷰 메일 → 제출 파이프라인을 따로 탄다.<\/li>\n<\/ul>\n<p><strong>④ 테스트 (TAP 열차)<\/strong><\/p>\n<ul>\n<li>3시간마다 출발하는 \"열차\": 변경마다 무작위 테스트 1,000개 → 통과한 것들을 하나로 묶음 → 영향받는 테스트 전체 실행(6시간 넘게 걸리기도 함) → 실패하면 범인 변경 찾기 → 변경별 보고서. 이 보고서가 \"제출해도 안전하다\"는 증거가 된다.<\/li>\n<li>최근 불안정한(flaky) 테스트는 자동 제출 판단에서 무시한다(요약 기준).<\/li>\n<\/ul>\n<p><strong>⑤ 리뷰<\/strong><\/p>\n<ul>\n<li>원칙: \"all changes need to be reviewed before submission, and this policy applies even for LSCs.\" — LSC도 리뷰는 한다.<\/li>\n<li>이유: \"for most mechanical LSCs, it's cheaper to have a single expert understand the nature of the change and build automation around reviewing it properly.\"<\/li>\n<li>전사 승인자는 패턴 기반 도구로 조각을 훑고, <strong>병합 충돌이나 도구 오작동으로 이상해진 일부만<\/strong> 직접 본다(요약 기준).<\/li>\n<li>Chromium 판: 요청자에게 임시 전사 승인 권한을 주지만, <strong>\"Each CL will still need a second human to review it\"<\/strong> — 동료 한 명이 훑어보고 일괄 +1. 끝나면 권한을 회수한다.<\/li>\n<\/ul>\n<p><strong>⑥ 정리<\/strong><\/p>\n<ul>\n<li>조각은 \"가축(cattle)\"처럼 다룬다. 이름 없는 커밋이라 되돌리거나 버려도 도구로 다시 만들면 된다.<\/li>\n<li>옛 API를 새로 쓰면 리뷰 시점에 경고(Tricorder)를 띄워 되돌아가는 것을 막는다.<\/li>\n<\/ul>\n<h3>AI가 끼어든 뒤 (Google Research 블로그, 2024)<\/h3>\n<ul>\n<li>같은 흐름에서 \"변경 생성\" 칸을 사내 코드로 미세조정한 Gemini가 맡았다.<\/li>\n<li>생성된 변경은 컴파일·단위 테스트로 검증하고, 통과한 것만 엔지니어에게 보여 준다. 엔지니어가 빠르게 확인·수정한 뒤 <strong>조각으로 나눠 각 영역 주인에게 리뷰를 보낸다.<\/strong> 사람 리뷰는 그대로다.<\/li>\n<li>수치: 머지된 변경의 80%가 AI 작성(단위 미정의, 한 작업 사례), 총 시간 약 50% 감소(엔지니어 자기 추정).<\/li>\n<\/ul>\n<h3>2026년 Google Cloud CTO실 글 — 반대 방향의 신호<\/h3>\n<ul>\n<li>\"The bottleneck didn't disappear. It moved from the code to the people reviewing it.\" — 병목은 사라지지 않고 리뷰하는 사람에게 옮겨 갔다.<\/li>\n<li>사람 리뷰는 유지하되 PR마다 AI 요약·위험 평가를 붙이고, 테스트 통과를 조건으로 미리 승인하는 \"조건부 LGTM\"을 쓴다.<\/li>\n<li>승인 피로 경고: \"developers start clicking 'Approve' reflexively.\"<\/li>\n<li>한 팀의 경험담이지 Google 전체 정책은 아니다.<\/li>\n<\/ul>\n<h3>주의할 점<\/h3>\n<ul>\n<li>SWE at Google 책은 2018~2020년경 관행이다. 지금은 바뀌었을 수 있다.<\/li>\n<li>책 22장 후반부(리뷰 세부, 되돌리기, 불안정 테스트)는 원문이 잘려 요약으로만 확인했다.<\/li>\n<li>LSC의 리뷰 시간·결함률 수치는 공개되지 않았다.<\/li>\n<\/ul>\n<h3>공부 자료<\/h3>\n<ul>\n<li>📄 <a href=\"https://abseil.io/resources/swe-book/html/ch22.html\">Software Engineering at Google 22장 Large-Scale Changes<\/a> — 「Authorization」 · 「Sharding and Submitting」 · 「Riding the TAP Train」 · 「Code Review」 절<\/li>\n<li>📄 <a href=\"https://chromium.googlesource.com/chromium/src/+/HEAD/docs/process/lsc/large_scale_changes.md\">Chrome Large Scale Changes<\/a> — 짧고 절차가 구체적이다<\/li>\n<li>📄 <a href=\"https://research.google/blog/accelerating-code-migrations-with-ai/\">Google Research: Accelerating code migrations with AI<\/a><\/li>\n<li>📄 <a href=\"https://cloud.google.com/transform/when-ai-writes-the-code-who-reviews-it-cto-google-cloud\">Google Cloud: When AI writes the code, who reviews it?<\/a><\/li>\n<\/ul>\n<hr />\n<h2>5. Anthropic Claude Code 팀 — \"AI 리뷰는 모든 PR에, 사람 리뷰는 위험할 때만\"<\/h2>\n<p>Claude Code(CLI 도구)를 만드는 팀의 운영기다(Osmani 외 2026). 이 팀 코드의 약 90%를 Claude가 쓴다. 글은 <strong>팀 하나의 사례<\/strong>이고 Anthropic 회사 전체 정책이라고 하지 않았다. 06장의 Claude Code Review(2026-03) 글은 리뷰 제품 이야기이고, 이 글은 그 리뷰를 머지 결정에 어떻게 엮었는지를 다룬다.<\/p>\n<h3>단계별로<\/h3>\n<p><strong>① PR 전 자체 점검 (관문 아님)<\/strong><\/p>\n<ul>\n<li>Claude가 테스트·빌드·린트를 돌린다. 새 컨텍스트의 두 번째 에이전트가 diff를 한 번 더 본다.<\/li>\n<li>습관이지 머지를 막는 관문은 아니다.<\/li>\n<\/ul>\n<p><strong>② 필수 CI<\/strong><\/p>\n<ul>\n<li>\"Lint, types, tests across platforms, build and packaging. Red blocks the merge.\" — 하나라도 빨간불이면 머지할 수 없다.<\/li>\n<\/ul>\n<p><strong>③ AI 리뷰 — 모든 PR<\/strong><\/p>\n<ul>\n<li>여러 에이전트가 따로 버그를 찾고, 검증 에이전트들이 지적마다 투표한다. 합의된 지적만 PR에 단다.<\/li>\n<li>태그 세 가지: <strong>Important<\/strong>(머지 전에 고칠 버그), <strong>Nit<\/strong>(사소함, 머지를 막지 않음), <strong>Pre-existing<\/strong>(이 PR이 만든 게 아니라 원래 있던 버그).<\/li>\n<li>지적마다 고치거나, 이유를 적고 스레드를 닫아야 머지된다.<\/li>\n<\/ul>\n<p><strong>④ 보안 리뷰<\/strong><\/p>\n<ul>\n<li>별도로 돈다. \"Open findings from either review block the merge.\" — 두 리뷰 어느 쪽이든 열린 지적이 있으면 머지가 막힌다.<\/li>\n<\/ul>\n<p><strong>⑤ 위험 등급 → 필요한 사람 승인 수<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>등급<\/th>\n<th>예<\/th>\n<th>사람 승인<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>LOW<\/td>\n<td>문서, 문구, 사내 전용 기능, 플래그 뒤에 숨긴 추가형 변경<\/td>\n<td><strong>0명<\/strong> — 자동 리뷰·보안 검사가 초록이면 끝<\/td>\n<\/tr>\n<tr>\n<td>MEDIUM<\/td>\n<td>일반 제품 변경, 캐싱·자동 업데이트·시스템 프롬프트 같은 민감 영역<\/td>\n<td>1명<\/td>\n<\/tr>\n<tr>\n<td>HIGH<\/td>\n<td>가장 위험한 코드, 항상 두 명이 필요한 경로<\/td>\n<td>2명<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>분류기가 두 개<\/strong>다. 하나는 등급을 고르고, 다른 하나는 \"등급상 필요 없어도 사람이 봐야 하나\"를 따로 본다. 분류기가 어떻게 판단하는지는 공개하지 않았다.<\/li>\n<li>등급과 상관없이 항상 사람: 코드 주인이 민감하다고 지정한 경로, CI 워크플로 파일.<\/li>\n<li>가벼운 경로는 <strong>저장소 신뢰 목록에 있는 작성자<\/strong>(주로 그 영역을 맡은 팀)만 탈 수 있다.<\/li>\n<li>\"An agent's approval never counts as a person's\" — AI 승인은 사람 승인으로 치지 않는다. 에이전트에게 일을 시킨 사람이 필요한 리뷰어 한 명으로 계산된다.<\/li>\n<li>승인은 특정 커밋에만 유효하다. 새 커밋이 들어오면 다시 승인받는다.<\/li>\n<\/ul>\n<p><strong>⑥ 머지 큐 · 플래그<\/strong><\/p>\n<ul>\n<li>머지 큐가 최신 main 위에서 검사를 다시 돌린다. 각자는 통과한 두 PR이 합쳐져 깨지는 것을 막는다.<\/li>\n<li>새 동작은 플래그 뒤에 숨겨 사내 → <code>latest<\/code> → <code>stable<\/code> 순으로 내보낸다.<\/li>\n<\/ul>\n<p><strong>⑦ 롤백<\/strong><\/p>\n<ul>\n<li>플래그는 배포 없이 끈다. 깨진 빌드는 되돌린다. 주간 온콜이 있다.<\/li>\n<\/ul>\n<h3>AI 리뷰어 자체를 어떻게 채점하나<\/h3>\n<p>이 장에서 <strong>리뷰어 평가 방법을 구체적으로 공개한 유일한 사례<\/strong>다. 05장의 정답지 네 방식과 견줘 볼 만하다.<\/p>\n<ul>\n<li><strong>사고 PR = 정답지<\/strong>: \"Any incidents are now an eval.\" 사고를 내서 되돌리거나 급히 고친 과거 PR을 모으고, <strong>그 코드를 아는 엔지니어가 버그와 위치를 확정<\/strong>한다. 사고가 날 때마다 케이스가 늘어난다.<\/li>\n<li><strong>매일 전체 채점<\/strong>: 리뷰어의 프롬프트·도구·모델을 바꾸면 이 세트로 채점해서, 점수가 오르면 유지하고 아니면 버린다.<\/li>\n<li><strong>소음도 잰다<\/strong>: 지적마다 작성자 반응을 넷으로 나눈다 — 고침 / 틀린 지적이라고 함 / 의도된 동작이라고 함 / 상관없다고 함. 문제없는 PR에도 돌려서, 괜히 코드를 바꾸게 만드는 지적이 몇 개 나오는지 센다.<\/li>\n<li>우선순위: \"catching real bugs first and cutting review rounds second\" — 실제 버그를 먼저, 리뷰 횟수 줄이기는 그다음.<\/li>\n<\/ul>\n<h3>리뷰가 끝없이 반복되는 문제<\/h3>\n<ul>\n<li>CLI PR 하나가 밤새 50번 넘게 리뷰·수정을 반복했다. git blame으로 보니 리뷰어가 계속 짚은 코드의 <strong>약 59%가 첫 리뷰 때부터 있던 코드<\/strong>였다. 새 버그를 찾는 게 아니라 옛 버그를 매번 조금씩 더 찾고 있었다.<\/li>\n<li>고친 방법: 3라운드가 지나면 작성자에게 접근 방식을 다시 생각하라고 한다 · 몇 번 지나면 새로 바뀐 diff만 본다 · 버그를 <strong>종류 단위<\/strong>로 짚어 같은 문제를 한 번에 다 고치게 한다 · 이미 단 지적은 반복하지 않는다.<\/li>\n<li>이후 재현율과 함께 \"통과까지 라운드 수\"도 지표로 본다.<\/li>\n<\/ul>\n<h3>숫자와 그 정의<\/h3>\n<table>\n<thead>\n<tr>\n<th>숫자<\/th>\n<th>정의<\/th>\n<th>주의<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>머지된 PR 2배 이상<\/td>\n<td>6월 → 9월<\/td>\n<td>원 건수 비공개<\/td>\n<\/tr>\n<tr>\n<td>되돌림 비율 40% 이상 감소<\/td>\n<td>같은 기간, 상대 감소<\/td>\n<td>절대 비율 비공개<\/td>\n<\/tr>\n<tr>\n<td>1라운드 통과 65% → 78%<\/td>\n<td>반복 문제를 고친 전후<\/td>\n<td>기간 미표기<\/td>\n<\/tr>\n<tr>\n<td>5라운드 이상 8.9% → 1.5%<\/td>\n<td>같음<\/td>\n<td>기간 미표기<\/td>\n<\/tr>\n<tr>\n<td>통과까지 평균 리뷰 2.08 → 1.32회<\/td>\n<td>같음<\/td>\n<td>기간 미표기<\/td>\n<\/tr>\n<tr>\n<td>실질 코멘트를 받은 PR 16% → 54%<\/td>\n<td>리서치 프리뷰 출시 전후, 사내 PR<\/td>\n<td>06장의 3월 글과 같은 수치<\/td>\n<\/tr>\n<tr>\n<td>하루 변경 약 2,500 → 30,000 이상<\/td>\n<td>5월 → 9월, <strong>Anthropic 모노레포<\/strong>(Claude Code 저장소 아님)<\/td>\n<td>별도 글 인용<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>주의할 점<\/h3>\n<ul>\n<li>전부 자기 보고다. 원 건수, 정답지 세트 크기, 59%의 표본 크기가 없다.<\/li>\n<li>머지 수 증가와 되돌림 감소가 이 체계 덕분인지는 가를 수 없다. 같은 기간에 모델도 바뀌었다.<\/li>\n<li>글이 직접 밝힌 빈칸: \"We don't yet have circuit breakers that tighten approval when those numbers move\" — 지표가 나빠지면 승인 요건을 자동으로 올리는 장치가 아직 없고, 엔지니어들은 사람 없는 머지를 늘리기 전에 그것이 필요하다고 본다.<\/li>\n<li>나쁜 머지를 알아채는 일은 여전히 작성자·온콜·대시보드에 달렸다.<\/li>\n<li>그래도 사람이 하는 일: 무엇을 만들지(방향·취향·범위), 결제·자동 업데이트·CI 같은 위험 코드 리뷰, 아키텍처 리뷰, 증거 읽기, 결과 책임.<\/li>\n<\/ul>\n<h3>공부 자료<\/h3>\n<ul>\n<li>📄 <a href=\"https://claude.dev/blog/solving-code-review-at-anthropic/\">How the Claude Code team does code review (claude.dev, 2026-10-15)<\/a> — 14분 분량. 「위험 등급」 표와 그림 C(정답지 채점), 그림 D(라운드 수치)가 핵심<\/li>\n<li>📄 06장의 <a href=\"https://claude.com/blog/code-review\">Claude Code Review (2026-03)<\/a> — 리뷰 제품 쪽 이야기<\/li>\n<\/ul>\n<hr />\n<h2>6. Rewind — \"AI는 찾고, 코드가 판정하고, 사람은 규칙을 고친다\"<\/h2>\n<p>SaaS 백업 회사 Rewind의 기술 운영 쪽이 쓴 글이다(Rewind 2026). 하루 약 40건, 월 1,000건 넘는 PR을 머지하는데 리뷰가 병목이 되자, <strong>위험 낮은 PR은 AI 승인만으로 통과<\/strong>시키게 했다. 저장소 400개 이상, 실제로 켠 기간은 아직 짧다.<\/p>\n<p>먼저 알아 둘 것: <strong>자동 승인 ≠ 자동 머지.<\/strong> 봇은 GitHub 승인을 남길 뿐이고 CI·브랜치 보호는 그대로다. 머지는 엔지니어가 하거나, 엔지니어가 GitHub 자동 머지를 켜 두었으면 GitHub가 한다.<\/p>\n<h3>단계별로<\/h3>\n<p><strong>① 리뷰어를 영역별로 쪼갠다<\/strong><\/p>\n<ul>\n<li>전문 리뷰어 10여 개가 병렬로 돈다: 정확성 · 보안/테넌트 격리 · 테스트 적정성 · 영향 범위 · 되돌리기 쉬움 · 성능 · 운영 가능성 · IaC · DB 마이그레이션 · GitHub Actions · 공급망(의존성) · (해당 저장소만) 백업 정확성.<\/li>\n<li>모든 리뷰어가 같은 질문 하나만 던진다: <strong>\"If this is wrong in production, what user-facing behavior breaks?\"<\/strong> — 운영에서 틀리면 사용자에게 무엇이 깨지나. 스타일·이름 짓기 지적은 금지한다.<\/li>\n<li>diff에 자기 영역이 없으면 그 리뷰어는 돌지 않는다. 지적마다 심각도와 확신도를 붙인다.<\/li>\n<\/ul>\n<p><strong>② 등급은 줄 수가 아니라 \"무엇을 찾았나\"로<\/strong><\/p>\n<ul>\n<li>등급은 LOW / MEDIUM / HIGH. 영향이 큰 영역의 리뷰어가 지적을 <strong>하나만 내도<\/strong> 줄 수와 상관없이 HIGH다.<\/li>\n<li>예: 5천만 행 테이블에 인덱스를 추가하는 12줄 마이그레이션은 \"가장 위험한 것 중 하나\". 재생성한 API 클라이언트 3,000줄은 안전할 수 있다.<\/li>\n<li>크기는 딱 한 곳에만 쓴다: 약 1만 줄이 넘으면 AI에게 아예 맡기지 않는다. 위험 신호가 아니라 \"사람이든 기계든 그만큼은 머리에 담을 수 없다\"는 한계라서다.<\/li>\n<\/ul>\n<p><strong>③ 판정은 모델이 아니라 일반 코드가 한다<\/strong><\/p>\n<ul>\n<li>판정 엔진은 \"ordinary, unit-tested code, not a model\" — 단위 테스트가 있는 TypeScript 수백 줄이다.<\/li>\n<li>입력: 리뷰어 지적 + 정책 파일. 출력: 등급, 그리고 <strong>APPROVE / REQUEST_CHANGES / NEEDS_HUMAN<\/strong> 중 하나.<\/li>\n<li>REQUEST_CHANGES(수정 요청)는 사람에게 넘기는 것이 아니다. 사람에게 가는 것은 NEEDS_HUMAN뿐이다.<\/li>\n<li>이유: \"이 PR 왜 승인됐어?\"에 설정 파일과 코드로 답할 수 있어야 한다.<\/li>\n<li>GitHub Copilot 리뷰를 필수 검사로 걸었더니 \"이 PR을 리뷰할 수 없습니다\" 같은 문구로 좋은 승인까지 막았다. 지금은 참고용으로만 보여 주고 판정에는 넣지 않는다.<\/li>\n<\/ul>\n<p><strong>④ \"항상 사람\" 경로 목록<\/strong><\/p>\n<ul>\n<li>인증·인가·시크릿·암호화, 그리고 <strong>앞으로 누가 승인할 수 있는지를 바꾸는 것<\/strong>은 항상 사람이 본다.<\/li>\n<li>만든 방법: AI가 저장소마다 수상한 경로를 훑어 목록을 제안 → 사람이 저장소마다 검수해서 맞는 것은 남기고 놓친 것은 더한다. 공통 템플릿은 쓰지 않았다.<\/li>\n<li>보관: YAML 파일 하나, CODEOWNERS로 보호. 판정 엔진도 이 규칙은 뒤집지 못한다.<\/li>\n<li>사람은 언제든 <code>/request-jedi-review<\/code>를 달아 자동 승인을 멈출 수 있다.<\/li>\n<\/ul>\n<p><strong>⑤ 숫자로 검증하는 세 단계<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>한 일<\/th>\n<th>본 숫자<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>만들기 전<\/td>\n<td>과거 PR 수천 건을 모의 리뷰에 돌림<\/td>\n<td>자동 승인 비율, 실제로 머지한 사람과 판단이 갈린 곳, PR당 비용(약 $0.73 예측 → 실제와 비슷)<\/td>\n<\/tr>\n<tr>\n<td>섀도 1주<\/td>\n<td>400개 넘는 저장소의 모든 PR에 판정만 달고 아무것도 막지 않음<\/td>\n<td><strong>사람과 일치율 90% 이상<\/strong>이어야 켬<\/td>\n<\/tr>\n<tr>\n<td>실제 적용<\/td>\n<td>일부 조직은 전 저장소, 나머지는 고른 저장소만<\/td>\n<td>일치율, 그리고 (요약 기준) 사고·되돌림. 기준을 못 넘으면 확대를 멈춤<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>⑥ 반응을 모아 사람이 규칙을 고친다<\/strong><\/p>\n<ul>\n<li>엔지니어가 봇 코멘트에 👍 / 👎 / 🤔를 단다. 주간 요약으로 모은다.<\/li>\n<li>EM이나 테크 리드가 순번으로 주 30분 읽고, 규칙을 유지 / 끄기 / 프롬프트 폐기 중에서 정한다.<\/li>\n<li>결정은 일반 PR로 낸다. \"The bot never edits its own prompts or policy.\" — 봇은 자기 프롬프트·정책을 직접 고치지 않는다.<\/li>\n<li>끈 규칙은 <strong>90일 뒤 자동으로 다시 켜진다.<\/strong> 계속 끄려면 다시 근거를 대야 한다. 반응이 나빴던 한 주 때문에 진짜 문제 유형이 영영 묻히지 않게 하려는 것이다.<\/li>\n<\/ul>\n<p><strong>⑦ 실패 시나리오 평가<\/strong><\/p>\n<ul>\n<li>망가질 수 있는 경우 13개를 뽑아 가능성 × 최악의 영향을 매기고, 완화책과 남는 위험을 적었다. 13개 모두 완화 후 Low 또는 Minimal. 영향 큰 것은 보완 통제를 적고 서면으로 위험을 수용했다.<\/li>\n<li>글에 나온 7개: 결함 있는 PR 승인 · 악성 PR 승인 · 봇 자격증명 탈취 · <strong>모델 업그레이드 뒤 판단력이 몰래 떨어짐<\/strong> · 끈 규칙이 쌓임 · 정책 파일 변조 · 작지만 중요한 위험을 놓침.<\/li>\n<\/ul>\n<h3>숫자와 그 정의<\/h3>\n<table>\n<thead>\n<tr>\n<th>숫자<\/th>\n<th>정의<\/th>\n<th>주의<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>약 40%<\/td>\n<td>자동 승인(APPROVE)으로 나온 PR 비율. 목표는 30~40%<\/td>\n<td>사내 라이브러리 버전 올리기(기계적 1줄 PR)가 많아 높게 나왔다고 글이 직접 밝힘<\/td>\n<\/tr>\n<tr>\n<td>0건<\/td>\n<td>봇 승인 PR과 연결된 되돌림·사고<\/td>\n<td>기간이 섀도 1주 + 실제 적용 1주<\/td>\n<\/tr>\n<tr>\n<td>약 99%<\/td>\n<td>봇이 승인했는데 사람도 따로 리뷰한 PR에서 사람이 봇 판단에 동의한 비율<\/td>\n<td>사람이 따로 본 PR만의 값<\/td>\n<\/tr>\n<tr>\n<td>약 $0.73<\/td>\n<td>PR당 평균 비용<\/td>\n<td>편차가 크다고 함<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>주의할 점<\/h3>\n<ul>\n<li>글쓴이가 직접 숫자를 \"directional (small sample, still expanding)\" — 방향만 보라고 했다.<\/li>\n<li>정책 목록을 저장소마다 사람이 손으로 검수했다. 그 작업 없이 일반화된다고 하지 않았다.<\/li>\n<li>글 끝부분 약 20%(작성자 이름, 승격 지표 일부, 90일 목표)는 원문이 잘려 요약으로만 확인했다. 근거 원장에 표시했다.<\/li>\n<\/ul>\n<h3>공부 자료<\/h3>\n<ul>\n<li>📄 <a href=\"https://rewind.com/blog/ai-approve-pull-requests-safely/\">Review is the bottleneck now: How we let AI approve pull requests (safely) (Rewind, 2026-06-01)<\/a> — 22분 분량. 판정 엔진 분리, 섀도 단계, 주간 루프 절이 핵심<\/li>\n<\/ul>\n<hr />\n<h2>7. 비교용 — 사람이 머지하는 곳, 아직 제안 단계인 곳<\/h2>\n<h3>Stripe Minions — 에이전트가 PR까지, 머지는 사람<\/h3>\n<p>매주 1,300건 넘는 PR을 사람이 코드 한 줄 안 쓰고 에이전트가 만든다. 그래도 <strong>\"human-reviewed\"<\/strong>다.<\/p>\n<ol>\n<li>Slack에서 에이전트를 부른다.<\/li>\n<li>인터넷·프로덕션과 격리된 개발 서버(약 10초 만에 준비)에서 확인 없이 전권으로 작업한다.<\/li>\n<li>\"청사진(blueprint)\": AI 단계(\"작업 구현\", \"CI 실패 고치기\")와 고정 단계(\"린터 실행\", \"푸시\")를 코드로 엮은 흐름.<\/li>\n<li>로컬 린트(5초 이내)를 먼저 통과시킨다.<\/li>\n<li>CI는 <strong>최대 두 번<\/strong>만. 그래도 안 되면 사람에게 넘긴다(비용 때문).<\/li>\n<li>엔지니어가 PR을 열고 <strong>다른 엔지니어에게 리뷰를 요청<\/strong>한다.<\/li>\n<\/ol>\n<ul>\n<li>📄 <a href=\"https://stripe.dev/blog/minions-stripes-one-shot-end-to-end-coding-agents\">Minions Part 1<\/a> · <a href=\"https://stripe.dev/blog/minions-stripes-one-shot-end-to-end-coding-agents-part-2\">Part 2<\/a><\/li>\n<li>🎥 <a href=\"https://youtu.be/o5Mi5SYSDnY\">How I AI 에피소드 (YouTube)<\/a> — 22:04 「1,300 AI PR을 어떻게 리뷰하나」(내용 미확인)<\/li>\n<\/ul>\n<h3>Rootly — \"이미 사람이 형식적으로 승인하고 있다\"는 데이터에서 출발한 제안<\/h3>\n<ul>\n<li>자기 저장소 PR 3,661건을 봤더니 <strong>90.5%가 사람 코멘트 하나 없이 승인<\/strong>됐다. 24.4%는 시간당 500줄 읽기 속도보다 빨리 승인됐다.<\/li>\n<li>제안: 아래 셋을 <strong>모두<\/strong> 만족할 때만 AI가 승인한다.<ol>\n<li>위험 라벨 <code>risk:low<\/code>를 리뷰어가 확인<\/li>\n<li>현재 커밋 기준 리뷰 점수 5점 만점<\/li>\n<li>민감 경로(마이그레이션, 인증·권한, 결제, CI·배포 설정, 의존성)를 건드리지 않음<\/li>\n<\/ol>\n<\/li>\n<li>안전장치: 결정적 자격 규칙, 새 푸시가 오면 승인 무효, 배포 관문은 그대로, 끄는 스위치. <strong>아직 그림자 운영(shadow mode)도 시작하지 않았다.<\/strong><\/li>\n<li>같은 글이 인용한 다른 회사(원문 미확인): Ona(첫 승인까지 3시간 → 4분 미만, 머지는 사람), Intercom(19% 이상 자동 승인). Rewind는 원문을 읽고 이 장 6절에 따로 정리했다.<\/li>\n<li>📄 <a href=\"https://rootly.com/blog/when-should-ai-be-allowed-to-approve-a-pull-request\">Rootly: When should AI be allowed to approve a pull request?<\/a><\/li>\n<\/ul>\n<hr />\n<h2>단계별로 나란히 보기<\/h2>\n<table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>xAI Grok Bot<\/th>\n<th>Meta RADAR<\/th>\n<th>Spotify Fleet<\/th>\n<th>Google LSC<\/th>\n<th>Anthropic Claude Code 팀<\/th>\n<th>Rewind<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>대상 고르기<\/strong><\/td>\n<td>공개 안 됨 (\"영향 범위가 작은 것\")<\/td>\n<td>출처별 자격 + 금지 목록 + 위험 점수 백분위<\/td>\n<td>변경을 만든 쪽이 자동 머지 여부 지정, 저장소는 opt-out<\/td>\n<td>위원회 승인<\/td>\n<td>분류기 2개가 위험 등급, 신뢰 목록 작성자만<\/td>\n<td>리뷰가 찾은 것으로 등급, 1만 줄 초과는 제외<\/td>\n<\/tr>\n<tr>\n<td><strong>기계 검사<\/strong><\/td>\n<td>금지 패턴 린트, 타입, 테스트, 앱 실행, 형식 검증<\/td>\n<td>CI 상태, 금지 문구·파일 패턴<\/td>\n<td>저장소별 테스트·검사<\/td>\n<td>TAP 열차(영향 테스트 전체)<\/td>\n<td>필수 CI, 머지 큐에서 재검사<\/td>\n<td>기존 CI·브랜치 보호 그대로<\/td>\n<\/tr>\n<tr>\n<td><strong>AI 리뷰<\/strong><\/td>\n<td>있음(가이드)<\/td>\n<td>LLM이 안전/위험 신호 분류, 8/10 이상<\/td>\n<td>AI PR만: LLM 심판(이후 제거)<\/td>\n<td>없음(AI는 생성 쪽)<\/td>\n<td>다중 에이전트 + 투표, 보안 리뷰 별도. 열린 지적이 있으면 막음<\/td>\n<td>영역별 리뷰어 10여 개, 판정은 일반 코드<\/td>\n<\/tr>\n<tr>\n<td><strong>사람<\/strong><\/td>\n<td>조건 밖이면 검증 산출물을 본다<\/td>\n<td>실패하면 사람, 일부는 사후 리뷰<\/td>\n<td>AI PR은 코드 주인 리뷰<\/td>\n<td>전사 승인자가 이상한 것만<\/td>\n<td>MEDIUM 1명·HIGH 2명, 민감 경로 항상<\/td>\n<td>NEEDS_HUMAN만, 정해진 경로 항상<\/td>\n<\/tr>\n<tr>\n<td><strong>머지 후 감시<\/strong><\/td>\n<td>되돌림 비율, 출시 후 퍼징<\/td>\n<td>되돌림·장애 비율<\/td>\n<td>배포 실패 상관(Firewatch), 코호트 정지<\/td>\n<td>되돌리기 쉬운 조각<\/td>\n<td>되돌림 비율, 플래그 끄기, 온콜<\/td>\n<td>봇 승인과 연결된 되돌림·사고<\/td>\n<\/tr>\n<tr>\n<td><strong>실수 → 규칙<\/strong><\/td>\n<td>교정마다 린트·검사로<\/td>\n<td>장애 낸 런북 금지 목록<\/td>\n<td>사고 후 안전장치·근무 시간 제한<\/td>\n<td>옛 API 재사용 경고<\/td>\n<td>사고 PR을 리뷰어 정답지에 추가<\/td>\n<td>반응 주간 요약 → 사람이 PR로 규칙 수정, 끈 규칙 90일 만료<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>반복해서 보이는 것 (관찰, 권고 아님)<\/h2>\n<ul>\n<li><strong>\"무엇을 자동 머지할지\"를 개별 PR이 아니라 상위 단위에서 정한다.<\/strong> Meta는 런북·변환 스크립트 단위로 신뢰를 쌓고, Spotify는 shift 정의를 리뷰하고, Google은 LSC 단위로 승인한다. xAI는 이 부분이 공개되지 않았다.<\/li>\n<li><strong>기계 검사를 먼저 두껍게 한다.<\/strong> 자동 머지를 넓힌 곳일수록 린트·테스트·실행 검증에 투자를 많이 했다고 말한다(xAI: 토큰 대부분을 검증에).<\/li>\n<li><strong>하나라도 걸리면 사람에게.<\/strong> Meta, Rootly 제안, Anthropic(열린 지적·민감 경로), Rewind(HIGH 지적 하나면 HIGH) 모두 \"모든 조건 통과\"일 때만 자동이고, 실패는 사람 리뷰로 간다.<\/li>\n<li><strong>AI의 판단과 머지 결정을 떼어 놓는다.<\/strong> Rewind는 AI가 지적만 내고 판정은 테스트가 있는 일반 코드가 한다. Anthropic은 AI 승인을 사람 승인으로 세지 않는다. Meta도 마지막 판정은 점수 기준(8/10, 백분위)이다.<\/li>\n<li><strong>\"항상 사람\" 목록을 따로 둔다.<\/strong> Anthropic(주인이 지정한 민감 경로·CI 파일), Rewind(인증·시크릿·승인 규칙, CODEOWNERS로 보호), Rootly 제안(마이그레이션·결제 등).<\/li>\n<li><strong>안전 지표로 되돌림 비율을 쓰지만, 이 지표는 일부 실패를 놓친다.<\/strong> 나중 PR로 고친 버그, 되돌리지 않고 넘어간 품질 저하는 잡히지 않는다. 그리고 안전한 것만 골랐으니 낮게 나오는 것이 당연하다(선택 편향).<\/li>\n<li><strong>조금씩 넓힌다.<\/strong> Spotify(중요도 낮은 저장소부터, 코호트), Meta(P25 → P50), Rewind(과거 PR 모의 실행 → 섀도 1주에 사람과 90% 일치 → 일부 저장소), Rootly(그림자 운영부터).<\/li>\n<li><strong>리뷰어 자체의 채점 방법은 거의 공개되지 않는다.<\/strong> 구체적으로 밝힌 곳은 Anthropic(사고 PR을 정답지로 매일 채점)과 Rewind(사람 판단과의 일치율)뿐이다.<\/li>\n<li><strong>AI가 쓴 일반 제품 코드를 넓게 자동 머지한다고 밝힌 곳은 xAI뿐이다.<\/strong> Anthropic Claude Code 팀은 LOW 등급(문서·사내 기능·플래그 뒤 추가형 변경)으로 범위를 좁혔다. Spotify는 AI PR 자동 머지를 \"아직 답이 없는 질문\"이라고 했고, Stripe·Google은 사람 리뷰를 유지한다.<\/li>\n<\/ul>\n<h2>스스로 판단할 질문<\/h2>\n<ol>\n<li>우리 팀에서 \"사람이 이미 형식적으로 승인하고 있는\" PR은 얼마나 되나? Rootly처럼 실제 데이터를 먼저 볼 수 있나?<\/li>\n<li>자동 머지 대상을 개별 PR 단위로 고를 것인가, 변경 종류·생성기 단위로 고를 것인가?<\/li>\n<li>자동 머지 전에 반드시 있어야 할 기계 검사는 무엇인가? 지금 우리 저장소의 테스트로 충분한가?<\/li>\n<li>\"민감 경로\" 목록에는 무엇이 들어가야 하나? (마이그레이션, 인증, 설정, 의존성…)<\/li>\n<li>머지 후 무엇으로 감시할 것인가? 되돌림 비율이 놓치는 실패는 어떻게 볼 것인가?<\/li>\n<li>선택 편향을 어떻게 피할 것인가? 자동 머지한 변경과 비교할 대조군을 둘 수 있나?<\/li>\n<li>에이전트가 실수했을 때 프롬프트를 고칠 것인가, 린트·검사로 만들 것인가?<\/li>\n<li>머지 판정을 모델에게 맡길 것인가, Rewind처럼 지적을 입력으로 받는 일반 코드로 만들 것인가? \"이 PR 왜 승인됐어?\"에 어떻게 답할 것인가?<\/li>\n<li>AI 리뷰어 자체는 무엇으로 채점할 것인가? Anthropic처럼 과거 사고·되돌림 PR을 정답지로 모을 수 있나? 우리 팀에 그런 PR이 몇 건이나 있나?<\/li>\n<li>반응·리뷰 코멘트로 규칙을 고칠 때, 고치는 주체는 누구인가(사람이 PR로 / 봇이 스스로)? 끈 규칙은 언제 다시 볼 것인가?<\/li>\n<\/ol>\n<h2>공부 순서 (추천)<\/h2>\n<ol>\n<li>🎥 Lauren Tan 발표(17분) — 전체 그림을 가장 빨리 잡는다<\/li>\n<li>📄 Spotify Fleet Management Part 3 — 자동 머지 조건이 가장 구체적이다<\/li>\n<li>📄 Meta RADAR 논문 2장과 그림 3 — 거름망을 여러 겹으로 쌓는 법<\/li>\n<li>📄 Chrome LSC 문서 → SWE at Google 22장 — AI 이전의 원형<\/li>\n<li>📄 Rewind 글 — 판정 엔진 분리와 섀도 검증 단계가 가장 구체적이다<\/li>\n<li>📄 Anthropic Claude Code 팀 글 — 위험 등급과 리뷰어 채점(사고 PR 정답지)<\/li>\n<li>📄 Rootly 글 — 우리 데이터로 시작하는 법<\/li>\n<li>🎥 Spotify InfoQ 발표 — AI PR 자동 머지가 왜 아직 어려운가<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<p><strong>xAI<\/strong><\/p>\n<ul>\n<li>Lauren Tan, 「All Code Is Slop (Except Mine)」, AI Engineer CODE 2026-11 — <a href=\"https://www.youtube.com/watch?v=O_zcc6Xl12g\">https://www.youtube.com/watch?v=O_zcc6Xl12g<\/a> · <a href=\"https://ai.engineer/talks/O_zcc6Xl12g-all-code-is-slop-except-mine\">https://ai.engineer/talks/O_zcc6Xl12g-all-code-is-slop-except-mine<\/a> · <a href=\"https://ai.engineer/code/2026/talks/lauren-tan\">https://ai.engineer/code/2026/talks/lauren-tan<\/a> (C)<\/li>\n<li>Lingxi Li, 「Grok Bot for Engineering」, 2026-09-10 — <a href=\"https://x.ai/bot/guides/grok-bot-for-engineering\">https://x.ai/bot/guides/grok-bot-for-engineering<\/a> (D, 제품 안내)<\/li>\n<li>XiaoHu.AI — <a href=\"https://xiaohu.ai/en/article/lauren-tan-agent-code-quality/\">https://xiaohu.ai/en/article/lauren-tan-agent-code-quality/<\/a> · Paul Kuo — <a href=\"https://paulkuo.tw/en/articles/agent-mistakes-into-checks/\">https://paulkuo.tw/en/articles/agent-mistakes-into-checks/<\/a> (D, 2차 요약)<\/li>\n<\/ul>\n<p><strong>Meta<\/strong><\/p>\n<ul>\n<li>RADAR, arXiv 2605.30208v1, 2026-05-28 — <a href=\"https://arxiv.org/html/2605.30208v1\">https://arxiv.org/html/2605.30208v1<\/a> (D, 게재처 표기는 있으나 미확인)<\/li>\n<li>해설 — <a href=\"https://terencecho.github.io/research-explained/radar/\">https://terencecho.github.io/research-explained/radar/<\/a> (D) · 비판 — <a href=\"https://abovethemodel.substack.com/p/approval-drift-when-ai-moves-faster\">https://abovethemodel.substack.com/p/approval-drift-when-ai-moves-faster<\/a> (D, 의견 글)<\/li>\n<\/ul>\n<p><strong>Spotify<\/strong><\/p>\n<ul>\n<li>Fleet Management 2023 — <a href=\"https://engineering.atspotify.com/2023/04/spotifys-shift-to-a-fleet-first-mindset-part-1\">https://engineering.atspotify.com/2023/04/spotifys-shift-to-a-fleet-first-mindset-part-1<\/a> · <a href=\"https://engineering.atspotify.com/2023/05/fleet-management-at-spotify-part-3-fleet-wide-refactoring/\">https://engineering.atspotify.com/2023/05/fleet-management-at-spotify-part-3-fleet-wide-refactoring/<\/a> (B)<\/li>\n<li>Honk 연재 — <a href=\"https://engineering.atspotify.com/2025/11/spotifys-background-coding-agent-part-1\">https://engineering.atspotify.com/2025/11/spotifys-background-coding-agent-part-1<\/a> · <a href=\"https://engineering.atspotify.com/2025/11/context-engineering-background-coding-agents-part-2\">https://engineering.atspotify.com/2025/11/context-engineering-background-coding-agents-part-2<\/a> · <a href=\"https://engineering.atspotify.com/2025/12/feedback-loops-background-coding-agents-part-3\">https://engineering.atspotify.com/2025/12/feedback-loops-background-coding-agents-part-3<\/a> · <a href=\"https://engineering.atspotify.com/2026/4/background-coding-agents-dataset-migrations-honk-part-4\">https://engineering.atspotify.com/2026/4/background-coding-agents-dataset-migrations-honk-part-4<\/a> (B)<\/li>\n<li>품질 대응 2026 — <a href=\"https://engineering.atspotify.com/2026/9/ai-changed-how-spotify-builds-what-we-learned-and-fixed-about-quality-at-higher-velocity\">https://engineering.atspotify.com/2026/9/ai-changed-how-spotify-builds-what-we-learned-and-fixed-about-quality-at-higher-velocity<\/a> · <a href=\"https://infoq.com/news/2026/10/spotify-ai-quality-controls\">https://infoq.com/news/2026/10/spotify-ai-quality-controls<\/a> (B)<\/li>\n<li>발표 — <a href=\"https://www.infoq.com/presentations/spotify-ai-codebase-migration-agent/\">https://www.infoq.com/presentations/spotify-ai-codebase-migration-agent/<\/a> (C, 일부만 읽음) · <a href=\"https://claude.com/code-with-claude/session/ldn-coding-is-no-longer-the-constraint-scaling-devex-to-teams-and-agents-at-spotify\">https://claude.com/code-with-claude/session/ldn-coding-is-no-longer-the-constraint-scaling-devex-to-teams-and-agents-at-spotify<\/a> (C) · <a href=\"https://engineering.atspotify.com/2026/6/code-with-claude-coding-is-no-longer-the-constraint\">https://engineering.atspotify.com/2026/6/code-with-claude-coding-is-no-longer-the-constraint<\/a> (B)<\/li>\n<\/ul>\n<p><strong>Google<\/strong><\/p>\n<ul>\n<li>SWE at Google 22장 — <a href=\"https://abseil.io/resources/swe-book/html/ch22.html\">https://abseil.io/resources/swe-book/html/ch22.html<\/a> (B, 후반부 요약으로만 확인)<\/li>\n<li>Chrome LSC — <a href=\"https://chromium.googlesource.com/chromium/src/+/HEAD/docs/process/lsc/large_scale_changes.md\">https://chromium.googlesource.com/chromium/src/+/HEAD/docs/process/lsc/large_scale_changes.md<\/a> (B)<\/li>\n<li>Google Research 2024 — <a href=\"https://research.google/blog/accelerating-code-migrations-with-ai/\">https://research.google/blog/accelerating-code-migrations-with-ai/<\/a> (B)<\/li>\n<li>Google Cloud CTO실 2026-04 — <a href=\"https://cloud.google.com/transform/when-ai-writes-the-code-who-reviews-it-cto-google-cloud\">https://cloud.google.com/transform/when-ai-writes-the-code-who-reviews-it-cto-google-cloud<\/a> (B)<\/li>\n<\/ul>\n<p><strong>Anthropic<\/strong><\/p>\n<ul>\n<li>Osmani · Lunt · Wang, 「How the Claude Code team does code review」, claude.dev, 2026-10-15 — <a href=\"https://claude.dev/blog/solving-code-review-at-anthropic/\">https://claude.dev/blog/solving-code-review-at-anthropic/<\/a> (B, 전문 읽음, 자기 보고)<\/li>\n<\/ul>\n<p><strong>Rewind<\/strong><\/p>\n<ul>\n<li>「Review is the bottleneck now: How we let AI approve pull requests (safely)」, rewind.com, 2026-06-01 — <a href=\"https://rewind.com/blog/ai-approve-pull-requests-safely/\">https://rewind.com/blog/ai-approve-pull-requests-safely/<\/a> (B, 앞 약 80%는 원문, 끝 약 20%는 요약으로 확인, 자기 보고)<\/li>\n<\/ul>\n<p><strong>비교<\/strong><\/p>\n<ul>\n<li>Stripe — <a href=\"https://stripe.dev/blog/minions-stripes-one-shot-end-to-end-coding-agents\">https://stripe.dev/blog/minions-stripes-one-shot-end-to-end-coding-agents<\/a> · <a href=\"https://stripe.dev/blog/minions-stripes-one-shot-end-to-end-coding-agents-part-2\">https://stripe.dev/blog/minions-stripes-one-shot-end-to-end-coding-agents-part-2<\/a> (B) · <a href=\"https://youtu.be/o5Mi5SYSDnY\">https://youtu.be/o5Mi5SYSDnY<\/a> (C, 미확인)<\/li>\n<li>Rootly 2026-11-17 — <a href=\"https://rootly.com/blog/when-should-ai-be-allowed-to-approve-a-pull-request\">https://rootly.com/blog/when-should-ai-be-allowed-to-approve-a-pull-request<\/a> (B)<\/li>\n<li>제외: monday.com AWS 블로그 — 본문을 수집하지 못해 수치를 확인하지 못했다<\/li>\n<\/ul>", "text": " 07. 빅테크·대기업 자세히 보기 — 자동 머지는 실제로 어떻게 운영하나 생성일 : 2026-11-25 최종 수정일 : 2026-11-25 수준 : 사례 심화 앞 장 : 06 빅테크·대기업은 어떻게 만들고 평가하나 의 회사들 중 사람 리뷰 없이 머지하는 곳 만 골라, 운영 단계를 원문 근거와 함께 하나씩 들여다본다 근거 원장 : 20261125-misc-auto-merge-cases — 회사별 원문을 읽고 뽑은 보고서 7개 (Anthropic·Rewind는 2026-11-25 오후 추가) 먼저 읽을 것 이 장에서 자동 머지 는 \"사람이 승인 버튼이나 머지 버튼을 누르지 않아도 코드가 메인 브랜치에 들어간다\"는 뜻이다. 사람이 나중에 볼 수 있어도(사후 리뷰) 머지 시점에 사람이 없으면 자동 머지로 본다. 숫자는 전부 회사가 자기 시스템에 대해 낸 값 이다. 무작위 대조 실험은 한 곳도 없다. 회사마다 \"무엇을 자동 머지하는가\"가 다르다. 기계적인 대량 변경(의존성 버전 올리기 같은 것)만 하는 곳이 있고, 에이전트가 쓴 제품 코드까지 하는 곳이 있다. 숫자를 나란히 놓고 비교하지 말고, 각 회사가 어떤 조건을 걸었는지 를 보는 것이 이 장의 목적이다. 06장은 빅테크·대기업이 \"AI 리뷰 코멘트를 어떻게 평가하나\"를 넓게 훑었다. 이 장은 그중 한 주제를 깊게 판다 — \" 사람 리뷰를 빼도 되는 변경을 어떻게 고르고, 단계마다 무엇을 하나 \". 출처 등급: A 동료 심사 논문 · B 회사 엔지니어링 블로그·문서 · C 컨퍼런스 발표·발표 정리문 · D 프리프린트·2차 요약·제품 안내. 한눈에 회사 무엇을 자동 머지하나 사람은 어디에 있나 머지 후 안전 지표 등급 xAI Grok Bot 팀 에이전트가 쓴 제품 코드 중 \"리뷰 확신 높고 영향 범위 작은 것\", 출시 후 퍼징이 찾은 버그 수정 나머지 PR은 사람이 코드 대신 검증 산출물(영상·스크린샷·형식 검증 결과) 을 본다 되돌림(revert) 비율 약 0.5% C·D Meta RADAR 위험 점수가 낮은 변경. 봇이 만든 변경(규칙 기반 코드 변환·AI 코드 변환)과 사람이 쓴 변경 일부 거름망 중 하나라도 걸리면 사람 리뷰로 보낸다. 사람 변경은 \"먼저 배포, 리뷰는 나중\" 경로도 있다 되돌림 비율, 장애(PI) 비율 D Spotify Fleet Management 전사 일괄 유지보수 PR(의존성·설정 변경 등). AI 에이전트(Honk) PR은 대부분 사람이 리뷰 저장소 주인 팀은 자동 머지를 끌 수 있다(opt-out). AI PR은 코드 주인이 리뷰 자동 머지된 커밋과 배포 실패의 상관(Firewatch) B·C Anthropic Claude Code 팀 분류기가 LOW로 매긴 변경(문서·문구·사내 전용 기능·플래그 뒤 추가형 변경). 에이전트가 쓴 PR 포함 MEDIUM은 1명, HIGH는 2명 승인. 민감 경로·CI 워크플로 파일은 항상 사람. AI 승인은 사람 승인으로 치지 않는다 되돌림(revert) 비율, 사고 PR을 정답지로 쓴 리뷰어 매일 채점 B Rewind 자동 승인 (머지 아님). 리뷰가 위험한 것을 못 찾은 LOW 등급 PR. 약 40% 정해진 경로·약 1만 줄 초과·사람 요청이면 사람에게. 머지는 엔지니어가 하거나 GitHub 자동 머지를 켠 경우 GitHub가 한다 봇 승인과 연결된 되돌림·사고 0건, 사람과 일치율 B Google 대규모 변경(LSC) 자동 머지는 아니다. 리뷰를 한 명의 전사 승인자에게 몰고, 그 사람이 도구로 이상한 것만 골라 본다 전사 승인자 + (Chromium) 두 번째 사람 공개 수치 없음 B 비교: Stripe Minions 없음 에이전트가 PR까지 만들고 사람이 반드시 리뷰 — B 비교: Rootly 제안 단계(아직 켜지 않음) 조건 3개를 다 만족할 때만 AI 승인 — B 그림 7-1. 네 회사에서 반복해서 보이는 골격 — 대상 고르기 → 기계 검사 → (AI 리뷰) → 머지 판정 → 머지 후 감시 → 실수를 규칙으로. 어느 칸을 얼마나 두껍게 하는지는 회사마다 다르다 1. xAI Grok Bot 팀 — \"사람은 코드 대신 증거를 본다\" Grok Bot 데스크톱 클라이언트(Electron 앱)를 만드는 팀이다. 10월 한 달에 팀 전체(기여자 약 227명)가 PR 약 11,000건을 배포했고, 발표자 Lauren Tan 개인은 약 3,000건이라고 했다. 안정 버전을 거의 매일 낸다. 단계별로 ① 에이전트가 실수하기 어려운 구조를 먼저 만든다 (Dune 프레임워크) 팀이 만든 클라이언트 프레임워크 Dune 안에서만 제품 코드를 쓰게 한다. 잘 쓰려면 요령이 필요한 기능은 아예 막는다. 예: React의 useEffect 는 제품 코드에서 금지하고, Dune 내부 API에서만 허용한다. 렌더러/메인 프로세스 디렉터리 사이의 import도 막는다. 이유(발표): \"anything that requires nuance to use well often leads to slop\" — 요령이 필요한 것은 에이전트가 엉망으로 쓴다. 낡은 코드도 치운다. 에이전트는 저장소에 있는 기존 코드를 보고 배우기 때문이다. ② 커밋마다 기계 검사 (린트·타입·컴파일러·테스트·CI) 금지 패턴은 린트 규칙으로 막는다. 린트 에러 메시지는 \"근본 원인을 고치라\"고 에이전트에게 말하도록 쓴다. 코드 주석의 약 99%를 금지했다. 주석은 낡고, 강제할 방법이 없기 때문이다(슬라이드: 7월 31일 65,824개 → 1,227개, 2차 요약 기준). ③ 에이전트가 앱을 직접 실행해 확인한다 (런타임 검증) 에이전트가 Chrome DevTools Protocol로 앱을 띄우고 조작한다. \"기능 지도(feature map)\"로 어떤 화면이 어디 있는지 안다. 예: 설정 화면 클릭 → 스냅샷 → proof.png 로 스크린샷 저장. ④ 일부는 형식 검증·속성 기반 UI 테스트까지 TLA+로 기기 간 알림 흐름을 모델 검사, Lean으로 가상화 라이브러리 증명, Bombadil로 무작위 UI 탐색. 발표자도 \"silver bullet이 아니고 실험 중\"이라고 했다. ⑤ AI 리뷰 (x.ai 가이드에만 나옴, 발표에는 없음) 작업이 \"리뷰 준비\" 상태가 되면 AI 코드 리뷰를 자동으로 돌린다. 보안 지적·CI 실패·충돌을 30분마다 확인한다. ⑥ 머지 판정 가이드에 적힌 유일한 기준: \"If the review is highly confident and the blast radius is low, the PR is merged automatically. Otherwise, I'll review the code and the proof.\" — 리뷰 확신이 높고 영향 범위가 작으면 자동 머지, 아니면 사람이 코드와 증거를 본다. \"확신이 높다\", \"영향 범위가 작다\"의 기준값은 공개되지 않았다. 발표: 제품 코드 대부분은 이제 \"deep human review\"가 필요 없다. ⑦ 사람이 보는 것 = 검증 산출물 발표: \"our code review process has now really shrunk into looking at verification artifacts instead.\" — 코드 리뷰가 검증 산출물(영상·스크린샷·다이어그램·형식 검증 결과)을 보는 일로 줄었다. 발표자가 동료 PR을 리뷰하는 양이 2024년 3건 → 지금 약 300건(시간 단위는 말하지 않음). ⑧ 출시 후 퍼징 → 수정 PR 자동 머지 (바깥 고리) 출시 버전을 자를 때마다 에이전트가 앱을 무작위로 두드려 버그를 찾는다. 찾은 버그마다 수정 PR을 열고 자동으로 머지 한다. 수정 PR도 ①~③의 제약과 검증을 그대로 받는다. 슬라이드 예: 한 번 돌렸더니 서로 다른 버그 50개(새 버그 3, 기존 버그 47). ⑨ 실수를 규칙으로 바꾼다 \"every time we correct our agents, it turns into one of these deterministic checks.\" — 에이전트를 고쳐 줄 때마다 그것을 기계 검사로 만든다. 순서: 린트 규칙으로 새로 생기는 것을 막는다 → 에이전트가 따라 할 옛 예시를 치운다 → 검증을 붙인다 → 자동화한다. 문서(프롬프트·플레이북)로 고치는 것은 가장 약한 방법으로 본다. 숫자와 그 정의 숫자 정의 출처 약 11,000 PR/월 팀 전체, 10월, 프로덕션 배포 기준 발표 약 3,000 PR/월 발표자 개인. 3월 68 → 10월 3,127로 늘어남 발표, 슬라이드(2차 요약) 약 0.5% 되돌림 비율 = 머지했다가 통째로 되돌린 PR의 비율. 나중 PR로 고친 버그는 세지 않는다 (발표자 언급) 발표 약 70% 토큰의 대부분을 검증에 쓴다는 예(Cindy Sridharan의 수치를 인용) 발표 주의할 점 대조 실험이 아니다(발표 페이지가 직접 밝힘). PR 크기·종류별 내역이 없다. 어떤 변경이 여전히 사람을 거쳐야 하는지 목록이 없다. 검증 산출물을 누가 검증하는지도 열려 있다. 흔히 \"한 명이 월 1만 건 자동 머지\"로 퍼졌지만, 1.1만은 팀 전체이고 자동 머지는 조건부다. x.ai 가이드는 Lingxi Li라는 다른 엔지니어의 봇 운영기다. 발표(Lauren Tan)와 같은 팀이지만 같은 파이프라인이라는 보장은 없다. 공부 자료 🎥 Lauren Tan 「All Code Is Slop (Except Mine)」 YouTube (약 17분) — 5:00 Dune · 6:56 타이머 사례 · 9:40 앱 실행 검증 · 11:51 검증 토큰 · 13:32 11,000 PR · 15:11 출시 📄 발표 정리문(ai.engineer) · 행사 페이지·전사 📄 x.ai 「Grok Bot for Engineering」 가이드 — 자동 머지 기준 문장이 여기 있다 📄 2차 요약: XiaoHu.AI (슬라이드 수치) · Paul Kuo (한계 정리) 2. Meta RADAR — \"위험 점수로 고르고, 하나라도 걸리면 사람에게\" RADAR(Risk Aware Diff Auto Review)는 Meta의 저위험 변경 자동 리뷰 시스템이다. 53.5만 건 넘게 자동 리뷰했고 그중 33.1만 건 넘게 머지됐다(최대 하루 약 2.5만 건). 단계별로 ① 누가 만든 변경인지 나눈다 출처 처리 규칙 기반 코드 변환(codemod) — 사람이 짠 변환 스크립트가 만든 변경 스크립트 자체를 이미 검증했으므로 건별 AI 리뷰 없이 일괄 승인 AI 코드 변환 — LLM이 만든 codemod 변경 건별로 ②~⑤를 모두 통과해야 승인 RACER 런북 — AI 에이전트에 맡긴 정형 작업(죽은 코드 제거, 린트 수정 등) 런북마다 자격 심사 후 ②~⑤ 사람이 쓴 변경 별도 경로(⑦) ② 출처 단위 자격 심사 (RACER 런북 예) 최근 60일 기록: 장애 0건, 되돌림·사람 거절 비율 낮음, 최소 머지 건수 충족. 런북별 하루 상한(신뢰가 쌓이면 최대 2,000건). 금지 목록: 장애를 낸 적 있거나 민감 영역을 건드리는 런북. 이름에 \"test\"가 들어간 런북도 제외. ③ 고정 규칙 거름망 오픈소스 코드, SOX(회계 규제) 대상 코드, 추가 리뷰가 필요한 코드는 제외. 사람 변경은 여기에 더해: 작업 중(WIP)·RFC·이전에 거절된 변경 제외, 최신 버전만, CI 상태 정상, 금지 문구·금지 파일 패턴 없음. ④ 위험 점수 (Diff Risk Score, DRS) 머신러닝 모델이 \"이 변경이 장애를 낼 가능성\"을 점수로 낸다. \"변경의 10%만 표시해서 장애 원인 변경의 60%를 잡는\" 식으로, 재현율을 높이도록 맞췄다. 기준은 백분위: P5 면 가장 안전한 5%만 통과. 사람 변경 P5, 봇 변경 P20, 신뢰 런북 P50. 모델에 어떤 특징을 넣었는지는 공개되지 않았다. ⑤ LLM 리뷰 (Automated Code Review, ACR) 변경 하나하나를 \"안전 신호\"와 \"위험 신호\"로 분류한다. 안전: 동작이 바뀌지 않는 리팩터링, 죽은 코드 제거, 방어 코드 추가, 로그, 포맷, 문서, import 정리, 테스트. 위험: 복잡도 4 이상, 큰 구조 변경, 버그·논리 오류, 성능 위험, 보안(비밀 노출·SQL 주입·인증 우회). 통과 조건: 확신도 10점 중 8점 이상 + 모든 변경이 안전 범주 . 위험 신호가 하나라도 있으면 탈락. ⑥ 판정과 머지 봇 변경: 거름망 세 겹(③④⑤)을 모두 통과하면 사람 리뷰 없이 머지한다. 머지 전에 정해진 대기 시간이 있어서 그동안 사람이 거절할 수 있다. 논문 그림 3: \"Failure at any stage routes the diff to human review.\" — 어느 단계든 실패하면 사람 리뷰로 간다. ⑦ 사람이 쓴 변경의 두 경로 Verification(검증) : 통과하면 작성자가 먼저 배포하고 리뷰는 나중에 받는다. Approval(승인) : 더 엄격한 기준을 통과하면 사후 리뷰도 필요 없다. 숫자와 그 정의 숫자 정의 주의 535K+ / 331K+ 자동 리뷰한 변경 / 그중 머지된 변경 되돌림 약 1/3 RADAR 변경의 되돌림 비율이 RADAR 밖 변경의 약 1/3 HTML 표기가 깨져 있다. 해설 글의 \"1/13\"은 오독으로 보인다. PDF 확인 필요 장애 약 1/50 RADAR 변경의 장애(PI) 비율이 RADAR 밖 변경의 약 1/50 60.31% 위험 점수 기준을 P25 → P50으로 넓힌 뒤 승인 비율 전후 비교만 했다 리뷰 소요 −35% 변경 리뷰 시간 중앙값 주의할 점 선택 편향 : RADAR는 애초에 위험이 낮은 변경만 고른다. 그러니 되돌림·장애 비율이 낮은 것은 \"자동화가 안전해서\"인지 \"안전한 것만 골라서\"인지 가를 수 없다. 해설 글도 인과가 아니라 연관이라고 정리한다. 무작위 배정이 없다. 기준 완화(P25 → P50)는 전후 관찰 비교뿐이다. 비판 글 「Approval Drift」(Substack, 2026-11): 안전한 25% → 안전한 50%로 문을 넓히면서 안전성 전후 비교를 내놓지 않았다고 지적한다. 논문 초록은 \"전후 관찰 비교를 했다\"고 적어 서로 엇갈린다. 4.2절 원문을 확인해야 한다. 이 장의 일부 세부(3~6절)는 원문이 잘려 요약으로만 확인했다. 근거 원장에 \"(summary)\"로 표시했다. 공부 자료 📄 논문 「Automating Low-Risk Code Review at Meta: RADAR, Risk Calibration, and Review Efficiency」 arXiv 2605.30208 — 2.3절(위험 점수) · 2.4절(LLM 리뷰) · 2.7~2.9절(경로별 규칙) · 그림 3(전체 흐름) 📄 초보자용 해설 — 단, \"1/13\", \"승인율 25%\"는 오독 📄 비판: Approval Drift 3. Spotify — \"기계적 변경은 자동 머지, AI 변경은 아직 사람\" Spotify는 두 가지를 구분해서 봐야 한다. Fleet Management : 수천 개 저장소에 같은 변경을 일괄로 넣는 체계. 2023년부터 운영했고, 자동 유지보수 PR 250만 건 이상 을 머지했으며 \"대부분 사람 없이 자동 머지\"됐다. Honk : 같은 체계 위에 AI 에이전트(Claude Agent SDK)를 얹은 것. 머지된 에이전트 PR은 2025년 11월 기준 1,500건 이상이다. AI PR의 자동 머지는 아직 열린 질문 이다. 단계별로 — Fleet Management (규칙 기반 변경) ① 변경을 코드로 정의한다 (Fleetshift) 변경 하나(\"shift\")는 코드를 고치는 Docker 이미지다(sed·OpenRewrite·Scalafix 등). shift 정의는 YAML로 GitHub에 둔다. shift를 시작하거나 바꾸는 것 자체가 PR과 리뷰를 거친다. 개별 PR이 아니라 \"변경 규칙\"을 사람이 리뷰하는 구조다. ② 대상을 고른다 GitHub 검색이나 BigQuery(전 소스코드를 매일 적재)로 대상 저장소를 뽑는다. ③ 실행 → PR Kubernetes 작업이 저장소를 복제하고, 이미지를 돌리고, 커밋하고, PR을 연다. ④ 자동 머지 조건 자동 머지 여부는 변경을 만든 쪽이 정한다 (저장소 주인이 아니라). 조건은 \"모든 테스트와 검사 통과\". 저장소 주인 팀의 근무 시간에만 머지한다. 주말·휴일에는 하지 않고, 머지 속도도 조절한다. 저장소 주인은 끌 수 있다(opt-out). 끄려면 사유를 적고, 가능하면 만료일도 둔다. 2023년 기준 수천 개 중 약 50개만 껐다. 컴포넌트마다 \"자동 머지할 만큼 테스트·헬스체크가 있는가\"를 점수(Soundcheck)로 관리한다. ⑤ 조금씩 넓힌다 (코호트) 처음에는 중요도가 낮은 저장소부터 켰다. 저장소를 묶음(코호트)으로 나눠, 앞 묶음에서 배포 성공이 기준 이상이어야 다음 묶음에 넣는다. ⑥ 머지 후 감시 (Firewatch) 배포·파이프라인 이벤트를 모아, 자동 머지된 커밋이 배포 실패와 너무 자주 겹치면 주인 팀에 알린다. 문제가 생기면 코호트 진행을 멈춘다. 단계별로 — Honk (AI 에이전트 변경) ① 사람이 쓰던 변환 스크립트 자리에 에이전트를 넣는다 대상 선정·PR 생성·머지는 Fleetshift가 그대로 맡고, 코드 수정만 에이전트가 한다. 에이전트 도구는 일부러 적게 준다: verify 도구 하나, 제한된 Git, 허용 목록 안의 Bash만. 코드 검색·문서 도구는 주지 않는다. 프롬프트 원칙: 끝 상태를 정의하라(가능하면 테스트로), 한 번에 하나만 바꿔라. ② 검증 세 겹 결정적 검증기 : 저장소 내용에 따라 자동으로 붙는 포맷터·린터·테스트. 에이전트는 어떤 빌드 시스템이 도는지 모르고 verify 만 부른다. 하나라도 실패하면 PR을 열지 않는다. LLM 심판 : 변경과 원래 지시를 보고 \"시킨 것만 했나\"(멋대로 리팩터링하거나 불안정한 테스트를 꺼 버리지 않았나)를 본다. 세션의 약 1/4을 거부했고, 그중 절반은 에이전트가 스스로 고쳤다. 2026년 발표에서는 결국 LLM 심판을 뺐다고 했다. CI 검증 서비스(2026) : 브랜치를 올려 여러 CI를 돌리고, 실패를 요약해 에이전트에게 돌려준다. CI를 통과해야 PR을 만든다. ③ 머지 PR은 코드 주인에게 리뷰를 보낸다. 발표: \"In some cases... we can even auto-merge\", 그러나 \"The question is which? This is a hard question, and it's not fully answered.\" 데이터셋 이전(Part 4)에서는 테스트가 거의 없는 저장소라 주인 팀이 직접 확인한 뒤 머지했다. 숫자와 그 정의 숫자 정의 출처 250만+ Fleet Management로 머지된 자동 유지보수 PR 누적. \"대부분 사람 없이 자동 머지\" 2026 블로그 27만 건 중 77% 자동 머지, 11% 사람 머지 2022년 Fleetshift가 만든 PR 2023 블로그 Spotify 전체 PR의 약 절반 2024년 중반 이후 Fleet Management가 만든 PR 비중(AI 한정 아님) Honk Part 1 1,500+ 머지된 Honk(AI) PR 누적, 2025-11 Honk Part 1 약 1/4 LLM 심판이 거부한 에이전트 세션 비율 Honk Part 3 주의할 점 자동 머지 250만 건은 대부분 규칙 기반 변경이다. AI가 만든 PR을 얼마나 자동 머지하는지는 공개되지 않았다. 2026년에 자동 의존성 업그레이드가 \"검사를 다 통과했는데 프로덕션에서 실패\"한 사고가 있었다. 대응으로 안전장치 강화, 되돌리기 용량 확대, 주인 팀 근무 시간 안에만 자동 변경을 넣도록 했다. 공부 자료 📄 Fleet Management Part 1: fleet-first 사고방식 (2023) · Part 3: 전사 일괄 리팩터링 — 자동 머지 규칙 ← 자동 머지 조건은 여기가 핵심 📄 Honk 연재: Part 1 (1,500+ PR) · Part 2 컨텍스트 · Part 3 피드백 고리 — 검증기·LLM 심판 · Part 4 데이터셋 이전 📄 속도가 빨라진 뒤 품질 문제와 대응 (2026-09) · InfoQ 기사 🎥 InfoQ 발표 「Rewriting All of Spotify's Code Base, All the Time」 (44분) — LLM 심판을 뺀 이유, 자동 머지가 열린 질문인 이유 🎥 Code with Claude 세션 「Coding is no longer the constraint」 · 블로그판 4. Google 대규모 변경(LSC) — \"리뷰를 없애지 않고, 한 명에게 몰아 도구로 본다\" AI 이전부터 있던 체계다. 하나의 API를 바꾸느라 수천 개 파일을 고쳐야 할 때 쓴다. 엄밀히는 자동 머지가 아니지만, \"사람 리뷰 부담을 구조적으로 줄이는 방법\"의 원형 이라 같이 본다. 단계별로 ① 승인 (위원회) 짧은 문서(이유, 예상 영향, FAQ)를 써서 약 12명으로 된 위원회 메일링에 올린다. 바뀌는 API 주인의 검토도 받는다. 위원회의 흔한 결정: \"이 LSC의 리뷰는 전부 한 명의 전사 승인자(global approver)에게 보내라.\" ② 변경 생성 (도구) \"LSCs at Google are almost always generated using automated tooling.\" ClangMR, Refaster 같은 컴파일러 기반 도구로 만든다. 생성기는 다시 돌릴 수 있어야 한다. 그사이 누군가 옛 방식으로 다시 쓰면 재실행으로 흡수한다. ③ 쪼개기 (Rosie) Rosie가 큰 변경을 프로젝트 경계와 소유 규칙에 따라 따로 제출 가능한 조각(shard)으로 나눈다. 조각마다 테스트 → 리뷰 메일 → 제출 파이프라인을 따로 탄다. ④ 테스트 (TAP 열차) 3시간마다 출발하는 \"열차\": 변경마다 무작위 테스트 1,000개 → 통과한 것들을 하나로 묶음 → 영향받는 테스트 전체 실행(6시간 넘게 걸리기도 함) → 실패하면 범인 변경 찾기 → 변경별 보고서. 이 보고서가 \"제출해도 안전하다\"는 증거가 된다. 최근 불안정한(flaky) 테스트는 자동 제출 판단에서 무시한다(요약 기준). ⑤ 리뷰 원칙: \"all changes need to be reviewed before submission, and this policy applies even for LSCs.\" — LSC도 리뷰는 한다. 이유: \"for most mechanical LSCs, it's cheaper to have a single expert understand the nature of the change and build automation around reviewing it properly.\" 전사 승인자는 패턴 기반 도구로 조각을 훑고, 병합 충돌이나 도구 오작동으로 이상해진 일부만 직접 본다(요약 기준). Chromium 판: 요청자에게 임시 전사 승인 권한을 주지만, \"Each CL will still need a second human to review it\" — 동료 한 명이 훑어보고 일괄 +1. 끝나면 권한을 회수한다. ⑥ 정리 조각은 \"가축(cattle)\"처럼 다룬다. 이름 없는 커밋이라 되돌리거나 버려도 도구로 다시 만들면 된다. 옛 API를 새로 쓰면 리뷰 시점에 경고(Tricorder)를 띄워 되돌아가는 것을 막는다. AI가 끼어든 뒤 (Google Research 블로그, 2024) 같은 흐름에서 \"변경 생성\" 칸을 사내 코드로 미세조정한 Gemini가 맡았다. 생성된 변경은 컴파일·단위 테스트로 검증하고, 통과한 것만 엔지니어에게 보여 준다. 엔지니어가 빠르게 확인·수정한 뒤 조각으로 나눠 각 영역 주인에게 리뷰를 보낸다. 사람 리뷰는 그대로다. 수치: 머지된 변경의 80%가 AI 작성(단위 미정의, 한 작업 사례), 총 시간 약 50% 감소(엔지니어 자기 추정). 2026년 Google Cloud CTO실 글 — 반대 방향의 신호 \"The bottleneck didn't disappear. It moved from the code to the people reviewing it.\" — 병목은 사라지지 않고 리뷰하는 사람에게 옮겨 갔다. 사람 리뷰는 유지하되 PR마다 AI 요약·위험 평가를 붙이고, 테스트 통과를 조건으로 미리 승인하는 \"조건부 LGTM\"을 쓴다. 승인 피로 경고: \"developers start clicking 'Approve' reflexively.\" 한 팀의 경험담이지 Google 전체 정책은 아니다. 주의할 점 SWE at Google 책은 2018~2020년경 관행이다. 지금은 바뀌었을 수 있다. 책 22장 후반부(리뷰 세부, 되돌리기, 불안정 테스트)는 원문이 잘려 요약으로만 확인했다. LSC의 리뷰 시간·결함률 수치는 공개되지 않았다. 공부 자료 📄 Software Engineering at Google 22장 Large-Scale Changes — 「Authorization」 · 「Sharding and Submitting」 · 「Riding the TAP Train」 · 「Code Review」 절 📄 Chrome Large Scale Changes — 짧고 절차가 구체적이다 📄 Google Research: Accelerating code migrations with AI 📄 Google Cloud: When AI writes the code, who reviews it? 5. Anthropic Claude Code 팀 — \"AI 리뷰는 모든 PR에, 사람 리뷰는 위험할 때만\" Claude Code(CLI 도구)를 만드는 팀의 운영기다(Osmani 외 2026). 이 팀 코드의 약 90%를 Claude가 쓴다. 글은 팀 하나의 사례 이고 Anthropic 회사 전체 정책이라고 하지 않았다. 06장의 Claude Code Review(2026-03) 글은 리뷰 제품 이야기이고, 이 글은 그 리뷰를 머지 결정에 어떻게 엮었는지를 다룬다. 단계별로 ① PR 전 자체 점검 (관문 아님) Claude가 테스트·빌드·린트를 돌린다. 새 컨텍스트의 두 번째 에이전트가 diff를 한 번 더 본다. 습관이지 머지를 막는 관문은 아니다. ② 필수 CI \"Lint, types, tests across platforms, build and packaging. Red blocks the merge.\" — 하나라도 빨간불이면 머지할 수 없다. ③ AI 리뷰 — 모든 PR 여러 에이전트가 따로 버그를 찾고, 검증 에이전트들이 지적마다 투표한다. 합의된 지적만 PR에 단다. 태그 세 가지: Important (머지 전에 고칠 버그), Nit (사소함, 머지를 막지 않음), Pre-existing (이 PR이 만든 게 아니라 원래 있던 버그). 지적마다 고치거나, 이유를 적고 스레드를 닫아야 머지된다. ④ 보안 리뷰 별도로 돈다. \"Open findings from either review block the merge.\" — 두 리뷰 어느 쪽이든 열린 지적이 있으면 머지가 막힌다. ⑤ 위험 등급 → 필요한 사람 승인 수 등급 예 사람 승인 LOW 문서, 문구, 사내 전용 기능, 플래그 뒤에 숨긴 추가형 변경 0명 — 자동 리뷰·보안 검사가 초록이면 끝 MEDIUM 일반 제품 변경, 캐싱·자동 업데이트·시스템 프롬프트 같은 민감 영역 1명 HIGH 가장 위험한 코드, 항상 두 명이 필요한 경로 2명 분류기가 두 개 다. 하나는 등급을 고르고, 다른 하나는 \"등급상 필요 없어도 사람이 봐야 하나\"를 따로 본다. 분류기가 어떻게 판단하는지는 공개하지 않았다. 등급과 상관없이 항상 사람: 코드 주인이 민감하다고 지정한 경로, CI 워크플로 파일. 가벼운 경로는 저장소 신뢰 목록에 있는 작성자 (주로 그 영역을 맡은 팀)만 탈 수 있다. \"An agent's approval never counts as a person's\" — AI 승인은 사람 승인으로 치지 않는다. 에이전트에게 일을 시킨 사람이 필요한 리뷰어 한 명으로 계산된다. 승인은 특정 커밋에만 유효하다. 새 커밋이 들어오면 다시 승인받는다. ⑥ 머지 큐 · 플래그 머지 큐가 최신 main 위에서 검사를 다시 돌린다. 각자는 통과한 두 PR이 합쳐져 깨지는 것을 막는다. 새 동작은 플래그 뒤에 숨겨 사내 → latest → stable 순으로 내보낸다. ⑦ 롤백 플래그는 배포 없이 끈다. 깨진 빌드는 되돌린다. 주간 온콜이 있다. AI 리뷰어 자체를 어떻게 채점하나 이 장에서 리뷰어 평가 방법을 구체적으로 공개한 유일한 사례 다. 05장의 정답지 네 방식과 견줘 볼 만하다. 사고 PR = 정답지 : \"Any incidents are now an eval.\" 사고를 내서 되돌리거나 급히 고친 과거 PR을 모으고, 그 코드를 아는 엔지니어가 버그와 위치를 확정 한다. 사고가 날 때마다 케이스가 늘어난다. 매일 전체 채점 : 리뷰어의 프롬프트·도구·모델을 바꾸면 이 세트로 채점해서, 점수가 오르면 유지하고 아니면 버린다. 소음도 잰다 : 지적마다 작성자 반응을 넷으로 나눈다 — 고침 / 틀린 지적이라고 함 / 의도된 동작이라고 함 / 상관없다고 함. 문제없는 PR에도 돌려서, 괜히 코드를 바꾸게 만드는 지적이 몇 개 나오는지 센다. 우선순위: \"catching real bugs first and cutting review rounds second\" — 실제 버그를 먼저, 리뷰 횟수 줄이기는 그다음. 리뷰가 끝없이 반복되는 문제 CLI PR 하나가 밤새 50번 넘게 리뷰·수정을 반복했다. git blame으로 보니 리뷰어가 계속 짚은 코드의 약 59%가 첫 리뷰 때부터 있던 코드 였다. 새 버그를 찾는 게 아니라 옛 버그를 매번 조금씩 더 찾고 있었다. 고친 방법: 3라운드가 지나면 작성자에게 접근 방식을 다시 생각하라고 한다 · 몇 번 지나면 새로 바뀐 diff만 본다 · 버그를 종류 단위 로 짚어 같은 문제를 한 번에 다 고치게 한다 · 이미 단 지적은 반복하지 않는다. 이후 재현율과 함께 \"통과까지 라운드 수\"도 지표로 본다. 숫자와 그 정의 숫자 정의 주의 머지된 PR 2배 이상 6월 → 9월 원 건수 비공개 되돌림 비율 40% 이상 감소 같은 기간, 상대 감소 절대 비율 비공개 1라운드 통과 65% → 78% 반복 문제를 고친 전후 기간 미표기 5라운드 이상 8.9% → 1.5% 같음 기간 미표기 통과까지 평균 리뷰 2.08 → 1.32회 같음 기간 미표기 실질 코멘트를 받은 PR 16% → 54% 리서치 프리뷰 출시 전후, 사내 PR 06장의 3월 글과 같은 수치 하루 변경 약 2,500 → 30,000 이상 5월 → 9월, Anthropic 모노레포 (Claude Code 저장소 아님) 별도 글 인용 주의할 점 전부 자기 보고다. 원 건수, 정답지 세트 크기, 59%의 표본 크기가 없다. 머지 수 증가와 되돌림 감소가 이 체계 덕분인지는 가를 수 없다. 같은 기간에 모델도 바뀌었다. 글이 직접 밝힌 빈칸: \"We don't yet have circuit breakers that tighten approval when those numbers move\" — 지표가 나빠지면 승인 요건을 자동으로 올리는 장치가 아직 없고, 엔지니어들은 사람 없는 머지를 늘리기 전에 그것이 필요하다고 본다. 나쁜 머지를 알아채는 일은 여전히 작성자·온콜·대시보드에 달렸다. 그래도 사람이 하는 일: 무엇을 만들지(방향·취향·범위), 결제·자동 업데이트·CI 같은 위험 코드 리뷰, 아키텍처 리뷰, 증거 읽기, 결과 책임. 공부 자료 📄 How the Claude Code team does code review (claude.dev, 2026-10-15) — 14분 분량. 「위험 등급」 표와 그림 C(정답지 채점), 그림 D(라운드 수치)가 핵심 📄 06장의 Claude Code Review (2026-03) — 리뷰 제품 쪽 이야기 6. Rewind — \"AI는 찾고, 코드가 판정하고, 사람은 규칙을 고친다\" SaaS 백업 회사 Rewind의 기술 운영 쪽이 쓴 글이다(Rewind 2026). 하루 약 40건, 월 1,000건 넘는 PR을 머지하는데 리뷰가 병목이 되자, 위험 낮은 PR은 AI 승인만으로 통과 시키게 했다. 저장소 400개 이상, 실제로 켠 기간은 아직 짧다. 먼저 알아 둘 것: 자동 승인 ≠ 자동 머지. 봇은 GitHub 승인을 남길 뿐이고 CI·브랜치 보호는 그대로다. 머지는 엔지니어가 하거나, 엔지니어가 GitHub 자동 머지를 켜 두었으면 GitHub가 한다. 단계별로 ① 리뷰어를 영역별로 쪼갠다 전문 리뷰어 10여 개가 병렬로 돈다: 정확성 · 보안/테넌트 격리 · 테스트 적정성 · 영향 범위 · 되돌리기 쉬움 · 성능 · 운영 가능성 · IaC · DB 마이그레이션 · GitHub Actions · 공급망(의존성) · (해당 저장소만) 백업 정확성. 모든 리뷰어가 같은 질문 하나만 던진다: \"If this is wrong in production, what user-facing behavior breaks?\" — 운영에서 틀리면 사용자에게 무엇이 깨지나. 스타일·이름 짓기 지적은 금지한다. diff에 자기 영역이 없으면 그 리뷰어는 돌지 않는다. 지적마다 심각도와 확신도를 붙인다. ② 등급은 줄 수가 아니라 \"무엇을 찾았나\"로 등급은 LOW / MEDIUM / HIGH. 영향이 큰 영역의 리뷰어가 지적을 하나만 내도 줄 수와 상관없이 HIGH다. 예: 5천만 행 테이블에 인덱스를 추가하는 12줄 마이그레이션은 \"가장 위험한 것 중 하나\". 재생성한 API 클라이언트 3,000줄은 안전할 수 있다. 크기는 딱 한 곳에만 쓴다: 약 1만 줄이 넘으면 AI에게 아예 맡기지 않는다. 위험 신호가 아니라 \"사람이든 기계든 그만큼은 머리에 담을 수 없다\"는 한계라서다. ③ 판정은 모델이 아니라 일반 코드가 한다 판정 엔진은 \"ordinary, unit-tested code, not a model\" — 단위 테스트가 있는 TypeScript 수백 줄이다. 입력: 리뷰어 지적 + 정책 파일. 출력: 등급, 그리고 APPROVE / REQUEST_CHANGES / NEEDS_HUMAN 중 하나. REQUEST_CHANGES(수정 요청)는 사람에게 넘기는 것이 아니다. 사람에게 가는 것은 NEEDS_HUMAN뿐이다. 이유: \"이 PR 왜 승인됐어?\"에 설정 파일과 코드로 답할 수 있어야 한다. GitHub Copilot 리뷰를 필수 검사로 걸었더니 \"이 PR을 리뷰할 수 없습니다\" 같은 문구로 좋은 승인까지 막았다. 지금은 참고용으로만 보여 주고 판정에는 넣지 않는다. ④ \"항상 사람\" 경로 목록 인증·인가·시크릿·암호화, 그리고 앞으로 누가 승인할 수 있는지를 바꾸는 것 은 항상 사람이 본다. 만든 방법: AI가 저장소마다 수상한 경로를 훑어 목록을 제안 → 사람이 저장소마다 검수해서 맞는 것은 남기고 놓친 것은 더한다. 공통 템플릿은 쓰지 않았다. 보관: YAML 파일 하나, CODEOWNERS로 보호. 판정 엔진도 이 규칙은 뒤집지 못한다. 사람은 언제든 /request-jedi-review 를 달아 자동 승인을 멈출 수 있다. ⑤ 숫자로 검증하는 세 단계 단계 한 일 본 숫자 만들기 전 과거 PR 수천 건을 모의 리뷰에 돌림 자동 승인 비율, 실제로 머지한 사람과 판단이 갈린 곳, PR당 비용(약 $0.73 예측 → 실제와 비슷) 섀도 1주 400개 넘는 저장소의 모든 PR에 판정만 달고 아무것도 막지 않음 사람과 일치율 90% 이상 이어야 켬 실제 적용 일부 조직은 전 저장소, 나머지는 고른 저장소만 일치율, 그리고 (요약 기준) 사고·되돌림. 기준을 못 넘으면 확대를 멈춤 ⑥ 반응을 모아 사람이 규칙을 고친다 엔지니어가 봇 코멘트에 👍 / 👎 / 🤔를 단다. 주간 요약으로 모은다. EM이나 테크 리드가 순번으로 주 30분 읽고, 규칙을 유지 / 끄기 / 프롬프트 폐기 중에서 정한다. 결정은 일반 PR로 낸다. \"The bot never edits its own prompts or policy.\" — 봇은 자기 프롬프트·정책을 직접 고치지 않는다. 끈 규칙은 90일 뒤 자동으로 다시 켜진다. 계속 끄려면 다시 근거를 대야 한다. 반응이 나빴던 한 주 때문에 진짜 문제 유형이 영영 묻히지 않게 하려는 것이다. ⑦ 실패 시나리오 평가 망가질 수 있는 경우 13개를 뽑아 가능성 × 최악의 영향을 매기고, 완화책과 남는 위험을 적었다. 13개 모두 완화 후 Low 또는 Minimal. 영향 큰 것은 보완 통제를 적고 서면으로 위험을 수용했다. 글에 나온 7개: 결함 있는 PR 승인 · 악성 PR 승인 · 봇 자격증명 탈취 · 모델 업그레이드 뒤 판단력이 몰래 떨어짐 · 끈 규칙이 쌓임 · 정책 파일 변조 · 작지만 중요한 위험을 놓침. 숫자와 그 정의 숫자 정의 주의 약 40% 자동 승인(APPROVE)으로 나온 PR 비율. 목표는 30~40% 사내 라이브러리 버전 올리기(기계적 1줄 PR)가 많아 높게 나왔다고 글이 직접 밝힘 0건 봇 승인 PR과 연결된 되돌림·사고 기간이 섀도 1주 + 실제 적용 1주 약 99% 봇이 승인했는데 사람도 따로 리뷰한 PR에서 사람이 봇 판단에 동의한 비율 사람이 따로 본 PR만의 값 약 $0.73 PR당 평균 비용 편차가 크다고 함 주의할 점 글쓴이가 직접 숫자를 \"directional (small sample, still expanding)\" — 방향만 보라고 했다. 정책 목록을 저장소마다 사람이 손으로 검수했다. 그 작업 없이 일반화된다고 하지 않았다. 글 끝부분 약 20%(작성자 이름, 승격 지표 일부, 90일 목표)는 원문이 잘려 요약으로만 확인했다. 근거 원장에 표시했다. 공부 자료 📄 Review is the bottleneck now: How we let AI approve pull requests (safely) (Rewind, 2026-06-01) — 22분 분량. 판정 엔진 분리, 섀도 단계, 주간 루프 절이 핵심 7. 비교용 — 사람이 머지하는 곳, 아직 제안 단계인 곳 Stripe Minions — 에이전트가 PR까지, 머지는 사람 매주 1,300건 넘는 PR을 사람이 코드 한 줄 안 쓰고 에이전트가 만든다. 그래도 \"human-reviewed\" 다. Slack에서 에이전트를 부른다. 인터넷·프로덕션과 격리된 개발 서버(약 10초 만에 준비)에서 확인 없이 전권으로 작업한다. \"청사진(blueprint)\": AI 단계(\"작업 구현\", \"CI 실패 고치기\")와 고정 단계(\"린터 실행\", \"푸시\")를 코드로 엮은 흐름. 로컬 린트(5초 이내)를 먼저 통과시킨다. CI는 최대 두 번 만. 그래도 안 되면 사람에게 넘긴다(비용 때문). 엔지니어가 PR을 열고 다른 엔지니어에게 리뷰를 요청 한다. 📄 Minions Part 1 · Part 2 🎥 How I AI 에피소드 (YouTube) — 22:04 「1,300 AI PR을 어떻게 리뷰하나」(내용 미확인) Rootly — \"이미 사람이 형식적으로 승인하고 있다\"는 데이터에서 출발한 제안 자기 저장소 PR 3,661건을 봤더니 90.5%가 사람 코멘트 하나 없이 승인 됐다. 24.4%는 시간당 500줄 읽기 속도보다 빨리 승인됐다. 제안: 아래 셋을 모두 만족할 때만 AI가 승인한다. 위험 라벨 risk:low 를 리뷰어가 확인 현재 커밋 기준 리뷰 점수 5점 만점 민감 경로(마이그레이션, 인증·권한, 결제, CI·배포 설정, 의존성)를 건드리지 않음 안전장치: 결정적 자격 규칙, 새 푸시가 오면 승인 무효, 배포 관문은 그대로, 끄는 스위치. 아직 그림자 운영(shadow mode)도 시작하지 않았다. 같은 글이 인용한 다른 회사(원문 미확인): Ona(첫 승인까지 3시간 → 4분 미만, 머지는 사람), Intercom(19% 이상 자동 승인). Rewind는 원문을 읽고 이 장 6절에 따로 정리했다. 📄 Rootly: When should AI be allowed to approve a pull request? 단계별로 나란히 보기 단계 xAI Grok Bot Meta RADAR Spotify Fleet Google LSC Anthropic Claude Code 팀 Rewind 대상 고르기 공개 안 됨 (\"영향 범위가 작은 것\") 출처별 자격 + 금지 목록 + 위험 점수 백분위 변경을 만든 쪽이 자동 머지 여부 지정, 저장소는 opt-out 위원회 승인 분류기 2개가 위험 등급, 신뢰 목록 작성자만 리뷰가 찾은 것으로 등급, 1만 줄 초과는 제외 기계 검사 금지 패턴 린트, 타입, 테스트, 앱 실행, 형식 검증 CI 상태, 금지 문구·파일 패턴 저장소별 테스트·검사 TAP 열차(영향 테스트 전체) 필수 CI, 머지 큐에서 재검사 기존 CI·브랜치 보호 그대로 AI 리뷰 있음(가이드) LLM이 안전/위험 신호 분류, 8/10 이상 AI PR만: LLM 심판(이후 제거) 없음(AI는 생성 쪽) 다중 에이전트 + 투표, 보안 리뷰 별도. 열린 지적이 있으면 막음 영역별 리뷰어 10여 개, 판정은 일반 코드 사람 조건 밖이면 검증 산출물을 본다 실패하면 사람, 일부는 사후 리뷰 AI PR은 코드 주인 리뷰 전사 승인자가 이상한 것만 MEDIUM 1명·HIGH 2명, 민감 경로 항상 NEEDS_HUMAN만, 정해진 경로 항상 머지 후 감시 되돌림 비율, 출시 후 퍼징 되돌림·장애 비율 배포 실패 상관(Firewatch), 코호트 정지 되돌리기 쉬운 조각 되돌림 비율, 플래그 끄기, 온콜 봇 승인과 연결된 되돌림·사고 실수 → 규칙 교정마다 린트·검사로 장애 낸 런북 금지 목록 사고 후 안전장치·근무 시간 제한 옛 API 재사용 경고 사고 PR을 리뷰어 정답지에 추가 반응 주간 요약 → 사람이 PR로 규칙 수정, 끈 규칙 90일 만료 반복해서 보이는 것 (관찰, 권고 아님) \"무엇을 자동 머지할지\"를 개별 PR이 아니라 상위 단위에서 정한다. Meta는 런북·변환 스크립트 단위로 신뢰를 쌓고, Spotify는 shift 정의를 리뷰하고, Google은 LSC 단위로 승인한다. xAI는 이 부분이 공개되지 않았다. 기계 검사를 먼저 두껍게 한다. 자동 머지를 넓힌 곳일수록 린트·테스트·실행 검증에 투자를 많이 했다고 말한다(xAI: 토큰 대부분을 검증에). 하나라도 걸리면 사람에게. Meta, Rootly 제안, Anthropic(열린 지적·민감 경로), Rewind(HIGH 지적 하나면 HIGH) 모두 \"모든 조건 통과\"일 때만 자동이고, 실패는 사람 리뷰로 간다. AI의 판단과 머지 결정을 떼어 놓는다. Rewind는 AI가 지적만 내고 판정은 테스트가 있는 일반 코드가 한다. Anthropic은 AI 승인을 사람 승인으로 세지 않는다. Meta도 마지막 판정은 점수 기준(8/10, 백분위)이다. \"항상 사람\" 목록을 따로 둔다. Anthropic(주인이 지정한 민감 경로·CI 파일), Rewind(인증·시크릿·승인 규칙, CODEOWNERS로 보호), Rootly 제안(마이그레이션·결제 등). 안전 지표로 되돌림 비율을 쓰지만, 이 지표는 일부 실패를 놓친다. 나중 PR로 고친 버그, 되돌리지 않고 넘어간 품질 저하는 잡히지 않는다. 그리고 안전한 것만 골랐으니 낮게 나오는 것이 당연하다(선택 편향). 조금씩 넓힌다. Spotify(중요도 낮은 저장소부터, 코호트), Meta(P25 → P50), Rewind(과거 PR 모의 실행 → 섀도 1주에 사람과 90% 일치 → 일부 저장소), Rootly(그림자 운영부터). 리뷰어 자체의 채점 방법은 거의 공개되지 않는다. 구체적으로 밝힌 곳은 Anthropic(사고 PR을 정답지로 매일 채점)과 Rewind(사람 판단과의 일치율)뿐이다. AI가 쓴 일반 제품 코드를 넓게 자동 머지한다고 밝힌 곳은 xAI뿐이다. Anthropic Claude Code 팀은 LOW 등급(문서·사내 기능·플래그 뒤 추가형 변경)으로 범위를 좁혔다. Spotify는 AI PR 자동 머지를 \"아직 답이 없는 질문\"이라고 했고, Stripe·Google은 사람 리뷰를 유지한다. 스스로 판단할 질문 우리 팀에서 \"사람이 이미 형식적으로 승인하고 있는\" PR은 얼마나 되나? Rootly처럼 실제 데이터를 먼저 볼 수 있나? 자동 머지 대상을 개별 PR 단위로 고를 것인가, 변경 종류·생성기 단위로 고를 것인가? 자동 머지 전에 반드시 있어야 할 기계 검사는 무엇인가? 지금 우리 저장소의 테스트로 충분한가? \"민감 경로\" 목록에는 무엇이 들어가야 하나? (마이그레이션, 인증, 설정, 의존성…) 머지 후 무엇으로 감시할 것인가? 되돌림 비율이 놓치는 실패는 어떻게 볼 것인가? 선택 편향을 어떻게 피할 것인가? 자동 머지한 변경과 비교할 대조군을 둘 수 있나? 에이전트가 실수했을 때 프롬프트를 고칠 것인가, 린트·검사로 만들 것인가? 머지 판정을 모델에게 맡길 것인가, Rewind처럼 지적을 입력으로 받는 일반 코드로 만들 것인가? \"이 PR 왜 승인됐어?\"에 어떻게 답할 것인가? AI 리뷰어 자체는 무엇으로 채점할 것인가? Anthropic처럼 과거 사고·되돌림 PR을 정답지로 모을 수 있나? 우리 팀에 그런 PR이 몇 건이나 있나? 반응·리뷰 코멘트로 규칙을 고칠 때, 고치는 주체는 누구인가(사람이 PR로 / 봇이 스스로)? 끈 규칙은 언제 다시 볼 것인가? 공부 순서 (추천) 🎥 Lauren Tan 발표(17분) — 전체 그림을 가장 빨리 잡는다 📄 Spotify Fleet Management Part 3 — 자동 머지 조건이 가장 구체적이다 📄 Meta RADAR 논문 2장과 그림 3 — 거름망을 여러 겹으로 쌓는 법 📄 Chrome LSC 문서 → SWE at Google 22장 — AI 이전의 원형 📄 Rewind 글 — 판정 엔진 분리와 섀도 검증 단계가 가장 구체적이다 📄 Anthropic Claude Code 팀 글 — 위험 등급과 리뷰어 채점(사고 PR 정답지) 📄 Rootly 글 — 우리 데이터로 시작하는 법 🎥 Spotify InfoQ 발표 — AI PR 자동 머지가 왜 아직 어려운가 출처 xAI Lauren Tan, 「All Code Is Slop (Except Mine)」, AI Engineer CODE 2026-11 — https://www.youtube.com/watch?v=O_zcc6Xl12g · https://ai.engineer/talks/O_zcc6Xl12g-all-code-is-slop-except-mine · https://ai.engineer/code/2026/talks/lauren-tan (C) Lingxi Li, 「Grok Bot for Engineering」, 2026-09-10 — https://x.ai/bot/guides/grok-bot-for-engineering (D, 제품 안내) XiaoHu.AI — https://xiaohu.ai/en/article/lauren-tan-agent-code-quality/ · Paul Kuo — https://paulkuo.tw/en/articles/agent-mistakes-into-checks/ (D, 2차 요약) Meta RADAR, arXiv 2605.30208v1, 2026-05-28 — https://arxiv.org/html/2605.30208v1 (D, 게재처 표기는 있으나 미확인) 해설 — https://terencecho.github.io/research-explained/radar/ (D) · 비판 — https://abovethemodel.substack.com/p/approval-drift-when-ai-moves-faster (D, 의견 글) Spotify Fleet Management 2023 — https://engineering.atspotify.com/2023/04/spotifys-shift-to-a-fleet-first-mindset-part-1 · https://engineering.atspotify.com/2023/05/fleet-management-at-spotify-par otly.com/blog/when-should-ai-be-allowed-to-approve-a-pull-request (B) 제외: monday.com AWS 블로그 — 본문을 수집하지 못해 수치를 확인하지 못했다 "}, {"id": "08", "dir": "08-실사용-지표와-사람-요인", "title": "08. 실사용(온라인) 지표와 사람 요인", "level": "사례→심화", "html": "<h1>08. 실사용(온라인) 지표와 사람 요인<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-19<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-25<\/li>\n<li><strong>수준<\/strong>: 사례 → 심화<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A7-static-analysis-human-factors.md\">wave-1 A7<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A9-counter-brief.md\">wave-1 A9<\/a><\/li>\n<\/ul>\n<h2>이 장에서 답하는 질문<\/h2>\n<p>에이전트가 실제 팀에서 쓰일 때 \"잘하고 있다\"는 무엇으로 재나? LLM 이전에 개발자에게 자동 코멘트를 달아 온 정적분석 도구는 무엇을 배웠나? 개발자는 자동 코멘트에 어떻게 반응하나?<\/p>\n<hr />\n<h2>1. LLM 이전의 교훈 — 정적분석 도구 배포<\/h2>\n<p>자동 리뷰 봇은 새것이 아니다. 정적분석 도구가 10년 넘게 리뷰에 코멘트를 달아 왔다.<\/p>\n<h3>Google Tricorder (Sadowski 외, ICSE 2015 · CACM 2018)<\/h3>\n<ul>\n<li><strong>\"유효 오탐(effective false positive)\"이라는 정의<\/strong>: 도구가 기술적으로 맞았든 틀렸든, <strong>\"사용자가 아무 조치도 하지 않기로 한 보고\"<\/strong>는 모두 오탐으로 센다. 개발자가 행동하지 않으면 가치가 없다는 관점이다.<\/li>\n<li><strong>Not useful 비율<\/strong> = NU / (NU + PF + AF), 즉 \"Not useful\" 클릭 / (\"Not useful\" + \"Please fix\" + \"Apply fix\" 클릭). <strong>10% 이상이면 관찰 대상, 25%를 넘으면 끌 수 있다.<\/strong><\/li>\n<li>전체 Not useful 비율은 약 5%(관찰 대상 제외 시 4% 미만)였고, 가장 좋은 분석기는 0~3%였다. 하루 5만 건 이상 분석에 Not useful 클릭은 약 250건이었다.<\/li>\n<li><strong>10%라는 기준의 출처<\/strong>: CACM 2018 논문은 이 값이 \"첫 저자가 다소 <strong>임의로<\/strong> 처음 정했다\"고 밝혔다. Tricorder 논문은 10%가 Coverity 기준과 \"맞는다\"고 했지만, Coverity 원문은 \"안정된 검사기는 20% 미만, 30% 이상이면 쉽게 문제가 된다\"고 했다. → <strong>경험칙이지 측정된 상수가 아니다.<\/strong><\/li>\n<li><strong>클릭의 한계<\/strong>: 클릭 없이 고치는 사람, 클릭 대신 무시하는 사람, 실수 클릭이 있다. 저자들 스스로 \"불완전한 척도\"라고 했다. 매번 맞는 검사기에도 사람들이 주 1회꼴로 \"Not useful\" 버그를 올렸다 → <strong>개발자 반응도 정답이 아니다.<\/strong><\/li>\n<li><strong>Fin
