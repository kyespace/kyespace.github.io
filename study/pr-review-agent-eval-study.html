DORA 2024에서 AI 도입 +25%당 처리량 −1.5%, 안정성 −7.2%와 연관되었다(상관). 2025년에는 처리량이 개선되었지만 불안정성은 남았다.<\/li>\n<li><strong>단일 지표로는 생산성을 못 잡는다<\/strong>: SPACE 프레임워크(Forsgren 외 2021, C, 2차 확인).<\/li>\n<\/ul>\n<h2>반론 7. 리뷰의 주된 가치는 결함 찾기가 아닐 수 있다<\/h2>\n<ul>\n<li>Bacchelli &amp; Bird: 리뷰는 \"기대보다 결함에 관한 것이 적었다\". 지식 전달을 첫째 동기로 꼽은 개발자는 8%뿐이었지만, 인터뷰 대상자는 한 명을 빼고 모두 지식 전달을 언급했다.<\/li>\n<li>Czerwonka: \"사회적 측면은 … 무시할 수 없다\". 리뷰어의 유용성이 33% → 67%로 오르는 학습 곡선 자체가 지식 확산의 증거라는 해석이 있다.<\/li>\n<li>Sadowski(Google): 교육, 규범 유지, 문지기, 사고 예방.<\/li>\n<li>→ <strong>결함 정답지 기반 P·R·Fβ는 이 가치들을 보지 못한다.<\/strong><\/li>\n<\/ul>\n<hr />\n<h2>반론이 반박된 경우 요약<\/h2>\n<table>\n<thead>\n<tr>\n<th>반론<\/th>\n<th>재반론<\/th>\n<th>현재 상태<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"리뷰는 버그를 못 찾는다\" (Czerwonka)<\/td>\n<td>코멘트 비율 ≠ 탐지율<\/td>\n<td>둘 다 성립하는 해석<\/td>\n<\/tr>\n<tr>\n<td>METR −19%<\/td>\n<td>METR 2026 +18%(매우 약한 증거)<\/td>\n<td>결론 유보<\/td>\n<\/tr>\n<tr>\n<td>채점관이 표면 단서에 속는다<\/td>\n<td>보안 리뷰 실험에서 효과 유의하지 않음<\/td>\n<td>과제별로 다름<\/td>\n<\/tr>\n<tr>\n<td>ReviewBench 출제자 1위<\/td>\n<td>현재는 1위 아님, 생산자 제외 옵션 공개<\/td>\n<td>출시 시점 사실은 유지<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>스스로 판단할 질문<\/h2>\n<ol>\n<li>우리 평가 체계가 위 반론 1~7 가운데 어느 것에 가장 취약한가?<\/li>\n<li>리뷰의 가치 중 결함 찾기가 아닌 것(지식 전달, 규범 유지)을 평가에 넣을 것인가, 범위 밖으로 둘 것인가?<\/li>\n<li>에이전트가 PR 본문·코멘트를 읽는다면 인젝션 위험을 어떻게 다룰 것인가?<\/li>\n<li>회사 블로그의 긍정적 숫자와 독립 연구의 부정적 숫자 중 무엇을 기준선으로 볼 것인가? 그 판단의 근거는 무엇인가?<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<ul>\n<li>Bacchelli &amp; Bird 2013 — <a href=\"https://web.eecs.umich.edu/~weimerw/2018-481/readings/codereview.pdf\">https://web.eecs.umich.edu/~weimerw/2018-481/readings/codereview.pdf<\/a> · Czerwonka 2015 — <a href=\"https://microsoft.com/en-us/research/wp-content/uploads/2015/05/PID3556473.pdf\">https://microsoft.com/en-us/research/wp-content/uploads/2015/05/PID3556473.pdf<\/a><\/li>\n<li>Entropic Thoughts (반론) — <a href=\"https://entropicthoughts.com/code-reviews-do-find-bugs\">https://entropicthoughts.com/code-reviews-do-find-bugs<\/a> (C)<\/li>\n<li>Edmundson 2013 — <a href=\"https://people.eecs.berkeley.edu/%7Edaw/papers/coderev-essos13.pdf\">https://people.eecs.berkeley.edu/%7Edaw/papers/coderev-essos13.pdf<\/a> (partial)<\/li>\n<li>Too Noisy — <a href=\"https://arxiv.org/html/2502.02757v2\">https://arxiv.org/html/2502.02757v2<\/a> · AACR-Bench — <a href=\"https://arxiv.org/abs/2601.19494\">https://arxiv.org/abs/2601.19494<\/a> · 2607.25851 — <a href=\"https://arxiv.org/abs/2607.25851\">https://arxiv.org/abs/2607.25851<\/a><\/li>\n<li>Moon 외 — <a href=\"https://arxiv.org/html/2505.16222v1\">https://arxiv.org/html/2505.16222v1<\/a> · CodeJudgeBench — <a href=\"https://arxiv.org/abs/2507.10535\">https://arxiv.org/abs/2507.10535<\/a> · CRJudgeBench — <a href=\"https://arxiv.org/abs/2609.37216\">https://arxiv.org/abs/2609.37216<\/a> · Chen 2025 — <a href=\"https://arxiv.org/html/2504.03846v3\">https://arxiv.org/html/2504.03846v3<\/a> (empty, 2차) · Thornton — <a href=\"https://arxiv.org/abs/2602.16741\">https://arxiv.org/abs/2602.16741<\/a><\/li>\n<li>SWE-bench Illusion — <a href=\"https://arxiv.org/abs/2506.12286v4\">https://arxiv.org/abs/2506.12286v4<\/a> · Wang, Pradel, Liu — <a href=\"https://arxiv.org/abs/2503.15223\">https://arxiv.org/abs/2503.15223<\/a> · OpenAI 2026 — <a href=\"https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/\">https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/<\/a><\/li>\n<li>ReviewBench — <a href=\"https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/\">https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/<\/a> · <a href=\"https://github.com/review-bench/ReviewBench\">https://github.com/review-bench/ReviewBench<\/a> · byteiota (E) — <a href=\"https://byteiota.com/github-reviewbench-copilot-tops-its-own-ai-code-review-benchmark/\">https://byteiota.com/github-reviewbench-copilot-tops-its-own-ai-code-review-benchmark/<\/a><\/li>\n<li>Beko — <a href=\"https://arxiv.org/html/2412.18531v2\">https://arxiv.org/html/2412.18531v2<\/a> · Sun 외 — <a href=\"https://arxiv.org/html/2508.18771v2\">https://arxiv.org/html/2508.18771v2<\/a> · CodeRabbit — <a href=\"https://arxiv.org/abs/2607.03316\">https://arxiv.org/abs/2607.03316<\/a> · Zhong — <a href=\"https://arxiv.org/abs/2603.15911\">https://arxiv.org/abs/2603.15911<\/a> · Go Home Copilot — <a href=\"https://arxiv.org/abs/2607.21997\">https://arxiv.org/abs/2607.21997<\/a> · Mozilla·Ubisoft — <a href=\"https://arxiv.org/abs/2411.07091\">https://arxiv.org/abs/2411.07091<\/a><\/li>\n<li>METR — <a href=\"https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/\">https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/<\/a> · <a href=\"https://metr.org/blog/2026-02-24-uplift-update/\">https://metr.org/blog/2026-02-24-uplift-update/<\/a><\/li>\n<li>CSA — <a href=\"https://labs.cloudsecurityalliance.org/research/csa-research-note-comment-control-github-prompt-injection-20/\">https://labs.cloudsecurityalliance.org/research/csa-research-note-comment-control-github-prompt-injection-20/<\/a> · 2603.18740 — <a href=\"https://arxiv.org/abs/2603.18740\">https://arxiv.org/abs/2603.18740<\/a> · SEVRA — <a href=\"https://arxiv.org/abs/2606.13757\">https://arxiv.org/abs/2606.13757<\/a><\/li>\n<li>Sadowski CACM 2018 — <a href=\"https://6826.csail.mit.edu/2020/papers/google-analysis-cacm.pdf\">https://6826.csail.mit.edu/2020/papers/google-analysis-cacm.pdf<\/a><\/li>\n<li>DORA 2024 — <a href=\"https://services.google.com/fh/files/misc/2024_final_dora_report.pdf\">https://services.google.com/fh/files/misc/2024_final_dora_report.pdf<\/a> · DORA 2025 — <a href=\"https://services.google.com/fh/files/misc/2025_state_of_ai_assisted_software_development.pdf\">https://services.google.com/fh/files/misc/2025_state_of_ai_assisted_software_development.pdf<\/a> · SPACE — <a href=\"https://queue.acm.org/detail.cfm?id=3454124\">https://queue.acm.org/detail.cfm?id=3454124<\/a><\/li>\n<\/ul>", "text": " 10. 반론과 한계 — 합의에 대한 가장 강한 반대 근거 생성일 : 2026-11-19 최종 수정일 : 2026-11-20 수준 : 균형 근거 원장 : wave-1 A9 반론 레인 · wave-2 W2d 이 장의 역할 01~09장을 읽으면 평가 방식의 \"합의\"가 보인다. 정답지(golden set)를 만들고 → LLM matcher로 짝짓고 → precision·recall·Fβ를 계산하고 → LLM 채점관을 사람 라벨로 보정하고 → 실사용에서는 해결률을 잰다. 대기업들은 좋은 숫자를 보고한다. 이 장은 이 합의의 각 고리를 반박하거나 복잡하게 만드는 가장 강한 근거만 모았다. 그리고 그 반론에 대한 재반론이 있으면 함께 적었다. 그림 10-1. 평가 흐름의 고리마다 붙은 반론 — 번호는 이 장의 절 번호 반론 1. 정답지는 불완전하고 시끄럽다 근거 내용 등급 Bacchelli & Bird 2013 · Czerwonka 2015 · Beller 2014 사람 코멘트의 결함 비율은 14~25%다. 코멘트로 만든 정답지는 대부분 버그가 아니고, 아무도 코멘트하지 않은 버그는 빠진다 A Liu 외 2025 \"Too Noisy To Learn\" CodeReviewer 학습 코멘트 표본의 64%만 유효 A DeepCRCEval 벤치마크 코멘트 중 고품질 10% 미만 A AACR-Bench PR에서 나온 정답은 \"시끄럽고 불완전하다\". LLM 후보 + 전문가 검증으로 결함 범위가 285% 늘었다 D ReviewBench 방법론 스스로 \"고정된 정답지는 필연적으로 불완전해진다\" B Kononenko 2015 · Paul 2021 · Khoshnoud 2022 사람 리뷰를 거친 변경의 54%가 버그를 만들었다(SZZ 기준). 맥락이 필요한 보안 결함은 대부분 리뷰를 빠져나간다 A Edmundson 외 2013 개발자 30명이 같은 웹앱을 리뷰했다. 효과가 낮았고 경험과도 상관이 없었다(초록·2차 확인) A 재반론 : \"코멘트의 15%\"는 탐지율이 아니다 . 리뷰당 코멘트가 약 4개면 리뷰의 절반쯤에는 결함 지적이 있다는 해석이 있다(Entropic Thoughts, C). Boehm 2003은 리뷰와 페어 프로그래밍을 합치면 결함을 약 60% 더 잡는다고 했다(같은 글이 인용, 2차). 반론 2. LLM 채점관은 코드에서 믿기 어렵다 근거 내용 등급 Moon 외 (EACL Findings 2026) 표면 단서에 흔들린다. \"이 코드는 맞다\"는 자기 주장 하나로 정답 판정이 49 → 83%. 오해를 부르는 주석으로 최대 26.7점 하락. \"강건한 모델이 없다\" A CodeJudgeBench (ACL 2026) 판정 모델 26개 모두 유의한 무작위성. 순서만 바꿔도 정확도가 크게 변한다 A JudgeBench (ICLR 2025) GPT-4o 기본 판정 50.86%(동전 던지기 수준) A CRJudgeBench (프리프린트) 최신 범용 LLM도 \"그럴듯하지만 틀린 리뷰 코멘트\"를 잘 못 가려낸다 D Chen 외 2025 (프리프린트, 2차) 판정 모델이 자기의 틀린 답을 선호하고, 강한 모델일수록 더 그렇다 D 재반론 : LLM 채점은 BLEU보다는 훨씬 낫다. SWR-Bench에서 적중 기반 LLM 판정의 일치도는 사람끼리와 비슷했고, BLEU는 음수였다. CRScore에서도 BLEU ≈ 0, LLM 0.605였다. 보안 리뷰에서 적대적 주석 효과가 유의하지 않았다는 결과도 있다(Thornton 2026, p>0.21). 반론 3. 벤치마크는 실력을 부풀린다 근거 내용 등급 SWE-bench Illusion (2025) 이슈 본문만 보고 버그 파일을 맞히는 비율이 SWE-bench Verified 76% vs 다른 저장소 53%. 함수 5-gram 그대로 재현 35% vs 18% → 기억 의 흔적 D Wang, Pradel, Liu (ICSE 2026) \"해결됨\"으로 친 패치의 7.8%가 전체 테스트에서 실패했다. 그럴듯한 패치의 29.6%는 참조 수정과 다르게 동작했다. 해결률이 6.2%p 부풀려졌다 A OpenAI 2026-02 SWE-bench Verified 평가 중단. 감사한 문항의 59.4%가 결함 있는 테스트였고 오염도 있었다 B ReviewBench — 출제자가 1위 GitHub이 만든 벤치마크에서 출시 당일 Copilot 1위(40.1%). 경쟁사 결과는 몇 달 전 실행분이었다. 정답의 44%가 ccr (Copilot으로 추정) 출처다. held-out이 없고, 공개 세트에서 튜닝하라고 권한다 B 같은 날 다른 보드 Martian online에서 Copilot은 6위, offline 5위 B 벤더 벤치마크 Greptile 자체 82% vs Augment 재실행 45% D METR 2025 벤치마크는 범위가 잘 정해지고 알고리즘으로 채점되는 과제라 능력을 \"과대평가할 수 있다\" B 재반론 : ReviewBench는 방법·데이터·채점관을 모두 공개했고, 생산자 편향을 스스로 경고했다. 특정 생산자를 빼고 채점하는 옵션도 추가했다. 2026-11-19 현재 리더보드 1위는 Copilot이 아니다. 반론 4. 실제 현장 결과는 엇갈리거나 부정적이다 근거 내용 등급 Beko (ICSE-SEIP 2025) AI 리뷰 도입 후 PR 종료 시간 평균 5h52m → 8h20m (p<0.001). 3개 중 1개 프로젝트만 빨라졌다. 보고된 문제: 잘못된 리뷰, 관련 없는 코멘트 A Sun 외 (TSE) 유효한 사람 코멘트 60%가 코드 변경으로 이어졌다. AI 리뷰 액션은 0.9~19.2% A Mozilla·Ubisoft LLM 코멘트 수용 8.1% / 7.2%. 패치당 중앙값 43초 추가 D CodeRabbit 실사용 수용 36.4%, 거절 56.3% D Zhong 외 2026 AI 제안은 사람 제안보다 채택률이 유의하게 낮았다. 채택되지 않은 것의 절반 이상은 틀렸거나 다른 방식으로 고쳐졌다. 채택된 AI 제안은 코드 복잡도를 더 높였다 D Tufano 외 2025 (ICSE) LLM 리뷰가 리뷰어의 주의를 붙잡았다(89% 유지). 심각한 이슈는 더 찾지 못했고 시간도 줄지 않았다 A Meta MetaMateCR AI 패치를 리뷰어에게 보이자 리뷰 시간 +5.5%로 철회 A METR 2025 RCT 숙련 개발자가 AI를 쓰면 19% 느렸고, 본인은 20% 빨라졌다고 믿었다 B 재반론 : Atlassian은 PR 사이클 시간 −31%, Microsoft는 −10~20%를 보고했다. 다만 둘 다 무작위 실험이 아니다. METR 2026-02 업데이트는 18% 빨라졌다는 추정을 냈다. METR은 이를 \"매우 약한 증거\"라고 하고, 2025년 결과는 역사적 결과로 본다. Mozilla·Ubisoft에서 수용된 코멘트는 사람 코멘트와 같은 비율로 수정을 이끌었다(74% vs 73%). Beko 논문 결론부에는 본문과 모순되는 시간 수치(50분 → 48분)가 있다. 반론 5. 리뷰 에이전트 자체가 공격 표면이다 근거 내용 등급 CSA \"Comment and Control\" (2026-04) PR 제목·코멘트로 Claude Code Security Review, Gemini CLI Action, Copilot Agent가 시크릿을 유출했다(심각도 9.4). 벤더가 수정함 C arXiv 2603.18740 다듬은 편향 주입으로 CVE 33개 중 32개(97%)를 자동 리뷰에서 숨겼다 D SEVRA-BENCH 설득 문구 15종으로 취약 PR 승인을 유도하는 벤치마크(약 1,000 PR) D 재반론 : Thornton 2026은 적대적 주석 공격 효과가 유의하지 않았다고 보고했다. 위험은 주로 시크릿을 가진 CI 워크플로에 몰려 있다. 반론 6. 온라인 지표는 교란된다 코멘트 유형 : 리팩터링·가독성 코멘트가 기능·설계 코멘트보다 3.5배쯤 잘 반영된다(Mozilla·Ubisoft). 쉬운 코멘트가 많으면 해결률이 오른다. 추정치이거나 자기 보고 라벨 : Google AutoCommenter의 약 40%는 \"코멘트가 사라짐\" × 40건 수작업 확인으로 낸 추정이다. Beko 73.8%는 개발자가 반드시 눌러야 하는 라벨이다. 양을 같이 봐야 함 : GitHub의 addressed rate +8.0%는 코멘트 수 +61% 와 함께 나왔다. 인식과 실제 : DORA 2024에서 AI 도입 +25%당 처리량 −1.5%, 안정성 −7.2%와 연관되었다(상관). 2025년에는 처리량이 개선되었지만 불안정성은 남았다. 단일 지표로는 생산성을 못 잡는다 : SPACE 프레임워크(Forsgren 외 2021, C, 2차 확인). 반론 7. 리뷰의 주된 가치는 결함 찾기가 아닐 수 있다 Bacchelli & Bird: 리뷰는 \"기대보다 결함에 관한 것이 적었다\". 지식 전달을 첫째 동기로 꼽은 개발자는 8%뿐이었지만, 인터뷰 대상자는 한 명을 빼고 모두 지식 전달을 언급했다. Czerwonka: \"사회적 측면은 … 무시할 수 없다\". 리뷰어의 유용성이 33% → 67%로 오르는 학습 곡선 자체가 지식 확산의 증거라는 해석이 있다. Sadowski(Google): 교육, 규범 유지, 문지기, 사고 예방. → 결함 정답지 기반 P·R·Fβ는 이 가치들을 보지 못한다. 반론이 반박된 경우 요약 반론 재반론 현재 상태 \"리뷰는 버그를 못 찾는다\" (Czerwonka) 코멘트 비율 ≠ 탐지율 둘 다 성립하는 해석 METR −19% METR 2026 +18%(매우 약한 증거) 결론 유보 채점관이 표면 단서에 속는다 보안 리뷰 실험에서 효과 유의하지 않음 과제별로 다름 ReviewBench 출제자 1위 현재는 1위 아님, 생산자 제외 옵션 공개 출시 시점 사실은 유지 스스로 판단할 질문 우리 평가 체계가 위 반론 1~7 가운데 어느 것에 가장 취약한가? 리뷰의 가치 중 결함 찾기가 아닌 것(지식 전달, 규범 유지)을 평가에 넣을 것인가, 범위 밖으로 둘 것인가? 에이전트가 PR 본문·코멘트를 읽는다면 인젝션 위험을 어떻게 다룰 것인가? 회사 블로그의 긍정적 숫자와 독립 연구의 부정적 숫자 중 무엇을 기준선으로 볼 것인가? 그 판단의 근거는 무엇인가? 출처 Bacchelli & Bird 2013 — https://web.eecs.umich.edu/~weimerw/2018-481/readings/codereview.pdf · Czerwonka 2015 — https://microsoft.com/en-us/research/wp-content/uploads/2015/05/PID3556473.pdf Entropic Thoughts (반론) — https://entropicthoughts.com/code-reviews-do-find-bugs (C) Edmundson 2013 — https://people.eecs.berkeley.edu/%7Edaw/papers/coderev-essos13.pdf (partial) Too Noisy — https://arxiv.org/html/2502.02757v2 · AACR-Bench — https://arxiv.org/abs/2601.19494 · 2607.25851 — https://arxiv.org/abs/2607.25851 Moon 외 — https://arxiv.org/html/2505.16222v1 · CodeJudgeBench — https://arxiv.org/abs/2507.10535 · CRJudgeBench — https://arxiv.org/abs/2609.37216 · Chen 2025 — https://arxiv.org/html/2504.03846v3 (empty, 2차) · Thornton — https://arxiv.org/abs/2602.16741 SWE-bench Illusion — https://arxiv.org/abs/2506.12286v4 · Wang, Pradel, Liu — https://arxiv.org/abs/2503.15223 · OpenAI 2026 — https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/ ReviewBench — https://github.blog/ai-and- ote-on-using-the-f-measure-for-evaluating-record-linkage-algor/", "detail": false}, {"key": "christen2023", "aliases": ["Christen, Hand, Kirielle 2023"], "title": "A review of the F-measure", "authors": "Christen, Hand, Kirielle", "venue": "ACM Computing Surveys 2023", "summary": "F 척도 비판을 정리한 리뷰 논문. 한쪽 오류가 정말 무관할 때만 F를 쓰고, P와 R을 반드시 함께 보고하며, 해석이 필요하면 F*를 쓰라고 권고했다.", "grade": "A", "basis": "반론(F 비판)", "url": "https://spiral.imperial.ac.uk/bitstreams/d313745d-dfc3-4af9-a191-6bbb08db5e32/download", "detail": false}, {"key": "cohen1960", "aliases": ["Cohen 1960"], "title": null, "authors": "Cohen", "venue": "Educational and Psychological Measurement 1960", "summary": "평가자 2명의 일치도에서 우연히 맞을 확률을 뺀 Cohen's κ의 원전. 원문은 확인하지 못했고 공식은 2차 문헌에서 가져왔다.", "grade": "A", "basis": "원조", "url": null, "detail": false}, {"key": "fleiss1971", "aliases": ["Fleiss 1971"], "title": null, "authors": "Fleiss", "venue": "Psychological Bulletin 1971", "summary": "일치도 지표를 평가자 여러 명으로 넓힌 Fleiss' κ의 원전(2차 문헌으로만 확인).", "grade": "A", "basis": "원조", "url": null, "detail": false}, {"key": "krippendorff2004", "aliases": ["Krippendorff 2004 HCR", "Krippendorff 2004"], "title": null, "authors": "Krippendorff", "venue": "Human Communication Research 2004", "summary": "Krippendorff's α의 임계값을 저자가 직접 쓴 문헌. α ≥ .800, 잠정 결론이면 α ≥ .667을 제안하면서 바로 'there are no magical numbers'라고 단서를 달았다.", "grade": "A", "basis": "원조(α 임계값)", "url": "https://repository.upenn.edu/bitstreams/b6ea3a5b-3dee-4f27-a159-e44393eda7d4/download", "detail": false}, {"key": "gwet2008", "aliases": ["Gwet 2008", "Gwet AC1"], "title": null, "authors": "Gwet", "venue": "British Journal of Mathematical and Statistical Psychology 2008", "summary": "κ 역설에 강하다는 대안 지표 AC1의 원전. 원문은 차단되어 PMC 리뷰(2017)로만 확인했고 반론이 있다.", "grade": "A", "basis": "대안 지표", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5712640/", "detail": false}, {"key": "pmc2017", "aliases": ["PMC 리뷰 2017"], "title": null, "authors": null, "venue": "PMC 게재 리뷰 논문 2017 (PMC5712640)", "summary": "Gwet AC1을 κ 역설에 가장 강건한 대안으로 정리한 2차 문헌. Gwet 2008 원문 대신 이 리뷰로 AC1을 확인했다.", "grade": "A", "basis": null, "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5712640/", "detail": false}, {"key": "landis1977", "aliases": ["Landis & Koch 1977"], "title": null, "authors": "Landis, Koch", "venue": "Biometrics 1977", "summary": "κ 해석 기준표(0.61~0.80 '상당한', 0.81~1.00 '거의 완벽')의 원전으로 가장 널리 쓰인다. 원문은 직접 읽지 못했고, 저자들도 구간이 주관적이라 했다고 한다(2차 출처).", "grade": "A", "basis": "원조", "url": null, "detail": false}, {"key": "mchugh2012", "aliases": ["McHugh 2012"], "title": null, "authors": "McHugh", "venue": "Biochemia Medica 2012", "summary": "κ 해석 기준이 의료 분야에 너무 관대하다고 비판한 해설. 일치율과 κ를 둘 다 보고하라고 권했다.", "grade": "A", "basis": "영향(κ 해석 비판)", "url": "https://biochemia-medica.com/en/journal/22/3/10.11613/BM.2012.031/fullArticle", "detail": false}, {"key": "feinstein1990", "aliases": ["Feinstein & Cicchetti 1990"], "title": null, "authors": "Feinstein, Cicchetti", "venue": "Journal of Clinical Epidemiology 1990", "summary": "한쪽 라벨이 압도적이면 일치율이 높아도 κ가 낮게 나오는 'κ 역설'의 원전. 원문은 확인하지 못했고 예시 수치는 직접 재계산했다.", "grade": "A", "basis": "원조(κ 역설)", "url": null, "detail": false}, {"key": "papineni2002", "aliases": ["Papineni 2002 (BLEU)", "Papineni 2002"], "title": null, "authors": "Papineni 외", "venue": "ACL 2002", "summary": "BLEU의 원전. 같은 번역도 참조 번역 4개와 비교하면 0.3468, 2개면 0.2571이 나와 참조 개수에 따라 점수가 달라진다고 스스로 경고했다(리뷰 코멘트는 참조가 보통 1개).", "grade": "A", "basis": "원조", "url": "https://aclanthology.org/P02-1040.pdf", "detail": false}, {"key": "codereviewer2022", "aliases": ["CodeReviewer(Microsoft, FSE 2022)", "CodeReviewer (Li 외, FSE 2022)", "CodeReviewer (FSE 2022)", "CodeReviewer"], "title": null, "authors": "Li 외", "venue": "ESEC/FSE 2022", "summary": "품질 판단·코멘트 생성·코드 수정 세 과제 틀을 정리해 표준이 된 사전학습 모델(Microsoft). 코멘트 생성 BLEU-4는 5.32였고, 입력을 그대로 내도 코드 수정 BLEU 58.75가 나와 저자 스스로 BLEU가 부적합하다고 했다.", "grade": "A", "basis": "영향(분야 최다)", "url": "https://arxiv.org/pdf/2203.09095", "detail": true}, {"key": "jiang2025", "aliases": ["Jiang 외 2025"], "title": "Beyond Lexical Similarity", "authors": "Jiang 외", "venue": "arXiv 2025", "summary": "리뷰 코멘트에서 BLEU와 사람 점수의 Spearman 상관이 0.22에 그친다고 측정했다. 임베딩 유사도는 0.38, GPT-4o 채점은 0.47이었다.", "grade": "D", "basis": "최신(BLEU 상관)", "url": "https://arxiv.org/pdf/2501.05176", "detail": false}, {"key": "crscore", "aliases": ["CRScore(NAACL 2025)", "CRScore 2025", "CRScore"], "title": null, "authors": "Naik, Alenius, Fried, Rosé", "venue": "NAACL 2025", "summary": "정답 없이 리뷰 코멘트의 간결성·포괄성·관련성을 재는 지표로 사람 평가와 Spearman 0.54였다. 이 장에서는 정답 없이 코멘트 품질을 재는 평가 지표 연구로 언급됐다.", "grade": "A", "basis": "리뷰 채점관", "url": "https://arxiv.org/html/2409.19801", "detail": false}, {"key": "tufanobavota2025", "aliases": ["Tufano & Bavota 2025 SLR", "Tufano & Bavota 2025"], "title": null, "authors": "Tufano, Bavota", "venue": "arXiv 프리프린트 2025", "summary": "119편을 다룬 체계적 문헌 리뷰. 코멘트 생성 지표는 BLEU > 정확 일치 > ROUGE-L 순으로 많이 쓰였고, 41%는 재현 패키지가 없으며 산업에 배포된 기법은 15%였다.", "grade": "D", "basis": "체계적 문헌 리뷰", "url": "https://arxiv.org/pdf/2503.09510", "detail": false}, {"key": "owaspbenchmark", "aliases": ["OWASP Benchmark"], "title": null, "authors": null, "venue": "OWASP 프로젝트 (GitHub 저장소)", "summary": "진짜 취약점과 일부러 넣은 가짜(안전한 코드)를 섞어 정적분석 도구를 채점하는 벤치마크. 점수는 Youden 지수(TPR − FPR)이고, 함정 케이스로 FP를 세는 선례로 쓰였다.", "grade": "B", "basis": "선례", "url": "https://raw.githubusercontent.com/OWASP/www-project-benchmark/master/tab_scoring.md", "detail": false}, {"key": "nistjuliet", "aliases": ["NIST Juliet"], "title": "Juliet Test Suite v1.1 for C/C++ User Guide", "authors": "NIST", "venue": "NIST SAMATE 2012", "summary": "'bad' 함수에서 보고하면 TP, 'good' 함수에서 보고하면 FP로 세는 정적분석 시험 모음. 함정 케이스로 FP를 세는 평가의 선례다.", "grade": "B", "basis": "선례", "url": "https://samate.nist.gov/SARD/downloads/documents/Juliet_Test_Suite_v1.1_for_C_Cpp_-_User_Guide.pdf", "detail": false}, {"key": "dact2023", "aliases": ["D-ACT (SANER 2023)", "D-ACT(SANER 2023)", "D-ACT 2023", "D-ACT"], "title": "D-ACT: Towards Diff-Aware Code Transformation for Code Review Under a Time-Wise Evaluation", "authors": "Pornprasit, Tantithamthavorn, Thongtanunam, Chen", "venue": "SANER 2023", "summary": "과거 변경으로 학습하고 미래 변경으로 시험하는 시간순 분할로 리뷰 코드 변환을 평가했다. 저자 재현 자료로 확인하니 시간 순서를 무시하면 점수가 부풀려졌다(57~94% 크기는 미확인).", "grade": "A", "basis": "시간 분할·학습 방식", "url": "https://github.com/awsm-research/D-ACT-Replication-Package", "detail": false}, {"key": "heumuller2025", "aliases": ["Heumüller & Ortmeier 2025 SLR", "Heumüller & Ortmeier 2025", "Heumüller & Ortmeier", "Heumüller 2025", "Heumüller SLR"], "title": null, "authors": "Heumüller, Ortmeier", "venue": "arXiv 프리프린트 2025 (IST 심사 중)", "summary": "리뷰 자동화 연구 24편의 체계적 문헌 리뷰. 과제-지표 조합 48개 중 22개가 한 편에서만 쓰였고 시간 편향을 다룬 연구는 1편이었으며, 단순한 기준선이 복잡한 모델과 비슷하거나 나았다.", "grade": "D", "basis": "체계적 문헌 리뷰", "url": "https://arxiv.org/pdf/2508.18003", "detail": false}, {"key": "sainz2023", "aliases": ["Sainz 외 2023", "Sainz 2023"], "title": null, "authors": "Sainz 외", "venue": "2023 (arXiv 2310.18018)", "summary": "데이터 오염 문제를 정리한 문헌. 가장 나쁜 오염은 테스트 분할로 학습하는 것이고 오염은 과대평가를 낳는다고 했다.", "grade": "A", "basis": "영향(오염)", "url": "https://arxiv.org/pdf/2310.18018", "detail": false}, {"key": "livecodebench", "aliases": ["LiveCodeBench"], "title": null, "authors": null, "venue": "arXiv 2024", "summary": "문제마다 공개 날짜를 붙이고 모델 학습 마감일 이후 문제로만 평가해 오염을 피하는 코드 벤치마크.", "grade": "D", "basis": "영향(오염)", "url": "https://arxiv.org/pdf/2403.07974", "detail": false}, {"key": "swebenchverified", "aliases": ["SWE-bench Verified(OpenAI 2024)", "SWE-bench Verified"], "title": null, "authors": "OpenAI", "venue": "OpenAI 블로그 2024", "summary": "개발자 93명이 SWE-bench 1,699개를 검토해 68.3%를 걸러 내고 500개를 남긴 정제판. 벤치마크 재검증 사례로 쓰였다.", "grade": "B", "basis": "사례", "url": "https://openai.com/index/introducing-swe-bench-verified/", "detail": false}, {"key": "swebenchplus", "aliases": ["SWE-bench+(2024)", "SWE-bench+"], "title": null, "authors": "Aleithan 외", "venue": "arXiv 2024", "summary": "SWE-bench 성공 패치의 32.67%는 이슈 본문에 정답이 이미 있었고 31.08%는 약한 테스트 덕에 통과했음을 보였다.", "grade": "D", "basis": "사례", "url": "https://arxiv.org/pdf/2410.06992", "detail": false}, {"key": "openai2026", "aliases": ["OpenAI 2026-02", "OpenAI 2026"], "title": "Why we no longer evaluate SWE-bench Verified", "authors": "OpenAI", "venue": "OpenAI 블로그 2026", "summary": "OpenAI가 SWE-bench Verified 평가를 중단한 이유를 밝힌 글. 미해결 138문항 중 59.4%가 결함 있는 테스트였고, 테스트한 모든 최신 모델이 일부 정답 패치를 재현했다(오염). 제작사 자체 감사라는 점은 감안한다.", "grade": "B", "basis": "사례", "url": "https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/", "detail": false}, {"key": "miller2024", "aliases": ["Miller 2024"], "title": "Adding error bars to evals", "authors": "Miller", "venue": "Anthropic, arXiv 2024", "summary": "LLM 평가에 오차 막대를 붙이는 방법을 정리한 글. 군집 표준오차, 문항별 짝지은 비교, 검정력 분석 등 5가지를 권했다.", "grade": "D", "basis": "표준 참고", "url": "https://arxiv.org/pdf/2411.00640", "detail": false}, {"key": "koehn2004", "aliases": ["Koehn 2004"], "title": null, "authors": "Koehn", "venue": "EMNLP 2004", "summary": "짝지은 부트스트랩 유의성 검정의 표준 문헌. 테스트셋을 1,000번 복원추출해 95% 이상에서 이기면 유의하다고 본다(다중 비교 보정은 없음).", "grade": "A", "basis": "표준 참고", "url": "https://aclanthology.org/W04-3250.pdf", "detail": false}, {"key": "dror2018", "aliases": ["Dror 외 2018", "Dror 2018"], "title": "Hitchhiker's guide to testing statistical significance in NLP", "authors": "Dror 외", "venue": "ACL 2018", "summary": "NLP 유의성 검정 지침. ACL 2017 실험 논문 180편 중 유의성 검정을 한 논문은 63편뿐이었다.", "grade": "A", "basis": "표준 참고", "url": "https://aclanthology.org/P18-1128.pdf", "detail": false}, {"key": "mustahsan2025", "aliases": ["Mustahsan 외 2025", "Mustahsan 2025"], "title": null, "authors": "Mustahsan 외", "venue": "arXiv 2025 (프리프린트)", "summary": "에이전트 벤치마크 다수가 단일 실행에 신뢰구간 없이 결과를 낸다고 지적했다. 반복 실행 일치도(ICC)는 구조화된 과제에서 8~16회, 복잡한 추론에서 32회 이상에서 안정된다.", "grade": "D", "basis": "참고", "url": "https://arxiv.org/pdf/2512.06710", "detail": false}, {"key": "chen2021", "aliases": ["Chen 2021 (pass@k)", "Chen 외 2021", "Chen 2021"], "title": null, "authors": "Chen 외", "venue": "arXiv 2021 (Codex 논문)", "summary": "pass@k(k번 시도 중 한 번이라도 맞을 확률)의 편향 없는 추정식 1 − C(n−c,k)/C(n,k)를 제시했다. 단순한 1 − (1−p̂)ᵏ은 편향된다.", "grade": "D", "basis": "참고", "url": "https://arxiv.org/pdf/2107.03374", "detail": false}, {"key": "crbench", "aliases": ["CR-Bench"], "title": null, "authors": null, "venue": "arXiv 프리프린트 2026-03(v1)·2026-11(v2) (Nutanix)", "summary": "SWE-bench 결함을 리뷰 과제로 바꾸고 코멘트를 버그 적중·타당한 제안·소음으로 나눠 SNR(신호 대 소음 비)을 잰다. Reflexion이 재현율은 올리고 SNR은 낮춘다는 결과와, precision 정의가 달라 다른 벤치마크와 비교할 수 없다는 점이 쓰였다.", "grade": "D", "basis": "최신, 대기업·연구소가 공개했거나 다른 연구가 비교 대상으로 씀", "url": "https://arxiv.org/abs/2603.11078", "detail": false}, {"key": "reviewbench", "aliases": ["ReviewBench"], "title": null, "authors": "GitHub", "venue": "GitHub 블로그·저장소 2026-10", "summary": "GitHub이 공개한 리뷰 에이전트 벤치마크(PR 219개, 후보 4,549개). 정답 대부분이 LLM 리뷰 결과(Copilot 코드 리뷰로 보이는 ccr 44%)에서 나와 생산자 편향과 비공개 시험 세트가 없다는 점의 사례로 쓰였다.", "grade": "B", "basis": "최신·1차, 가장 널리 보도됨", "url": "https://github.blog/ai-and-ml/github-copilot/reviewbench-an-open-benchmark-for-ai-code-review/", "detail": false}, {"key": "zheng2023", "aliases": ["Zheng 외 2023 MT-Bench", "Zheng 외 NeurIPS 2023", "Chatbot Arena", "Zheng 외 2023", "Zheng 2023", "MT-Bench"], "title": null, "authors": "Zheng 외", "venue": "NeurIPS 2023 (Datasets & Benchmarks)", "summary": "LLM 채점관 연구의 원점. GPT-4와 사람의 일치율이 무승부 제외 85%(사람끼리 81%), 무승부 포함 66%(63%)로 사람끼리와 비슷했고, 위치·길이·자기 선호 편향도 함께 보고했다.", "grade": "A", "basis": "원조·영향", "url": "https://arxiv.org/html/2306.05685", "detail": false}, {"key": "liu2023geval", "aliases": ["Liu 외 2023 G-Eval", "G-Eval"], "title": null, "authors": "Liu 외", "venue": "EMNLP 2023", "summary": "확률 가중 채점의 대표 연구. SummEval에서 사람과 Spearman 0.514였고, LLM 채점관이 LLM이 쓴 글을 선호할 수 있다고 지적했다.", "grade": "A", "basis": "영향", "url": "https://arxiv.org/html/2303.16634", "detail": false}, {"key": "wang2023", "aliases": ["Wang 외 2023", "Wang 2023"], "title": null, "authors": "Wang 외", "venue": "ACL 2024", "summary": "답의 순서만 바꿔도 판정이 뒤집히는 위치 편향을 체계적으로 잰 연구. GPT-4의 판정 충돌률이 46.3%였다.", "grade": "A", "basis": "영향(위치 편향)", "url": "https://arxiv.org/html/2305.17926", "detail": false}, {"key": "panickssery2024", "aliases": ["Panickssery 외 2024", "Panickssery 2024"], "title": null, "authors": "Panickssery 외", "venue": "NeurIPS 2024", "summary": "LLM이 자기가 쓴 글을 알아보는 능력이 클수록 자기 글을 더 좋게 보는 경향(자기 선호)도 강하다는 것을 보였다. 뉴스 요약 과제에서만 실험했다.", "grade": "A", "basis": "영향(자기 선호)", "url": "https://arxiv.org/html/2404.13076", "detail": false}, {"key": "shankar2024", "aliases": ["Shankar 외 2024 \"Who Validates the Validators?\"", "Who Validates the Validators?", "Shankar 외 2024", "Shankar 2024"], "title": "Who Validates the Validators?", "authors": "Shankar 외", "venue": "UIST 2024", "summary": "실무자 9명 질적 연구로, 사람은 출력물을 채점해 보기 전에는 평가 기준을 다 정할 수 없고 채점하면서 기준이 바뀐다는 '기준 표류'를 제시했다.", "grade": "A", "basis": "기준 표류", "url": "https://arxiv.org/html/2404.12272", "detail": false}, {"key": "thakur2024", "aliases": ["Thakur 외 2024 \"Judging the Judges\"", "Judging the Judges", "Thakur 외 2024", "Thakur 2024"], "title": "Judging the Judges", "authors": "Thakur 외", "venue": "arXiv 프리프린트 2024 (v6 2025-08)", "summary": "판정 모델 13개를 TriviaQA로 시험한 메타 평가. 일치율이 높아도 사람 점수와 10~20점 차이가 날 수 있고, 후하게 채점하는 관대함 편향이 있었다.", "grade": "D", "basis": "메타 평가", "url": "https://arxiv.org/html/2406.12624", "detail": false}, {"key": "bavaresco2025", "aliases": ["Bavaresco 외 2025", "JUDGE-BENCH", "Bavaresco 외"], "title": null, "authors": "Bavaresco 외", "venue": "ACL 2025", "summary": "LLM 11개를 데이터셋 20개에서 시험해 사람과의 일치가 과제마다 0.84~0.05로 크게 다름을 보였다. 배포 전에 그 과제의 사람 라벨로 검증하라고 권고했다.", "grade": "A", "basis": "메타 평가", "url": "https://arxiv.org/html/2406.18403", "detail": false}, {"key": "judgebench", "aliases": ["JudgeBench (ICLR 2025)", "JudgeBench", "Tan 외"], "title": null, "authors": "Tan 외", "venue": "ICLR 2025", "summary": "객관적으로 맞는 답과 틀린 답 쌍 350개로 채점관을 시험했다. GPT-4o 기본 프롬프트는 50.86%로 동전 던지기 수준이었고, Claude가 직접 만든 쌍을 판정하면 64.3%에서 44.8%로 떨어졌다.", "grade": "A", "basis": "메타 평가", "url": "https://arxiv.org/html/2410.12784", "detail": false}, {"key": "llmbar", "aliases": ["LLMBar", "Zeng 외"], "title": null, "authors": "Zeng 외", "venue": "ICLR 2024", "summary": "지시 이행 쌍 419개로 채점관을 시험했다. 전문가끼리는 94% 일치했지만 최고 GPT-4 판정기도 적대적 세트에서 82.8%였고, CoT가 오히려 겉보기 품질 쪽 편향을 키운 경우가 있었다.", "grade": "A", "basis": "메타 평가", "url": "https://arxiv.org/pdf/2310.07641", "detail": false}, {"key": "gu2024", "aliases": ["Gu 외 2024", "Gu 2024", "Gu 외"], "title": "A Survey on LLM-as-a-Judge", "authors": "Gu 외", "venue": "arXiv 프리프린트 2024", "summary": "LLM 채점관 분야 전체를 정리한 서베이. 이 스터디에서는 분야 지도로 참고했다.", "grade": "D", "basis": "분야 지도", "url": "https://arxiv.org/html/2411.15594", "detail": false}, {"key": "li2024survey", "aliases": ["Li 외 2024", "Li 2024"], "title": "From Generation to Judgment", "authors": "Li 외", "venue": "EMNLP (Semantic Scholar 기준)", "summary": "무엇을, 어떻게 채점하고 어떻게 벤치마크하는지의 세 축으로 LLM 채점관 연구를 정리한 서베이. 분야 지도로 참고했다.", "grade": "A", "basis": "분야 지도", "url": "https://arxiv.org/html/2411.16594", "detail": false}, {"key": "codejudge", "aliases": ["CodeJudge"], "title": null, "authors": "Tong, Zhang", "venue": "EMNLP 2024", "summary": "LLM으로 코드 정답 여부를 판정하는 방법. 평균 정확도 80.56%였고, 실패 600건 중 52.83%가 코드 로직 분석 오류였다.", "grade": "A", "basis": "코드 채점관", "url": "https://arxiv.org/html/2410.02184", "detail": false}, {"key": "codejudgebench", "aliases": ["CodeJudgeBench (ACL 2026)", "CodeJudgeBench"], "title": null, "authors": null, "venue": "ACL 2026", "summary": "판정 모델 26개를 코드 과제로 시험한 벤치마크. 모든 모델에 유의한 무작위성이 있고 답 순서만 바꿔도 정확도가 크게 변했으며, 추론 모델이 가장 좋았다.", "grade": "A", "basis": "코드 채점관", "url": "https://arxiv.org/html/2507.10535", "detail": false}, {"key": "wang2025", "aliases": ["Wang 외 2025", "Wang 2025"], "title": "Can LLMs Replace Human Evaluators? … LLM-as-a-Judge in SE", "authors": "Wang 외", "venue": "Proc. ACM Softw. Eng. 2025", "summary": "소프트웨어 공학 과제별로 LLM 채점과 사람 점수를 비교했다. 피어슨 상관이 코드 번역 81.32, 코드 생성 68.51이었고 요약은 더 낮았다.", "grade": "A", "basis": "코드 채점관", "url": "https://arxiv.org/html/2502.06193", "detail": false}, {"key": "ahmed2024", "aliases": ["Ahmed 외 2024", "Ahmed 2024"], "title": "Can LLMs Replace Manual Annotation of SE Artifacts?", "authors": "Ahmed 외", "venue": "MSR 2025", "summary": "LLM 6개로 SE 산출물 주석 10개 과제를 대체할 수 있는지 본 연구. 모델끼리 일치하면 사람과도 일치하는 경향이 있어, 모델 간 불일치를 위험 신호로 쓸 수 있다.", "grade": "A", "basis": "코드 채점관", "url": "https://arxiv.org/html/2408.05534", "detail": false}, {"key": "moon2026", "aliases": ["Moon 외 (EACL Findings 2026)", "Moon 2026", "Moon 외"], "title": null, "authors": "Moon 외", "venue": "EACL Findings 2026", "summary": "코드에 '정답임' 같은 문구나 오해를 부르는 주석을 넣으면 LLM 코드 채점관이 크게 흔들림을 보였다(LLaMA-70B 49.0→83.3%, GPT-4o C++ 89.5→67.1%). 테스트한 모델 중 강건한 것이 없었다.", "grade": "A", "basis": "코드 채점관", "url": "https://arxiv.org/html/2505.16222v1", "detail": false}, {"key": "swrbench", "aliases": ["SWR-Bench"], "title": null, "authors": "Zeng 외", "venue": "PACMSE (FSE 2026)", "summary": "북경대가 만든 PR 1,000개 벤치마크로, 절반을 문제없는 PR로 넣어 '조용히 있기'를 잴 수 있게 했다. 최고 F1 약 19~21%, 에이전트형 도구가 단일 프롬프트를 이기지 못했고 여러 번 돌려 합치면 F1이 최대 43.67% 올랐다.", "grade": "A", "basis": "최신·학회", "url": "https://arxiv.org/html/2509.01494", "detail": false}, {"key": "deepcrceval", "aliases": ["DeepCRCEval (FASE 2025)", "DeepCRCEval"], "title": null, "authors": "Lu 외", "venue": "FASE 2025 (LNCS)", "summary": "리뷰 코멘트를 9개 기준으로 채점하는 방법. GPT-4와 사람 평균의 ICC는 0.62~0.83(사람 0.89~0.95)이었고, 벤치마크 코멘트 중 고품질은 10% 미만이라고 보고했다.", "grade": "A", "basis": "리뷰 채점관", "url": "https://arxiv.org/html/2412.18291", "detail": false}, {"key": "crjudgebench", "aliases": ["CRJudgeBench (프리프린트)", "CRJudgeBench"], "title": null, "authors": null, "venue": "arXiv 프리프린트 2026 (심사 중)", "summary": "그럴듯하지만 틀린 리뷰 코멘트를 채점관이 골라내는지 시험하는 벤치마크. 범용 최신 LLM도 신뢰할 수 없는 코멘트 식별에 어려움을 겪었고 특화 판정기 최고가 76.6%였다.", "grade": "D", "basis": "리뷰 채점관", "url": "https://arxiv.org/abs/2609.37216", "detail": false}, {"key": "ppi2023", "aliases": ["PPI (Angelopoulos 외 2023, Science)", "Angelopoulos 외 2023", "PPI"], "title": null, "authors": "Angelopoulos 외", "venue": "Science 2023", "summary": "소량의 사람 라벨로 대량의 모델 예측 오차를 보정해 편향 없는 추정치와 유효한 신뢰구간을 얻는 방법(예측 기반 추론). 효과는 채점관이 사람과 얼마나 상관있는지에 달렸다.", "grade": "A", "basis": "보정 통계", "url": "https://arxiv.org/html/2301.09633", "detail": false}, {"key": "autoeval2025", "aliases": ["AutoEval Done Right", "AutoEval", "Boyeau 외"], "title": "AutoEval Done Right", "authors": "Boyeau 외", "venue": "ICML 2025", "summary": "PPI를 모델 평가에 적용해, 통계적 타당성을 해치지 않고 사람 데이터의 유효 표본 크기를 늘리는 방법.", "grade": "A", "basis": "보정 통계", "url": "https://arxiv.org/html/2403.07008", "detail": false}, {"key": "ppranking2024", "aliases": ["Prediction-Powered Ranking", "PP-Ranking", "Chatzi 외"], "title": "Prediction-Powered Ranking of LLMs", "authors": "Chatzi 외", "venue": "NeurIPS 2024", "summary": "같은 보정을 여러 모델의 순위에 적용해 순위를 '가능한 범위'로 낸다. LLM 판정만으로 만든 순위는 사람 선호와 자주 어긋났다.", "grade": "A", "basis": "보정 통계", "url": "https://arxiv.org/html/2402.17826", "detail": false}, {"key": "lee2025", "aliases": ["Lee 외 2025", "Lee 2025"], "title": "How to Correctly Report LLM-as-a-Judge Evaluations", "authors": "Lee, Zeng, Jeong, Sohn, Lee", "venue": "arXiv 프리프린트 2025 (학회 게재 미확인)", "summary": "사람 라벨로 잰 민감도·특이도로 LLM 채점 정답률을 보정하는 Rogan–Gladen 식과 신뢰구간을 제시했다. 채점관이 무작위 수준에 가까우면 불안정해진다.", "grade": "D", "basis": "보정 통계", "url": "https://arxiv.org/html/2511.21140v3", "detail": false}, {"key": "rogangladen1978", "aliases": ["Rogan–Gladen"], "title": null, "authors": "Rogan, Gladen", "venue": "1978", "summary": "민감도·특이도로 관찰된 비율을 보정하는 고전 식. 이 스터디에서는 Lee 외 2025를 통해 LLM 채점관 정답률 보정식으로 소개했다.", "grade": null, "basis": null, "url": null, "detail": false}, {"key": "anthropicdocs", "aliases": ["Anthropic 문서"], "title": null, "authors": "Anthropic", "venue": "Anthropic 공식 문서 (develop-tests)", "summary": "생성한 모델과 다른 모델로 채점하는 것이 좋은 관행이라고 권하는 1차 지침.", "grade": "B", "basis": "1차 지침", "url": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests", "detail": false}, {"key": "anthropicblog2026", "aliases": ["Anthropic 엔지니어링 블로그 2026-01"], "title": null, "authors": "Anthropic", "venue": "Anthropic 엔지니어링 블로그 2026-01-09", "summary": "AI 에이전트 평가 글. LLM 채점관은 사람 전문가와 긴밀히 보정해야 한다고 권했다.", "grade": "B", "basis": "1차 지침", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "detail": false}, {"key": "hamel2024", "aliases": ["Hamel Husain 2024", "Hamel Husain"], "title": null, "authors": "Hamel Husain", "venue": "개인 블로그 2024-10-29", "summary": "실무 해설. 1~5점 대신 합격/불합격으로, 참양성률·참음성률을 따로 보고, 약 30개로 시작해 실패 유형마다 약 100개를 쓰라고 권했다. 프롬프트 3번 수정으로 전문가와 90% 이상 일치했다.", "grade": "C", "basis": "실무 해설", "url": "https://hamel.dev/blog/posts/llm-judge/", "detail": false}, {"key": "eugeneyan2024", "aliases": ["Eugene Yan 2024", "Eugene Yan"], "title": null, "authors": "Eugene Yan", "venue": "개인 블로그 2024-08-18", "summary": "실무 해설. 상관이 0.8~0.9인데 κ는 0.3~0.5인 사례를 들어 상관계수를 경계하라고 했고, 채점관이 맞는 요약은 95% 이상 잡지만 틀린 요약은 30~60%만 잡았다고 소개했다.", "grade": "C", "basis": "실무 해설", "url": "https://eugeneyan.com/writing/llm-evaluators/", "detail": false}, {"key": "thornton2026", "aliases": ["Thornton 2026", "Thornton"], "title": null, "authors": "Thornton", "venue": "arXiv 프리프린트 2026", "summary": "보안 리뷰에서 적대적 코드 주석이 탐지에 미친 효과가 유의하지 않았다(p>0.21)고 보고해, 채점관이 표면 단서에 흔들린다는 Moon 외 결과와 엇갈리는 재반론으로 쓰였다.", "grade": "D", "basis": null, "url": "https://arxiv.org/abs/2602.16741", "detail": false}, {"key": "gupta2018", "aliases": ["Gupta & Sundaresan 2018", "DeepCodeReviewer"], "title": null, "authors": "Gupta, Sundaresan", "venue": "KDD 2018", "summary": "저장된 리뷰 코멘트를 코드에 맞춰 순위 매긴 Microsoft의 초기 딥러닝 방식. 후속 정리에 따르면 recall 10%를 얻으려면 오탐 60% 이상을 감수해야 했다(원문 미확인).", "grade": null, "basis": null, "url": null, "detail": false}, {"key": "commentfinder2022", "aliases": ["CommentFinder (Hong 외, FSE 2022)", "CommentFinder"], "title": "CommentFinder: A Simpler, Faster, More Accurate Code Review Comments Recommendation", "authors": "Hong 외", "venue": "ESEC/FSE 2022", "summary": "단어 가방과 코사인 유사도만 쓰는 단순 검색 방식으로, 기존 딥러닝보다 top-1 정확 일치가 32% 좋고 49배 빨랐다. 단순한 방법이 복잡한 모델을 이긴 사례(초록 수준 확인).", "grade": "A", "basis": "대표 접근", "url": "https://2022.esec-fse.org/details/fse-2022-research-papers/41/CommentFinder-A-Simpler-Faster-More-Accurate-Code-Review-Comments-Recommendation", "detail": false}, {"key": "tufano2021", "aliases": ["Tufano 외 2021", "Tufano 2021"], "title": null, "authors": "Tufano 외", "venue": "ICSE 2021", "summary": "리뷰 자동화를 생성 과제로 처음 정식화한 연구. 지표는 정확 일치(완벽 예측)였고 리뷰어 쪽 과제(코멘트→코드)에서 최대 31%였다.", "grade": "A", "basis": "원조", "url": "https://arxiv.org/pdf/2101.02518", "detail": false}, {"key": "tufano2022", "aliases": ["Tufano 외 2022", "Tufano 2022"], "title": null, "authors": "Tufano 외", "venue": "ICSE 2022", "summary": "사전학습 T5로 코드→코멘트 과제를 더했다. 정확 일치는 2.12%였고, 저자 스스로 CodeBLEU가 예측 품질에 대해 말해 주는 것이 적다고 했다.", "grade": "A", "basis": "원조", "url": "https://arxiv.org/pdf/2201.06850", "detail": false}, {"key": "auger2022", "aliases": ["AUGER (Li 외, FSE 2022)", "AUGER"], "title": null, "authors": "Li 외", "venue": "ESEC/FSE 2022", "summary": "리뷰 79,344개 중 약 85%를 노이즈로 걸러 내고 코멘트를 생성했다. '생성 코멘트의 29%가 유용'은 사람이 아니라 휴리스틱으로 판정한 값이다.", "grade": "A", "basis": "대표 접근", "url": "https://arxiv.org/pdf/2208.08014", "detail": false}, {"key": "autotransform2022", "aliases": ["AutoTransform"], "title": null, "authors": "Thongtanunam 외", "venue": "ICSE 2022", "summary": "서브워드(BPE) 토큰화로 입력에 없는 토큰도 만들 수 있게 한 코드 수정 방식. 같은 시기 대표 접근으로 소개했고, 시간순 분할 재현 확인에서 기준선으로 쓰였다.", "grade": "A", "basis": "대표 접근", "url": null, "detail": false}, {"key": "hellendoorn2021", "aliases": ["Hellendoorn 외 2021", "Hellendoorn 2021"], "title": null, "authors": "Hellendoorn 외", "venue": "ESEC/FSE 2021 (비전 논문)", "summary": "실제 PR에서 어디에 코멘트가 달릴지 예측했다. diff 덩어리의 약 10%에만 코멘트가 달리고 모든 모델이 정밀도 50%를 넘지 못했다.", "grade": "A", "basis": "문제 제기", "url": "https://vhellendoorn.github.io/fse2021-ivr.pdf", "detail": false}, {"key": "zhou2023", "aliases": ["Zhou 외 2023", "Zhou 2023"], "title": null, "authors": "Zhou 외", "venue": "ICPC 2023", "summary": "범용 사전학습 모델(CodeT5)이 리뷰 전용 도구보다 13.4~38.9% 나았고, 부분 점수 지표(Edit Progress)를 쓰면 모델 순위가 바뀌었다.", "grade": "A", "basis": "문제 제기", "url": "https://arxiv.org/pdf/2303.07221", "detail": false}, {"key": "llamareviewer2023", "aliases": ["LLaMA-Reviewer"], "title": null, "authors": "Lu 외", "venue": "ISSRE 2023", "summary": "LLaMA 6.7B를 LoRA로 경량 미세조정해 코멘트 BLEU-4 5.70(CodeReviewer 5.32)을 얻었다. 저자도 BLEU가 결정적 지표로 널리 인정되지 않는다고 썼다.", "grade": "A", "basis": "영향", "url": "https://arxiv.org/pdf/2308.11148", "detail": false}, {"key": "guo2024", "aliases": ["Guo 외 2024", "Guo 2024"], "title": null, "authors": "Guo 외", "venue": "ICSE 2024", "summary": "CodeReviewer 데이터의 저품질 문제로 새 데이터셋(CodeReview-New)을 만들어 ChatGPT의 코드 수정을 평가했다. EM 22.78 vs CodeReviewer 15.50이었고 실패의 주원인은 불명확한 리뷰 코멘트였다.", "grade": "A", "basis": "영향", "url": "https://arxiv.org/pdf/2309.08221", "detail": false}, {"key": "pornprasit2024", "aliases": ["Pornprasit & Tantithamthavorn 2024", "Pornprasit 2024 IST", "Pornprasit 2024"], "title": null, "authors": "Pornprasit, Tantithamthavorn", "venue": "IST 2024 (vol. 175)", "summary": "GPT-3.5로 제로샷·퓨샷·미세조정(학습 데이터 6%)을 비교해 대부분 미세조정이 가장 좋았지만 예외가 있었다. 초록의 향상 범위는 선택적으로 인용된 값이었다.", "grade": "A", "basis": "시간 분할·학습 방식", "url": "https://export.arxiv.org/pdf/2402.00905", "detail": false}, {"key": "tufano2024tse", "aliases": ["Tufano 외 2024 TSE", "Tufano 2024 TSE", "Tufano 외 2024", "Tufano 2024"], "title": null, "authors": "Tufano 외", "venue": "IEEE TSE 2024 (50(2))", "summary": "예측 2,291건을 105인시 동안 수작업 검토해 약 25%(574건)가 데이터 추출 오류임을 보였다. CodeReviewer 코멘트 생성 재실행 정확 일치는 0/1,611이었다.", "grade": "A", "basis": "반론(데이터 품질)", "url": "https://arxiv.org/pdf/2401.05136", "detail": false}, {"key": "liu2025msr", "aliases": ["Liu 외 2025 \"Too Noisy To Learn\"", "Liu, Lin, Thongtanunam 2025", "Too Noisy To Learn", "Liu 외 2025 MSR", "Liu 2025 MSR", "Liu 외 2025", "Liu 2025"], "title": "Too Noisy To Learn", "authors": "Liu, Lin, Thongtanunam", "venue": "MSR 2025", "summary": "CodeReviewer 학습 코멘트 표본 중 64%만 유효함을 보였다. LLM으로 정제하자 데이터는 25~66% 줄고 BLEU-4는 7.5~13% 올랐다.", "grade": "A", "basis": "반론(데이터 품질)", "url": "https://arxiv.org/pdf/2502.02757", "detail": false}, {"key": "yangtosem", "aliases": ["Yang 외 TOSEM"], "title": "A Roadmap for Modern Code Review: Challenges and Opportunities", "authors": "Yang 외", "venue": "ACM TOSEM", "summary": "2013~2025년 현대 코드 리뷰 연구를 정리한 로드맵 논문. '가치 중심 평가'를 패러다임 전환의 하나로 제안했다(초록 수준 확인).", "grade": "A", "basis": "체계적 문헌 리뷰", "url": "https://arxiv.org/pdf/2405.18216", "detail": false}, {"key": "tufano2025icse", "aliases": ["Tufano 2025 ICSE", "Tufano 외 2025", "Tufano 2025"], "title": "Deep Learning-based Code Reviews: A Paradigm Shift or a Double-Edged Sword?", "authors": "Tufano 외", "venue": "ICSE 2025", "summary": "현업 개발자 29명 통제 실험. 리뷰어가 LLM이 찾은 이슈의 89%를 그대로 유지하며 그 위치에 주의가 쏠렸고(앵커링), 심각한 이슈는 더 찾지 못했으며 시간도 절약되지 않았다.", "grade": "A", "basis": "통제 실험", "url": "https://arxiv.org/pdf/2411.11401", "detail": false}, {"key": "crbugbench", "aliases": ["CRBugBench"], "title": null, "authors": "Yang 외", "venue": "arXiv 프리프린트 2026-10 (CMU·Microsoft)", "summary": "머지 전 리뷰에서 잡힌 버그와 머지 후 고쳐진 버그(SZZ로 원인 PR 추적)를 정답으로 삼아 recall@k만 잰다. 사내 저장소 800개 과제에서 성능이 최대 25.5% 떨어졌고, '사람 약 50%'는 데이터 구성 탓이라는 점이 짚였다.", "grade": "D", "basis": "최신, 대기업·연구소가 공개했거나 다른 연구가 비교 대상으로 씀", "url": "https://export.arxiv.org/pdf/2610.13668", "detail": false}, {"key": "aacrbench", "aliases": ["AACR-Bench"], "title": null, "authors": null, "venue": "arXiv 프리프린트 2026-01 (남경대·Alibaba)", "summary": "사람 리뷰 기반 코멘트 391개에 LLM 6개가 만들고 엔지니어가 검증한 코멘트 1,114개를 더한 PR 200개 벤치마크. 정답을 만든 모델이 평가 대상이기도 한 순환 문제의 예로 쓰였다.", "grade": "D", "basis": "최신, 대기업·연구소가 공개했거나 다른 연구가 비교 대상으로 씀", "url": "https://export.arxiv.org/pdf/2601.19494", "detail": false}, {"key": "ccrab", "aliases": ["c-CRAB"], "title": null, "authors": null, "venue": "arXiv 프리프린트 2026-03 (NUS)", "summary": "사람 리뷰 코멘트를 숨겨진 테스트로 바꾸고, 리뷰대로 고친 코드가 테스트를 통과하는지로 채점한다. Claude Code 32.1%, 네 도구 합집합 41.5%로 도구마다 잡는 문제가 다르다는 근거로 쓰였다.", "grade": "D", "basis": "최신, 대기업·연구소가 공개했거나 다른 연구가 비교 대상으로 씀", "url": "https://arxiv.org/html/2603.23448", "detail": false}, {"key": "mcrbench", "aliases": ["MCR-Bench"], "title": null, "authors": null, "venue": "ISSTA 2026 (중산대·Huawei)", "summary": "여러 회차에 걸친 리뷰 2,269건(5개 언어)으로 만든 벤치마크로, LLM 후보를 사람이 검증해 정답을 만들었다(κ 0.87). 동료 심사 학회에 실린 최신 벤치마크 예로 비교표에 들어갔다.", "grade": "A", "basis": "최신·학회", "url": "https://arxiv.org/html/2608.27442", "detail": false}, {"key": "contextcrbench", "aliases": ["ContextCRBench"], "title": null, "authors": null, "venue": "FSE 2026 (OpenAlex 기준, HIT·ByteDance)", "summary": "사람 리뷰 코멘트 기반 67,910건 벤치마크로 품질 판단·결함 위치·코멘트 생성 세 과제를 잰다. 매칭에 아직 ROUGE를 쓰는 예외로 언급됐다.", "grade": "A", "basis": "최신", "url": "https://arxiv.org/html/2511.07017", "detail": false}, {"key": "codefusecrbench", "aliases": ["CodeFuse-CR-Bench"], "title": null, "authors": null, "venue": "arXiv 프리프린트 2025-09 (Ant Group 외)", "summary": "Python 프로젝트 70개, 601건을 사람 리뷰 코멘트로 정답 삼고 규칙·보상모델·LLM 판정을 섞은 종합 점수로 채점한다. '사람 코멘트를 정답으로' 하는 방식의 대표 예로 쓰였다.", "grade": "D", "basis": "최신, 대기업·연구소가 공개했거나 다른 연구가 비교 대상으로 씀", "url": "https://arxiv.org/html/2509.14856", "detail": false}, {"key": "sweprbench", "aliases": ["SWE-PRBench"], "title": null, "authors": "Deepak Kumar", "venue": "arXiv 프리프린트 2026-03", "summary": "개인 연구자가 PR 350개의 사람 리뷰 코멘트를 정답으로 만든 벤치마크. 채점관을 사람과 30건으로만 대조했다는 점이 체크리스트 예로 쓰였다.", "grade": "D", "basis": "최신, 대기업·연구소가 공개했거나 다른 연구가 비교 대상으로 씀", "url": "https://arxiv.org/html/2603.26130", "detail": false}, {"key": "codereviewqa", "aliases": ["CodeReviewQA"], "title": null, "authors": null, "venue": "Findings of ACL 2025 (멜버른대·SMU)", "summary": "코드 수정 과제를 객관식으로 쪼갠 900건(9개 언어) 벤치마크로, 채점에 LLM 판정 대신 객관식 정답을 쓰는 예외로 언급됐다.", "grade": "A", "basis": "최신·학회", "url": "https://arxiv.org/html/2503.16167", "detail": false}, {"key": "martiancrb", "aliases": ["Martian Code Review Bench", "Martian CRB"], "title": null, "authors": null, "venue": "GitHub 저장소 (Martian, MIT) 2026", "summary": "벤더 Martian의 벤치마크로, online은 리뷰 봇의 제안이 실제 코드 변경으로 이어졌는지를, offline은 PR 50개·정답 173개를 LLM 3개로 판정한다. 사람 주석과 공식 보정하지 않았다는 점과 Copilot 순위(online 6위, offline 5위)가 쓰였다.", "grade": "B", "basis": "벤더 벤치마크(실행 주체 차이 사례)", "url": "https://github.com/withmartian/code-review-benchmark", "detail": false}, {"key": "qodoprreviewbench", "aliases": ["Qodo PR-Review-Bench", "Qodo 1.0"], "title": null, "authors": null, "venue": "Hugging Face 데이터셋 (Qodo) 2026-02", "summary": "벤더 Qodo가 PR 100개에 결함 580개를 주입해 만든 벤치마크로, 매칭 방식은 공개하지 않았다. Qodo 자신이 F1 60.1%를 보고한 벤더 자체 벤치마크 예로 쓰였다.", "grade": "D", "basis": "벤더 벤치마크(실행 주체 차이 사례)", "url": "https://huggingface.co/datasets/Qodo/PR-Review-Bench", "detail": false}, {"key": "greptilebenchmark", "aliases": ["Greptile 자체 벤치마크"], "title": null, "authors": null, "venue": "Greptile 웹사이트 2025-07", "summary": "벤더 Greptile이 다시 넣은 버그 50개로 탐지율을 잰 자체 벤치마크로 Greptile이 82%였다. 같은 데이터를 Augment가 다시 돌리자 45%가 나와, 누가 돌렸는지에 따라 결과가 크게 달라진다는 근거로 쓰였다.", "grade": "D", "basis": "벤더 벤치마크(실행 주체 차이 사례)", "url": "https://www.greptile.com/benchmarks", "detail": false}, {"key": "augmentrerun", "aliases": ["Augment 재실행"], "title": null, "authors": null, "venue": "Augment 블로그 2026", "summary": "Augment가 AI 코드 리뷰 도구 7개를 실제 PR로 비교한 글로, Greptile 데이터를 다시 돌려 Greptile 45%를 얻었다(정답 코멘트를 추가해 정의가 다르다). 벤더 자체 실행과 제3자 재실행 결과 차이의 근거로 쓰였다.", "grade": "D", "basis": "벤더 벤치마크(실행 주체 차이 사례)", "url": "https://www.augmentcode.com/blog/we-benchmarked-7-ai-code-review-tools-on-real-world-prs-here-are-the-results", "detail": false}, {"key": "cursorbugbotcomparison", "aliases": ["Cursor 자체 비교"], "title": null, "authors": null, "venue": "Cursor 블로그 2026-04", "summary": "Cursor가 공개 저장소만으로 LLM 판정을 써서 자사 Bugbot(78.13%)과 Copilot(46.69%) 등을 비교한 자체 결과. 판정 프롬프트가 비공개인 벤더 자체 비교 예로 쓰였다.", "grade": "D", "basis": "벤더 벤치마크(실행 주체 차이 사례)", "url": "https://cursor.com/blog/bugbot-learning", "detail": false}, {"key": "pacebench", "aliases": ["PACE-Bench"], "title": null, "authors": null, "venue": "arXiv 프리프린트 2026-10 (저장대·Alibaba)", "summary": "리뷰 에이전트가 아니라 코딩 에이전트의 패치가 PRD(제품 요구사항)를 충족하는지 원자 단위 인수 기준(Code Point) 750개로 채점한다. '기획 충족' 관점을 재는 방식의 예로 쓰였고, 전문가 합의 95.2%가 블라인드가 아니라는 점도 짚였다.", "grade": "D", "basis": "기획 충족·공격 내성이라는 다른 축", "url": "https://export.arxiv.org/pdf/2610.26394", "detail": false}, {"key": "sevrabench", "aliases": ["SEVRA-BENCH"], "title": null, "authors": null, "venue": "arXiv 프리프린트 2026-06", "summary": "실제 취약점을 다시 넣은 PR을 설득 문구 15종으로 포장했을 때 리뷰 에이전트가 승인하는 비율을 잰다(PR 약 1,000개, 에이전트 8개). 공격 내성 평가의 예로 쓰였다.", "grade": "D", "basis": "기획 충족·공격 내성이라는 다른 축", "url": "https://arxiv.org/abs/2606.13757", "detail": false}, {"key": "arxiv260318740", "aliases": ["arXiv 2603.18740", "2603.18740"], "title": null, "authors": null, "venue": "arXiv 프리프린트 2026-03 (ICSE 2027 예정 표기)", "summary": "다듬은 PR 문구(편향 주입)로 CVE 33개 중 32개(97%)를 Claude Code·CodeRabbit의 보안 판정에서 숨겼다. 리뷰 에이전트가 PR 문구에 속을 수 있다는 공격 내성 근거로 쓰였다.", "grade": "D", "basis": "기획 충족·공격 내성이라는 다른 축", "url": "https://arxiv.org/abs/2603.18740", "detail": false}, {"key": "csacommentandcontrol", "aliases": ["CSA \"Comment and Control\"", "Comment and Control"], "title": null, "authors": null, "venue": "CSA 연구 노트 2026-04", "summary": "PR·이슈 필드의 프롬프트 인젝션으로 CI 리뷰 에이전트(Claude Code Security Review, Gemini CLI Action, Copilot Agent)가 시크릿을 유출한 사례를 정리한 노트로, 벤치마크는 아니다. 공격 내성 사례로 쓰였다.", "grade": "C", "basis": null, "url": "https://labs.cloudsecurityalliance.org/research/csa-research-note-comment-control-github-prompt-injection-20/", "detail": false}, {"key": "survey260213377", "aliases": ["서베이 2602.13377", "2602.13377"], "title": null, "authors": "Khan 외", "venue": "arXiv 프리프린트 2026-02 (Manitoba·Huawei·Concordia)", "summary": "코드 리뷰 자동화 논문 99편을 분야 5개·세부 과제 18개로 분류한 서베이. 분야 전체 지도로 출처에 실렸다.", "grade": "D", "basis": "분야 지도(99편)", "url": "https://export.arxiv.org/pdf/2602.13377", "detail": false}, {"key": "swebench", "aliases": ["SWE-bench"], "title": null, "authors": null, "venue": null, "summary": "실제 GitHub 이슈를 고치는 코딩 에이전트 벤치마크. 이 장에서는 CR-Bench가 이 데이터의 결함을 리뷰 과제로 바꿔 만들었다는 맥락으로만 나온다.", "grade": null, "basis": null, "url": null, "detail": false}, {"key": "frommgen2024", "aliases": ["Frömmgen 외 2024", "Frömmgen 외"], "title": "Resolving Code Review Comments with Machine Learning", "authors": "Frömmgen 외", "venue": "ICSE-SEIP 2024", "summary": "Google이 리뷰어 코멘트를 받아 모델이 수정 코드를 제안하게 한 사례. 목표 정밀도를 사용자 반응으로 70→50→40%로 낮췄고, 전체 리뷰어 코멘트 중 ML 수정으로 해결된 비율이 V1 4.9%, V2 7.5%였다.", "grade": "A", "basis": "1차", "url": "https://storage.googleapis.com/gweb-research2023-media/pubtools/7525.pdf", "detail": false}, {"key": "googleblog2023", "aliases": ["Google Research 블로그 2023"], "title": null, "authors": null, "venue": "Google Research 블로그 2023-05", "summary": "위 ML 코멘트 해결 시스템을 소개한 Google 블로그. 미리 본 제안의 40~50%가 적용됐고 '미리 보기' 비율 같은 온라인 수치를 담았다(자기 보고).", "grade": "B", "basis": "1차", "url": "https://research.google/blog/resolving-code-review-comments-with-ml/", "detail": false}, {"key": "autocommenter", "aliases": ["AutoCommenter (AIware 2024)", "Google AutoCommenter", "AutoCommenter"], "title": null, "authors": "Vijayvergiya 외", "venue": "AIware 2024", "summary": "Google이 모범 사례 위반을 가이드 URL과 함께 지적하는 도구를 배포한 논문. 유용 비율이 54%에서 정체되다 잡음 많은 URL 22개를 끄고 요약을 고쳐 80% 이상이 됐고, 저자들은 오프라인 평가가 실제 성능을 잘 예측하지 못했다고 썼다.", "grade": "A", "basis": "1차", "url": "https://arxiv.org/html/2405.13565v1", "detail": false}, {"key": "tricorder2015", "aliases": ["Sadowski 외 2015 Tricorder", "Google Tricorder", "Tricorder 2015", "Tricorder"], "title": "Tricorder: Building a Program Analysis Ecosystem", "authors": "Sadowski 외", "venue": "ICSE 2015", "summary": "Google이 정적분석 결과를 코드 리뷰에 붙인 대규모 사례다. '사용자가 아무 조치도 하지 않은 보고'를 유효 오탐으로 세고, Not useful 비율이 10% 이상이면 관찰·25% 넘으면 끌 수 있게 한 기준의 원전으로 쓰였다.", "grade": "A", "basis": "원조", "url": "https://www.cs.umd.edu/class/spring2019/cmsc414/papers/tricorder-building-a-program-analysis-ecosystem.pdf", "detail": false}, {"key": "sadowskicacm2018", "aliases": ["Sadowski CACM 2018", "CACM 2018"], "title": null, "authors": "Sadowski 외", "venue": "CACM 2018", "summary": "Google 정적분석 도구 운영 경험을 정리한 글. 리뷰 시점 검사는 유효 오탐 10% 미만이어야 하고, 이 10% 기준은 '다소 임의로' 처음 정했다고 밝혔다.", "grade": "A", "basis": "원조(유효 오탐)", "url": "https://6826.csail.mit.edu/2020/papers/google-analysis-cacm.pdf", "detail": false}, {"key": "sweatgooglech20", "aliases": ["Software Engineering at Google", "SWE at Google 20장"], "title": null, "authors": null, "venue": "책 Software Engineering at Google 20장 (2020)", "summary": "Google 정적분석(Tricorder·Critique) 운영을 설명한 장. 새 검사기는 최소 90% 경우 진짜 문제를 가리켜야 하고 전체 유효 오탐률은 5% 바로 아래라고 적었다.", "grade": "B", "basis": "1차", "url": "https://abseil.io/resources/swe-book/html/ch20.html", "detail": false}, {"key": "googlestrategy2024", "aliases": ["Google 전체 전략 블로그", "전략 블로그 2024"], "title": null, "authors": null, "venue": "Google Research 블로그 2024-06", "summary": "Google의 소프트웨어 공학 AI 전략 글. 오프라인 지표는 대략적인 대리 지표로 보고 온라인 실험으로 결정하며, 사용자가 직접 켜야 하는 기능은 확산되지 않았다고 했다.", "grade": "B", "basis": "1차", "url": "https://research.google/blog/ai-in-software-engineering-at-google-progress-and-the-path-ahead/", "detail": false}, {"key": "metamatecr", "aliases": ["Meta MetaMateCR", "MetaMateCR"], "title": null, "authors": null, "venue": "FSE 2026 산업 트랙 (arXiv 2507.13499)", "summary": "Meta가 리뷰어 코멘트에 맞춰 수정 패치를 만들어 주는 시스템. 패치를 리뷰어에게도 보이자 리뷰 시간이 5.5% 늘어 철회했고, 작성자에게만 보이자 문제가 없었다.", "grade": "A", "basis": "1차", "url": "https://arxiv.org/html/2507.13499v1", "detail": false}, {"key": "radar", "aliases": ["RADAR"], "title": null, "authors": null, "venue": "arXiv 2605.30208 (2026, 프리프린트)", "summary": "Meta가 위험도로 거른 저위험 diff를 LLM이 자동 승인하게 한 사례. 되돌림·장애 비율이 낮았다고 하지만 무작위 배정이 없고 LLM 단계 자체 평가도 없다.", "grade": "D", "basis": "1차", "url": "https://arxiv.org/html/2605.30208", "detail": false}, {"key": "arctic", "aliases": ["ARCTIC"], "title": null, "authors": null, "venue": "arXiv 2607.29516 (2026, 프리프린트)", "summary": "Meta의 제로샷 AI 리뷰어와 사람 리뷰의 코멘트 주제를 비교한 연구. AI는 모범 사례 지적이 과다(30.8% vs 7.2%)하고 보안 지적이 적었다(2.0% vs 19.1%). 주제 분류는 LLM이 했다.", "grade": "D", "basis": "1차", "url": "https://arxiv.org/html/2607.29516", "detail": false}, {"key": "nudgebot", "aliases": ["NudgeBot (FSE 2022)", "NudgeBot"], "title": "Using Nudges to Accelerate Code Reviews at Scale", "authors": "Shan 외", "venue": "FSE 2022", "summary": "Meta가 오래된 리뷰를 독촉하는 봇을 3만 명 이상 대상 군집 무작위 A/B로 시험한 연구. 리뷰 시간 −6.8%이고, 대충 승인을 막으려 '실제로 diff를 본 시간'을 보조 지표로 함께 봤다.", "grade": "A", "basis": "1차", "url": "https://2022.esec-fse.org/details/fse-2022-research-papers/26/Using-Nudges-to-Accelerate-Code-Reviews-at-Scale", "detail": false}, {"key": "metareviewerrec", "aliases": ["arXiv 2312.17169"], "title": null, "authors": null, "venue": "arXiv 2312.17169 (프리프린트)", "summary": "Meta의 리뷰어 추천 A/B 시험 3회. 저자들은 백테스트(과거 데이터 재현) 결과가 실서비스 실험과 너무 달라 놀랐다고 썼다.", "grade": "D", "basis": "1차", "url": "https://arxiv.org/html/2312.17169v2", "detail": false}, {"key": "testgenllm", "aliases": ["Meta TestGen-LLM", "TestGen-LLM"], "title": null, "authors": null, "venue": "FSE 2024", "summary": "Meta의 LLM 테스트 생성 도구. 생성물을 빌드→안정 통과→커버리지 증가 단계로 걸렀고(75%→57%→25%) 추천의 73%가 수용됐다. '필터 뒤에 LLM 출력'의 선례로 인용.", "grade": "A", "basis": "1차", "url": "https://arxiv.org/abs/2402.09171", "detail": false}, {"key": "msengblog2025", "aliases": ["Engineering@Microsoft 블로그 2025-07", "Microsoft Engineering 블로그 2025"], "title": null, "authors": null, "venue": "Engineering@Microsoft 블로그 2025-07", "summary": "Microsoft 사내 AI 리뷰어가 PR의 90% 이상에 적용되고 PR 완료 시간 중앙값이 10~20% 개선됐다는 글. 평가 방법·정확도·한계는 공개하지 않았다.", "grade": "B", "basis": "1차", "url": "https://devblogs.microsoft.com/engineering-at-microsoft/enhancing-code-quality-at-scale-with-ai-powered-code-reviews/", "detail": false}, {"key": "nudgetosem", "aliases": ["Nudge (TOSEM 2022)", "Nudge (TOSEM)"], "title": null, "authors": null, "venue": "TOSEM 2022", "summary": "Microsoft가 지연된 PR에 알림을 보내는 시스템을 147개 저장소에서 무작위 시험한 연구. PR 해결 시간 −60%(PR 8,500개), 알림의 73%가 긍정 평가를 받았다.", "grade": "A", "basis": "1차", "url": "https://arxiv.org/abs/2011.12468", "detail": false}, {"key": "github60m", "aliases": ["Copilot code review"], "title": null, "authors": null, "venue": "GitHub 블로그 2026-03", "summary": "GitHub Copilot 코드 리뷰 운영 수치(자기 보고). 리뷰의 71%가 실행 가능한 피드백을 냈고 리뷰당 코멘트 약 5.1개이며, 👍/👎·설문·머지 전 해결 여부를 신호로 쓴다.", "grade": "B", "basis": "1차", "url": "https://github.blog/ai-and-ml/github-copilot/60-million-copilot-code-reviews-and-counting/", "detail": false}, {"key": "githubbettertools", "aliases": ["도구 교체의 교훈"], "title": null, "authors": null, "venue": "GitHub 블로그 2026-07", "summary": "Copilot 리뷰를 공용 CLI 도구로 바꾸자 비용이 늘고 유용한 코멘트가 줄었으며, 도구 설명을 리뷰어 작업 흐름에 맞게 다시 쓰자 비용이 약 20% 줄었다는 글(자기 보고).", "grade": "B", "basis": "1차", "url": "https://github.blog/ai-and-ml/github-copilot/better-tools-made-copilot-code-review-worse-heres-how-we-actually-improved-it/", "detail": false}, {"key": "rovodev", "aliases": ["RovoDev Code Reviewer", "Atlassian RovoDev", "RovoDev"], "title": null, "authors": null, "venue": "ICSE-SEIP 2026", "summary": "Atlassian이 Claude 3.5 Sonnet에 사실성 판정기·실행 가능성 필터를 붙여 배포한 리뷰어. 코멘트 단 줄이 다음 커밋에서 바뀐 비율이 38.70%(사람 44.45%)였고, 실행 가능성 필터가 15~20점을 올렸다.", "grade": "A", "basis": "1차", "url": "https://arxiv.org/pdf/2601.01129", "detail": false}, {"key": "goldman2025", "aliases": ["Atlassian ASE 2025", "후속 ASE 2025 산업 발표"], "title": null, "authors": "Goldman 외", "venue": "ASE 2025 산업 발표 (arXiv 2510.05450)", "summary": "Atlassian RovoDev 코멘트를 유형별로 나눠 해결률을 잰 후속 연구. 가독성 43.3%, 버그 41.9%, 유지보수성 36.2%, 설계 28.6%였다.", "grade": "D", "basis": "1차", "url": "https://arxiv.org/pdf/2510.05450", "detail": false}, {"key": "ureview", "aliases": ["Uber uReview", "uReview"], "title": null, "authors": null, "venue": "Uber 엔지니어링 블로그 2025-08", "summary": "Uber가 생성기 3개 → 확신도 점수 → 중복 병합 → 범주 억제 구조로 만든 리뷰어. 코멘트 75%가 유용 평가, 65%가 반영됐다고 했다(반영 = 5번 재실행해도 비슷한 코멘트가 다시 안 나옴).", "grade": "B", "basis": "1차", "url": "https://www.uber.com/blog/ureview/", "detail": false}, {"key": "bitsaicr", "aliases": ["BitsAI-CR"], "title": null, "authors": null, "venue": "arXiv 2501.15134 (게재처 미확인)", "summary": "ByteDance의 규칙 219개 기반 리뷰 시스템. 생성 뒤 필터를 두고, 정밀도·outdated rate 기준으로 규칙을 퇴출하며 온라인 정밀도 75.0%를 보고했다. 필터가 결론을 먼저 쓰게 하자 정밀도가 올랐다.", "grade": "D", "basis": "1차", "url": "https://arxiv.org/html/2501.15134", "detail": false}, {"key": "codeguru", "aliases": ["CodeGuru (ICSE 2023)", "CodeGuru Reviewer"], "title": "A Language-agnostic Framework for Mining Static Analysis Rules from Code Changes", "authors": "Sedick David Baker Effendi, Berk Çirisci, Rajdeep Mukherjee, Hoan Anh Nguyen, Omer Tripp", "venue": "ICSE 2023", "summary": "Amazon이 코드 변경 이력에서 정적 규칙 62개를 캐내 CodeGuru Reviewer에 넣은 연구. 그 추천의 73%가 개발자에게 수용됐다.", "grade": "A", "basis": "1차", "url": "https://amazon.science/publications/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes", "detail": true}, {"key": "amazonq", "aliases": ["Amazon Q Developer"], "title": null, "authors": null, "venue": "AWS 문서", "summary": "Amazon Q Developer의 GitHub 리뷰 기능 문서. 동작 설명만 있고 정확도 데이터는 공개되지 않았다.", "grade": null, "basis": null, "url": "https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/github-code-reviews.html", "detail": false}, {"key": "claudecodereview", "aliases": ["Claude Code Review"], "title": null, "authors": null, "venue": "Anthropic(claude.com) 블로그 2026-03", "summary": "Anthropic 사내 코드 리뷰 사례(자기 보고). 실질 코멘트를 받은 PR이 16%에서 54%로 늘었고 '틀림' 표시는 1% 미만이라 했지만, 표시 방법은 정의하지 않았다.", "grade": "B", "basis": "1차(자기 보고)", "url": "https://claude.com/blog/code-review", "detail": false}, {"key": "anthropiccodereviewplugin", "aliases": ["Anthropic 플러그인"], "title": null, "authors": null, "venue": "GitHub 저장소 anthropics/claude-plugins-official", "summary": "Anthropic이 공개한 /code-review 플러그인 설계. 병렬 에이전트 4개가 찾고 이슈마다 검증 서브에이전트가 확인되지 않은 것을 버린다. 수치는 없다.", "grade": "B", "basis": "1차(자기 보고)", "url": "https://github.com/anthropics/claude-plugins-official/blob/main/plugins/code-review/commands/code-review.md", "detail": false}, {"key": "openaicodex", "aliases": ["OpenAI Codex", "Codex 리뷰"], "title": null, "authors": null, "venue": "OpenAI alignment 블로그 2025-12", "summary": "OpenAI가 리뷰어를 별도 과제로 훈련하며 재현율 일부를 내주고 정밀도를 택한 사례. 코멘트의 52.7%가 코드 변경으로 이어졌다(자기 보고).", "grade": "B", "basis": "1차(자기 보고)", "url": "https://alignment.openai.com/scaling-code-verification/", "detail": false}, {"key": "cursorbugbot", "aliases": ["Cursor Bugbot", "Bugbot"], "title": null, "authors": null, "venue": "Cursor 블로그 2026-01·04", "summary": "Cursor의 PR 버그 탐지 도구. 실험 40회로 해결률이 52%에서 70% 이상이 됐다고 했고, 해결 여부는 머지 시점에 LLM이 판정한다(판정 프롬프트 비공개).", "grade": "D", "basis": "1차(자기 보고)", "url": "https://cursor.com/blog/building-bugbot", "detail": false}, {"key": "graphitediamond", "aliases": ["Graphite Diamond", "Graphite (발표)"], "title": null, "authors": null, "venue": "AI Engineer 발표 2025", "summary": "Graphite Diamond 코멘트의 52%가 같은 PR 안에서 반영됐고(사람 약 50%) 👎는 4% 미만이라는 발표. 분모가 공개되지 않았고 원 발표는 요약만 확인했다.", "grade": "C", "basis": "1차(자기 보고)", "url": "https://www.ai.engineer/talks/TswQeKftnaw-ai-powered-entomology-lessons-from-millions-ai", "detail": false}, {"key": "coderabbitframework", "aliases": ["CodeRabbit (2026-01)"], "title": null, "authors": null, "venue": "CodeRabbit 블로그 2026-01", "summary": "수용률을 정밀도 대리 지표로 쓰는 AI 코드 리뷰 평가 틀을 제시한 벤더 글. 내부 수치는 없다.", "grade": "D", "basis": "1차(자기 보고)", "url": "https://coderabbit.ai/blog/framework-for-evaluating-ai-code-review-tools", "detail": false}, {"key": "beko2025", "aliases": ["Beko (ICSE-SEIP 2025)", "Beko"], "title": null, "authors": null, "venue": "ICSE-SEIP 2025", "summary": "Beko가 Qodo PR-Agent + GPT-4로 AI 리뷰를 도입한 산업 연구. 코멘트 73.8%가 개발자 자기 라벨로 '해결'됐지만 PR 종료 시간은 평균 5h52m에서 8h20m로 늘었다.", "grade": "A", "basis": "1차 산업 논문", "url": "https://arxiv.org/html/2412.18531v2", "detail": false}, {"key": "revmate", "aliases": ["Mozilla·Ubisoft RevMate", "Mozilla·Ubisoft", "Mozilla/Ubisoft", "RevMate"], "title": null, "authors": null, "venue": "arXiv 2411.07091 (2024 프리프린트)", "summary": "Mozilla·Ubisoft에서 리뷰어가 LLM 제안 코멘트를 골라 게시하게 한 연구. 수용률 8.1%/7.2%였고 리팩터링 제안(약 18%)이 기능 제안(약 5%)보다 훨씬 잘 수용됐다.", "grade": "D", "basis": "1차 산업 논문", "url": "https://arxiv.org/html/2411.07091v1", "detail": false}, {"key": "ericsson2025", "aliases": ["Ericsson"], "title": null, "authors": null, "venue": "ICSME 2025 산업 트랙 (arXiv 2507.19115)", "summary": "Ericsson의 GPT-4 기반 리뷰를 전문가들이 평가한 사례. 긍정 6, 중립 8, 부정 10이었다.", "grade": "D", "basis": "1차 산업 논문", "url": "https://arxiv.org/html/2507.19115v2", "detail": false}, {"key": "kuaishou2025", "aliases": ["Lu 외(ICML 2025)", "Kuaishou"], "title": "Towards Practical Defect-Focused Automated Code Review", "authors": "Lu 외", "venue": "ICML 2025 Spotlight (arXiv 2505.17928)", "summary": "Kuaishou의 코드 슬라이싱 + 검증기 리뷰 연구. C++ 장애 45건으로 오프라인 평가만 했고, 핵심 버그 포함률 최고 20~39%, 오경보율 75% 이상이었다. 사용자 연구는 없다.", "grade": "A", "basis": "1차 산업 논문", "url": "https://arxiv.org/abs/2505.17928", "detail": false}, {"key": "bessey2010", "aliases": ["A Few Billion Lines of Code Later", "Bessey 외 2010 (Coverity)", "Bessey 2010 (Coverity)", "Bessey 외 2010", "Bessey 2010", "Bessey 외"], "title": "A Few Billion Lines of Code Later", "authors": "Bessey 외", "venue": "CACM 2010", "summary": "상용 정적분석 도구 Coverity를 배포하며 얻은 교훈이다. 오탐이 30%를 넘으면 사람들이 도구를 무시하고, 처음 3개쯤의 보고가 틀리면 도구를 불신한다는 근거로 쓰였다.", "grade": "A", "basis": "영향", "url": "https://www.cs.columbia.edu/~junfeng/17sp-e6121/papers/coverity.pdf", "detail": false}, {"key": "distefano2019", "aliases": ["Distefano 외 2019 (Facebook Infer)", "Distefano 2019 (Infer)", "Distefano 외 CACM 2019", "Distefano 외 2019", "Distefano 2019", "Facebook Infer", "Distefano 외"], "title": null, "authors": "Distefano 외", "venue": "CACM 2019", "summary": "Facebook이 정적분석 도구 Infer를 운영한 경험이다. 같은 분석을 야간 일괄 보고로 내면 수정률이 거의 0%, 코드 리뷰 시점 코멘트로 달면 70% 이상이어서 '언제 보여 주나'가 결과를 바꾼다는 근거로 쓰였다(일괄 보고 쪽은 20~30건 규모의 일화).", "grade": "A", "basis": "영향", "url": "https://discovery.ucl.ac.uk/10084236/1/O%27Hearn%20AAM%20scaling-static-analysis-at-facebook.pdf", "detail": false}, {"key": "johnson2013", "aliases": ["Johnson 외 2013", "Johnson 2013"], "title": "Why Don't Software Developers Use Static Analysis Tools to Find Bugs?", "authors": "Johnson 외", "venue": "ICSE 2013", "summary": "개발자 20명을 인터뷰해 정적분석 도구를 쓰지 않는 이유를 물었다. 오탐과 경고 표시 방식이 주된 장벽이라는 근거로 쓰였고, 이 스터디에서는 초록만 확인했다.", "grade": "A", "basis": "영향", "url": "https://research.google/pubs/why-dont-software-developers-use-static-analysis-tools-to-find-bugs/", "detail": false}, {"key": "imtiaz2019", "aliases": ["Imtiaz 외 2019", "Imtiaz 2019"], "title": null, "authors": "Imtiaz 외", "venue": "ISSRE 2019", "summary": "오픈소스 5개 프로젝트에서 Coverity 경고가 실제로 조치된 비율을 쟀다. 27.4~49.5%(중앙값 36.7%)가 조치되었고 수정은 중앙값 4줄·96일이 걸렸다는 실측치로 쓰였다.", "grade": "A", "basis": "실측", "url": "https://lists.ovirt.org/archives/list/devel@ovirt.org/message/EWA4T3NXV7JRXBX6SKRQNZ4WS2XZ76VU/attachment/4/issre19_cameraready.pdf", "detail": false}, {"key": "sun2025", "aliases": ["Does AI Code Review Lead to Code Changes?", "Sun 외 (arXiv 2508.18771, IEEE TSE)", "arXiv 2508.18771", "Sun 외 (TSE)", "Watanabe 외", "Sun 외"], "title": "Does AI Code Review Lead to Code Changes?", "authors": "Sun, Kuang, Baltes, Treude 외", "venue": "IEEE TSE (arXiv 2508.18771)", "summary": "GitHub Actions 기반 AI 리뷰 도구 16개의 코멘트 2.2만 개 이상이 실제 코드 변경으로 이어졌는지 LLM 라벨로 쟀다. '유효하고 반영됨' 비율이 AI 0.9~19.2%, 사람 60%로, AI 리뷰 도구를 독립적으로 비교한 드문 근거로 쓰였다. 이 수치를 'Watanabe 외'로 인용하는 2차 자료는 저자를 잘못 적은 것이다.", "grade": "A", "basis": "독립 측정", "url": "https://arxiv.org/pdf/2508.18771", "detail": false}, {"key": "gohomecopilot2026", "aliases": ["Go Home Copilot (arXiv 2607.21997)", "arXiv 2607.21997", "Go Home Copilot"], "title": null, "authors": null, "venue": "arXiv 2607.21997 (프리프린트, 2026)", "summary": "GitHub의 'Resolve' 버튼 상태로 AI 리뷰 코멘트 해결률을 쟀다(Copilot 73%, Cursor 67%, Codex 53%). 코드 제안이 든 코멘트가 더 잘 해결되었고, 저자 스스로 해결 여부가 '불완전한 대리 지표'라고 한 사례로 쓰였다.", "grade": "D", "basis": "최신 실측", "url": "https://arxiv.org/pdf/2607.21997", "detail": false}, {"key": "coderabbitstudy2026", "aliases": ["CodeRabbit 실사용 연구 (arXiv 2607.03316)", "CodeRabbit 실사용 연구", "arXiv 2607.03316", "CodeRabbit 실사용", "CodeRabbit 연구"], "title": null, "authors": null, "venue": "arXiv 2607.03316 (프리프린트, 2026)", "summary": "실제 저장소에서 CodeRabbit 리뷰 피드백 3.1만 건이 어떻게 처리되었는지 본 연구다. 수용 36.4%, 거절 56.3%라는 실사용 수치로 쓰였다.", "grade": "D", "basis": "최신 실측", "url": "https://arxiv.org/abs/2607.03316", "detail": false}, {"key": "wessel2021", "aliases": ["Wessel 외 2021", "Wessel 2021"], "title": null, "authors": "Wessel 외", "venue": "CSCW 2021", "summary": "오픈소스 관리자 21명을 인터뷰해 봇과 일할 때의 어려움을 물었다(\"Don't disturb me\"). 너무 긴 텍스트·잦은 코멘트·요청하지 않은 행동 같은 '소음'이 핵심 불만이라는 근거로 쓰였다.", "grade": "A", "basis": "봇 소음", "url": "https://arxiv.org/pdf/2103.13950", "detail": false}, {"key": "wessel2022", "aliases": ["Wessel 외 2022", "Wessel 2022"], "title": null, "authors": "Wessel 외", "venue": "EMSE 2022", "summary": "저장소 1,194개에서 코드 리뷰 봇 도입 전후를 회귀 불연속으로 분석했다. 봇 도입 뒤 머지된 PR은 늘고 사람 사이 소통은 줄었다는 근거로 쓰였다(LLM 이전의 커버리지·린트 봇).", "grade": "A", "basis": "봇 소음", "url": "https://arxiv.org/pdf/2103.13547", "detail": false}, {"key": "cynthia2026", "aliases": ["arXiv 2607.24601", "Cynthia 외 2026", "Cynthia 2026"], "title": null, "authors": "Cynthia 외", "venue": "PACM SE 2026 (arXiv 2607.24601)", "summary": "AI가 내놓는 설명의 길이를 바꿔 가며 사람이 AI 판단에 얼마나 따르는지 실험했다. 중간 길이 설명에서 AI와의 일치도가 가장 높았다(89.22%)는 앵커링 근거로 쓰였다.", "grade": "A", "basis": "최신 실측", "url": "https://arxiv.org/pdf/2607.24601", "detail": false}, {"key": "metr2025", "aliases": ["METR 2025 무작위 대조 실험", "METR 2025 RCT", "METR 2025", "METR"], "title": null, "authors": null, "venue": "METR 블로그 2025-07-10", "summary": "숙련 오픈소스 개발자를 대상으로 한 무작위 대조 실험이다. AI를 쓰면 19% 느려졌는데 본인들은 20% 빨라졌다고 믿었다는 '인식과 실제의 차이' 근거로, 또 벤치마크가 능력을 과대평가할 수 있다는 근거로 쓰였다. METR은 2026년 업데이트 뒤 이 결과를 '역사적' 결과로 본다.", "grade": "B", "basis": "대규모 증거", "url": "https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/", "detail": false}, {"key": "metr2026", "aliases": ["METR 2026-02 업데이트", "METR 2026"], "title": null, "authors": null, "venue": "METR 블로그 2026-02-24", "summary": "2025년 말 재측정에서 복귀 참가자는 18% 빨라졌다는 추정(신뢰구간 −38%~+9%)이 나왔다는 업데이트다. 개발자들이 AI 없이 일하기를 거부해 METR 스스로 '매우 약한 증거'라고 했고, 2025년 결과에 대한 재반론으로 쓰였다.", "grade": "B", "basis": "대규모 증거", "url": "https://metr.org/blog/2026-02-24-uplift-update/", "detail": false}, {"key": "dora2024", "aliases": ["DORA 2024"], "title": null, "authors": null, "venue": "DORA 보고서 2024 (Google)", "summary": "대규모 개발자 설문 보고서다. AI 도입이 25% 늘 때마다 처리량 −1.5%, 안정성 −7.2%, 코드 리뷰 속도 +3.1%와 연관되었다는 상관관계 근거로 쓰였다.", "grade": "B", "basis": "대규모 증거", "url": "https://services.google.com/fh/files/misc/2024_final_dora_report.pdf", "detail": false}, {"key": "dora2025", "aliases": ["DORA 2025"], "title": "State of AI-assisted Software Development (2025)", "authors": null, "venue": "DORA 보고서 2025 (Google)", "summary": "2025년 DORA 보고서다. 처리량은 개선되었지만 AI가 여전히 배포 불안정성을 높이고, 응답자 30%가 AI 코드를 거의 또는 전혀 신뢰하지 않는다는 근거로 쓰였다.", "grade": "B", "basis": "대규모 증거", "url": "https://services.google.com/fh/files/misc/2025_state_of_ai_assisted_software_development.pdf", "detail": false}, {"key": "stackoverflow2025", "aliases": ["Stack Overflow 2025 설문", "Stack Overflow 2025"], "title": "Developers remain willing but reluctant to use AI: The 2025 Developer Survey results are here", "authors": null, "venue": "Stack Overflow 블로그 2025-07-29", "summary": "Stack Overflow의 2025년 개발자 설문 결과다. AI 정확도를 불신 46%, 신뢰 33%라는 수치로 쓰였다.", "grade": "B", "basis": "대규모 증거", "url": "https://stackoverflow.blog/2025/07/29/developers-remain-willing-but-reluctant-to-use-ai-the-2025-developer-survey-results-are-here", "detail": false}, {"key": "laura2025", "aliases": ["LAURA"], "title": null, "authors": null, "venue": "ASE 2025 (arXiv 2512.01356)", "summary": "컨텍스트를 보강해 리뷰 코멘트를 만드는 연구다. 컨텍스트 보강을 빼면 사람 평가 '도움됨'이 20.0%에서 17.7%로 떨어졌다는 근거로 쓰였다.", "grade": "A", "basis": "설계 선택지 효과 측정", "url": "https://arxiv.org/html/2512.01356v2", "detail": false}, {"key": "singleagent2026", "aliases": ["When Single Agent Is Enough", "2611.23283"], "title": "When Single Agent Is Enough", "authors": "Li, Dam, Ahmed", "venue": "arXiv 2611.23283 (프리프린트, 2026)", "summary": "GPT-4o-mini로 Java 328건에서 단일 에이전트와 다중 에이전트(Hydra-Reviewer)를 비교했다. 단일 에이전트가 같거나 나았고 토큰은 1,610 대 47,222로 훨씬 적었다는 근거로 쓰였다. 단 '정확' 비율은 다중 ReAct가 더 높았다.", "grade": "D", "basis": "설계 선택지 효과 측정", "url": "https://export.arxiv.org/pdf/2611.23283", "detail": false}, {"key": "codeagent2024", "aliases": ["CodeAgent"], "title": null, "authors": null, "venue": "EMNLP 2024", "summary": "여러 에이전트가 협업해 코드 리뷰를 하는 시스템이다. 취약점 과제에서 확인 비율 92.96%(GPT-4 51.42%)를 보고했고 QA-Checker로 확인 건수·비율이 함께 올랐지만, 정답을 자기 출력을 검증해 만들어 유리하게 편향되었다는 단서와 함께 쓰였다.", "grade": "A", "basis": "설계 선택지 효과 측정", "url": "https://arxiv.org/html/2402.02172v5", "detail": false}, {"key": "hydrareviewer", "aliases": ["Hydra-Reviewer"], "title": null, "authors": "Ren 외", "venue": "FSE 2026 (journal-first)", "summary": "자동 리뷰 코멘트 생성을 위한 다중 에이전트 시스템이다. 이 스터디에서는 'When Single Agent Is Enough' 연구가 단일 에이전트와 비교한 다중 에이전트 쪽 대상으로 등장한다(초록만 확인).", "grade": "A", "basis": null, "url": "https://conf.researchr.org/details/fse-2026/fse-2026-journal-first/40/Hydra-Reviewer-A-holistic-multi-agent-system-for-automatic-code-review-comment-gener", "detail": false}, {"key": "huang2024", "aliases": ["Huang 외"], "title": null, "authors": "Huang 외", "venue": "ICLR 2024 (arXiv 2310.01798)", "summary": "외부 피드백 없이 LLM이 스스로 답을 고치는 '자기 수정'이 안정적으로 도움이 되지 않는다는 연구다. 리뷰에 특정한 수치는 없지만 생성 뒤 검증 단계의 근거로 쓰였다.", "grade": "A", "basis": "설계 선택지 효과 측정", "url": "https://arxiv.org/abs/2310.01798", "detail": false}, {"key": "reflexion2023", "aliases": ["Reflexion"], "title": null, "authors": null, "venue": "arXiv 2303.11366 (2023)", "summary": "LLM이 결과를 스스로 돌아보며 반복 개선하는 '자기 성찰' 방식이다. CR-Bench에서 이 방식을 리뷰에 쓰자 재현율은 27.01→32.76으로 올랐지만 SNR은 5.11→1.95로 나빠졌다는 맥락에서 등장한다.", "grade": "A", "basis": null, "url": "https://arxiv.org/abs/2303.11366", "detail": false}, {"key": "iris2025", "aliases": ["IRIS"], "title": null, "authors": null, "venue": "ICLR 2025", "summary": "LLM과 정적분석 도구 CodeQL을 결합해 취약점을 찾는 연구다. 120개 중 55개를 찾아 CodeQL 단독(27개)보다 많았지만 거짓 발견율이 84.82%로 여전히 높았다는 근거로 쓰였다(저자는 상한값으로 보며, 50개 수작업 확인 시 약 46%).", "grade": "A", "basis": "설계 선택지 효과 측정", "url": "https://arxiv.org/html/2405.17238v3", "detail": false}, {"key": "jaoua2025", "aliases": ["Jaoua 외", "Jaoua"], "title": null, "authors": "Jaoua 외", "venue": "MSR 2025", "summary": "정적분석기와 LLM 리뷰를 섞는 여러 방식을 비교했다. 정적분석기가 가장 정확했고, 생성 시점에 분석 결과를 넣는 방식만 미세조정 단독보다 분명히 나았다는 근거로 쓰였다(정확한 수치는 그림에만 있음).", "grade": "A", "basis": "설계 선택지 효과 측정", "url": "https://arxiv.org/html/2502.06633", "detail": false}, {"key": "crscorepp", "aliases": ["CRScore++"], "title": null, "authors": null, "venue": "arXiv 2506.00296 (프리프린트, 2025)", "summary": "리뷰 코멘트 생성 모델 학습 연구다. 생성 시 도구 출력 주입이 도메인 밖에서는 돕지 않았고(포괄성 0.43→0.39), 선호 학습(DPO) 단계가 SFT보다 정확도를 올리지 못했다는 근거로 쓰였다.", "grade": "D", "basis": "설계 선택지 효과 측정", "url": "https://arxiv.org/html/2506.00296v1", "detail": false}, {"key": "coral2025", "aliases": ["CoRAL"], "title": null, "authors": null, "venue": "arXiv 2506.04464 (프리프린트, 2025)", "summary": "강화학습으로 리뷰 코멘트 생성을 학습시킨 연구다. BLEU가 7.05에서 8.67로 올랐다는 결과(BLEU만 측정)로 쓰였다.", "grade": "D", "basis": "설계 선택지 효과 측정", "url": "https://arxiv.org/html/2506.04464v1", "detail": false}, {"key": "agentless2025", "aliases": ["Agentless"], "title": null, "authors": null, "venue": "FSE 2025", "summary": "에이전트 없이 고정된 단계로 이슈를 고치는 파이프라인이다. SWE-bench Lite에서 32.00%·$0.70으로 SWE-agent(23.00%·$1.62)보다 낫고 쌌다는 근거로 쓰였다. 리뷰가 아니라 이슈 수정 과제다.", "grade": "A", "basis": "설계 선택지 효과 측정", "url": "https://arxiv.org/html/2407.01489v2", "detail": false}, {"key": "sweagent2024", "aliases": ["SWE-agent"], "title": null, "authors": null, "venue": "NeurIPS 2024", "summary": "LLM 에이전트가 도구 인터페이스로 저장소를 다루며 이슈를 고치게 한 연구다. 편집 명령을 빼면 18.0→10.3으로 떨어지는 등 도구 인터페이스 세부가 성능을 크게 바꾼다는 근거로 쓰였다. 리뷰가 아니라 이슈 수정 과제다.", "grade": "A", "basis": "설계 선택지 효과 측정", "url": "https://arxiv.org/html/2405.15793v3", "detail": false}, {"key": "edmundson2013", "aliases": ["Edmundson 외 2013", "Edmundson 2013"], "title": null, "authors": "Edmundson 외", "venue": "ESSoS 2013", "summary": "개발자 30명이 같은 웹앱의 보안 코드 리뷰를 한 실험이다. 리뷰 효과가 낮고 경험과도 상관이 없었다는, 사람 리뷰도 결함을 놓친다는 근거로 쓰였다(초록·2차 확인).", "grade": "A", "basis": null, "url": "https://people.eecs.berkeley.edu/%7Edaw/papers/coderev-essos13.pdf", "detail": false}, {"key": "boehm2003", "aliases": ["Boehm 2003"], "title": null, "authors": "Boehm", "venue": null, "summary": "리뷰와 페어 프로그래밍을 합치면 결함을 약 60% 더 잡는다는 주장의 출처로, Entropic Thoughts 글이 인용한 것을 2차로 옮겼다.", "grade": null, "basis": null, "url": null, "detail": false}, {"key": "chen2025", "aliases": ["Chen 외 2025", "Chen 2025"], "title": null, "authors": "Chen 외", "venue": "arXiv 2504.03846 (프리프린트, 2025)", "summary": "LLM 판정 모델이 자기의 틀린 답을 선호하고, 강한 모델일수록 더 그렇다는 연구다. 원문은 비어 있어 검색 요약으로만 확인한 2차 근거로 쓰였다.", "grade": "D", "basis": null, "url": "https://arxiv.org/html/2504.03846v3", "detail": false}, {"key": "swebenchillusion", "aliases": ["SWE-bench Illusion"], "title": null, "authors": null, "venue": "arXiv 2506.12286 (2025)", "summary": "모델이 이슈 본문만 보고 버그 파일을 맞히는 비율이 SWE-bench Verified 76%, 다른 저장소 53%라는 연구다. 벤치마크 점수에 기억(오염)이 섞인다는 근거로 쓰였다.", "grade": "D", "basis": null, "url": "https://arxiv.org/abs/2506.12286v4", "detail": false}, {"key": "wangpradelliu2026", "aliases": ["Wang, Pradel, Liu"], "title": null, "authors": "Wang, Pradel, Liu", "venue": "ICSE 2026", "summary": "SWE-bench에서 '해결됨'으로 친 패치를 다시 검증한 연구다. 7.8%가 전체 테스트에서 실패하고 그럴듯한 패치의 29.6%가 참조 수정과 다르게 동작해 해결률이 6.2%p 부풀려졌다는 근거로 쓰였다.", "grade": "A", "basis": null, "url": "https://arxiv.org/abs/2503.15223", "detail": false}, {"key": "zhong2026", "aliases": ["Zhong 외 2026"], "title": null, "authors": "Zhong 외", "venue": "arXiv 2603.15911 (프리프린트, 2026)", "summary": "AI 리뷰 제안과 사람 제안의 채택률을 비교했다. AI 제안 채택률이 유의하게 낮고, 채택된 AI 제안은 코드 복잡도를 더 높였다는 현장 근거로 쓰였다.", "grade": "D", "basis": null, "url": "https://arxiv.org/abs/2603.15911", "detail": false}, {"key": "space2021", "aliases": ["Forsgren 외 2021", "SPACE 프레임워크"], "title": null, "authors": "Forsgren, Storey 외", "venue": "ACM Queue 2021", "summary": "개발자 생산성을 여러 차원으로 보자는 SPACE 프레임워크다. 단일 지표로는 생산성을 잡을 수 없다는 근거로 쓰였다(2차 확인).", "grade": "C", "basis": null, "url": "https://queue.acm.org/detail.cfm?id=3454124", "detail": false}, {"key": "anthropic-cc-review-2026", "aliases": ["Osmani 외 2026"], "title": "How the Claude Code team does code review", "authors": "Addy Osmani, Morgan Westlee Lunt, Qing Wang", "venue": "claude.dev 블로그 2026-10-15", "summary": "Claude Code 팀이 위험 등급 분류기로 LOW 변경은 사람 승인 없이 머지하고, 사고 PR을 정답지로 AI 리뷰어를 매일 채점한 운영기. 머지 2배·revert 40% 감소는 자기 보고, 원 건수 비공개.", "grade": "B", "basis": "1차", "url": "https://claude.dev/blog/solving-code-review-at-anthropic/", "detail": false}, {"key": "rewind2026", "aliases": ["Rewind 2026"], "title": "Review is the bottleneck now: How we let AI approve pull requests (safely)", "authors": null, "venue": "rewind.com 블로그 2026-06-01", "summary": "영역별 AI 리뷰어가 지적만 내고 일반 코드가 승인 여부를 판정. 섀도 1주 사람 일치율 90%로 켰고 약 40% 자동 승인, 사고 0건. 표본이 작아 방향만 보라고 글쓴이가 밝힘.", "grade": "B", "basis": "1차", "url": "https://rewind.com/blog/ai-approve-pull-requests-safely/", "detail": false}, {"key": "agenticrubrics2026", "aliases": ["Raghavendra 외 2026"], "title": "Agentic Rubrics as Contextual Verifiers for SWE Agents", "authors": "Raghavendra, Gunjal, Liu, He (Scale AI)", "venue": "arXiv 2601.04171 (2026, 프리프린트)", "summary": "Claude가 저장소를 보고 과제별 루브릭을 만들고 GPT-5가 패치를 채점해 테스트 없이 후보를 고른다. SWE-bench Verified Best@16에서 +3.5~4.0%p, ROC-AUC 0.886.", "grade": "D", "basis": "최신성", "url": "https://arxiv.org/abs/2601.04171", "detail": false}];
const PAPERS = [{"id": "p-codeguru", "key": "codeguru", "title": "CodeGuru 규칙 채굴 (Effendi 외, ICSE 2023)", "grade": "A", "pdf": "https://cdn.amazon.science/da/f0/050314414785a5662500d0e46723/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes.pdf", "cited": ["06", "11"], "html": "<h1>CodeGuru 규칙 채굴 (Effendi 외, ICSE 2023)<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-26<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-26<\/li>\n<li><strong>원제목<\/strong>: A Language-agnostic Framework for Mining Static Analysis Rules from Code Changes<\/li>\n<li><strong>저자·소속<\/strong>: Sedick David Baker Effendi(스텔렌보스대) · Berk Çirisci(CNRS IRIF) · Rajdeep Mukherjee · Hoan Anh Nguyen · Omer Tripp(Amazon Web Services)<\/li>\n<li><strong>발표처<\/strong>: ICSE 2023 (Amazon Science 게시 정보. PDF 본문에는 학회 표기가 없다)<\/li>\n<li><strong>원문<\/strong>: <a href=\"https://amazon.science/publications/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes\">https://amazon.science/publications/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes<\/a> (소개 페이지)<\/li>\n<li><strong>PDF<\/strong>: <a href=\"https://cdn.amazon.science/da/f0/050314414785a5662500d0e46723/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes.pdf\">https://cdn.amazon.science/da/f0/050314414785a5662500d0e46723/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes.pdf<\/a><\/li>\n<li><strong>등급<\/strong>: A — 빅테크가 실제 리뷰 도구에 넣고 운영 피드백까지 공개한 1차 자료<\/li>\n<\/ul>\n<h2>한눈에 보기<\/h2>\n<ul>\n<li><strong>무엇을 했나<\/strong>: GitHub 오픈소스의 코드 변경 450만 건에서 \"여러 사람이 비슷하게 고친 버그 수정\"을 묶어 내고, 사람이 그 묶음을 보고 <strong>정적 분석 규칙 62개<\/strong>를 만들었다. 규칙은 Amazon CodeGuru Reviewer(AWS의 자동 코드 리뷰 서비스)에 들어가 PR에 코멘트를 달았다.<\/li>\n<li><strong>왜 이 스터디에 있나<\/strong>: 자동 리뷰 코멘트를 <strong>실제 PR에서 개발자가 얼마나 받아들였나<\/strong>(수용률 73%)를 잰 몇 안 되는 빅테크 1차 자료다. 06장 표의 Amazon 칸이 이 논문이다.<\/li>\n<li><strong>지금 읽을 때 주의할 점<\/strong>: 73%는 추천 2만여 건 중 <strong>피드백이 달린 약 2천 건<\/strong>에서 잰 값이다. 그리고 CodeGuru 전체가 아니라 <strong>이 논문의 규칙 62개<\/strong>의 수용률이다.<\/li>\n<\/ul>\n<h2>지금 정독할 가치가 있나<\/h2>\n<p>목적이 \"우리 PR 리뷰 에이전트를 어떻게 채점할까\"라면 <strong>6장(평가)만 읽으면 된다.<\/strong> 앞의 3~5장은 코드 변경을 언어와 상관없이 묶는 기술 이야기다.<\/p>\n<table>\n<thead>\n<tr>\n<th>건너뛰어도 되는 부분<\/th>\n<th>이유<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>4장 변경 추출(함수 짝짓기, 그래프 비교, 타입 추론)<\/td>\n<td>사내 중간 표현(MU 그래프)과 최적화 기법 설명이다. 우리가 직접 구현할 일이 없다<\/td>\n<\/tr>\n<tr>\n<td>5장 군집화 수식<\/td>\n<td>비슷한 변경끼리 묶는 계산 방법이다. 결론만 알면 된다: \"같은 API를 같은 방식으로 고친 변경끼리 묶는다\"<\/td>\n<\/tr>\n<tr>\n<td>6장 B~D절 실행 환경·타입 복구<\/td>\n<td>서버 사양과 처리량 제한, JavaScript 타입을 얼마나 알아냈나(38%)에 관한 내용이다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>볼 만한 부분<\/th>\n<th>이유<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>초록과 1장<\/td>\n<td>\"여러 사람이 반복해서 고친 것 = 가치 있는 규칙\"이라는 출발 가정<\/td>\n<\/tr>\n<tr>\n<td>5장 C절 묶음 선정 기준<\/td>\n<td>어떤 반복 패턴을 규칙 후보로 올렸나(변경 3건 이상, 저장소 2곳 이상)<\/td>\n<\/tr>\n<tr>\n<td>6장 E절 사람 검토와 수율<\/td>\n<td>묶음 10개를 봐야 규칙 1개가 나왔다. 자동화의 실제 비용<\/td>\n<\/tr>\n<tr>\n<td>6장 F절 수용률 계산법<\/td>\n<td>73%를 어떻게 셌나. 이 스터디에서 가장 중요한 부분<\/td>\n<\/tr>\n<tr>\n<td>6장 G·H절 규칙 예시와 쓸모<\/td>\n<td>어떤 지적이 개발자에게 먹혔나<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>이 논문이 한 일 — 쉽게<\/h2>\n<p>출발점은 \"같은 실수는 여러 곳에서 반복되고, 고치는 방법도 비슷하다\"는 관찰이다.<\/p>\n<ol>\n<li><strong>고친 기록을 모은다<\/strong> — GitHub 저장소 6만 곳의 커밋에서 \"고치기 전 코드 / 고친 뒤 코드\" 쌍을 뽑는다.<\/li>\n<li><strong>비슷하게 고친 것끼리 묶는다<\/strong> — 이름이나 문법이 달라도 <strong>의미가 같은 수정<\/strong>이면 같은 묶음이 되게 한다. 예를 들어 \"S3 업로드에 용량 검사를 넣고 넘치면 중단(<code>abort<\/code>)\"한 수정들이 한 묶음이 된다. 묶음은 \"AWS → S3 → abort\"처럼 분야·라이브러리·API 순으로 정리된다.<\/li>\n<li><strong>사람이 묶음을 보고 규칙을 쓴다<\/strong> — 보안·언어 전문가가 위쪽 묶음을 하나씩 열어 보고, 규칙으로 만들 만한지 판단한다.<\/li>\n<li><strong>출시 전에 몰래 돌려 본다<\/strong> — 실제 코드에 조용히 돌려 결과를 사람이 확인하는 \"shadow review(그림자 검토)\"에서 <strong>지적의 70% 이상이 조치할 만해야<\/strong> 출시한다.<\/li>\n<li><strong>출시 후 PR 피드백을 센다<\/strong> — CodeGuru가 PR에 단 코멘트에 개발자가 누른 👍/👎와 남긴 글로 수용률을 잰다.<\/li>\n<\/ol>\n<p>이 흐름은 우리에게 익숙한 질문으로 바꿔 말할 수 있다. \"과거 PR에서 <strong>우리 팀이 반복해서 고친 것<\/strong>을 찾아, 리뷰 에이전트의 점검 항목으로 만들 수 있을까?\"<\/p>\n<h2>주요 내용 발췌와 해설<\/h2>\n<h3>① 출발 가정 — 반복된 수정이 가치 있는 규칙이다 (초록·1장)<\/h3>\n<blockquote>\n<p>\"The intuition is that code changes following a common pattern correspond to recurring mistakes, from which deriving best practices could likely be of high value and accepted by the community.\" (초록)<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 여러 사람이 같은 모양으로 고친 코드는 <strong>흔히 반복되는 실수<\/strong>이고, 거기서 뽑은 규칙은 쓸모 있고 받아들여지기 쉬울 것이라는 직관이다.<\/p>\n<blockquote>\n<p>\"Changes committed by multiple developers across different software repositories are more likely to lead to best-practice rules that have high value and high action rate.\" (1장)<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 한 사람의 취향이 아니라 <strong>여러 개발자·여러 저장소<\/strong>에서 나온 수정이어야 한다는 점을 강조한다. 이 가정은 5장 C절의 선정 기준으로 이어진다(②).<\/p>\n<p>이 생각은 PR 리뷰 에이전트에도 그대로 적용된다. 리뷰어 한 명이 한 번 지적한 것보다, <strong>여러 PR에서 반복해 지적되고 실제로 고쳐진 것<\/strong>이 에이전트가 짚었을 때 받아들여질 가능성이 높다.<\/p>\n<h3>② 어떤 묶음을 규칙 후보로 올렸나 (5장 C절)<\/h3>\n<blockquote>\n<p>\"These clusters are then ranked based on few criterions – (a) number of code changes (3 or more), (b) Jaccard distance metric, (c) code changes from 2 or more repositories or 2 or more commit IDs to ensure that only clusters formed from a diverse set of repositories or commits are considered.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 묶음은 세 기준으로 순위를 매겼다.<\/p>\n<ul>\n<li>같은 수정이 <strong>3건 이상<\/strong> 있어야 한다<\/li>\n<li>묶음 안 수정들이 서로 얼마나 비슷한가(Jaccard 거리: 두 집합이 얼마나 겹치는지를 0~1로 잰 값)<\/li>\n<li><strong>저장소 2곳 이상<\/strong>, 또는 <strong>커밋 2개 이상<\/strong>에서 나와야 한다<\/li>\n<\/ul>\n<p>\"한 번 일어난 수정\"은 규칙이 되지 않게 걸러 내는 장치다. 우리가 과거 PR 코멘트로 점검 항목을 뽑을 때도 \"최소 몇 번 반복되어야 항목으로 올릴지\"를 정해야 한다.<\/p>\n<p>예로 든 수정(목록 1)은 이렇다. S3 업로드 진행 이벤트에 용량 검사를 넣어, 정해진 크기를 넘으면 업로드를 중단한다.<\/p>\n<pre><code class=\"language-diff\">+ var maxBytes = 20000000;\n  var s3ManagedUpload = s3.upload(...)\n  s3ManagedUpload.on('httpUploadProgress',\n-   function (event)
