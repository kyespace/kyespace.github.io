 {\n+   (event) =&gt; {\n+     if (event.loaded &gt; maxBytes) {\n+       s3ManagedUpload.abort();\n+     } else {\n        console.log(...);\n+     }\n  });\n<\/code><\/pre>\n<p>여기서 <code>function<\/code>을 화살표 함수(<code>=&gt;<\/code>)로 바꾼 것은 <strong>문법만 바뀐 것<\/strong>이다. 이 논문의 기법은 이런 차이를 무시하고 \"조건문 안에서 S3의 <code>abort<\/code>를 새로 호출했다\"는 의미만 남겨 묶는다.<\/p>\n<h3>③ 자동으로 묶어도 결국 사람이 본다 — 수율 10% (6장 E절)<\/h3>\n<blockquote>\n<p>\"One way to measure the accuracy of the presented approach is by measuring the yield, which is the ratio of the number of mined rules over the number of clusters. The yield varies between 8 - 11%.\"<\/p>\n<p>\"On average, each reviewer spends 5 minutes to review a cluster. This process resulted in 42 static analysis rules from 418 clusters for Java, with the yield of 10%.\"<\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>언어<\/th>\n<th>사람이 본 묶음<\/th>\n<th>나온 규칙<\/th>\n<th>수율<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Java<\/td>\n<td>418<\/td>\n<td>42<\/td>\n<td>10%<\/td>\n<\/tr>\n<tr>\n<td>JavaScript<\/td>\n<td>70<\/td>\n<td>8<\/td>\n<td>11%<\/td>\n<\/tr>\n<tr>\n<td>Python<\/td>\n<td>147<\/td>\n<td>12<\/td>\n<td>8%<\/td>\n<\/tr>\n<tr>\n<td>합계<\/td>\n<td>635<\/td>\n<td>62<\/td>\n<td>약 10%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>풀이<\/strong>: 순위가 높은 묶음을 전문가가 열어 봤는데, <strong>10개 중 1개꼴<\/strong>로만 규칙이 됐다. 묶음 하나에 평균 5분이 들었으니 Java만 해도 약 35시간을 들여 규칙 42개를 얻은 셈이다.<\/p>\n<ul>\n<li>자동 채굴은 <strong>후보를 좁혀 주는 도구<\/strong>였지, 규칙을 바로 만들어 내지는 못했다. 사람 검토가 \"출시 관문(gating requirement)\"이라고 본문에 적혀 있다.<\/li>\n<li>초록은 \"600개 미만의 묶음에서 62개\"라고 했지만, 6장 E절 숫자를 더하면 635개다. 논문 안에서 숫자가 맞지 않는다.<\/li>\n<\/ul>\n<p>우리 팀에 옮기면: 과거 PR 코멘트를 LLM으로 묶어 점검 항목 후보를 뽑더라도, <strong>사람이 후보를 걸러 내는 시간<\/strong>을 계획에 넣어야 한다.<\/p>\n<h3>④ 출시 전 관문 — 조치할 만한 지적 70% (6장 G절)<\/h3>\n<blockquote>\n<p>\"All these rules have met our accuracy bar of 70% actionable findings, which is measured offline — through \"shadow review\" — ahead of rule deployment, then monitored and validated in production through developer feedback on the comments CodeGuru leaves on pull requests.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 규칙은 출시 전에 <strong>\"지적의 70% 이상이 조치할 만하다\"<\/strong> 는 기준을 넘어야 했다. 이 비율은 shadow review, 즉 실제 코드에 조용히 돌린 결과를 사람이 보고 판정해서 쟀다. 출시 뒤에는 PR 피드백으로 계속 확인했다.<\/p>\n<p>이것은 02장의 정밀도(낸 지적 중 맞은 비율)를 <strong>출시 관문으로 쓴 사례<\/strong>다. 두 단계로 나뉜다는 점이 중요하다.<\/p>\n<table>\n<thead>\n<tr>\n<th>단계<\/th>\n<th>누가 판정<\/th>\n<th>무엇을 보나<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>출시 전 (오프라인)<\/td>\n<td>내부 검토자<\/td>\n<td>지적의 70% 이상이 조치할 만한가<\/td>\n<\/tr>\n<tr>\n<td>출시 후 (온라인)<\/td>\n<td>PR을 받은 개발자<\/td>\n<td>👍/👎·글 피드백으로 잰 수용률<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>05장의 오프라인 벤치마크와 06장의 온라인 지표를 <strong>둘 다<\/strong> 쓴 구조다. 다만 \"조치할 만하다(actionable)\"를 어떻게 판정했는지, 검토자 몇 명이 몇 건을 봤는지는 나와 있지 않다.<\/p>\n<h3>⑤ 수용률 73%를 어떻게 셌나 (6장 F절) — 가장 중요한 부분<\/h3>\n<blockquote>\n<p>\"We treat \"thumbs-up\" and \"useful\" ratings as positive, and the rest as negative. We map textual feedback sans rating to positive/negative using a sentiment analysis model. Furthermore, we compute acceptance as the proportion of positive feedback points out of all feedback points.\"<\/p>\n<p>\"During this time period, CodeGuru analyzed 80K+ PRs, and published 20K+ recommendations, and approximately 2K feedback points.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 계산식은 이렇다.<\/p>\n<ul>\n<li><strong>수용률 = 긍정 피드백 수 / 전체 피드백 수<\/strong><\/li>\n<li>긍정: 👍 또는 \"useful\"<\/li>\n<li>부정: 그 밖의 모든 평가(👎, \"not useful\", <strong>\"not sure\"도 부정<\/strong>)<\/li>\n<li>평가 없이 글만 남긴 경우: <strong>감정 분석 모델<\/strong>이 긍정/부정을 판정<\/li>\n<\/ul>\n<p>8주 동안 PR 8만여 개를 분석해 추천 2만여 건을 냈고, 피드백은 약 2천 건이었다.<\/p>\n<table>\n<thead>\n<tr>\n<th>언어<\/th>\n<th>규칙 수<\/th>\n<th>수용률<\/th>\n<th>빈도<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Java<\/td>\n<td>42<\/td>\n<td>73.8%<\/td>\n<td>0.75%<\/td>\n<\/tr>\n<tr>\n<td>Python<\/td>\n<td>12<\/td>\n<td>76.4%<\/td>\n<td>0.62%<\/td>\n<\/tr>\n<tr>\n<td>JavaScript<\/td>\n<td>8<\/td>\n<td>72.8%<\/td>\n<td>0.83%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>이 숫자를 읽을 때 따져 볼 점이 넷 있다.<\/p>\n<ol>\n<li><strong>피드백을 남긴 사람만 셌다.<\/strong> 추천 2만여 건 중 피드백은 약 2천 건, 대략 10%다. 나머지 90%는 아무 반응이 없었고 계산에서 빠졌다. Google AutoCommenter도 피드백 비율이 약 10%였고, 피드백 기준 유용 비율(80%)과 코드 변경 기준 추정(약 40%)이 크게 달랐다(<a href=\"#08\">08장<\/a>). 피드백을 남기는 사람은 특히 좋았거나 특히 싫었던 사람일 수 있다.<\/li>\n<li><strong>\"수용\"은 코드를 고쳤다는 뜻이 아니다.<\/strong> 👍를 눌렀다는 뜻이다. GitHub의 addressed rate(지적 뒤 실제로 코드가 바뀐 비율)와는 다른 지표다(<a href=\"#06\">06장<\/a>).<\/li>\n<li><strong>채점관이 하나 숨어 있다.<\/strong> 글만 남긴 피드백은 감정 분석 모델이 판정했는데, 그 모델의 정확도는 나와 있지 않다. 03장에서 다룬 \"채점관을 사람 라벨로 보정해야 한다\"는 문제가 여기에도 있다.<\/li>\n<li><strong>62개 규칙만의 숫자다.<\/strong> 이 73%를 \"CodeGuru Reviewer의 수용률\"로 옮기면 안 된다. 표의 빈도는 \"한 규칙이 낸 추천이 전체 추천에서 차지하는 비율\"로 정의돼 있는데, 언어별 값이 규칙 평균인지 합계인지, 또 위의 추천 2만여 건·피드백 2천 건이 이 규칙들만의 숫자인지 CodeGuru 전체의 숫자인지 본문만으로는 분명하지 않다.<\/li>\n<\/ol>\n<h3>⑥ 부정 피드백 27%의 속사정 (6장 F절)<\/h3>\n<blockquote>\n<p>\"We have analyzed the negative feedback points (roughly 27%, or 540 responses, out of the overall feedback). These break into several modes: (1) addressing the CodeGuru Reviewer recommendation would de-focus the PR; (2) the recommendation is applicable, but can only be addressed by upgrading to the latest AWS Python SDK; (3) code quality is not a concern, since the codebase is experimental or the code in question is for testing; or (4) the detection is incorrect (false positive), which accounts for less than 3% of the cases.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 부정 피드백 540건을 뜯어 보니 이유는 네 가지였다.<\/p>\n<table>\n<thead>\n<tr>\n<th>이유<\/th>\n<th>지적이 틀렸나?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 맞는 말이지만 고치면 이 PR의 초점이 흐려진다<\/td>\n<td>아니다<\/td>\n<\/tr>\n<tr>\n<td>② 맞는 말이지만 SDK를 올려야만 고칠 수 있다<\/td>\n<td>아니다<\/td>\n<\/tr>\n<tr>\n<td>③ 실험용·테스트 코드라 품질을 신경 쓰지 않는다<\/td>\n<td>아니다<\/td>\n<\/tr>\n<tr>\n<td>④ 지적 자체가 틀렸다(오탐)<\/td>\n<td>맞다 — 3% 미만<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>\"싫다\"와 \"틀렸다\"는 다르다.<\/strong> 부정 피드백 대부분은 지적이 틀려서가 아니라 <strong>지금 이 PR에서 고칠 일이 아니라서<\/strong>였다. 08장의 Tricorder \"유효 오탐\"(기술적으로 맞아도 개발자가 조치하지 않으면 오탐으로 본다)과 같은 이야기다.<\/p>\n<p>다만 \"3% 미만\"이 <strong>부정 피드백 540건 중<\/strong>인지 <strong>전체 피드백 중<\/strong>인지 문장만으로는 분명하지 않다. 어느 쪽이든 정답지(사람이 미리 정한 맞는 답)로 잰 정밀도가 아니라 <strong>개발자가 스스로 밝힌 이유<\/strong>를 분류한 값이다.<\/p>\n<p>우리 에이전트에 옮기면: 👎를 받았을 때 \"틀렸다\", \"맞지만 지금은 아니다\", \"이 코드엔 해당 없다\"를 <strong>구분해서 받을 수 있게<\/strong> 해 두면, 고칠 것이 에이전트인지 적용 범위인지 가를 수 있다.<\/p>\n<h3>⑦ 어떤 지적이 먹혔나 (6장 G·H절, 표 II)<\/h3>\n<p>표 II에 대표 규칙 21개가 있다. 몇 개만 옮긴다.<\/p>\n<table>\n<thead>\n<tr>\n<th>언어<\/th>\n<th>규칙 요지<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Java<\/td>\n<td>DynamoDB <code>getItem<\/code> 결과는 항목이 없으면 null이다. 예외가 나지 않으니 쓰기 전에 null 검사를 하라<\/td>\n<\/tr>\n<tr>\n<td>Java<\/td>\n<td>맵을 키로 돌면서 값을 다시 조회하지 말고 <code>entrySet<\/code>으로 돌아라(성능)<\/td>\n<\/tr>\n<tr>\n<td>Python<\/td>\n<td>Lambda 함수가 호출될 때마다 AWS 클라이언트를 새로 만들지 말고 재사용하라<\/td>\n<\/tr>\n<tr>\n<td>Python<\/td>\n<td>소켓 연결에 타임아웃을 지정하라. 안 하면 무한히 기다릴 수 있다<\/td>\n<\/tr>\n<tr>\n<td>JavaScript<\/td>\n<td>평문으로 보내는 <code>http.Agent()<\/code> 대신 <code>https.Agent()<\/code>를 써라<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>저자들은 규칙이 쓸모 있었던 이유를 둘로 정리했다(6장 H절).<\/p>\n<blockquote>\n<p>\"SDK (new) features are sometimes missed by developers. Pagination, retry and error handling are examples of such features, where developers not familiar with these built-in capabilities sometimes implement \"manual\" mechanisms instead.\"<\/p>\n<p>\"Developers sometimes assume, rather than verify, the functionality of a given API or the role of a given parameter.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>:<\/p>\n<ul>\n<li><strong>놓친 기능<\/strong>: SDK에 이미 있는 페이지 처리·재시도·오류 처리를 모르고 직접 구현한다.<\/li>\n<li><strong>잘못 믿은 동작<\/strong>: API가 이렇게 동작하리라 <strong>확인하지 않고 가정<\/strong>한다. 예로 <code>QueryResponse::hasItems<\/code>는 \"항목이 있다\"가 아니라 \"Items 속성이 정의돼 있다\"는 뜻인데, 비어 있지 않다고 오해하기 쉽다.<\/li>\n<\/ul>\n<p>둘 다 <strong>특정 라이브러리를 아는 사람만 짚을 수 있는 지적<\/strong>이다. 범용 LLM 리뷰어가 자주 놓치거나, 반대로 그럴듯하게 틀리기 쉬운 영역이기도 하다. 우리 팀이라면 사내 공통 모듈이나 자주 쓰는 라이브러리의 \"잘못 믿기 쉬운 동작\"을 모아 두는 것이 같은 효과를 낼 수 있다.<\/p>\n<h3>⑧ 데이터 규모 (6장 A절)<\/h3>\n<table>\n<thead>\n<tr>\n<th>언어<\/th>\n<th>저장소<\/th>\n<th>코드 변경<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Java<\/td>\n<td>약 2만 7천<\/td>\n<td>약 180만<\/td>\n<\/tr>\n<tr>\n<td>JavaScript<\/td>\n<td>약 8천<\/td>\n<td>약 110만<\/td>\n<\/tr>\n<tr>\n<td>Python<\/td>\n<td>약 2만 5천<\/td>\n<td>약 160만<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>풀이<\/strong>: Apache·MIT 라이선스에 GitHub 별 4개 이상인 저장소를 모았다. CodeReviewer(별이 많고 PR 1,500개 이상)보다 <strong>문턱이 훨씬 낮다.<\/strong> 넓게 모은 뒤 ②의 \"여러 저장소에서 반복\" 기준으로 거르는 방식이다.<\/p>\n<h2>이 논문을 읽을 때 따져 볼 점<\/h2>\n<p>후속 연구가 이 논문을 직접 검증한 자료는 이 스터디 조사에서 확인하지 못했다. 아래는 원문만 보고 짚을 수 있는 점이다.<\/p>\n<table>\n<thead>\n<tr>\n<th>따져 볼 점<\/th>\n<th>근거<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>비교 대상이 없다<\/strong><\/td>\n<td>사람이 직접 쓴 CodeGuru 규칙의 수용률과 비교하지 않았다. 73%가 높은지 낮은지 판단할 기준이 논문 안에 없다<\/td>\n<\/tr>\n<tr>\n<td><strong>피드백 표본이 작고 치우칠 수 있다<\/strong><\/td>\n<td>추천 2만여 건 중 피드백 약 2천 건(약 10%). 이 2천 건이 모두 62개 규칙의 것이라 해도 규칙 하나당 평균 30여 건이다<\/td>\n<\/tr>\n<tr>\n<td><strong>감정 분석 판정의 정확도가 없다<\/strong><\/td>\n<td>글만 남긴 피드백을 모델이 긍정/부정으로 갈랐지만 검증 수치가 없다<\/td>\n<\/tr>\n<tr>\n<td><strong>군집 품질 수치가 없다<\/strong><\/td>\n<td>5장 B절에서 균질성·완전성(묶음이 얼마나 깔끔한가)을 쟀다고 했지만 값은 싣지 않았다<\/td>\n<\/tr>\n<tr>\n<td><strong>숫자가 맞지 않는 곳이 있다<\/strong><\/td>\n<td>초록 \"600개 미만 묶음\" vs 6장 합계 635개<\/td>\n<\/tr>\n<tr>\n<td><strong>제품을 만든 회사의 자기 보고다<\/strong><\/td>\n<td>저자 대부분이 AWS 소속이고, 측정도 자사 서비스 안에서 했다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>비교해 볼 만한 다른 수용률:<\/p>\n<table>\n<thead>\n<tr>\n<th>사례<\/th>\n<th>수용률<\/th>\n<th>측정 방식<\/th>\n<th>실린 곳<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CodeGuru 채굴 규칙 (이 논문)<\/td>\n<td>73%<\/td>\n<td>피드백 단 건 중 👍·useful 비율<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Google AutoCommenter<\/td>\n<td>피드백 기준 80% / 코드 변경 기준 약 40%<\/td>\n<td>같은 시스템, 두 방식<\/td>\n<td><a href=\"#08\">08장<\/a><\/td>\n<\/tr>\n<tr>\n<td>Mozilla·Ubisoft RevMate<\/td>\n<td>8.1% / 7.2%<\/td>\n<td>리뷰어가 LLM 제안을 골라 게시한 비율<\/td>\n<td><a href=\"#06\">06장<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>같은 \"수용률\"이라는 이름이라도 <strong>분모가 무엇이냐<\/strong>에 따라 10배씩 차이 난다. 숫자를 비교하기 전에 계산식부터 맞춰 봐야 한다.<\/p>\n<h2>읽고 나서 생각해 볼 질문<\/h2>\n<ol>\n<li>우리 과거 PR에서 \"반복해서 지적되고 실제로 고쳐진 것\"을 뽑는다면, 몇 번 이상 반복돼야 에이전트 점검 항목으로 올릴 것인가? 한 사람의 지적만 반복된 경우는 어떻게 볼 것인가?<\/li>\n<li>에이전트를 팀에 내놓기 전에 CodeGuru의 \"조치할 만한 지적 70%\" 같은 관문을 둘 것인가? 둔다면 누가 몇 건을 보고 판정할 것인가?<\/li>\n<li>👍/👎 피드백을 받는다면, 피드백이 없는 코멘트는 어떻게 셀 것인가? 피드백 기준 수용률과 \"실제로 코드가 바뀐 비율\"을 둘 다 볼 것인가?<\/li>\n<li>👎의 이유를 \"틀렸다 / 맞지만 지금은 아니다 / 이 코드엔 해당 없다\"로 나눠 받을 것인가?<\/li>\n<li>사내 공통 모듈이나 자주 쓰는 라이브러리의 \"잘못 믿기 쉬운 동작\"을 에이전트에게 따로 알려 줄 것인가?<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<ul>\n<li>원문 — <a href=\"https://amazon.science/publications/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes\">https://amazon.science/publications/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes<\/a> (소개 페이지)<\/li>\n<li>PDF — <a href=\"https://cdn.amazon.science/da/f0/050314414785a5662500d0e46723/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes.pdf\">https://cdn.amazon.science/da/f0/050314414785a5662500d0e46723/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes.pdf<\/a> . 발췌는 모두 이 PDF(13쪽)에서 옮겼다<\/li>\n<li>CodeGuru 규칙 목록 — <a href=\"https://docs.aws.amazon.com/codeguru/detector-library/\">https://docs.aws.amazon.com/codeguru/detector-library/<\/a> (논문 참고문헌 [72])<\/li>\n<li>CodeGuru Reviewer 신규 저장소 연결 중단(2025-11-07)과 06장 요약은 근거 원장 <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A6b-industry-github-atlassian-uber.md\">wave-1 A6b<\/a>를 따른다<\/li>\n<li>비교 수치(AutoCommenter, RevMate)는 <a href=\"#06\">06장<\/a>·<a href=\"#08\">08장<\/a>을 따른다<\/li>\n<\/ul>", "text": " CodeGuru 규칙 채굴 (Effendi 외, ICSE 2023) 생성일 : 2026-11-26 최종 수정일 : 2026-11-26 원제목 : A Language-agnostic Framework for Mining Static Analysis Rules from Code Changes 저자·소속 : Sedick David Baker Effendi(스텔렌보스대) · Berk Çirisci(CNRS IRIF) · Rajdeep Mukherjee · Hoan Anh Nguyen · Omer Tripp(Amazon Web Services) 발표처 : ICSE 2023 (Amazon Science 게시 정보. PDF 본문에는 학회 표기가 없다) 원문 : https://amazon.science/publications/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes (소개 페이지) PDF : https://cdn.amazon.science/da/f0/050314414785a5662500d0e46723/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes.pdf 등급 : A — 빅테크가 실제 리뷰 도구에 넣고 운영 피드백까지 공개한 1차 자료 한눈에 보기 무엇을 했나 : GitHub 오픈소스의 코드 변경 450만 건에서 \"여러 사람이 비슷하게 고친 버그 수정\"을 묶어 내고, 사람이 그 묶음을 보고 정적 분석 규칙 62개 를 만들었다. 규칙은 Amazon CodeGuru Reviewer(AWS의 자동 코드 리뷰 서비스)에 들어가 PR에 코멘트를 달았다. 왜 이 스터디에 있나 : 자동 리뷰 코멘트를 실제 PR에서 개발자가 얼마나 받아들였나 (수용률 73%)를 잰 몇 안 되는 빅테크 1차 자료다. 06장 표의 Amazon 칸이 이 논문이다. 지금 읽을 때 주의할 점 : 73%는 추천 2만여 건 중 피드백이 달린 약 2천 건 에서 잰 값이다. 그리고 CodeGuru 전체가 아니라 이 논문의 규칙 62개 의 수용률이다. 지금 정독할 가치가 있나 목적이 \"우리 PR 리뷰 에이전트를 어떻게 채점할까\"라면 6장(평가)만 읽으면 된다. 앞의 3~5장은 코드 변경을 언어와 상관없이 묶는 기술 이야기다. 건너뛰어도 되는 부분 이유 4장 변경 추출(함수 짝짓기, 그래프 비교, 타입 추론) 사내 중간 표현(MU 그래프)과 최적화 기법 설명이다. 우리가 직접 구현할 일이 없다 5장 군집화 수식 비슷한 변경끼리 묶는 계산 방법이다. 결론만 알면 된다: \"같은 API를 같은 방식으로 고친 변경끼리 묶는다\" 6장 B~D절 실행 환경·타입 복구 서버 사양과 처리량 제한, JavaScript 타입을 얼마나 알아냈나(38%)에 관한 내용이다 볼 만한 부분 이유 초록과 1장 \"여러 사람이 반복해서 고친 것 = 가치 있는 규칙\"이라는 출발 가정 5장 C절 묶음 선정 기준 어떤 반복 패턴을 규칙 후보로 올렸나(변경 3건 이상, 저장소 2곳 이상) 6장 E절 사람 검토와 수율 묶음 10개를 봐야 규칙 1개가 나왔다. 자동화의 실제 비용 6장 F절 수용률 계산법 73%를 어떻게 셌나. 이 스터디에서 가장 중요한 부분 6장 G·H절 규칙 예시와 쓸모 어떤 지적이 개발자에게 먹혔나 이 논문이 한 일 — 쉽게 출발점은 \"같은 실수는 여러 곳에서 반복되고, 고치는 방법도 비슷하다\"는 관찰이다. 고친 기록을 모은다 — GitHub 저장소 6만 곳의 커밋에서 \"고치기 전 코드 / 고친 뒤 코드\" 쌍을 뽑는다. 비슷하게 고친 것끼리 묶는다 — 이름이나 문법이 달라도 의미가 같은 수정 이면 같은 묶음이 되게 한다. 예를 들어 \"S3 업로드에 용량 검사를 넣고 넘치면 중단( abort )\"한 수정들이 한 묶음이 된다. 묶음은 \"AWS → S3 → abort\"처럼 분야·라이브러리·API 순으로 정리된다. 사람이 묶음을 보고 규칙을 쓴다 — 보안·언어 전문가가 위쪽 묶음을 하나씩 열어 보고, 규칙으로 만들 만한지 판단한다. 출시 전에 몰래 돌려 본다 — 실제 코드에 조용히 돌려 결과를 사람이 확인하는 \"shadow review(그림자 검토)\"에서 지적의 70% 이상이 조치할 만해야 출시한다. 출시 후 PR 피드백을 센다 — CodeGuru가 PR에 단 코멘트에 개발자가 누른 👍/👎와 남긴 글로 수용률을 잰다. 이 흐름은 우리에게 익숙한 질문으로 바꿔 말할 수 있다. \"과거 PR에서 우리 팀이 반복해서 고친 것 을 찾아, 리뷰 에이전트의 점검 항목으로 만들 수 있을까?\" 주요 내용 발췌와 해설 ① 출발 가정 — 반복된 수정이 가치 있는 규칙이다 (초록·1장) \"The intuition is that code changes following a common pattern correspond to recurring mistakes, from which deriving best practices could likely be of high value and accepted by the community.\" (초록) 풀이 : 여러 사람이 같은 모양으로 고친 코드는 흔히 반복되는 실수 이고, 거기서 뽑은 규칙은 쓸모 있고 받아들여지기 쉬울 것이라는 직관이다. \"Changes committed by multiple developers across different software repositories are more likely to lead to best-practice rules that have high value and high action rate.\" (1장) 풀이 : 한 사람의 취향이 아니라 여러 개발자·여러 저장소 에서 나온 수정이어야 한다는 점을 강조한다. 이 가정은 5장 C절의 선정 기준으로 이어진다(②). 이 생각은 PR 리뷰 에이전트에도 그대로 적용된다. 리뷰어 한 명이 한 번 지적한 것보다, 여러 PR에서 반복해 지적되고 실제로 고쳐진 것 이 에이전트가 짚었을 때 받아들여질 가능성이 높다. ② 어떤 묶음을 규칙 후보로 올렸나 (5장 C절) \"These clusters are then ranked based on few criterions – (a) number of code changes (3 or more), (b) Jaccard distance metric, (c) code changes from 2 or more repositories or 2 or more commit IDs to ensure that only clusters formed from a diverse set of repositories or commits are considered.\" 풀이 : 묶음은 세 기준으로 순위를 매겼다. 같은 수정이 3건 이상 있어야 한다 묶음 안 수정들이 서로 얼마나 비슷한가(Jaccard 거리: 두 집합이 얼마나 겹치는지를 0~1로 잰 값) 저장소 2곳 이상 , 또는 커밋 2개 이상 에서 나와야 한다 \"한 번 일어난 수정\"은 규칙이 되지 않게 걸러 내는 장치다. 우리가 과거 PR 코멘트로 점검 항목을 뽑을 때도 \"최소 몇 번 반복되어야 항목으로 올릴지\"를 정해야 한다. 예로 든 수정(목록 1)은 이렇다. S3 업로드 진행 이벤트에 용량 검사를 넣어, 정해진 크기를 넘으면 업로드를 중단한다. + var maxBytes = 20000000; var s3ManagedUpload = s3.upload(...) s3ManagedUpload.on('httpUploadProgress', - function (event) { + (event) => { + if (event.loaded > maxBytes) { + s3ManagedUpload.abort(); + } else { console.log(...); + } }); 여기서 function 을 화살표 함수( => )로 바꾼 것은 문법만 바뀐 것 이다. 이 논문의 기법은 이런 차이를 무시하고 \"조건문 안에서 S3의 abort 를 새로 호출했다\"는 의미만 남겨 묶는다. ③ 자동으로 묶어도 결국 사람이 본다 — 수율 10% (6장 E절) \"One way to measure the accuracy of the presented approach is by measuring the yield, which is the ratio of the number of mined rules over the number of clusters. The yield varies between 8 - 11%.\" \"On average, each reviewer spends 5 minutes to review a cluster. This process resulted in 42 static analysis rules from 418 clusters for Java, with the yield of 10%.\" 언어 사람이 본 묶음 나온 규칙 수율 Java 418 42 10% JavaScript 70 8 11% Python 147 12 8% 합계 635 62 약 10% 풀이 : 순위가 높은 묶음을 전문가가 열어 봤는데, 10개 중 1개꼴 로만 규칙이 됐다. 묶음 하나에 평균 5분이 들었으니 Java만 해도 약 35시간을 들여 규칙 42개를 얻은 셈이다. 자동 채굴은 후보를 좁혀 주는 도구 였지, 규칙을 바로 만들어 내지는 못했다. 사람 검토가 \"출시 관문(gating requirement)\"이라고 본문에 적혀 있다. 초록은 \"600개 미만의 묶음에서 62개\"라고 했지만, 6장 E절 숫자를 더하면 635개다. 논문 안에서 숫자가 맞지 않는다. 우리 팀에 옮기면: 과거 PR 코멘트를 LLM으로 묶어 점검 항목 후보를 뽑더라도, 사람이 후보를 걸러 내는 시간 을 계획에 넣어야 한다. ④ 출시 전 관문 — 조치할 만한 지적 70% (6장 G절) \"All these rules have met our accuracy bar of 70% actionable findings, which is measured offline — through \"shadow review\" — ahead of rule deployment, then monitored and validated in production through developer feedback on the comments CodeGuru leaves on pull requests.\" 풀이 : 규칙은 출시 전에 \"지적의 70% 이상이 조치할 만하다\" 는 기준을 넘어야 했다. 이 비율은 shadow review, 즉 실제 코드에 조용히 돌린 결과를 사람이 보고 판정해서 쟀다. 출시 뒤에는 PR 피드백으로 계속 확인했다. 이것은 02장의 정밀도(낸 지적 중 맞은 비율)를 출시 관문으로 쓴 사례 다. 두 단계로 나뉜다는 점이 중요하다. 단계 누가 판정 무엇을 보나 출시 전 (오프라인) 내부 검토자 지적의 70% 이상이 조치할 만한가 출시 후 (온라인) PR을 받은 개발자 👍/👎·글 피드백으로 잰 수용률 05장의 오프라인 벤치마크와 06장의 온라인 지표를 둘 다 쓴 구조다. 다만 \"조치할 만하다(actionable)\"를 어떻게 판정했는지, 검토자 몇 명이 몇 건을 봤는지는 나와 있지 않다. ⑤ 수용률 73%를 어떻게 셌나 (6장 F절) — 가장 중요한 부분 \"We treat \"thumbs-up\" and \"useful\" ratings as positive, and the rest as negative. We map textual feedback sans rating to positive/negative using a sentiment analysis model. Furthermore, we compute acceptance as the proportion of positive feedback points out of all feedback points.\" \"During this time period, CodeGuru analyzed 80K+ PRs, and published 20K+ recommendations, and approximately 2K feedback points.\" 풀이 : 계산식은 이렇다. 수용률 = 긍정 피드백 수 / 전체 피드백 수 긍정: 👍 또는 \"useful\" 부정: 그 밖의 모든 평가(👎, \"not useful\", \"not sure\"도 부정 ) 평가 없이 글만 남긴 경우: 감정 분석 모델 이 긍정/부정을 판정 8주 동안 PR 8만여 개를 분석해 추천 2만여 건을 냈고, 피드백은 약 2천 건이었다. 언어 규칙 수 수용률 빈도 Java 42 73.8% 0.75% Python 12 76.4% 0.62% JavaScript 8 72.8% 0.83% 이 숫자를 읽을 때 따져 볼 점이 넷 있다. 피드백을 남긴 사람만 셌다. 추천 2만여 건 중 피드백은 약 2천 건, 대략 10%다. 나머지 90%는 아무 반응이 없었고 계산에서 빠졌다. Google AutoCommenter도 피드백 비율이 약 10%였고, 피드백 기준 유용 비율(80%)과 코드 변경 기준 추정(약 40%)이 크게 달랐다( 08장 ). 피드백을 남기는 사람은 특히 좋았거나 특히 싫었던 사람일 수 있다. \"수용\"은 코드를 고쳤다는 뜻이 아니다. 👍를 눌렀다는 뜻이다. GitHub의 addressed rate(지적 뒤 실제로 코드가 바뀐 비율)와는 다른 지표다( 06장 ). 채점관이 하나 숨어 있다. 글만 남긴 피드백은 감정 분석 모델이 판정했는데, 그 모델의 정확도는 나와 있지 않다. 03장에서 다룬 \"채점관을 사람 라벨로 보정해야 한다\"는 문제가 여기에도 있다. 62개 규칙만의 숫자다. 이 73%를 \"CodeGuru Reviewer의 수용률\"로 옮기면 안 된다. 표의 빈도는 \"한 규칙이 낸 추천이 전체 추천에서 차지하는 비율\"로 정의돼 있는데, 언어별 값이 규칙 평균인지 합계인지, 또 위의 추천 2만여 건·피드백 2천 건이 이 규칙들만의 숫자인지 CodeGuru 전체의 숫자인지 본문만으로는 분명하지 않다. ⑥ 부정 피드백 27%의 속사정 (6장 F절) \"We have analyzed the negative feedback points (roughly 27%, or 540 responses, out of the overall feedback). These break into several modes: (1) addressing the CodeGuru Reviewer recommendation would de-focus the PR; (2) the recommendation is applicable, but can only be addressed by upgrading to the latest AWS Python SDK; (3) code quality is not a concern, since the codebase is experimental or the code in question is for testing; or (4) the detection is incorrect (false positive), which accounts for less than 3% of the cases.\" 풀이 : 부정 피드백 540건을 뜯어 보니 이유는 네 가지였다. 이유 지적이 틀렸나? ① 맞는 말이지만 고치면 이 PR의 초점이 흐려진다 아니다 ② 맞는 말이지만 SDK를 올려야만 고칠 수 있다 아니다 ③ 실험용·테스트 코드라 품질을 신경 쓰지 않는다 아니다 ④ 지적 자체가 틀렸다(오탐) 맞다 — 3% 미만 \"싫다\"와 \"틀렸다\"는 다르다. 부정 피드백 대부분은 지적이 틀려서가 아니라 지금 이 PR에서 고칠 일이 아니라서 였다. 08장의 Tricorder \"유효 오탐\"(기술적으로 맞아도 개발자가 조치하지 않으면 오탐으로 본다)과 같은 이야기다. 다만 \"3% 미만\"이 부정 피드백 540건 중 인지 전체 피드백 중 인지 문장만으로는 분명하지 않다. 어느 쪽이든 정답지(사람이 미리 정한 맞는 답)로 잰 정밀도가 아니라 개발자가 스스로 밝힌 이유 를 분류한 값이다. 우리 에이전트에 옮기면: 👎를 받았을 때 \"틀렸다\", \"맞지만 지금은 아니다\", \"이 코드엔 해당 없다\"를 구분해서 받을 수 있게 해 두면, 고칠 것이 에이전트인지 적용 범위인지 가를 수 있다. ⑦ 어떤 지적이 먹혔나 (6장 G·H절, 표 II) 표 II에 대표 규칙 21개가 있다. 몇 개만 옮긴다. 언어 규칙 요지 Java DynamoDB getItem 결과는 항목이 없으면 null이다. 예외가 나지 않으니 쓰기 전에 null 검사를 하라 Java 맵을 키로 돌면서 값을 다시 조회하지 말고 entrySet 으로 돌아라(성능) Python Lambda 함수가 호출될 때마다 AWS 클라이언트를 새로 만들지 말고 재사용하라 Python 소켓 연결에 타임아웃을 지정하라. 안 하면 무한히 기다릴 수 있다 JavaScript 평문으로 보내는 http.Agent() 대신 https.Agent() 를 써라 저자들은 규칙이 쓸모 있었던 이유를 둘로 정리했다(6장 H절). \"SDK (new) features are sometimes missed by developers. Pagination, retry and error handling are examples of such features, where developers not familiar with these built-in capabilities sometimes implement \"manual\" mechanisms instead.\" \"Developers sometimes assume, rather than verify, the functionality of a given API or the role of a given parameter.\" 풀이 : 놓친 기능 : SDK에 이미 있는 페이지 처리·재시도·오류 처리를 모르고 직접 구현한다. 잘못 믿은 동작 : API가 이렇게 동작하리라 확인하지 않고 가정 한다. 예로 QueryResponse::hasItems 는 \"항목이 있다\"가 아니라 \"Items 속성이 정의돼 있다\"는 뜻인데, 비어 있지 않다고 오해하기 쉽다. 둘 다 특정 라이브러리를 아는 사람만 짚을 수 있는 지적 이다. 범용 LLM 리뷰어가 자주 놓치거나, 반대로 그럴듯하게 틀리기 쉬운 영역이기도 하다. 우리 팀이라면 사내 공통 모듈이나 자주 쓰는 라이브러리의 \"잘못 믿기 쉬운 동작\"을 모아 두는 것이 같은 효과를 낼 수 있다. ⑧ 데이터 규모 (6장 A절) 언어 저장소 코드 변경 Java 약 2만 7천 약 180만 JavaScript 약 8천 약 110만 Python 약 2만 5천 약 160만 풀이 : Apache·MIT 라이선스에 GitHub 별 4개 이상인 저장소를 모았다. CodeReviewer(별이 많고 PR 1,500개 이상)보다 문턱이 훨씬 낮다. 넓게 모은 뒤 ②의 \"여러 저장소에서 반복\" 기준으로 거르는 방식이다. 이 논문을 읽을 때 따져 볼 점 후속 연구가 이 논문을 직접 검증한 자료는 이 스터디 조사에서 확인하지 못했다. 아래는 원문만 보고 짚을 수 있는 점이다. 따져 볼 점 근거 비교 대상이 없다 사람이 직접 쓴 CodeGuru 규칙의 수용률과 비교하지 않았다. 73%가 높은지 낮은지 판단할 기준이 논문 안에 없다 피드백 표본이 작고 치우칠 수 있다 추천 2만여 건 중 피드백 약 2천 건(약 10%). 이 2천 건이 모두 62개 규칙의 것이라 해도 규칙 하나당 평균 30여 건이다 감정 분석 판정의 정확도가 없다 글만 남긴 피드백을 모델이 긍정/부정으로 갈랐지만 검증 수치가 없다 군집 품질 수치가 없다 5장 B절에서 균질성·완전성(묶음이 얼마나 깔끔한가)을 쟀다고 했지만 값은 싣지 않았다 숫자가 맞지 않는 곳이 있다 초록 \"600개 미만 묶음\" vs 6장 합계 635개 제품을 만든 회사의 자기 보고다 저자 대부분이 AWS 소속이고, 측정도 자사 서비스 안에서 했다 비교해 볼 만한 다른 수용률: 사례 수용률 측정 방식 실린 곳 CodeGuru 채굴 규칙 (이 논문) 73% 피드백 단 건 중 👍·useful 비율 — Google AutoCommenter 피드백 기준 80% / 코드 변경 기준 약 40% 같은 시스템, 두 방식 08장 Mozilla·Ubisoft RevMate 8.1% / 7.2% 리뷰어가 LLM 제안을 골라 게시한 비율 06장 같은 \"수용률\"이라는 이름이라도 분모가 무엇이냐 에 따라 10배씩 차이 난다. 숫자를 비교하기 전에 계산식부터 맞춰 봐야 한다. 읽고 나서 생각해 볼 질문 우리 과거 PR에서 \"반복해서 지적되고 실제로 고쳐진 것\"을 뽑는다면, 몇 번 이상 반복돼야 에이전트 점검 항목으로 올릴 것인가? 한 사람의 지적만 반복된 경우는 어떻게 볼 것인가? 에이전트를 팀에 내놓기 전에 CodeGuru의 \"조치할 만한 지적 70%\" 같은 관문을 둘 것인가? 둔다면 누가 몇 건을 보고 판정할 것인가? 👍/👎 피드백을 받는다면, 피드백이 없는 코멘트는 어떻게 셀 것인가? 피드백 기준 수용률과 \"실제로 코드가 바뀐 비율\"을 둘 다 볼 것인가? 👎의 이유를 \"틀렸다 / 맞지만 지금은 아니다 / 이 코드엔 해당 없다\"로 나눠 받을 것인가? 사내 공통 모듈이나 자주 쓰는 라이브러리의 \"잘못 믿기 쉬운 동작\"을 에이전트에게 따로 알려 줄 것인가? 출처 원문 — https://amazon.science/publications/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes (소개 페이지) PDF — https://cdn.amazon.science/da/f0/050314414785a5662500d0e46723/a-language-agnostic-framework-for-mining-static-analysis-rules-from-code-changes.pdf . 발췌는 모두 이 PDF(13쪽)에서 옮겼다 CodeGuru 규칙 목록 — https://docs.aws.amazon.com/codeguru/detector-library/ (논문 참고문헌 [72]) CodeGuru Reviewer 신규 저장소 연결 중단(2025-11-07)과 06장 요약은 근거 원장 wave-1 A6b 를 따른다 비교 수치(AutoCommenter, RevMate)는 06장 · 08장 을 따른다 "}, {"id": "p-codereviewer2022", "key": "codereviewer2022", "title": "CodeReviewer (Li 외, FSE 2022)", "grade": "A", "pdf": "https://arxiv.org/pdf/2203.09095", "cited": ["02", "04", "06", "10", "11"], "html": "<h1>CodeReviewer (Li 외, FSE 2022)<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-25<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-25<\/li>\n<li><strong>원제목<\/strong>: Automating Code Review Activities by Large-Scale Pre-training<\/li>\n<li><strong>저자·소속<\/strong>: Zhiyu Li, Shuai Lu, Daya Guo, Nan Duan 외 — Microsoft Research Asia · Microsoft DevDiv · LinkedIn · 베이징대 · 중산대<\/li>\n<li><strong>발표처<\/strong>: ESEC/FSE 2022 (소프트웨어공학 최상위 학회)<\/li>\n<li><strong>원문<\/strong>: <a href=\"https://arxiv.org/pdf/2203.09095\">https://arxiv.org/pdf/2203.09095<\/a> (arXiv v2, 2022-10-11)<\/li>\n<li><strong>등급<\/strong>: A — 자동 코드 리뷰 분야 최다 인용(OpenAlex 422)<\/li>\n<\/ul>\n<h2>한눈에 보기<\/h2>\n<ul>\n<li><strong>무엇을 했나<\/strong>: GitHub PR 793만 개에서 \"코드 변경 + 리뷰 코멘트\"를 모아, 리뷰 전용 AI 모델을 미리 학습시켰다(사전학습). 그리고 리뷰 자동화를 <strong>세 가지 과제<\/strong>로 나눠 시험했다.<\/li>\n<li><strong>왜 유명한가<\/strong>: 이 세 과제 틀과 데이터셋이 이후 연구의 <strong>표준 시험지<\/strong>가 됐다. 그래서 2023~2025년 논문 대부분이 \"CodeReviewer보다 낫다\"를 기준으로 삼는다.<\/li>\n<li><strong>지금 읽을 때 주의할 점<\/strong>: 대표 점수가 BLEU(단어 겹침 점수)인데, 저자들 스스로 리뷰에 맞지 않는다고 했다. 데이터 품질도 후속 연구에서 크게 비판받았다.<\/li>\n<\/ul>\n<h2>지금 정독할 가치가 있나<\/h2>\n<p>목적이 \"우리 PR 리뷰 에이전트를 어떻게 채점할까\"라면 <strong>정독까지는 필요 없다.<\/strong> 아래 발췌만 훑어도 이 논문에서 가져갈 것은 거의 다 가져간다.<\/p>\n<table>\n<thead>\n<tr>\n<th>건너뛰어도 되는 부분<\/th>\n<th>이유<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>4장 모델 구조·사전학습 과제<\/td>\n<td>2022년식 중형 모델(파라미터 2억 2천만 개)을 직접 학습시키는 방법이다. 지금은 범용 LLM을 그대로 쓰므로 우리와 거리가 멀다<\/td>\n<\/tr>\n<tr>\n<td>6.4·6.5절 요소별 효과 분석<\/td>\n<td>사전학습 과제를 하나씩 빼 보거나 언어를 하나만 써 보는 실험이다. 모델 개발자에게만 의미가 있다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>볼 만한 부분<\/th>\n<th>이유<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2장 세 가지 과제 정의<\/td>\n<td>이후 논문을 읽을 때 기본 지식이 된다<\/td>\n<\/tr>\n<tr>\n<td>3.3절 정답지 만드는 방식<\/td>\n<td>\"코멘트가 달렸으면 문제, 안 달렸으면 정상\"이라는 가정이 어디서 왔는지 보여 준다. 우리가 정답지를 만들 때도 같은 함정에 빠질 수 있다<\/td>\n<\/tr>\n<tr>\n<td>6.2절 그림 5<\/td>\n<td>BLEU가 엉뚱한 코멘트에 더 높은 점수를 준 실제 예<\/td>\n<\/tr>\n<tr>\n<td>6.3절 표 6<\/td>\n<td>입력을 그대로 베끼기만 해도 BLEU 58.75가 나온 함정<\/td>\n<\/tr>\n<tr>\n<td>8장 한계<\/td>\n<td>저자들이 스스로 인정한 데이터 편향과 지표 문제<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>이 논문이 한 일 — 쉽게<\/h2>\n<p>리뷰어가 하는 일을 세 장면으로 잘랐다.<\/p>\n<ol>\n<li><strong>\"이 변경, 볼 필요 있나?\"<\/strong> — 수백 줄 변경 중 코멘트가 필요할 만한 덩어리를 골라 준다 → <strong>품질 판단<\/strong>(예/아니오)<\/li>\n<li><strong>\"뭐라고 코멘트를 달까?\"<\/strong> — 변경을 보고 리뷰 코멘트 문장을 써 준다 → <strong>코멘트 생성<\/strong><\/li>\n<li><strong>\"코멘트대로 고쳐 줘\"<\/strong> — 코드 작성자 쪽. 코멘트를 받아 코드를 고쳐 준다 → <strong>코드 수정<\/strong><\/li>\n<\/ol>\n<p>그리고 이 세 가지를 잘하도록 <strong>리뷰 데이터로만 미리 공부시킨 모델<\/strong>(CodeReviewer)을 만들었다. 당시 다른 모델들은 일반 소스 코드로 공부해서 \"diff(변경 전후 비교)\"나 \"리뷰 코멘트\"를 잘 몰랐다는 것이 출발점이다.<\/p>\n<p>지금의 PR 리뷰 에이전트는 1번과 2번을 합친 것에 가깝다. \"어디가 문제인지 고르고, 코멘트를 쓴다.\"<\/p>\n<h2>주요 내용 발췌와 해설<\/h2>\n<h3>① 세 과제의 정의 (2장)<\/h3>\n<blockquote>\n<p>\"The first is called code change quality estimation, aiming to predict whether a code diff needs a review comment. It assists reviewers to pick a code diff chunk that might have issues among a large number of code chunks.\" (1장)<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 품질 판단은 \"이 diff 덩어리에 코멘트가 필요한가\"를 맞히는 과제다. 많은 변경 중 문제가 있을 만한 곳을 먼저 보게 도와주려는 목적이다.<\/p>\n<blockquote>\n<p>\"In the real-world scenario, the model generates few review comment candidates and the reviewers may choose an ideal one from them, free from writing comments manually.\" (2.3절)<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 저자들이 그린 사용 장면은 \"모델이 코멘트 후보 몇 개를 내면 리뷰어가 골라 쓴다\"였다. 사람이 최종 판단을 하는 <strong>보조 도구<\/strong>를 상정했다. 지금처럼 에이전트가 PR에 직접 코멘트를 다는 장면과는 다르다.<\/p>\n<blockquote>\n<p>\"we define the inputs of the three tasks at diff hunk level.\" (2.5절)<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 입력 단위가 PR 전체가 아니라 <strong>diff 덩어리(hunk) 하나<\/strong>다. hunk는 바뀐 줄과 그 앞뒤 몇 줄을 묶은 조각이다. 그래서 이 모델은 \"다른 파일의 이 함수가 null을 돌려줄 수 있다\" 같은 <strong>파일을 넘나드는 문제를 원리상 볼 수 없다.<\/strong> 후속 연구(Tufano 외 2024)도 이 한계를 지적했다.<\/p>\n<h3>② 정답지를 어떻게 만들었나 (3.3절)<\/h3>\n<blockquote>\n<p>\"All commented code changes are regarded as suspicious code that introduces bugs or conflicts with code specifications. Other code changes without comments are labeled as correct.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 품질 판단의 정답은 <strong>\"실제로 코멘트가 달렸나\"<\/strong> 로 정했다. 코멘트가 달린 변경은 \"문제 있음\", 안 달린 변경은 \"정상\"이다.<\/p>\n<p>이 가정에는 두 가지 구멍이 있다.<\/p>\n<ul>\n<li><strong>코멘트가 없다고 문제가 없는 것은 아니다.<\/strong> 리뷰어가 놓쳤을 수도 있다. 그러면 모델이 진짜 버그를 짚어도 \"정상인데 괜히 잡았다\"로 감점된다.<\/li>\n<li><strong>코멘트가 있다고 문제인 것도 아니다.<\/strong> \"여기 왜 이렇게 했어요?\" 같은 질문이나 칭찬도 코멘트다.<\/li>\n<\/ul>\n<p>이것은 우리가 과거 Bitbucket PR 코멘트로 정답지를 만들 때도 그대로 생기는 문제다. 02장의 grounded/augmented 구분(정답지에 있는 것만 맞다고 칠지, 정답지 밖의 맞는 지적도 인정할지)이 이 구멍을 다루는 방법이다.<\/p>\n<blockquote>\n<p>\"When there is more than 1 comment related to a diff hunk, we only keep the earliest one.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 한 덩어리에 코멘트가 여러 개면 <strong>가장 먼저 달린 하나만<\/strong> 남겼다. 리뷰어 세 명이 서로 다른 문제를 짚었어도 정답은 하나뿐이다. 모델이 두 번째 리뷰어와 같은 지적을 하면 틀린 답이 된다. 저자들도 8장에서 이것을 편향으로 인정했다.<\/p>\n<blockquote>\n<p>\"Even though we collect data from projects with high star numbers and PR numbers, the dataset quality still varies, especially when it comes to review comments.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 인기 있는 저장소만 골랐는데도 코멘트 품질이 들쭉날쭉했다고 저자들이 직접 썼다. 나중에 후속 연구가 이 문제를 숫자로 확인했다(아래 「후속 연구가 짚은 문제」).<\/p>\n<h3>③ 데이터 규모 (표 2)<\/h3>\n<table>\n<thead>\n<tr>\n<th>항목<\/th>\n<th>값<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>프로젝트<\/td>\n<td>1,161개 (언어 9개: C, C++, C#, Go, Java, JavaScript, PHP, Python, Ruby)<\/td>\n<\/tr>\n<tr>\n<td>PR<\/td>\n<td>약 793만 개<\/td>\n<\/tr>\n<tr>\n<td>코멘트 없는 변경 / 있는 변경<\/td>\n<td>431만 / 248만<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>풀이<\/strong>: 프로젝트는 별이 많고 PR이 1,500개 넘는 활발한 오픈소스만 골랐다. 시험 데이터는 학습에 쓰지 않은 <strong>다른 프로젝트<\/strong>에서 뽑았다(3.4절). 같은 프로젝트의 코드가 학습과 시험에 함께 들어가 \"답을 미리 본\" 상태가 되는 것을 막으려는 설계다. 02장 5절의 데이터 분할 이야기와 같은 원리다.<\/p>\n<h3>④ 결과 — 숫자 읽는 법 (표 4·5·6)<\/h3>\n<table>\n<thead>\n<tr>\n<th>과제<\/th>\n<th>CodeReviewer<\/th>\n<th>비교 모델 최고<\/th>\n<th>지표<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>품질 판단<\/td>\n<td>F1 <strong>71.53<\/strong><\/td>\n<td>64.16 (CodeT5)<\/td>\n<td>정밀도·재현율의 조화평균<\/td>\n<\/tr>\n<tr>\n<td>코멘트 생성<\/td>\n<td>BLEU-4 <strong>5.32<\/strong><\/td>\n<td>4.83 (CodeT5)<\/td>\n<td>단어 겹침<\/td>\n<\/tr>\n<tr>\n<td>코멘트 생성(사람 평가)<\/td>\n<td>정보성 <strong>3.60<\/strong> · 관련성 <strong>3.20<\/strong> (5점 만점)<\/td>\n<td>3.08 · 2.50 (Transformer)<\/td>\n<td>사람 6명이 100건 채점<\/td>\n<\/tr>\n<tr>\n<td>코드 수정<\/td>\n<td>정확 일치 <strong>30.32%<\/strong><\/td>\n<td>24.41% (CodeT5)<\/td>\n<td>정답 코드와 글자까지 같은 비율<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>풀이<\/strong>:<\/p>\n<ul>\n<li>품질 판단 F1 71.53은 \"코멘트가 필요한 곳\"을 꽤 잘 고른다는 뜻이다. 단, 정답 자체가 ②의 \"코멘트가 달렸나\"라는 점을 기억해야 한다.<\/li>\n<li>코멘트 생성 BLEU 5.32는 100점 만점에 5점이다. 저자들도 \"10도 안 된다, 어려운 과제다\"라고 썼다. 하지만 이 낮은 점수는 모델이 못해서라기보다 <strong>BLEU가 리뷰를 못 재서<\/strong>일 가능성이 크다. 바로 아래 ⑤가 그 증거다.<\/li>\n<li>그래서 저자들은 사람 평가를 따로 했다. 정보성(고칠 방향을 알려 주나)과 관련성(이 변경과 상관있는 말인가)을 5점 척도로 매겼다. 다만 표본 100건은 \"코드 변경과 코멘트가 고품질인 것\"만 <strong>사람이 골라낸<\/strong> 것이라, 실제 데이터 전체보다 쉬운 시험이었을 수 있다.<\/li>\n<\/ul>\n<h3>⑤ BLEU가 엉뚱한 코멘트에 더 높은 점수를 준 예 (그림 5)<\/h3>\n<p>로그 레벨을 <code>info<\/code>에서 <code>finest<\/code>로 낮춘 변경이다.<\/p>\n<pre><code class=\"language-diff\">- LOG.info(String.format(\n+ LOG.finest(String.format(\n      &quot;Mapping %s to docker image %s %d times&quot;, caps, name,\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th>누가<\/th>\n<th>코멘트<\/th>\n<th>BLEU<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>정답(사람)<\/td>\n<td>This change prevents a user understanding how their server is configured. Best to leave at <code>info<\/code> level.<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>Codex<\/td>\n<td>I think this is a good example of how to use the docker<\/td>\n<td><strong>8.83<\/strong><\/td>\n<\/tr>\n<tr>\n<td>CodeReviewer<\/td>\n<td>This is an important debugging help and shouldn't be lower than the default visible INFO.<\/td>\n<td>7.97<\/td>\n<\/tr>\n<tr>\n<td>T5<\/td>\n<td>I don't think this change is needed.<\/td>\n<td>4.93<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>풀이<\/strong>: 정답은 \"로그 레벨을 낮추면 서버 설정을 알 수 없게 되니 <code>info<\/code>로 두라\"다. CodeReviewer는 \"중요한 디버깅 정보라 기본 INFO보다 낮추면 안 된다\"고 해서 <strong>같은 뜻<\/strong>을 말했다. Codex는 \"docker 사용법의 좋은 예\"라는 <strong>엉뚱한 말<\/strong>을 했다. 그런데 BLEU는 Codex에 더 높은 점수를 줬다. \"I think\", \"this\", \"the\" 같은 흔한 단어가 겹쳤기 때문이다.<\/p>\n<p>저자들도 본문에 이렇게 썼다.<\/p>\n<blockquote>\n<p>\"our model prediction conveys similar intent as the ground truth. But their words differ greatly so that the BLEU score is lower than Codex.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: \"우리 모델은 정답과 비슷한 의도를 전했지만 단어가 많이 달라서 BLEU가 Codex보다 낮다.\" BLEU의 약점을 논문이 스스로 보여 준 장면이다. 02장 4절의 단순화 예시가 실제 논문에서 그대로 일어난 셈이다.<\/p>\n<p>같은 그림의 두 번째 예도 비슷하다. 정답이 \"null 대신 빈 리스트를 돌려주자\"였는데, CodeReviewer가 \"return empty list instead?\"라고 해서 맞혔다. T5·CodeT5는 \"이거 필요 없을 것 같다\" 같은 일반론을 냈다.<\/p>\n<h3>⑥ 입력을 그대로 베껴도 BLEU 58.75 (표 6)<\/h3>\n<table>\n<thead>\n<tr>\n<th>방법<\/th>\n<th>BLEU<\/th>\n<th>정확 일치<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NaïveCopy (입력 코드를 그대로 출력)<\/td>\n<td><strong>58.75<\/strong><\/td>\n<td>0.00<\/td>\n<\/tr>\n<tr>\n<td>CodeReviewer<\/td>\n<td>82.61<\/td>\n<td>30.32<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>\"The NaïveCopy method directly copies the input code as the refinement result. It produces a decent BLEU score but 0.00 Exact Match (EM).\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 코드 수정 과제에서 <strong>아무것도 고치지 않고 입력을 그대로 내도<\/strong> BLEU가 58.75다. 수정은 보통 몇 줄만 바뀌니, 안 바뀐 나머지 줄이 정답과 겹치기 때문이다. 그래서 BLEU 80점대라는 숫자는 \"잘 고쳤다\"보다 \"원래 코드를 거의 그대로 뒀다\"에 가깝다. 저자들은 이 과제에서는 정확 일치가 더 중요한 지표라고 했다.<\/p>\n<p>이 사례는 지표를 설계할 때 <strong>\"아무것도 안 하는 기준선(baseline)\"을 꼭 같이 재 보라<\/strong>는 교훈이 된다. PR 리뷰라면 \"코멘트를 하나도 안 다는 에이전트\"나 \"모든 줄에 같은 코멘트를 다는 에이전트\"가 몇 점을 받는지 먼저 보는 것이다.<\/p>\n<h3>⑦ 저자들이 인정한 한계 (8장)<\/h3>\n<blockquote>\n<p>\"Since the dataset is collected from GitHub, it is built upon only open-source projects, not industrial projects.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 오픈소스만 다뤘다. 회사 코드의 리뷰는 관례, 언어, 코멘트 문화가 다를 수 있다.<\/p>\n<blockquote>\n<p>\"code review is often not done by a single reviewer but multiple reviewers, and they could give different comments from different perspectives. But we only collect a single comment for a code change, leading a bias in our dataset.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: 실제 리뷰는 여러 사람이 서로 다른 관점으로 코멘트를 다는데, 변경 하나에 코멘트 하나만 남겨서 데이터가 치우쳤다. ②의 \"가장 먼저 달린 하나만 남김\"과 같은 이야기다.<\/p>\n<blockquote>\n<p>\"We argue that the BLEU score which is widely used in text generation tasks is not suitable for the review generation task.\"<\/p>\n<\/blockquote>\n<p><strong>풀이<\/strong>: BLEU는 리뷰 생성에 맞지 않는다고 저자들이 직접 말했다. 그런데도 논문의 대표 숫자가 BLEU였고, 후속 논문들도 이 숫자로 비교를 이어 갔다. \"알고도 쓰는\" 지표가 분야 표준으로 굳어진 사례다.<\/p>\n<h2>후속 연구가 짚은 문제<\/h2>\n<table>\n<thead>\n<tr>\n<th>연구<\/th>\n<th>발견<\/th>\n<th>실린 곳<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tufano 외 2024 (TSE)<\/td>\n<td>CodeReviewer를 다시 돌린 코멘트 1,611개 중 정답과 글자까지 같은 것 <strong>0개<\/strong>. 사람이 검토한 예측의 약 25%는 데이터 추출 오류였다<\/td>\n<td><a href=\"#04\">04장<\/a><\/td>\n<\/tr>\n<tr>\n<td>Liu, Lin, Thongtanunam 2025 (MSR, \"Too Noisy To Learn\")<\/td>\n<td>CodeReviewer 학습 코멘트 표본 중 <strong>64%만 유효<\/strong>. 걸러 내자 데이터는 줄고 점수는 올랐다<\/td>\n<td><a href=\"#04\">04장<\/a> · <a href=\"#10\">10장<\/a><\/td>\n<\/tr>\n<tr>\n<td>DeepCRCEval (FASE 2025)<\/td>\n<td>CodeReviewer 데이터의 코멘트 중 고품질은 <strong>약 8%<\/strong><\/td>\n<td><a href=\"#04\">04장<\/a><\/td>\n<\/tr>\n<tr>\n<td>Guo 외 2024 (ICSE)<\/td>\n<td>데이터 품질 문제 때문에 새 데이터셋(CodeReview-New)을 따로 만들었다<\/td>\n<td><a href=\"#04\">04장<\/a><\/td>\n<\/tr>\n<tr>\n<td>Zhou 외 2023 (ICPC)<\/td>\n<td>범용 사전학습 모델(CodeT5)이 리뷰 전용 도구보다 13.4~38.9% 나았다. 지표를 바꾸자 모델 순위가 바뀌었다<\/td>\n<td><a href=\"#04\">04장<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>정리하면<\/strong>: 이 논문은 \"리뷰 자동화를 어떻게 시험할까\"의 <strong>틀<\/strong>을 세운 공이 크다. 하지만 그 시험지(데이터)와 채점 방식(BLEU)은 이후 연구가 하나씩 고쳐 나간 대상이다. 최근 벤치마크가 PR 단위로, LLM 채점관으로, 사람이 검증한 정답지로 옮겨 간 이유가 여기에 있다(<a href=\"#05\">05장<\/a>).<\/p>\n<h2>읽고 나서 생각해 볼 질문<\/h2>\n<ol>\n<li>우리 정답지를 과거 PR 코멘트로 만든다면, \"코멘트가 안 달린 곳은 문제없다\"고 볼 것인가? 아니라면 정답지 밖의 지적은 어떻게 채점할 것인가?<\/li>\n<li>한 곳에 리뷰어 여러 명이 다른 코멘트를 달았으면, 정답을 하나만 남길 것인가, 모두 남길 것인가?<\/li>\n<li>우리 에이전트의 점수를 볼 때 \"아무 말도 안 하는 에이전트\"와 \"모든 곳에 코멘트하는 에이전트\"를 기준선으로 같이 잴 것인가?<\/li>\n<li>입력 단위를 diff 덩어리로 할 것인가, PR 전체(다른 파일 포함)로 할 것인가?<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<ul>\n<li>원문 — <a href=\"https://arxiv.org/pdf/2203.09095\">https://arxiv.org/pdf/2203.09095<\/a> (arXiv v2, 2022-10-11). 발췌는 모두 이 판본에서 옮겼다<\/li>\n<li>공개 데이터·코드·모델 — 논문 1장 각주에 링크가 있다<\/li>\n<li>후속 연구 수치는 <a href=\"#04\">04장<\/a>과 근거 원장 <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A4-automated-review-history.md\">wave-1 A4<\/a>를 따른다<\/li>\n<\/ul>", "text": " CodeReviewer (Li 외, FSE 2022) 생성일 : 2026-11-25 최종 수정일 : 2026-11-25 원제목 : Automating Code Review Activities by Large-Scale Pre-training 저자·소속 : Zhiyu Li, Shuai Lu, Daya Guo, Nan Duan 외 — Microsoft Research Asia · Microsoft DevDiv · LinkedIn · 베이징대 · 중산대 발표처 : ESEC/FSE 2022 (소프트웨어공학 최상위 학회) 원문 : https://arxiv.org/pdf/2203.09095 (arXiv v2, 2022-10-11) 등급 : A — 자동 코드 리뷰 분야 최다 인용(OpenAlex 422) 한눈에 보기 무엇을 했나 : GitHub PR 793만 개에서 \"코드 변경 + 리뷰 코멘트\"를 모아, 리뷰 전용 AI 모델을 미리 학습시켰다(사전학습). 그리고 리뷰 자동화를 세 가지 과제 로 나눠 시험했다. 왜 유명한가 : 이 세 과제 틀과 데이터셋이 이후 연구의 표준 시험지 가 됐다. 그래서 2023~2025년 논문 대부분이 \"CodeReviewer보다 낫다\"를 기준으로 삼는다. 지금 읽을 때 주의할 점 : 대표 점수가 BLEU(단어 겹침 점수)인데, 저자들 스스로 리뷰에 맞지 않는다고 했다. 데이터 품질도 후속 연구에서 크게 비판받았다. 지금 정독할 가치가 있나 목적이 \"우리 PR 리뷰 에이전트를 어떻게 채점할까\"라면 정독까지는 필요 없다. 아래 발췌만 훑어도 이 논문에서 가져갈 것은 거의 다 가져간다. 건너뛰어도 되는 부분 이유 4장 모델 구조·사전학습 과제 2022년식 중형 모델(파라미터 2억 2천만 개)을 직접 학습시키는 방법이다. 지금은 범용 LLM을 그대로 쓰므로 우리와 거리가 멀다 6.4·6.5절 요소별 효과 분석 사전학습 과제를 하나씩 빼 보거나 언어를 하나만 써 보는 실험이다. 모델 개발자에게만 의미가 있다 볼 만한 부분 이유 2장 세 가지 과제 정의 이후 논문을 읽을 때 기본 지식이 된다 3.3절 정답지 만드는 방식 \"코멘트가 달렸으면 문제, 안 달렸으면 정상\"이라는 가정이 어디서 왔는지 보여 준다. 우리가 정답지를 만들 때도 같은 함정에 빠질 수 있다 6.2절 그림 5 BLEU가 엉뚱한 코멘트에 더 높은 점수를 준 실제 예 6.3절 표 6 입력을 그대로 베끼기만 해도 BLEU 58.75가 나온 함정 8장 한계 저자들이 스스로 인정한 데이터 편향과 지표 문제 이 논문이 한 일 — 쉽게 리뷰어가 하는 일을 세 장면으로 잘랐다. \"이 변경, 볼 필요 있나?\" — 수백 줄 변경 중 코멘트가 필요할 만한 덩어리를 골라 준다 → 품질 판단 (예/아니오) \"뭐라고 코멘트를 달까?\" — 변경을 보고 리뷰 코멘트 문장을 써 준다 → 코멘트 생성 \"코멘트대로 고쳐 줘\" — 코드 작성자 쪽. 코멘트를 받아 코드를 고쳐 준다 → 코드 수정 그리고 이 세 가지를 잘하도록 리뷰 데이터로만 미리 공부시킨 모델 (CodeReviewer)을 만들었다. 당시 다른 모델들은 일반 소스 코드로 공부해서 \"diff(변경 전후 비교)\"나 \"리뷰 코멘트\"를 잘 몰랐다는 것이 출발점이다. 지금의 PR 리뷰 에이전트는 1번과 2번을 합친 것에 가깝다. \"어디가 문제인지 고르고, 코멘트를 쓴다.\" 주요 내용 발췌와 해설 ① 세 과제의 정의 (2장) \"The first is called code change quality estimation, aiming to predict whether a code diff needs a review comment. It assists reviewers to pick a code diff chunk that might have issues among a large number of code chunks.\" (1장) 풀이 : 품질 판단은 \"이 diff 덩어리에 코멘트가 필요한가\"를 맞히는 과제다. 많은 변경 중 문제가 있을 만한 곳을 먼저 보게 도와주려는 목적이다. \"In the real-world scenario, the model generates few review comment candidates and the reviewers may choose an ideal one from them, free from writing comments manually.\" (2.3절) 풀이 : 저자들이 그린 사용 장면은 \"모델이 코멘트 후보 몇 개를 내면 리뷰어가 골라 쓴다\"였다. 사람이 최종 판단을 하는 보조 도구 를 상정했다. 지금처럼 에이전트가 PR에 직접 코멘트를 다는 장면과는 다르다. \"we define the inputs of the three tasks at diff hunk level.\" (2.5절) 풀이 : 입력 단위가 PR 전체가 아니라 diff 덩어리(hunk) 하나 다. hunk는 바뀐 줄과 그 앞뒤 몇 줄을 묶은 조각이다. 그래서 이 모델은 \"다른 파일의 이 함수가 null을 돌려줄 수 있다\" 같은 파일을 넘나드는 문제를 원리상 볼 수 없다. 후속 연구(Tufano 외 2024)도 이 한계를 지적했다. ② 정답지를 어떻게 만들었나 (3.3절) \"All commented code changes are regarded as suspicious code that introduces bugs or conflicts with code specifications. Other code changes without comments are labeled as correct.\" 풀이 : 품질 판단의 정답은 \"실제로 코멘트가 달렸나\" 로 정했다. 코멘트가 달린 변경은 \"문제 있음\", 안 달린 변경은 \"정상\"이다. 이 가정에는 두 가지 구멍이 있다. 코멘트가 없다고 문제가 없는 것은 아니다. 리뷰어가 놓쳤을 수도 있다. 그러면 모델이 진짜 버그를 짚어도 \"정상인데 괜히 잡았다\"로 감점된다. 코멘트가 있다고 문제인 것도 아니다. \"여기 왜 이렇게 했어요?\" 같은 질문이나 칭찬도 코멘트다. 이것은 우리가 과거 Bitbucket PR 코멘트로 정답지를 만들 때도 그대로 생기는 문제다. 02장의 grounded/augmented 구분(정답지에 있는 것만 맞다고 칠지, 정답지 밖의 맞는 지적도 인정할지)이 이 구멍을 다루는 방법이다. \"When there is more than 1 comment related to a diff hunk, we only keep the earliest one.\" 풀이 : 한 덩어리에 코멘트가 여러 개면 가장 먼저 달린 하나만 남겼다. 리뷰어 세 명이 서로 다른 문제를 짚었어도 정답은 하나뿐이다. 모델이 두 번째 리뷰어와 같은 지적을 하면 틀린 답이 된다. 저자들도 8장에서 이것을 편향으로 인정했다. \"Even though we collect data from projects with high star numbers and PR numbers, the dataset quality still varies, especially when it comes to review comments.\" 풀이 : 인기 있는 저장소만 골랐는데도 코멘트 품질이 들쭉날쭉했다고 저자들이 직접 썼다. 나중에 후속 연구가 이 문제를 숫자로 확인했다(아래 「후속 연구가 짚은 문제」). ③ 데이터 규모 (표 2) 항목 값 프로젝트 1,161개 (언어 9개: C, C++, C#, Go, Java, JavaScript, PHP, Python, Ruby) PR 약 793만 개 코멘트 없는 변경 / 있는 변경 431만 / 248만 풀이 : 프로젝트는 별이 많고 PR이 1,500개 넘는 활발한 오픈소스만 골랐다. 시험 데이터는 학습에 쓰지 않은 다른 프로젝트 에서 뽑았다(3.4절). 같은 프로젝트의 코드가 학습과 시험에 함께 들어가 \"답을 미리 본\" 상태가 되는 것을 막으려는 설계다. 02장 5절의 데이터 분할 이야기와 같은 원리다. ④ 결과 — 숫자 읽는 법 (표 4·5·6) 과제 CodeReviewer 비교 모델 최고 지표 품질 판단 F1 71.53 64.16 (CodeT5) 정밀도·재현율의 조화평균 코멘트 생성 BLEU-4 5.32 4.83 (CodeT5) 단어 겹침 코멘트 생성(사람 평가) 정보성 3.60 · 관련성 3.20 (5점 만점) 3.08 · 2.50 (Transformer) 사람 6명이 100건 채점 코드 수정 정확 일치 30.32% 24.41% (CodeT5) 정답 코드와 글자까지 같은 비율 풀이 : 품질 판단 F1 71.53은 \"코멘트가 필요한 곳\"을 꽤 잘 고른다는 뜻이다. 단, 정답 자체가 ②의 \"코멘트가 달렸나\"라는 점을 기억해야 한다. 코멘트 생성 BLEU 5.32는 100점 만점에 5점이다. 저자들도 \"10도 안 된다, 어려운 과제다\"라고 썼다. 하지만 이 낮은 점수는 모델이 못해서라기보다 BLEU가 리뷰를 못 재서 일 가능성이 크다. 바로 아래 ⑤가 그 증거다. 그래서 저자들은 사람 평가를 따로 했다. 정보성(고칠 방향을 알려 주나)과 관련성(이 변경과 상관있는 말인가)을 5점 척도로 매겼다. 다만 표본 100건은 \"코드 변경과 코멘트가 고품질인 것\"만 사람이 골라낸 것이라, 실제 데이터 전체보다 쉬운 시험이었을 수 있다. ⑤ BLEU가 엉뚱한 코멘트에 더 높은 점수를 준 예 (그림 5) 로그 레벨을 info 에서 finest 로 낮춘 변경이다. - LOG.info(String.format( + LOG.finest(String.format( \"Mapping %s to docker image %s %d times\", caps, name, 누가 코멘트 BLEU 정답(사람) This change prevents a user understanding how their server is configured. Best to leave at info level. — Codex I think this is a good example of how to use the docker 8.83 CodeReviewer This is an important debugging help and shouldn't be lower than the default visible INFO. 7.97 T5 I don't think this change is needed. 4.93 풀이 : 정답은 \"로그 레벨을 낮추면 서버 설정을 알 수 없게 되니 info 로 두라\"다. CodeReviewer는 \"중요한 디버깅 정보라 기본 INFO보다 낮추면 안 된다\"고 해서 같은 뜻 을 말했다. Codex는 \"docker 사용법의 좋은 예\"라는 엉뚱한 말 을 했다. 그런데 BLEU는 Codex에 더 높은 점수를 줬다. \"I think\", \"this\", \"the\" 같은 흔한 단어가 겹쳤기 때문이다. 저자들도 본문에 이렇게 썼다. \"our model prediction conveys similar intent as the ground truth. But their words differ greatly so that the BLEU score is lower than Codex.\" 풀이 : \"우리 모델은 정답과 비슷한 의도를 전했지만 단어가 많이 달라서 BLEU가 Codex보다 낮다.\" BLEU의 약점을 논문이 스스로 보여 준 장면이다. 02장 4절의 단순화 예시가 실제 논문에서 그대로 일어난 셈이다. 같은 그림의 두 번째 예도 비슷하다. 정답이 \"null 대신 빈 리스트를 돌려주자\"였는데, CodeReviewer가 \"return empty list instead?\"라고 해서 맞혔다. T5·CodeT5는 \"이거 필요 없을 것 같다\" 같은 일반론을 냈다. ⑥ 입력을 그대로 베껴도 BLEU 58.75 (표 6) 방법 BLEU 정확 일치 NaïveCopy (입력 코드를 그대로 출력) 58.75 0.00 CodeReviewer 82.61 30.32 \"The NaïveCopy method directly copies the input code as the refinement result. It produces a decent BLEU score but 0.00 Exact Match (EM).\" 풀이 : 코드 수정 과제에서 아무것도 고치지 않고 입력을 그대로 내도 BLEU가 58.75다. 수정은 보통 몇 줄만 바뀌니, 안 바뀐 나머지 줄이 정답과 겹치기 때문이다. 그래서 BLEU 80점대라는 숫자는 \"잘 고쳤다\"보다 \"원래 코드를 거의 그대로 뒀다\"에 가깝다. 저자들은 이 과제에서는 정확 일치가 더 중요한 지표라고 했다. 이 사례는 지표를 설계할 때 \"아무것도 안 하는 기준선(baseline)\"을 꼭 같이 재 보라 는 교훈이 된다. PR 리뷰라면 \"코멘트를 하나도 안 다는 에이전트\"나 \"모든 줄에 같은 코멘트를 다는 에이전트\"가 몇 점을 받는지 먼저 보는 것이다. ⑦ 저자들이 인정한 한계 (8장) \"Since the dataset is collected from GitHub, it is built upon only open-source projects, not industrial projects.\" 풀이 : 오픈소스만 다뤘다. 회사 코드의 리뷰는 관례, 언어, 코멘트 문화가 다를 수 있다. \"code review is often not done by a single reviewer but multiple reviewers, and they could give different comments from different perspectives. But we only collect a single comment for a code change, leading a bias in our dataset.\" 풀이 : 실제 리뷰는 여러 사람이 서로 다른 관점으로 코멘트를 다는데, 변경 하나에 코멘트 하나만 남겨서 데이터가 치우쳤다. ②의 \"가장 먼저 달린 하나만 남김\"과 같은 이야기다. \"We argue that the BLEU score which is widely used in text generation tasks is not suitable for the review generation task.\" 풀이 : BLEU는 리뷰 생성에 맞지 않는다고 저자들이 직접 말했다. 그런데도 논문의 대표 숫자가 BLEU였고, 후속 논문들도 이 숫자로 비교를 이어 갔다. \"알고도 쓰는\" 지표가 분야 표준으로 굳어진 사례다. 후속 연구가 짚은 문제 연구 발견 실린 곳 Tufano 외 2024 (TSE) CodeReviewer를 다시 돌린 코멘트 1,611개 중 정답과 글자까지 같은 것 0개 . 사람이 검토한 예측의 약 25%는 데이터 추출 오류였다 04장 Liu, Lin, Thongtanunam 2025 (MSR, \"Too Noisy To Learn\") CodeReviewer 학습 코멘트 표본 중 64%만 유효 . 걸러 내자 데이터는 줄고 점수는 올랐다 04장 · 10장 DeepCRCEval (FASE 2025) CodeReviewer 데이터의 코멘트 중 고품질은 약 8% 04장 Guo 외 2024 (ICSE) 데이터 품질 문제 때문에 새 데이터셋(CodeReview-New)을 따로 만들었다 04장 Zhou 외 2023 (ICPC) 범용 사전학습 모델(CodeT5)이 리뷰 전용 도구보다 13.4~38.9% 나았다. 지표를 바꾸자 모델 순위가 바뀌었다 04장 정리하면 : 이 논문은 \"리뷰 자동화를 어떻게 시험할까\"의 틀 을 세운 공이 크다. 하지만 그 시험지(데이터)와 채점 방식(BLEU)은 이후 연구가 하나씩 고쳐 나간 대상이다. 최근 벤치마크가 PR 단위로, LLM 채점관으로, 사람이 검증한 정답지로 옮겨 간 이유가 여기에 있다( 05장 ). 읽고 나서 생각해 볼 질문 우리 정답지를 과거 PR 코멘트로 만든다면, \"코멘트가 안 달린 곳은 문제없다\"고 볼 것인가? 아니라면 정답지 밖의 지적은 어떻게 채점할 것인가? 한 곳에 리뷰어 여러 명이 다른 코멘트를 달았으면, 정답을 하나만 남길 것인가, 모두 남길 것인가? 우리 에이전트의 점수를 볼 때 \"아무 말도 안 하는 에이전트\"와 \"모든 곳에 코멘트하는 에이전트\"를 기준선으로 같이 잴 것인가? 입력 단위를 diff 덩어리로 할 것인가, PR 전체(다른 파일 포함)로 할 것인가? 출처 원문 — https://arxiv.org/pdf/2203.09095 (arXiv v2, 2022-10-11). 발췌는 모두 이 판본에서 옮겼다 공개 데이터·코드·모델 — 논문 1장 각주에 링크가 있다 후속 연구 수치는 04장 과 근거 원장 wave-1 A4 를 따른다 "}];

document.addEventListener("click", e => {
  const el = refOf(e);
  // 탭: 방금(포커스·hover로) 열린 것이면 그대로 두고, 이미 열려 있던 것을 다시 탭하면 닫는다
  if(el){ tipFor === el && !tip.hidden && Date.now() - tipAt > 400 && e.pointerType !== "mouse" ? hideTip(true) : showTip(el); return; }
  if(!tip.contains(e.target)) hideTip(true);
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && !tip.hidden){ const el = tipFor; hideTip(true); el && el.focus(); } });
addEventListener("scroll", () => { if(!tip.hidden) hideTip(true); }, { passive: true, capture: true });

function decorate(){
  const content = $("content");
  // 표는 가로 스크롤 상자에 넣는다
  content.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
  // 머리말 메타(생성일·수준…)는 작게
  const h1 = content.querySelector("h1"), m = h1 && h1.nextElementSibling;
  if(m && m.tagName === "UL" && /생성일|수준/.test(m.textContent.slice(0, 40))) m.className = "meta";
  // 특수 절 묶기
  [...content.querySelectorAll("h2")].forEach(h => {
    const txt = h.textContent.trim();
    const key = txt.includes("스스로 판단할 질문") || txt.includes("생각해 볼 질문") ? "box judge" : txt.includes("이 장에서 답하는 질문") ? "box ask" : txt === "출처" ? "sources" : null;
    if(!key) return;
    const sec = document.createElement("section"); sec.className = key;
    h.parentNode.insertBefore(sec, h);
    let n = h; const move = [];
    while(n && !(n !== h && n.tagName === "H2")){ move.push(n); n = n.nextElementSibling; }
    move.forEach(m => sec.appendChild(m));
  });
  content.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  markRefs(content, isPaper(cur) ? cur.slice(2) : null);
  content.querySelectorAll(".widget").forEach(w => (WIDGETS[w.dataset.widget] || (() => {}))(w));
  // 개요
  const ol = $("outline"); ol.innerHTML = "";
  const hs = [...content.querySelectorAll("h2")];
  hs.forEach((h, i) => {
    h.id = `${cur}-s${i+1}`;
    const li = document.createElement("li");
    li.innerHTML = `<a href="#${cur}" data-to="${h.id}">${esc(h.textContent.trim())}</a>`;
    li.firstChild.addEventListener("click", e => { e.preventDefault(); h.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); });
    ol.appendChild(li);
  });
  if(spy) spy.disconnect();
  spy = new IntersectionObserver(es => es.forEach(e => {
    if(!e.isIntersecting) return;
    ol.querySelectorAll("a").forEach(a => a.setAttribute("aria-current", String(a.dataset.to === e.target.id)));
  }), {rootMargin: "0px 0px -70% 0px"});
  hs.forEach(h => spy.observe(h));
}
/* 직접 해 보기 위젯 — md의 widget 주석 자리(div.widget)에 그려진다 */
const fmt = (v, d=3) => Number.isFinite(v) ? v.toFixed(d) : "—";
function slider(id, label, min, max, step, val, show){
  return `<div class="sl"><label for="${id}">${label}</label><output id="${id}-o"></output><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-show="${show||""}"></div>`;
}
function wire(w, update){
  const ins = [...w.querySelectorAll("input")];
  const run = () => {
    ins.filter(i => i.type === "range").forEach(i => { const o = w.querySelector(`#${i.id}-o`); if(o) o.textContent = i.dataset.show === "beta" ? (2 ** +i.value).toFixed(2) : (+i.value).toFixed(2); });
    update(id => +w.querySelector("#" + id).value);
  };
  ins.forEach(i => i.addEventListener("input", run)); run();
}
const WIDGETS = {
  fbeta(w){
    const F = (p, r, b) => (1 + b*b) * p * r / (b*b*p + r);
    w.innerHTML = `<div class="wh">β와 두 에이전트의 P·R을 바꿔 보기</div><div class="wd">β는 "recall을 precision보다 몇 배 중요하게 보나". 위 그림 2-1의 기본값에서 시작한다.</div>
      <div class="ctl">${slider("fb-b","β",-2,2,0.01,0,"beta")}</div>
      <div class="ctl"><div class="grp">에이전트 A (과묵형)</div>${slider("fb-pa","정밀도 P",0.05,1,0.01,0.9)}${slider("fb-ra","재현율 R",0.05,1,0.01,0.3)}
      <div class="grp">에이전트 B (수다형)</div>${slider("fb-pb","정밀도 P",0.05,1,0.01,0.5)}${slider("fb-rb","재현율 R",0.05,1,0.01,0.7)}</div>
      <div class="tiles"><div class="tile" id="fb-ta"><span>A의 Fβ</span><b></b><small></small></div><div class="tile" id="fb-tb"><span>B의 Fβ</span><b></b><small></small></div></div>
      <div class="msg" id="fb-msg"></div>`;
    wire(w, g => {
      const b = 2 ** g("fb-b"), fa = F(g("fb-pa"), g("fb-ra"), b), fb = F(g("fb-pb"), g("fb-rb"), b);
      const ta = w.querySelector("#fb-ta"), tb = w.querySelector("#fb-tb");
      ta.querySelector("b").textContent = fmt(fa); tb.querySelector("b").textContent = fmt(fb);
      ta.querySelector("small").textContent = `(1+β²)PR/(β²P+R), β=${b.toFixed(2)}`; tb.querySelector("small").textContent = ta.querySelector("small").textContent;
      ta.classList.toggle("win", fa > fb); tb.classList.toggle("win", fb > fa);
      w.querySelector("#fb-msg").textContent = Math.abs(fa - fb) < 0.0005 ? "두 에이전트가 같다." : `이 β에서는 ${fa > fb ? "A(과묵형)" : "B(수다형)"}가 이긴다. ${b < 1 ? "β<1: precision을 더 중시하는 설정" : b > 1 ? "β>1: recall을 더 중시하는 설정" : "β=1: 둘을 같게"}`;
    });
  },
  kappa(w){
    w.innerHTML = `<div class="wh">2×2 표를 바꿔 κ 계산해 보기</div><div class="wd">두 평가자가 같은 지적들을 "맞음/틀림"으로 판정했다고 하자. 파란 테두리 칸이 두 사람이 일치한 경우다.</div>
      <div class="btns"><button type="button" data-p="40,9,6,45">균형 (그림 왼쪽)</button><button type="button" data-p="80,10,5,5">쏠림 (그림 오른쪽)</button><button type="button" data-p="88,5,4,3">더 심한 쏠림</button></div>
      <div class="k2"><span></span><span>B: 맞음</span><span>B: 틀림</span>
        <span>A: 맞음</span><input id="kp-a" class="agree" type="number" min="0" value="40" aria-label="A 맞음, B 맞음"><input id="kp-b" type="number" min="0" value="9" aria-label="A 맞음, B 틀림">
        <span>A: 틀림</span><input id="kp-c" type="number" min="0" value="6" aria-label="A 틀림, B 맞음"><input id="kp-d" class="agree" type="number" min="0" value="45" aria-label="A 틀림, B 틀림"></div>
      <div class="tiles"><div class="tile"><span>관찰 일치 pₒ</span><b id="kp-po"></b><small>(a+d)/n</small></div><div class="tile"><span>우연 일치 pₑ</span><b id="kp-pe"></b><small>행·열 합으로 계산</small></div><div class="tile win"><span>Cohen's κ</span><b id="kp-k"></b><small>(pₒ−pₑ)/(1−pₑ)</small></div></div>
      <div class="msg" id="kp-msg"></div>`;
    const ids = ["kp-a","kp-b","kp-c","kp-d"];
    const calc = () => {
      const [a,b,c,d] = ids.map(i => Math.max(0, +w.querySelector("#"+i).value || 0)), n = a+b+c+d;
      const po = (a+d)/n, pe = ((a+b)/n)*((a+c)/n) + ((c+d)/n)*((b+d)/n), k = (po-pe)/(1-pe);
      w.querySelector("#kp-po").textContent = fmt(po, 2); w.querySelector("#kp-pe").textContent = fmt(pe, 2); w.querySelector("#kp-k").textContent = fmt(k, 2);
      w.querySelector("#kp-msg").textContent = `n=${n}. "맞음" 비율 A ${fmt((a+b)/n,2)} · B ${fmt((a+c)/n,2)} — 한쪽으로 쏠릴수록 우연 일치가 커져 κ가 낮아진다.`;
    };
    ids.forEach(i => w.querySelector("#"+i).addEventListener("input", calc));
    w.querySelectorAll("button[data-p]").forEach(btn => btn.addEventListener("click", () => { btn.dataset.p.split(",").forEach((v, i) => w.querySelector("#"+ids[i]).value = v); calc(); }));
    calc();
  },
  judge(w){
    w.innerHTML = `<div class="wh">채점관 점수 보정해 보기 (Rogan–Gladen)</div><div class="wd">채점관이 "맞음"이라고 한 비율과, 사람 라벨로 잰 채점관의 민감도·특이도를 넣으면 보정된 비율이 나온다.</div>
      <div class="ctl">${slider("jg-p","채점관이 '맞음'이라 한 비율 p̂",0,1,0.01,0.70)}${slider("jg-s","민감도 q₁ (진짜 맞음 → 맞음)",0.5,1,0.01,0.90)}${slider("jg-f","특이도 q₀ (진짜 틀림 → 틀림)",0.5,1,0.01,0.80)}</div>
      <div class="tiles"><div class="tile"><span>채점관 원시값</span><b id="jg-raw"></b><small>p̂</small></div><div class="tile win"><span>보정된 값</span><b id="jg-cor"></b><small>(p̂+q₀−1)/(q₀+q₁−1)</small></div><div class="tile"><span>차이</span><b id="jg-diff"></b><small>원시 − 보정</small></div></div>
      <div class="msg" id="jg-msg"></div>`;
    wire(w, g => {
      const p = g("jg-p"), q1 = g("jg-s"), q0 = g("jg-f"), den = q0 + q1 - 1, raw = (p + q0 - 1) / den, cor = Math.min(1, Math.max(0, raw));
      w.querySelector("#jg-raw").textContent = fmt(p, 2); w.querySelector("#jg-cor").textContent = fmt(cor, 2);
      w.querySelector("#jg-diff").textContent = (p - cor >= 0 ? "+" : "") + fmt(p - cor, 2);
      const m = w.querySelector("#jg-msg");
      m.className = "msg" + (den < 0.2 || raw < 0 || raw > 1 ? " warn" : "");
      m.textContent = den < 0.2 ? `주의: q₀+q₁−1 = ${fmt(den,2)}. 채점관이 무작위에 가까워 보정값이 매우 불안정하다.` :
        (raw < 0 || raw > 1) ? "주의: 계산값이 0~1 밖이라 잘랐다. 표본이 작거나 민감도·특이도 추정이 흔들린다는 신호다." :
        `특이도가 낮을수록(틀린 지적을 맞다고 하는 경향) 원시값이 부풀려진다. 민감도·특이도는 사람 라벨 소량으로 잰다.`;
    });
  }
};
function setPager(el, c){
  el.hidden = !c;
  if(!c) return;
  el.href = "#" + c.id;
  el.querySelector("span").textContent = `${c.id} · ${short(c.title)}`;
}
function goPaper(id, keepScroll){
  const p = PAPERS.find(x => x.id === id); cur = p.id;
  $("content").innerHTML = p.html;
  $("eyebrow").innerHTML = `<span class="num">논문 자세히 보기</span>${p.grade ? `<span class="chip">등급 ${esc(p.grade)}</span>` : ""}${p.pdf ? `<a class="chip pdf" href="${esc(p.pdf)}" target="_blank" rel="noopener">PDF 원문 ↗</a>` : ""}`;
  $("mtitle").textContent = p.title; $("mnum").textContent = "논문";
  document.title = `${p.title} · 리뷰 에이전트 평가 스터디`;
  decorate();
  if(p.cited.length){
    const box = document.createElement("p"); box.className = "citedin";
    box.innerHTML = "본문에서 나오는 곳" + p.cited.map(cid => { const c = CH.find(x => x.id === cid); return `<a href="#${cid}">${cid} · ${esc(short(c.title))}</a>`; }).join("");
    const meta = $("content").querySelector(".meta"); meta ? meta.after(box) : $("content").prepend(box);
  }
  renderToc();
  $("markdone").hidden = true; $("outh").textContent = "이 페이지에서";
  const back = CH.find(c => c.id === backTo);
  setPager($("prev"), back); setPager($("next"), null);
  if(back) $("prev").querySelector("small").textContent = "← 읽던 장으로";
  if(location.hash !== "#" + p.id) history.replaceState(null, "", "#" + p.id);
  store.set("study-last", p.id);
  closeMenu();
  if(!keepScroll) window.scrollTo(0, 0);
}
function go(id, keepScroll){
  hideTip(true);
  if(isPaper(id) && PAPERS.some(p => p.id === id)){
    if(cur && !isPaper(cur)) backTo = cur;
    return goPaper(id, keepScroll);
  }
  $("markdone").hidden = false; $("outh").textContent = "이 장에서";
  $("prev").querySelector("small").textContent = "← 이전 장";
  const i = Math.max(0, CH.findIndex(c => c.id === id));
  const c = CH[i]; cur = c.id;
  $("content").innerHTML = c.html;
  $("eyebrow").innerHTML = `<span class="num">CHAPTER ${c.id}</span><span>${i+1} / ${CH.length}</span>${c.level ? `<span class="chip">${esc(c.level)}</span>` : ""}`;
  $("mtitle").textContent = short(c.title); $("mnum").textContent = `${i+1}/${CH.length}`;
  document.title = `${short(c.title)} · 리뷰 에이전트 평가 스터디`;
  decorate(); renderToc(); syncMark();
  setPager($("prev"), CH[i-1]); setPager($("next"), CH[i+1]);
  if(location.hash !== "#" + c.id) history.replaceState(null, "", "#" + c.id);
  store.set("study-last", c.id);
  closeMenu();
  if(!keepScroll) window.scrollTo(0, 0);
}

/* 검색 */
$("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(), box = $("results");
  box.innerHTML = "";
  if(q.length < 2) return;
  let any = false;
  ALL.forEach(c => {
    const t = c.text.toLowerCase(); const idx = t.indexOf(q);
    if(idx < 0) return;
    any = true;
    let hits = 0; for(let j = idx; j >= 0 && hits < 99; j = t.indexOf(q, j+1)) hits++;
    const a = Math.max(0, idx-28), s = c.text.slice(a, idx+q.length+48);
    const k = idx - a;
    const b = document.createElement("button"); b.type = "button";
    b.innerHTML = `<b>${isPaper(c.id) ? "논문" : c.id} · ${esc(short(c.title))} · ${hits}건</b>…${esc(s.slice(0,k))}<mark>${esc(s.slice(k,k+q.length))}</mark>${esc(s.slice(k+q.length))}…`;
    b.onclick = () => { location.hash = c.id; };
    box.appendChild(b);
  });
  if(!any) box.innerHTML = '<div class="none">결과 없음</div>';
});

/* 테마 */
const thBtns = [...document.querySelectorAll(".theme button")];
function applyTheme(t){
  if(t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  thBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === (t || ""))));
}
thBtns.forEach(b => b.addEventListener("click", () => { applyTheme(b.dataset.t); store.set("study-theme", b.dataset.t); }));
applyTheme(store.get("study-theme") || "");

/* 모바일 메뉴 */
function closeMenu(){ $("side").classList.remove("open"); $("scrim").classList.remove("on"); $("menu").setAttribute("aria-expanded","false"); }
$("menu").onclick = () => { const o = !$("side").classList.contains("open"); $("side").classList.toggle("open", o); $("scrim").classList.toggle("on", o); $("menu").setAttribute("aria-expanded", String(o)); };
$("scrim").onclick = closeMenu;

$("markdone").onclick = () => setDone(cur, !done.has(cur));
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeMenu();
  if(/INPUT|TEXTAREA/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = CH.findIndex(c => c.id === cur);
  if(i < 0) return;
  if(e.key === "ArrowRight" && CH[i+1]) location.hash = CH[i+1].id;
  if(e.key === "ArrowLeft" && CH[i-1]) location.hash = CH[i-1].id;
  if(e.key === "/"){ e.preventDefault(); if(innerWidth <= 880) $("menu").click(); $("search").focus(); }
});
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if(ALL.some(c => c.id === id)) go(id); });
progress();
const first = location.hash.slice(1);
const last = store.get("study-last");
go(ALL.some(c => c.id === first) ? first : (ALL.some(c => c.id === last) ? last : CH[0].id), true);
</script>
