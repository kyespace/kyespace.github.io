<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰 에이전트 평가 스터디</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 왼쪽 장 목록 + 가운데 본문(40em) + 넓은 화면에서 오른쪽 "이 장에서" 개요. docs/html-디자인-가이드.md 기준 */
:root{
  color-scheme:light;
  --bg:#f6f7f9; --surface:#fff; --surface-2:#eef1f5; --line:#dde2e9;
  --fg:#151a22; --fg-2:#4b5464; --muted:#6f7887;
  --accent:#3150c8; --accent-soft:#e6ebfb;
  --ok:#11916a; --warn:#b7791f; --bad:#c53030;
  --warn-soft:#fbf3e4; --info-soft:#eef1f5; --ok-soft:#e5f4ee;
  --d1:#2f6fdb; --d2:#d9601c; --d3:#11916a;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --fs-xs:12px; --fs-sm:13.5px; --fs-md:15.5px; --fs-lg:18px; --fs-xl:24px; --fs-2xl:clamp(26px,3.6vw,34px);
  --r-ctl:8px; --r-panel:12px;
  --side-w:272px; --prose:40em;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1116; --surface:#161a21; --surface-2:#1e232c; --line:#2a303b;
    --fg:#e7eaf0; --fg-2:#a9b1be; --muted:#7d8696;
    --accent:#8aa2ff; --accent-soft:#1d2540;
    --ok:#3cc08f; --warn:#e0a84a; --bad:#f07070;
    --warn-soft:#2c2416; --info-soft:#1e232c; --ok-soft:#142a23;
    --d1:#5b93f0; --d2:#d6763a; --d3:#2fa378;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1116; --surface:#161a21; --surface-2:#1e232c; --line:#2a303b;
  --fg:#e7eaf0; --fg-2:#a9b1be; --muted:#7d8696;
  --accent:#8aa2ff; --accent-soft:#1d2540;
  --ok:#3cc08f; --warn:#e0a84a; --bad:#f07070;
  --warn-soft:#2c2416; --info-soft:#1e232c; --ok-soft:#142a23;
  --d1:#5b93f0; --d2:#d6763a; --d3:#2fa378;
}

*{box-sizing:border-box}
html{scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs-md)/1.75 var(--font);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
button{font:inherit;color:inherit}

/* ---------- shell ---------- */
.layout{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);padding:28px 16px 20px;display:flex;flex-direction:column;gap:16px;background:var(--bg)}
.brand{padding:0 8px}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font:500 var(--fs-xs) var(--mono);color:var(--muted);margin-top:2px}
.prog{padding:0 8px;display:flex;flex-direction:column;gap:6px}
.prog .row{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--fg-2)}
.prog .row b{font-family:var(--mono);font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.prog .bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:2px;transition:width .25s}
.search{position:relative;padding:0 2px}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--fg);font:var(--fs-sm) var(--font)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.results{display:flex;flex-direction:column;gap:2px}
.results:empty{display:none}
.results button{all:unset;cursor:pointer;display:block;padding:8px 10px;border-radius:var(--r-ctl);font-size:var(--fs-xs);color:var(--fg-2);line-height:1.55}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results b{display:block;color:var(--accent);font-weight:600}
.results mark{background:var(--warn-soft);color:var(--fg);border-radius:2px}
.results .none{font-size:var(--fs-xs);color:var(--muted);padding:4px 10px}
ol.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
ol.toc li{display:grid;grid-template-columns:1fr auto;align-items:center;border-radius:var(--r-ctl)}
ol.toc li:hover{background:var(--surface-2)}
ol.toc li.active{background:var(--accent-soft)}
ol.toc a{display:grid;grid-template-columns:26px 1fr;gap:4px;padding:7px 4px 7px 8px;text-decoration:none;color:var(--fg-2);min-width:0}
ol.toc .n{font:500 var(--fs-xs)/1.9 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
ol.toc .t{font-size:var(--fs-sm);line-height:1.45}
ol.toc .lv{display:block;font-size:11px;color:var(--muted);margin-top:1px}
ol.toc li.active a{color:var(--fg)}
ol.toc li.active .t{font-weight:600}
ol.toc li.active .n{color:var(--accent)}
ol.toc li.done .t{color:var(--muted)}
.chk{all:unset;cursor:pointer;width:18px;height:18px;margin-right:8px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center}
.chk:hover{border-color:var(--muted)}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chk svg{width:11px;height:11px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.chk[aria-pressed="true"] svg{opacity:1}
.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme{margin-top:auto;display:flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:var(--r-ctl)}
.theme button{flex:1;border:0;background:transparent;color:var(--fg-2);font-size:var(--fs-xs);font-weight:500;padding:5px 0;border-radius:6px;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.keys{font-size:11px;color:var(--muted);padding:0 8px}
.keys kbd{font:500 10px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg-2)}

main{min-width:0;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:48px;max-width:1080px;margin:0 auto;padding-inline:clamp(0px,3vw,40px)}
.outline{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding-top:56px;font-size:var(--fs-xs)}
.outline .h{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.outline ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
.outline a{display:block;padding:4px 0 4px 12px;margin-left:-1px;border-left:2px solid transparent;color:var(--fg-2);text-decoration:none;line-height:1.45}
.outline a:hover{color:var(--fg)}
.outline a[aria-current="true"]{color:var(--accent);border-left-color:var(--accent);font-weight:600}
@media (max-width:1180px){.wrap{grid-template-columns:minmax(0,1fr)}.outline{display:none}}

/* ---------- mobile bar + drawer ---------- */
.mbar{display:none}
.scrim{display:none}
@media (max-width:880px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);height:100%;z-index:30;transform:translateX(-102%);transition:transform .22s;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));box-shadow:none}
  .side.open{transform:none;box-shadow:0 0 40px rgb(0 0 0 / .25)}
  .scrim{position:fixed;inset:0;z-index:25;background:rgb(0 0 0 / .35)}
  .scrim.on{display:block}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .mbar button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);padding:5px 10px;font-size:var(--fs-xs);font-weight:500;cursor:pointer;white-space:nowrap}
  .mbar span{flex:1;min-width:0;font-size:var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar small{font:500 var(--fs-xs) var(--mono);color:var(--muted)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
  .keys{display:none}
}

/* ---------- chapter head ---------- */
.chead{padding:56px 0 8px;display:flex;flex-direction:column;gap:10px;max-width:var(--prose)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 var(--fs-xs) var(--mono);letter-spacing:.04em;color:var(--muted)}
.eyebrow .num{color:var(--accent)}
.chip{font:500 11px var(--font);padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);letter-spacing:0}
a.chip.pdf{color:var(--accent);text-decoration:none;border:1px solid currentColor;background:transparent}
a.chip.pdf:hover{background:var(--surface-2)}
a.chip.pdf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- article ---------- */
article{min-width:0}
article>*,article section>*{max-width:var(--prose)}
article>.tbl,article section>.tbl,article>pre,article>figure,article>.widget{max-width:100%}
article section{max-width:none}
article>*:first-child{margin-top:0}
article h1{font-size:var(--fs-2xl);line-height:1.3;letter-spacing:-.02em;text-wrap:balance;margin:0 0 20px;font-weight:700}
article h2{font-size:var(--fs-xl);line-height:1.35;letter-spacing:-.02em;text-wrap:balance;margin:56px 0 14px;font-weight:700}
article h3{font-size:var(--fs-lg);line-height:1.4;letter-spacing:-.01em;margin:36px 0 10px;font-weight:600}
article h4{font-size:var(--fs-md);margin:28px 0 8px;font-weight:600}
article p{margin:0 0 14px}
article ul,article ol{margin:0 0 16px;padding-left:1.3em}
article li{margin:4px 0}
article li>ul,article li>ol{margin:4px 0 6px}
article li::marker{color:var(--muted)}
article strong{font-weight:600;color:var(--fg)}
article hr{border:0;border-top:1px solid var(--line);margin:40px 0}
article code{font:.88em var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}
article pre{font:var(--fs-xs)/1.7 var(--mono);background:var(--surface-2);padding:14px 16px;border-radius:var(--r-ctl);overflow-x:auto;margin:0 0 16px;word-break:normal}
article pre code{background:none;padding:0;font-size:inherit}
article a{overflow-wrap:anywhere}
article blockquote{margin:0 0 18px;padding:12px 16px;background:var(--info-soft);border-radius:var(--r-ctl);color:var(--fg-2);font-size:var(--fs-sm)}
article blockquote p:last-child{margin-bottom:0}
article blockquote strong{color:var(--fg)}
.tbl{overflow-x:auto;margin:4px 0 20px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);width:100%}
article table{border-collapse:collapse;font-size:var(--fs-sm);line-height:1.6;width:100%}
article th,article td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;min-width:6.5em}
article td:first-child{min-width:5em}
article tr:last-child td{border-bottom:0}
article thead th{background:var(--surface-2);font-weight:600;white-space:nowrap;font-size:var(--fs-xs);color:var(--fg)}
article td{font-variant-numeric:tabular-nums}

/* 특수 절 */
article section.box{border-radius:var(--r-panel);padding:4px 22px 8px;margin:48px 0 0}
article section.box>h2{margin:18px 0 10px;font-size:var(--fs-lg);display:flex;align-items:center;gap:10px}
article section.box>h2::before{font:600 10.5px var(--mono);letter-spacing:.06em;padding:3px 8px;border-radius:4px;background:var(--surface);flex:none}
article section.ask{background:var(--accent-soft)}
article section.ask>h2::before{content:"GOAL";color:var(--accent)}
article section.judge{background:var(--ok-soft)}
article section.judge>h2::before{content:"THINK";color:var(--ok)}
article section.judge ol,article section.judge ul{padding-left:1.4em}
article section.judge li{margin:8px 0}
article section.ask+*{margin-top:40px}
article section.box hr{display:none}
article ul.meta{list-style:none;padding:0;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:2px 20px;font-size:var(--fs-xs);color:var(--muted)}
article ul.meta li{margin:0}
article ul.meta strong{font-weight:500;color:var(--fg-2)}
article section.sources{margin-top:56px;padding-top:4px;border-top:1px solid var(--line);font-size:var(--fs-sm);color:var(--fg-2)}
article section.sources>h2{font-size:var(--fs-sm);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
article section.sources li{margin:6px 0}
article section.sources a{word-break:break-all}

/* ---------- 참조 툴팁: 본문의 문헌 표기(예: Khoshnoud 외 2022)에 마우스를 올리거나 탭하면 설명 ---------- */
.cite{text-decoration:underline dotted var(--muted);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help;border-radius:3px}
.cite:hover,.cite[aria-expanded="true"]{text-decoration-color:var(--accent);background:var(--accent-soft)}
.reftip{position:fixed;z-index:50;width:min(380px,calc(100vw - 32px));padding:14px 16px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:0 8px 24px rgb(0 0 0 / .14);font-size:var(--fs-sm);line-height:1.6}
.reftip[hidden]{display:none}
.reftip .t{font-weight:600;line-height:1.45;margin-bottom:4px}
.reftip .v{font-size:var(--fs-xs);color:var(--muted);margin-bottom:8px}
.reftip .s{color:var(--fg-2);margin:0 0 10px}
.reftip .f{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--fs-xs)}
.reftip .f .acts{margin-left:auto;display:flex;align-items:center;gap:12px}
.reftip .f a{font-weight:500}
.reftip .f a.more{padding:3px 10px;border-radius:var(--r-ctl);background:var(--accent-soft);text-decoration:none}
.reftip .f a.more:hover{text-decoration:underline}
.navh{font:600 11px var(--mono);letter-spacing:.06em;color:var(--muted);padding:0 8px;margin-top:4px}
ol.toc.papers li{grid-template-columns:1fr}
.citedin{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--fg-2);margin:-4px 0 24px}
.citedin a{padding:2px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font-size:var(--fs-xs)}
.citedin a:hover{border-color:var(--accent)}

/* ---------- chapter end ---------- */
.cend{max-width:var(--prose);margin-top:56px;display:flex;flex-direction:column;gap:16px}
.markdone{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:var(--fs-sm);font-weight:500;cursor:pointer;color:var(--fg-2)}
.markdone:hover{border-color:var(--muted);color:var(--fg)}
.markdone[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.markdone svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.5;fill:none}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);text-decoration:none;color:var(--fg);min-width:0}
.pager a:hover{border-color:var(--accent)}
.pager a small{font:500 var(--fs-xs) var(--mono);color:var(--muted)}
.pager a span{font-size:var(--fs-sm);font-weight:600;line-height:1.45}
.pager a.next{text-align:right;grid-column:2}
.pager a[hidden]{display:none}
.markdone[hidden],.navh[hidden]{display:none}
@media (max-width:560px){.pager{grid-template-columns:1fr}.pager a.next{grid-column:1}}

/* ---------- 그림: make_figures.py가 만든 SVG를 인라인으로 넣고 페이지 토큰으로 칠한다 ---------- */
article figure.figure{margin:12px 0 32px;display:flex;flex-direction:column;gap:8px}
.figbox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface)}
.fig.inline{display:block;width:100%;height:auto;font-family:var(--font)}
.fig.inline .t-val{font-family:var(--mono)}
.fig.inline .bg{fill:transparent}
article figcaption{font-size:var(--fs-xs);color:var(--muted);line-height:1.6;max-width:var(--prose)}
.fig text{fill:var(--fg);font-size:13px}
.fig .t-h{font-size:14.5px;font-weight:700}
.fig .t-sm{font-size:12px;fill:var(--fg-2)}
.fig .t-mut{font-size:11.5px;fill:var(--muted)}
.fig .t-val{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.fig .t-b{font-weight:600}
.fig .t-acc{fill:var(--accent);font-weight:700}
.fig .f-d1{fill:var(--d1)} .fig .f-d2{fill:var(--d2)} .fig .f-d3{fill:var(--d3)}
.fig .s-d1{stroke:var(--d1);fill:none;stroke-width:2.5} .fig .s-d2{stroke:var(--d2);fill:none;stroke-width:2.5} .fig .s-d3{stroke:var(--d3);fill:none;stroke-width:2.5}
.fig .ring{stroke:var(--surface);stroke-width:2}
.fig .f-s2{fill:var(--surface-2)} .fig .f-sf{fill:var(--surface)} .fig .f-warn{fill:var(--warn-soft)} .fig .f-acc{fill:var(--accent-soft)}
.fig .grid{stroke:var(--line);stroke-width:1}
.fig .axis{stroke:var(--muted);stroke-width:1}
.fig .ref{stroke:var(--muted);stroke-width:1.3;stroke-dasharray:4 3;fill:none}
.fig .node{fill:var(--surface);stroke:var(--line);stroke-width:1.3}
.fig .node-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.3}
.fig .node-warn{fill:var(--warn-soft);stroke:var(--line);stroke-width:1}
.fig .arrow{stroke:var(--muted);stroke-width:1.5;fill:none}
.fig .ahead{fill:var(--muted)}
.fig .hit{fill:transparent}
.fig g.tip:hover .hl{opacity:.75}

/* ---------- 직접 해 보기 위젯 ---------- */
.widget{margin:4px 0 32px;padding:18px 20px 20px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);display:flex;flex-direction:column;gap:14px}
.widget .wh{display:flex;align-items:center;gap:10px;font-weight:600;font-size:var(--fs-sm)}
.widget .wh::before{content:"TRY";font:600 10.5px var(--mono);letter-spacing:.06em;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.widget .wd{font-size:var(--fs-xs);color:var(--fg-2);margin-top:-6px}
.widget .ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 24px}
.widget .sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:var(--fs-sm)}
.widget .sl output{font:600 var(--fs-sm) var(--mono);font-variant-numeric:tabular-nums}
.widget .sl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.widget .grp{font:600 var(--fs-xs) var(--mono);color:var(--muted);letter-spacing:.04em;grid-column:1/-1;margin-top:4px}
.widget .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.widget .tile{background:var(--surface-2);border-radius:var(--r-ctl);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.widget .tile span{font-size:var(--fs-xs);color:var(--fg-2)}
.widget .tile b{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.widget .tile small{font:var(--fs-xs) var(--mono);color:var(--muted)}
.widget .tile.win{background:var(--accent-soft)}
.widget .tile.win b{color:var(--accent)}

<script>
const CH = [{"id": "00", "dir": "00-읽는-법", "title": "00. 이 자료를 읽는 법", "level": "안내", "html": "<h1>00. 이 자료를 읽는 법<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-19<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-25<\/li>\n<li><strong>상태<\/strong>: 개인 스터디<\/li>\n<li><strong>독자<\/strong>: 본인. PR 리뷰 에이전트를 만들고 평가 체계를 설계할 사람<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/INDEX.md\"><code>.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/<\/code><\/a><\/li>\n<\/ul>\n<h2>이 자료의 목적<\/h2>\n<p>PR 리뷰 에이전트를 만들고 그 에이전트를 평가하는 체계를 설계할 때, <strong>판단은 직접 내릴 수 있도록<\/strong> 필요한 지식을 기초부터 최신 연구, 대기업 사례까지 모았다.<\/p>\n<ul>\n<li>이 자료는 \"어떻게 만들어라\"를 말하지 않는다. 각 장 끝의 <strong>「스스로 판단할 질문」<\/strong>에도 답을 적지 않았다.<\/li>\n<li>같은 주제를 두고 연구 결과가 엇갈리면, 한쪽을 고르지 않고 <strong>엇갈린다는 사실과 왜 엇갈리는지<\/strong>를 적었다.<\/li>\n<li>같은 폴더의 <a href=\"PR-리뷰-에이전트-채점-가이드.md\">채점 가이드<\/a>는 2026-11-18에 먼저 쓴 노트다. 그 노트 11장(우리 팀 적용안)에는 판단이 들어 있다. 이 스터디 자료와는 성격이 다르다.<\/li>\n<\/ul>\n<h2>읽는 순서<\/h2>\n<table>\n<thead>\n<tr>\n<th>장<\/th>\n<th>다루는 것<\/th>\n<th>수준<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"#01\">01 코드 리뷰란 무엇인가<\/a><\/td>\n<td>사람의 리뷰는 실제로 무엇을 찾나 · \"유용한 코멘트\"의 정의<\/td>\n<td>기초<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#02\">02 평가 지표와 통계 기초<\/a><\/td>\n<td>precision·recall·Fβ · 일치도(kappa, α) · 데이터 분할·오염 · 유의성<\/td>\n<td>기초<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#03\">03 LLM 채점관<\/a><\/td>\n<td>LLM이 채점할 때의 편향·검증법·보정 통계<\/td>\n<td>기초→심화<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#04\">04 자동 코드 리뷰 연구사<\/a><\/td>\n<td>2018~2024 연구 흐름 · 데이터셋 품질 문제 · BLEU의 한계<\/td>\n<td>중급<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#05\">05 최신 벤치마크 논문<\/a><\/td>\n<td>2025~2026 리뷰 에이전트 벤치마크 비교<\/td>\n<td>심화<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#06\">06 빅테크 실제 방식<\/a><\/td>\n<td>Google·Meta·Microsoft·GitHub·Atlassian·Uber·ByteDance 등<\/td>\n<td>사례<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#07\">07 빅테크·대기업 자세히 보기 — 자동 머지<\/a><\/td>\n<td>xAI·Meta·Spotify·Google·Anthropic(Claude Code 팀)·Rewind가 사람 리뷰 없이 머지·승인하는 조건을 단계별로 · 비교용 Stripe·Rootly (2026-11-25 추가)<\/td>\n<td>사례 심화<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#08\">08 실사용 지표와 사람 요인<\/a><\/td>\n<td>정적분석 도구의 교훈 · \"해결률\" 정의 비교 · 신뢰·소음<\/td>\n<td>사례→심화<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#09\">09 에이전트 설계 선택지<\/a><\/td>\n<td>컨텍스트·다중 에이전트·필터·파인튜닝: 측정된 효과<\/td>\n<td>심화<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#10\">10 반론과 한계<\/a><\/td>\n<td>위 장들의 합의에 대한 가장 강한 반론<\/td>\n<td>균형<\/td>\n<\/tr>\n<tr>\n<td><a href=\"#11\">11 출처 목록<\/a><\/td>\n<td>모든 출처, 등급, 선정 근거<\/td>\n<td>참고<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:620px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 300\" role=\"img\" aria-label=\"스터디 학습 지도\" data-minw=\"620\"><title>스터디 학습 지도<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"760\" height=\"300\" rx=\"12\"/><text x=\"20.0\" y=\"30.0\" class=\"t-h\">이 스터디의 길 — 왼쪽에서 오른쪽으로<\/text><text x=\"20.0\" y=\"48.0\" class=\"t-mut\">칸 안 번호가 장 번호. 기초를 알면 나머지 장의 숫자를 스스로 의심할 수 있다<\/text><rect x=\"20\" y=\"66\" width=\"160\" height=\"214\" rx=\"12\" class=\"f-s2\"/><text x=\"34.0\" y=\"90.0\" class=\"t-b\">기초<\/text><rect x=\"30\" y=\"104\" width=\"140\" height=\"44\" rx=\"8\" class=\"node\"/><text x=\"42.0\" y=\"131.0\" class=\"t-acc\">01<\/text><text x=\"64.0\" y=\"131.0\" class=\"t-sm\">사람 리뷰는 무엇을 하나<\/text><rect x=\"30\" y=\"160\" width=\"140\" height=\"44\" rx=\"8\" class=\"node\"/><text x=\"42.0\" y=\"187.0\" class=\"t-acc\">02<\/text><text x=\"64.0\" y=\"187.0\" class=\"t-sm\">지표와 통계<\/text><rect x=\"30\" y=\"216\" width=\"140\" height=\"44\" rx=\"8\" class=\"node\"/><text x=\"42.0\" y=\"243.0\" class=\"t-acc\">03<\/text><text x=\"64.0\" y=\"243.0\" class=\"t-sm\">LLM 채점관<\/text><line class=\"arrow\" x1=\"183.0\" y1=\"173.0\" x2=\"200.0\" y2=\"173.0\"/><path class=\"ahead\" d=\"M207.0,173.0L200.0,169.5L200.0,176.5z\"/><rect x=\"210\" y=\"66\" width=\"160\" height=\"214\" rx=\"12\" class=\"f-s2\"/><text x=\"224.0\" y=\"90.0\" class=\"t-b\">연구 흐름<\/text><rect x=\"220\" y=\"104\" width=\"140\" height=\"44\" rx=\"8\" class=\"node\"/><text x=\"232.0\" y=\"131.0\" class=\"t-acc\">04<\/text><text x=\"254.0\" y=\"131.0\" class=\"t-sm\">자동 리뷰 연구사<\/text><rect x=\"220\" y=\"160\" width=\"140\" height=\"44\" rx=\"8\" class=\"node\"/><text x=\"232.0\" y=\"187.0\" class=\"t-acc\">05<\/text><text x=\"254.0\" y=\"187.0\" class=\"t-sm\">최신 벤치마크<\/text><line class=\"arrow\" x1=\"373.0\" y1=\"173.0\" x2=\"390.0\" y2=\"173.0\"/><path class=\"ahead\" d=\"M397.0,173.0L390.0,169.5L390.0,176.5z\"/><rect x=\"400\" y=\"66\" width=\"160\" height=\"214\" rx=\"12\" class=\"f-s2\"/><text x=\"414.0\" y=\"90.0\" class=\"t-b\">현장<\/text><rect x=\"410\" y=\"104\" width=\"140\" height=\"44\" rx=\"8\" class=\"node\"/><text x=\"422.0\" y=\"131.0\" class=\"t-acc\">06<\/text><text x=\"444.0\" y=\"131.0\" class=\"t-sm\">빅테크 실제 방식<\/text><rect x=\"410\" y=\"160\" width=\"140\" height=\"44\" rx=\"8\" class=\"node\"/><text x=\"422.0\" y=\"187.0\" class=\"t-acc\">07<\/text><text x=\"444.0\" y=\"187.0\" class=\"t-sm\">실사용 지표·사람<\/text><rect x=\"410\" y=\"216\" width=\"140\" height=\"44\" rx=\"8\" class=\"node\"/><text x=\"422.0\" y=\"243.0\" class=\"t-acc\">08<\/text><text x=\"444.0\" y=\"243.0\" class=\"t-sm\">설계 선택지<\/text><line class=\"arrow\" x1=\"563.0\" y1=\"173.0\" x2=\"580.0\" y2=\"173.0\"/><path class=\"ahead\" d=\"M587.0,173.0L580.0,169.5L580.0,176.5z\"/><rect x=\"590\" y=\"66\" width=\"160\" height=\"214\" rx=\"12\" class=\"f-s2\"/><text x=\"604.0\" y=\"90.0\" class=\"t-b\">균형·참고<\/text><rect x=\"600\" y=\"104\" width=\"140\" height=\"44\" rx=\"8\" class=\"node-acc\"/><text x=\"612.0\" y=\"131.0\" class=\"t-acc\">09<\/text><text x=\"634.0\" y=\"131.0\" class=\"t-sm\">반론과 한계<\/text><rect x=\"600\" y=\"160\" width=\"140\" height=\"44\" rx=\"8\" class=\"node\"/><text x=\"612.0\" y=\"187.0\" class=\"t-acc\">10<\/text><text x=\"634.0\" y=\"187.0\" class=\"t-sm\">출처 목록<\/text><\/svg><\/div><figcaption>그림 0. 학습 지도 — 기초를 먼저 보면 나머지 장의 숫자를 스스로 의심할 수 있다<\/figcaption><\/figure>\n<h2>출처 등급 — 숫자를 얼마나 믿을지<\/h2>\n<p>모든 출처에 아래 등급을 붙였다. 등급은 <strong>출처의 종류<\/strong>를 말할 뿐 내용이 맞다는 보증은 아니다.<\/p>\n<table>\n<thead>\n<tr>\n<th>등급<\/th>\n<th>종류<\/th>\n<th>읽는 법<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td>동료 심사를 거친 논문(ICSE·FSE·NeurIPS 등), 표준 문서<\/td>\n<td>방법이 공개되어 있고 심사를 받았다<\/td>\n<\/tr>\n<tr>\n<td><strong>B<\/strong><\/td>\n<td>회사 공식 기술 블로그·문서·공식 저장소<\/td>\n<td>1차 자료다. 다만 <strong>자기 제품에 대한 자기 보고<\/strong>인 경우가 많다<\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td>이름이 알려진 전문가의 분석<\/td>\n<td>경험 기반. 측정이 아닐 수 있다<\/td>\n<\/tr>\n<tr>\n<td><strong>D<\/strong><\/td>\n<td>동료 심사 전 논문(arXiv 프리프린트), 벤더 마케팅·벤더가 만든 벤치마크<\/td>\n<td>방향을 보는 데 쓰고, 숫자 하나에 기대지 않는다<\/td>\n<\/tr>\n<tr>\n<td><strong>E<\/strong><\/td>\n<td>포럼·SNS·출처 없는 요약<\/td>\n<td>단서로만 쓴다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>표시 규칙: 회사가 자기 제품에 대해 낸 숫자에는 <strong>(자기 보고)<\/strong>를 붙였다.<\/p>\n<\/blockquote>\n<h2>출처를 고른 기준 (선정 근거)<\/h2>\n<p>각 장의 문헌 카드에 <strong>「선정 근거」<\/strong> 줄을 두었다. 근거는 아래 중 하나 이상이다.<\/p>\n<ol>\n<li><strong>영향력<\/strong>: 인용 수가 많다. 인용 수는 Semantic Scholar(S2) 또는 OpenAlex(OA)에서 2026-11-19에 조회했다. 두 DB 값은 10~20% 차이가 난다.<\/li>\n<li><strong>원조·정의<\/strong>: 그 개념을 처음 정의했거나 표준으로 쓰이는 원전이다. 예: van Rijsbergen의 F 척도, Cohen의 kappa<\/li>\n<li><strong>학회 인정<\/strong>: 주요 학회(ICSE, FSE, NeurIPS, ICLR, ACL 등) 게재. 수상이 있으면 적었다<\/li>\n<li><strong>1차 사례<\/strong>: 그 회사가 직접 쓴 논문·블로그. 대기업 사례 장에서 쓴다<\/li>\n<li><strong>최신성<\/strong>: 2025~2026년 연구 가운데 리뷰 에이전트 평가를 직접 다룬 것. 인용이 쌓이기 전이라 영향력 기준을 적용할 수 없다<\/li>\n<li><strong>반론<\/strong>: 다수 의견을 반박하거나 한계를 보여 준다(10장)<\/li>\n<\/ol>\n<h2>확인 범위 (어디까지 직접 확인했나)<\/h2>\n<ul>\n<li>거의 모든 수치는 <strong>원문(논문 PDF·arXiv HTML·공식 페이지)을 직접 열어<\/strong> 확인했다. 원문 대신 초록이나 2차 요약만 본 곳은 카드에 <strong>「초록만 확인」「2차 출처」<\/strong>로 표시했다.<\/li>\n<li>조사는 2026-11-19 하루에 이뤄졌다. 리더보드나 제품 수치는 계속 바뀐다.<\/li>\n<li>계산으로 확인할 수 있는 수치(kappa 역설, Fβ 순위 역전, 기존 가이드의 계산 예시)는 코드를 돌려 재계산했다 → <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/verify-kappa-paradox.md\">verify-kappa-paradox.md<\/a>, <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/verify-fbeta-and-grounded-example.md\">verify-fbeta-and-grounded-example.md<\/a><\/li>\n<li>원문을 끝내 못 연 출처와 확인하지 못한 수치는 <a href=\"#11\">11 출처 목록<\/a>의 「확인 못 한 것」에 모았다.<\/li>\n<\/ul>\n<h2>용어 빠른 참조<\/h2>\n<table>\n<thead>\n<tr>\n<th>용어<\/th>\n<th>쉬운 말<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>PR / diff<\/td>\n<td>코드 변경 요청 / 바뀐 줄들<\/td>\n<\/tr>\n<tr>\n<td>finding, 지적<\/td>\n<td>리뷰어(사람 또는 에이전트)가 남긴 문제 제기 하나<\/td>\n<\/tr>\n<tr>\n<td>golden set, 정답지<\/td>\n<td>\"이 PR에는 이런 문제가 있다\"를 미리 적어 둔 목록<\/td>\n<\/tr>\n<tr>\n<td>precision(정밀도)<\/td>\n<td>남긴 지적 중 맞는 비율. 낮으면 <strong>소음<\/strong>이 많다<\/td>\n<\/tr>\n<tr>\n<td>recall(재현율)<\/td>\n<td>실제 문제 중 찾아낸 비율. 낮으면 <strong>놓친 것<\/strong>이 많다<\/td>\n<\/tr>\n<tr>\n<td>LLM-as-a-judge<\/td>\n<td>채점을 LLM에 맡기는 것. 이 자료에서는 \"LLM 채점관\"<\/td>\n<\/tr>\n<tr>\n<td>matcher<\/td>\n<td>에이전트 지적과 정답이 같은 문제를 말하는지 판정하는 장치<\/td>\n<\/tr>\n<tr>\n<td>오프라인 평가<\/td>\n<td>미리 만든 데이터로 돌려 보는 시험<\/td>\n<\/tr>\n<tr>\n<td>온라인 평가<\/td>\n<td>실제 사용 중에 개발자 반응을 재는 것<\/td>\n<\/tr>\n<tr>\n<td>addressed / resolved rate<\/td>\n<td>코멘트가 실제 코드 수정으로 이어진 비율. <strong>정의가 연구마다 다르다<\/strong>(08장)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "text": " 00. 이 자료를 읽는 법 생성일 : 2026-11-19 최종 수정일 : 2026-11-25 상태 : 개인 스터디 독자 : 본인. PR 리뷰 에이전트를 만들고 평가 체계를 설계할 사람 근거 원장 : .superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/ 이 자료의 목적 PR 리뷰 에이전트를 만들고 그 에이전트를 평가하는 체계를 설계할 때, 판단은 직접 내릴 수 있도록 필요한 지식을 기초부터 최신 연구, 대기업 사례까지 모았다. 이 자료는 \"어떻게 만들어라\"를 말하지 않는다. 각 장 끝의 「스스로 판단할 질문」 에도 답을 적지 않았다. 같은 주제를 두고 연구 결과가 엇갈리면, 한쪽을 고르지 않고 엇갈린다는 사실과 왜 엇갈리는지 를 적었다. 같은 폴더의 채점 가이드 는 2026-11-18에 먼저 쓴 노트다. 그 노트 11장(우리 팀 적용안)에는 판단이 들어 있다. 이 스터디 자료와는 성격이 다르다. 읽는 순서 장 다루는 것 수준 01 코드 리뷰란 무엇인가 사람의 리뷰는 실제로 무엇을 찾나 · \"유용한 코멘트\"의 정의 기초 02 평가 지표와 통계 기초 precision·recall·Fβ · 일치도(kappa, α) · 데이터 분할·오염 · 유의성 기초 03 LLM 채점관 LLM이 채점할 때의 편향·검증법·보정 통계 기초→심화 04 자동 코드 리뷰 연구사 2018~2024 연구 흐름 · 데이터셋 품질 문제 · BLEU의 한계 중급 05 최신 벤치마크 논문 2025~2026 리뷰 에이전트 벤치마크 비교 심화 06 빅테크 실제 방식 Google·Meta·Microsoft·GitHub·Atlassian·Uber·ByteDance 등 사례 07 빅테크·대기업 자세히 보기 — 자동 머지 xAI·Meta·Spotify·Google·Anthropic(Claude Code 팀)·Rewind가 사람 리뷰 없이 머지·승인하는 조건을 단계별로 · 비교용 Stripe·Rootly (2026-11-25 추가) 사례 심화 08 실사용 지표와 사람 요인 정적분석 도구의 교훈 · \"해결률\" 정의 비교 · 신뢰·소음 사례→심화 09 에이전트 설계 선택지 컨텍스트·다중 에이전트·필터·파인튜닝: 측정된 효과 심화 10 반론과 한계 위 장들의 합의에 대한 가장 강한 반론 균형 11 출처 목록 모든 출처, 등급, 선정 근거 참고 그림 0. 학습 지도 — 기초를 먼저 보면 나머지 장의 숫자를 스스로 의심할 수 있다 출처 등급 — 숫자를 얼마나 믿을지 모든 출처에 아래 등급을 붙였다. 등급은 출처의 종류 를 말할 뿐 내용이 맞다는 보증은 아니다. 등급 종류 읽는 법 A 동료 심사를 거친 논문(ICSE·FSE·NeurIPS 등), 표준 문서 방법이 공개되어 있고 심사를 받았다 B 회사 공식 기술 블로그·문서·공식 저장소 1차 자료다. 다만 자기 제품에 대한 자기 보고 인 경우가 많다 C 이름이 알려진 전문가의 분석 경험 기반. 측정이 아닐 수 있다 D 동료 심사 전 논문(arXiv 프리프린트), 벤더 마케팅·벤더가 만든 벤치마크 방향을 보는 데 쓰고, 숫자 하나에 기대지 않는다 E 포럼·SNS·출처 없는 요약 단서로만 쓴다 표시 규칙: 회사가 자기 제품에 대해 낸 숫자에는 (자기 보고) 를 붙였다. 출처를 고른 기준 (선정 근거) 각 장의 문헌 카드에 「선정 근거」 줄을 두었다. 근거는 아래 중 하나 이상이다. 영향력 : 인용 수가 많다. 인용 수는 Semantic Scholar(S2) 또는 OpenAlex(OA)에서 2026-11-19에 조회했다. 두 DB 값은 10~20% 차이가 난다. 원조·정의 : 그 개념을 처음 정의했거나 표준으로 쓰이는 원전이다. 예: van Rijsbergen의 F 척도, Cohen의 kappa 학회 인정 : 주요 학회(ICSE, FSE, NeurIPS, ICLR, ACL 등) 게재. 수상이 있으면 적었다 1차 사례 : 그 회사가 직접 쓴 논문·블로그. 대기업 사례 장에서 쓴다 최신성 : 2025~2026년 연구 가운데 리뷰 에이전트 평가를 직접 다룬 것. 인용이 쌓이기 전이라 영향력 기준을 적용할 수 없다 반론 : 다수 의견을 반박하거나 한계를 보여 준다(10장) 확인 범위 (어디까지 직접 확인했나) 거의 모든 수치는 원문(논문 PDF·arXiv HTML·공식 페이지)을 직접 열어 확인했다. 원문 대신 초록이나 2차 요약만 본 곳은 카드에 「초록만 확인」「2차 출처」 로 표시했다. 조사는 2026-11-19 하루에 이뤄졌다. 리더보드나 제품 수치는 계속 바뀐다. 계산으로 확인할 수 있는 수치(kappa 역설, Fβ 순위 역전, 기존 가이드의 계산 예시)는 코드를 돌려 재계산했다 → verify-kappa-paradox.md , verify-fbeta-and-grounded-example.md 원문을 끝내 못 연 출처와 확인하지 못한 수치는 11 출처 목록 의 「확인 못 한 것」에 모았다. 용어 빠른 참조 용어 쉬운 말 PR / diff 코드 변경 요청 / 바뀐 줄들 finding, 지적 리뷰어(사람 또는 에이전트)가 남긴 문제 제기 하나 golden set, 정답지 \"이 PR에는 이런 문제가 있다\"를 미리 적어 둔 목록 precision(정밀도) 남긴 지적 중 맞는 비율. 낮으면 소음 이 많다 recall(재현율) 실제 문제 중 찾아낸 비율. 낮으면 놓친 것 이 많다 LLM-as-a-judge 채점을 LLM에 맡기는 것. 이 자료에서는 \"LLM 채점관\" matcher 에이전트 지적과 정답이 같은 문제를 말하는지 판정하는 장치 오프라인 평가 미리 만든 데이터로 돌려 보는 시험 온라인 평가 실제 사용 중에 개발자 반응을 재는 것 addressed / resolved rate 코멘트가 실제 코드 수정으로 이어진 비율. 정의가 연구마다 다르다 (08장) "}, {"id": "01", "dir": "01-코드리뷰란-무엇인가", "title": "01. 코드 리뷰란 무엇인가 — 사람의 리뷰는 실제로 무엇을 하나", "level": "기초", "html": "<h1>01. 코드 리뷰란 무엇인가 — 사람의 리뷰는 실제로 무엇을 하나<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-19<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-20<\/li>\n<li><strong>수준<\/strong>: 기초<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A1-code-review-foundations.md\">wave-1 A1<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-2-web-W2a-usefulness-missed-defects.md\">wave-2 W2a<\/a><\/li>\n<\/ul>\n<h2>이 장에서 답하는 질문<\/h2>\n<p>리뷰 에이전트를 평가하려면 먼저 \"좋은 리뷰가 무엇인가\"를 정해야 한다. 그 기준은 대개 <strong>사람의 리뷰<\/strong>에서 빌려 온다. 그런데 사람의 리뷰는 실제로 무엇을 하고, 무엇을 놓치고, 어떤 코멘트가 \"유용\"하다고 정의되어 왔을까?<\/p>\n<h2>핵심 내용 (쉬운 말로)<\/h2>\n<h3>1. 사람의 리뷰 코멘트 가운데 버그 지적은 소수다<\/h3>\n<p>여러 연구가 서로 다른 회사·오픈소스 데이터에서 비슷한 결과를 냈다.<\/p>\n<table>\n<thead>\n<tr>\n<th>연구<\/th>\n<th>데이터<\/th>\n<th>결함(버그) 관련 비율<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bacchelli &amp; Bird 2013 (Microsoft)<\/td>\n<td>코멘트 570개<\/td>\n<td><strong>14%<\/strong> (78개). 가장 많은 것은 \"코드 개선\" 29%<\/td>\n<\/tr>\n<tr>\n<td>Czerwonka 외 2015 (Microsoft)<\/td>\n<td>— (2쪽짜리 발표 초록)<\/td>\n<td><strong>약 15%<\/strong>. 유지보수성 지적이 50% 이상<\/td>\n<\/tr>\n<tr>\n<td>Beller 외 2014 (오픈소스 2개)<\/td>\n<td>변경 1,400여 건<\/td>\n<td>유지보수성:기능 = <strong>약 75:25<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Mäntylä &amp; Lassenius 2009<\/td>\n<td>결함 388+371개<\/td>\n<td>결함의 <strong>75%<\/strong>가 겉으로 보이는 기능에 영향 없음 (초록만 확인)<\/td>\n<\/tr>\n<tr>\n<td>Porter 외 1997 (검사 실험 88회)<\/td>\n<td>회의 기록 이슈<\/td>\n<td>진짜 결함 <strong>18%<\/strong>, 스타일·유지보수 60%, 오탐 22%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>예시로 보면<\/strong>: 사람 리뷰 코멘트 100개를 모아 정답지를 만들면, 그중 버그 지적은 15개 안팎이고 나머지는 \"이름 바꾸자\", \"이 부분 왜 이렇게 했나요?\", \"중복 줄이자\" 같은 것이다.<\/p>\n<blockquote>\n<p>반론도 있다: \"15%는 <strong>코멘트 중 비율<\/strong>이지 <strong>버그를 찾는 확률<\/strong>이 아니다. 리뷰 한 번에 코멘트가 4개쯤 달리면 리뷰 절반 정도에는 결함 지적이 하나 있다\"(Entropic Thoughts, C등급). → <a href=\"#10\">10장<\/a><\/p>\n<\/blockquote>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:560px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 296\" role=\"img\" aria-label=\"사람 리뷰가 찾은 것 중 &#x27;버그&#x27;는 4분의 1이 안 된다\" data-minw=\"560\"><title>사람 리뷰가 찾은 것 중 &#x27;버그&#x27;는 4분의 1이 안 된다<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"720\" height=\"296\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">사람 리뷰가 찾은 것 중 &#x27;버그&#x27;는 4분의 1이 안 된다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">연구마다 세는 단위가 다르다(코멘트 · 회의 이슈 · 고친 변경 · 결함). 나머지는 가독성·설계·질문<\/text><line class=\"grid\" x1=\"256.5\" y1=\"66\" x2=\"256.5\" y2=\"240\"/><text x=\"256.5\" y=\"256.0\" class=\"t-mut\" text-anchor=\"middle\">0%<\/text><line class=\"grid\" x1=\"354.9\" y1=\"66\" x2=\"354.9\" y2=\"240\"/><text x=\"354.9\" y=\"256.0\" class=\"t-mut\" text-anchor=\"middle\">25%<\/text><line class=\"grid\" x1=\"453.3\" y1=\"66\" x2=\"453.3\" y2=\"240\"/><text x=\"453.3\" y=\"256.0\" class=\"t-mut\" text-anchor=\"middle\">50%<\/text><line class=\"grid\" x1=\"551.6\" y1=\"66\" x2=\"551.6\" y2=\"240\"/><text x=\"551.6\" y=\"256.0\" class=\"t-mut\" text-anchor=\"middle\">75%<\/text><line class=\"grid\" x1=\"650.0\" y1=\"66\" x2=\"650.0\" y2=\"240\"/><text x=\"650.0\" y=\"256.0\" class=\"t-mut\" text-anchor=\"middle\">100%<\/text><text x=\"20.0\" y=\"84.0\">Bacchelli &amp; Bird 2013<\/text><text x=\"20.0\" y=\"98.0\" class=\"t-mut\">Microsoft · 코멘트 570개 중 결함 지적<\/text><g class=\"tip\"><title>78/570 코멘트가 결함 (ICSE 2013)<\/title><rect class=\"hit\" x=\"256.5200000000001\" y=\"70\" width=\"453.4799999999999\" height=\"30\"/><path class=\"f-d1 hl\" d=\"M256.5,74.0h51.1a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-51.1z\"/><text x=\"319.6\" y=\"85.5\" class=\"t-val\">14%<\/text><\/g><text x=\"20.0\" y=\"118.0\">Czerwonka 외 2015<\/text><text x=\"20.0\" y=\"132.0\" class=\"t-mut\">Microsoft · 코멘트 중 결함 가능성<\/text><g class=\"tip\"><title>2쪽 발표 초록. Bosu 2015와 같은 데이터로 보임<\/title><rect class=\"hit\" x=\"256.5200000000001\" y=\"104\" width=\"453.4799999999999\" height=\"30\"/><path class=\"f-d1 hl\" d=\"M256.5,108.0h55.0a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-55.0z\"/><text x=\"323.5\" y=\"119.5\" class=\"t-val\">약 15%<\/text><\/g><text x=\"20.0\" y=\"152.0\">Porter 외 1997<\/text><text x=\"20.0\" y=\"166.0\" class=\"t-mut\">검사 회의에서 나온 이슈 중 진짜 결함<\/text><g class=\"tip\"><title>나머지: 스타일·유지보수 60%, 오탐 22% (TSE 1997)<\/title><rect class=\"hit\" x=\"256.5200000000001\" y=\"138\" width=\"453.4799999999999\" height=\"30\"/><path class=\"f-d1 hl\" d=\"M256.5,142.0h66.8a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-66.8z\"/><text x=\"335.3\" y=\"153.5\" class=\"t-val\">18%<\/text><\/g><text x=\"20.0\" y=\"186.0\">Beller 외 2014<\/text><text x=\"20.0\" y=\"200.0\" class=\"t-mut\">오픈소스 · 리뷰로 고친 변경 중 기능 문제<\/text><g class=\"tip\"><title>유지보수성:기능 = 약 75:25 (MSR 2014)<\/title><rect class=\"hit\" x=\"256.5200000000001\" y=\"172\" width=\"453.4799999999999\" height=\"30\"/><path class=\"f-d1 hl\" d=\"M256.5,176.0h94.4a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-94.4z\"/><text x=\"362.9\" y=\"187.5\" class=\"t-val\">약 25%<\/text><\/g><text x=\"20.0\" y=\"220.0\">Mäntylä &amp; Lassenius 2009<\/text><text x=\"20.0\" y=\"234.0\" class=\"t-mut\">결함 759개 중 기능에 영향<\/text><g class=\"tip\"><title>75%는 겉 기능에 영향 없음 (초록만 확인)<\/title><rect class=\"hit\" x=\"256.5200000000001\" y=\"206\" width=\"453.4799999999999\" height=\"30\"/><path class=\"f-d1 hl\" d=\"M256.5,210.0h94.4a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-94.4z\"/><text x=\"362.9\" y=\"221.5\" class=\"t-val\">약 25%<\/text><\/g><line class=\"axis\" x1=\"256.5200000000001\" y1=\"66\" x2=\"256.5200000000001\" y2=\"240\"/><text x=\"20.0\" y=\"282.0\" class=\"t-mut\">출처: 01장 문헌 카드<\/text><\/svg><\/div><figcaption>그림 1-1. 사람 리뷰가 찾은 것 중 기능 결함의 비율 — 세는 단위가 연구마다 다르다. 출처: 아래 문헌 카드<\/figcaption><\/figure>\n<h3>2. 리뷰의 목적은 버그 찾기만이 아니다<\/h3>\n<ul>\n<li><strong>Bacchelli &amp; Bird 2013<\/strong>: 개발자 873명 중 44%가 \"결함 찾기\"를 첫째 동기로 꼽았지만, 실제 결과는 기대보다 \"결함이 적었다\". 지식 전달·팀 인식(누가 무엇을 바꾸는지 아는 것)·대안 찾기가 함께 나타났다.<\/li>\n<li><strong>Sadowski 외 2018 (Google)<\/strong>: 리뷰의 기대를 <strong>교육, 규범 유지, 문지기, 사고 예방<\/strong>으로 정리했다. \"결함 찾기는 환영받지만 유일한 초점은 아니다.\" 설문 응답자 중 \"코멘트가 버그를 찾아 줬다\"고 답한 사람은 2명뿐이었다.<\/li>\n<li><strong>Rigby &amp; Bird 2013<\/strong>: 여러 회사·오픈소스의 공통 관행으로 \"리뷰는 결함 찾기에서 <strong>집단 문제 해결<\/strong>로 바뀌었다\"를 제시했다. 리뷰를 하면 개발자가 아는 파일 수가 66~150% 늘었다.<\/li>\n<\/ul>\n<h3>3. \"유용한 코멘트\"의 정의는 연구마다 다르다<\/h3>\n<p>에이전트 코멘트의 precision을 재려면 \"유용함\"의 정의가 필요하다. 지금까지 쓰인 정의는 크게 넷이다.<\/p>\n<table>\n<thead>\n<tr>\n<th>정의 방식<\/th>\n<th>대표 연구<\/th>\n<th>결과<\/th>\n<th>약점<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>코멘트 근처(1줄 이내) 코드가 바뀌었나<\/strong><\/td>\n<td>Bosu 외 2015 (Microsoft)<\/td>\n<td>코멘트 150만 개 중 <strong>65.5%<\/strong> 유용<\/td>\n<td>질문·칭찬은 \"유용하지 않음\"으로 분류된다. 설계상 가치 판단이 들어간다<\/td>\n<\/tr>\n<tr>\n<td>같은 규칙, 1~10줄<\/td>\n<td>Rahman 외 2017 (RevHelper)<\/td>\n<td>44.47%가 유용하지 않음<\/td>\n<td>분류기가 \"나쁜 코멘트\"를 잘 못 골라낸다(정밀도 35%)<\/td>\n<\/tr>\n<tr>\n<td><strong>작성자가 받아들였나<\/strong>(반영·수긍·다음으로 미룸)<\/td>\n<td>Turzo &amp; Bosu 2023 (OpenDev)<\/td>\n<td>약 <strong>77%<\/strong> 유용<\/td>\n<td>조직마다 결과가 다르다(아래)<\/td>\n<\/tr>\n<tr>\n<td>출시 후 결함과의 관계<\/td>\n<td>McIntosh 외 2014/2016<\/td>\n<td>리뷰 참여가 낮으면 출시 후 결함이 최대 5개 더<\/td>\n<td>상관관계일 뿐 인과가 아니다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>조직마다 다르다는 증거<\/strong>: Microsoft(Bosu 2015)에서는 그 파일을 본 적 있는 리뷰어의 코멘트가 처음 보는 리뷰어보다 거의 2배 유용했다(65~71% vs 32~37%). 그런데 오픈소스 OpenDev(Turzo &amp; Bosu 2023)에서는 파일 경험이 유용성과 유의한 관계가 없었고, 질문·설계 논의도 유용하다고 평가되었다.<\/p>\n<blockquote>\n<p>판단에 영향을 주는 사실: 한 조직에서 만든 \"유용함\" 라벨이 다른 조직에 그대로 통하지 않을 수 있다.<\/p>\n<\/blockquote>\n<h3>4. 사람 리뷰어도 놓친다 — 무엇을 놓치나<\/h3>\n<p>정답지를 사람 코멘트로만 만들면, 사람이 놓친 문제는 정답지에 없다.<\/p>\n<ul>\n<li><strong>Paul 외 2021 (Chromium OS 보안 결함)<\/strong>: 몇 줄만 보면 알 수 있는 결함(위험 함수 strcpy 등, CWE-676)은 리뷰를 빠져나간 비율이 <strong>0%<\/strong>였다. 반대로 넓은 맥락이나 실행을 이해해야 하는 결함은 대부분 빠져나갔다. 입력 검증 누락(CWE-20) <strong>88.89%<\/strong>, 접근 제어(CWE-284) <strong>87.88%<\/strong>. 단, 비교용으로 모은 표본이라 이 수치는 \"놓치는 확률\"이 아니다.<\/li>\n<li><strong>Khoshnoud 외 2022<\/strong>: 머지된 PR에서 나중에 발견된 놓친 버그 187개 중 <strong>51%<\/strong>가 로직·동작 오류였다. 머지 후 누군가 언급한 것만 셌으므로 실제보다 적게 잡혔다.<\/li>\n<li><strong>Kononenko 외 2015 (Mozilla)<\/strong>: 리뷰를 거친 변경의 <strong>54%<\/strong>가 버그를 만들었다(SZZ라는 자동 추적 기법 기준. SZZ 자체가 오차가 있다).<\/li>\n<\/ul>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:560px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 428\" role=\"img\" aria-label=\"사람 리뷰는 &#x27;넓은 맥락이 필요한&#x27; 보안 결함을 주로 놓친다\" data-minw=\"560\"><title>사람 리뷰는 &#x27;넓은 맥락이 필요한&#x27; 보안 결함을 주로 놓친다<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"720\" height=\"428\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">사람 리뷰는 &#x27;넓은 맥락이 필요한&#x27; 보안 결함을 주로 놓친다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">보안 결함 유형별로 리뷰를 빠져나간 비율 · Chromium OS (Paul 외, ICSE 2021)<\/text><rect x=\"20\" y=\"63\" width=\"12\" height=\"10\" rx=\"2\" class=\"f-d2\"/><text x=\"40.0\" y=\"72.0\" class=\"t-sm\">대부분 놓침 — 실행·넓은 맥락 이해 필요<\/text><rect x=\"276.31999999999994\" y=\"63\" width=\"12\" height=\"10\" rx=\"2\" class=\"f-d1\"/><text x=\"296.3\" y=\"72.0\" class=\"t-sm\">대부분 잡힘 — 몇 줄로 보임<\/text><line class=\"grid\" x1=\"227.8\" y1=\"96\" x2=\"227.8\" y2=\"372\"/><text x=\"227.8\" y=\"388.0\" class=\"t-mut\" text-anchor=\"middle\">0%<\/text><line class=\"grid\" x1=\"333.4\" y1=\"96\" x2=\"333.4\" y2=\"372\"/><text x=\"333.4\" y=\"388.0\" class=\"t-mut\" text-anchor=\"middle\">25%<\/text><line class=\"grid\" x1=\"438.9\" y1=\"96\" x2=\"438.9\" y2=\"372\"/><text x=\"438.9\" y=\"388.0\" class=\"t-mut\" text-anchor=\"middle\">50%<\/text><line class=\"grid\" x1=\"544.5\" y1=\"96\" x2=\"544.5\" y2=\"372\"/><text x=\"544.5\" y=\"388.0\" class=\"t-mut\" text-anchor=\"middle\">75%<\/text><line class=\"grid\" x1=\"650.0\" y1=\"96\" x2=\"650.0\" y2=\"372\"/><text x=\"650.0\" y=\"388.0\" class=\"t-mut\" text-anchor=\"middle\">100%<\/text><text x=\"20.0\" y=\"114.0\" class=\"t-b\">CWE-345 데이터 진위<\/text><g class=\"tip\"><title>CWE-345 데이터 진위: 리뷰를 빠져나간 비율 100% (Chromium OS, Paul 외 ICSE 2021)<\/title><rect class=\"hit\" x=\"227.82\" y=\"100\" width=\"482.18\" height=\"30\"/><path class=\"f-d2 hl\" d=\"M227.8,104.0h418.2a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-418.2z\"/><text x=\"658.0\" y=\"115.5\" class=\"t-val\">100%<\/text><\/g><text x=\"20.0\" y=\"148.0\" class=\"t-b\">CWE-672 해제 후 사용<\/text><g class=\"tip\"><title>CWE-672 해제 후 사용: 리뷰를 빠져나간 비율 95.38% (Chromium OS, Paul 외 ICSE 2021)<\/title><rect class=\"hit\" x=\"227.82\" y=\"134\" width=\"482.18\" height=\"30\"/><path class=\"f-d2 hl\" d=\"M227.8,138.0h398.7a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-398.7z\"/><text x=\"638.5\" y=\"149.5\" class=\"t-val\">95.38%<\/text><\/g><text x=\"20.0\" y=\"182.0\" class=\"t-b\">CWE-704 잘못된 타입 변환<\/text><g class=\"tip\"><title>CWE-704 잘못된 타입 변환: 리뷰를 빠져나간 비율 94.12% (Chromium OS, Paul 외 ICSE 2021)<\/title><rect class=\"hit\" x=\"227.82\" y=\"168\" width=\"482.18\" height=\"30\"/><path class=\"f-d2 hl\" d=\"M227.8,172.0h393.4a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-393.4z\"/><text x=\"633.2\" y=\"183.5\" class=\"t-val\">94.12%<\/text><\/g><text x=\"20.0\" y=\"216.0\" class=\"t-b\">CWE-20 입력 검증 누락<\/text><g class=\"tip\"><title>CWE-20 입력 검증 누락: 리뷰를 빠져나간 비율 88.89% (Chromium OS, Paul 외 ICSE 2021)<\/title><rect class=\"hit\" x=\"227.82\" y=\"202\" width=\"482.18\" height=\"30\"/><path class=\"f-d2 hl\" d=\"M227.8,206.0h371.3a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-371.3z\"/><text x=\"611.1\" y=\"217.5\" class=\"t-val\">88.89%<\/text><\/g><text x=\"20.0\" y=\"250.0\" class=\"t-b\">CWE-284 접근 제어<\/text><g class=\"tip\"><title>CWE-284 접근 제어: 리뷰를 빠져나간 비율 87.88% (Chromium OS, Paul 외 ICSE 2021)<\/title><rect class=\"hit\" x=\"227.82\" y=\"236\" width=\"482.18\" height=\"30\"/><path class=\"f-d2 hl\" d=\"M227.8,240.0h367.0a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-367.0z\"/><text x=\"606.8\" y=\"251.5\" class=\"t-val\">87.88%<\/text><\/g><text x=\"20.0\" y=\"284.0\" class=\"t-b\">CWE-662 동기화<\/text><g class=\"tip\"><title>CWE-662 동기화: 리뷰를 빠져나간 비율 10.66% (Chromium OS, Paul 외 ICSE 2021)<\/title><rect class=\"hit\" x=\"227.82\" y=\"270\" width=\"482.18\" height=\"30\"/><path class=\"f-d1 hl\" d=\"M227.8,274.0h41.0a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-41.0z\"/><text x=\"280.8\" y=\"285.5\" class=\"t-val\">10.66%<\/text><\/g><text x=\"20.0\" y=\"318.0\" class=\"t-b\">CWE-404 자원 해제<\/text><g class=\"tip\"><title>CWE-404 자원 해제: 리뷰를 빠져나간 비율 5.33% (Chromium OS, Paul 외 ICSE 2021)<\/title><rect class=\"hit\" x=\"227.82\" y=\"304\" width=\"482.18\" height=\"30\"/><path class=\"f-d1 hl\" d=\"M227.8,308.0h18.5a4,4 0 0 1 4,4v6.0a4,4 0 0 1 -4,4h-18.5z\"/><text x=\"258.3\" y=\"319.5\" class=\"t-val\">5.33%<\/text><\/g><text x=\"20.0\" y=\"352.0\" class=\"t-b\">CWE-676 위험 함수(strcpy 등)<\/text><g class=\"tip\"><title>CWE-676 위험 함수(strcpy 등): 리뷰를 빠져나간 비율 0% (Chromium OS, Paul 외 ICSE 2021)<\/title><rect class=\"hit\" x=\"227.82\" y=\"338\" width=\"482.18\" height=\"30\"/><rect x=\"226.82\" y=\"340\" width=\"3\" height=\"18\" class=\"f-d1\"/><text x=\"235.8\" y=\"353.5\" class=\"t-val\">0%<\/text><\/g><line class=\"axis\" x1=\"227.82\" y1=\"96\" x2=\"227.82\" y2=\"372\"/><text x=\"20.0\" y=\"414.0\" class=\"t-mut\">사례-대조 표본이라 &#x27;놓칠 확률&#x27;이 아니라 유형별 경향이다. 몇 줄만 보면 알 수 있는 결함은 잡혔다<\/text><\/svg><\/div><figcaption>그림 1-2. 보안 결함 유형별로 리뷰를 빠져나간 비율 — Paul 외 ICSE 2021, Chromium OS. 사례-대조 표본이라 '확률'이 아니다<\/figcaption><\/figure>\n<h3>5. 코멘트 품질에는 정확성 말고 다른 축도 있다<\/h3>\n<ul>\n<li><strong>명확성<\/strong>: Ebert 외 2017. 안드로이드 리뷰 코멘트 800개에서 \"혼란\"을 찾았다. 평가자 간 일치도는 중간 수준이었다(Fleiss κ 0.49~0.59). 혼란의 첫째 원인은 \"이유 설명 없음\"이다.<\/li>\n<li><strong>어조<\/strong>: Gunawardena 외 2022 (Google, CSCW). \"파괴적 비판\"을 <strong>구체적이지 않으면서 배려 없는<\/strong> 부정적 피드백으로 정의했다. 응답자의 절반 이상이 지난 1년 사이 구체적이지 않은 부정 피드백을 받았다.<\/li>\n<li><strong>리뷰 품질을 개발자는 어떻게 보나<\/strong>: Kononenko 외 2016 (Mozilla 88명). 꼽힌 것은 \"철저한 피드백\", \"코드 이해\", \"사람 요소\" 순이었고, \"버그 잡기\"는 소수였다(8회 언급).<\/li>\n<\/ul>\n<h2>문헌 카드<\/h2>\n<table>\n<thead>\n<tr>\n<th>문헌<\/th>\n<th>선정 근거<\/th>\n<th>한계<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fagan 1976, IBM Systems Journal<\/td>\n<td><strong>원조<\/strong>. 소프트웨어 검사(inspection)의 출발점. 효과 = \"검사로 찾은 오류 / 검사 전 전체 오류\". 이 정의는 곧 recall이다. OA 인용 1,829<\/td>\n<td>스캔본이라 표를 읽지 못해 본문 문장만 썼다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Bacchelli &amp; Bird 2013, ICSE<\/td>\n<td><strong>영향력 최상위<\/strong>. 현대 코드 리뷰 연구 중 가장 많이 인용됨(S2 940 / OA 1,031)<\/td>\n<td>코멘트 570개 표본<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Rigby &amp; Bird 2013, ESEC/FSE<\/td>\n<td>여러 회사·오픈소스의 공통 관행 정리(S2 392). Google 연구의 비교 기준<\/td>\n<td>결함을 명시적으로 기록하지 않는 데이터<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Beller 외 2014, MSR<\/td>\n<td>75:25 비율의 근거 데이터(S2 270). 코멘트 7~35%는 버려지고, 변경 10~22%는 코멘트 없이 생긴다 → \"코멘트 때문에 코드가 바뀌었다\"는 라벨의 한계<\/td>\n<td>오픈소스 2개<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Mäntylä &amp; Lassenius 2009, TSE<\/td>\n<td>기능/진화성(evolvability) 결함 분류의 <strong>원조<\/strong>(S2 226)<\/td>\n<td>초록만 확인<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>McIntosh 외 2014 MSR(우수논문상) / 2016 EMSE<\/td>\n<td>리뷰 참여·커버리지와 출시 후 결함의 관계(S2 355/378)<\/td>\n<td>상관관계. 결함 컴포넌트의 70~87%는 전부 리뷰를 거쳤다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Bosu, Greiler, Bird 2015, MSR<\/td>\n<td>\"유용한 코멘트\"의 <strong>조작적 정의 원조<\/strong>(S2 265). 분류기 정밀도 89.1% / 재현율 85.1%<\/td>\n<td>유용성 = 코드 변경. 질문·칭찬은 무가치로 분류<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Sadowski 외 2018, ICSE-SEIP<\/td>\n<td><strong>1차 사례<\/strong>(Google, 변경 약 900만 건). 중앙값 24줄, 리뷰 지연 4시간 미만<\/td>\n<td>2014~2016 데이터<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Czerwonka 외 2015, ICSE-SEIP<\/td>\n<td>\"리뷰는 버그를 못 찾는다\"라는 제목으로 자주 인용됨(S2 93)<\/td>\n<td>2쪽 발표 초록. Bosu와 같은 데이터로 보여 <strong>독립 근거가 아니다<\/strong><\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Kononenko 외 2015 ICSME / 2016 ICSE<\/td>\n<td>결과 기반 정답(버그가 리뷰를 빠져나갔나)의 예. 개발자가 보는 리뷰 품질<\/td>\n<td>SZZ 추적은 오차가 있다(수작업 확인 시 9% 문제)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Turzo &amp; Bosu 2023, EMSE<\/td>\n<td>Bosu 2015의 <strong>오픈소스 재현<\/strong>. 결과가 일부 반대로 나와 조직 의존성을 보여 줌<\/td>\n<td>회귀모형 설명력이 매우 낮다(R² 0.026)<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Rahman, Roy, Kula 2017, MSR<\/td>\n<td>Bosu 정의를 다른 회사에 적용(OA 123)<\/td>\n<td>분류 정확도 약 66%<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Paul, Turzo, Bosu 2021, ICSE<\/td>\n<td>사람이 놓치는 보안 결함의 유형(OA 55)<\/td>\n<td>사례-대조 설계라 놓치는 확률이 아니다<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Khoshnoud 외 2022, MSR<\/td>\n<td>머지 후 발견된 놓친 버그 유형<\/td>\n<td>과소 집계<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Porter 외 1997, TSE<\/td>\n<td>고전 검사 실험. 회의 기록의 18%만 진짜 결함<\/td>\n<td>한 회사·한 제품<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Ebert 외 2017 ICSME · Gunawardena 외 2022 CSCW<\/td>\n<td>명확성·어조 축<\/td>\n<td>평가자 일치도가 중간 수준<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Davila &amp; Nunes 2021 JSS · Badampudi 외 2023 TOSEM<\/td>\n<td>체계적 문헌 리뷰. \"리뷰 지원 도구는 대부분 <strong>사람 없이 오프라인으로만<\/strong> 평가되었다\"(Davila)<\/td>\n<td>—<\/td>\n<td>A<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>연구들이 엇갈리는 지점<\/h2>\n<ul>\n<li><strong>리뷰어 경험의 효과<\/strong>: Microsoft(Bosu)에서는 경험이 클수록 유용했다. OpenDev(Turzo)에서는 관계가 없거나, 프로젝트 재직 기간에 따라 오히려 낮았다.<\/li>\n<li><strong>질문형 코멘트의 가치<\/strong>: Bosu는 \"유용하지 않음\", Turzo는 \"유용함\". Bacchelli &amp; Bird는 이해를 돕는 코멘트가 두 번째로 많다고 했다.<\/li>\n<li><strong>리뷰가 결함을 줄이나<\/strong>: McIntosh는 참여가 낮을수록 결함이 늘어난다고 봤다. 같은 논문에서 결함 있는 컴포넌트의 70~87%는 이미 리뷰를 다 거쳤다.<\/li>\n<\/ul>\n<h2>스스로 판단할 질문<\/h2>\n<ol>\n<li>우리 에이전트가 할 일은 사람 리뷰의 어떤 기능인가? 결함 찾기만인가, 규범 유지·교육까지인가?<\/li>\n<li>\"유용한 코멘트\"를 무엇으로 정의할 것인가? 코드 변경, 작성자 수긍, 결함 예방 중 무엇으로? 각 정의에 따라 질문형 코멘트의 점수는 어떻게 달라지는가?<\/li>\n<li>사람 코멘트로 정답지를 만들면 스타일 지적이 정답지의 다수를 차지한다. 이것을 정답으로 칠 것인가?<\/li>\n<li>사람이 체계적으로 놓치는 유형(넓은 맥락이 필요한 결함)은 정답지에 어떻게 넣을 것인가? 넣지 않으면 그 유형에서의 recall은 측정되지 않는다.<\/li>\n<li>다른 회사·오픈소스에서 측정한 유용성 수치를 우리 팀에 그대로 가져와도 되는가?<\/li>\n<\/ol>\n<h2>출처<\/h2>\n<ul>\n<li>Fagan 1976 — <a href=\"https://www.ida.liu.se/~TDDC90/labs/lab-papers/fagan76.pdf\">https://www.ida.liu.se/~TDDC90/labs/lab-papers/fagan76.pdf<\/a> (A, ok)<\/li>\n<li>Bacchelli &amp; Bird 2013 — <a href=\"https://web.eecs.umich.edu/~weimerw/2018-481/readings/codereview.pdf\">https://web.eecs.umich.edu/~weimerw/2018-481/readings/codereview.pdf<\/a> (A, ok)<\/li>\n<li>Rigby &amp; Bird 2013 — <a href=\"https://users.ece.utexas.edu/~miryung/teaching/EE379K-Spring2014/Papers/Paper%204.pdf\">https://users.ece.utexas.edu/~miryung/teaching/EE379K-Spring2014/Papers/Paper%204.pdf<\/a> (A, ok)<\/li>\n<li>Beller 외 2014 — <a href=\"https://flosshub.org/sites/flosshub.org/files/beller.pdf\">https://flosshub.org/sites/flosshub.org/files/beller.pdf<\/a> (A, ok)<\/li>\n<li>Mäntylä &amp; Lassenius 2009 — <a href=\"https://mmantyla.github.io/wiki/What+Types+of+Defects+Are+Really+Discovered+in+Code+Reviews%253F.html\">https://mmantyla.github.io/wiki/What+Types+of+Defects+Are+Really+Discovered+in+Code+Reviews%253F.html<\/a> (A, 초록만)<\/li>\n<li>McIntosh 외 2014 — <a href=\"https://rebels.cs.uwaterloo.ca/papers/msr2014_mcintosh.pdf\">https://rebels.cs.uwaterloo.ca/papers/msr2014_mcintosh.pdf<\/a> · 2016 — <a href=\"https://rebels.cs.uwaterloo.ca/papers/emse2016_mcintosh.pdf\">https://rebels.cs.uwaterloo.ca/papers/emse2016_mcintosh.pdf<\/a> (A, ok)<\/li>\n<li>Bosu 외 2015 — <a href=\"https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/bosu2015useful.pdf\">https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/bosu2015useful.pdf<\/a> (A, ok)<\/li>\n<li>Sadowski 외 2018 — <a href=\"https://sback.it/publications/icse2018seip.pdf\">https://sback.it/publications/icse2018seip.pdf<\/a> (A, ok)<\/li>\n<li>Czerwonka 외 2015 — <a href=\"https://microsoft.com/en-us/research/wp-content/uploads/2015/05/PID3556473.pdf\">https://microsoft.com/en-us/research/wp-content/uploads/2015/05/PID3556473.pdf<\/a> (A, ok)<\/li>\n<li>Kononenko 외 2015 — <a href=\"https://plg.uwaterloo.ca/%7Emigod/papers/2015/icsme15-OleksiiOlgaLatifa.pdf\">https://plg.uwaterloo.ca/%7Emigod/papers/2015/icsme15-OleksiiOlgaLatifa.pdf<\/a> · 2016 기술보고서 — <a href=\"https://cs.uwaterloo.ca/sites/default/files/uploads/documents/cs-2015-15.pdf\">https://cs.uwaterloo.ca/sites/default/files/uploads/documents/cs-2015-15.pdf<\/a><\/li>\n<li>Turzo &amp; Bosu 2023 — <a href=\"https://arxiv.org/abs/2302.11686\">https://arxiv.org/abs/2302.11686<\/a> (A)<\/li>\n<li>Rahman 외 2017 — <a href=\"https://arxiv.org/abs/1807.04485\">https://arxiv.org/abs/1807.04485<\/a> (A)<\/li>\n<li>Paul 외 2021 — <a href=\"https://arxiv.org/pdf/2102.06909\">https://arxiv.org/pdf/2102.06909<\/a> (A, ok)<\/li>\n<li>Khoshnoud 외 2022 — <a href=\"https://arxiv.org/pdf/2205.09428\">https://arxiv.org/pdf/2205.09428<\/a> (A, ok)<\/li>\n<li>Porter 외 1997 — <a href=\"https://userweb.cs.txstate.edu/~rp31/papersSQ/PorterEtAl_TSE.pdf\">https://userweb.cs.txstate.edu/~rp31/papersSQ/PorterEtAl_TSE.pdf<\/a> (A, ok)<\/li>\n<li>Ebert 외 2017 — <a href=\"https://aserebre.win.tue.nl/ICSME2017Felipe.pdf\">https://aserebre.win.tue.nl/ICSME2017Felipe.pdf<\/a> (A, ok)<\/li>\n<li>Gunawardena 외 2022 — <a href=\"https://storage.googleapis.com/gweb-research2023-media/pubtools/6564.pdf\">https://storage.googleapis.com/gweb-research2023-media/pubtools/6564.pdf<\/a> (A, ok)<\/li>\n<li>Davila &amp; Nunes 2021 — <a href=\"https://arxiv.org/pdf/2103.08777\">https://arxiv.org/pdf/2103.08777<\/a> · Badampudi 외 2023 — <a href=\"https://arxiv.org/pdf/2403.00088\">https://arxiv.org/pdf/2403.00088<\/a> (A, ok)<\/li>\n<\/ul>", "text": " 01. 코드 리뷰란 무엇인가 — 사람의 리뷰는 실제로 무엇을 하나 생성일 : 2026-11-19 최종 수정일 : 2026-11-20 수준 : 기초 근거 원장 : wave-1 A1 · wave-2 W2a 이 장에서 답하는 질문 리뷰 에이전트를 평가하려면 먼저 \"좋은 리뷰가 무엇인가\"를 정해야 한다. 그 기준은 대개 사람의 리뷰 에서 빌려 온다. 그런데 사람의 리뷰는 실제로 무엇을 하고, 무엇을 놓치고, 어떤 코멘트가 \"유용\"하다고 정의되어 왔을까? 핵심 내용 (쉬운 말로) 1. 사람의 리뷰 코멘트 가운데 버그 지적은 소수다 여러 연구가 서로 다른 회사·오픈소스 데이터에서 비슷한 결과를 냈다. 연구 데이터 결함(버그) 관련 비율 Bacchelli & Bird 2013 (Microsoft) 코멘트 570개 14% (78개). 가장 많은 것은 \"코드 개선\" 29% Czerwonka 외 2015 (Microsoft) — (2쪽짜리 발표 초록) 약 15% . 유지보수성 지적이 50% 이상 Beller 외 2014 (오픈소스 2개) 변경 1,400여 건 유지보수성:기능 = 약 75:25 Mäntylä & Lassenius 2009 결함 388+371개 결함의 75% 가 겉으로 보이는 기능에 영향 없음 (초록만 확인) Porter 외 1997 (검사 실험 88회) 회의 기록 이슈 진짜 결함 18% , 스타일·유지보수 60%, 오탐 22% 예시로 보면 : 사람 리뷰 코멘트 100개를 모아 정답지를 만들면, 그중 버그 지적은 15개 안팎이고 나머지는 \"이름 바꾸자\", \"이 부분 왜 이렇게 했나요?\", \"중복 줄이자\" 같은 것이다. 반론도 있다: \"15%는 코멘트 중 비율 이지 버그를 찾는 확률 이 아니다. 리뷰 한 번에 코멘트가 4개쯤 달리면 리뷰 절반 정도에는 결함 지적이 하나 있다\"(Entropic Thoughts, C등급). → 10장 그림 1-1. 사람 리뷰가 찾은 것 중 기능 결함의 비율 — 세는 단위가 연구마다 다르다. 출처: 아래 문헌 카드 2. 리뷰의 목적은 버그 찾기만이 아니다 Bacchelli & Bird 2013 : 개발자 873명 중 44%가 \"결함 찾기\"를 첫째 동기로 꼽았지만, 실제 결과는 기대보다 \"결함이 적었다\". 지식 전달·팀 인식(누가 무엇을 바꾸는지 아는 것)·대안 찾기가 함께 나타났다. Sadowski 외 2018 (Google) : 리뷰의 기대를 교육, 규범 유지, 문지기, 사고 예방 으로 정리했다. \"결함 찾기는 환영받지만 유일한 초점은 아니다.\" 설문 응답자 중 \"코멘트가 버그를 찾아 줬다\"고 답한 사람은 2명뿐이었다. Rigby & Bird 2013 : 여러 회사·오픈소스의 공통 관행으로 \"리뷰는 결함 찾기에서 집단 문제 해결 로 바뀌었다\"를 제시했다. 리뷰를 하면 개발자가 아는 파일 수가 66~150% 늘었다. 3. \"유용한 코멘트\"의 정의는 연구마다 다르다 에이전트 코멘트의 precision을 재려면 \"유용함\"의 정의가 필요하다. 지금까지 쓰인 정의는 크게 넷이다. 정의 방식 대표 연구 결과 약점 코멘트 근처(1줄 이내) 코드가 바뀌었나 Bosu 외 2015 (Microsoft) 코멘트 150만 개 중 65.5% 유용 질문·칭찬은 \"유용하지 않음\"으로 분류된다. 설계상 가치 판단이 들어간다 같은 규칙, 1~10줄 Rahman 외 2017 (RevHelper) 44.47%가 유용하지 않음 분류기가 \"나쁜 코멘트\"를 잘 못 골라낸다(정밀도 35%) 작성자가 받아들였나 (반영·수긍·다음으로 미룸) Turzo & Bosu 2023 (OpenDev) 약 77% 유용 조직마다 결과가 다르다(아래) 출시 후 결함과의 관계 McIntosh 외 2014/2016 리뷰 참여가 낮으면 출시 후 결함이 최대 5개 더 상관관계일 뿐 인과가 아니다 조직마다 다르다는 증거 : Microsoft(Bosu 2015)에서는 그 파일을 본 적 있는 리뷰어의 코멘트가 처음 보는 리뷰어보다 거의 2배 유용했다(65~71% vs 32~37%). 그런데 오픈소스 OpenDev(Turzo & Bosu 2023)에서는 파일 경험이 유용성과 유의한 관계가 없었고, 질문·설계 논의도 유용하다고 평가되었다. 판단에 영향을 주는 사실: 한 조직에서 만든 \"유용함\" 라벨이 다른 조직에 그대로 통하지 않을 수 있다. 4. 사람 리뷰어도 놓친다 — 무엇을 놓치나 정답지를 사람 코멘트로만 만들면, 사람이 놓친 문제는 정답지에 없다. Paul 외 2021 (Chromium OS 보안 결함) : 몇 줄만 보면 알 수 있는 결함(위험 함수 strcpy 등, CWE-676)은 리뷰를 빠져나간 비율이 0% 였다. 반대로 넓은 맥락이나 실행을 이해해야 하는 결함은 대부분 빠져나갔다. 입력 검증 누락(CWE-20) 88.89% , 접근 제어(CWE-284) 87.88% . 단, 비교용으로 모은 표본이라 이 수치는 \"놓치는 확률\"이 아니다. Khoshnoud 외 2022 : 머지된 PR에서 나중에 발견된 놓친 버그 187개 중 51% 가 로직·동작 오류였다. 머지 후 누군가 언급한 것만 셌으므로 실제보다 적게 잡혔다. Kononenko 외 2015 (Mozilla) : 리뷰를 거친 변경의 54% 가 버그를 만들었다(SZZ라는 자동 추적 기법 기준. SZZ 자체가 오차가 있다). 그림 1-2. 보안 결함 유형별로 리뷰를 빠져나간 비율 — Paul 외 ICSE 2021, Chromium OS. 사례-대조 표본이라 '확률'이 아니다 5. 코멘트 품질에는 정확성 말고 다른 축도 있다 명확성 : Ebert 외 2017. 안드로이드 리뷰 코멘트 800개에서 \"혼란\"을 찾았다. 평가자 간 일치도는 중간 수준이었다(Fleiss κ 0.49~0.59). 혼란의 첫째 원인은 \"이유 설명 없음\"이다. 어조 : Gunawardena 외 2022 (Google, CSCW). \"파괴적 비판\"을 구체적이지 않으면서 배려 없는 부정적 피드백으로 정의했다. 응답자의 절반 이상이 지난 1년 사이 구체적이지 않은 부정 피드백을 받았다. 리뷰 품질을 개발자는 어떻게 보나 : Kononenko 외 2016 (Mozilla 88명). 꼽힌 것은 \"철저한 피드백\", \"코드 이해\", \"사람 요소\" 순이었고, \"버그 잡기\"는 소수였다(8회 언급). 문헌 카드 문헌 선정 근거 한계 등급 Fagan 1976, IBM Systems Journal 원조 . 소프트웨어 검사(inspection)의 출발점. 효과 = \"검사로 찾은 오류 / 검사 전 전체 오류\". 이 정의는 곧 recall이다. OA 인용 1,829 스캔본이라 표를 읽지 못해 본문 문장만 썼다 A Bacchelli & Bird 2013, ICSE 영향력 최상위 . 현대 코드 리뷰 연구 중 가장 많이 인용됨(S2 940 / OA 1,031) 코멘트 570개 표본 A Rigby & Bird 2013, ESEC/FSE 여러 회사·오픈소스의 공통 관행 정리(S2 392). Google 연구의 비교 기준 결함을 명시적으로 기록하지 않는 데이터 A Beller 외 2014, MSR 75:25 비율의 근거 데이터(S2 270). 코멘트 7~35%는 버려지고, 변경 10~22%는 코멘트 없이 생긴다 → \"코멘트 때문에 코드가 바뀌었다\"는 라벨의 한계 오픈소스 2개 A Mäntylä & Lassenius 2009, TSE 기능/진화성(evolvability) 결함 분류의 원조 (S2 226) 초록만 확인 A McIntosh 외 2014 MSR(우수논문상) / 2016 EMSE 리뷰 참여·커버리지와 출시 후 결함의 관계(S2 355/378) 상관관계. 결함 컴포넌트의 70~87%는 전부 리뷰를 거쳤다 A Bosu, Greiler, Bird 2015, MSR \"유용한 코멘트\"의 조작적 정의 원조 (S2 265). 분류기 정밀도 89.1% / 재현율 85.1% 유용성 = 코드 변경. 질문·칭찬은 무가치로 분류 A Sadowski 외 2018, ICSE-SEIP 1차 사례 (Google, 변경 약 900만 건). 중앙값 24줄, 리뷰 지연 4시간 미만 2014~2016 데이터 A Czerwonka 외 2015, ICSE-SEIP \"리뷰는 버그를 못 찾는다\"라는 제목으로 자주 인용됨(S2 93) 2쪽 발표 초록. Bosu와 같은 데이터로 보여 독립 근거가 아니다 A Kononenko 외 2015 ICSME / 2016 ICSE 결과 기반 정답(버그가 리뷰를 빠져나갔나)의 예. 개발자가 보는 리뷰 품질 SZZ 추적은 오차가 있다(수작업 확인 시 9% 문제) A Turzo & Bosu 2023, EMSE Bosu 2015의 오픈소스 재현 . 결과가 일부 반대로 나와 조직 의존성을 보여 줌 회귀모형 설명력이 매우 낮다(R² 0.026) A Rahman, Roy, Kula 2017, MSR Bosu 정의를 다른 회사에 적용(OA 123) 분류 정확도 약 66% A Paul, Turzo, Bosu 2021, ICSE 사람이 놓치는 보안 결함의 유형(OA 55) 사례-대조 설계라 놓치는 확률이 아니다 A Khoshnoud 외 2022, MSR 머지 후 발견된 놓친 버그 유형 과소 집계 A Porter 외 1997, TSE 고전 검사 실험. 회의 기록의 18%만 진짜 결함 한 회사·한 제품 A Ebert 외 2017 ICSME · Gunawardena 외 2022 CSCW 명확성·어조 축 평가자 일치도가 중간 수준 A Davila & Nunes 2021 JSS · Badampudi 외 2023 TOSEM 체계적 문헌 리뷰. \"리뷰 지원 도구는 대부분 사람 없이 오프라인으로만 평가되었다\"(Davila) — A 연구들이 엇갈리는 지점 리뷰어 경험의 효과 : Microsoft(Bosu)에서는 경험이 클수록 유용했다. OpenDev(Turzo)에서는 관계가 없거나, 프로젝트 재직 기간에 따라 오히려 낮았다. 질문형 코멘트의 가치 : Bosu는 \"유용하지 않음\", Turzo는 \"유용함\". Bacchelli & Bird는 이해를 돕는 코멘트가 두 번째로 많다고 했다. 리뷰가 결함을 줄이나 : McIntosh는 참여가 낮을수록 결함이 늘어난다고 봤다. 같은 논문에서 결함 있는 컴포넌트의 70~87%는 이미 리뷰를 다 거쳤다. 스스로 판단할 질문 우리 에이전트가 할 일은 사람 리뷰의 어떤 기능인가? 결함 찾기만인가, 규범 유지·교육까지인가? \"유용한 코멘트\"를 무엇으로 정의할 것인가? 코드 변경, 작성자 수긍, 결함 예방 중 무엇으로? 각 정의에 따라 질문형 코멘트의 점수는 어떻게 달라지는가? 사람 코멘트로 정답지를 만들면 스타일 지적이 정답지의 다수를 차지한다. 이것을 정답으로 칠 것인가? 사람이 체계적으로 놓치는 유형(넓은 맥락이 필요한 결함)은 정답지에 어떻게 넣을 것인가? 넣지 않으면 그 유형에서의 recall은 측정되지 않는다. 다른 회사·오픈소스에서 측정한 유용성 수치를 우리 팀에 그대로 가져와도 되는가? 출처 Fagan 1976 — https://www.ida.liu.se/~TDDC90/labs/lab-papers/fagan76.pdf (A, ok) Bacchelli & Bird 2013 — https://web.eecs.umich.edu/~weimerw/2018-481/readings/codereview.pdf (A, ok) Rigby & Bird 2013 — https://users.ece.utexas.edu/~miryung/teaching/EE379K-Spring2014/Papers/Paper%204.pdf (A, ok) Beller 외 2014 — https://flosshub.org/sites/flosshub.org/files/beller.pdf (A, ok) Mäntylä & Lassenius 2009 — https://mmantyla.github.io/wiki/What+Types+of+Defects+Are+Really+Discovered+in+Code+Reviews%253F.html (A, 초록만) McIntosh 외 2014 — https://rebels.cs.uwaterloo.ca/papers/msr2014_mcintosh.pdf · 2016 — https://rebels.cs.uwaterloo.ca/papers/emse2016_mcintosh.pdf (A, ok) Bosu 외 2015 — https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/bosu2015useful.pdf (A, ok) Sadowski 외 2018 — https://sback.it/publications/icse2018seip.pdf (A, ok) Czerwonka 외 2015 — https://microsoft.com/en-us/research/wp-content/uploads/2015/05/PID3556473.pdf (A, ok) Kononenko 외 2015 — https://plg.uwaterloo.ca/%7Emigod/papers/2015/icsme15-OleksiiOlgaLatifa.pdf · 2016 기술보고서 — https://cs.uwaterloo.ca/sites/default/files/uploads/documents/cs-2015-15.pdf Turzo & Bosu 2023 — https://arxiv.org/abs/2302.11686 (A) Rahman 외 2017 — https://arxiv.org/abs/1807.04485 (A) Paul 외 2021 — https://arxiv.org/pdf/2102.06909 (A, ok) Khoshnoud 외 2022 — https://arxiv.org/pdf/2205.09428 (A, ok) Porter 외 1997 — https://userweb.cs.txstate.edu/~rp31/papersSQ/PorterEtAl_TSE.pdf (A, ok) Ebert 외 2017 — https://aserebre.win.tue.nl/ICSME2017Felipe.pdf (A, ok) Gunawardena 외 2022 — https://storage.googleapis.com/gweb-research2023-media/pubtools/6564.pdf (A, ok) Davila & Nunes 2021 — https://arxiv.org/pdf/2103.08777 · Badampudi 외 2023 — https://arxiv.org/pdf/2403.00088 (A, ok) "}, {"id": "02", "dir": "02-평가-지표와-통계-기초", "title": "02. 평가 지표와 통계 기초", "level": "기초", "html": "<h1>02. 평가 지표와 통계 기초<\/h1>\n<ul>\n<li><strong>생성일<\/strong>: 2026-11-19<\/li>\n<li><strong>최종 수정일<\/strong>: 2026-11-25<\/li>\n<li><strong>수준<\/strong>: 기초<\/li>\n<li><strong>근거 원장<\/strong>: <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-1-web-A2-evaluation-foundations.md\">wave-1 A2<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/wave-2-web-W2b-judge-metaeval-stats.md\">wave-2 W2b<\/a> · 계산 검증 <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/verify-kappa-paradox.md\">kappa<\/a> · <a href=\"../../../../.superloopy/evidence/research/20261119-misc-pr-review-agent-eval-study/verify-fbeta-and-grounded-example.md\">Fβ<\/a><\/li>\n<\/ul>\n<h2>이 장에서 답하는 질문<\/h2>\n<p>리뷰 에이전트 점수를 숫자 하나로 낼 때 무엇을 알아야 하나? 그 숫자는 어디서 왔고, 어떻게 틀릴 수 있나?<\/p>\n<hr />\n<h2>1. Precision · Recall · F-measure<\/h2>\n<h3>쉬운 설명<\/h3>\n<p>에이전트가 남긴 지적 하나하나를 세 칸으로 나눈다.<\/p>\n<ul>\n<li><strong>TP(맞은 지적)<\/strong>: 실제 문제를 짚었다<\/li>\n<li><strong>FP(틀린 지적)<\/strong>: 문제가 아닌데 짚었다 → 소음<\/li>\n<li><strong>FN(놓친 문제)<\/strong>: 실제 문제인데 말하지 않았다<\/li>\n<\/ul>\n<pre><code>Precision(정밀도) = TP / (TP + FP)   &quot;떠든 말 중 맞은 비율&quot;\nRecall(재현율)    = TP / (TP + FN)   &quot;실제 문제 중 찾은 비율&quot;\nFβ = (1+β²)·P·R / (β²·P + R)         &quot;둘을 하나로 합친 값&quot;\n<\/code><\/pre>\n<h3>β의 원래 뜻 — 원전에서<\/h3>\n<p>F 척도는 van Rijsbergen의 1979년 책 <em>Information Retrieval<\/em> 7장에서 나왔다. 원래 이름은 <strong>E(효과성) 척도<\/strong>이고, F = 1 − E다. 원문은 β를 이렇게 정의한다.<\/p>\n<blockquote>\n<p>\"a user who attaches β times as much importance to recall as precision\"<\/p>\n<\/blockquote>\n<p>즉 <strong>β는 \"recall을 precision보다 몇 배 중요하게 보는 사용자인가\"<\/strong>다. β=1이면 같게, β=2면 recall을 2배, β=0.5면 precision을 2배 중요하게 본다.<\/p>\n<h3>예시 — β에 따라 순위가 뒤집힌다 (코드로 재계산함)<\/h3>\n<table>\n<thead>\n<tr>\n<th>에이전트<\/th>\n<th>P<\/th>\n<th>R<\/th>\n<th>F0.5<\/th>\n<th>F1<\/th>\n<th>F2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A(과묵형)<\/td>\n<td>0.90<\/td>\n<td>0.30<\/td>\n<td><strong>0.643<\/strong><\/td>\n<td>0.450<\/td>\n<td>0.346<\/td>\n<\/tr>\n<tr>\n<td>B(수다형)<\/td>\n<td>0.50<\/td>\n<td>0.70<\/td>\n<td>0.530<\/td>\n<td><strong>0.583<\/strong><\/td>\n<td><strong>0.648<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>β가 약 <strong>0.68<\/strong>보다 작으면 A가, 크면 B가 이긴다. 그래서 <strong>β를 고르는 순간 \"어떤 리뷰어를 원하는가\"를 정한 셈<\/strong>이 된다.<\/p>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:600px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 360\" role=\"img\" aria-label=\"β에 따른 F 점수\" data-minw=\"600\"><title>β에 따른 F 점수<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"720\" height=\"360\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">β를 바꾸면 &#x27;더 나은 에이전트&#x27;가 바뀐다<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">A: 과묵형 P 0.9 · R 0.3   B: 수다형 P 0.5 · R 0.7   (코드로 재계산: verify-fbeta)<\/text><line class=\"grid\" x1=\"70\" y1=\"300.0\" x2=\"600\" y2=\"300.0\"/><text x=\"62.0\" y=\"304.0\" class=\"t-mut\" text-anchor=\"end\">0.0<\/text><line class=\"grid\" x1=\"70\" y1=\"244.0\" x2=\"600\" y2=\"244.0\"/><text x=\"62.0\" y=\"248.0\" class=\"t-mut\" text-anchor=\"end\">0.2<\/text><line class=\"grid\" x1=\"70\" y1=\"188.0\" x2=\"600\" y2=\"188.0\"/><text x=\"62.0\" y=\"192.0\" class=\"t-mut\" text-anchor=\"end\">0.4<\/text><line class=\"grid\" x1=\"70\" y1=\"132.0\" x2=\"600\" y2=\"132.0\"/><text x=\"62.0\" y=\"136.0\" class=\"t-mut\" text-anchor=\"end\">0.6<\/text><line class=\"grid\" x1=\"70\" y1=\"76.0\" x2=\"600\" y2=\"76.0\"/><text x=\"62.0\" y=\"80.0\" class=\"t-mut\" text-anchor=\"end\">0.8<\/text><text x=\"70.0\" y=\"318.0\" class=\"t-mut\" text-anchor=\"middle\">β=0.25<\/text><text x=\"202.5\" y=\"318.0\" class=\"t-mut\" text-anchor=\"middle\">β=0.5<\/text><text x=\"335.0\" y=\"318.0\" class=\"t-mut\" text-anchor=\"middle\">β=1<\/text><text x=\"467.5\" y=\"318.0\" class=\"t-mut\" text-anchor=\"middle\">β=2<\/text><text x=\"600.0\" y=\"318.0\" class=\"t-mut\" text-anchor=\"middle\">β=4<\/text><text x=\"70.0\" y=\"340.0\" class=\"t-mut\">← precision 중시<\/text><text x=\"600.0\" y=\"340.0\" class=\"t-mut\" text-anchor=\"end\">recall 중시 →<\/text><line class=\"ref\" x1=\"262.1\" y1=\"70\" x2=\"262.1\" y2=\"300\"/><text x=\"268.1\" y=\"80.0\" class=\"t-sm\">β≈0.68에서 순위 역전<\/text><path class=\"s-d1\" d=\"M70.0,74.5 L74.4,75.6 L78.8,76.7 L83.2,77.8 L87.7,78.9 L92.1,80.1 L96.5,81.3 L100.9,82.6 L105.3,83.9 L109.8,85.2 L114.2,86.5 L118.6,87.9 L123.0,89.3 L127.4,90.8 L131.8,92.3 L136.2,93.8 L140.7,95.4 L145.1,97.0 L149.5,98.6 L153.9,100.2 L158.3,101.9 L162.8,103.6 L167.2,105.3 L171.6,107.1 L176.0,108.9 L180.4,110.7 L184.8,112.5 L189.2,114.4 L193.7,116.2 L198.1,118.1 L202.5,120.0 L206.9,121.9 L211.3,123.8 L215.8,125.8 L220.2,127.7 L224.6,129.6 L229.0,131.6 L233.4,133.5 L237.8,135.4 L242.2,137.4 L246.7,139.3 L251.1,141.2 L255.5,143.1 L259.9,145.0 L264.3,146.9 L268.8,148.8 L273.2,150.7 L277.6,152.5 L282.0,154.3 L286.4,156.1 L290.8,157.9 L295.2,159.6 L299.7,161.3 L304.1,163.0 L308.5,164.7 L312.9,166.3 L317.3,167.9 L321.8,169.5 L326.2,171.0 L330.6,172.5 L335.0,174.0 L339.4,175.4 L343.8,176.  순위가 β≈0.68에서 뒤집힌다 (verify-fbeta로 재계산)<\/figcaption><\/figure>\n<div class=\"widget\" data-widget=\"fbeta\"><\/div>\n\n<h3>F 척도에 대한 비판 (알고 쓰기)<\/h3>\n<table>\n<thead>\n<tr>\n<th>비판<\/th>\n<th>출처<\/th>\n<th>내용<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>참음성(TN)을 무시한다<\/td>\n<td>Powers 2011<\/td>\n<td>\"문제가 없는 곳에서 조용히 있었다\"는 F에 반영되지 않는다. 리뷰에서는 \"문제없는 PR에 코멘트를 안 단 것\"이 이에 해당한다<\/td>\n<\/tr>\n<tr>\n<td>가중치가 측정 대상에 따라 달라진다<\/td>\n<td>Hand &amp; Christen 2018 · Christen, Hand, Kirielle 2023 (ACM Computing Surveys)<\/td>\n<td>F는 P와 R의 가중 평균처럼 보이지만, 그 가중치가 평가받는 시스템에 따라 바뀐다. 저자들의 권고: (1) 한쪽 오류가 정말 무관할 때만 F를 쓴다 (2) <strong>P와 R을 반드시 함께 보고<\/strong>한다 (3) 해석이 필요하면 F* = TP/(TP+FP+FN)(자카드 계수와 같다)을 쓴다<\/td>\n<\/tr>\n<tr>\n<td>반론<\/td>\n<td>같은 논문<\/td>\n<td>리뷰 지적 매칭처럼 TN을 정의하기 어려운 과제에서는 F가 여전히 실용적이다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>precision 정의가 연구마다 다르다<\/h3>\n<p><strong>같은 \"precision\"이라도 분자·분모가 다르면 수십 배 차이가 난다.<\/strong><\/p>\n<ul>\n<li>CR-Bench: precision = 버그 적중 / 전체 코멘트. \"버그는 아니지만 타당한 제안\"은 분모에만 들어가서 3~5%로 나온다.<\/li>\n<li>ReviewBench grounded precision: 정답지와 짝지어진 지적만 분모에 넣어서 80%대가 나올 수 있다.<\/li>\n<\/ul>\n<p>숫자를 비교하기 전에 정의부터 확인해야 한다. → 자세한 비교는 <a href=\"#05\">05장<\/a><\/p>\n<hr />\n<h2>2. 정적분석 도구 평가의 선례 — 가짜 문제를 심어 FP를 센다<\/h2>\n<p>리뷰 지적 평가와 구조가 비슷한 분야가 있다. 보안 정적분석 도구 평가다.<\/p>\n<ul>\n<li><strong>OWASP Benchmark<\/strong>: 테스트 케이스마다 진짜 취약점이 있거나, <strong>일부러 넣은 가짜(취약해 보이지만 안전한 코드)<\/strong>가 있다. 점수는 <strong>Youden 지수 = TPR − FPR<\/strong>을 0~100으로 바꾼 값이다. 예: TPR 0.98, FPR 0.05 → 93점. 무작위로 찍으면 약 0점이고, 음수도 나온다. 한계: \"실제 애플리케이션보다 상당히 단순하다\"고 스스로 적었다.<\/li>\n<li><strong>NIST Juliet<\/strong>: \"bad\" 함수에서 보고하면 TP, \"good\" 함수에서 보고하면 FP.<\/li>\n<\/ul>\n<blockquote>\n<p>시사점(중립): 실제 PR만으로는 \"문제없는 곳에서 조용히 있었나\"를 세기 어렵다. 일부러 만든 함정 케이스가 있으면 FP를 셀 수 있다. 대신 합성 코드는 실제 코드보다 단순하다.<\/p>\n<\/blockquote>\n<hr />\n<h2>3. 사람끼리(또는 사람과 LLM이) 얼마나 일치하나 — 일치도 지표<\/h2>\n<p>정답지 라벨을 사람이 붙이거나 LLM 채점관을 검증할 때 필요하다.<\/p>\n<h3>일치율만 보면 안 되는 이유<\/h3>\n<p>참이 90%인 데이터에서 \"전부 참\"이라고만 답해도 일치율은 90%다. 그래서 <strong>우연히 맞을 확률을 뺀<\/strong> 지표를 쓴다.<\/p>\n<table>\n<thead>\n<tr>\n<th>지표<\/th>\n<th>원전<\/th>\n<th>특징<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cohen's κ<\/strong><\/td>\n<td>Cohen 1960 (S2 인용 45,981)<\/td>\n<td>평가자 2명. κ = (관찰 일치 − 우연 일치)/(1 − 우연 일치)<\/td>\n<\/tr>\n<tr>\n<td><strong>Fleiss' κ<\/strong><\/td>\n<td>Fleiss 1971<\/td>\n<td>평가자 여러 명<\/td>\n<\/tr>\n<tr>\n<td><strong>Krippendorff's α<\/strong><\/td>\n<td>Krippendorff 2004 HCR (OA 3,863)<\/td>\n<td>평가자 수 제한 없음, 결측 허용, 척도 종류 무관<\/td>\n<\/tr>\n<tr>\n<td><strong>Gwet AC1<\/strong><\/td>\n<td>Gwet 2008<\/td>\n<td>κ 역설(아래)에 강하다는 대안. 원문은 확보하지 못해 2차 문헌(PMC 리뷰 2017)으로만 확인했고, 반론이 있다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>해석 기준표는 \"관례\"다<\/h3>\n<ul>\n<li><strong>Landis &amp; Koch 1977<\/strong>(S2 84,366): 0.61~0.80 \"상당한\", 0.81~1.00 \"거의 완벽\". 가장 널리 쓰이지만 원전을 직접 읽지는 못했다. 저자들도 구간이 주관적이라고 했다고 한다(2차 출처).<\/li>\n<li><strong>McHugh 2012<\/strong>: 이 기준이 의료 분야에는 \"너무 관대하다\"고 비판했다. 권고는 <strong>일치율과 κ를 둘 다 보고<\/strong>하라는 것이다. 예: 관찰 일치 0.94, κ 0.85 (95% 신뢰구간 0.78~0.92, N=222)<\/li>\n<li><strong>Krippendorff 2004 원문<\/strong>: \"α ≥ .800을 요구하고, 잠정적 결론이 허용되는 경우 α ≥ .667\"이라고 제안했다. 바로 이어서 <strong>\"there are no magical numbers\"<\/strong>라고 했고, 이 기준은 α에만 해당한다고 각주에 썼다. 그는 신뢰도 평가에 Cohen's κ와 일치율을 쓰지 말라고도 주장한다.<\/li>\n<\/ul>\n<h3>κ 역설 — 한쪽 라벨이 압도적이면 κ가 낮게 나온다 (코드로 재계산함)<\/h3>\n<p>관찰 일치가 둘 다 0.85인데 κ는 크게 다르다.<\/p>\n<table>\n<thead>\n<tr>\n<th>2×2 표 (예/예, 예/아니오, 아니오/예, 아니오/아니오)<\/th>\n<th>관찰 일치<\/th>\n<th>우연 일치<\/th>\n<th>κ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>균형 잡힌 경우 (40, 9, 6, 45)<\/td>\n<td>0.85<\/td>\n<td>0.50<\/td>\n<td><strong>0.70<\/strong><\/td>\n<\/tr>\n<tr>\n<td>한쪽으로 쏠린 경우 (80, 10, 5, 5)<\/td>\n<td>0.85<\/td>\n<td>0.78<\/td>\n<td><strong>0.32<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>리뷰와의 관계<\/strong>: PR의 대부분 줄은 \"문제없음\"이다. 리뷰 라벨링에서는 쏠린 경우가 보통이다. κ가 낮게 나왔을 때, 평가자들이 실제로 어긋난 것인지 분포가 쏠려서인지 구분해야 한다.<\/p>\n<figure class=\"figure\"><div class=\"figbox\"><svg class=\"fig inline\" style=\"min-width:600px\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 720 330\" role=\"img\" aria-label=\"카파 역설\" data-minw=\"600\"><title>카파 역설<\/title><rect class=\"bg\" x=\"0\" y=\"0\" width=\"720\" height=\"330\" rx=\"12\"/><text x=\"20.0\" y=\"28.0\" class=\"t-h\">관찰 일치가 같아도 κ는 반 토막 날 수 있다 (κ 역설)<\/text><text x=\"20.0\" y=\"46.0\" class=\"t-mut\">두 평가자가 100건을 &#x27;예/아니오&#x27;로 판정. 대각선이 일치, 나머지가 불일치 (verify-kappa로 재계산)<\/text><text x=\"40.0\" y=\"82.0\" class=\"t-b\">한쪽으로 쏠리지 않은 경우<\/text><text x=\"176.0\" y=\"98.0\" class=\"t-mut\" text-anchor=\"middle\">평가자 B<\/text><text x=\"143.0\" y=\"116.0\" class=\"t-mut\"><\/text><text x=\"143.0\" y=\"116.0\" class=\"t-mut\" text-anchor=\"middle\">예<\/text><text x=\"102.0\" y=\"161.0\" class=\"t-mut\" text-anchor=\"end\">예<\/text><text x=\"209.0\" y=\"116.0\" class=\"t-mut\" text-anchor=\"middle\">아니오<\/text><text x=\"102.0\" y=\"227.0\" class=\"t-mut\" text-anchor=\"end\">아니오<\/text><text x=\"40.0\" y=\"194.0\" class=\"t-mut\">평가자 A<\/text><g class=\"tip\"><title>일치 40건<\/title><rect x=\"111\" y=\"125\" width=\"64\" height=\"64\" rx=\"6\" class=\"f-d1\" fill-opacity=\"0.58\"/><text x=\"143.0\" y=\"162.0\" class=\"t-val\" text-anchor=\"middle\">40<\/text><\/g><g class=\"tip\"><title>불일치 9건<\/title><rect x=\"177\" y=\"125\" width=\"64\" height=\"64\" rx=\"6\" class=\"f-d2\" fill-opacity=\"0.27\"/><text x=\"209.0\" y=\"162.0\" class=\"t-val\" text-anchor=\"middle\">9<\/text><\/g><g class=\"tip\"><title>불일치 6건<\/title><rect x=\"111\" y=\"191\" width=\"64\" height=\"64\" rx=\"6\" class=\"f-d2\" fill-opacity=\"0.24\"/><text x=\"143.0\" y=\"228.0\" class=\"t-val\" text-anchor=\"middle\">6<\/text><\/g><g class=\"tip\"><title>일치 45건<\/title><rect x=\"177\" y=\"191\" width=\"64\" height=\"64\" rx=\"6\" class=\"f-d1\" fill-opacity=\"0.63\"/><text x=\"209.0\" y=\"228.0\" class=\"t-val\" text-anchor=\"middle\">45<\/text><\/g><text x=\"264.0\" y=\"148.0\" class=\"t-sm\">관찰 일치  0.85<\/text><text x=\"264.0\" y=\"172.0\" class=\"t-sm\">우연 일치  0.50<\/text><text x=\"264.0\" y=\"208.0\" class=\"t-b\">κ<\/text><text x=\"282.0\" y=\"208.0\" class=\"t-acc\" font-size=\"22\">0.70<\/text><text x=\"380.0\" y=\"82.0\" class=\"t-b\">대부분 &#x27;예&#x27;로 쏠린 경우<\/text><text x=\"516.0\" y=\"98.0\" class=\"t-mut\" text-anchor=\"middle\">평가자 B<\/text><text x=\"483.0\" y=\"116.0\" class=\"t-mut\"><\/text><text x=\"483.0\" y=\"116.0\" class=\"t-mut\" text-anchor=\"middle\">예<\/text><text x=\"442.0\" y=\"161.0\" class=\"t-mut\" text-anchor=\"end\">예<\/text><text x=\"549.0\" y=\"116.0\" class=\"t-mut\" text-anchor=\"middle\">아니오<\/text><text x=\"442.0\" y=\"227.0\" class=\"t-mut\" text-anchor=\"end\">아니오<\/text><text x=\"380.0\" y=\"194.0\" class=\"t-mut\">평가자 A<\/text><g class=\"tip\"><title>일치 80건<\/title><rect x=\"451\" y=\"125\" width=\"64\" height=\"64\" rx=\"6\" class=\"f-d1\" fill-opacity=\"0.98\"/><text x=\"483.0\" y=\"162.0\" class=\"t-val\" text-anchor=\"middle\">80<\/text><\/g><g class=\"tip\"><title>불일치 10건<\/title><rect x=\"517\" y=\"125\" width=\"64\" height=\"64\" rx=\"6\" class=\"f-d2\" fill-opacity=\"0.28\"/><text x=\"549.0\" y=\"162.0\" class=\"t-val\" text-anchor=\"middle\">10<\/text><\/g><g class=\"tip\"><title>불일치 5건<\/title><rect x=\"451\" y=\"191\" width=\"64\" height=\"64\" rx=\"6\" class=\"f-d2\" fill-opacity=\"0.23\"/><text x=\"483.0\" y=\"228.0\" class=\"t-val\" text-anchor=\"middle\">5<\/text><\/g><g class=\"tip\"><title>일치 5건<\/title><rect x=\"517\" y=\"191\" width=\"64\" height=\"64\" rx=\"6\" class=\"f-d1\" fill-opacity=\"0.23\"/><text x=\"549.0\" y=\"228.0\" class=\"t-val\" text-anchor=\"middle\">5<\/text><\/g><text x=\"604.0\" y=\"148.0\" class=\"t-sm\">관찰 일치  0.85<\/text><text x=\"604.0\" y=\"172.0\" class=\"t-sm\">우연 일치  0.78<\/text><text x=\"604.0\" y=\"208.0\" class=\"t-b\">κ<\/text><text x=\"622.0\" y=\"208.0\" class=\"t-acc\" font-size=\"22\">0.32<\/text><text x=\"20.0\" y=\"312.0\" class=\"t-mut\">PR의 대부분 줄은 &#x27;문제없음&#x27;이라 리뷰 라벨은 오른쪽 같은 쏠린 분포가 보통이다<\/text><\/svg><\/div><figcaption>그림 2-2. 관찰 일치 0.85가 같아도 κ는 0.70과 0.32 — 한쪽 라벨이 압도적이면 우연 일치가 커진다 (verify-kappa)<\/figcaption><\/figure>\n<div class=\"widget\" data-widget=\"kappa\"><\/div>\n\n<hr />\n<h2>4. 텍스트 유사도 지표(BLEU 등)가 리뷰 코멘트에 맞지 않는 이유<\/h2>\n<p>초기 리뷰 자동화 연구는 생성한 코멘트가 사람 코멘트와 단어가 얼마나 겹치는지(BLEU)로 채점했다.<\/p>\n<h3>BLEU를 쉽게 — 무엇을 세고, 왜 리뷰에서 무너지나<\/h3>\n<p><strong>BLEU(블루, 2002)<\/strong> 는 원래 <strong>기계 번역 채점용<\/strong>이다. 번역기가 낸 문장을 사람 번역(참조)과 비교해, <strong>겹치는 단어 조각이 얼마나 많은지<\/strong>를 0~1(논문에서는 보통 ×100 해서 0~100)로 낸다.<\/p>\n<p>계산은 대략 이렇다.<\/p>\n<ol>\n<li>기계 문장을 1단어, 2단어, 3단어, 4단어 묶음으로 자른다<\/li>\n<li>각 묶음이 참조 문장에도 있는지 세서, 크기별 \"겹친 비율\"을 낸다<\/li>\n<li>네 비율의 평균(기하평균)을 낸다. 하나라도 0에 가까우면 전체가 확 낮아진다<\/li>\n<li>기계 문장이 너무 짧으면 벌점을 준다(짧게 써서 겹친 비율만 높이는 꼼수 방지)<\/li>\n<\/ol>\n<p>논문에서 보는 <strong>BLEU-4<\/strong>는 4단어 묶음까지 본다는 뜻이다. 네 단어가 순서까지 똑같이 이어져야 점수가 붙으니, 표현이 조금만 달라도 점수가 낮다.<\/p>\n<p><strong>리뷰 코멘트에 대 보면 (설명용, 1단어 단위만 센 단순화)<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>코멘트<\/th>\n<th>정답과 겹친 단어<\/th>\n<th>1단어 겹침 비율<\/th>\n<th>실제로는<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>정답<\/td>\n<td>user가 null이면 getName()에서 예외가 난다<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>A<\/td>\n<td>조회 실패 시 예외가 발생할 수 있습니다<\/td>\n<td>예외가<\/td>\n<td>1/7 ≈ 0.14<\/td>\n<td><strong>같은 문제<\/strong>를 짚었다<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>user가 null이면 getName()에서 로그를 남긴다<\/td>\n<td>user가 · null이면 · getName()에서<\/td>\n<td>3/5 = 0.60<\/td>\n<td>엉뚱한 소리다<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>맞는 A가 낮고 틀린 B가 높다. BLEU는 <strong>뜻<\/strong>이 아니라 <strong>글자 모양<\/strong>을 보기 때문이다. 리뷰 코멘트에서 이 약점이 특히 커지는 이유는 셋이다.<\/p>\n<ul>\n<li><strong>같은 문제를 말하는 방법이 너무 많다<\/strong>: 번역은 원문이 있어서 답의 폭이 좁지만, 리뷰는 \"null 체크 빠짐\", \"NPE 가능\", \"조회 실패 처리 없음\"이 다 같은 지적이다<\/li>\n<li><strong>참조가 보통 하나뿐이다<\/strong>: 아래 원전의 경고처럼 참조가 적을수록 점수가 낮고 불안정하다<\/li>\n<li><strong>한국어는 더 불리하다<\/strong>: 띄어쓰기 단위로 자르면 \"예외가\"와 \"예외는\"이 서로 다른 단어로 세어진다<\/li>\n<\/ul>\n<p><strong>그런데 왜 아직도 논문에 나오나<\/strong>: 공짜이고, 자동이고, 예전 논문과 숫자를 나란히 비교할 수 있어서다. 그래서 최근 논문은 BLEU를 \"참고용\"으로 함께 적고, 실제 판단은 사람 평가나 임베딩 유사도(문장 뜻을 숫자 벡터로 바꿔 비교), <a href=\"#03\">LLM 채점관<\/a>으로 하는 경우가 많다. 코드 수정 과제에서 입력을 그대로 베껴도 BLEU 58.75가 나온 함정 사례는 <a href=\"#04\">04장<\/a>에 있다.<\/p>\n<h3>연구들이 보고한 것<\/h3>\n<ul>\n<li><strong>BLEU 원전(Papineni 2002)의 경고<\/strong>: 같은 번역가의 번역이 참조 번역 4개와 비교하면 0.3468, 2개와 비교하면 0.2571이었다. <strong>참조가 몇 개냐에 따라 점수가 달라진다.<\/strong> 리뷰 코멘트는 참조가 보통 1개다.<\/li>\n<li><strong>CodeReviewer(Microsoft, FSE 2022)<\/strong> 저자들 스스로: \"BLEU score … is not suitable for the review generation task\". 그래서 사람 평가(정보성 3.60, 관련성 3.20 / 5점)를 따로 했다.<\/li>\n<li><strong>Jiang 외 2025<\/strong>: BLEU와 사람 점수의 Spearman 상관 <strong>0.22<\/strong>. 임베딩 유사도 0.38, GPT-4o 채점 0.47.<\/li>\n<li><strong>CRScore(NAACL 2025)<\/strong>: BLEU ≈ 0, CRScore 0.54, GPT 채점 0.605.<\/li>\n<li><strong>왜 안 맞나<\/strong>: 같은 문제를 다른 말로 쓰면 점수가 낮다. 사람이 놓친 진짜 문제를 지적하면 오히려 감점된다(Tufano &amp; Bavota 2025 SLR).<\/li>\n<\/ul>\n<hr />\n<h2>5. 데이터 분할과 오염 — 시험 문제를 미리 본 셈이 되는 경우<\/h2>\n<h3>held-out(손대지 않은 시험지)<\/h3>\n<p>프롬프트를 고칠 때 본 데이터와 최종 점수를 낼 데이터를 나눈다. 머신러닝의 train/dev/test 분리와 같다.<\/p>\n<h3>시간 순서 분할<\/h3>\n<ul>\n<li><strong>D-ACT(SANER 2023)<\/strong>: 과거 변경으로 학습하고 미래 변경으로 시험하는 <strong>시간순 분할<\/strong>을 쓰자고 주장했다. 저자 공개 자료로 재확인해 보니, 시간을 무시하고 무작위로 나누면 점수가 크게 <strong>부풀려졌다<\/strong>(AutoTransform·Android에서 정답 350/1,835 vs 0/1,835). 논문의 \"57~94%\" 수치의 정확한 크기와 지표는 원문이 비공개라 확인하지 못했다.<\/li>\n<li><strong>Heumüller &amp; Ortmeier 2025 SLR<\/strong>: 리뷰 자동화 연구 24편 중 <strong>시간 편향을 다룬 것은 1편<\/strong>뿐이었다.<\/li>\n<\/ul>\n<h3>오염(contamination)<\/h3>\n<p>평가 데이터가 모델 학습 데이터에 들어가 점수가 부풀려지는 것.<\/p>\n<ul>\n<li><strong>Sainz 외 2023<\/strong>(S2 537): 가장 나쁜 오염은 테스트 분할로 학습하는 것이고, 오염은 과대평가를 낳는다.<\/li>\n<li><strong>LiveCodeBench<\/strong>(S2 2,691): 문제마다 공개 날짜를 붙이고, 모델의 학습 마감일 이후 문제로만 평가한다.<\/li>\n<li><strong>SWE-bench 사례<\/strong>(코드 수정 벤치마크지만 교훈이 같다):<ul>\n<li><strong>SWE-bench Verified(OpenAI 2024)<\/strong>: 개발자 93명이 1,699개를 검토해 68.3%를 걸러 내고 500개를 남겼다.<\/li>\n<li><strong>SWE-bench+(2024)<\/strong>: 성공 패치의 32.67%는 이슈 본문에 정답이 이미 있었다. 31.08%는 테스트가 약해서 통과했다.<\/li>\n<li><strong>OpenAI 2026-02<\/strong>: Verified 평가 자체를 <strong>중단<\/strong>했다. 미해결 138문항을 감사해 59.4%가 결함 있는 테스트였다. 테스트한 모든 최신 모델이 일부 문항의 정답 패치를 재현했다(오염). 벤치마크 제작사의 자체 감사이고, 대안으로 자사가 관여한 다른 벤치마크를 권했다는 점은 감안한다.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h2>6. 두 시스템을 비교할 때 — 오차 막대와 유의성<\/h2>\n<p>에이전트 A가 B보다 F1이 2점 높다. 정말 나은가, 우연인가?<\/p>\n<ul>\n<li><strong>Miller 2024 (Anthropic, \"Adding error bars to evals\")<\/strong> 권고 5가지:<ol>\n<li>중심극한정리 기반 표준오차를 보고한다<\/li>\n<li>문항이 묶음으로 있으면(같은 PR의 여러 지적처럼) <strong>군집 표준오차<\/strong>를 쓴다. 순진한 값보다 3배 넘게 클 수 있다<\/li>\n<li>같은 문항을 여러 번 돌려 분산을 줄인다<\/li>\n<li>두 모델을 비교할 때는 <strong>문항별 차이(짝지은 비교)<\/strong>를 쓴다<\/li>\n<li>검정력 분석으로, 그 평가가 질문에 답할 만큼 큰지 미리 본다<\/li>\n<\/ol>\n<\/li>\n<li><strong>Koehn 2004 짝지은 부트스트랩<\/strong>(OA 2,166): 테스트셋을 복원추출로 1,000번 다시 만들어, 95% 이상에서 이기면 유의하다고 본다. 다중 비교 보정은 없다.<\/li>\n<li><strong>Dror 외 2018<\/strong>(OA 841): ACL 2017 실험 논문 180편 중 유의성 검정을 한 논문은 63편이었다.<\/li>\n<li><strong>Mustahsan 외 2025<\/strong>: 에이전트 벤치마크 다수가 <strong>단일 실행<\/strong>으로 결과를 내고 신뢰구간이 없다. 반복 실행 일치도(ICC)는 구조화된 과제에서 8~16회, 복잡한 추론에서 32회 이상에서 안정된다(프리프린트).<\/li>\n<li><strong>pass@k(Chen 외 2021)<\/strong>: k번 시도 중 한 번이라도 맞을 확률. 편향 없는 추정식은 1 − C(n−c,k)/C(n,k)이고, 단순한 1 − (1−p̂)ᵏ은 편향된다.<\/li>\n<\/ul>\n<hr />\n<h2>문헌 카드<\/h2>\n<table>\n<thead>\n<tr>\n<th>문헌<\/th>\n<th>선정 근거<\/th>\n<th>등급<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>van Rijsbergen 1979 <em>Information Retrieval<\/em> 7장<\/td>\n<td><strong>원조<\/strong>. F(E) 척도와 β의 정의<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Powers 2011 · Hand &amp; Christen 2018 · Christen, Hand, Kirielle 2023 CSUR<\/td>\n<td>F 척도 비판의 대표 문헌. CSUR 리뷰 OA 382<\/td>\n<td>A·D<\/td>\n<\/tr>\n<tr>\n<td>Cohen 1960 · Fleiss 1971 · Landis &amp; Koch 1977<\/td>\n<td><strong>원조<\/strong>. 일치도 지표와 해석 기준<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>Krippendorff 2004 HCR<\/td>\n<td><strong>원조<\/strong> 저자가 직접 쓴 임계값과 단서<\/td>\n<td>A<\/td>\n<\/tr>\n<tr>\n<td>McHugh 2012 Biochemia Medica<\/td>\n<t
